      if (s === 43 || s === 48) return (isNoodle() ? ['noodle_a', 'noodle_b'] : ['chicken_a', 'chicken_b'])[k];
      if (s === 44) return isNoodle() ? 'noodle_big' : 'chicken_big';
      return ['boat_a', 'boat_b', 'dosan_a', 'dosan_b'][k];
