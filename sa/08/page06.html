    <link rel="stylesheet" href="../../css/common.css">
    <style>

           4판 오답은 기획서 20p 표기(식사 방법·내가 잘하는 일) 대신 조각·완성 화면(20·21p)의 '학교 방학 기간'·'친구 생일'을 씀 */

        .p06-bubble{left:92px;bottom:691px;width:480px;padding:26px 10px;font-size:40px}
        .p06-bubble::before{left:120px}
        .p06-character{left:140px;top:271px;width:258px;height:313px}

        .p06-next{position:absolute;left:1470px;top:440px}
    </style>
</head>
<body>

  <div id="viewport" class="viewport">

      </div>
    </div>
