<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조건 퍼즐 완성하기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 8차시 06p · 기획서 12~21p. sa/05 조건 퍼즐과 같은 구조. 퍼즐 4판, 판마다 정답 조각 4개 + 오답 2개(무작위 순서), 조각마다 아이콘(img/p06_icon_*.png).
           4판 오답은 기획서 20p 표기(식사 방법·내가 잘하는 일) 대신 조각·완성 화면(20·21p)의 '학교 방학 기간'·'친구 생일'을 씀 */

        .p06-bubble{left:92px;top:53px;bottom:auto;width:560px;min-height:219px;display:flex;align-items:center;justify-content:center;padding:20px 10px;font-size:46px}
        .p06-bubble::before{left:265px}
        .p06-character{left:125px;top:290px}

        .jig-piece .jig-label b img{display:block;width:60%;margin:0 auto 10px}

        .p06-next{position:absolute;left:1470px;top:440px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <p class="guide-bubble is-center p06-bubble" id="p06Bubble"></p>
          <div class="char-box p06-character"><img src="img/p06_character_1.png" onerror="this.onerror=null;this.src='../img/character/sa_main.png'" alt="메인 캐릭터"></div>

          <div class="jig-board"><div class="jig-grid" id="p06Grid"></div></div>

          <div class="jig-tray-label">조건 퍼즐 조각</div>
          <div class="jig-tray" id="p06Tray"></div>

          <a href="javascript:;" class="js-sfx jig-next is-off p06-next" id="p06Next" data-sound="sound/click.mp3">
            <img src="../../img/common/btn_next_content.png" class="js-img-swap" data-src-alt="../../img/common/btn_next_content_on.png" data-src-over="../../img/common/btn_next_content_over.png" alt="다음">
          </a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="조건 퍼즐 완성하기" data-next="page07.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>

        pieces: [

</html>
