<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인기 여행지 카드 짝 맞추기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 8차시 03p · 기획서 9p 카드 짝 맞추기 마무리(도장 3개). 도장은 page02와 같은 img/p02_stamp.png, 캐릭터 img/p03_character.png(없으면 공용 로봇) */

        .p03-character{left:0;bottom:0;z-index:1}

        .p03-panel{position:absolute;left:663px;top:60px;width:1195px;height:854px;box-sizing:border-box;padding:34px 40px 40px;border:solid 16px var(--c-ink);border-radius:30px;box-shadow:0 0 0 4px var(--c-white);background:var(--c-white);
          display:flex;flex-direction:column;align-items:center}
        .p03-stamps{display:flex;gap:40px}
        .p03-stamp{width:230px;height:230px;border-radius:50%;background:url('img/p02_stamp.png') center / contain no-repeat;animation:p03-stamp .4s ease both}
        .p03-stamp:nth-child(2){animation-delay:.3s}
        .p03-stamp:nth-child(3){animation-delay:.6s}
        @keyframes p03-stamp{0%{transform:scale(2);opacity:0}100%{transform:none;opacity:1}}
        .p03-text{margin:40px 0 0;font-family:'Cafe24 Ssurround';font-size:68px;line-height:1.18;color:var(--c-ink);text-align:center;letter-spacing:-0.05em;word-break:keep-all}
        .p03-ask{margin:30px 0 0;font-family:'Cafe24 Ssurround';font-size:80px;line-height:1.2;color:#2a6bd0;text-align:center;letter-spacing:-0.05em;white-space:nowrap}
        /* .p03-next.card-btn{display:flex;align-items:center;justify-content:center;text-decoration:none;min-width:0;width:404px;height:125px;margin-top:auto;padding:8px 10px 0 calc(10px + .2em);font-size:68px;letter-spacing:.2em} */
        .p03-next.card-btn.is-start{right:33%}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="char-box p03-character"><img src="img/p03_character.png" onerror="this.onerror=null;this.src='../img/character/sa_main.png'" alt="메인 캐릭터"></div>
          <div class="p03-panel">
            <div class="p03-stamps"><span class="p03-stamp"></span><span class="p03-stamp"></span><span class="p03-stamp"></span></div>
            <p class="p03-text">사람들은 다양한 이유로<br>다른 지역을 방문한다는 사실!</p>
            <p class="p03-ask">우리는 어디로 여행을 떠나볼까요?</p>
            <a href="page04.html" class="js-nav-effect js-sfx card-btn next-btn is-start p03-next" data-sound="sound/click.mp3">다음</a>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="인기 여행지 카드 짝 맞추기" data-next="page04.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
