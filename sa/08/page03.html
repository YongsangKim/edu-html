<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인기 여행지 카드 짝 맞추기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 9p 카드 짝 맞추기 마무리(도장 3개). 도장은 page02와 같은 img/p02_stamp.png, 캐릭터는 임시로 sa/06 캐릭터 복사본 */

        .p03-character{left:150px;top:160px;width:520px;height:620px}

        .p03-panel{position:absolute;left:720px;top:110px;width:1000px;height:700px;box-sizing:border-box;padding:70px 60px 60px;border:solid 12px var(--c-ink);border-radius:30px;background:var(--c-white);
          display:flex;flex-direction:column;align-items:center;gap:50px}
        .p03-stamps{display:flex;gap:60px}
        .p03-stamp{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#ff6b6b url('img/p02_stamp.png') center / contain no-repeat;font-size:76px;color:var(--c-white);
          animation:p03-stamp .4s ease both}
        .p03-stamp:nth-child(2){animation-delay:.3s}
        .p03-stamp:nth-child(3){animation-delay:.6s}
        @keyframes p03-stamp{0%{transform:scale(2);opacity:0}100%{transform:none;opacity:1}}
        .p03-text{margin:0;font-family:'Cafe24 Ssurround';font-size:52px;line-height:1.4;color:var(--c-indigo);text-align:center;letter-spacing:-0.05em;word-break:keep-all}
        .p03-next.card-btn{display:flex;align-items:center;justify-content:center;text-decoration:none;min-width:0;width:300px;height:110px;margin-top:auto;padding:8px 10px 0;font-size:56px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="char-box p03-character"><img src="img/p_character_main.png" alt="메인 캐릭터"></div>
          <div class="p03-panel">
            <div class="p03-stamps"><span class="p03-stamp"></span><span class="p03-stamp"></span><span class="p03-stamp"></span></div>
            <p class="p03-text">사람들은 다양한 이유로<br>다른 지역을 방문한다는 사실!<br>우리는 어디로 여행을 떠나볼까요?</p>
            <a href="page04.html" class="js-nav-effect js-sfx card-btn p03-next" data-sound="sound/click.mp3">다음</a>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="인기 여행지 카드 짝 맞추기" data-next="page04.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
