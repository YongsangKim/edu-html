<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조건 퍼즐 완성하기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 11p 도입 화면, gwa/05 page10과 같은 구성: 리본 제목 + 안내 문장 + '게임 방법' 상자. 캐릭터는 임시로 sa/06 캐릭터 복사본 */
        main{position:absolute;left:0;top:120px;width:1920px;height:960px}
        .intro-panel.p-how-panel{justify-content:flex-start;gap:40px;padding:100px 60px 170px 70px}
        .intro-tab{top:-60px;letter-spacing:-0.08em}
        .p-how-lead{margin:0;font-size:52px;line-height:1.3;color:#1b1738;letter-spacing:-0.06em}
        .p-how{position:relative;margin:0;padding:40px;border:solid 5px #023187;border-radius:12px;background:#dff4fc}
        .p-how b{position:absolute;left:50%;top:-34px;transform:translateX(-50%);height:66px;padding:4px 50px 0;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;
          font-weight:normal;background:#023187;border-radius:33px;font-size:40px;color:#fff}
        .p-how .intro-list{font-size:42px;color:#023187}
        .p-how .intro-list li + li{margin-top:8px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="intro-character"><img src="img/p_character_intro.png" alt="메인 캐릭터"></div>
          <div class="intro-panel p-how-panel">
            <p class="intro-tab">조건 퍼즐 완성하기</p>
            <p class="p-how-lead">여행을 계획할 때,<br>생각해야 할 조건이 있어요.</p>
            <div class="p-how">
              <ol class="intro-list">
              <li>1. 제시된 여행 상황을 확인해요.</li>
              <li>2. 상황에 알맞은 조건 퍼즐 조각을 선택하여 퍼즐을 완성해요.</li>
            </ol>
            </div>
          </div>

          <a href="page06.html" class="js-nav-effect next-btn-activity">
            <img src="../../img/common/btn_start.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_start_on.png" data-src-over="../../img/common/btn_start_over.png" data-sound="sound/click.mp3" alt="시작하기">
          </a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="조건 퍼즐 완성하기" data-next="page06.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
