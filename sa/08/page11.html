<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀴즈 풀기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 74~76p. Q1·Q3 정답 2개 모두 고르기(4지), Q2 3지선다. 정답/오답 팝업은 공용 아바타 팝업(기능 V) */
        .p11-long .quiz-ask{font-size:58px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="quiz-stage">
          <div class="step-flow">

            <div class="step-panel p11-long">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q1.</span>
                  <p class="quiz-ask">사람들이 다른 지역으로 여행을 가는 이유에는<br>무엇이 있나요? 모두 골라보세요.</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-grid">
                <button class="answer-pick card-btn" data-correct="false">시험 공부</button>
                <button class="answer-pick card-btn" data-correct="true">문화 체험</button>
                <button class="answer-pick card-btn" data-correct="true">자연환경 감상</button>
                <button class="answer-pick card-btn" data-correct="false">운동 연습</button>
              </div>
            </div>

            <div class="step-panel p11-long">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q2.</span>
                  <p class="quiz-ask">네이버 지도에서 인기 장소 추천을 어떤 태도로<br>활용해야 할까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-list">
                <button class="answer-pick card-btn" data-correct="true">실제 장소 정보를 확인하고 결정한다.</button>
                <button class="answer-pick card-btn" data-correct="false">인기 장소로 추천된 이유를 믿고 무조건 선택한다.</button>
                <button class="answer-pick card-btn" data-correct="false">추천된 장소의 사진만 보고 결정한다.</button>
              </div>
            </div>

            <div class="step-panel p11-long">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q3.</span>
                  <p class="quiz-ask">네이버 지도에서 확인할 수 있는 정보는<br>무엇인가요? 모두 골라보세요.</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-grid" data-next="page12.html">
                <button class="answer-pick card-btn" data-correct="true">영업 시간</button>
                <button class="answer-pick card-btn" data-correct="false">여행의 목적</button>
                <button class="answer-pick card-btn" data-correct="false">함께 갈 사람</button>
                <button class="answer-pick card-btn" data-correct="true">장소 위치</button>
              </div>
            </div>

          </div>

          <div class="ox-result-correct is-avatar is-off" data-sound="sound/correct.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_correct.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">정답이에요!</p>
              </div>
              <div class="avatar-popup-extra"><img src="../../img/common/icon_correct.png" alt=""></div>
            </div>
          </div>
          <div class="ox-result-wrong is-avatar is-off" data-sound="sound/incorrect.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">다시 한번 생각해볼까요?</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="퀴즈 풀기" data-next="page12.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
