<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여행 정보를 찾아라!</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 8차시 13p(휴대폰 화면 제외) · 기획서 78~82p. 5문제, 한 문제마다 게이지 20%. 왼쪽 휴대폰 네이버 지도 화면 img/p13_q{1~5}.png, 보기 순서 무작위.
           틀리면 흔들림 + 휴대폰 화면 정답 부분 2초 강조(좌표는 화면 그림이 들어오면 맞춤), 다 맞히면 질문 상자에 '정답이에요!' 2초 뒤 다음 문제.
           Q3은 정답 2개 모두 고르기. Q5 보기는 버튼 그림 img/p13_q5_opt{1~4}.png(기획서에 보기 목록이 없어 opt1=별 모양 버튼만 정답으로 둠) */

        .p13-gauge{left:768px;top:45px;width:1050px}
        .p13-gauge.is-thin:before{left:-116px;top:-32px;width:166px;height:158px;background-image:url('img/p13_flag.png')}

        .p13-phone{left:80px}
        .p13-screen{background:var(--c-pale) center top / 100% 100% no-repeat}
        .p13-bg{position:absolute;background:#fff}
        .p13-tile{position:absolute;border-radius:12px;background:#e9eef6 center / cover no-repeat}
        .p13-hl{position:absolute;border-radius:14px;box-shadow:0 0 0 6px var(--c-pink),0 0 30px 10px rgba(255,79,249,.85);pointer-events:none;animation:p13-blink .5s ease infinite alternate}
        @keyframes p13-blink{to{opacity:.4}}

        .p13-ask{position:absolute;left:603px;top:140px;width:1254px;height:268px;margin:0;box-sizing:border-box;padding:20px 40px 10px;display:flex;align-items:center;justify-content:center;
          background:#dff4ff;border:solid 5px #0b3a8f;border-radius:12px;font-family:'Cafe24 Ssurround';font-size:62px;line-height:1.3;color:var(--c-ink);text-align:center;letter-spacing:-0.05em;word-break:keep-all}
        .p13-ask.is-ok{color:var(--c-purple);font-size:72px}
        .p13-opts{position:absolute;left:603px;top:437px;width:1254px;height:475px;box-sizing:border-box;padding:43px 34px 0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:180px;gap:35px 36px;align-content:start;background:#2a6bd0;border-radius:14px}
        .p13-opt.card-btn{min-width:0;width:100%;height:180px;padding:12px 20px 6px;font-size:54px;line-height:1.15;word-break:keep-all}
        .p13-opt.is-wrong{animation:fix-word-shake .3s ease}
        .p13-opt img{max-width:140px;max-height:130px;object-fit:contain;display:block;margin:0 auto;mix-blend-mode:multiply}
        .p13-opts.is-locked{pointer-events:none}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="gauge is-thin p13-gauge"><div class="gauge-fill" id="p13Fill"></div></div>
          <div class="phone-frame p13-phone"><div class="phone-screen p13-screen" id="p13Screen"><div id="p13Layer"></div><div id="p13Hl"></div></div></div>
          <p class="p13-ask" id="p13Ask"></p>
          <div class="p13-opts" id="p13Opts"></div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="여행 정보를 찾아라!" data-next="page14.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    // opts: [보기, 정답 여부], hl: 휴대폰 화면 안 강조 칸 [x%, y%, w%, h%] (실제 캡처 위치 기준)
    const QS = [
      { ask: '어느 곳으로 여행을 가나요?',
        opts: [['서울 국립중앙박물관', 1], ['부산 광안리 해수욕장'], ['안동 하회마을'], ['수원 화성']], hl: [[2, 52, 60, 5], [2, 62, 45, 4]] },
      { ask: '화요일에 놀러 가고 싶어요!<br>운영 시간은 언제 인가요?',
        opts: [['10:00~17:30'], ['휴관일'], ['09:30~17:30', 1], ['09:30~21:00']], hl: [[9, 50.4, 62, 3.6]] },
      { ask: '네이버 지도의 추천 경로를 모두 골라보세요!',
        opts: [['지하철 4호선', 1], ['지하철 6호선'], ['버스 502번', 1], ['버스 205번']], hl: [[2, 51.2, 96, 7.5], [20, 89.8, 72, 4]] },
      { ask: '국립중앙박물관의 주변에서<br>함께 볼 수 있는 명소가 아닌 것은 무엇인가요?',
        opts: [['국립중앙박물관거울못'], ['용산 가족공원'], ['행궁동 벽화마을', 1], ['용산공원 반환부지']], hl: [[2, 29.2, 96, 6.5], [2, 55.4, 96, 6.5], [2, 81.4, 96, 6.5]],
        tiles: [['a', 3.9, 37.1], ['b', 52.7, 37.1], ['c', 3.9, 62.9], ['d', 52.7, 62.9]] },
      { ask: '장소를 저장하려면<br>어떤 버튼을 선택해야 하나요?',
        opts: [[1, 1], [2], [3], [4]], img: true, hl: [[76.5, 52.2, 10, 4.8]] }
    ];

    const screen = $('p13Screen');
    const layer = $('p13Layer');
    const hlBox = $('p13Hl');
    const opts = $('p13Opts');
    const ask = $('p13Ask');
    let n = 0;
    let left = 0;
    let hlTimer = null;

    function hint() {
      clearTimeout(hlTimer);
      hlBox.innerHTML = '';
      QS[n].hl.forEach(([x, y, w, h]) => {
        const el = document.createElement('i');
        el.className = 'p13-hl';
        el.style.cssText = 'left:' + x + '%;top:' + y + '%;width:' + w + '%;height:' + h + '%';
        hlBox.appendChild(el);
      });
      hlTimer = setTimeout(() => { hlBox.innerHTML = ''; }, 2000);
    }

    function show() {
      const q = QS[n];
      clearTimeout(hlTimer);
      hlBox.innerHTML = '';
      layer.innerHTML = '';
      screen.style.backgroundImage = "url('img/p13_q" + (n + 1) + ".png')";
      if (q.tiles) {
        // 실제 사진이 비치지 않게 사진 줄을 흰색으로 덮고, 그 위에 임시 사진 자리를 얹음
        [36.5, 62.5].forEach((y) => {
          const bg = document.createElement('div');
          bg.className = 'p13-bg';
          bg.style.cssText = 'left:0;top:' + y + '%;width:100.2%;height:16.4%';
          layer.appendChild(bg);
        });
        q.tiles.forEach(([k, x, y]) => {
          const t = document.createElement('div');
          t.className = 'p13-tile';
          t.style.cssText = 'left:' + x + '%;top:' + y + '%;width:47.3%;height:15%;background-image:url(\'img/p13_ph_' + k + '.png\')';
          layer.appendChild(t);
        });
      }
      ask.innerHTML = q.ask;
      ask.classList.remove('is-ok');
      opts.innerHTML = '';
      opts.classList.remove('is-locked');
      left = q.opts.filter((o) => o[1]).length;
      shuffleArray(q.opts).forEach(([label, right]) => {
        const btn = document.createElement('button');
        btn.className = 'card-btn p13-opt';
        btn.innerHTML = q.img ? '<img src="img/p13_q5_opt' + label + '.png" alt="">' : label;
        btn.addEventListener('click', () => pick(btn, !!right));
        opts.appendChild(btn);
      });
    }

    function pick(btn, right) {
      if (btn.classList.contains('is-selected')) return;
      if (!right) {
        playWrong();
        btn.classList.remove('is-wrong');
        void btn.offsetWidth;
        btn.classList.add('is-wrong');
        hint();
        return;
      }
      btn.classList.add('is-selected');
      left -= 1;
      if (left > 0) { playClick(); return; }
      playCorrect();
      opts.classList.add('is-locked');
      ask.innerHTML = '정답이에요!';
      ask.classList.add('is-ok');
      n += 1;
      $('p13Fill').style.width = (n / QS.length * 100) + '%';
      setTimeout(() => {
        if (n >= QS.length) { navigateTo('page14.html'); return; }
        show();
      }, 2000);
    }

    show();
  })();
  </script>
</body>
</html>
