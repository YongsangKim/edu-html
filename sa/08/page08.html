<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여행 계획 순서 맞추기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 8차시 08p(휴대폰 화면 제외) · 기획서 23~30p. 여행 계획 카드 6장(순서 무작위) 중 지금 할 일을 차례로 고르기(6단계).
           맞으면 다음 단계, 틀리면 흔들림 + 정답 카드 2초 반짝임. 오른쪽 휴대폰은 1단계엔 빈 화면에 네이버 지도 아이콘(../../img/common/logo_navermap.png), 2단계부터 그 단계의 네이버 지도 화면(img/p08_map_{2~6}.png).
           다 끝나면 마무리 안내(캐릭터 + 다음) → 단계 순서 정리 + 'AI 추천 장소는 참고하고...' 안내(30p). ?step=7 마무리 안내, ?step=8 단계 순서 정리 */

        .p08-phone{left:1400px}
        .p08-screen{width:100%;height:100%;background:var(--c-white) url('../../img/common/logo_navermap.png') center / 220px 220px no-repeat}
        .p08-screen[style*=p08_map]{background-color:var(--c-pale);background-size:100% 100%}

        .p08-ask{position:absolute;left:75px;top:50px;width:1252px;height:360px;margin:0;box-sizing:border-box;padding:20px 40px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
          background:#dff4ff;border:solid 5px #0b3a8f;border-radius:14px;font-family:'Cafe24 Ssurround';font-size:70px;line-height:1.2;color:var(--c-ink);text-align:center;letter-spacing:-0.05em;word-break:keep-all}
        .p08-ask.is-q1{font-size:70px}
        .p08-ask.is-q2{font-size:50px}
        .p08-ask.is-q3{font-size:50px}
        .p08-ask.is-q4{font-size:50px}
        .p08-ask.is-q5{font-size:50px}
        .p08-ask.is-q6{font-size:50px}
        .p08-ask.is-end{font-size:50px}
        .p08-ok{display:block;margin-bottom:6px;font-size:72px;line-height:1.1;font-weight:normal;color:#2a6bd0}
        .p08-cards{position:absolute;left:75px;top:437px;width:1252px;height:475px;box-sizing:border-box;padding:45px 48px 0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:175px;gap:30px 25px;align-content:start;background:#2a6bd0;border-radius:14px}
        .p08-card.card-btn{min-width:0;width:100%;height:175px;padding:10px 12px 0;display:flex;align-items:center;justify-content:center;font-size:50px;line-height:1.15;word-break:keep-all}
        .p08-card.is-wrong{animation:fix-word-shake .3s ease}
        .p08-card.is-hint{box-shadow:0 0 0 8px var(--c-pink),0 0 40px 14px rgba(255,79,249,.8),0 13px 0 0 #a9a2ff;transform:scale(1.05);z-index:2}
        .p08-cards.is-locked{pointer-events:none}

        .p08-done{position:absolute;left:75px;top:437px;width:1252px;height:475px;box-sizing:border-box;overflow:hidden;background:#266cc8;border-radius:10px}
        .p08-done .next-btn.card-btn.is-start{position:absolute;right:34%;bottom:39%}

        .p08-final{position:absolute;left:57px;top:105px;width:1806px;height:802px;box-sizing:border-box;background:#f8f7fb;border:solid 6px var(--c-ink);border-radius:14px}
        .p08-final-title{position:absolute;left:335px;top:-70px;--rb-w:1135px;--rb-fs:70px;z-index:2;line-height:1.1;text-align:center}
        .p08-summary{position:absolute;left:42px;top:138px;width:1709px;height:473px;box-sizing:border-box;margin:0;padding:68px 63px 0;list-style:none;display:grid;grid-template-columns:repeat(3,493px);grid-auto-rows:140px;gap:51px 58px;align-content:start;background:#dff4fe;border:solid 5px #2a6bd0;border-radius:20px;counter-reset:s}
        .p08-summary li{position:relative;box-sizing:border-box;padding:10px 16px 0 64px;display:flex;align-items:center;justify-content:center;background:#1a3a99;border-radius:12px;box-shadow:0 8px 0 0 rgba(26,58,153,.28);
          font-family:'Cafe24 Ssurround';font-size:50px;line-height:1.1;color:var(--c-white);letter-spacing:-0.05em;word-break:keep-all;counter-increment:s}
        .p08-summary li:before{content:counter(s);position:absolute;left:-41px;top:27px;width:86px;height:86px;display:flex;align-items:center;justify-content:center;padding-top:6px;box-sizing:border-box;border-radius:50%;background:#8b78f0;color:var(--c-white);font-size:62px}
        .p08-final .is-start.next-btn.card-btn{right:40%}
        .p08-cards.is-off, .p08-done.is-off, .p08-final.is-off, .p08-phone.is-off, .p08-ask.is-off{display:none}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="phone-frame has-cam p08-phone"><div class="phone-screen p08-screen" id="p08Screen"></div></div>
          <p class="p08-ask" id="p08Ask"></p>
          <div class="p08-cards" id="p08Cards"></div>
          <div class="p08-done is-off" id="p08Done">
            <a href="javascript:;" class="js-nav-effect js-sfx card-btn is-start next-btn" id="p08Next1" data-sound="sound/click.mp3">다음</a>
          </div>
          <div class="p08-final is-off" id="p08Final">
            <p class="ribbon is-hero p08-final-title">AI 추천 장소는 참고하고,<br>실제 여행 정보는 다시 확인해야 해요!</p>
            <ol class="p08-summary" id="p08Summary">
              <li>여행 지역 검색</li><li>인기 장소 확인</li><li>장소 정보 살펴보기</li>
              <li>예약 가능 여부 확인</li><li>이동 코스 확인</li><li>장소 저장하기</li>
            </ol>
            <a href="page09.html" class="js-nav-effect js-sfx card-btn next-btn is-start" id="p08Next" data-sound="sound/click.mp3">다음</a>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="여행 계획 순서 맞추기" data-next="page09.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const CARDS = {
      search: '여행 지역 검색',
      popular: '인기 장소 확인',
      info: '장소 정보 살펴보기',
      reserve: '예약 가능 여부 확인',
      route: '이동 코스 확인',
      save: '장소 저장하기'
    };
    const STEPS = [
      { answer: 'search', cls: 'is-q1', ask: '‘전주’로 여행을 갈 거예요!<br>가장 먼저 무엇을 해야 할까요?' },
      { answer: 'popular', cls: 'is-q2', ask: '맞아요! 먼저 네이버 지도에서 여행 지역을 검색했어요.<br>이제 사람들이 많이 찾는 곳을 알아보고,<br>여행할 장소를 골라봐요. 무엇을 해야 할까요?' },
      { answer: 'info', cls: 'is-q3', ask: '좋아요! 네이버 지도에서 가고 싶은 장소를 골랐어요.<br>이 장소가 언제 문을 여는지, 어디에 있는지,<br>사람들이 어떻게 다녀왔는지 자세히 알아보려고 해요.<br>무엇을 해야 할까요?' },
      { answer: 'reserve', cls: 'is-q4', ask: '맞아요! 네이버 지도에서 가고 싶은 식당을 골랐어요.<br>이곳은 사람들이 많이 찾는 식당이에요.<br>원하는 시간에 식사하려면 무엇을 해야 할까요?' },
      { answer: 'route', cls: 'is-q5', ask: '좋아요! 내가 원하는 시간대에 방문하기 위해 예약도 완료했어요.<br>이제 그 장소까지 어떻게 가야 하는지,<br>어떤 교통수단을 이용할 수 있는지, 시간은 얼마나 걸리는지 알아보려고 해요. 무엇을 해야 할까요?' },
      { answer: 'save', cls: 'is-q6', ask: '맞아요! 가고 싶은 장소를 정했다면 출발지에서<br>어떻게 가야 하는지 확인하는 것도 필수예요.<br>이 장소를 나중에 다시 볼 수 있도록<br>내 지도에 표시해 두려고 해요. 무엇을 해야 할까요?' }
    ];

    const box = $('p08Cards');
    const headed = (t) => t.replace(/^(맞아요!|좋아요!)s*/, '<b class="p08-ok">$1</b>');
    let step = 0;

    function show() {
      const s = STEPS[step];
      $('p08Ask').className = 'p08-ask ' + s.cls;
      $('p08Ask').innerHTML = headed(s.ask);
      $('p08Screen').style.backgroundImage = step ? "url('img/p08_map_" + (step + 1) + ".png')" : '';
      box.innerHTML = '';
      box.classList.remove('is-locked');
      shuffleArray(Object.keys(CARDS)).forEach((key) => {
        const btn = document.createElement('button');
        btn.className = 'card-btn p08-card';
        btn.dataset.key = key;
        btn.innerHTML = CARDS[key];
        btn.addEventListener('click', () => pick(btn, key === s.answer));
        box.appendChild(btn);
      });
    }

    function finish() {
      $('p08Screen').style.backgroundImage = "url('img/p08_map_7.png')";
      $('p08Ask').className = 'p08-ask is-end';
      $('p08Ask').innerHTML = headed('좋아요! 네이버 지도의 저장하기 기능을 사용해서<br>여행 계획을 마무리해요!');
      box.classList.add('is-off');
      $('p08Done').classList.remove('is-off');
    }

    function summary() {
      document.querySelector('.p08-phone').classList.add('is-off');
      $('p08Ask').classList.add('is-off');
      $('p08Done').classList.add('is-off');
      $('p08Final').classList.remove('is-off');
    }
    $('p08Next1').addEventListener('click', () => setTimeout(summary, 300));

    function pick(btn, right) {
      if (!right) {
        playWrong();
        btn.classList.remove('is-wrong');
        void btn.offsetWidth;
        btn.classList.add('is-wrong');
        const hint = box.querySelector('[data-key="' + STEPS[step].answer + '"]');
        hint.classList.add('is-hint');
        setTimeout(() => hint.classList.remove('is-hint'), 2000);
        return;
      }
      playCorrect();
      btn.classList.add('is-selected');
      box.classList.add('is-locked');
      setTimeout(() => {
        step += 1;
        if (step < STEPS.length) { show(); return; }
        finish();
      }, 1000);
    }

    // ?step=N : 1~6 질문 단계 · 7 마무리 안내 · 8 단계 순서 정리
    const wantStep = parseInt(new URLSearchParams(location.search).get('step'), 10);
    if (wantStep >= 7) { finish(); if (wantStep >= 8) summary(); }
    else { step = wantStep >= 1 ? wantStep - 1 : 0; show(); }
  })();
  </script>
</body>
</html>
