<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여행 계획 순서 맞추기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 23~30p. 여행 계획 카드 6장(순서 무작위) 중 지금 할 일을 차례로 고르기(6단계).
           맞으면 다음 단계, 틀리면 흔들림 + 정답 카드 2초 반짝임. 오른쪽 휴대폰은 1단계엔 빈 화면에 네이버 지도 아이콘(img/p08_naver_map.png), 2단계부터 그 단계의 네이버 지도 화면(img/p08_map_{2~6}.png).
           다 끝나면 단계 순서 정리 + 'AI 추천 장소는 참고하고...' 안내(30p) */

        .p08-phone{left:1398px;top:30px;width:434px;height:900px;padding:16px;border-radius:64px}
        .p08-screen{width:100%;height:100%;border-radius:50px;background:var(--c-white) url('img/p08_naver_map.png') center / 220px 220px no-repeat}
        .p08-screen[style*=p08_map]{background-color:var(--c-pale);background-size:100% 100%}

        .p08-ask{position:absolute;left:60px;top:40px;width:1260px;min-height:230px;margin:0;box-sizing:border-box;padding:30px 40px;display:flex;align-items:center;justify-content:center;
          background:var(--c-white);border:solid 5px var(--c-ink);border-radius:40px;box-shadow:0 10px 0 0 var(--c-sky-pale);font-family:'Cafe24 Ssurround';font-size:42px;line-height:1.35;color:var(--c-ink);text-align:center;letter-spacing:-0.05em;word-break:keep-all;text-wrap:balance}
        .p08-ask.is-ok{color:#1f9d4c}
        .p08-cards{position:absolute;left:60px;top:420px;width:1260px;display:grid;grid-template-columns:repeat(3,1fr);gap:40px 34px}
        .p08-card.card-btn{min-width:0;width:100%;height:180px;padding:10px 16px 0;display:flex;align-items:center;justify-content:center;font-size:48px;line-height:1.15;word-break:keep-all}
        .p08-card.is-wrong{animation:fix-word-shake .3s ease}
        .p08-card.is-hint{box-shadow:0 0 0 8px var(--c-yellow),0 0 40px 14px rgba(255,216,61,.8),0 13px 0 0 #a9a2ff;transform:scale(1.05)}
        .p08-cards.is-locked{pointer-events:none}

        .p08-summary{position:absolute;left:60px;top:420px;width:1260px;margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;counter-reset:s}
        .p08-summary li{height:150px;box-sizing:border-box;padding:12px 16px 4px;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--c-white);border:solid 5px var(--c-purple);border-radius:24px;
          font-family:'Cafe24 Ssurround';font-size:38px;line-height:1.15;color:var(--c-indigo);letter-spacing:-0.05em;word-break:keep-all;counter-increment:s}
        .p08-summary li:before{content:counter(s);flex:0 0 56px;height:56px;display:flex;align-items:center;justify-content:center;padding-top:4px;box-sizing:border-box;border-radius:50%;background:var(--c-purple);color:var(--c-white);font-size:34px}
        .p08-summary.is-off, .p08-next.card-btn.is-off, .p08-cards.is-off{display:none}
        .p08-next.card-btn{right:600px;display:flex;align-items:center;justify-content:center;text-decoration:none;min-width:0;width:300px;height:110px;margin-bottom:20px;padding:8px 10px 0;font-size:56px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="phone-frame p08-phone"><div class="p08-screen" id="p08Screen"></div></div>
          <p class="p08-ask" id="p08Ask"></p>
          <div class="p08-cards" id="p08Cards"></div>
          <ol class="p08-summary is-off" id="p08Summary">
            <li>여행 지역 검색</li><li>인기 장소 확인</li><li>장소 정보 살펴보기</li>
            <li>예약 가능 여부 확인</li><li>이동 코스 확인</li><li>장소 저장하기</li>
          </ol>
          <a href="page09.html" class="js-nav-effect js-sfx card-btn next-btn p08-next is-off" id="p08Next" data-sound="sound/click.mp3">다음</a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="여행 계획 순서 맞추기" data-next="page09.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const CARDS = {
      search: '여행 지역 검색',
      popular: '인기 장소 확인',
      info: '장소 정보 살펴보기',
      reserve: '예약 가능 여부 확인',
      route: '이동 코스 확인',
      save: '장소 저장하기'
    };
    const STEPS = [
      { answer: 'search', ask: '‘전주’로 여행을 갈 거예요!<br>가장 먼저 무엇을 해야 할까요?' },
      { answer: 'popular', ask: '맞아요! 먼저 네이버 지도에서 여행 지역을 검색했어요.<br>이제 사람들이 많이 찾는 곳을 알아보고,<br>여행할 장소를 골라봐요. 무엇을 해야 할까요?' },
      { answer: 'info', ask: '좋아요! 네이버 지도에서 가고 싶은 장소를 골랐어요.<br>이 장소가 언제 문을 여는지, 어디에 있는지,<br>사람들이 어떻게 다녀왔는지 자세히 알아보려고 해요.<br>무엇을 해야 할까요?' },
      { answer: 'reserve', ask: '맞아요! 네이버 지도에서 가고 싶은 식당을 골랐어요.<br>이곳은 사람들이 많이 찾는 식당이에요.<br>원하는 시간에 식사하려면 무엇을 해야 할까요?' },
      { answer: 'route', ask: '좋아요! 내가 원하는 시간대에 방문하기 위해 예약도 완료했어요.<br>이제 그 장소까지 어떻게 가야 하는지,<br>어떤 교통수단을 이용할 수 있는지, 시간은 얼마나 걸리는지<br>알아보려고 해요. 무엇을 해야 할까요?' },
      { answer: 'save', ask: '맞아요! 가고 싶은 장소를 정했다면 출발지에서<br>어떻게 가야 하는지 확인하는 것도 필수예요.<br>이 장소를 나중에 다시 볼 수 있도록<br>내 지도에 표시해 두려고 해요. 무엇을 해야 할까요?' }
    ];

    const box = $('p08Cards');
    let step = 0;

    function show() {
      const s = STEPS[step];
      $('p08Ask').innerHTML = s.ask;
      $('p08Screen').style.backgroundImage = step ? "url('img/p08_map_" + (step + 1) + ".png')" : '';
      box.innerHTML = '';
      box.classList.remove('is-locked');
      shuffleArray(Object.keys(CARDS)).forEach((key) => {
        const btn = document.createElement('button');
        btn.className = 'card-btn p08-card';
        btn.dataset.key = key;
        btn.innerHTML = CARDS[key];
        btn.addEventListener('click', () => pick(btn, key === s.answer));
        box.appendChild(btn);
      });
    }

    function pick(btn, right) {
      if (!right) {
        playWrong();
        btn.classList.remove('is-wrong');
        void btn.offsetWidth;
        btn.classList.add('is-wrong');
        const hint = box.querySelector('[data-key="' + STEPS[step].answer + '"]');
        hint.classList.add('is-hint');
        setTimeout(() => hint.classList.remove('is-hint'), 2000);
        return;
      }
      playCorrect();
      btn.classList.add('is-selected');
      box.classList.add('is-locked');
      setTimeout(() => {
        step += 1;
        if (step < STEPS.length) { show(); return; }
        $('p08Screen').style.backgroundImage = "url('img/p08_map_7.png')";
        $('p08Ask').innerHTML = '좋아요! 네이버 지도의 저장하기 기능을 사용해서<br>여행 계획을 마무리해요!<br>AI 추천 장소는 참고하고, 실제 여행 정보는 다시 확인해야 해요!';
        box.classList.add('is-off');
        $('p08Summary').classList.remove('is-off');
        $('p08Next').classList.remove('is-off');
      }, 1000);
    }

    show();
  })();
  </script>
</body>
</html>
