<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 미래 모습 만들기</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        /* 폰 틀은 공용 .phone-frame, 검은 사진 보기 화면은 CSS. 안내 로봇 공용 sa/img/character/sa_wink_present.png(.guide-set). 폰 속 사진은 page12에서 고른 결과 */
        .p13-retry{position:absolute;left:1450px;top:640px}
        .p13-decide{position:absolute;left:1450px;top:800px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="guide-set is-wink-present">
            <p class="guide-bubble is-center is-medium">이 이미지로 결정할까요?<br>아니면 다시 시도해볼까요?</p>
            <div class="guide-character"><img src="../img/character/sa_wink_present.png" alt=""></div>
          </div>
          <div class="phone-frame has-cam">
            <div class="phone-screen is-dark">
              <div class="phone-status" data-time="6:31"></div>
              <div class="phone-view-top">
                <span class="phone-view-round is-close"><i data-ic="x"></i></span>
                <span class="phone-view-round is-more"><i data-ic="dotsV"></i></span>
                <span class="phone-view-round is-save"><i data-ic="download"></i></span>
                <span class="phone-view-share">공유</span>
              </div>
              <img class="phone-view-photo is-off" id="p13Photo" alt="나의 미래 모습">
              <div class="phone-view-tools">
                <span class="phone-view-tool"><i><i data-ic="penSlant"></i></i>편집</span>
                <span class="phone-view-tool"><i><i data-ic="chatPlus"></i></i>댓글</span>
                <span class="phone-view-tool"><i><i data-ic="boxArrow"></i></i>크기 조정</span>
                <span class="phone-view-tool"><i><i data-ic="pill"></i></i>제거</span>
              </div>
            </div>
          </div>
          <!-- 화면(기획서 28p): 생성된 이미지 확인.
               다시하기 = 공통 버튼(img/common/btn_retry) 재사용, page12(빌더 처음)로
               결정하기 = 이 페이지 전용 3단 이미지(기본/on/오버), 다음 화면으로
               TODO: 실제로 어디로 가야 할지 확인 필요(현재는 임시 추정값) -->
          <a href="page10.html?step=3" class="js-nav-effect p13-retry">
            <img src="../../resources/img/common/btn_retry.png" class="js-img-swap js-sfx" data-src-alt="../../resources/img/common/btn_retry_on.png" data-src-over="../../resources/img/common/btn_retry_over.png" data-sound="sound/click.mp3" alt="다시하기">
          </a>
          <a href="page12.html" class="js-nav-effect p13-decide">
            <img src="img/p13_btn_decide.png" class="js-img-swap js-sfx" data-src-alt="img/p13_btn_decide_on.png" data-src-over="img/p13_btn_decide_over.png" data-sound="sound/click.mp3" alt="결정하기">
          </a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="나의 미래 모습 만들기" data-next="page12.html"></script>
  <script src="../../resources/js/toc.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  (function () {
    let job = 'store';
    let gender = 'm';
    try { job = sessionStorage.getItem('sa01_job') || job; gender = sessionStorage.getItem('sa01_gender') || gender; } catch (e) {}
    const photo = document.getElementById('p13Photo');
    photo.onload = function () { photo.classList.remove('is-off'); };
    photo.src = 'img/p15_result_' + job + '_' + gender + '.png';
  })();
  </script>
</body>
</html>
