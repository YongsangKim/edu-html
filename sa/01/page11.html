<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 미래 모습 만들기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 폰 틀은 공용 .phone-frame, 검은 사진 보기 화면은 CSS. 안내 로봇 공용 sa/img/sa_wink_present.png(.guide-set). 폰 속 사진은 page12에서 고른 결과 */
        .p13-retry{position:absolute;left:1450px;top:640px}
        .p13-decide{position:absolute;left:1450px;top:800px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="guide-set is-wink-present">
            <p class="guide-bubble is-center is-medium">이 이미지로 결정할까요?<br>아니면 다시 시도해볼까요?</p>
            <div class="guide-character"><img src="../img/sa_wink_present.png" alt=""></div>
          </div>
          <div class="phone-frame has-cam">
            <div class="phone-screen is-dark">
              <div class="phone-status" data-time="6:31"></div>
              <div class="phone-view-top">
                <span class="phone-view-round is-close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
                <span class="phone-view-round is-more"><svg viewBox="0 0 24 24"><path d="M12 6h.01M12 12h.01M12 18h.01" stroke-width="3"/></svg></span>
                <span class="phone-view-round is-save"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></span>
                <span class="phone-view-share">공유</span>
              </div>
              <img class="phone-view-photo is-off" id="p13Photo" alt="나의 미래 모습">
              <div class="phone-view-tools">
                <span class="phone-view-tool"><i><svg viewBox="0 0 24 24"><path d="M5 19l.9-3.6L15.6 5.7a2 2 0 012.8 0l-.1.1 0 0 .9.9a2 2 0 010 2.8L9.5 19.1z"/><path d="M13.8 7.6l3.6 3.6"/></svg></i>편집</span>
                <span class="phone-view-tool"><i><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 100 16 8 8 0 003.6-.9l3.6.9-1.1-3.4A8 8 0 0012 4z"/><path d="M12 8.6v6M9 11.6h6"/></svg></i>댓글</span>
                <span class="phone-view-tool"><i><svg viewBox="0 0 24 24"><rect x="3.8" y="5.5" width="16.4" height="13" rx="2.4"/><path d="M10.5 18.5v-3.6a1.6 1.6 0 011.6-1.6h8.1"/></svg></i>크기 조정</span>
                <span class="phone-view-tool"><i><svg viewBox="0 0 24 24"><g transform="rotate(-45 12 12)"><rect x="4.2" y="7.6" width="15.6" height="8.8" rx="2.8"/><path d="M9.4 7.6v8.8"/></g></svg></i>제거</span>
              </div>
            </div>
          </div>
          <!-- 화면(기획서 28p): 생성된 이미지 확인.
               다시하기 = 공통 버튼(img/common/btn_retry) 재사용, page12(빌더 처음)로
               결정하기 = 이 페이지 전용 3단 이미지(기본/on/오버), 다음 화면으로
               TODO: 실제로 어디로 가야 할지 확인 필요(현재는 임시 추정값) -->
          <a href="page10.html?step=3" class="js-nav-effect p13-retry">
            <img src="../../img/common/btn_retry.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_retry_on.png" data-src-over="../../img/common/btn_retry_over.png" data-sound="sound/click.mp3" alt="다시하기">
          </a>
          <a href="page12.html" class="js-nav-effect p13-decide">
            <img src="img/p13_btn_decide.png" class="js-img-swap js-sfx" data-src-alt="img/p13_btn_decide_on.png" data-src-over="img/p13_btn_decide_over.png" data-sound="sound/click.mp3" alt="결정하기">
          </a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="나의 미래 모습 만들기" data-next="page12.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    let job = 'store';
    let gender = 'm';
    try { job = sessionStorage.getItem('sa01_job') || job; gender = sessionStorage.getItem('sa01_gender') || gender; } catch (e) {}
    const photo = document.getElementById('p13Photo');
    photo.onload = function () { photo.classList.remove('is-off'); };
    photo.src = 'img/p15_result_' + job + '_' + gender + '.png';
  })();
  </script>
</body>
</html>
