<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프롬프트를 고쳐라</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        main{background:#d8deec}
        .ask-pill.has-stage{left:92px;top:52px;transform:none}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main>

          <div class="prompt-fix-stars-pill">
            <img class="find-star" src="../../img/common/icon_star.png" data-src-on="../../img/common/icon_star_on.png" alt="">
            <img class="find-star" src="../../img/common/icon_star.png" data-src-on="../../img/common/icon_star_on.png" alt="">
            <img class="find-star" src="../../img/common/icon_star.png" data-src-on="../../img/common/icon_star_on.png" alt="">
          </div>

          <div class="step-flow prompt-fix-quiz" data-next="page19.html">

            <div class="step-panel">
              <p class="ask-pill has-stage is-fit"><i>STAGE 1</i><span>어떤 부분이 잘못 되었을까?</span></p>
              <div class="prompt-fix-photo"><img src="img/p18_photo_item1.png" alt="요리사"></div>
              <div class="prompt-fix-box">
                <div class="prompt-fix-box-title">프롬프트</div>
                <div class="prompt-fix-sentence">
                  <span class="prompt-fix-word" data-target="true">농구장</span>에서 <span class="prompt-fix-word">요리</span>를 하고 있는<br>
                  <span class="prompt-fix-word">요리사</span>의 모습을 사진으로 만들어줘.
                </div>
                <div class="prompt-fix-choices hidden">
                  <button class="card-btn prompt-fix-choice" data-correct="false">진료실</button>
                  <button class="card-btn prompt-fix-choice" data-correct="false">소방서</button>
                  <button class="card-btn prompt-fix-choice" data-correct="true">주방</button>
                </div>
                <div class="prompt-fix-feedback hidden">정답이에요!</div>
              </div>
            </div>

            <div class="step-panel">
              <p class="ask-pill has-stage is-fit"><i>STAGE 2</i><span>어떤 부분이 잘못 되었을까?</span></p>
              <div class="prompt-fix-photo"><img src="img/p18_photo_item2.png" alt="바리스타"></div>
              <div class="prompt-fix-box">
                <div class="prompt-fix-box-title">프롬프트</div>
                <div class="prompt-fix-sentence">
                  <span class="prompt-fix-word">카페</span>에서 <span class="prompt-fix-word" data-target="true">프로그램</span>을 만들고 있는<br>
                  <span class="prompt-fix-word">바리스타</span>의 모습을 사진으로 만들어줘.
                </div>
                <div class="prompt-fix-choices hidden">
                  <button class="card-btn prompt-fix-choice" data-correct="true">커피</button>
                  <button class="card-btn prompt-fix-choice" data-correct="false">사진</button>
                  <button class="card-btn prompt-fix-choice" data-correct="false">웹툰</button>
                </div>
                <div class="prompt-fix-feedback hidden">정답이에요!</div>
              </div>
            </div>

            <div class="step-panel">
              <p class="ask-pill has-stage is-fit"><i>STAGE 3</i><span>어떤 부분이 잘못 되었을까?</span></p>
              <div class="prompt-fix-photo"><img src="img/p18_photo_item3.png" alt="농구선수"></div>
              <div class="prompt-fix-box">
                <div class="prompt-fix-box-title">프롬프트</div>
                <div class="prompt-fix-sentence">
                  <span class="prompt-fix-word">농구장</span>에서 <span class="prompt-fix-word" data-target="true">축구공</span>으로 경기를 뛰는<br>
                  <span class="prompt-fix-word">농구선수</span>의 모습을 사진으로 만들어줘.
                </div>
                <div class="prompt-fix-choices hidden">
                  <button class="card-btn prompt-fix-choice" data-correct="false">배구공</button>
                  <button class="card-btn prompt-fix-choice" data-correct="true">농구공</button>
                  <button class="card-btn prompt-fix-choice" data-correct="false">야구공</button>
                </div>
                <div class="prompt-fix-feedback hidden">정답이에요!</div>
              </div>
            </div>

          </div>

          <div class="prompt-fix-popup hidden">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text is-small">이미지와 프롬프트를 다시 한 번 비교해보세요.</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="프롬프트를 고쳐라" data-next="page19.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
