<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 미래 모습 만들기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        main{background:url('img/p15_bg_result.png') no-repeat}
        .p13-confirm{position:absolute;left:1450px;top:800px}
        /* 결과 사진: page12에서 고른 직업·성별에 맞는 img/p15_result_{직업}_{m|f}.png를 배경 사진 칸 위에 덮음(없으면 배경 그대로) */
        .p15-photo{position:absolute;left:400px;top:110px;width:1121px;height:557px;border-radius:24px;object-fit:cover;border:solid 5px var(--c-ink)}
        .p15-photo.is-off{display:none}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main>
          <img class="p15-photo is-off" id="p15Photo" alt="나의 미래 모습">

          <img class="particle-effect" src="../../img/common/img_particle01.png" data-frame1="../../img/common/img_particle01.png" data-frame2="../../img/common/img_particle02.png" data-interval="200" data-duration="2000" alt="">
          <a href="page16.html" class="js-nav-effect js-sfx p13-confirm">
            <img src="../../img/common/btn_confirm.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_confirm_on.png" data-src-over="../../img/common/btn_confirm_over.png" data-sound="sound/click.mp3" alt="확인">
          </a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="나의 미래 모습 만들기" data-next="page16.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    let job = 'illust';
    let gender = 'f';
    try { job = sessionStorage.getItem('sa01_job') || job; gender = sessionStorage.getItem('sa01_gender') || gender; } catch (e) {}
    const photo = document.getElementById('p15Photo');
    photo.onload = function () { photo.classList.remove('is-off'); };
    photo.src = 'img/p15_result_' + job + '_' + gender + '.png';
  })();
  </script>
</body>
</html>
