<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀴즈 풀기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 질문 박스·선택지 버튼은 공용 .quiz-ask-box / .card-btn.is-quiz. 여기는 선택지 좌표만
           (버튼 그림자가 옆으로 10px 퍼져서 디자인 이미지 좌표보다 10px 안쪽) */

        .p14-q1-opt{position:absolute;margin-left:10px}
        .p14-q1-opt1{left:420px;top:500px}
        .p14-q1-opt2{left:980px;top:500px}
        .p14-q1-opt3{left:140px;top:720px}
        .p14-q1-opt4{left:700px;top:720px}
        .p14-q1-opt5{left:1300px;top:720px}

        .p14-q2-opt{position:absolute;top:560px;margin-left:10px}
        .p14-q2-opt1{left:154px}
        .p14-q2-opt2{left:718px}
        .p14-q2-opt3{left:1282px}

        .p14-ox{position:absolute;top:460px;width:435px;height:436px;cursor:pointer}
        .p14-o{left:300px}
        .p14-x{left:1120px}

    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="quiz-stage">
          <div class="step-flow">

            <div class="step-panel p14-panel p14-q1">

              <div class="quiz-ask-box">

                <div class="quiz-ask-row">

                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>

                  <span class="quiz-qnum">Q1.</span>

                  <p class="quiz-ask">어른이 되어 하고 싶은 일을 결정할 때, 중요하게 생각해야 할 것은 무엇일까요? 모두 골라보세요.</p>

                </div>

              </div>
              <div class="answer-pick-quiz">
                <button class="answer-pick card-btn is-quiz p14-q1-opt p14-q1-opt1" data-correct="true" aria-label="적성">적성</button>
                <button class="answer-pick card-btn is-quiz is-long p14-q1-opt p14-q1-opt2" data-correct="false" aria-label="친구가 좋아하는 것">친구가<br>좋아하는 것</button>
                <button class="answer-pick card-btn is-quiz p14-q1-opt p14-q1-opt3" data-correct="false" aria-label="멋있는 일">멋있는 일</button>
                <button class="answer-pick card-btn is-quiz is-long p14-q1-opt p14-q1-opt4" data-correct="true" aria-label="내가 좋아하는 것">내가<br>좋아하는 것</button>
                <button class="answer-pick card-btn is-quiz p14-q1-opt p14-q1-opt5" data-correct="true" aria-label="잘하는 일">잘하는 일</button>
              </div>
            </div>

            <div class="step-panel p14-panel p14-q2">

              <div class="quiz-ask-box">

                <div class="quiz-ask-row">

                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>

                  <span class="quiz-qnum">Q2.</span>

                  <p class="quiz-ask">생성형 AI에게 내가 원하는 이미지를 만들기 위해 입력해야 하는 설명 글을 무엇이라고 할까요?</p>

                </div>

              </div>
              <div class="answer-pick-quiz">
                <button class="answer-pick card-btn is-quiz p14-q2-opt p14-q2-opt1" data-correct="true" aria-label="프롬프트">프롬프트</button>
                <button class="answer-pick card-btn is-quiz p14-q2-opt p14-q2-opt2" data-correct="false" aria-label="알고리즘">알고리즘</button>
                <button class="answer-pick card-btn is-quiz p14-q2-opt p14-q2-opt3" data-correct="false" aria-label="인공지능">인공지능</button>
              </div>
            </div>

            <div class="step-panel p14-panel p14-q3">

              <div class="quiz-ask-box">

                <div class="quiz-ask-row">

                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>

                  <span class="quiz-qnum">Q3.</span>

                  <p class="quiz-ask">AI가 만든 이미지를 실제 내 얼굴인 것처럼 다른 사람에게 속여서 소개해도 될까요?</p>

                </div>

              </div>
              <div class="ox-quiz" data-answer="x" data-next="page17.html">
                <img class="ox-btn js-img-swap p14-ox p14-o" data-value="o" src="../../img/common/icon_o.png" data-src-alt="../../img/common/icon_o_on.png" alt="O 선택">
                <img class="ox-btn js-img-swap p14-ox p14-x" data-value="x" src="../../img/common/icon_x.png" data-src-alt="../../img/common/icon_x_on.png" alt="X 선택">
              </div>
            </div>

          </div>

          <div class="ox-result-correct is-avatar is-off" data-sound="sound/correct.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_correct.png" alt=""></div>
              <p class="avatar-popup-text">정답이에요!</p>
              <div class="avatar-popup-extra"><img src="../../img/common/icon_correct.png" alt=""></div>
            </div>
          </div>
          <div class="ox-result-wrong is-avatar is-off" data-sound="sound/incorrect.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <p class="avatar-popup-text is-small">문장을 다시 한 번 잘 읽어봐요.</p>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="퀴즈 풀기" data-next="page17.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
