      const q = LAY[r.spre + ':' + c[1]] || [p[0] * .867, p[1] * .846, p[2] * .87, p[3] * .87, p[4] * .867, p[5] * .846, p[6] * .846];
      const f = (n) => Math.round(n * 10) / 10;
      return '--cc:' + c[3] + ';--ix:' + p[0] + 'px;--iy:' + p[1] + 'px;--iw:' + p[2] + 'px;--ih:' + p[3] + 'px;--tc:' + p[4] + 'px;--tt:' + p[5] + 'px;--th:' + p[6] + 'px;--six:' + f(q[0]) + 'px;--siy:' + f(q[1]) + 'px;--siw:' + f(q[2]) + 'px;--sih:' + f(q[3]) + 'px;--stc:' + f(q[4]) + 'px;--stt:' + f(q[5]) + 'px;--sth:' + f(q[6]) + 'px' + (c[1] === 'talk' ? ';--fs:36.5px;--sfs:31px' : '');
    };
    const cardInner = (r, c) => '<img class="ci" src="img/p13_card_' + r.pre + '_' + c[1] + '.png" alt=""><span class="ct">' + c[0] + '</span>';
    const stage = $('stage');
    const slots = Array.from(document.querySelectorAll('.p12-slot'));
    let ri = 0;
    let wrong = 0;

    const slotAt = (x, y) => slots.find((s) => !s.dataset.full && (() => { const r = s.getBoundingClientRect(); return x >= r.left - 20 && x <= r.right + 20 && y >= r.top - 20 && y <= r.bottom + 20; })()) || null;
    const inMan = (x, y) => { const r = document.querySelector('.p12-man').getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; };

    function showInfo(withHint) {
      const r = ROUNDS[ri];
      $('p12InfoShot').innerHTML = r.shot;
      $('p12InfoHint').textContent = r.hint;
      $('p12InfoHint').classList.toggle('is-off', !withHint);
      $('p12Info').firstElementChild.classList.toggle('is-hint', !!withHint);
      $('p12Info').classList.remove('is-off');
    }
    function reset(cards) {
      slots.forEach((s) => { s.innerHTML = ''; delete s.dataset.full; });
      cards.forEach((c) => { c.el.style.transform = ''; c.el.classList.remove('is-back'); delete c.slot; $('p12Cards').appendChild(c.el); });
      $('p12Ok').disabled = true;
    }
    function render() {
      clearTimeout(doorTimer);
      clearTimeout(stepsTimer);
      clearTimeout(nextTimer);
      lockTimers.forEach(clearTimeout);
      lockTimers = [];
      const r = ROUNDS[ri];
      $('p12Top').firstChild.innerHTML = '<span class="w">' + r.top[0] + '</span>' + r.top[1];
      $('p12Siren').classList.remove('is-ok');
      $('p12SirenImg').src = 'img/p13_siren_red.png';
      $('p12Next').classList.add('is-off');
      $('p12Ok').style.display = '';
      $('p12Again').style.display = '';
      wrong = 0;
      $('p12Answer').classList.add('is-off');
      $('p12Cards').innerHTML = '';
      slots.forEach((s) => { s.innerHTML = ''; delete s.dataset.full; });
      $('p12Ok').disabled = true;
      if (ri === 0) {
        $('p12L1').src = 'img/p13_lock1_on.png';
        $('p12L2').src = 'img/p13_lock2_on.png';
        lockTimers = [
          setTimeout(() => { $('p12L1').src = 'img/p13_lock1_off.png'; playLock(); }, 600),
          setTimeout(() => { $('p12L2').src = 'img/p13_lock2_off.png'; playLock(); }, 1200)
        ];
      }
      const cards = shuffleArray(r.cards.map((c) => ({ src: c, ord: c[2] }))).map((c) => {
        const el = document.createElement('div');
        el.className = 'p12-card';
        el.setAttribute('style', cardStyle(r, c.src));
        el.innerHTML = cardInner(r, c.src);
        c.el = el;
        $('p12Cards').appendChild(el);
        el.addEventListener('pointerdown', (e) => {
          if (c.slot) return;
          e.preventDefault();
          const s = stage.getBoundingClientRect().width / 1920;
          const sx = e.clientX, sy = e.clientY;
          el.setPointerCapture(e.pointerId);
          el.classList.remove('is-back');
          el.classList.add('is-dragging');
          const move = (ev) => {
            el.style.transform = 'translate(' + (ev.clientX - sx) / s + 'px,' + (ev.clientY - sy) / s + 'px)';
            const over = slotAt(ev.clientX, ev.clientY);
            slots.forEach((z) => z.classList.toggle('is-over', z === over));
          };
          const up = (ev) => {
            el.removeEventListener('pointermove', move);
            el.removeEventListener('pointerup', up);
            el.removeEventListener('pointercancel', up);
            el.classList.remove('is-dragging');
            slots.forEach((z) => z.classList.remove('is-over'));
            const z = slotAt(ev.clientX, ev.clientY) || (inMan(ev.clientX, ev.clientY) ? slots.find((q) => !q.dataset.full) : null);
            if (z) {
              z.dataset.full = '1';
              c.slot = z;
              el.style.transform = '';
              z.appendChild(el);
              playDrag();
              $('p12Ok').disabled = !slots.every((q) => q.dataset.full);
              return;
            }
            el.classList.add('is-back');
            el.style.transform = '';
          };
          el.addEventListener('pointermove', move);
          el.addEventListener('pointerup', up);
          el.addEventListener('pointercancel', up);
        });
        return c;
      });
      render.cards = cards;
      showInfo();
    }
    $('p12Ok').addEventListener('click', () => {
      const cards = render.cards;
      const placed = slots.map((s) => cards.find((c) => c.slot === s));
      const allOk = placed.every((c) => c.ord > 0);
      const inOrder = allOk && placed.every((c, i) => c.ord === i + 1);
      if (inOrder) {
        playUnlock();
        $('p12Siren').classList.add('is-ok');
        $('p12SirenImg').src = 'img/p13_siren_green.png';
        $('p12Top').firstChild.textContent = '좋아요! 안전하게 대처했어요.';
        const lk = $(ROUNDS[ri].lock);
        lk.src = lk.src.replace('_off.png', '_on.png');
        const lastRound = ri === ROUNDS.length - 1;
        if (lastRound) {
          doorTimer = setTimeout(() => {
            $('p12DoorOpen').classList.remove('is-off');
            playDoor();
            stepsTimer = setTimeout(() => {
              playSteps();
              nextTimer = setTimeout(() => $('p12Next').classList.remove('is-off'), 4200);
            }, 2100);
          }, 1000);
        }
        $('p12Ok').style.display = 'none';
        $('p12Again').style.display = 'none';
        $('p12Answer').classList.add('is-off');
        if (!lastRound) $('p12Next').classList.remove('is-off');
        return;
      }
      playWrong();
      if (++wrong >= 3) $('p12Answer').classList.remove('is-off');
      $(allOk ? 'p12WrongB' : 'p12WrongA').classList.remove('is-off');
    });
    const back = () => { reset(render.cards); };
    $('p12WrongAOk').addEventListener('click', () => { $('p12WrongA').classList.add('is-off'); back(); });
    $('p12WrongBOk').addEventListener('click', () => { $('p12WrongB').classList.add('is-off'); back(); });
    $('p12Again').addEventListener('click', () => showInfo(true));
    $('p12Answer').addEventListener('click', () => {
      const order = ROUNDS[ri].cards.filter((c) => c[2] > 0).sort((a, b) => a[2] - b[2]);
      $('p12AnsCards').innerHTML = order.map((c) => '<div class="p12-card is-s" style="' + cardStyle(ROUNDS[ri], c) + '">' + cardInner(ROUNDS[ri], c) + '</div>').join('<i class="p12-chev"></i>');
      $('p12Ans').classList.remove('is-off');
    });
    $('p12AnsOk').addEventListener('click', () => $('p12Ans').classList.add('is-off'));
    $('p12InfoOk').addEventListener('click', () => $('p12Info').classList.add('is-off'));
    $('p12Next').addEventListener('click', () => {
      if (ri === ROUNDS.length - 1) { location.href = 'page14.html'; return; }
      ri += 1;
      render();
    });
    render();
  })();
  </script>
</body>
</html>
