<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안전한 메시지와 수상한 메시지 나누기</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        .p05-phone{left:128px;top:32px;z-index:4}
        .p05-phone .phone-screen{background:#fff}
        .p05-bar{position:absolute;left:0;top:40px;width:100%;height:64px;box-sizing:border-box;padding:0 20px;display:flex;align-items:center;justify-content:space-between;font-size:26px;font-weight:600;border-bottom:1px solid #e3e3e8;background:#fff;z-index:3}
        .p05-bar span{font-size:34px;font-weight:400}
        .p05-start{position:absolute;left:0;top:300px;width:100%;text-align:center;font-size:36px;line-height:1.35;cursor:pointer;background:none;border:0;font-family:inherit;color:#111;font-weight:600}
        .p05-start svg{display:block;margin:0 auto 20px;width:140px;height:110px;fill:none;stroke:#333;stroke-width:10;stroke-linejoin:round}
        .p05-msg{position:absolute;left:30px;top:150px;width:360px;box-sizing:border-box;padding:20px 24px;border-radius:22px 22px 22px 4px;background:var(--c-pale);font-size:26px;line-height:1.4;color:#111;cursor:grab;touch-action:none;user-select:none;opacity:0;transform:translateY(60px);transition:opacity .6s ease,transform .6s ease;z-index:30}
        .p05-msg.is-in{opacity:1;transform:none}
        .p05-msg.is-dragging{cursor:grabbing;transition:none;z-index:90;box-shadow:0 10px 22px rgba(0,0,0,.3)}
        .p05-msg.is-back{transition:transform .25s ease}
        .p05-msg u{color:#1a55cc}
        .p05-note{position:absolute;left:38px;top:470px;width:372px;box-sizing:border-box;padding:16px 18px;border:solid 3px #1b78d0;border-radius:12px;background:#eef6ff;font-size:23px;line-height:1.4;color:#1b4f8f;display:none}
        .p05-note.is-on{display:block}
        .p05-phone:not(.is-started) .p05-bar,.p05-phone:not(.is-started) .p05-input{display:none}
        .p05-input{position:absolute;left:20px;right:20px;bottom:70px;height:56px;border-radius:28px;background:#eee}

        .p05-tip{top:20px;left:657px;transform:none}
        .p05-panel{position:absolute;left:27px;top:69px;width:1866px;height:867px;box-sizing:border-box;background:#266cc8;border:solid 5px var(--c-ink);border-radius:10px;z-index:1}
        .p05-slot{position:absolute;left:781px;width:973px;height:333px;box-sizing:border-box;background:#91b9e7;border:dashed 5px #fff;border-radius:20px;box-shadow:0 8px 0 rgba(59,53,124,.26);z-index:2}
        .p05-slot.is-safe{top:167px}
        .p05-slot.is-bad{top:554px}
        .p05-box{position:absolute;left:0;top:0;width:100%;height:100%}
        .p05-box img{position:absolute;display:block;pointer-events:none}
        .p05-box.is-safe img{left:93px;top:-16px;width:451px;height:350px}
        .p05-box.is-bad img{left:91px;top:-22px;width:455px;height:356px}
        .p05-box span{position:absolute;left:580px;top:113px;width:290px;display:block;text-align:center;font-family:'Cafe24 Ssurround';font-size:48px;line-height:50px;letter-spacing:-0.02em;color:#fff;pointer-events:none}
        .p05-slot.is-over{outline:10px solid #ff4ff9;outline-offset:-2px}
        .p05-slot.is-over img{filter:drop-shadow(5px 0 0 #ff4ff9) drop-shadow(-5px 0 0 #ff4ff9) drop-shadow(0 5px 0 #ff4ff9) drop-shadow(0 -5px 0 #ff4ff9)}
        .p05-slot.is-over span{-webkit-text-stroke:10px #ff4ff9;paint-order:stroke fill}
        .p05-slot.is-shut{animation:p05-flash .6s ease}
        .p05-slot.is-shut img{animation:p05-flash-img .6s ease}
        @keyframes p05-flash{0%,100%{outline:0 solid #ff4ff9}20%,80%{outline:10px solid #ff4ff9}}
        @keyframes p05-flash-img{0%,100%{filter:none}20%,80%{filter:drop-shadow(5px 0 0 #ff4ff9) drop-shadow(-5px 0 0 #ff4ff9) drop-shadow(0 5px 0 #ff4ff9) drop-shadow(0 -5px 0 #ff4ff9)}}
        #p05Wrong,#p05Done{z-index:120}
        .p05-bar u{
          margin-left:10px;
          width: 10px;
          height: 10px;
          border: solid #666;
          border-width: 0 0 2px 2px;
          transform: rotate(45deg);
        }
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="p05-panel"></div>
          <p class="p05-tip ask-pill is-fit is-medium is-tight2">메시지를 드래그해 알맞은 상자에 분류해보세요.</p>
          <div class="phone-frame has-cam p05-phone" id="p05Phone"><div class="phone-screen" id="p05Screen">
            <div class="phone-status is-dark" data-time="10:08"></div>
            <div class="p05-bar" id="p05Bar"><u></u><b id="p05Who">저장되지 않은 번호</b><span>⋮</span></div>
            <button type="button" class="p05-start js-sfx" id="p05Start" data-sound="sound/click.mp3"><svg viewBox="0 0 140 110"><rect x="6" y="6" width="128" height="98" rx="4"/><path d="M6 10l64 50 64-50"/></svg>메시지가<br>도착했어요!</button>
            <div class="p05-msg" id="p05Msg"></div>
            <div class="p05-note" id="p05Note">오늘 수업에서 선생님이 설문 주소를 알려주셨어요. 안내장과 같은 주소인 것도 확인했어요.</div>
            <div class="p05-input"></div>
            <div class="phone-nav"></div>
          </div></div>
          <div class="p05-slot is-safe" id="p05Safe" data-key="safe"><div class="p05-box is-safe"><img src="img/p05_box_safe.png" alt=""><span>안전한 메시지를 담는 상자</span></div></div>
          <div class="p05-slot is-bad" id="p05Bad" data-key="bad"><div class="p05-box is-bad"><img src="img/p05_box_bad.png" alt=""><span>수상한 메시지를 담는 상자</span></div></div>

          <div class="avatar-modal is-wrong is-off" id="p05Wrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body is-finish">
                <p class="avatar-popup-text" id="p05WrongT"></p>
                <p class="avatar-popup-sub" id="p05WrongP"></p>
                <button type="button" class="avatar-popup-next card-btn is-popup js-sfx" id="p05WrongOk" data-sound="sound/click.mp3">확인</button>
              </div>
            </div>
          </div>
          <div class="avatar-modal is-off" id="p05Done">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_correct.png" alt=""></div>
              <div class="avatar-popup-body is-finish">
                <p class="avatar-popup-text">좋아요! 모든 메시지를 알맞게 분류했어요.</p>
                <p class="avatar-popup-sub is-small">링크가 있거나 아는 사람이 보냈다는 이유만으로 판단하지 않아요. 돈, 개인정보, 앱 설치를 요구하는지 살펴보고, 수상하면 멈추고 도움을 요청해요.</p>
                <a href="page06.html" class="avatar-popup-next card-btn is-popup js-nav-effect js-sfx" data-sound="sound/click.mp3">확인</a>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="안전한 메시지와 수상한 메시지 나누기" data-next="page06.html"></script>
  <script src="../../resources/js/toc.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  (function () {
    const MSGS = [
      { who: '저장되지 않은 번호', html: '이벤트에 당첨됐어요!<br>선물을 받으려면<br>아래 링크를 누르세요.<br><u>gift.example</u>', key: 'bad', wrong: { t: '주의!', p: '신청한 적 없는 이벤트예요. 선물을 준다며 내 정보를 요구하고 있네요. 다시 살펴봐요.' } },
      { who: '엄마', html: '오늘 저녁은 6시에 먹자.<br>집에 올 때 조심해서 와.', key: 'safe', wrong: { t: '', p: '이 메시지는 저녁 시간과 귀가를 안내하고 있어요. 돈이나 개인 정보를 요구하는 내용이 있는지 살펴봐요.' } },
      { who: '담임 선생님', html: '내일 미술 시간에 색연필을<br>사용할 거예요.<br>잊지 말고 꼭 챙겨오세요.', key: 'safe', note: true, wrong: { t: '', p: '링크가 있다고 모두 수상한 것은 아니에요. 수업에서 안내 받았고, 안내장의 주소와 같은지도 확인했어요.' } },
      { who: '김누리', html: '무료 간식 쿠폰이 도착했어요!<br>아래 링크에서 앱을 설치하고<br>쿠폰을 받으세요.<br><u>coupon.app</u>', key: 'bad', wrong: { t: '', p: '친구가 보냈어도 내용 확인이 필요해요.<br>앱 설치와 인증번호 입력을 요구하고 있네요.' } },
      { who: '저장되지 않은 번호', html: '“학교 지원금을 드립니다.<br>지금 이 문자에 이름과 계좌<br>비밀번호를 답장해 주세요.”', key: 'bad', wrong: { t: '', p: '링크가 없어도 수상할 수 있어요.<br>이 문자는 계좌 비밀번호를 답장하라고 요구하고 있어요.' } }
    ];
    const stage = $('stage'), msg = $('p05Msg'), note = $('p05Note'), start = $('p05Start');
    const boxes = [$('p05Safe'), $('p05Bad')];
    let mi = 0, busy = false;

    function show() {
      const m = MSGS[mi];
      $('p05Who').textContent = m.who;
      msg.className = 'p05-msg';
      msg.style.transform = '';
      msg.style.opacity = '';
      msg.style.transition = '';
      msg.innerHTML = m.html;
      note.classList.toggle('is-on', !!m.note);
      void msg.offsetWidth;
      msg.classList.add('is-in');
      busy = false;
    }
    start.addEventListener('click', () => {
      clearFingers();
      start.style.display = 'none';
      $('p05Phone').classList.add('is-started');
      show();
    });
    setTimeout(() => pointFingerAt(start, { onMain: true, dx: -120, dy: -20 }), 500);

    const boxAt = (x, y) => boxes.find((b) => { const r = b.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; }) || null;

    msg.addEventListener('pointerdown', (e) => {
      if (busy || !msg.classList.contains('is-in')) return;
      e.preventDefault();
      const s = stage.getBoundingClientRect().width / 1920;
      const sx = e.clientX, sy = e.clientY;
      const mr = document.querySelector('main').getBoundingClientRect();
      const r0 = msg.getBoundingClientRect();
      msg.style.left = ((r0.left - mr.left) / s) + 'px';
      msg.style.top = ((r0.top - mr.top) / s) + 'px';
      msg.style.transition = 'none';
      msg.style.transform = '';
      document.querySelector('main').appendChild(msg);
      msg.setPointerCapture(e.pointerId);
      msg.classList.remove('is-back');
      msg.classList.add('is-dragging');
      const move = (ev) => {
        msg.style.transform = 'translate(' + (ev.clientX - sx) / s + 'px,' + (ev.clientY - sy) / s + 'px) scale(.8)';
        const over = boxAt(ev.clientX, ev.clientY);
        boxes.forEach((b) => b.classList.toggle('is-over', b === over));
      };
      const up = (ev) => {
        msg.removeEventListener('pointermove', move);
        msg.removeEventListener('pointerup', up);
        msg.removeEventListener('pointercancel', up);
        msg.classList.remove('is-dragging');
        boxes.forEach((b) => b.classList.remove('is-over'));
        const b = boxAt(ev.clientX, ev.clientY);
        const m = MSGS[mi];
        if (b && b.dataset.key === m.key) {
          busy = true;
          msg.classList.remove('is-in');
          msg.style.opacity = '0';
          $('p05Screen').appendChild(msg);
          msg.style.left = '';
          msg.style.top = '';
          playDrag();
          b.classList.remove('is-shut'); void b.offsetWidth; b.classList.add('is-shut');
          playCorrect();
          mi += 1;
          if (mi === MSGS.length) { setTimeout(() => $('p05Done').classList.remove('is-off'), 1000); return; }
          setTimeout(show, 1000);
          return;
        }
        msg.classList.add('is-back');
        msg.style.transform = '';
        msg.style.transition = '';
        setTimeout(() => { $('p05Screen').appendChild(msg); msg.style.left = ''; msg.style.top = ''; msg.classList.remove('is-back'); }, 260);
        if (b) {
          playWrong();
          $('p05WrongT').textContent = m.wrong.t;
          $('p05WrongT').style.display = m.wrong.t ? '' : 'none';
          $('p05WrongP').innerHTML = m.wrong.p;
          setTimeout(() => $('p05Wrong').classList.remove('is-off'), 300);
        }
      };
      msg.addEventListener('pointermove', move);
      msg.addEventListener('pointerup', up);
      msg.addEventListener('pointercancel', up);
    });
    $('p05WrongOk').addEventListener('click', () => $('p05Wrong').classList.add('is-off'));
  })();
  </script>
</body>
</html>
