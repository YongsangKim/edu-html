<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보이스피싱, 이렇게 대처해요!</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        /* 기획서 26~31p. 두 가지 상황(① 돈을 보내 달라는 전화 ② 계정 정보를 입력하라는 문자). 왼쪽에 받은 전화·문자 화면, 오른쪽 '대처 카드' 5장 중 알맞은 3장을 '안전 대처 매뉴얼' 빈칸 3개로 끌어 넣음(순서 상관 없음).
           정답이면 카드가 카드 영역에서 사라지고 매뉴얼에 붙음, 오답이면 카드가 돌아가고 팝업. 3장 완성 → 완성 팝업 → (두 번째 상황은 종료 팝업까지) */
        .p07-lpanel{position:absolute;left:27px;top:69px;width:573px;height:867px;box-sizing:border-box;background:#fff;border:solid 5px var(--c-ink);border-radius:10px;z-index:1}
        .p07-left{position:absolute;left:114px;top:90px;width:400px;height:700px;overflow:hidden;border-radius:26px;box-shadow:0 0 0 4px var(--c-ink);background:#fff;transform:scale(.95);transform-origin:top center;z-index:2}
        .p07-left img{display:block;width:100%;height:100%;object-fit:cover}
        .p07-ov{position:absolute;left:50px;top:100px;width:300px;height:112px;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:26px;line-height:1.3;text-align:center}
        .p07-ov b{font-size:40px;letter-spacing:.02em}
        .p07-bub{position:absolute;left:17px;top:770px;width:592px;height:168px;box-sizing:border-box;background:#fff;border:solid 5px #48159c;border-radius:100px;box-shadow:0 12px 0 rgba(52,39,94,.3);z-index:3}
        .p07-circ{position:absolute;left:28px;top:782px;width:145px;height:145px;border-radius:50%;background:#48159c;z-index:4}
        .p07-robot{position:absolute;display:block;z-index:5;pointer-events:none}
        .p07-cap{position:absolute;left:185px;top:805px;width:400px;margin:0;text-align:left;font-family:'Cafe24 Ssurround';font-size:30px;line-height:1.5;color:#48159c;letter-spacing:-0.06em;white-space:nowrap;z-index:5}
        .p07-tip{top:20px;left:657px;transform:none}
        .p07-panel{position:absolute;left:606px;top:69px;width:1287px;height:867px;box-sizing:border-box;background:#266cc8;border:solid 5px var(--c-ink);border-radius:10px;z-index:1}
        .p07-box{position:absolute;top:150px;width:602px;height:748px;box-sizing:border-box;background:#fff;border:solid 5px;border-radius:10px;overflow:hidden;z-index:2;box-shadow:0 10px 20px rgba(59,53,124,.15)}
        .p07-box h3{margin:0;height:93px;display:flex;align-items:center;justify-content:center;font-family:'Cafe24 Ssurround';font-weight:normal;font-size:60px;color:#fff;letter-spacing:-0.1em}
        .p07-man{left:641px;border-color:#91b9e7}
        .p07-man h3{background:#91b9e7}
        .p07-slots{padding:17px 31px;display:flex;flex-direction:column;gap:10px}
        .p07-slot{height:197px;box-sizing:border-box;border:dashed 5px #99c2ff;border-radius:14px;background:#c8dcf3;display:flex;align-items:center}
        .p07-slot.is-over{border-style:solid;border-color:#f4b400;background:rgba(255,230,120,.5)}
        .p07-slot[data-full]{border:0;background:none}
        .p07-cards{left:1259px;border-color:#31248a;overflow:visible;z-index:10}
        .p07-cards h3{background:#31248a;border-radius:5px 5px 0 0}
        .p07-cardbox{padding:10px 27px;display:flex;flex-direction:column;gap:3px}
        .p07-card{width:537px;height:122px;box-sizing:border-box;padding:0 10px 0 36px;display:flex;align-items:center;border:solid 5px #31248a;border-radius:14px;box-shadow:0 5px 0 rgba(44,30,89,.17);font-family:'Cafe24 Ssurround';font-size:31px;line-height:1.3;color:#31248a;letter-spacing:-0.04em;word-break:keep-all;cursor:grab;touch-action:none;user-select:none;position:relative;z-index:5}
        .p07-card:after{content:'';position:absolute;inset:6px;border:dashed 5px #fff;border-radius:6px;pointer-events:none}
        .p07-card .p07-ci{flex:0 0 75px;width:75px;height:75px;margin-right:27px;display:flex;align-items:center;justify-content:center;pointer-events:none}
        .p07-card .p07-ci img{max-width:100%;max-height:100%;pointer-events:none}
        .p07-card span{position:relative;z-index:1}
        .p07-card.is-dragging{cursor:grabbing;z-index:90;box-shadow:0 10px 22px rgba(0,0,0,.3)}
        .p07-card.is-back{transition:transform .25s ease}
        .p07-slot .p07-card{width:100%;height:100%;cursor:default;pointer-events:none;font-size:33px;letter-spacing:-0.1em;line-height:1.5;padding:0 30px 0 37px}
        .p07-slot .p07-card .p07-ci{flex-basis:97px;width:97px;height:97px;margin-right:17px}
        #p07Wrong,#p07Done,#p07End{z-index:120}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="p07-lpanel"></div>
          <div class="p07-left"><img id="p07Img" alt=""><div class="p07-ov" id="p07Ov">저장되지 않은 번호<b>010-0000-0000</b></div></div>
          <div class="p07-bub"></div><div class="p07-circ"></div><img class="p07-robot" id="p07Robot" alt="">
          <p class="p07-cap" id="p07Cap"></p>
          <div class="p07-panel"></div>
          <p class="p07-tip ask-pill is-fit is-medium is-tight2" id="p07Tip">알맞은 대처 카드를 드래그해 빈칸에 넣어보세요.</p>
          <div class="p07-box p07-man"><h3>안전 대처 매뉴얼</h3><div class="p07-slots" id="p07Slots"><div class="p07-slot"></div><div class="p07-slot"></div><div class="p07-slot"></div></div></div>
          <div class="p07-box p07-cards"><h3>대처 카드</h3><div class="p07-cardbox" id="p07Cards"></div></div>

          <div class="avatar-modal is-wrong is-off" id="p07Wrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body is-finish">
                <p class="avatar-popup-sub" id="p07WrongP"></p>
                <button type="button" class="avatar-popup-next card-btn is-popup js-sfx" id="p07WrongOk" data-sound="sound/click.mp3">다음</button>
              </div>
            </div>
          </div>
          <div class="avatar-modal is-off" id="p07Done">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_correct.png" alt=""></div>
              <div class="avatar-popup-body is-finish">
                <p class="avatar-popup-sub" id="p07DoneP"></p>
                <button type="button" class="avatar-popup-next card-btn is-popup js-sfx" id="p07DoneOk" data-sound="sound/click.mp3">다음</button>
              </div>
            </div>
          </div>
          <div class="avatar-modal is-off" id="p07End">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_correct.png" alt=""></div>
              <div class="avatar-popup-body is-finish">
                <p class="avatar-popup-sub">디지털 범죄가 의심될 때는 당황하지 않고<br>안전 대처 매뉴얼을 따라야 해요.</p>
                <a href="page08.html" class="avatar-popup-next card-btn is-popup js-nav-effect js-sfx" data-sound="sound/click.mp3">다음</a>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="보이스피싱, 이렇게 대처해요!" data-next="page08.html"></script>
  <script src="../../resources/js/toc.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  (function () {
    const SETS = [
      { img: 'img/m_image16.jpeg', robot: ['img/p07_robot_call.png', 21, 755, 132, 171], cap: '모르는 사람의 전화를 받았어요.<br>지금 당장 돈을 보내 달라고 해요.',
        wrong: '수상한 전화를 받았을 때는<br>절대 상대방의 요구를 들어주지 않고<br>대화를 이어가지 않아야 해요!',
        done: '수상한 전화에 대처하기 위한<br>안전 행동 매뉴얼을 완성했어요!',
        cards: [
          { ico: 'p07_icon_money.png', col: '#fccf89', t: '당장의 위협에서 벗어나기 위해 우선 돈을 보내요.', ok: false },
          { ico: 'p07_icon_callend.png', col: '#899cfc', t: '수상한 전화는 바로 끊어요.', ok: true },
          { ico: 'p07_icon_group.png', col: '#db82ff', t: '보호자나 선생님께 상황을 알려요.', ok: true },
          { ico: 'p07_icon_callwave.png', col: '#ff8282', t: '계속 통화하며 대화를 끝낼 타이밍을 기다려요.', ok: false },
          { ico: 'p07_icon_block.png', col: '#63e1ad', t: '어른과 함께 수상한 번호를 차단해요.', ok: true }
        ] },
      { img: 'img/m_image11.png', robot: ['img/p07_robot_msg.png', 24, 747, 133, 179], cap: '모르는 번호로 메시지가 왔어요.<br>수상한 링크가 포함되어 있어요.',
        wrong: '출처가 불분명한 링크가 포함된 문자를 받았을<br>때는 절대 클릭해서는 안 되며 나의 개인정보를<br>입력해서도 안 돼요!',
        done: '수상한 문자에 대처하기 위한<br>안전 행동 매뉴얼을 완성했어요!',
        cards: [
          { ico: 'p07_icon_blocklink.png', col: '#fccf89', t: '출처가 불분명한 링크는 절대 누르지 않아요.', ok: true },
          { ico: 'p07_icon_doc.png', col: '#899cfc', sty: 'font-size:29px;letter-spacing:-0.1em', t: '계정을 보호하려고 문자 속 링크에 아이디와 비밀번호를 입력해요.', ok: false },
          { ico: 'p07_icon_group.png', col: '#db82ff', t: '보호자나 선생님께 문자를 보여줘요.', ok: true },
          { ico: 'p07_icon_bin.png', col: '#63e1ad', t: '어른과 함께 사기성 문자를 삭제하고 번호를 차단해요.', ok: true },
          { ico: 'p07_icon_link_big.png', col: '#ff8282', t: '상황을 알기 위해 링크를 눌러 내용을 확인해요.', ok: false }
        ] }
    ];
    const stage = $('stage');
    const slots = Array.from(document.querySelectorAll('.p07-slot'));
    const cardBox = $('p07Cards');
    let si = 0, placed = 0;

    const slotAt = (x, y) => slots.find((s) => !s.dataset.full && (() => { const r = s.getBoundingClientRect(); return x >= r.left - 20 && x <= r.right + 20 && y >= r.top - 20 && y <= r.bottom + 20; })()) || null;
    const inMan = (x, y) => { const r = document.querySelector('.p07-man').getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; };

    function render() {
      const set = SETS[si];
      placed = 0;
      $('p07Img').src = set.img;
      $('p07Cap').innerHTML = set.cap;
      const rb = $('p07Robot');
      rb.src = set.robot[0];
      rb.style.left = set.robot[1] + 'px'; rb.style.top = set.robot[2] + 'px'; rb.style.width = set.robot[3] + 'px'; rb.style.height = set.robot[4] + 'px';
      $('p07Ov').style.display = si === 0 ? 'flex' : 'none';
      slots.forEach((s) => { s.innerHTML = ''; delete s.dataset.full; });
      cardBox.innerHTML = '';
      set.cards.forEach((c) => {
        const el = document.createElement('div');
        el.className = 'p07-card';
        el.style.background = c.col;
        el.innerHTML = '<div class="p07-ci"><img src="img/' + c.ico + '" alt=""></div><span' + (c.sty ? ' style="' + c.sty + '"' : '') + '>' + c.t + '</span>';
        cardBox.appendChild(el);
        el.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          const s = stage.getBoundingClientRect().width / 1920;
          const sx = e.clientX, sy = e.clientY;
          el.setPointerCapture(e.pointerId);
          el.classList.remove('is-back');
          el.classList.add('is-dragging');
          const move = (ev) => {
            el.style.transform = 'translate(' + (ev.clientX - sx) / s + 'px,' + (ev.clientY - sy) / s + 'px)';
            const over = slotAt(ev.clientX, ev.clientY);
            slots.forEach((z) => z.classList.toggle('is-over', z === over));
          };
          const up = (ev) => {
            el.removeEventListener('pointermove', move);
            el.removeEventListener('pointerup', up);
            el.removeEventListener('pointercancel', up);
            el.classList.remove('is-dragging');
            slots.forEach((z) => z.classList.remove('is-over'));
            const z = slotAt(ev.clientX, ev.clientY);
            const dropped = z || (inMan(ev.clientX, ev.clientY) ? slots.find((q) => !q.dataset.full) : null);
            if (dropped && c.ok) {
              dropped.dataset.full = '1';
              el.style.transform = '';
              dropped.appendChild(el);
              playDrag();
              placed += 1;
              if (placed === 3) { playCorrect(); setTimeout(() => { $('p07DoneP').innerHTML = set.done; $('p07Done').classList.remove('is-off'); }, 700); }
              return;
            }
            el.classList.add('is-back');
            el.style.transform = '';
            if (dropped) {
              playWrong();
              $('p07WrongP').innerHTML = set.wrong;
              setTimeout(() => $('p07Wrong').classList.remove('is-off'), 300);
            }
          };
          el.addEventListener('pointermove', move);
          el.addEventListener('pointerup', up);
          el.addEventListener('pointercancel', up);
        });
      });
    }
    $('p07WrongOk').addEventListener('click', () => $('p07Wrong').classList.add('is-off'));
    $('p07DoneOk').addEventListener('click', () => {
      $('p07Done').classList.add('is-off');
      si += 1;
      if (si === SETS.length) $('p07End').classList.remove('is-off');
      else render();
    });
    render();
  })();
  </script>
</body>
</html>
