<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 동네 가게를 운영하라!</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        /* 디자인 없음 - 기획서 46~61p. 손님 5명의 주문을 보고 재화/서비스 선반에서 알맞은 것 고르기.
           맞으면 웃는 손님 + 감사 말풍선 2초 뒤 다음 손님(게이지 20%씩), 틀리면 힌트 팝업 3초(기획서 5초는 너무 길어 줄임).
           가게 배경 img/p12_bg.png, 물건 img/p12_item_{key}.png */
        main{background:url('img/p12_bg.png') center / cover no-repeat, linear-gradient(180deg,#d9ddeb 0%,#cddcea 50%,#c2d9e9 100%)}

        /* 디자인 12p: 가게 배경(img/p12_bg.png, 손님·선반 포함) 위에 게이지 · 주문 말풍선 · 질문 알약 · 재화/서비스 이름표 · 동그란 물건 4개 */
        .p12-gauge{left:333px;top:36px;width:1292px}

        .p12-order{position:absolute;left:1103px;top:170px;margin:0;width:547px;min-height:218px;box-sizing:border-box;padding:24px 30px 18px;display:flex;align-items:center;justify-content:center;text-align:center;
          background:var(--c-white);border:solid 5px #2b6bd6;border-radius:24px;
          font-family:'Cafe24 Ssurround';font-size:60px;line-height:1.25;color:#2b6bd6;letter-spacing:-0.05em;word-break:keep-all;box-shadow:10px 10px 4px 0 rgba(55,45,86,0.4)}
        .p12-order.is-small{font-size:50px;padding-left:14px;padding-right:14px}
        .p12-order:before{content:'';position:absolute;left:-55px;top:17px;width:60px;height:70px;background:url('img/p14_arrow.png') 0 0 / 60px 70px no-repeat}

        .p12-ask,.p12-thanks{position:absolute;left:757px;top:502px;width:1073px;height:100px;margin:0;box-sizing:border-box;padding-top:6px;display:flex;align-items:center;justify-content:center;
          background:#fdf9f6;border:solid 5px var(--c-ink);border-radius:50px;font-family:'Cafe24 Ssurround';font-size:70px;color:var(--c-ink);letter-spacing:-0.05em;white-space:nowrap;box-shadow:0 16px 0 0 rgba(86,148,231,0.2)}
        .p12-thanks{color:#2b6bd6}
        .p12-shelf{position:absolute;left:0;top:0;width:1920px;height:960px;pointer-events:none}
        .p12-shelf b{position:absolute;top:610px;width:212px;height:65px;padding-top:4px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border-radius:33px;font-weight:normal;
          background:#789ce0;font-family:'Cafe24 Ssurround';font-size:44px;color:var(--c-white);letter-spacing:-0.03em;border:solid 4px #91b9e7}
        .p12-shelf-goods b{left:910px}
        .p12-shelf-service b{left:1487px}
        .p12-item{position:absolute;bottom:25px;width:270px;height:290px;padding:0;border:0;background:none;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;pointer-events:auto;transition:transform .15s ease}
        .p12-item img{display:block;max-width:100%;max-height:100%}
        .p12-shelf-goods .p12-item:nth-of-type(1){left:705px}
        .p12-shelf-goods .p12-item:nth-of-type(2){left:1025px}
        .p12-shelf-service .p12-item:nth-of-type(1){left:1315px}
        .p12-shelf-service .p12-item:nth-of-type(2){left:1635px}
        .p12-item:hover{transform:scale(1.05)}
        .p12-item.is-selected{filter:drop-shadow(0 0 0 #ff4ff9) drop-shadow(0 0 10px #ff4ff9) drop-shadow(0 0 4px #ff4ff9)}
        .p12-item.is-wrong{animation:fix-word-shake .3s ease}

        .p12 .is-off{display:none}
        #p12Hint{z-index:120}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="p12">
          <div class="gauge is-thin p12-gauge"><div class="gauge-fill" id="p12GaugeFill"></div></div>
          <p class="p12-order" id="p12Order"></p>

          <p class="p12-ask" id="p12Ask">손님이 원하는 것은 무엇인가요?</p>
          <div class="p12-shelf p12-shelf-goods" id="p12Goods"><b>재화</b></div>
          <div class="p12-shelf p12-shelf-service" id="p12Service"><b>서비스</b></div>
          <p class="p12-thanks is-off" id="p12Thanks"></p>

          <div class="avatar-modal is-off" id="p12Hint">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_quiz.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text is-small"><span id="p12HintText"></span></p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="우리 동네 가게를 운영하라!" data-next="page13.html"></script>
  <script src="../../resources/js/toc.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  (function () {
    const GUESTS = [
      { order: '배가 너무 고파요.<br>달콤한 빵 주세요!', answer: 'bread', type: 'goods',
        goods: [['umbrella', '우산'], ['bread', '빵']], service: [['haircut', '미용사의 이발'], ['doctor', '의사의 진료']],
        hint: '배가 고픈 손님에게 필요한 것은 누군가의 기술과 도움일까요, 맛있게 먹을 수 있는 물건일까요?' },
      { order: '앞머리가 눈을 가려요.', answer: 'haircut', type: 'service',
        goods: [['shoes', '신발'], ['snack', '과자']], service: [['haircut', '미용사의 이발'], ['taxi', '택시기사의 운전']],
        hint: '긴 머리카락 때문에 불편한 손님에게 필요한 것은 미용사의 기술과 도움일까요, 가방에 쏙 들어가는 물건일까요?' },
      { order: '내일 미술 시간인데<br>알록달록 그림 그릴 도구가 없어요!', answer: 'crayon', type: 'goods',
        goods: [['crayon', '색연필'], ['paper', '색종이']], service: [['haircut', '미용사의 이발'], ['doctor', '의사의 진료']],
        hint: '준비물이 없는 손님에게 필요한 것은 손으로 잡고 그림을 그리는 물건일까요, 누군가의 기술과 도움일까요?' },
      { order: '콜록콜록! 기침이 나고<br>열이 나서 몸이 아파요.', answer: 'doctor', type: 'service',
        goods: [['bread', '빵'], ['crayon', '색연필']], service: [['doctor', '의사의 진료'], ['taxi', '택시기사의 운전']],
        hint: '몸이 아픈 손님에게 필요한 것은 가방에 쏙 넣을 수 있는 물건일까요, 의사 선생님의 기술과 도움일까요?' },
      { order: '집에 가야 하는데 멀어서<br>걸어가기 힘들어요.', answer: 'taxi', type: 'service',
        goods: [['shoes', '신발'], ['snack', '과자']], service: [['taxi', '택시기사의 운전'], ['haircut', '미용사의 이발']],
        hint: '집에 가는 길이 먼 손님에게 필요한 것은 손으로 잡을 수 있는 물건일까요, 택시 기사님의 기술과 도움일까요?' }
    ];

    const order = $('p12Order');
    const shelves = { goods: $('p12Goods'), service: $('p12Service') };
    const thanks = $('p12Thanks');
    const gaugeFill = $('p12GaugeFill');

    let index = 0;
    let busy = false;

    // 물건 그림은 p05_item_*(파란 원이 든 그림), 없는 것만 p12 전용 그림
    const P05 = ['bag', 'bread', 'clothes', 'crayon', 'delivery', 'doctor', 'haircut', 'mechanic', 'paper', 'pencil', 'shoes', 'snack', 'taxi', 'umbrella'];
    function itemImg(key) {
      return P05.includes(key) ? 'p05_item_' + key : 'p12_item_' + key;
    }

    // 말풍선 문구를 바꿀 때마다 확인: 기본 크기로 두 줄을 넘어 세 줄 이상이 되면 is-small(50px)로 줄임
    function setOrder(html) {
      order.classList.remove('is-small');
      order.innerHTML = html;
      order.classList.toggle('is-small', order.offsetHeight > 230);
    }

    function render() {
      const g = GUESTS[index];
      busy = false;
      setOrder(g.order);
      thanks.classList.add('is-off');
      $('p12Ask').classList.remove('is-off');
      ['goods', 'service'].forEach((type) => {
        const shelf = shelves[type];
        shelf.classList.remove('is-off');
        shelf.querySelectorAll('.p12-item').forEach((el) => el.remove());
        g[type].forEach(([key, name]) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'p12-item';
          btn.setAttribute('aria-label', name);
          btn.innerHTML = '<img src="img/' + itemImg(key) + '.png" alt="">';
          btn.addEventListener('click', () => pick(btn, key));
          shelf.appendChild(btn);
        });
      });
    }

    function pick(btn, key) {
      if (busy) return;
      const g = GUESTS[index];
      if (key !== g.answer) {
        playWrong();
        btn.classList.remove('is-wrong');
        void btn.offsetWidth;
        btn.classList.add('is-wrong');
        $('p12HintText').innerHTML = g.hint;
        flashLayer($('p12Hint'), 'is-off', 3000);
        return;
      }
      busy = true;
      playCorrect();
      btn.classList.add('is-selected');
      setTimeout(() => {
        setOrder('감사합니다!');
        shelves.goods.classList.add('is-off');
        shelves.service.classList.add('is-off');
        $('p12Ask').classList.add('is-off');
        thanks.textContent = g.type === 'goods' ? '알맞은 재화를 전달했어요!' : '알맞은 서비스를 제공했어요!';
        thanks.classList.remove('is-off');
        gaugeFill.style.width = ((index + 1) * 20) + '%';
        setTimeout(() => {
          index += 1;
          if (index < GUESTS.length) render();
          else navigateTo('page13.html');
        }, 2000);
      }, 400);
    }

    gaugeFill.style.width = '0%';
    render();
  })();
  </script>
</body>
</html>
