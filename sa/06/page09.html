        /* 마무리 화면(디자인 16p): 리본 제목 + 파란 부제 + 큰 흰 패널 안에 하늘색 상자(표지·재생 칸) + 다음 */

        .p09 .is-off{display:none}

  <script>
  (function () {
    const DEFAULT_LYRICS = '우리가 입는 옷은 사고 파는 재화\n이동을 도와주는 택시기사의 운전은 서비스\n재화는 눈에 보이는 것, 서비스는 편리함';
    const VERSIONS = [
      '[Intro]\n재화! 서비스!\n우리 생활 속에서 찾아봐\n하나, 둘, 셋, Go!\n\n[Verse 1]\n우리가 입는 옷은 사고 파는 재화\n연필도 가방도 필요한 재화\n손으로 만지고 눈으로 보고\n우리에게 필요한 물건, 바로 재화\n\n[Verse 2]\n아플 때 우리를 도와주는 의사의 진료는 서비스\n머리를 다듬어 주는 미용도 서비스\n택배를 전해 주고 이동을 도와주는\n생활을 편리하게 만드는 서비스\n\n[Hook]\n재화는 눈에 보이는 것, 서비스는 편리함\n재화! 서비스! 구분해 봐\n눈에 보이는 물건은 재화\n도움을 주는 활동은 서비스\n\n[Outro]\n재화와 서비스, 이제 알겠지?\n우리 생활 속에서 찾아봐!',
      '[Intro]\n주위를 둘러봐, 하나 둘 셋\n재화와 서비스 찾아볼래?\n\n[Verse 1]\n우리가 입는 옷은 사고 파는 재화\n맛있는 빵도 사고 파는 재화\n가방과 연필, 필요한 물건\n눈으로 보고 만질 수 있어\n\n[Verse 2]\n아플 때 우리를 도와주는 의사의 진료는 서비스\n머리를 멋지게, 미용도 서비스\n택시를 타고 원하는 곳으로\n우리 생활을 편리하게 해 줘\n\n[Hook]\n재화는 눈에 보이는 것, 서비스는 편리함\n물건이라면 재화\n도움을 주면 서비스\n재화와 서비스, 이제 구분해 봐\n\n[Outro]\n보고! 찾고! 구분해 봐!\n재화와 서비스, 바로 알아봐!'
    ];
    const GENRE_NAME = { hiphop: '힙합', kpop: 'K-POP', trot: '트로트', rock: '락' };
    let lyrics = DEFAULT_LYRICS;
    try { lyrics = sessionStorage.getItem('sa06_lyrics') || DEFAULT_LYRICS; } catch (e) {}

    // 화면 요소 좌표 [x, y, 폭, 높이] (?edit 으로 열어 고친 값을 여기에 붙여 넣음). 말풍선 y 는 아래 가장자리, 폭·높이가 빠진 건 CSS 크기를 씀
    const BOX = {
      load: [1280, 430, 480],
      genres: [1280, 220, 480],
      final: [57, 105, 1806, 803],
      ribbon: [534, 45],
      sub: [0, 250],
      finalBox: [285, 343, 1350, 387],
      cover: [485, 370, 336, 336],
      player: [1005, 427, 420, 212],
      finalNext: [758, 758]
    };
    const BOX_EL = { load: 'p09Load', genres: 'p09Genres' };
    const BOX_SEL = { final: '.p09-final', ribbon: '.p09-final-ribbon', sub: '.p09-final-sub', finalBox: '.p09-final-box', cover: '.p09-final-cover', player: '.p09-player', finalNext: '.p09-final-next' };
    const BOX_NAME = { load: '가사 불러오기', genres: '장르 버튼', final: '마무리 패널', ribbon: '리본', sub: '부제', finalBox: '하늘색 상자', cover: '표지', player: '재생 칸', finalNext: '다음' };
    function placeBox(el) {
      const r = el._ref;
      const st = el.style;
      if (el._hot) { BoxEdit.padApply(el); return; }
      if (el._base) { st.left = (el._base[0] + r[0]) + 'px'; st.top = (el._base[1] + r[1]) + 'px'; return; }
      st.left = r[0] + 'px';
      st.top = r[1] + 'px';
      if (r.length > 2) st.width = r[2] + 'px';
      if (r.length > 3) st.height = r[3] + 'px';
      if (el._key === 'load' || el._key === 'genres') st.transform = 'none';
    }
    Object.keys(BOX).forEach((k) => {
      const el = BOX_EL[k] ? $(BOX_EL[k]) : document.querySelector(BOX_SEL[k]);
      el._key = k;
      el._ref = BOX[k];
      placeBox(el);
    });

      show('완성됐어요!<br>노래를 클릭해<br>하나씩 들어볼까요?', [], songsUI(), 's6-cream');
      const rows = Array.from(screen.querySelectorAll('.p09-song'));
      rows.forEach((row) => { row.dataset.hit = 'song'; BoxEdit.padEl(row, 'song', HOT); });
      let played = false;
      rows.forEach((row) => row.addEventListener('click', (e) => {
        if (e.target.closest('.more')) return;

        rows.forEach((r) => r.classList.toggle('is-playing', r === row));

          played = true;
          const t = tok;
          setTimeout(() => { if (t === tok) stepChoose(rows); }, 1500);

      $('p09FinalPlay').onclick = () => { if (audio) stopSong(); else play(songN); };
    }

    // ?step=N 으로 단계별 보기: 1 앱 클릭 · 2 가사 입력창 · 3 가사 불러오기 · 4 마법봉 · 5 가사 완성(전체화면) · 6 가사 확인 · 7 두 번째 가사 · 8 가사 비교 · 9 스타일 입력창 · 10 스타일 키워드 · 11 만들기 · 12 만드는 중(2초 뒤 13으로) · 13 노래 고르기 · 14 다운로드 선택 · 15 다운로드 · 16 마무리
    const wantStep = parseInt(new URLSearchParams(location.search).get('step'), 10);
    if (wantStep >= 11) state.genre = 'hiphop';
    const STEPS = [stepHome, stepLyricsField, stepLoad, stepWand, stepMade, stepReview, stepSecond, stepCompare, () => choose(0), stepGenre, stepMake, stepLoading, stepSongs,
      () => { stepSongs(); stepChoose(Array.from(screen.querySelectorAll('.p09-song'))); }, stepDownload, stepFinal];
    const go = (n) => {
      tok += 1;
      stopSong();
      $('p09Play').classList.remove('is-off');
      $('p09FinalView').classList.add('is-off');
      state.genre = n >= 10 ? 'hiphop' : '';
      STEPS[n]();
    };
    let cur = wantStep >= 1 && wantStep <= STEPS.length ? wantStep - 1 : 0;
    BoxEdit.stepEdit({
      apply: placeBox, name: (el) => el._hot ? '[클릭 영역 → HOT.' + el._hot + '] ' : el._base ? '[손가락 → ' + el._fg + '] ' : '[' + (BOX_NAME[el._key] || el._name) + '] ',
      count: STEPS.length + 1, get: () => cur + 1, set: (n) => { cur = Math.max(n, 1) - 1; }, go: (n) => { if (n < 1) return; cur = n - 1; BoxEdit.syncStep(n); go(cur); }, label: (n) => '단계 ' + n + ' / ' + STEPS.length,
      say, bubble, img: $('p09Char')
    });
    go(cur);
  })();
  </script>
</body>
