      dots: sv('<circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/>'),
      lock: sv('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>'),
      share: sv('<circle cx="6" cy="12" r="2.2"/><circle cx="17" cy="6" r="2.2"/><circle cx="17" cy="18" r="2.2"/><path d="M8 11l7-4M8 13l7 4"/>'),
      funnel: sv('<path d="M3 5h18l-7 8v6l-4-2v-4z"/>'),
      thumb: sv('<path d="M7 11v9H4v-9zM7 11l4-7c1.6 0 2.6 1.1 2.1 3l-.6 3H19a2 2 0 012 2.3l-1 6A2 2 0 0118 20H7"/>')
    };

    const A = (cls, style, inner) => '<div class="a ' + (cls || '') + '" style="' + (style || '') + '">' + (inner || '') + '</div>';
    const circ = (cls, left, top, ic, id) => '<button type="button" class="a s6-ic ' + cls + '" ' + (id ? 'id="' + id + '" ' : '') + 'style="left:' + left + 'px;top:' + top + 'px;border:0;padding:0">' + ic + '</button>';

    function status(time, rec) {
      return A('s6-st', '', '<span>' + time + (rec ? '<i class="rec"></i>' + IC.expand.replace('<svg', '<svg style="display:inline-block;width:20px;height:20px;vertical-align:-4px"') : '') + '</span><span class="sys">' + IC.mute + IC.wifi + IC.sig + '<em>64</em></span>');
    }
    function nav(active) {
      const xs = [46, 147, 248, 349];
      const icons = [IC.play, IC.search, IC.noteStar, IC.lib];
      const pos = { create: 248, lib: 349 }[active];
      let h = '<div class="a s6-nav">';
      h += '<div class="on" style="left:' + (pos - 33) + 'px"></div>';
      xs.forEach((x, k) => { h += '<i style="left:' + (x - 18) + 'px">' + icons[k] + '</i>'; });
      return h + '<div class="me"></div></div>';
    }
    function sysnav() {
      return A('s6-sys', '', '<i style="left:99px"></i><i style="left:107px"></i><i style="left:115px"></i><b></b><u></u>');
    }

    // 만들기 화면: o.lyr(가사 글), o.sty(스타일 글), o.dim(전체화면 가사 뒤 어둡게)
    function createUI(o) {
      o = o || {};
      const filled = !!o.lyr;
      const H1 = filled ? 348 : 270;
      const T2 = 227 + H1 + 20;
      const T3 = T2 + 250 + 20;
      const hasSty = !!o.sty;
      let h = status('13:13');
      h += A('', 'left:145px;top:62px;width:200px;height:40px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:21px;font-weight:600', '고급의' + IC.chev.replace('<svg', '<svg style="width:20px;height:20px"'));
      h += A('s6-pill', 'left:370px;top:60px;width:105px;height:45px;font-size:14px;font-weight:500', 'v6-mini' + IC.chev.replace('<svg', '<svg style="width:16px;height:16px"'));
      h += A('s6-pill', 'left:20px;top:140px;width:223px;height:67px', IC.plus + '오디오');
      h += A('s6-pill', 'left:254px;top:140px;width:223px;height:67px', IC.plus + '목소리');

      // 가사 카드
      let c1 = '<div class="chev">' + IC.chev + '</div><div class="lab">가사</div>';
      if (filled) {
        c1 += circ('', 223, 24, IC.undo) + circ('', 279, 24, IC.mark) + circ('', 337, 24, IC.trash);
        c1 += '<div class="s6-tx" id="s6LyrTx" style="top:93px;height:156px">' + esc(o.lyr) + '</div>';
      } else {
        c1 += '<div class="s6-ph" style="top:80px">가사나 주제를 적어보세요</div>';
      }
      c1 += circ('is-wand', 396, 24, IC.wand, 's6Wand1');
      const br1 = filled ? 275 : 197;
      c1 += A('s6-ic', 'left:22px;top:' + br1 + 'px;width:50px;height:50px', IC.lib);
      c1 += A('s6-chip', 'left:87px;top:' + (br1 + 1) + 'px;width:146px;background:rgba(255,255,255,.4);border:1px solid rgba(0,0,0,.08)', '<svg viewBox="0 0 24 24" style="fill:#111;stroke:none"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.5 3.5L17 9" stroke="#fff" stroke-width="2.6" fill="none"/></svg>인스트루멘탈');
      c1 += '<button type="button" id="s6Exp1" class="a s6-ic" style="left:388px;top:' + br1 + 'px;width:50px;height:50px;border:0;padding:0;background:none">' + IC.expand + '</button>';
      h += A('s6-card s6-lyr', 'left:20px;top:227px;width:457px;height:' + H1 + 'px', c1).replace('class="a s6-card s6-lyr"', 'class="a s6-card' + (o.lyrHot ? ' s6-hot' : '') + '" id="s6Lyr"');

      // 스타일 카드
      let c2 = '<div class="chev">' + IC.chev + '</div><div class="lab">스타일</div>';
      if (hasSty) {
        c2 += circ('', 223, 24, IC.undo) + circ('', 279, 24, IC.mark) + circ('', 337, 24, IC.trash);
        c2 += '<div class="s6-tx" style="top:94px;height:80px">' + esc(o.sty) + '</div>';
      } else {
        c2 += '<div class="s6-ph" style="top:80px">당신이 만들고 싶은 노래가 어떤 느낌이었으면 좋겠는지 설명해주세요.</div>';
      }
      c2 += circ('is-wand', 396, 24, IC.wand);
      c2 += A('s6-ic', 'left:22px;top:178px;width:50px;height:50px', IC.lib);
      c2 += A('s6-ic', 'left:86px;top:178px;width:50px;height:50px', IC.refresh);
      c2 += A('s6-chip', 'left:152px;top:179px;width:98px', 'hip hop');
      c2 += A('s6-chip', 'left:262px;top:179px;width:123px', 'acoustic guitar');
      c2 += A('s6-ic', 'left:388px;top:178px;width:50px;height:50px;background:none', IC.expand);
      h += A('s6-card' + (o.styHot ? ' s6-hot' : ''), 'left:20px;top:' + T2 + 'px;width:457px;height:250px', c2).replace('<div class="a s6-card', '<div id="s6Sty" class="a s6-card');

      // 곡 제목
      if (!filled) h += A('s6-card', 'left:20px;top:' + T3 + 'px;width:457px;height:58px;border-radius:22px;background:rgba(140,118,115,.07)', '<div style="position:absolute;left:22px;top:17px;width:24px;height:24px;color:#222">' + IC.note + '</div><div style="position:absolute;left:60px;top:0;height:58px;display:flex;align-items:center;font-size:15px;color:rgba(0,0,0,.35)">곡 제목</div>');

      // 만들기 버튼
      if (hasSty) {
        h += circ('', 20, 872, IC.trash).replace('style="', 'style="width:68px;height:68px;background:#76757a;color:#111;');
        h += '<button type="button" id="s6Make" class="a s6-make' + (o.makeHot ? ' s6-hot' : '') + '" style="left:98px;top:872px;width:379px;background:linear-gradient(90deg,#f6b43a,#f58a3b 55%,#ee3b66);color:#fff">' + IC.noteStar + '만들기</button>';
      } else {
        h += A('s6-make', 'left:19px;top:872px;width:458px;background:#4c4c4f;color:#b6b6ba', IC.noteStar + '만들기');
      }
      h += nav('create') + sysnav();
      if (o.dim) h += A('', 'left:0;top:0;width:497px;height:1075px;background:rgba(75,64,74,.6)');
      return h;
    }

    // 전체화면 가사: v(0|1), 두 번째 버전을 비교할 때 이전·다음 버튼이 켜짐
    function fullUI(v, o) {
      o = o || {};
      let h = A('', 'left:0;top:0;width:497px;height:1075px;background:#938b90') + status('13:13');
      h += A('s6-sheet', '', '');
      h += A('', 'left:230px;top:64px;width:38px;height:5px;border-radius:3px;background:#d4d0d0');
      h += A('', 'left:22px;top:106px;font-size:28px;font-weight:600', '가사');
      h += '<div class="a s6-fulltx" id="s6FullTx">' + esc(VERSIONS[v]) + '</div>';
      const ic = [['s6Prev', IC.undo, 73], ['s6Next2', IC.redo, 130], [null, IC.lib, 188], [null, IC.mark, 246], [null, IC.trash, 304], ['s6Wand', IC.wand, 362]];
      h += '<div class="a s6-tb">' + ic.map((t) => '<i ' + (t[0] ? 'id="' + t[0] + '" ' : '') + 'style="left:' + (t[2] - 33 - 16) + 'px">' + t[1] + '</i>').join('') + '</div>';
      h += '<button type="button" id="s6Check" class="a s6-check">' + IC.check + '</button>';
      h += A('', 'left:0;top:1018px;width:497px;height:57px;background:#fff') + sysnav();
      return h;
    }

    function bannerUI(ready) {
      let h = '<div class="a s6-banner" style="background:' + (ready ? 'linear-gradient(90deg,#6c3112,#7a5a14)' : '#7a2517') + '">';
      if (ready) h += '<div class="th"></div><div class="tx" style="left:97px">노래가 준비되었습니다. 탭하여 재생하세요!</div><div class="pl">' + sv('<path d="M8 5v14l11-7z"/>') + '</div>';
      else h += '<div class="tx" style="left:29px">멋진 그루브가 탄생하고 있어요</div><div class="ring"></div>';
      return h + '</div>';
    }

    function songsUI(o) {
      o = o || {};
      let h = status('13:13', true) + bannerUI(!o.loading);
      h += A('s6-tile', 'left:40px;background:radial-gradient(circle at 28% 22%,#33b86a 0,transparent 52%),radial-gradient(circle at 80% 90%,#2b80ee 0,transparent 62%),#1f6fe2', IC.thumb + '<span>좋아요</span>');
      h += A('s6-tile', 'left:252px;background:linear-gradient(135deg,#6a1aa8,#a31f95);', '<div style="position:absolute;left:96px;top:30px;width:92px;height:140px;border-radius:14px;background:linear-gradient(135deg,rgba(255,150,120,.7),rgba(180,40,120,.5));transform:rotate(-12deg)"></div><span>플레이리스트</span>');
      h += A('', 'left:20px;top:336px;font-size:19px;font-weight:500', '내 노래');
      h += A('', 'left:416px;top:338px;display:flex;align-items:center;gap:5px;font-size:14px;color:#444', '필터' + IC.funnel.replace('<svg', '<svg style="width:18px;height:18px;fill:#444"'));
      if (o.loading) {
        [0, 1, 2, 3].forEach((k) => { h += A('s6-sk', 'top:' + (357 + k * 87) + 'px', '<i></i><b></b><u></u>'); });
      } else {
        const desc = GENRE_NAME[state.genre] || '';
        [1, 2].forEach((n, k) => {
          h += '<div class="a s6-row s6-hot p09-song" data-n="' + n + '" style="top:' + (367 + k * 87) + 'px"><div class="th"></div><div class="t">재화와 서비스<small>V6-MINI</small></div><div class="d">' + esc(desc) + '</div><button type="button" class="more is-off" aria-label="더보기">' + IC.dots + '</button></div>';
        });
      }
      h += nav('lib') + sysnav();
      return h;
    }

    function downloadUI() {
      let h = status('13:13', true) + bannerUI(true);
      h += A('', 'left:166px;top:150px;width:168px;height:168px;border-radius:12px;background:var(--c-purple) url(img/p09_cover.png) center / cover no-repeat');
      h += A('', 'left:0;top:332px;width:497px;text-align:center;font-size:19px;font-weight:500', '재화와 서비스');
      h += A('', 'left:20px;top:389px;font-size:13.5px;color:#777', '다운로드 형식');
      ['M4A', 'MP3', 'WAV', 'MP4 비디오'].forEach((t, k) => {
        h += A('s6-opt' + (k === 0 ? ' is-on' : ''), 'top:' + (418 + k * 77) + 'px', t + (k === 0 ? IC.check : ''));
      });
      h += '<button type="button" id="s6Dl" class="a s6-dl s6-hot">' + IC.lock + '잠금 해제 및 다운로드</button>';
      h += A('', 'left:0;top:953px;width:497px;display:flex;align-items:center;justify-content:center;gap:9px;font-size:15.5px;color:#222', IC.share.replace('<svg', '<svg style="width:17px;height:17px"') + '노래 링크로 공유하기');
      h += sysnav();
      return h;
    }

    function show(bubbleHtml, ids, html, bg) {
      bubble.innerHTML = bubbleHtml;
      $('p09Home').classList.toggle('is-off', html !== null);
      screen.innerHTML = html === null ? '' : '<div class="s6-ui ' + (bg || 's6-bg') + '">' + html + '</div>';
      ALL.forEach((id) => $(id).classList.toggle('is-off', !ids.includes(id)));
      clearFingers();
      resetImageSwap(nextBtn);
    }
    function on(el, fn, fo) {
      el.classList.add('s6-hot');
      el.onclick = (e) => { e.stopPropagation(); playClick(); fn(); };
      if (fo !== false) pointFingerAt(el, Object.assign({ onMain: true }, fo));
    }
    function pulse(el) {
      el.classList.remove('p09-pulse');
      void el.offsetWidth;
      el.classList.add('p09-pulse');
    }

    function stepHome() {
      show('Suno를 클릭해요.', [], null);
      $('p09App').onclick = () => { playClick(); stepLyricsField(); };
      pointFingerAt($('p09App'), { onMain: true, dx: 15, dy: -37 });
    }
    function stepLyricsField() {
      show('가사 입력창을 클릭해요.', [], createUI({}));
      on($('s6Lyr'), stepLoad, { x: 0.5, dx:120, dy: -50 });
    }
    function stepLoad() {
      show('재화와 서비스에 대한<br>가사를 만들어볼게요.<br>내가 조립한 가사를 불러와요.', ['p09Load'], createUI({}));
      $('p09Load').onclick = () => { playClick(); stepWand(); };
    }
    function stepWand() {
      show('마법봉을 클릭해요.<br>내가 입력한 내용에 맞게<br>Suno가 가사를 만들어줄 거예요.', [], createUI({ lyr: lyrics }));
      on($('s6Wand1'), stepMade, { x: 0.5, dx: 25 });
    }
    function stepMade() {
      state.shownVer = 0;
      show('가사가 완성됐어요!<br>전체화면 버튼을 클릭해<br>가사를 자세히 읽어봐요.', [], createUI({ lyr: VERSIONS[0] }));
      on($('s6Exp1'), stepReview, { x: 0.5, dx: 25, dy: -10 });
    }
    function showFull(v) {
      state.shownVer = v;
      const t = $('s6FullTx');
      t.textContent = VERSIONS[v];
      t.scrollTop = 0;
      $('s6Prev').classList.toggle('is-dis', v === 0);
      $('s6Next2').classList.toggle('is-dis', v === 1);
    }
    function stepReview() {
      show('가사를 다시 만들고 싶다면<br>하단의 마법봉 버튼을, 그대로 사용하고 싶다면 체크 버튼을 클릭해요.', [], fullUI(0));
      showFull(0);
      on($('s6Wand'), stepSecond, false);
      on($('s6Check'), () => choose(0), false);
      pulse($('s6Wand'));
      pulse($('s6Check'));
      pointFingerAt($('s6Check'), { onMain: true, x: 0.5, dx: 25, dy: -10 });
    }
    function stepSecond() {
      show('두 번째 버전의 가사가<br>만들어졌어요!', ['p09Next'], fullUI(1));
      showFull(1);
      nextBtn.onclick = () => setTimeout(stepCompare, 300);
    }
    function stepCompare() {
      show('아래의 화살표를 클릭해 가사를 비교해서 읽어보고, 체크 버튼을 눌러 무엇을 사용할 지 결정해요.', [], fullUI(1));
      showFull(1);
      on($('s6Prev'), () => { clearFingers(); showFull(0); }, false);
      on($('s6Next2'), () => { clearFingers(); showFull(1); }, false);
      on($('s6Check'), () => choose(state.shownVer), false);
      pulse($('s6Prev'));
      pulse($('s6Next2'));
      pointFingerAt($('s6Prev'), { onMain: true, x: 0.5, dy: -5 });
    }
    function choose(v) {
      state.ver = v;
      show('이제 노래 스타일을<br>입력해볼까요?<br>스타일 입력창을 클릭해요.', [], createUI({ lyr: VERSIONS[v] }));
      on($('s6Sty'), stepGenre, { x: 0.5, dx:120, dy: -50 });
    }
    function stepGenre() {
      show('우리는 다양한 스타일의<br>노래를 만들 수있어요!<br>키워드를 클릭해봐요.', ['p09Genres'], createUI({ lyr: VERSIONS[state.ver] }));
      $('p09Genres').querySelectorAll('.card-btn').forEach((b) => {
        b.onclick = () => {
          playClick();
          state.genre = b.dataset.genre;
          show('이제 모든 준비가 끝났어요.<br>만들기 버튼을 눌러<br>노래를 만들어봐요!', [], createUI({ lyr: VERSIONS[state.ver], sty: GENRE_NAME[state.genre] }));
          on($('s6Make'), stepLoading, { x: 0.5, dx:100, dy: -25 });
        };
      });
    }
    function stepLoading() {
      show('노래가 만들어지고 있어요.', [], songsUI({ loading: true }), 's6-cream');
      setTimeout(stepSongs, 2000);
    }
    function songSrc() { return 'sound/p09_song_v' + (state.ver + 1) + '_' + state.genre + '.mp3'; }
    function play() {
      if (audio) audio.pause();
      audio = new Audio(songSrc());
      audio.play().catch(() => {});
    }
    function stepSongs() {
      show('완성됐어요!<br>노래를 클릭해<br>하나씩 들어볼까요?', [], songsUI(), 's6-cream');
      const rows = Array.from(screen.querySelectorAll('.p09-song'));
      pointFingerAt(rows[0], { onMain: true, x: 0.4, dx: 70, dy: -45 });
      let played = false;
      rows.forEach((row) => row.addEventListener('click', (e) => {
        if (e.target.closest('.more')) return;
        rows.forEach((r) => r.classList.toggle('is-playing', r === row));
        play();
        if (!played) {
          played = true;
          setTimeout(() => stepChoose(rows), 1500);
        }
      }));
    }
    function stepChoose(rows) {
      bubble.innerHTML = '마음에 드는 노래를<br>선택해 다운로드 해봐요.';
      clearFingers();
      rows.forEach((row) => {
        const more = row.querySelector('.more');
        more.classList.remove('is-off');
        pulse(more);
        more.onclick = (e) => { e.stopPropagation(); playClick(); stepDownload(); };
      });
      pointFingerAt(rows[0].querySelector('.more'), { onMain: true, x: 0.5, dx: 25, dy: -5 });
    }
    function stepDownload() {
      show('다운로드 버튼을 클릭해요.', [], downloadUI(), 's6-cream');
      on($('s6Dl'), stepFinal, { x: 0.8, dy: -25 });
    }
    function stepFinal() {
      if (audio) audio.pause();
      clearFingers();
      $('p09Play').classList.add('is-off');
      $('p09FinalView').classList.remove('is-off');
      $('p09FinalPlay').onclick = play;
    }

    stepHome();
  })();
  </script>
</body>
</html>
