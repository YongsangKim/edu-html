<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀴즈 풀기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 기획서 55~57p. Q1·Q2(4지선다) · Q3(2지선다). 정답/오답 팝업은 공용 아바타 팝업(기능 V) */
        .quiz-opts.is-row{top:500px;gap:40px}
        .quiz-opts.is-grid{top:480px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="quiz-stage">
          <div class="step-flow">

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q1.</span>
                  <p class="quiz-ask">우리 사회에 법과 규칙이 필요한 이유는<br>무엇일까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-grid is-long">
                <button class="answer-pick card-btn" data-correct="false">모두가 차등 없이 똑같이 생활하기 위해서</button>
                <button class="answer-pick card-btn" data-correct="false">사람들의 자유로운 행동을 막기 위해서</button>
                <button class="answer-pick card-btn" data-correct="true">모두가 안전하게 질서를 지키며 살아가기 위해서</button>
                <button class="answer-pick card-btn" data-correct="false">어른이 정한 말을 무조건 따르기 위해서</button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q2.</span>
                  <p class="quiz-ask">Papago가 도와줄 수 있는 일은 무엇일까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-grid is-long">
                <button class="answer-pick card-btn" data-correct="false">안내 문장에 어울리는 그림 그리기</button>
                <button class="answer-pick card-btn" data-correct="true">한국어 규칙 문장을 다른 언어로 번역하기</button>
                <button class="answer-pick card-btn" data-correct="false">공공장소에서 지켜야 할 규칙 만들기</button>
                <button class="answer-pick card-btn" data-correct="false">규칙을 지키지 않는 사람 찾아내기</button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q3.</span>
                  <p class="quiz-ask">AI 번역을 사용할 때 바른 방법은 무엇일까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-list is-row" data-next="page15.html">
                <button class="answer-pick card-btn" data-correct="true">의미가 잘 전달되도록 짧고 분명한 문장을 입력한다.</button>
                <button class="answer-pick card-btn" data-correct="false">번역 결과를 한번 더 확인하지 않고 그대로 사용한다.</button>
              </div>
            </div>

          </div>

          <div class="ox-result-correct is-avatar is-off" data-sound="sound/correct.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_correct.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">정답이에요!</p>
              </div>
              <div class="avatar-popup-extra"><img src="../../img/common/icon_correct.png" alt=""></div>
            </div>
          </div>
          <div class="ox-result-wrong is-avatar is-off" data-sound="sound/incorrect.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">다시 한번 생각해볼까요?</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="퀴즈 풀기" data-next="page15.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
