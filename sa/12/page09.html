<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>짧고 분명한 안내 문장 만들기</title>
    <link href="https://fonts.googleapis.com/earlyaccess/notosanssc.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 기획서 36~53p. 라운드 3개(잔디밭·임산부 배려석·정자)가 같은 흐름: ① 안내하기 좋은 문장 4개 중 고르기 → 사진 속 안내문에 문장이 적힘
           → ② Papago 번역 앱을 따라 해 보기(잔디밭=음성, 임산부 배려석=글자 입력, 정자=이미지) → 번역 결과 + 다음. 마지막 라운드 뒤 '좋아요!' 팝업 → 다음 페이지.
           앱 화면은 js/papago.js(PP) 로 그림. 사진: img/photo_*.png, 사진 위 안내문 자리는 사진 크기에 대한 %(box)로 맞춤.
           TTS 소리: sound/sa12_tts_{lawn,subway}.mp3 가 있으면 그 소리, 없으면 브라우저 음성으로 대신 */
        /* .p09-q{font-size:46px} */
        .p09-photo{position:absolute;left:490px;top:175px;width:940px;height:530px;box-sizing:border-box;overflow:hidden;background:var(--c-white);border:solid 6px var(--c-ink);border-radius:30px;box-shadow:0 14px 0 0 rgba(86,148,231,.2)}
        .p09-photo.is-crop{left:760px;top:190px;width:860px;height:580px}
        .p09-pic{position:absolute;display:block}
        .p09-pic img{display:block;width:100%;height:100%;object-fit:cover}
        .p09-ov{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;line-height:1.3;letter-spacing:-0.02em;font-family:'Pretendard';overflow:hidden;border-radius:.4em}
        .card-btns{position:absolute;left:150px;top:730px;width:1620px;display:grid;grid-template-columns:1fr 1fr;gap:30px 40px}
        .card-btn{height:80px;font-size:50px;padding:8px 20px}
        .card-btn .mk{margin-right:14px;font-family:'Pretendard';font-size:40px;font-weight:700}
        /* .card-btn:hover{transform:translateY(-3px);border-color:var(--c-pink)} */
        /* .card-btn.is-right{border-color:var(--c-pink);box-shadow:0 0 0 8px rgba(255,14,128,.28);pointer-events:none} */
        .card-btn.is-lock{pointer-events:none}
        .p09-phone{left:230px;top:178px;transform:scale(.79);transform-origin:0 0}
        .p09-next.next-btn.card-btn.is-start{bottom:20px;right:535px}
        .p09-next.is-off{display:none}
        #p09Wrong,#p09Tip,#p09Done{z-index:120}
        .p09-hide{display:none}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <p class="p09-q ask-pill is-fit is-medium is-tight" id="p09Q"><span></span></p>

          <div class="p09-photo" id="p09Photo"></div>
          <div class="card-btns" id="p09Opts"></div>

          <div class="phone-frame has-cam p09-phone p09-hide" id="p09Phone"><div class="phone-screen" id="p09Screen"></div></div>
          <button type="button" class="card-btn is-start p09-next next-btn is-off js-sfx" id="p09Next" data-sound="sound/click.mp3">다음</button>

          <div class="avatar-modal is-wrong is-off" id="p09Wrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body is-finish is-side">
                <p class="avatar-popup-sub is-small is-tight" id="p09WrongP"></p>
                <button type="button" class="avatar-popup-next card-btn is-popup next-btn js-sfx" id="p09WrongOk" data-sound="sound/click.mp3">확인</button>
              </div>
            </div>
          </div>
          <div class="avatar-modal is-off" id="p09Tip">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_correct.png" alt=""></div>
              <div class="avatar-popup-body is-finish is-side">
                <p class="avatar-popup-sub" id="p09TipP"></p>
                <button type="button" class="avatar-popup-next card-btn is-popup js-sfx" id="p09TipOk" data-sound="sound/click.mp3">확인</button>
              </div>
            </div>
          </div>
          <div class="avatar-modal is-off" id="p09Done">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_correct.png" alt=""></div>
              <div class="avatar-popup-body is-finish is-side">
                <p class="avatar-popup-text">좋아요!</p>
                <p class="avatar-popup-sub">번역기를 사용하여 관광객에게<br>각 나라의 언어로 안내했어요.</p>
                <a href="page10.html" class="js-nav-effect avatar-popup-next card-btn is-popup js-sfx" data-sound="sound/click.mp3">다음</a>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="짧고 분명한 안내 문장 만들기" data-next="page10.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
  <script src="../../js/papago.js"></script>
  <script>
  (function () {
    const PHOTOS = {
      lawn: { src: 'img/photo_park_blank.png', ratio: 768 / 1367, pick: [0, 0, 100], crop: [20, 24, 60] },
      subway: { src: 'img/photo_subway_blank.png', ratio: 843 / 1264, pick: [0, 2, 100], crop: [53, 4, 48] },
      pavilion: { src: 'img/photo_pavilion.png', ratio: 1024 / 1536, pick: [0, 8, 100], crop: [48, 18, 51] }
    };
    const ROUNDS = [
      { key: 'lawn', mode: 'voice', to: '영어', delay: 2000,
        opts: ['잔디밭을 조심해주세요.', '잔디밭에서 천천히 걸으세요.', '잔디밭에 들어가지 마세요.', '잔디밭에서 뛰지 마세요.'], right: 2,
        wrong: '잔디를 보호하기 위해 출입을 금지하는 안내문이 필요해요.<br>전달해야 할 의미가 분명하게 드러나는 문장은 무엇인가요?',
        ov: { box: [18.6, 43.5, 62.6, 25], html: '잔디밭에 들어가지 마세요.', fs: 3, color: '#222' },
        ask: '음성 기능을 이용하여 미국인 관광객에게 안내문의 내용을 알려줘요.',
        src: '잔디밭에 들어가면 안 돼요.', out: 'Don’t go onto the lawn.', pron: '돈트 고 온투 더 론', tts: ['sa12_tts_lawn.mp3'],
        tip: '여기에서는 준비된 목소리가 나와요!<br>실제 어플을 사용할 때는 내가 직접 말해요.' },
      { key: 'subway', mode: 'text', to: '중국어(간체)', delay: 2000,
        opts: ['이 자리를 잘 이용해 주세요.', '빈자리에 가방을 놓아주세요.', '아이만 앉을 수 있어요.', '임산부를 위해 자리를 비워주세요.'], right: 3,
        wrong: '지하철의 분홍색 좌석은 임산부 배려석이에요.<br>전달해야 할 의미가 분명하게 드러나는 문장은 무엇인가요?',
        ov: { box: [65.8, 4, 21.4, 40], html: '임산부를 위해<br>자리를<br>비워주세요.', fs: 2.5, color: '#222' },
        ask: '문장을 직접 입력하여 중국인 관광객에게 안내문의 내용을 알려줘요.',
        input: '임산부를 위해 자리를 비워주세요.', big: '请为孕妇腾出座位。', pron: 'qǐng wèi yùnfù téngchū zuòwèi' },
      { key: 'pavilion', mode: 'image', to: '일본어', delay: 1000,
        opts: ['신발을 벗고 올라가세요.', '신발을 깨끗하게 해주세요.', '신발 바닥을 닦고 올라가세요.', '정자에 올라간 뒤 신발을 벗으세요.'], right: 0,
        wrong: '정자는 신발을 벗고 이용하는 공간이에요.<br>전달해야 할 의미가 분명하게 드러나는 문장은 무엇인가요?',
        ov: { box: [81.5, 22.5, 13.6, 28.5], html: '신발을 벗고<br>올라가세요.', fs: 2, color: '#3b2a18' },
        ask: '이미지 기능을 이용하여 일본인 관광객에게 안내문의 내용을 알려줘요.',
        jp: '靴を脱いで<br>上がってください。', cam: { pos: '89% 50%', box: [38, 24, 30, 26] },
        tip: '여기에서는 준비된 사진이 나와요!<br>실제 어플을 사용할 때는 내가 직접 사진을<br>찍어요.' }
    ];
    const MARK = ['', '', '', ''];
    let ri = 0, answered = false;
    const photo = $('p09Photo'), opts = $('p09Opts'), phone = $('p09Phone'), screen = $('p09Screen'), next = $('p09Next');
    const setQ = (t) => { $('p09Q').firstElementChild.textContent = t; };

    function drawPic(view, withText) {
      const r = ROUNDS[ri], ph = PHOTOS[r.key];
      const bw = photo.clientWidth, bh = photo.clientHeight;
      const w = bw * 100 / view[2], h = w * ph.ratio;
      const pic = document.createElement('div');
      pic.className = 'p09-pic';
      pic.style.cssText = 'width:' + w + 'px;height:' + h + 'px;left:' + (-view[0] / 100 * w) + 'px;top:' + (-view[1] / 100 * h) + 'px;font-size:' + (w / 100) + 'px';
      pic.innerHTML = '<img src="' + ph.src + '" alt="">';
      const o = r.ov;
      const ov = document.createElement('div');
      ov.className = 'p09-ov';
      ov.id = 'p09Ov';
      ov.style.cssText = 'left:' + o.box[0] + '%;top:' + o.box[1] + '%;width:' + o.box[2] + '%;height:' + o.box[3] + '%;font-size:' + o.fs + 'em;color:' + o.color + (o.bg ? ';background:' + o.bg : '');
      ov.innerHTML = withText ? o.html : '';
      pic.appendChild(ov);
      photo.innerHTML = '';
      photo.appendChild(pic);
    }

    function pickPhase() {
      const r = ROUNDS[ri];
      answered = false;
      setQ('관광객에게 안내하기 좋은 문장을 선택해봐요.');
      photo.classList.remove('is-crop');
      phone.classList.add('p09-hide');
      next.classList.add('is-off');
      photo.style.display = '';
      opts.style.display = '';
      drawPic(PHOTOS[r.key].pick, false);
      opts.innerHTML = '';
      r.opts.forEach((t, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'card-btn';
        b.innerHTML = '<span class="mk">' + MARK[i] + '</span>' + t;
        b.addEventListener('click', () => pickOpt(b, i));
        opts.appendChild(b);
      });
    }

    function pickOpt(b, i) {
      const r = ROUNDS[ri];
      if (answered) return;
      if (i !== r.right) {
        playWrong();
        $('p09WrongP').innerHTML = r.wrong;
        $('p09Wrong').classList.remove('is-off');
        return;
      }
      answered = true;
      playCorrect();
      b.classList.add('is-right');
      opts.querySelectorAll('.card-btn').forEach((x) => x.classList.add('is-lock'));
      $('p09Ov').innerHTML = r.ov.html;
      setTimeout(phonePhase, r.delay);
    }

    function show(html) { PP.mount(screen, html); }
    function finger(name) {
      clearFingers();
      const el = screen.querySelector('[data-hot="' + name + '"]');
      if (el) setTimeout(() => { if (el.isConnected) pointFingerAt(el, { onMain: true, dx: -10, dy: -20 }); }, 300);
    }
    function showNext() { next.classList.remove('is-off'); }
    function tip(html, then) {
      $('p09TipP').innerHTML = html;
      $('p09Tip').classList.remove('is-off');
      $('p09TipOk').onclick = () => { $('p09Tip').classList.add('is-off'); then(); };
    }

    let handler = null;
    screen.addEventListener('click', (e) => {
      const t = e.target.closest('[data-hot]');
      if (t && handler) { playClick(); const h = handler; clearFingers(); h(t.dataset.hot); }
    });
    function step(html, hotName, fn) {
      show(html);
      handler = fn;
      if (hotName) finger(hotName);
    }

    function phonePhase() {
      const r = ROUNDS[ri], ph = PHOTOS[r.key];
      photo.style.display = '';
      opts.style.display = 'none';
      setQ(r.ask);
      photo.classList.add('is-crop');
      drawPic(ph.crop, true);
      phone.classList.remove('p09-hide');
      next.classList.add('is-off');
      if (r.mode === 'voice') voiceFlow(r);
      else if (r.mode === 'text') textFlow(r);
      else imageFlow(r);
    }

    function voiceFlow(r) {
      step(PP.home({ to: r.to, hot: ['voice'] }), 'voice', () => {
        tip(r.tip, () => {
          show(PP.voice({ to: r.to, state: 'listen' }));
          handler = null;
          PP.speak(r.src, 'ko-KR', r.tts[0]);
          setTimeout(() => show(PP.voice({ to: r.to, state: 'result', src: r.src, out: '' })), 400);
          setTimeout(() => { show(PP.voice({ to: r.to, state: 'result', src: r.src, out: r.out, pron: r.pron })); showNext(); }, 1800);
        });
      });
    }
    function textFlow(r) {
      step(PP.home({ to: r.to, hot: ['input'] }), 'input', () => {
        step(PP.text({ to: r.to, kb: true, sug: r.input, hot: ['sug'] }), 'sug', () => {
          show(PP.text({ to: r.to, input: r.input, result: { big: r.big, pron: r.pron } }));
          handler = null;
          showNext();
        });
      });
    }
    function imageFlow(r) {
      const ph = PHOTOS[r.key];
      step(PP.home({ to: r.to, hot: ['image'] }), 'image', () => {
        tip(r.tip, () => {
          const sign = [{ box: r.cam.box, html: r.ov.html, fs: 22, bg: 'transparent' }];
          step(PP.cam({ to: r.to, photo: ph.src, pos: r.cam.pos, overlays: sign, hot: ['shoot'] }), 'shoot', () => {
            show(PP.cam({ to: r.to, photo: ph.src, pos: r.cam.pos, overlays: sign, load: true }));
            handler = null;
            setTimeout(() => {
              show(PP.cam({ to: r.to, photo: ph.src, pos: r.cam.pos, mode: 'result', overlays: [{ box: r.cam.box, html: r.jp, fs: 22, bg: 'transparent' }] }));
              showNext();
            }, 1000);
          });
        });
      });
    }

    next.addEventListener('click', () => {
      next.classList.add('is-off');
      ri += 1;
      if (ri >= ROUNDS.length) { $('p09Done').classList.remove('is-off'); return; }
      pickPhase();
    });
    $('p09WrongOk').addEventListener('click', () => $('p09Wrong').classList.add('is-off'));
    pickPhase();
  })();
  </script>
</body>
</html>
