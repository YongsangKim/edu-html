<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀴즈 풀기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 와이어프레임. sa/01/page16.html(QUIZ) 구조를 그대로 복제 -
           Q1은 다중선택(정답 2개), Q2·Q3은 단일선택.
           질문 박스·선택지 버튼은 공용 .quiz-ask-box / .card-btn.is-quiz, 문구는 기획서 44~49p. Q3은 기획서대로 선택지 4개(2x2) */
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="quiz-stage">
          <div class="step-flow">

            <div class="step-panel p12-panel p12-q1">

              <div class="quiz-ask-box">

                <div class="quiz-ask-row">

                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>

                  <span class="quiz-qnum">Q1.</span>

                  <p class="quiz-ask">나의 자랑거리를 소개하는 뉴스 기사를 만들 때 반드시 들어가야 할 내용은 무엇인가요? 모두 골라보세요.</p>

                </div>

              </div>
              <div class="answer-pick-quiz quiz-opts is-row" data-wrong="<span>집주소, 전화번호, 학교 이름은 소중한 개인정보라서<br>다른 사람에게 함부로 알려주면 안 돼요!</span>">
                <button class="answer-pick card-btn is-quiz is-long" data-correct="true" aria-label="자랑하고 싶은 일">자랑하고<br>싶은 일</button>
                <button class="answer-pick card-btn is-quiz is-long" data-correct="false" aria-label="집 주소와 전화번호">집 주소와<br>전화번호</button>
                <button class="answer-pick card-btn is-quiz is-long" data-correct="true" aria-label="자랑스러운 이유">자랑스러운<br>이유</button>
                <button class="answer-pick card-btn is-quiz is-long" data-correct="false" aria-label="학교 이름과 나의 반">학교 이름과<br>나의 반</button>
              </div>
            </div>

            <div class="step-panel p12-panel p12-q2">

              <div class="quiz-ask-box">

                <div class="quiz-ask-row">

                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>

                  <span class="quiz-qnum">Q2.</span>

                  <p class="quiz-ask">Canva에서 화면의 전체적인 분위기를 한 번에 꾸밀 수 있도록 미리 만들어져 제공되는 동영상 배경의 이름을 무엇이라고 할까요?</p>

                </div>

              </div>
              <div class="answer-pick-quiz quiz-opts is-row" data-right="<span>Canva의 <b>템플릿</b> 기능을 이용하면<br>동영상 배경을 한 번에 쉽게 꾸밀 수 있어요!</span>">
                <button class="answer-pick card-btn is-quiz" data-correct="false" aria-label="텍스트 블록">텍스트 블록</button>
                <button class="answer-pick card-btn is-quiz" data-correct="true" aria-label="템플릿">템플릿</button>
                <button class="answer-pick card-btn is-quiz" data-correct="false" aria-label="업로드 요소">업로드 요소</button>
              </div>
            </div>

            <div class="step-panel p12-panel p12-q3">

              <div class="quiz-ask-box">

                <div class="quiz-ask-row">

                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>

                  <span class="quiz-qnum">Q3.</span>

                  <p class="quiz-ask">나의 소식을 담은 뉴스를 만들어 디지털 공간에 공유할 때, 과도한 사생활 노출을 막기 위해 지켜야 할 원칙은 무엇일까요?</p>

                </div>

              </div>
              <div class="answer-pick-quiz quiz-opts is-grid" data-next="page13.html" data-wrong="<span>나의 소식을 디지털 공간에 공유할 때는<br>개인정보가 포함되지 않았는지 꼭 확인해야 해요.</span>">
                <button class="answer-pick card-btn is-quiz" data-correct="false" aria-label="재미있게 말하기">재미있게 말하기</button>
                <button class="answer-pick card-btn is-quiz" data-correct="false" aria-label="좋아요를 많이 받기">좋아요를 많이 받기</button>
                <button class="answer-pick card-btn is-quiz" data-correct="false" aria-label="사진을 많이 넣기">사진을 많이 넣기</button>
                <button class="answer-pick card-btn is-quiz" data-correct="true" aria-label="개인정보 보호 수칙">개인정보 보호 수칙</button>
              </div>
            </div>

          </div>

          <div class="ox-result-correct is-avatar is-off" data-sound="sound/correct.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_correct.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">정답이에요!</p>
              </div>
              <div class="avatar-popup-extra"><img src="../../img/common/icon_correct.png" alt=""></div>
            </div>
          </div>
          <div class="ox-result-wrong is-avatar is-off" data-sound="sound/incorrect.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="hint-title">힌트</p>
                <p class="avatar-popup-text is-small">문장을 다시 한 번 잘 읽어봐요.</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="퀴즈 풀기" data-next="page13.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
