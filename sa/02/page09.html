<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 자랑거리를 소개하는 뉴스</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 기획서 26p 도입 화면. gwa/03 page12와 같은 구성: 리본 제목 + 안내 문장 + '활동 방법' 상자(다른 차시 활동 안내와 같은 이름표) */
        main{position:absolute;left:0;top:120px;width:1920px;height:960px}
        .intro-panel.p-how-panel{justify-content:flex-start;gap:60px;padding:100px 60px 170px 70px}
        .intro-tab{top:-60px;font-size:56px;letter-spacing:-0.08em;line-height:1.8em}
        .p-how-lead{margin:0;font-size:56px;line-height:1.3;color:#1b1738;letter-spacing:-0.06em;text-align:center}
        .p-how{position:relative;margin:0;padding:56px 40px 30px;border:solid 5px #023187;border-radius:12px;background:#dff4fc}
        .p-how b{position:absolute;left:50%;top:-34px;transform:translateX(-50%);height:66px;padding:4px 50px 0;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;
          font-weight:normal;background:#023187;border-radius:33px;font-size:40px;color:#fff}
        .p-how .intro-list{font-size:44px;color:#023187}
        .p-how .intro-list li + li{margin-top:14px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="intro-character"><img src="img/p_character_intro.png" alt="메인 캐릭터"></div>
          <div class="intro-panel p-how-panel">
            <p class="intro-tab">나의 자랑거리를 소개하는 뉴스</p>
            <p class="p-how-lead">단독 보도!<br>나의 자랑거리를 소개하는 뉴스를 만들어요.</p>
            <div class="p-how">
              <b>활동 방법</b>
              <ol class="intro-list">
              <li>1. 내가 만든 템플릿을 불러와요.</li>
              <li>2. 텍스트 기능을 사용해 내가 만든 기사문 텍스트 블록을 뉴스에 삽입해요.</li>
              </ol>
            </div>
          </div>

          <a href="page10.html" class="js-nav-effect next-btn-activity">
            <img src="../../img/common/btn_start.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_start_on.png" data-src-over="../../img/common/btn_start_over.png" data-sound="sound/click.mp3" alt="시작하기">
          </a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="나의 자랑거리를 소개하는 뉴스" data-next="page10.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
