<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 뉴스데스크 꾸미기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* --desk(이미지 url)는 공용 CSS에서 var()로 쓰면 css/ 기준으로 풀려 깨지므로 이 규칙들은 페이지에 둠 */
        .cv-canvas, .cv-clips i{background:var(--desk,var(--c-white))}
        /* 디자인 없음 - 기획서 16~25p. 가운데 휴대폰은 기획서 Canva 앱 캡처를 CSS로 그린 것(캡처 이미지 없이 동작).
           템플릿 img/p08_tpl_{a|b|c}.png, 스티커 img/p08_sticker_{1|2}.png는 기획서에 든 이미지. 완성 화면은 템플릿 위에 스티커를 겹침(page10·11도 같은 방식) */
        .p08 .is-off{display:none}



        .cv[data-screen="stickers"] .cv-h{top:226px}
        .cv[data-screen="stickers"] .cv-body{top:264px}


        .cv-sheet, .kbd-db, .cv-chips, .cv-h, .cv-body > *{display:none}
        .cv[data-screen="list"] .cv-sheet, .cv[data-screen="elements"] .cv-sheet, .cv[data-screen="search"] .cv-sheet, .cv[data-screen="stickers"] .cv-sheet{display:block}
        .cv[data-screen="list"] .cv-h, .cv[data-screen="elements"] .cv-h, .cv[data-screen="stickers"] .cv-h{display:block}
        .cv[data-screen="list"] .is-tpl, .cv[data-screen="stickers"] .is-sticker{display:block}
        .cv[data-screen="elements"] .cv-cats{display:grid}
        .cv[data-screen="stickers"] .cv-chips{display:flex}
        .cv[data-screen="search"] .kbd-db{display:block}
        .cv[data-screen="search"] .cv-tabs{display:none}
        .cv[data-screen="search"]>.phone-screen>.phone-nav{background:#dfe2e8}
        .cv[data-screen="search"] .cv-search, .cv[data-screen="search"] .cv-actions{display:none}
        .cv[data-screen="search"] .cv-qbox, .cv[data-screen="stickers"] .cv-qbox{display:block}
        .cv[data-screen="stickers"] .cv-search, .cv[data-screen="stickers"] .cv-actions{display:none}
        .cv.is-typed .cv-sug{display:block}
        .cv[data-screen="list"] .cv-actions, .cv[data-screen="elements"] .cv-actions{display:none}
        .cv[data-screen="list"] .cv-h, .cv[data-screen="elements"] .cv-h{top:116px}
        .cv[data-screen="list"] .cv-body, .cv[data-screen="elements"] .cv-body{top:154px}


        .p08-type-btn{position:absolute;left:1374px;top:392px;width:367px;height:161px;font-size:56px;line-height:1.15}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default p08">
          <div class="guide-set is-main" id="p08Set">
            <p class="guide-bubble is-center" id="p08Bubble"></p>
            <div class="guide-character"><img id="p08Char" src="../img/character/sa_main.png" alt="메인 캐릭터"></div>
          </div>

          <div class="phone-frame has-cam cv has-nav" id="p08Phone" data-screen="home">
            <div class="phone-screen">
            <div class="phone-status"><span>13:13</span><span class="sys"><i data-ic="mute"></i><i data-ic="wifi"></i><i data-ic="sig"></i><em>64</em></span></div>
            <div class="cv-top">
              <i data-ic="home"></i>
              <i data-ic="undo" class="cv-undo"></i>
              <i data-ic="redo" class="cv-undo is-dim"></i>
              <span class="is-gap"></span>
              <i data-ic="dotsH"></i>
              <i data-ic="crownPro" style="color:#e3d8ff"></i>
              <i data-ic="expandDiag"></i>
              <i data-ic="out"></i>
            </div>

            <div class="cv-editor">
              <div class="cv-canvas" id="p08Canvas"></div>
              <div class="cv-play"><b>0:00</b><i></i><span>0:05</span></div>
              <div class="cv-ruler"><span>0초</span><i style="left:364px"></i><i style="left:434px"></i><i style="left:504px"></i></div>
              <div class="cv-head"></div>
              <div class="cv-row is-el"><i data-ic="elements"></i>요소 추가</div>
              <div class="cv-row is-media"><i data-ic="plus"></i><span>미디어 추가</span><b>+</b><div class="cv-clips"><i></i><i></i></div></div>
              <div class="cv-row is-audio"><i data-ic="note"></i>오디오 추가</div>
            </div>

            <div class="cv-sheet">
              <button type="button" class="cv-search" id="p08Search" data-hit="searchbar">
                <span id="p08SearchLead"></span>
                <span class="cv-search-text" id="p08SearchText"></span>
                <span id="p08SearchEnd"></span>
              </button>
              <div class="cv-actions">
                <div class="cv-gen"><span>생성</span><i><i data-ic="chev"></i></i></div>
                <button type="button" class="cv-find">검색</button>
              </div>
              <div class="cv-qbox" id="p08QBox">
                <div class="cv-qrow"><i data-ic="back"></i><span class="cv-qtext" id="p08QText"></span><span class="cv-clear">✕</span></div>
                <div class="cv-qrow is-tools"><i data-ic="plus"></i><i data-ic="set"></i><button type="button" class="cv-qgo" data-hit="search" aria-label="검색"><i data-ic="forward"></i></button></div>
              </div>
              <div class="cv-sug"><p>추천</p><div><i data-ic="search"></i>아나운서 마이크</div></div>
              <div class="cv-chips"><span>전체</span><span class="is-on">그래픽</span><span>동영상</span><span>사진</span><span>오디오</span><span>도형</span><span>프레임</span></div>
              <p class="cv-h" id="p08SheetTitle"></p>
              <div class="cv-body" id="p08Body">
                <button type="button" class="cv-pick is-tpl" data-kind="tpl" data-pick="a" style="background-image:url('img/p08_tpl_a.png')" aria-label="아침 뉴스 템플릿"></button>
                <button type="button" class="cv-pick is-tpl" data-kind="tpl" data-pick="b" style="background-image:url('img/p08_tpl_b.png')" aria-label="9시 뉴스 템플릿"></button>
                <button type="button" class="cv-pick is-tpl" data-kind="tpl" data-pick="c" style="background-image:url('img/p08_tpl_c.png')" aria-label="연예 뉴스 템플릿"></button>
                <div class="cv-cats">
                  <div><i style="background:linear-gradient(135deg,#ff6b6b,#d63a4a)">♫</i>오디오</div>
                  <div><i style="background:linear-gradient(135deg,#e46cf0,#a33de0)">▶</i>동영상</div>
                  <div><i style="background:linear-gradient(135deg,#6aa8ff,#3c6fe0)">▣</i>사진</div>
                  <div><i style="background:linear-gradient(135deg,#ff9f45,#f06a2a)">✿</i>그래픽</div>
                  <div><i style="background:linear-gradient(135deg,#c06cf5,#7b4ae6)">◆</i>3D</div>
                  <div><i style="background:linear-gradient(135deg,#5ccf7a,#2f9e55)">☺</i>애니메이션</div>
                  <div><i style="background:linear-gradient(135deg,#6fd59a,#3aa86b)">☁</i>프레임</div>
                  <div><i style="background:linear-gradient(135deg,#d58cf7,#a35ae8)">▦</i>그리드</div>
                </div>
                <button type="button" class="cv-pick is-sticker" data-kind="sticker" data-pick="1" style="background-image:url('img/p08_sticker_1.png')" aria-label="여자 아나운서 스티커"></button>
                <button type="button" class="cv-pick is-sticker" data-kind="sticker" data-pick="2" style="background-image:url('img/p08_sticker_2.png')" aria-label="남자 아나운서 스티커"></button>
              </div>
            </div>

            <div id="kbdHost"></div>

            <nav class="cv-tabs">
              <button type="button" class="cv-tab" data-tab="template" data-hit="template" data-icon="template"><i></i>추천 템플릿</button>
              <button type="button" class="cv-tab" data-tab="elements" data-hit="elements" data-icon="elements"><i></i>요소</button>
              <button type="button" class="cv-tab" data-icon="text"><i></i>텍스트</button>
              <button type="button" class="cv-tab" data-icon="gallery"><i></i>갤러리</button>
              <button type="button" class="cv-tab" data-icon="brand"><i></i>브랜드 센터</button>
              <button type="button" class="cv-tab" data-icon="upload"><i></i>업로드</button>
            </nav>
            <div class="phone-nav"></div>
            </div>
          </div>

          <button type="button" class="card-btn p08-type-btn is-off" id="p08TypeBtn">아나운서<br>입력하기</button>

          <a href="javascript:;" class="js-sfx next-btn is-off" id="p08Next" data-sound="sound/click.mp3">
            <img src="../../img/common/btn_next_content.png" class="js-img-swap" data-src-alt="../../img/common/btn_next_content_on.png" data-src-over="../../img/common/btn_next_content_over.png" alt="다음">
          </a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="나만의 뉴스데스크 꾸미기" data-next="page09.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
  <script src="../../js/box-edit.js"></script>
  <script>document.getElementById('kbdHost').outerHTML = kbdDbHtml();</script>
  <script>
  (function () {
    const TPL_FEEDBACK = {
      a: '밝고 경쾌한 아침 뉴스<br>스타일을 선택할까요?',
      b: '진지한 9시 뉴스<br>스타일을 선택할까요?',
      c: '화려한 연예 뉴스<br>스타일을 선택할까요?'
    };
    const STEPS = [
      { bubble: '먼저, 템플릿을 골라볼까요?<br>아래의 ‘추천 템플릿’을<br>클릭해요.', screen: 'home', hit: 'template', pose: 'wink_point4' },
      { bubble: '마음에 드는<br>템플릿을 선택해요.', screen: 'list', pick: 'tpl' },
      { bubble: '뉴스 스타일을 선택했어요!<br>이제 아나운서 스티커를<br>붙여봐요.', screen: 'edit', next: true, pose: 'wink_open' },
      { bubble: '아래 편집 도구창에서<br>‘요소’를 클릭해요.', screen: 'edit', hit: 'elements', pose: 'wink_point4' },
      { bubble: '검색창을 클릭해요.', screen: 'elements', hit: 'searchbar', pose: 'wink_point' },
      { bubble: '버튼을 눌러 ‘아나운서’를 입력하고 검색을 클릭해요.', screen: 'search', type: true },
      { bubble: '버튼을 눌러 ‘아나운서’를 입력하고 검색을 클릭해요.', screen: 'search', typed: true, hit: 'search', pose: 'wink_point' },
      { bubble: '넣고 싶은<br>아나운서 스티커를 선택해요.', screen: 'stickers', pick: 'sticker' },
      { bubble: '뉴스 데스크를 모두 꾸몄어요!<br>이제 본격적으로 뉴스를<br>만들어볼까요?', screen: 'edit', result: true, next: true, pose: 'wink_present', href: 'page09.html' }
    ];
    const SEARCH = {
      list: { lead: '', text: '동영상 템플릿 검색', end: 'mic', title: '추천 템플릿' },
      elements: { lead: 'plus', text: '요소를 검색하세요', end: 'mic', title: '카테고리 둘러보기' },
      search: { lead: 'back', text: '요소를 검색하세요', end: 'mic', focus: true },
      typed: { lead: 'back', text: '아나운서', end: 'clear', focus: true, filled: true },
      stickers: { lead: 'plus', text: '아나운서', end: 'clear', filled: true, title: '검색 결과' }
    };
    const ICON = {
      plus: ICONS.plus,
      back: ICONS.back,
      mic: ICONS.mic,
      clear: '<span class="cv-clear">✕</span>'
    };
    const STICKER_LAYER = (s) => "url('img/p08_sticker_" + s + ".png') 0 36% / 66% auto no-repeat, ";
    const deskBg = (tpl, sticker) => (sticker ? STICKER_LAYER(sticker) : '') + "url('img/p08_tpl_" + tpl + ".png') center / cover no-repeat";

    const phone = $('p08Phone');
    const bubble = $('p08Bubble');
    const say = initGuideSay({ bubble: bubble, img: $('p08Char'), set: $('p08Set') });
    const search = $('p08Search');
    const body = $('p08Body');
    const typeBtn = $('p08TypeBtn');
    const nextBtn = $('p08Next');
    const hits = Array.from(phone.querySelectorAll('[data-hit]'));
    const picks = Array.from(phone.querySelectorAll('.cv-pick'));

    const chosen = { tpl: '', sticker: '' };
    // 손가락 위치 보정 [dx, dy] — 단계의 눌러야 할 곳(hit)별. ?edit 로 손가락을 눌러 맞춘 뒤 표시줄 값을 옮겨 적음
    const FG = { template: [0, 0], elements: [0, 0], searchbar: [-30, -30], search: [0, 0] };
    // 클릭 영역 보정 [dx, dy, dw, dh] — 버튼 모양은 그대로, 눌리는 범위만 옮기거나 키움/줄임(?edit 로 맞춘 뒤 표시줄 값을 옮겨 적음)
    const HOT = { template: [0, 0, 0, 0], elements: [0, 0, 0, 0], searchbar: [0, 0, 0, 0], search: [0, 0, 0, 0] };
    BoxEdit.hitPad(hits, HOT);
    let index = 0;

    function render() {
      const step = STEPS[index];
      say(step.bubble, step.pose || 'main');
      phone.dataset.screen = step.screen;
      phone.classList.toggle('is-typed', !!step.typed);
      phone.classList.toggle('is-edited', !!chosen.tpl && step.screen === 'edit');
      phone.style.setProperty('--desk', chosen.tpl ? deskBg(chosen.tpl, step.result && chosen.sticker) : '#fff');

      const s = SEARCH[step.typed ? 'typed' : step.screen];
      if (s) {
        $('p08SearchLead').innerHTML = ICON[s.lead] || '';
        $('p08SearchText').textContent = s.text;
        $('p08SearchEnd').innerHTML = ICON[s.end];
        search.classList.toggle('is-focus', !!s.focus);
        search.classList.toggle('is-filled', !!s.filled);
        $('p08SheetTitle').textContent = s.title || '';
        $('p08QText').textContent = s.text;
        $('p08QBox').classList.toggle('is-filled', !!s.filled);
        $('p08QBox').classList.toggle('is-idle', step.screen === 'stickers');
      }
      body.scrollTop = 0;
      phone.querySelectorAll('.cv-tab').forEach((t) => t.classList.toggle('is-on',
        (t.dataset.tab === 'template' && step.screen === 'list') || (t.dataset.tab === 'elements' && ['elements', 'stickers'].includes(step.screen))));

      typeBtn.classList.toggle('is-off', !step.type);
      nextBtn.classList.toggle('is-off', !step.next);
      resetImageSwap(nextBtn);

      clearFingers();
      hits.forEach((h) => h.classList.toggle('hit-pulse', h.dataset.hit === step.hit));
      const target = hits.find((h) => h.dataset.hit === step.hit);
      if (target) {
        const fg = FG[step.hit] || [0, 0];
        pointFingerAt(target, { onMain: true, beside: true, x: target === search ? 0.5 : 1, dx: fg[0], dy: fg[1] });
        // 하단 탭을 가리킬 때 손가락이 화면(960px) 아래로 잘리지 않게
        if (!BoxEdit.on) document.querySelectorAll('.js-point-finger').forEach((f) => { f.style.top = Math.min(parseFloat(f.style.top), 850) + 'px'; });
      }
    }

    function go() {
      index += 1;
      BoxEdit.syncStep(index + 1);
      render();
    }

    hits.forEach((h) => h.addEventListener('click', () => {
      if (!h.classList.contains('hit-pulse')) return;
      playClick();
      go();
    }));
    typeBtn.addEventListener('click', () => { playClick(); go(); });

    picks.forEach((btn) => btn.addEventListener('click', () => {
      const key = btn.dataset.kind;
      if (STEPS[index].pick !== key) return;
      playClick();
      picks.forEach((b) => { if (b.dataset.kind === key) b.classList.toggle('is-selected', b === btn); });
      chosen[key] = btn.dataset.pick;
      if (key === 'tpl') say(TPL_FEEDBACK[chosen.tpl], STEPS[index].pose || 'main');
      nextBtn.classList.remove('is-off');
    }));

    nextBtn.addEventListener('click', () => {
      const step = STEPS[index];
      if (step.href) {
        try { sessionStorage.setItem('sa02_desk', chosen.tpl + chosen.sticker); } catch (e) {}
        setTimeout(() => navigateTo(step.href), 300);
        return;
      }
      setTimeout(go, 300);
    });

    /* ?edit&step=N : 단계 N 으로 바로 열기(] [ 로 이동). 손가락(FG)·버튼 클릭 영역(HOT)을 클릭해 방향키로 조정(Alt+방향키 = 폭·높이). 앞 단계에서 고르는 값(템플릿 a · 스티커 1)은 미리 채움. 오른쪽 아래 포즈판에서 캐릭터 포즈를 눌러 본 뒤 STEPS 줄의 pose 에 옮겨 적음 */
    const prep = () => { chosen.tpl = chosen.tpl || 'a'; chosen.sticker = index >= 7 ? (chosen.sticker || '1') : chosen.sticker; };
    BoxEdit.stepEdit({
      key: () => STEPS[index].hit || '?',
      count: STEPS.length + 1,
      get: () => index + 1,
      set: (n) => { index = Math.max(0, Math.min(n, STEPS.length) - 1); if (index >= 2) prep(); },
      go: (n) => { if (n < 1) return; index = n - 1; if (index >= 2) prep(); BoxEdit.syncStep(n); render(); },
      label: (n) => '단계 ' + n + ' / ' + STEPS.length,
      say, bubble, img: $('p08Char')
    });
    render();
  })();
  </script>
</body>
</html>
