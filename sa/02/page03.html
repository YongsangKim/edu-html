<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 자랑거리 찾기</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        .p03-note{position:absolute;left:222px;top:95px;width:1476px;height:790px;box-sizing:border-box;background:var(--c-cream);border:solid 6px var(--c-ink);border-radius:20px}
        .p03-tab{position:absolute;left:303px;top:44px;height:95px;padding:5px 60px 0 28px;box-sizing:border-box;display:flex;align-items:center;background:var(--c-sky);border:solid 5px var(--c-ink);border-radius:50px;box-shadow:0 15px 0 0 var(--c-mist);
          font-family:'Cafe24 Ssurround';font-size:56px;color:var(--c-white);letter-spacing:-0.04em;z-index:1}
        .photo-card-title.p03-card-title{display:flex;align-items:flex-start;justify-content:center}
        .p03-card-pencil{width:70px;height:70px;margin-right:12px}
        .p03-pencil{display:block;width:98px;height:98px;margin:-6px 16px 0 0}
        .p03-flow{position:absolute;left:222px;top:165px;width:1476px;display:flex;flex-direction:column;align-items:center}
        .p03-ask{width:100%;margin:10px 0 0 0;text-align:center;font-family:'Cafe24 Ssurround';font-size:60px;line-height:1.25;color:var(--c-ink);letter-spacing:-0.04em;word-break:keep-all}
        .p03-ask em{font-style:normal;background:linear-gradient(transparent 62%,var(--c-yellow) 62%,var(--c-yellow) 90%,transparent 90%)}

        .p03-opts{width:1052px;margin-top:40px;display:flex;flex-direction:column;gap:40px}
        .p03-opts .card-btn{height:100px;font-size:50px;letter-spacing:-0.04em}

        .p03-next{margin-top:50px}
        .p03-next img{display:block}

        .p03-emojis{display:flex;justify-content:center;gap:34px;margin-top:26px}
        .p03-emoji{position:relative;width:104px;height:104px;border-radius:50%;overflow:hidden;border:0;background:none;cursor:pointer;padding:0}
        .p03-emoji img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;pointer-events:none}
        .p03-emoji.is-pop{animation:p03-bounce .45s cubic-bezier(.3,1.6,.5,1)}
        @keyframes p03-bounce{0%{transform:scale(1)}35%{transform:scale(1.3)}100%{transform:scale(1)}}
        .p03-help{margin:22px 0 0;font-size:40px;color:var(--c-blue)}
        .photo-card{border-radius:130px}
        .photo-card-title{font-size:70px}
        .photo-card.is-small .photo-card-img{width:716px;height:342px;border-radius:20px;overflow:hidden;background:none}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="p03-note"></div>
          <div class="p03-tab"><img class="p03-pencil" src="img/p03_pencil.png" alt="">오늘의 취재 질문</div>
          <div class="p03-flow">
            <p class="p03-ask"><span id="p03Ask"></span></p>
            <div class="p03-opts" id="p03Opts"></div>
            <a href="javascript:;" class="js-sfx p03-next is-disabled" id="p03Next" data-sound="sound/click.mp3">
              <img src="../../resources/img/common/btn_next_content.png" class="js-img-swap" data-src-alt="../../resources/img/common/btn_next_content_on.png" data-src-over="../../resources/img/common/btn_next_content_over.png" alt="다음">
            </a>
          </div>

          <div class="photo-modal is-off" id="p03Modal">
            <div class="photo-card is-small" id="p03Card">
              <p class="photo-card-title p03-card-title"><img class="p03-card-pencil" src="img/p03_pencil.png" alt=""><span id="p03CardTitle"></span></p>
              <div class="photo-card-img" id="p03CardImg"></div>
              <p class="photo-card-text" id="p03CardText"></p>
              <div class="p03-emojis">
                <button type="button" class="p03-emoji" aria-label="좋아요"><img src="img/p03_emoji_like.png" alt=""></button>
                <button type="button" class="p03-emoji" aria-label="하트"><img src="img/p03_emoji_heart.png" alt=""></button>
                <button type="button" class="p03-emoji" aria-label="웃는 얼굴"><img src="img/p03_emoji_smile.png" alt=""></button>
                <button type="button" class="p03-emoji" aria-label="별"><img src="img/p03_emoji_star.png" alt=""></button>
              </div>
              <p class="p03-help">반응을 눌러 스스로를 칭찬해요</p>
            </div>
            <a href="page04.html" class="js-nav-effect js-sfx p03-confirm card-btn is-popup" id="p03Confirm" data-sound="sound/click.mp3">확인</a>
          </div>

          <div class="avatar-modal is-off" id="p03Warn">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_quiz.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text is-small">이모지를 눌러 스스로를 칭찬해봐요.</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="나만의 자랑거리 찾기" data-next="page04.html"></script>
  <script src="../../resources/js/toc.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  (function () {
    const TOPICS = {
      effort: {
        ask: '목표를 정하고 꾸준히 <em>노력한 일이 있나요</em>?',
        title: '끈기 취재 카드',
        options: [
          { text: '매일 운동했어요.', card: '매일 꾸준히 운동했어요!' },
          { text: '매일 책을 읽었어요.', card: '매일 꾸준히 책을 읽었어요!' },
          { text: '공부 계획을 지켰어요.', card: '매일 노력해서 공부 계획을 지켰어요!' }
        ]
      },
      praise: {
        ask: '최근에 선생님이나 가족에게 <em>칭찬받은 일이 있나요</em>?',
        title: '칭찬 취재 카드',
        options: [
          { text: '수업에 열심히 참여했어요.', card: '수업을 열심히 들었어요!' },
          { text: '방을 정리했어요.', card: '방을 깨끗하게 정리했어요!' },
          { text: '약속을 잘 지켰어요.', card: '약속을 잘 지켰어요!' }
        ]
      },
      help: {
        ask: '최근에 가족이나 친구를 <em>도와준 일이 있나요</em>?',
        title: '도움 취재 카드',
        options: [
          { text: '집안일을 도왔어요.', card: '집안일을 도왔어요!' },
          { text: '친구의 공부를 도왔어요.', card: '친구의 공부를 도왔어요!' },
          { text: '친구가 힘들 때 이야기를 들어줬어요.', card: '친구가 힘들 때 이야기를 들어줬어요!' }
        ]
      },
      strength: {
        ask: '친구들과 함께할 때 내가 <em>잘하는 것</em>은 무엇인가요?',
        title: '강점 취재 카드',
        options: [
          { text: '함께 문제 해결하기', card: '함께 문제를 해결할 수 있어요!' },
          { text: '친구 이야기 들어주기', card: '친구 이야기를 잘 들어줘요!' },
          { text: '친구 웃게 해주기', card: '친구를 웃게 해줘요!' }
        ]
      }
    };

    const key = new URLSearchParams(location.search).get('topic');
    const topicKey = TOPICS[key] ? key : 'effort';
    const topic = TOPICS[topicKey];

    const askEl = document.getElementById('p03Ask');
    const optsBox = document.getElementById('p03Opts');
    const nextBtn = document.getElementById('p03Next');
    const modal = document.getElementById('p03Modal');
    const card = document.getElementById('p03Card');
    const cardTitle = document.getElementById('p03CardTitle');
    const cardImg = document.getElementById('p03CardImg');
    const cardText = document.getElementById('p03CardText');
    const emojis = Array.from(card.querySelectorAll('.p03-emoji'));
    const warn = document.getElementById('p03Warn');

    let picked = -1;
    let reacted = false;

    askEl.innerHTML = topic.ask;
    cardTitle.textContent = topic.title;

    topic.options.forEach((opt, i) => {
      const btn = makeCardBtn(opt.text, 'is-wide', () => {
        playClick();
        optsBox.querySelectorAll('.card-btn').forEach((b) => b.classList.toggle('is-selected', b === btn));
        picked = i;
        nextBtn.classList.remove('is-disabled');
      }, { parent: optsBox });
    });

    nextBtn.addEventListener('click', () => {
      if (picked < 0) return;
      cardText.textContent = topic.options[picked].card;
      cardImg.style.backgroundImage = "url('img/p03_card_" + topicKey + (picked + 1) + ".jpg')";
      reacted = false;
      emojis.forEach((b) => b.classList.remove('is-selected'));
      modal.classList.remove('is-off');
    });

    emojis.forEach((btn) => {
      btn.addEventListener('click', () => {
        playCorrect();
        emojis.forEach((b) => b.classList.toggle('is-selected', b === btn));
        reacted = true;
        restartAnim(btn, 'is-pop');
        fanfare(btn);
      });
    });

    const fx = makeConfettiLayer();

    function fanfare(btn) {
      burstConfetti({
        layer: fx,
        from: btn,
        at: (r) => [r.left + r.width / 2, r.top + r.height / 2],
        count: 28,
        special: { count: 6, html: btn.innerHTML, scaleFrom: 0, scaleRate: 6 }
      });
    }

    modal.addEventListener('click', (e) => {
      if (reacted || !e.target.closest('#p03Confirm')) return;
      e.preventDefault();
      e.stopPropagation();
      playWrong();
      flashLayer(warn);
    }, true);
  })();
  </script>
</body>
</html>
