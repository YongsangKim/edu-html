<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀴즈형 조작 활동</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        main{position:absolute;left:0;top:120px;width:1920px;height:960px;background:url('img/stage_bg_15.png') no-repeat}
        .page15 a:nth-child(1){position:absolute;left:720px;top:680px}
        .ox-quiz{position:absolute;left:290px;top:380px;width:1300px;height:500px;display:flex;justify-content:space-between;align-items:center}
        .ox-quiz img:nth-child(1){width:435px;height:436px;cursor:pointer}
        .ox-quiz img:nth-child(2){width:373px;height:373px;cursor:pointer}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer"><div id="stage" class="stage">
      <main>
          <div class="page15">

            <div class="ox-quiz" data-answer="x" data-next="page16.html">
              <img class="ox-btn js-img-swap" data-value="o" src="../../img/common/icon_o.png" data-src-alt="../../img/common/icon_o_on.png" alt="O 선택">
              <img class="ox-btn js-img-swap" data-value="x" src="../../img/common/icon_x.png" data-src-alt="../../img/common/icon_x_on.png" alt="X 선택">
            </div>
            <div class="ox-result-correct is-avatar is-off" data-sound="sound/correct.mp3">
              <div class="avatar-popup-panel">
                <div class="avatar-popup-avatar"><img src="../../img/common/avatar_correct.png" alt=""></div>
                <p class="avatar-popup-text">정답이에요!</p>
                <div class="avatar-popup-extra"><img src="../../img/common/icon_correct.png" alt=""></div>
              </div>
            </div>
            <div class="ox-result-wrong is-avatar is-off" data-sound="sound/incorrect.mp3">
              <div class="avatar-popup-panel">
                <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
                <p class="avatar-popup-text is-small">문장을 다시 한 번 잘 읽어봐요.</p>
              </div>
            </div>

          </div>
      </main>

    </div></div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="퀴즈형 조작 활동" data-next="page16.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
