<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조작1: 하루 장면 속 이웃과 역할 연결하기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        main{position:absolute;left:0;top:120px;width:1920px;height:960px;background:url('img/stage_bg_05.png') no-repeat}
        .page05 a:nth-child(1){position:absolute;left:730px;top:790px}
        .line-result-correct {
          position: absolute;
          top: 0; left: 0;
          width: 1920px; height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          background: rgba(27, 23, 56, 0.5);
          z-index:20;
        }
        .line-result-wrong {
          position: absolute;
          top: 0; left: 0;
          width: 1920px; height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          background: rgba(27, 23, 56, 0.5);
          z-index:20;
        }

  .line-quiz-svg {
    position: absolute;
    top: 0; left: 0;
    width: 1920px; height: 1080px;
    pointer-events: none;
  }

  .line-item {
    position: absolute;
    width: 470px; height: 225px;
    border: 2px solid transparent;
    border-radius: 10px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 22px;
    color: #1e3a5f;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  .line-item.right{width:912px}

  .line-item[data-matched="true"] {
    cursor: default;

  }

  .line-quiz-temp {
    stroke: #9aa7b6;
    stroke-width: 4;
    stroke-dasharray: 6 6;
  }

  .line-quiz-line {
    stroke: #fff600;
    stroke-width: 15;
  }
  .line-dot {
    position:relative;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: #a7b4c8;
    border: 3px solid #1b1738;
    cursor: grab;
    flex-shrink: 0;
    touch-action: none;
  }
  .line-dot::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 56px; height: 56px;
    transform: translate(-50%, -50%);
  }
  .line-item[data-matched="true"] .line-dot {
    background: #fff600;
    border-color:#ffa902;
    cursor: default;
  }
  .line-item.right::after {
    content:'';
    position:absolute;
    right:16px;
    top:16px;
    width: 72px;
    height:68px;
    background:url(../../img/common/icon_star.png) no-repeat;
  }
  .line-item.right[data-matched="true"]:after {
    background:url(../../img/common/icon_star_on.png) no-repeat;
  }
  .line-result-next{align-self:center;border:0;background:transparent;cursor:pointer;padding:0}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer"><div id="stage" class="stage">
      <main>
        <div class="page05">
          <div class="line-quiz" data-next="page06.html">
            <div class="line-item left" data-id="1" style="left:54px; top:180px;">&nbsp;<span class="line-dot"></span></div>
            <div class="line-item left" data-id="2" style="left:54px; top:430px;">&nbsp;<span class="line-dot"></span></div>
            <div class="line-item left" data-id="3" style="left:54px; top:685px;">&nbsp;<span class="line-dot"></span></div>

            <div class="line-item right" data-id="1" style="left:955px; top:180px;"><span class="line-dot"></span>&nbsp;</div>
            <div class="line-item right" data-id="3" style="left:955px; top:430px;"><span class="line-dot"></span>&nbsp;</div>
            <div class="line-item right" data-id="2" style="left:955px; top:685px;"><span class="line-dot"></span>&nbsp;</div>

            <svg class="line-quiz-svg" width="1920" height="1080"></svg>
          </div>
          <div class="line-result-correct is-off" data-sound="sound/correct.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_correct.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-sub">이웃은 우리 생활 속에서<br>관계를 맺고 도움을 주고 받는 사람이에요.</p>
                <button class="line-result-next"><img src="img/btn_page04.png" class="js-img-swap js-sfx" data-src-alt="img/btn_page04_on.png" data-src-over="img/btn_page04_over.png" data-sound="sound/click.mp3" alt=""></button>
              </div>
              <div class="avatar-popup-extra"><img src="../../img/common/icon_correct.png" alt=""></div>
            </div>
          </div>
          <div class="line-result-wrong is-off" data-sound="sound/incorrect.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
              <p class="avatar-popup-text is-medium">우리를 도와주는 이웃의 역할을<br>다시 생각해볼까요?</p>
            </div>
          </div>
        </div>
      </main>

    </div></div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="조작1: 하루 장면 속 이웃과 역할 연결하기" data-next="page06.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
