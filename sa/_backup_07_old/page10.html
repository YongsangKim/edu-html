<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리동네 이웃 지도 탐험하기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        main{position:absolute;left:0;top:120px;width:1920px;height:960px;background:url('img/stage_bg_10.png') no-repeat}
        .page10{height:100%}
        .page10 a.link10-01{position:absolute;left:880px;top:420px;width:120px;height:140px;background:rgba(255,255,255,0)}
        .page10 a.link10-03{position:absolute;left:1330px;top:560px;width:115px;height:115px;background:rgba(255,255,255,0)}
        .page10-01 {background:url('img/stage_bg_10_01.png') no-repeat}
        .page10-02 {background:url('img/stage_bg_10_02.png') no-repeat}
        .page10-03 {background:url('img/stage_bg_10_05.png') no-repeat}

        .dnd-zone {
          position: absolute;
          width: 414px; height: 751px;
          background:rgba(0,0,0,0);
          border-radius: 12px;
        }
        .dnd-card {
          position: absolute;
          width:414px;
          height:751px;
          cursor: grab;
          touch-action: none;
          user-select: none;
          -webkit-user-drag: none;
          z-index:10;
        }
        .dnd-card img {
          width: 100%; height: 100%;
          -webkit-user-drag: none;
          user-select: none;
          pointer-events: none;
        }
        .dnd-card[data-placed="true"] {
          width:414px;
          height:751px;
          cursor: default;
        }
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer"><div id="stage" class="stage">
      <main>
          <div class="page10">
            <div class="step-flow">
              <div class="step-panel page10-01">
                <a href="#" data-sound="sound/click.mp3" class="js-nav-effect js-sfx link10-01">
                  <span class="hidden">Google 렌즈</span>
                </a>
                <img class="finger-guide" src="../../img/common/img_finger01.png"
                  data-frame1="../../img/common/img_finger01.png"
                  data-frame2="../../img/common/img_finger02.png"
                  data-interval="400"
                  style="position:absolute; left:970px; top:490px; width:228px;">
              </div>

              <div class="step-panel page10-02">
                <div class="dnd-card" data-correct="true"  style="left:732px; top:112px;"><img src="img/stage_bg_10_03.png" alt=""></div>
                <div class="dnd-zone" style="left:1183px; top:50px;"></div>
                <div class="swipe-guide" style="position:absolute;left:910px;top:400px;z-index:10">
                  <img src="img/stage_bg_10_04.png" alt="">
                  <img class="swipe-guide-finger" src="../../img/common/img_finger01.png" alt=""
                      style="position:absolute;left:0px;top:85px;"
                      data-start-left="0" data-start-top="85"
                      data-end-left="400" data-end-top="48">
                </div>

              </div>

              <div class="step-panel page10-03">
                <a href="page11.html" data-sound="sound/click.mp3" class="js-nav-effect js-sfx link10-03">
                  <span class="hidden">Google 렌즈</span>
                </a>
                <img class="finger-guide" src="../../img/common/img_finger01.png"
                  data-frame1="../../img/common/img_finger01.png"
                  data-frame2="../../img/common/img_finger02.png"
                  data-interval="400"
                  style="position:absolute; left:1410px; top:620px; width:228px;">

              </div>
            </div>
          </div>
      </main>

    </div></div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="우리동네 이웃 지도 탐험하기" data-next="page11.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
