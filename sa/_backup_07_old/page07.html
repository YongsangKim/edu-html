<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조작2: 장소 사진 보고 찾을 정보 고르기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        main{position:absolute;left:0;top:120px;width:1920px;height:960px;background:url('img/stage_bg_07.png') no-repeat}
        .find-quiz{display:grid;grid-template-columns:1fr 1fr;gap:28px 23px;width:635px;position:absolute;left:1198px;top:310px}
        .find-card{position:relative;width:300px;height:126px;cursor:pointer}
        .find-mark{position:absolute;left:0;top:-10%;width:100%;height:120%}
        .find-mark-correct{background:url('../../img/common/icon_o2.png') 50% no-repeat}
        .find-mark-wrong{background:url('../../img/common/icon_x2.png') 50% no-repeat}
        .find-progress{position:absolute;left:1350px;top:210px;display:flex;gap:50px}
        .find-result-correct{position:absolute;left:0;top:0;width:100%;height:100%;background:rgba(27,23,56,.5);display:flex;align-items:center;justify-content:center}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer"><div id="stage" class="stage">
      <main>
          <div class="page07">
            <div class="find-progress">
              <img class="find-star" src="../../img/common/icon_star.png" data-src-on="../../img/common/icon_star_on.png" alt="">
              <img class="find-star" src="../../img/common/icon_star.png" data-src-on="../../img/common/icon_star_on.png" alt="">
              <img class="find-star" src="../../img/common/icon_star.png" data-src-on="../../img/common/icon_star_on.png" alt="">
            </div>
            <div class="find-quiz" data-next="page08.html">
              <div class="find-card" data-correct="true"></div>
              <div class="find-card" data-correct="false"></div>
              <div class="find-card" data-correct="false"></div>
              <div class="find-card" data-correct="true"></div>
              <div class="find-card" data-correct="true"></div>
              <div class="find-card" data-correct="false"></div>
            </div>

            <div class="find-result-correct is-off">
              <div class="avatar-popup-panel">
                <div class="avatar-popup-avatar"><img src="../../img/common/avatar_correct.png" alt=""></div>
                <div class="avatar-popup-body">
                  <p class="avatar-popup-text">좋아요!</p>
                  <p class="avatar-popup-sub">구글 렌즈는 사진 속 장소와 관련된 정보를<br>찾는 데 도움을 줄 수 있어요.</p>
                </div>
                <div class="avatar-popup-extra"><img src="../../img/common/icon_correct.png" alt=""></div>
              </div>
            </div>
          </div>
      </main>

    </div></div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="조작2: 장소 사진 보고 찾을 정보 고르기" data-next="page08.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
