<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배려와 존중의 갈림길</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 기획서 82p 마무리. 미션 성공 패널(다시하기 → page12, 다음 차시 학습하기 → 12차시 첫 화면) + 메인 캐릭터 */

        .p13-title{position:absolute;left:750px;top:60px;width:1100px;margin:0;text-align:center;font-family:'Cafe24 Ssurround';font-size:100px;background:linear-gradient(180deg,#02185c,#0362d7);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-0.06em}
        .p13-panel{position:absolute;left:750px;top:210px;width:1100px;height:560px;box-sizing:border-box;padding:70px 60px 0;display:flex;flex-direction:column;align-items:center;gap:60px;background:var(--c-white);border:solid 6px var(--c-purple);border-radius:50px;box-shadow:-7px 10px 6px 2px rgba(92,61,240,.17)}
        .p13-panel p{margin:0;font-family:'Cafe24 Ssurround';font-size:50px;line-height:1.35;color:var(--c-ink);text-align:center;letter-spacing:-0.05em;word-break:keep-all}
        .p13-btns{display:flex;gap:40px}
        .p13-btns img{display:block;height:122px;width:auto}
        .p13-character{left:110px;top:310px;width:560px;height:620px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <p class="p13-title">미션 성공!</p>
          <div class="p13-panel">
            <p>서로를 배려하고 존중하는 말과 행동을 골라<br>도착 지점까지 완주했어요!</p>
            <div class="p13-btns">
              <a href="page12.html" class="js-nav-effect">
                <img src="../../img/common/btn_retry.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_retry_on.png" data-src-over="../../img/common/btn_retry_over.png" data-sound="sound/click.mp3" alt="다시하기">
              </a>
              <a href="../12/page01.html" class="js-nav-effect">
                <img src="../../img/common/btn_next_lesson.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_next_lesson_on.png" data-src-over="../../img/common/btn_next_lesson_over.png" data-sound="sound/click.mp3" alt="다음차시 학습하기">
              </a>
            </div>
          </div>
          <div class="char-box p13-character"><img src="img/p_character_main.png" alt="메인 캐릭터"></div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="배려와 존중의 갈림길" data-next="../sa.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
