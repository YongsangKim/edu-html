<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배려와 존중의 갈림길</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 기획서 73~81p. 도입(2초 뒤 출발!) → 생활 속 상황 7개: 두 보기 중 배려하고 존중하는 쪽을 고르면 정답 효과음과 함께 왼쪽 길 위의 메인 캐릭터가 한 칸 앞으로, 틀리면 카드 흔들림(오답 효과음). 마지막 정답 뒤 도착(2초) → page13.
           길은 인라인 SVG(출발 → 도착), 캐릭터는 길 위 원형 토큰. 보기 위치(위/아래)는 문제마다 무작위 */

        .p12-board{position:absolute;left:80px;top:40px;width:1060px;height:850px;box-sizing:border-box;border:solid 6px var(--c-purple);border-radius:30px;background:#cfe8b5;overflow:hidden}
        .p12-road{position:absolute;left:0;top:0;width:100%;height:100%}
        .p12-flag{position:absolute;margin:0;white-space:nowrap;height:70px;padding:6px 30px 0;box-sizing:border-box;display:flex;align-items:center;border-radius:35px;background:var(--c-purple);border:solid 4px var(--c-cream);font-family:'Cafe24 Ssurround';font-size:40px;color:var(--c-white);letter-spacing:-0.04em;transform:translate(-50%,0)}
        .p12-flag.is-goal{background:#e5484d}
        .p12-token{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;box-sizing:border-box;border:solid 6px var(--c-white);border-radius:50%;background:var(--c-white);overflow:hidden;box-shadow:0 8px 0 rgba(0,0,0,.2);z-index:3;transition:left .9s ease,top .9s ease}
        .p12-token img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 14%}

        .p12-q{position:absolute;left:1243px;top:70px;width:620px;height:170px;margin:0;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Cafe24 Ssurround';font-size:48px;line-height:1.3;color:var(--c-ink);letter-spacing:-0.05em;word-break:keep-all}
        .p12-opts{position:absolute;left:1243px;top:270px;width:620px;height:620px}
        .p12-card{position:absolute;left:0;width:620px;height:230px;box-sizing:border-box;padding:0 30px 0 26px;display:flex;align-items:center;gap:24px;text-align:left;border:solid 6px var(--c-purple);border-radius:30px;background:var(--c-white);cursor:pointer;box-shadow:-7px 10px 6px 2px rgba(92,61,240,.17);
          font-family:'Cafe24 Ssurround';font-size:46px;line-height:1.25;color:var(--c-ink);letter-spacing:-0.05em;word-break:keep-all;transition:border-color .15s,background .15s}
        .p12-card:nth-of-type(1){top:0}
        .p12-card:nth-of-type(2){top:390px}
        .p12-card:hover{border-color:var(--c-sky);background:var(--c-pale)}
        .p12-card.is-selected{border-color:#ff2fc2}
        .p12-card.is-wrong{animation:fix-word-shake .3s ease}
        .p12-card i{flex:0 0 96px;width:96px;height:96px;border-radius:24px;background:var(--c-purple);display:flex;align-items:center;justify-content:center}
        .p12-card i svg{width:60px;height:60px;fill:none;stroke:var(--c-white);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
        .p12-vs{position:absolute;left:50%;top:255px;width:110px;height:110px;margin-left:-55px;border-radius:50%;background:var(--c-navy);border:solid 6px var(--c-cream);display:flex;align-items:center;justify-content:center;font-family:'Cafe24 Ssurround';font-size:48px;color:var(--c-white);z-index:2}
        .p12-opts.is-locked{pointer-events:none}
        .p12-opts.is-off,.p12-q.is-off{display:none}

        .p12-big{position:absolute;left:1243px;top:270px;width:620px;height:620px;margin:0;display:flex;align-items:center;justify-content:center;font-family:'Cafe24 Ssurround';font-size:130px;color:var(--c-purple);letter-spacing:-0.05em}
        .p12-big.is-off{display:none}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="p12-board" id="p12Board">
            <svg class="p12-road" id="p12Road" viewBox="0 0 1048 838" preserveAspectRatio="none"></svg>
            <p class="p12-flag" id="p12Start">출발!</p>
            <p class="p12-flag is-goal" id="p12Goal">도착!</p>
            <div class="p12-token" id="p12Token"><img src="img/p_character_main.png" alt="메인 캐릭터"></div>
          </div>

          <p class="p12-big" id="p12Big">출발!</p>
          <p class="p12-q is-off" id="p12Q"></p>
          <div class="p12-opts is-off" id="p12Opts"></div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="배려와 존중의 갈림길" data-next="page13.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const PTS = [[110, 650], [300, 560], [190, 430], [420, 360], [320, 220], [590, 290], [720, 150], [920, 100]];
    const QUESTIONS = [
      { q: '함께 놀고 싶어 하는 친구에게 어떻게 말할까요?', right: '우리 같이 놀자!', wrong: '옆에서 보고 있어도 돼.' },
      { q: '친구가 천천히 이야기하고 있어요. 어떻게 할까요?', right: '끝까지 듣고 기다려요.', wrong: '말을 끊고 내가 말해요.' },
      { q: '나와 다른 의견을 말하는 친구에게 어떻게 말할까요?', right: '친구의 이유를<br>먼저 들어요.', wrong: '이유를 듣기 전에<br>내 생각대로 정해요.' },
      { q: '친구가 모둠 활동에 참여하고 싶다고 했어요. 어떻게 할까요?', right: '하고 싶은 역할을<br>물어보고 함께 나눠요.', wrong: '친구는 옆에서<br>보게 해요.' },
      { q: '친구가 발표하다가 실수를 해서 ‘내가 다시 말해 볼게.’ 라고 했어요. 어떻게 할까요?', right: '다시 말하도록<br>기다려요.', wrong: '내가 대신 발표해요.' },
      { q: '친구의 물건을 사용하고 싶어요. 어떻게 할까요?', right: '사용해도 되는지<br>먼저 물어봐요.', wrong: '묻지 않고 잠깐 쓴 뒤<br>돌려줘요.' },
      { q: '학급 대표 후보가 되고 싶은 학생을 모집해요. 어떻게 정할까요?', right: '원하는 학생 모두에게<br>후보가 될 기회를 줘요.', wrong: '잘할 것 같은 학생만<br>후보로 정해요.' }
    ];
    const ARROW = '<i><svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg></i>';
    const W = 1048, H = 838;
    const road = $('p12Road');
    const token = $('p12Token');
    const optsBox = $('p12Opts');
    const qBox = $('p12Q');
    const big = $('p12Big');
    let step = 0;

    function curve(a, b) {
      const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      return ' Q' + (mx + (b[1] - a[1]) * 0.25) + ',' + (my - (b[0] - a[0]) * 0.25) + ' ' + b[0] + ',' + b[1];
    }
    function drawRoad() {
      let d = 'M' + PTS[0][0] + ',' + PTS[0][1];
      for (let i = 1; i < PTS.length; i++) d += curve(PTS[i - 1], PTS[i]);
      road.innerHTML = '<path d="' + d + '" fill="none" stroke="#a98a55" stroke-width="86" stroke-linecap="round" stroke-linejoin="round"/>'
        + '<path d="' + d + '" fill="none" stroke="#f2d9a6" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>'
        + '<path d="' + d + '" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="26 22" stroke-linecap="round"/>'
        + PTS.map((p) => '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="14" fill="#fff" stroke="#a98a55" stroke-width="5"/>').join('');
    }
    function place(el, p, dy) {
      el.style.left = (p[0] / W * 100) + '%';
      el.style.top = (p[1] / H * 100) + '%';
      if (dy) el.style.marginTop = dy + 'px';
    }

    function showQuestion() {
      const q = QUESTIONS[step];
      big.classList.add('is-off');
      qBox.innerHTML = q.q;
      qBox.classList.remove('is-off');
      optsBox.innerHTML = '<span class="p12-vs">VS</span>';
      optsBox.classList.remove('is-off', 'is-locked');
      shuffleArray([{ t: q.right, right: true }, { t: q.wrong }]).forEach((o) => {
        const b = document.createElement('button');
        b.className = 'p12-card';
        b.innerHTML = ARROW + '<span>' + o.t + '</span>';
        b.addEventListener('click', () => pick(b, o.right));
        optsBox.appendChild(b);
      });
    }

    function pick(b, right) {
      if (!right) {
        playWrong();
        b.classList.remove('is-wrong');
        void b.offsetWidth;
        b.classList.add('is-wrong');
        return;
      }
      playCorrect();
      b.classList.add('is-selected');
      optsBox.classList.add('is-locked');
      step += 1;
      place(token, PTS[step]);
      setTimeout(() => {
        if (step < QUESTIONS.length) { showQuestion(); return; }
        qBox.classList.add('is-off');
        optsBox.classList.add('is-off');
        big.textContent = '도착!';
        big.classList.remove('is-off');
        setTimeout(() => navigateTo('page13.html'), 2000);
      }, 1300);
    }

    drawRoad();
    place(token, PTS[0]);
    const s = $('p12Start'), g = $('p12Goal');
    place(s, [PTS[0][0], PTS[0][1] + 82]);
    place(g, [PTS[PTS.length - 1][0] - 20, PTS[PTS.length - 1][1] + 60]);
    setTimeout(showQuestion, 2000);
  })();
  </script>
</body>
</html>
