        /* 기획서 26~68p. Canva로 인권 존중 포스터 만들기 실습. 휴대폰 화면은 기획서의 Canva 앱 캡처를 540x1170 좌표로 다시 그린 것(.p09-ui, 화면 폭에 맞춰 축소) —
           아이콘·썸네일·시스템 바처럼 그리기 어려운 조각만 캡처에서 오려 img/ui/ 에 둠. 고른 값(프롬프트 · 초안 이미지 · 문구 · 글꼴)은 화면 안에 그대로 그려짐.
           누를 곳(.p09-hot)은 투명 — 올리면 초록 테두리, 왼쪽 손가락이 위치를 알려줌(좌표는 화면 기준 %).
           흐름: 홈에서 Canva → 포스터(세로형 A2) → Magic Media 세로형 → 프롬프트(3가지 중 선택) → 이미지 생성(2초) → 초안 4장 보기(화살표)·고르기(프롬프트에 맞는 2장만 통과) → 포스터 제작 확인 → 크기 조정 → 문구 넣기(3가지 중 선택, 글꼴 바꾸기, 위로 옮기기) → AI 문구 넣기(아래로 옮기기) → 완성 → 다운로드 → 완성 포스터(68p).
           초안 이미지 img/p09_draft_{1~4}.png(1·2번이 프롬프트에 맞는 초안, 3·4번은 맞지 않는 초안 — 3·4는 임시 그림, 실제 이미지가 오면 같은 파일명으로 덮어쓰기). 이전 캡처 방식 버전: _backup_page09.html */

      { ui: 'typingCredit', bubble: '오른쪽 버튼을 눌러<br>문구를 입력해요.', btns: [{ t: 'AI로 만든 그림을<br>사용했어요.', credit: true }] },
      { ui: 'typingCredit', bubble: '확인 버튼을 클릭해요.', hot: [HOT.check] },
      { ui: 'credMid', bubble: '위치를 포스터의 하단으로<br>옮겨 봐요. 문구를 클릭해요.', hot: [HOT.midText] },
      { ui: 'dragBase', o: { cred: 1 }, bubble: MOVE + '이동 버튼을 꾹 눌러<br>아래쪽으로 드래그 해보세요.', drag: { cred: true, text: () => CREDIT, fs: 24, cx: 50, top: 45.8, end: 73.2, zone: [68, 78], w: 330 } },
      { ui: 'credBot', bubble: '좋아요! 확인 버튼을 클릭해<br>포스터 만들기를 완료해요.', hot: [[83, 88.5, 15, 6]] },
      { ui: 'final', bubble: '인권 존중 포스터를<br>완성했어요!', next: true },
      { ui: 'final', bubble: '오른쪽 위의 버튼을 클릭해<br>포스터를 다운로드 해봐요.', hot: [[87, 3, 12, 6.8]] },
      { ui: 'share', bubble: '아래의 다운로드 버튼을<br>클릭해요.', hot: [[3, 87.4, 94, 4.6]] },
      { ui: 'dl', bubble: '아래의 다운로드 버튼을<br>클릭해요.', hot: [[3, 83, 94, 4.6]] },
      { ui: 'done', bubble: '내가 만든 인권 존중 포스터를<br>저장했어요!', next: true },
      { end: true }
    ];

    let i = 0;
    let lock = false;

    function go(n) { clearFingers(); i = typeof n === 'number' ? n : i + 1; render(); }

    function fingerTo(el) { setTimeout(() => { if (el && el.isConnected) pointFingerAt(el, { onMain: true, x: 0.6 }); }, 350); }

    function hotButton(box, extra) {
      const b = document.createElement('button');
      b.className = 'p09-hot' + (extra ? ' ' + extra : '');
      b.style.cssText = pct(box);
      screen.appendChild(b);
      return b;
    }

    function setRight(list) {
      right.innerHTML = '';
      right.classList.toggle('is-off', !list.length);
      list.forEach((o) => {
        const b = document.createElement('button');
        b.className = 'card-btn ' + (o.cls || '');
        b.innerHTML = o.t;
        b.addEventListener('click', o.fn);
        right.appendChild(b);
      });
      return right.firstChild;
    }

    function drag(step, ui) {
      const d = step.drag;
      ui.insertAdjacentHTML('beforeend', tobj(d.cx, d.top, d.text(), d.fs, d.w, d.cred));
      const obj = ui.lastElementChild;
      const mv = obj.querySelector('.mv');
      let on = false, sx = 0, sy = 0, x0 = d.cx, y0 = d.top;
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
      mv.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        clearFingers();
        on = true; sx = e.clientX; sy = e.clientY; x0 = parseFloat(obj.style.left); y0 = parseFloat(obj.style.top);
        obj.style.transition = 'none';
        mv.setPointerCapture(e.pointerId);
      });
      mv.addEventListener('pointermove', (e) => {
        if (!on) return;
        const r = screen.getBoundingClientRect();
        obj.style.left = clamp(x0 + (e.clientX - sx) / r.width * 100, 25, 75) + '%';
        obj.style.top = clamp(y0 + (e.clientY - sy) / r.height * 100, 10, 80) + '%';
      });
      const end = () => {
        if (!on) return;
        on = false;
        const mid = parseFloat(obj.style.top);
        obj.style.transition = 'left .2s ease,top .2s ease';
        if (mid >= d.zone[0] && mid <= d.zone[1]) {
          obj.style.left = d.cx + '%';
          obj.style.top = d.end + '%';
          playDrag();
          setTimeout(() => go(), 700);
        } else {
          obj.style.left = d.cx + '%';
          obj.style.top = d.top + '%';
          playWrong();
          fingerTo(mv);
        }
      };
      mv.addEventListener('pointerup', end);
      mv.addEventListener('pointercancel', end);
      return mv;
    }

    function swipeFinger(el) {
      setTimeout(() => {
        if (!el.isConnected) return;
        const main = el.closest('main');
        const s = main.getBoundingClientRect().width / main.offsetWidth;
        const r = el.getBoundingClientRect();
        const m = main.getBoundingClientRect();
        const f = document.createElement('img');
        f.className = 'p09-swipe js-point-finger';
        f.src = '../../img/common/img_finger01.png';
        f.alt = '';
        f.style.left = ((r.left - m.left + r.width) / s - 150) + 'px';
        f.style.top = ((r.top - m.top + r.height / 2) / s - 20) + 'px';
        main.appendChild(f);
      }, 350);
    }

    function swipe(step, ui) {
      const box = step.swipe;
      const track = ui.querySelector('.u-track');
      track.classList.add('is-drag');
      const z = hotButton(box, 'is-drag');
      let sx = 0, on = false, prog = 0;
      const W = () => screen.getBoundingClientRect().width;
      const set = (p, anim) => { prog = p; track.classList.toggle('is-drag', !anim); track.style.transform = 'translateX(' + (-p * TAB_MAX) + 'px)'; };
      z.addEventListener('pointerdown', (e) => { e.preventDefault(); clearFingers(); sx = e.clientX; on = true; z.setPointerCapture(e.pointerId); });
      z.addEventListener('pointermove', (e) => { if (on) set(Math.min(1, Math.abs(e.clientX - sx) / (W() * 0.6)), false); });
      const end = () => {
        if (!on) return;
        on = false;
        if (prog > 0.35) { set(1, true); playDrag(); setTimeout(() => go(), 450); }
        else { set(0, true); playWrong(); swipeFinger(z); }
      };
      z.addEventListener('pointerup', end);
      z.addEventListener('pointercancel', end);
      swipeFinger(z);
      return z;
    }

    function carousel(mode) {
      const car = document.createElement('div');
      car.className = 'p09-car';
      screen.appendChild(car);
      const cards = [0, 1, 2, 3].map((n) => {
        const c = document.createElement('div');
        c.className = 'p09-card';
        c.style.backgroundImage = "url('" + dsrc(n + 1) + "')";
        car.appendChild(c);
        return c;
      });
      const prev = document.createElement('button');
      prev.className = 'p09-arrow is-prev';
      prev.innerHTML = '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';
      const nxt = document.createElement('button');
      nxt.className = 'p09-arrow is-next';
      nxt.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
      car.appendChild(prev); car.appendChild(nxt);
      const seen = new Set([0]);
      const pickZone = document.createElement('button');
      pickZone.className = 'p09-pick';
      if (mode === 'pick') car.appendChild(pickZone);

      function layout() {
        cards.forEach((c, n) => { c.style.left = (4.1 + (n - st.car) * 77) + '%'; });
        prev.style.display = st.car > 0 ? '' : 'none';
        nxt.style.display = st.car < cards.length - 1 ? '' : 'none';
        if (mode === 'view') show(nextBtn, seen.size === cards.length);
      }
      function to(n) {
        playClick();
        clearFingers();
        st.car = n;
        seen.add(n);
        layout();
      }
      prev.addEventListener('click', () => to(st.car - 1));
      nxt.addEventListener('click', () => to(st.car + 1));
      pickZone.addEventListener('click', () => {
        if (!(st.c.ok || OKDRAFT)[st.car]) {
          playWrong();
          $('p09WrongPrompt').textContent = st.c.q;
          $('p09Wrong').classList.remove('is-off');
          return;
        }
        playCorrect();
        st.draft = st.car;
        setTimeout(() => go(), 600);
      });
      st.car = 0;
      if (mode === 'view') nextBtn.onclick = () => go();
      layout();
      fingerTo(nxt);
      return car;
    }

    function render() {
      lock = false;
      const s = STEPS[i];
      right.classList.add('is-off');
      right.innerHTML = '';
      show(nextBtn, false);
      nextBtn.onclick = null;

      if (s.end) { end(); return; }

      show($('p09Phone'), true);
      show($('p09Char'), true);
      bubble.innerHTML = s.bubble;
      screen.innerHTML = '';

      let ui = null;
      if (s.home) {
        screen.innerHTML = '<div class="p09-home"><img src="img/p09_canva_icon.png" alt="Canva"></div>';
      } else {
        screen.innerHTML = '<div class="p09-ui">' + UI[s.ui](s.o) + '</div>';
        ui = screen.firstChild;
        ui.style.transform = 'scale(' + (screen.clientWidth / 540) + ')';
      }

      let first = null;
      (s.hot || []).forEach((box) => {
        const h = hotButton(box);
        h.addEventListener('click', () => { playClick(); if (s.setFont) st.font = true; go(); });
        if (!first) first = h;
      });
      if (s.swipe) first = swipe(s, ui);
      if (s.drag) first = drag(s, ui);
      if (s.next) {
        show(nextBtn, true);
        nextBtn.onclick = () => go();
        first = null;
        fingerTo(nextBtn);
      }

      if (s.btns) {
        setRight(s.btns.map((o) => ({
          t: o.t, cls: o.cls,
          fn: () => {
            if (o.back) { go(STEPS.findIndex((x) => x.car === o.back)); return; }
            if (o.credit) st.credit = true;
            go();
          }
        })));
        fingerTo(right.lastChild);
      }
      if (s.cases) {
        setRight(CASES.map((c) => ({ t: c.t, cls: 'is-small', fn: () => { st.c = c; go(); } })));
      }
      if (s.phrases) {
        setRight(PHRASES.map((p) => ({ t: p, fn: () => { st.phrase = p; render(); } })));
        if (st.phrase) {
          Array.from(right.children).forEach((b, n) => b.classList.toggle('is-selected', PHRASES[n] === st.phrase));
          show(nextBtn, true);
          nextBtn.onclick = () => go();
        }
      }
      if (s.loading) {
        const bar = document.createElement('div');
        bar.className = 'p09-bar';
        bar.style.cssText = pct([4, 78.2, 92, 1.1]);
        bar.innerHTML = '<i></i>';
        screen.appendChild(bar);
        setTimeout(() => bar.classList.add('is-run'), 50);
        setTimeout(() => go(), 2100);
        return;
      }
      if (s.car) { carousel(s.car); return; }
      if (first && !s.btns && !s.swipe) fingerTo(first);
    }

    function end() {
      show($('p09Phone'), false);
      show($('p09Char'), false);
      bubble.innerHTML = '';
      bubble.classList.add('is-hide');
      right.classList.add('is-off');
      $('p09EndTitle').classList.remove('is-hide');
      const p = $('p09Poster');
      p.style.backgroundImage = "url('" + dsrc(st.draft + 1) + "')";
      $('p09PosterTop').textContent = st.phrase || PHRASES[1];
      p.classList.remove('is-hide');
      show(nextBtn, true);
      nextBtn.onclick = () => setTimeout(() => navigateTo('page10.html'), 400);
    }

    $('p09WrongOk').addEventListener('click', () => $('p09Wrong').classList.add('is-off'));
    st.c = CASES[1];
    render();
  })();
  </script>
</body>
</html>
