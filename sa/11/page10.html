<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀴즈 풀기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 기획서 69~71p. Q1 3지선다(목록), Q2 O/X, Q3 4지선다(가로). 정답/오답 팝업은 공용 아바타 팝업(기능 V) */
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="quiz-stage">
          <div class="step-flow">

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q1.</span>
                  <p class="quiz-ask">놀이터에 혼자 있는 친구를 보았을 때 올바른 민주시민의 행동은 무엇일까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-list">
                <button class="answer-pick card-btn" data-correct="true">같이 놀고 싶은지 먼저 물어보기</button>
                <button class="answer-pick card-btn" data-correct="false">함께 놀고 싶다고 하면 구경만 하라고 하기</button>
                <button class="answer-pick card-btn" data-correct="false">혼자 있고 싶을 거라고 판단하고 말 걸지 않기</button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q2.</span>
                  <p class="quiz-ask">AI 디자이너가 그려준 예쁜 그림을 친구들에게<br>“이건 내가 물감으로 직접 그린 거야!”라며 소개해도 괜찮아요.</p>
                </div>
              </div>
              <div class="answer-pick-quiz">
                <button class="answer-pick ox-pick is-o" data-correct="false" aria-label="O">
                  <img class="js-img-swap" src="../../img/common/icon_o.png" data-src-on="../../img/common/icon_o_on.png" alt="O">
                </button>
                <button class="answer-pick ox-pick is-x" data-correct="true" aria-label="X">
                  <img class="js-img-swap" src="../../img/common/icon_x.png" data-src-on="../../img/common/icon_x_on.png" alt="X">
                </button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q3.</span>
                  <p class="quiz-ask">AI 디자이너에게 이웃들이 서로 돕는 그림을 부탁하려고 해요.<br>어떤 말을 넣을까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-row" data-next="page11.html">
                <button class="answer-pick card-btn" data-correct="false">서로 놀리는 모습</button>
                <button class="answer-pick card-btn" data-correct="false">서로 싸우는 모습</button>
                <button class="answer-pick card-btn" data-correct="true">서로 도와주는 모습</button>
                <button class="answer-pick card-btn" data-correct="false">서로 밀치는 모습</button>
              </div>
            </div>

          </div>

          <div class="ox-result-correct is-avatar is-off" data-sound="sound/correct.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_correct.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">정답이에요!</p>
              </div>
              <div class="avatar-popup-extra"><img src="../../img/common/icon_correct.png" alt=""></div>
            </div>
          </div>
          <div class="ox-result-wrong is-avatar is-off" data-sound="sound/incorrect.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">다시 한번 생각해볼까요?</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="퀴즈 풀기" data-next="page11.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
