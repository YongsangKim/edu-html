<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하루 속 이웃 찾기 미션!</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        main{background:url('img/stage_bg_03.png') no-repeat}
        .page03 a:nth-child(1){position:absolute;left:1060px;top:670px}
        .dnd-zone {
          position: absolute;
          width: 420px; height: 420px;

          border-radius: 12px;
        }
        .dnd-card {
          position: absolute;
          width: 268px; height: 268px;
          cursor: grab;
          touch-action: none;
          user-select: none;
          -webkit-user-drag: none;
          z-index:10;
        }
        .dnd-card img {
          width: 100%; height: 100%;
          -webkit-user-drag: none;
          user-select: none;
          pointer-events: none;
        }
        .dnd-card[data-placed="true"] {
          width:410px;
          height:410px;
          cursor: default;
        }
        .dnd-card[data-placed="true"]:after {
          content: '';
          position:absolute;
          right:16px;
          top:15px;
          width: 69px;
          height:65px;
          background:url(../../img/common/icon_star_on.png) 0 0 / contain no-repeat;
        }
        .dnd-result-wrong {
          position: absolute;
          top: 0; left: 0;
          width: 1920px; height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          background: rgba(27, 23, 56, 0.5);
          z-index:20;
        }
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer"><div id="stage" class="stage">
      <main>
          <div class="page03">
              <div class="dnd-card" data-correct="true"  style="left:90px; top:620px;"><img src="img/drag_page03_01.png" alt=""></div>
              <div class="dnd-card" data-correct="false" style="left:380px; top:620px;"><img src="img/drag_page03_02.png" alt=""></div>
              <div class="dnd-card" data-correct="false"  style="left:670px; top:620px;"><img src="img/drag_page03_03.png" alt=""></div>
              <div class="dnd-card" data-correct="true" style="left:960px; top:620px;"><img src="img/drag_page03_04.png" alt=""></div>

              <div class="dnd-zone" data-next="page03.html" style="left:1383px; top:50px;"></div>
              <div class="dnd-zone" data-next="page03.html" style="left:1383px; top:495px;"></div>

              <div class="dnd-result-wrong is-off" data-sound="sound/incorrect.mp3">
                <div class="avatar-popup-panel">
                  <div class="avatar-popup-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <p class="avatar-popup-text is-medium">이 장면에서 만날 수 있는 이웃을<br>다시 찾아볼까요?</p>
                </div>
              </div>

          </div>
      </main>

    </div></div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="하루 속 이웃 찾기 미션!" data-next="page03.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
