<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이웃 탐정 미션! 누가 도와줄까요?</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 6~9p. 생활 속 문제 6개를 차례로, 이웃 카드 3장(정답 + 나머지 5명 중 무작위 2명, 순서 무작위) 중 도와줄 이웃 고르기.
           맞으면 정답 효과음 뒤 다음 문제 자동, 틀리면 흔들림 + 오답 팝업 3초. 마지막 문제 뒤 완료 팝업.
           상황 그림 img/p05_sit_{1~6}.png, 이웃 사진 img/p05_job_{key}.png */
        main{position:absolute;left:0;top:120px;width:1920px;height:960px}

        .p05-sit{position:absolute;left:60px;top:40px;width:700px;height:870px;box-sizing:border-box;border:solid 6px #48159c;border-radius:36px;background:#fefbf9;overflow:hidden;display:flex;flex-direction:column}
        .p05-sit i{flex:1 1 auto;background:#dfe7f5 center / cover no-repeat}
        .p05-sit p{margin:0;padding:34px 30px 30px;font-family:'Cafe24 Ssurround';font-size:44px;line-height:1.35;color:#1b1738;text-align:center;letter-spacing:-0.05em;word-break:keep-all}
        .p05-num{position:absolute;left:24px;top:24px;height:70px;padding:4px 30px 0;box-sizing:border-box;display:flex;align-items:center;background:#48159c;border-radius:35px;font-family:'Cafe24 Ssurround';font-size:40px;color:#fff}

        .p05-ask{position:absolute;left:810px;top:40px;width:1050px;margin:0;box-sizing:border-box;padding:26px 30px 20px;background:#fff;border:solid 5px #1b1738;border-radius:40px;box-shadow:0 10px 0 0 #becde7;
          font-family:'Cafe24 Ssurround';text-align:center;letter-spacing:-0.05em}
        .p05-ask b{display:block;font-weight:normal;font-size:52px;color:#1b1738}
        .p05-ask span{display:block;margin-top:8px;font-size:40px;color:#48159c}

        .p05-cards{position:absolute;left:810px;top:270px;width:1050px;height:640px;display:flex;gap:30px}
        .p05-card{flex:1 1 0;box-sizing:border-box;padding:0;border:solid 6px #91b9e7;border-radius:30px;background:#fff;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;
          font-family:'Cafe24 Ssurround';text-align:center;transition:transform .15s,border-color .15s}
        .p05-card:hover{transform:translateY(-8px);border-color:#48159c}
        .p05-card.is-selected{border-color:#ff2fc2}
        .p05-card.is-wrong{animation:fix-word-shake .3s ease}
        .p05-card i{flex:0 0 340px;background:#dfe7f5 center top / cover no-repeat}
        .p05-card b{display:block;padding:18px 10px 0;font-weight:normal;font-size:46px;color:#48159c;letter-spacing:-0.05em}
        .p05-card span{display:block;padding:12px 20px 0;font-size:31px;line-height:1.35;color:#1b1738;letter-spacing:-0.06em;word-break:keep-all}
        .p05-cards.is-locked{pointer-events:none}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="p05-sit">
            <span class="p05-num" id="p05Num"></span>
            <i id="p05SitImg"></i>
            <p id="p05SitText"></p>
          </div>
          <p class="p05-ask"><b>나에게 필요한 도움은 무엇일까요?</b><span>나를 도와줄 수 있는 이웃을 선택해요!</span></p>
          <div class="p05-cards" id="p05Cards"></div>

          <div class="ox-result-wrong is-avatar is-off" id="p05Wrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <p class="avatar-popup-text is-medium">생활 속 문제 상황을 다시 한번 살펴보고<br>어떤 도움이 필요할지 생각해 봐요.</p>
            </div>
          </div>

          <div class="avatar-modal is-off" id="p05Done">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_correct.png" alt=""></div>
              <div class="avatar-popup-body is-finish">
                <p class="avatar-popup-text">좋아요!</p>
                <p class="avatar-popup-sub">생활 속에서 만나고, 도움을 받을 수 있는<br>이웃을 찾았어요.</p>
                <a href="page06.html" class="js-nav-effect avatar-popup-next">
                  <img src="../../img/common/btn_next_small.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_next_small_on.png" data-src-over="../../img/common/btn_next_small_over.png" data-sound="sound/click.mp3" alt="다음">
                </a>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="이웃 탐정 미션! 누가 도와줄까요?" data-next="page06.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const JOBS = {
      bus: { name: '버스 운전기사', desc: '버스가 어디로 가는지 알려주고, 우리가 안전하게 이동하도록 도와줘요.' },
      librarian: { name: '사서', desc: '책을 찾고 빌릴 수 있도록 도와줘요.' },
      clerk: { name: '편의점 판매원', desc: '물건을 살 수 있도록 계산과 안내를 도와줘요.' },
      park: { name: '공원 관리인', desc: '공원을 깨끗하게 관리하고, 쓰레기를 치워서 우리가 편하게 이용하도록 도와줘요.' },
      guard: { name: '교통안전 도우미', desc: '길을 안전하게 건널 수 있도록 신호를 안내하고 도와줘요.' },
      hair: { name: '미용사', desc: '머리카락을 잘라 주고, 원하는 스타일을 할 수 있도록 도와줘요.' }
    };
    const QUESTIONS = [
      { answer: 'bus', text: '학교 앞에서 내려야 하는데<br>학교 앞에 도착하는 버스인지 모르겠어요.' },
      { answer: 'librarian', text: '책을 빌리고 싶은데<br>어디에서 찾아야 할지 모르겠어요.' },
      { answer: 'clerk', text: '간식과 물건을 사고 계산을 해야 하는데<br>어떻게 해야 할지 모르겠어요.' },
      { answer: 'park', text: '공원에 쓰레기가 많아서 놀기가 불편해요.<br>누가 치워주면 좋겠어요.' },
      { answer: 'guard', text: '길을 건너야 하는데<br>차가 많아서 무서워요.' },
      { answer: 'hair', text: '앞머리가 너무 길어서 눈을 자꾸 가려요.<br>머리를 자르고 싶어요.' }
    ];

    const $ = (id) => document.getElementById(id);
    const cardsBox = $('p05Cards');
    const playCorrect = makeSfx('sound/correct.mp3');
    const playWrong = makeSfx('sound/incorrect.mp3');
    let index = 0;

    function show() {
      const q = QUESTIONS[index];
      $('p05Num').textContent = (index + 1) + ' / ' + QUESTIONS.length;
      $('p05SitImg').style.backgroundImage = "url('img/p05_sit_" + (index + 1) + ".png')";
      $('p05SitText').innerHTML = q.text;
      const others = shuffleArray(Object.keys(JOBS).filter((k) => k !== q.answer)).slice(0, 2);
      cardsBox.innerHTML = '';
      cardsBox.classList.remove('is-locked');
      shuffleArray([q.answer].concat(others)).forEach((key) => {
        const card = document.createElement('button');
        card.className = 'p05-card';
        card.innerHTML = "<i style=\"background-image:url('img/p05_job_" + key + ".png')\"></i><b>" + JOBS[key].name + '</b><span>' + JOBS[key].desc + '</span>';
        card.addEventListener('click', () => pick(card, key === q.answer));
        cardsBox.appendChild(card);
      });
    }

    function pick(card, right) {
      if (!right) {
        playWrong();
        card.classList.remove('is-wrong');
        void card.offsetWidth;
        card.classList.add('is-wrong');
        flashLayer($('p05Wrong'), 'is-off', 3000);
        return;
      }
      playCorrect();
      card.classList.add('is-selected');
      cardsBox.classList.add('is-locked');
      setTimeout(() => {
        if (index === QUESTIONS.length - 1) {
          $('p05Done').classList.remove('is-off');
          return;
        }
        index += 1;
        show();
      }, 1200);
    }

    show();
  })();
  </script>
</body>
</html>
