<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 동네 이웃 앨범 만들기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 48~65p. 펼친 앨범: 장소 6곳 × 질문 3개(장소 이름 → 만날 수 있는 이웃 → 이웃의 역할), 총 18문제, 한 문제마다 게이지 1/18.
           보기 순서 무작위, 틀리면 흔들림, 맞으면 정답 효과음 뒤 다음 문제 자동. 끝나면 앨범 보기(page13).
           장소 사진 img/p12_place_{key}.png, 이웃 사진은 카드 칸에 맞춘 가로로 긴 img/p12_job_{key}.png */

        .p12-gauge{left:260px;top:34px;width:1400px}
        .p12-gauge:before{background-image:url('../../img/common/icon_star_on.png')}

        .p12-book{position:absolute;left:110px;top:130px;width:1700px;height:800px;box-sizing:border-box;padding:14px 48px 22px;border-radius:26px;background:#86a6e4;box-shadow:0 9px 0 0 #abbde0;display:flex}
        .p12-book:before{content:'';position:absolute;left:16px;right:16px;top:10px;bottom:12px;border-radius:18px;background:#b5c8f6;box-shadow:0 -5px 2px 0 #dbe4fd, 0 2px 10px 2px #6788be;}
        /* .p12-book:after{content:'';position:absolute;left:49%;top:3px;width:50px;height:11px;background:#3f73ac} */
        .p12-page{flex:1 1 0;position:relative;background:#fbf9ff;overflow:hidden}
        .p12-binding{flex:0 0 136px;position:relative;background:linear-gradient(90deg,#d7d9fa,#d7d9fa 35%,#b2baef 36%,#b2baef 65%,#d7d9fa 66%,#d7d9fa);box-shadow:0px 2px 2px 0px #9db2e1}
        .p12-binding:before{content:'';position:absolute;left:55%;top:0;width:20px;height:100%;margin-left:-18px;background:linear-gradient(90deg,#3d7fb4,#2d6799 25%,#2d6799 75%,#3a79ad)}
        .p12-binding:after{content:'';position:absolute;left:0;top:0;width:100%;height:100%;
        background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27107%27%20height%3D%2776%27%20viewBox%3D%270%200%20107%2076%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27t%27%20gradientUnits%3D%27userSpaceOnUse%27%20x1%3D%270%27%20y1%3D%272%27%20x2%3D%270%27%20y2%3D%2729%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%23d9f4fe%27%2F%3E%3Cstop%20offset%3D%27.3%27%20stop-color%3D%27%23b4e4f9%27%2F%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%2372bdec%27%2F%3E%3C%2FlinearGradient%3E%3ClinearGradient%20id%3D%27h%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%270%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%2341419a%27%2F%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%2332328a%27%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Cellipse%20cx%3D%279%27%20cy%3D%2721.5%27%20rx%3D%278%27%20ry%3D%278.4%27%20fill%3D%27url(%23h)%27%20stroke%3D%27%23e9e9fd%27%20stroke-opacity%3D%27.7%27%20stroke-width%3D%27.6%27%2F%3E%3Cellipse%20cx%3D%2798%27%20cy%3D%2721.5%27%20rx%3D%278%27%20ry%3D%278.4%27%20fill%3D%27url(%23h)%27%20stroke%3D%27%23e9e9fd%27%20stroke-opacity%3D%27.7%27%20stroke-width%3D%27.6%27%2F%3E%3Cellipse%20cx%3D%2717%27%20cy%3D%2727.2%27%20rx%3D%275.4%27%20ry%3D%272.8%27%20fill%3D%27%23a9ddf7%27%2F%3E%3Cellipse%20cx%3D%2790%27%20cy%3D%2727.2%27%20rx%3D%275.4%27%20ry%3D%272.8%27%20fill%3D%27%23a9ddf7%27%2F%3E%3Cpath%20d%3D%27M8%2028.5C9.5%2012%2032%202.4%2053.5%202.4S97.5%2012%2099%2028.5C95%2030%2089.5%2029.5%2087%2027C85%2017%2070%208.8%2053.5%208.8S22%2017%2020%2027C17.5%2029.5%2012%2030%208%2028.5Z%27%20fill%3D%27url(%23t)%27%2F%3E%3Cpath%20d%3D%27M16%2021C20%2011.5%2036%205.6%2053.5%205.6S87%2011.5%2091%2021%27%20fill%3D%27none%27%20stroke%3D%27%23fff%27%20stroke-opacity%3D%27.32%27%20stroke-width%3D%271.2%27%20stroke-linecap%3D%27round%27%2F%3E%3C%2Fsvg%3E");
        background-position: center 20px;
        background-size: 107px 76px;
        background-repeat: repeat-y}
        .p12-left{flex:1 1 0;display:flex;flex-direction:column;padding:34px;box-sizing:border-box;gap:20px;box-shadow:0px 2px 2px 0px #9db2e1}
        .p12-photo{flex:1 1 auto;border:solid 5px var(--c-ink);border-radius:10px;background:var(--c-mist) center / cover no-repeat}
        .p12-info{flex:0 0 auto;margin:0;padding:18px 22px;border-radius:16px;background:var(--c-white);font:500 25px/1.5 'Pretendard';color:var(--c-ink)}
        .p12-info b{font-weight:800}
        .p12-info.is-off{display:none}
        .p12-right{flex:1 1 0;padding:50px 26px 30px;box-sizing:border-box;display:flex;flex-direction:column;gap:30px;box-shadow:0px 2px 2px 0px #9db2e1}
        .p12-q{margin:0;box-sizing:border-box;padding:8px 24px 4px;display:flex;align-items:center;justify-content:center;border:solid 5px var(--c-ink);border-radius:35px;background:var(--c-cream);box-shadow:0 12px 0 0 var(--c-mist);font-family:'Cafe24 Ssurround';font-size:46px;line-height:1.2;color:var(--c-ink);text-align:center;letter-spacing:-0.05em;word-break:keep-all}
        .p12-opts{flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;gap:45px;padding:20px}
        .p12-opts.is-role{grid-template-columns:1fr;gap:30px}
        .p12-opt.card-btn{width:100%;height:auto;min-width:0;padding:0;overflow:hidden;display:flex;flex-direction:column;font-size:60px}
        .p12-opt.is-wrong{animation:fix-word-shake .3s ease}
        .p12-opt span{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:10px 16px 4px;text-align:center;word-break:keep-all}
        .p12-opt i{flex:0 0 190px;background:var(--c-mist) center / cover no-repeat}
        .p12-opt i + span{flex:0 0 66px}
        .p12-opts.is-role .p12-opt{font-size:40px}
        .p12-opt.is-left span{justify-content:flex-start;text-align:left;padding-left:40px}
        .p12-left.is-phone .p12-info{display:none}
        .p12-photo.is-phone{background:#2f6bc4;overflow:hidden;display:flex;justify-content:center;align-items:flex-start;padding-top:20px}
        .p12-phone{position:relative;flex:0 0 auto;width:560px;height:820px}
        .p12-phone-screen{position:relative;width:100%;height:100%;box-sizing:border-box;padding:60px 26px 26px;border-radius:54px;background:var(--c-white);overflow:hidden;font-family:'Pretendard';color:var(--c-ink)}
        .p12-phone-screen:before{content:'';position:absolute;left:50%;top:18px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--c-ink)}
        .p12-ph-search{display:flex;align-items:center;gap:12px;height:52px;padding:0 12px;border-radius:26px;background:var(--c-pale);font-size:20px;color:#5f6368}
        .p12-ph-search i{width:60px;height:38px;border-radius:8px;background:var(--c-mist) center / cover no-repeat}
        .p12-ph-tabs{display:flex;justify-content:space-between;margin:10px 4px 0;padding-bottom:10px;border-bottom:solid 1px #dadce0;font-size:17px;color:#5f6368;white-space:nowrap}
        .p12-ph-tabs b{color:var(--c-ink);font-weight:600}
        .p12-ph-ai{margin:20px 0;font-size:25px;font-weight:700;color:#1a73e8}
        .p12-ph-ai:before{content:'✦ '}
        .p12-ph-title{margin:0 0 25px;font-size:25px;font-weight:700;line-height:1.4}
        .p12-ph-sub{margin:0 0 8px;font-size:25px;font-weight:800}
        .p12-ph-line{display:list-item;list-style:disc;margin:0 0 8px 1.2em;font-size:23px;font-weight:500;line-height:1.45}
        .p12-ph-line b{font-weight:800}
        .p12-opts.is-job{grid-template-columns:repeat(2,235px);grid-auto-rows:235px;justify-content:center;align-content:start;gap:26px;padding:10px}
        .p12-jobcard{padding:0;box-sizing:border-box;border:solid 5px #2f6fed;border-radius:16px;background:var(--c-white);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;
          font-family:'Cafe24 Ssurround';font-size:34px;color:var(--c-ink);letter-spacing:-0.05em;transition:box-shadow .15s}
        .p12-jobcard i{flex:1 1 auto;background:var(--c-mist) center / cover no-repeat}
        .p12-jobcard span{flex:0 0 45px;display:flex;align-items:center;justify-content:center;padding-top:4px}
        .p12-jobcard.is-selected{border-color:#ff3bd6;box-shadow:0 0 0 4px #ff3bd6}
        .p12-jobcard.is-wrong{animation:fix-word-shake .3s ease}
        .p12-opts.is-locked{pointer-events:none}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="gauge is-thin p12-gauge"><div class="gauge-fill" id="p12Fill"></div></div>
          <div class="p12-book">
            <div class="p12-page p12-left" id="p12Left">
              <div class="p12-photo" id="p12Photo"></div>
              <p class="p12-info is-off" id="p12Info"></p>
            </div>
            <div class="p12-binding"></div>
            <div class="p12-page p12-right">
              <p class="p12-q" id="p12Q"></p>
              <div class="p12-opts" id="p12Opts"></div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="우리 동네 이웃 앨범 만들기" data-next="page13.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const JOB_IMG = { '약사': 'pharmacist', '사서': 'librarian', '공원 관리인': 'park', '버스 기사': 'bus', '편의점 판매원': 'clerk', '교통안전 도우미': 'guard' };
    // 각 질문의 보기는 정답이 맨 앞(화면에서는 섞어서 보여줌)
    const PLACES = [
      { key: 'pharmacy', info: '<b>사진에 나타난 곳은 행복약국으로 보입니다.</b><br>위치: 충청남도 천안시 한솔구 가온길 27<br>하는 일: 약을 사고, 약 복용 방법을 안내 받을 수 있습니다.<br>방문 후기: 친절하고 약에 대해 설명을 잘해 준다는 후기가 있습니다.',
        place: ['약국', '도서관', '공원', '버스정류장'], job: ['약사', '편의점 판매원', '사서', '교통안전 도우미'],
        role: ['약을 구매할 수 있도록 도와준다.', '길을 안전하게 건널 수 있도록 도와준다.', '책을 빌릴 수 있도록 도와준다.', '공원을 깨끗하게 관리한다.'] },
      { key: 'library', info: '<b>사진에 나타난 곳은 시립도서관으로 보입니다.</b><br>위치: 전라북도 전주시 새롬구 한들길 17<br>운영 시간: 오전 9시 ~ 오후 10시<br>하는 일: 책을 빌려 읽고, 다양한 자료를 이용할 수 있어요.<br>대여 방법: 빌리고 싶은 책과 회원 카드를 사서에게 보여주면 대여할 수 있습니다.',
        place: ['도서관', '약국', '공원', '버스정류장'], job: ['사서', '편의점 판매원', '약사', '버스 기사'],
        role: ['책을 빌릴 수 있도록 도와준다.', '물건을 구매할 수 있도록 도와준다.', '약을 구매할 수 있도록 도와준다.', '공원을 깨끗하게 관리한다.'] },
      { key: 'park', info: '<b>사진에 나타난 곳은 달빛공원으로 보입니다.</b><br>위치: 서울특별시 한빛구 새봄로 123<br>운영 시간: 오전 5시 ~ 오후 10시<br>하는 일: 산책, 운동, 휴식을 즐기며 자연을 만날 수 있습니다.<br>방문 후기: 산책하기 좋고 아이들과 함께 방문하기 좋다는 후기가 있습니다.',
        place: ['공원', '약국', '편의점', '버스정류장'], job: ['공원 관리인', '약사', '사서', '버스 기사'],
        role: ['공원을 깨끗하고 안전하게 관리한다.', '물건을 구매할 수 있도록 도와준다.', '약을 구매할 수 있도록 도와준다.', '목적지까지 안전하게 이동하도록 도와준다.'] },
      { key: 'bus', info: '<b>사진에 나타난 곳은 은하 버스정류장으로 보입니다.</b><br>위치: 대전광역시 은하구 별빛리 777<br>운영 시간: 버스마다 운행 시간이 다릅니다. 노선을 확인하고 이용하세요.<br>하는 일: 버스를 기다리고, 원하는 버스를 타고 다른 장소로 이동할 수 있습니다.',
        place: ['버스정류장', '도서관', '편의점', '공원'], job: ['버스 기사', '공원 관리인', '약사', '사서'],
        role: ['목적지까지 안전하게 이동하도록 도와준다.', '물건을 구매할 수 있도록 도와준다.', '약을 구매할 수 있도록 도와준다.', '길을 안전하게 건널 수 있도록 도와준다.'] },
      { key: 'store', info: '<b>사진에 나타난 곳은 우리동네 편의점으로 보입니다.</b><br>운영 시간: 24시간 운영, 연중무휴로 운영됩니다.<br>주요 서비스: 식음료, 생활용품, 간편식 등을 구매할 수 있습니다.',
        place: ['편의점', '도서관', '약국', '버스정류장'], job: ['편의점 판매원', '공원 관리인', '사서', '버스 기사'],
        role: ['물건을 구매할 수 있도록 도와준다.', '약을 구매할 수 있도록 도와준다.', '목적지까지 안전하게 이동하도록 도와준다.', '책을 빌릴 수 있도록 도와준다.'] },
      { key: 'school', info: '<b>사진에 나타난 곳은 우리중학교로 보입니다.</b><br>위치: 경기도 고양시 한결구 가람로 33<br>운영 시간: 오전 8시 ~ 오후 4시 30분, 토요일과 일요일은 휴무입니다.<br>학교 주변 모습: 학교 앞 횡단보도에서는 학생들이 안전하게 길을 건널 수 있도록 신호를 안내해줍니다.',
        place: ['학교', '편의점', '약국', '버스정류장'], job: ['교통안전 도우미', '공원 관리인', '편의점 판매원', '버스 기사'],
        role: ['안전하게 길을 건널 수 있도록 도와준다.', '물건을 구매할 수 있도록 도와준다.', '목적지까지 안전하게 이동하도록 도와준다.', '책을 빌릴 수 있도록 도와준다.'] }
    ];
    const STEPS = ['place', 'job', 'role'];
    const ASK = { place: '사진은 어떤 장소인가요?', job: '이 곳에서 만날 수 있는 이웃은 누구인가요?', role: '이웃의 역할은 무엇인가요?' };
    const TOTAL = PLACES.length * STEPS.length;

    const opts = $('p12Opts');
    let n = 0;

    function show() {
      const p = PLACES[Math.floor(n / 3)];
      const step = STEPS[n % 3];
      const photo = $('p12Photo');
      const isPhone = step !== 'place';
      $('p12Left').classList.toggle('is-phone', isPhone);
      photo.classList.toggle('is-phone', isPhone);
      if (isPhone) {
        const rows = p.info.split('<br>');
        const title = rows[0].replace(/<\/?b>/g, '');
        const name = (/곳은 (.+?)(?:으로|로) 보입니다/.exec(title) || [])[1] || '';
        photo.style.backgroundImage = '';
        photo.innerHTML = '<div class="phone-frame p12-phone"><div class="p12-phone-screen">' +
          '<div class="p12-ph-search"><i style="background-image:url(img/p12_place_' + p.key + '.png)"></i>이 이미지에 대해 질문하기</div>' +
          '<div class="p12-ph-tabs"><span>AI 모드</span><b>전체</b><span>정확히 일치하는 결과</span><span>시각적으로 일치하는 항목</span></div>' +
          '<p class="p12-ph-ai">AI 개요</p>' +
          '<p class="p12-ph-title">' + title + '</p><p class="p12-ph-sub">' + name + ' 정보</p>' +
          rows.slice(1).map((r) => { const i = r.indexOf(': '); return '<div class="p12-ph-line"><b>' + r.slice(0, i) + ':</b> ' + r.slice(i + 2) + '</div>'; }).join('') +
          '</div></div>';
      } else {
        photo.innerHTML = '';
        photo.style.backgroundImage = "url('img/p12_place_" + p.key + ".png')";
      }
      $('p12Info').innerHTML = p.info;
      $('p12Info').classList.toggle('is-off', step === 'place');
      $('p12Q').innerHTML = ASK[step];
      opts.className = 'p12-opts' + (step === 'role' ? ' is-role' : '') + (step === 'job' ? ' is-job' : '');
      opts.innerHTML = '';
      shuffleArray(p[step].map((text, i) => ({ text, right: i === 0 }))).forEach((o) => {
        const btn = document.createElement('button');
        btn.className = (step === 'job' ? 'p12-jobcard' : 'card-btn p12-opt') + (step === 'role' ? ' is-left' : '');
        btn.innerHTML = (step === 'job' ? "<i style=\"background-image:url('img/p12_job_" + JOB_IMG[o.text] + ".png')\"></i>" : '') + '<span>' + o.text + '</span>';
        btn.addEventListener('click', () => pick(btn, o.right));
        opts.appendChild(btn);
      });
    }

    function pick(btn, right) {
      if (!right) {
        playWrong();
        btn.classList.remove('is-wrong');
        void btn.offsetWidth;
        btn.classList.add('is-wrong');
        return;
      }
      playCorrect();
      btn.classList.add('is-selected');
      opts.classList.add('is-locked');
      n += 1;
      $('p12Fill').style.width = (n / TOTAL * 100) + '%';
      setTimeout(() => {
        if (n >= TOTAL) {
          navigateTo('page13.html');
          return;
        }
        show();
      }, 1000);
    }

    show();
  })();
  </script>
</body>
</html>
