<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 동네 이웃 앨범 만들기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 73p 마무리. 왼쪽 앨범 뒤표지(제목 + 다시하기 · 다음 차시 학습하기), 오른쪽 말풍선 + 메인 캐릭터 */
        main{position:absolute;left:0;top:120px;width:1920px;height:960px}

        .p14-cover{position:absolute;left:210px;top:60px;width:760px;height:840px;box-sizing:border-box;padding:110px 60px 80px;border-radius:30px 50px 50px 30px;background:#48159c;
          box-shadow:inset 22px 0 0 #31248a,0 16px 0 0 #1b1738;display:flex;flex-direction:column;align-items:center;gap:60px}
        .p14-cover h2{margin:0 0 30px;font-family:'Cafe24 Ssurround';font-weight:normal;font-size:80px;line-height:1.25;color:#fff;text-align:center;letter-spacing:-0.05em}
        .p14-cover a img{display:block;height:122px;width:auto}

        .p14-bubble{left:1080px;bottom:auto;top:60px;width:640px;font-size:50px}
        .p14-character{position:absolute;left:1150px;top:380px;width:500px;height:560px;display:flex;align-items:flex-end;justify-content:center}
        .p14-character img{max-width:100%;max-height:100%;object-fit:contain}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="p14-cover">
            <h2>우리 동네 이웃 앨범<br>만들기 성공!</h2>
            <a href="page11.html" class="js-nav-effect">
              <img src="../../img/common/btn_retry.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_retry_on.png" data-src-over="../../img/common/btn_retry_over.png" data-sound="sound/click.mp3" alt="다시하기">
            </a>
            <a href="../08/page01.html" class="js-nav-effect">
              <img src="../../img/common/btn_next_lesson.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_next_lesson_on.png" data-src-over="../../img/common/btn_next_lesson_over.png" data-sound="sound/click.mp3" alt="다음차시 학습하기">
            </a>
          </div>

          <p class="guide-bubble p14-bubble">우리 동네에서 만날 수 있는<br>이웃을 찾아보고,<br>이웃의 역할도 이해했어요!</p>
          <div class="p14-character"><img src="img/p_character_main.png" alt="메인 캐릭터"></div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="우리 동네 이웃 앨범 만들기" data-next="../sa.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
