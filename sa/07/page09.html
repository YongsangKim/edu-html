<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 동네 이웃 지도 탐험하기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 24~43p. 지도에서 장소 5곳(순서 자유) → 장소마다 같은 흐름:
           미션 말풍선 → 휴대폰을 끌어 간판에 맞추기(가까이 놓으면 자석처럼 붙음) → 렌즈 버튼 → 결과 창 끌어올리기 → 더보기 →
           알맞은 정보 줄 클릭 → 추가 질문 입력(입력창 → 질문 버튼 → 보내기 → 2초 로딩 → 답변 타이핑) → 지도로(노란 별).
           5곳 다 하면 완료 팝업 → 퀴즈. 지도 img/p09_map.png, 장소 그림 img/p09_scene_{key}.png(간판 위치 target 좌표는 그림 들어오면 맞춤).
           휴대폰 결과 화면은 HTML로 그림. 캐릭터는 임시로 sa/06 캐릭터 복사본 */
        main{position:absolute;left:0;top:120px;width:1920px;height:960px}
        .p09-view.is-off, .is-hide{display:none!important}

        /* 지도 */
        .p09-map-title{position:absolute;left:560px;top:30px;width:800px;height:96px;margin:0;box-sizing:border-box;padding-top:6px;display:flex;align-items:center;justify-content:center;
          background:#e6dafe;border:solid 5px #8278ff;border-radius:48px;font-family:'Cafe24 Ssurround';font-size:52px;color:#1b1738;letter-spacing:-0.05em}
        .p09-map{position:absolute;left:130px;top:160px;width:1660px;height:770px;box-sizing:border-box;border:solid 8px #1b1738;border-radius:36px;background:#eef0fb url('img/p09_map.png') center / cover no-repeat}
        .p09-spot{position:absolute;width:300px;height:320px;padding:0;border:0;background:none;cursor:pointer;transition:transform .2s}
        .p09-spot:hover{transform:scale(1.06)}
        .p09-spot i{position:absolute;left:30px;top:0;width:240px;height:240px;border-radius:24px;background:#d9d2f5 center / contain no-repeat}
        .p09-spot span{position:absolute;left:30px;bottom:0;width:240px;height:66px;box-sizing:border-box;padding-top:6px;display:flex;align-items:center;justify-content:center;
          background:#fff;border:solid 4px #8278ff;border-radius:33px;font-family:'Cafe24 Ssurround';font-size:38px;color:#1b1738}
        .p09-spot b{position:absolute;right:0;top:0;width:64px;height:62px;background:url('../../img/common/icon_star.png') center / contain no-repeat}
        .p09-spot.is-done b{background-image:url('../../img/common/icon_star_on.png')}
        .p09-spot.is-done{pointer-events:none}

        /* 장소 장면 */
        .p09-scene{position:absolute;left:20px;top:20px;width:1880px;height:920px;box-sizing:border-box;border:solid 8px #1b1738;border-radius:36px;overflow:hidden;background:#cfd8e8 center / cover no-repeat}
        .p09-scene-name{position:absolute;left:0;top:30px;height:90px;padding:6px 70px 0 60px;box-sizing:border-box;display:flex;align-items:center;background:#fff;border-radius:0 45px 45px 0;
          font-family:'Cafe24 Ssurround';font-size:52px;color:#1b1738;z-index:3}
        .p09-target{position:absolute;left:1080px;top:120px;width:320px;height:460px;border:dashed 6px rgba(255,216,61,.9);border-radius:30px}
        .p09-cam{position:absolute;left:640px;top:200px;width:320px;height:620px;box-sizing:border-box;border:solid 16px #1b1738;border-radius:48px;background:rgba(255,255,255,.12);cursor:grab;touch-action:none;z-index:5;
          box-shadow:0 0 0 4px #c9c4bb,0 20px 40px rgba(0,0,0,.35)}
        .p09-cam:before{content:'Google 렌즈';position:absolute;left:0;top:24px;width:100%;text-align:center;font-family:'Pretendard';font-size:22px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
        .p09-cam.is-dragging{cursor:grabbing}
        .p09-cam.is-back{transition:left .3s,top .3s}
        .p09-home{position:absolute;left:760px;top:60px;width:400px;height:800px;box-sizing:border-box;padding:16px;background:#1b1738;border-radius:56px;box-shadow:0 0 0 5px #c9c4bb,0 20px 40px rgba(0,0,0,.35);z-index:5}
        .p09-home div{position:relative;width:100%;height:100%;border-radius:42px;background:linear-gradient(160deg,#c9d8ff,#e9c6f4 55%,#b8c8ff)}
        .p09-home div:before{content:'';position:absolute;left:50%;top:16px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#1b1738}
        .p09-app{position:absolute;left:50%;top:44%;width:130px;margin-left:-65px;padding:0;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;font:600 20px 'Pretendard';color:#1b1738}
        .p09-app i{width:110px;height:110px;border-radius:28px;background:#fff url('img/p09_app_lens.png') center / 80% no-repeat;box-shadow:0 6px 14px rgba(0,0,0,.2);transition:transform .15s}
        .p09-app:hover i{transform:scale(1.06)}
        .p09-shutter{position:absolute;left:50%;bottom:40px;width:96px;height:96px;margin-left:-48px;padding:0;border:solid 6px #fff;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer;font-size:40px}

        /* 말풍선 + 캐릭터 */
        .p09-bubble{position:absolute;left:40px;top:auto;bottom:560px;width:560px;margin:0;box-sizing:border-box;padding:30px;background:#fefbf9;border:solid 5px #48159c;border-radius:30px;box-shadow:-7px 10px 6px 2px rgba(92,61,240,.17);
          font-family:'Cafe24 Ssurround';font-size:40px;line-height:1.35;color:#48159c;text-align:center;letter-spacing:-0.05em;word-break:keep-all;z-index:6}
        .p09-bubble:before{content:'';position:absolute;left:220px;bottom:-58px;width:100px;height:70px;background:url('../../img/common/p_guide_tail.png') 0 0 / contain no-repeat}
        .p09-character{position:absolute;left:60px;top:470px;width:520px;height:420px;display:flex;align-items:flex-end;justify-content:center;z-index:6}
        .p09-character img{max-width:100%;max-height:100%;object-fit:contain}

        /* 결과 휴대폰 */
        .p09-phone{position:absolute;left:680px;top:20px;width:560px;height:920px;box-sizing:border-box;padding:18px;background:#1b1738;border-radius:70px;box-shadow:0 0 0 6px #c9c4bb}
        .p09-screen{position:relative;width:100%;height:100%;border-radius:54px;overflow:hidden;background:#111 center / cover no-repeat;font-family:'Pretendard';color:#1b1738}
        .p09-sheet{position:absolute;left:0;top:560px;width:100%;height:100%;box-sizing:border-box;padding:18px 26px 120px;border-radius:30px 30px 0 0;background:#fff;box-shadow:0 -6px 20px rgba(0,0,0,.25);touch-action:none;cursor:grab}
        .p09-sheet.is-anim{transition:top .35s ease}
        .p09-sheet.is-open{cursor:default}
        .p09-handle{display:block;width:80px;height:8px;margin:0 auto 16px;border-radius:4px;background:#c4c9d4}
        .p09-scroll{height:100%;overflow-y:auto}
        /* 닫힌 동안엔 안쪽 스크롤 칸도 손가락 끌기를 브라우저 스크롤로 넘기지 않게(모바일에서 끌어올리기가 취소되던 문제) */
        .p09-sheet:not(.is-open) .p09-scroll{overflow:hidden;touch-action:none}
        .p09-ai{margin:0 0 10px;font-size:25px;font-weight:700;color:#1a73e8}
        .p09-ai:before{content:'✦ '}
        .p09-sheet h4{margin:0 0 10px;font-size:25px;font-weight:600;line-height:1.4}
        .p09-sheet h5{margin:0 0 8px;font-size:25px;font-weight:800}
        .p09-line{display:block;width:100%;margin:0 0 8px;padding:8px 12px;box-sizing:border-box;border:0;border-radius:12px;background:none;text-align:left;font:500 23px/1.45 'Pretendard';color:#1b1738}
        .p09-line b{font-weight:800}
        .p09-line.is-key b{color:#1a73e8}
        .p09-lines.is-pick .p09-line{cursor:pointer;background:#f3f6fb}
        .p09-lines.is-pick .p09-line:hover{background:#e3edff}
        .p09-line.is-right{background:#fff3a8!important;box-shadow:0 0 0 4px #ffd83d}
        .p09-line.is-wrong{animation:fix-word-shake .3s ease}
        .p09-more{display:block;width:100%;height:56px;margin:8px 0;border:solid 2px #1a73e8;border-radius:28px;background:#fff;font:600 22px 'Pretendard';color:#1a73e8;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
        .p09-more:after{content:'';width:12px;height:12px;margin-top:-6px;border-right:solid 3px currentColor;border-bottom:solid 3px currentColor;transform:rotate(45deg)}
        .p09-swipe{position:absolute;width:110px;z-index:30;pointer-events:none;animation:p09-swipe 1.6s ease-in-out infinite}
        @keyframes p09-swipe{0%{transform:translateY(0);opacity:0}15%{opacity:1}70%{transform:translateY(-300px);opacity:1}85%,100%{transform:translateY(-300px);opacity:0}}
        .p09-extra{margin:10px 0 0;font-size:22px;line-height:1.5}
        .p09-extra li{margin-left:26px}
        .p09-ask{position:absolute;left:18px;right:18px;bottom:18px;height:74px;display:flex;align-items:center;gap:10px;padding:0 10px 0 22px;box-sizing:border-box;border-radius:37px;background:#f1f3f4;font:500 22px 'Pretendard';color:#5f6368;cursor:pointer;z-index:3}
        .p09-ask span{flex:1 1 auto}
        .p09-ask.is-typed span{color:#1b1738}
        .p09-send{width:54px;height:54px;border:0;border-radius:50%;background:#1a73e8;color:#fff;font-size:26px;cursor:pointer}
        .p09-chat{position:absolute;inset:0;padding:60px 26px 110px;box-sizing:border-box;background:rgba(255,255,255,.93);backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:18px;overflow-y:auto;z-index:2}
        .p09-me{align-self:flex-end;max-width:80%;padding:14px 20px;border-radius:22px 22px 4px 22px;background:#e3edff;font:600 22px/1.4 'Pretendard'}
        .p09-ans{max-width:92%;padding:16px 20px;border-radius:22px 22px 22px 4px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.1);font:500 23px/1.5 'Pretendard';white-space:pre-wrap}
        .p09-loading{font:600 22px 'Pretendard';color:#1a73e8}
        .p09-loading:after{content:'...';animation:p09-dots 1s steps(4) infinite}
        @keyframes p09-dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

        .p09-qbtn.card-btn{position:absolute;left:1290px;top:700px;width:560px;height:auto;min-height:130px;padding:18px 30px 12px;font-size:40px;line-height:1.2;word-break:keep-all}
        .p09-next.card-btn{position:absolute;right:70px;bottom:60px;min-width:0;width:300px;height:110px;padding:8px 10px 0;font-size:56px;z-index:7}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="p09-view" id="p09Map">
            <p class="p09-map-title">어떤 장소를 탐험해볼까요?</p>
            <div class="p09-map" id="p09Spots"></div>
          </div>

          <div class="p09-view is-off" id="p09SceneView">
            <div class="p09-scene" id="p09Scene">
              <span class="p09-scene-name" id="p09SceneName"></span>
              <div class="p09-target is-hide" id="p09Target"></div>
              <div class="p09-home is-hide" id="p09Home"><div><button class="p09-app" id="p09App"><i></i>Google 렌즈</button></div></div>
              <div class="p09-cam is-hide" id="p09Cam"><button class="p09-shutter is-hide" id="p09Shutter" aria-label="렌즈로 검색">🔍</button></div>
            </div>
          </div>

          <div class="p09-view is-off" id="p09ResultView">
            <div class="p09-phone">
              <div class="p09-screen" id="p09Screen">
                <div class="p09-sheet" id="p09Sheet">
                  <span class="p09-handle"></span>
                  <div class="p09-scroll" id="p09Scroll"></div>
                </div>
                <div class="p09-chat is-hide" id="p09Chat"></div>
                <div class="p09-ask is-hide" id="p09Ask"><span id="p09AskText">질문하기</span><button class="p09-send" id="p09Send" aria-label="보내기">↑</button></div>
              </div>
            </div>
            <button class="card-btn p09-qbtn is-hide" id="p09QBtn"></button>
          </div>

          <p class="p09-bubble is-hide" id="p09Bubble"><span id="p09BubbleText"></span></p>
          <button class="card-btn p09-next is-hide" id="p09Next">다음</button>
          <div class="p09-character is-hide" id="p09Char"><img src="img/p_character_main.png" alt="메인 캐릭터"></div>

          <div class="avatar-modal is-off" id="p09Done">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_correct.png" alt=""></div>
              <div class="avatar-popup-body is-finish">
                <p class="avatar-popup-text">잘했어요!</p>
                <p class="avatar-popup-sub">우리 동네 이웃 지도를 모두 탐험했어요.</p>
                <a href="page10.html" class="js-nav-effect avatar-popup-next">
                  <img src="../../img/common/btn_next_small.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_next_small_on.png" data-src-over="../../img/common/btn_next_small_over.png" data-sound="sound/click.mp3" alt="다음">
                </a>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="우리 동네 이웃 지도 탐험하기" data-next="page10.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    // spot: 지도 위 위치, lines: [머리말, 내용], key: 정답 줄 번호
    const PLACES = [
      { key: 'pharmacy', name: '약국', spot: [60, 60],
        mission: '약국에서는 어떤 도움을<br>받을 수 있을까요?<br>구글렌즈로 알아봐요!',

        extra: ['약국 운영 시간 및 휴무일 안내', '약을 구입하고 복용 방법을 안내받는 방법', '약국 위치 및 찾아가는 길'],
        find: '약국에서는 어떤 도움을 받을 수 있는지 해당하는 부분을 찾아 클릭해봐요.', wrong: '약국에서 하는 일을 찾아봐요!',

        question: '약국의 영업 시간을 알려줘.', done: '좋아요! 약국의<br>영업 시간도 확인했어요!',
        answerText: '행복약국의 영업 시간은 오전 9시~오후 6시입니다. 일요일은 휴무일 수 있으니 실제 운영 시간을 확인 후 방문하는 걸 권장합니다.' },
      { key: 'park', name: '공원', spot: [640, 30],
        mission: '공원의 운영 시간은<br>언제일까요?<br>구글렌즈로 알아봐요!',
        title: '사진에 나타난 곳은 달빛공원으로 보입니다.', sub: '달빛공원 정보',
        lines: [['위치', '서울특별시 한빛구 새봄로 123'], ['운영 시간', '오전 5시 ~ 오후 10시<br>계절과 날씨에 따라 운영 시간이 달라질 수 있습니다.'], ['하는 일', '산책, 운동, 휴식을 즐기며 자연을 만날 수 있습니다.'], ['방문 후기', '산책하기 좋고 아이들과 함께 방문하기 좋다는 후기가 있습니다.']], answer: 1,
        extraHead: '달빛공원 이용과 관련하여 다음 정보를 안내해 드릴 수 있습니다.',

        find: '공원의 운영 시간은 언제인지 해당하는 부분을 찾아 클릭해봐요.', wrong: '공원의 운영 시간을 찾아봐요!',

        question: '공원에는 어떤 시설이 있는지 알려줘.', done: '좋아요! 공원에서 이용할 수 있는<br>시설을 확인했어요!',
        answerText: '공원에는 운동을 할 수 있는 기구들과 휴식을 취할 수 있는 벤치가 있어요. 모든 사람들이 함께 이용하는 공공 기물이기 때문에 깨끗하게 사용해야 해요.' },
      { key: 'store', name: '편의점', spot: [1230, 80],

        extraHead: '우리동네 편의점 이용과 관련하여 다음 정보를 안내해 드릴 수 있습니다.',

        right: '좋아요! 편의점에서는 내가 필요한<br>물건을 구매할 수 있어요!', more: '편의점의 위치를<br>추가로 확인해볼까요?',
        question: '우리동네 편의점이 어디 있는지 알려줘.', done: '좋아요! 편의점의<br>위치를 확인했어요!',
        answerText: '우리동네 편의점은 부산광역시 푸른구 해솔길 45에 위치해 있습니다.' },
      { key: 'library', name: '도서관', spot: [330, 380],
        mission: '도서관에서 어떻게<br>책을 빌릴 수 있을까요?<br>구글렌즈로 알아봐요!',
        title: '사진에 나타난 곳은 시립도서관으로 보입니다.', sub: '시립도서관 정보',
        lines: [['위치', '전라북도 전주시 새롬구 한들길 17'], ['운영 시간', '오전 9시 ~ 오후 10시<br>월요일은 휴관일 수 있습니다.'], ['하는 일', '책을 빌려 읽고, 다양한 자료를 이용할 수 있습니다.'], ['대여 방법', '빌리고 싶은 책과 회원 카드를 사서에게 보여주면 대여할 수 있습니다.'], ['방문 후기', '조용해서 공부하기 좋고 책 종류가 많다는 후기가 있습니다.']], answer: 3,
        extraHead: '시립도서관 이용과 관련하여 다음 정보를 안내해 드릴 수 있습니다.',
        extra: ['도서관 행사 및 프로그램 안내', '도서 대출 및 자료 이용 방법', '도서관 위치 및 찾아가는 길'],
        find: '도서관에서 책을 어떻게 빌릴 수 있는지 해당하는 부분을 찾아 클릭해봐요.', wrong: '도서관의 대여 방법을 찾아봐요!',
        right: '좋아요! 책을 빌리는<br>방법을 알았어요!', more: '도서관에서 진행하는 프로그램에 대해<br>추가로 확인해볼까요?',
        question: '도서관에서 진행하는 프로그램에 대해 알려줘.', done: '좋아요! 도서관에서 진행되는<br>프로그램 정보를 확인했어요!',
        answerText: '시립도서관에서는 매 10월마다 “가을 독서 문화제”를 진행합니다. 사전 신청을 하면 초청 작가들의 강연을 들을 수 있습니다.' },
      { key: 'bus', name: '버스정류장', spot: [900, 420],
        mission: '버스정류장의 주소는<br>무엇일까요?<br>구글렌즈로 알아봐요!',
        title: '사진에 나타난 곳은 은하 버스정류장으로 보입니다.', sub: '버스정류장 정보',
        lines: [['위치', '대전광역시 은하구 별빛리 777'], ['운영 시간', '버스마다 운행 시간이 다릅니다. 노선을 확인하고 이용하세요.'], ['하는 일', '원하는 버스를 타고 다른 장소로 이동할 수 있습니다.']], answer: 0,
        extraHead: '버스정류장 이용과 관련하여 다음 정보를 안내해 드릴 수 있습니다.',
        extra: ['버스 운행 시간 및 도착 정보', '이용할 수 있는 버스 노선', '버스정류장 위치 및 찾아가는 길'],
        find: '버스정류장의 주소는 무엇인지 해당하는 부분을 찾아 클릭해봐요.', wrong: '버스 정류장의 위치를 찾아봐요!',
        right: '좋아요! 버스정류장의<br>주소를 확인했어요!', more: '어떤 버스가 다니는지 노선 번호를<br>추가로 확인해볼까요?',
        question: '몇 번 버스를 탈 수 있는지 알려줘.', done: '좋아요! 버스 노선을<br>확인했어요!',
        answerText: '은하 버스정류장에서는 1번, 17번, 17-1번 버스를 탈 수 있습니다. 꼭 방향을 확인하고 탑승하길 권장합니다.' }
    ];
    const SHEET_OPEN = 60;
    const SHEET_CLOSED = 560;

    const $ = (id) => document.getElementById(id);
    const stage = document.getElementById('stage');
    const playCorrect = makeSfx('sound/correct.mp3');
    const playWrong = makeSfx('sound/incorrect.mp3');
    const playClick = makeSfx('sound/click.mp3');
    const done = new Set();
    let place = null;
    let onNext = null;
    let findMode = false;

    const show = (el, on) => el.classList.toggle('is-hide', !on);
    const view = (id) => ['p09Map', 'p09SceneView', 'p09ResultView'].forEach((v) => $(v).classList.toggle('is-off', v !== id));

    function say(html, nextFn) {
      $('p09BubbleText').innerHTML = html;
      show($('p09Bubble'), true);
      show($('p09Char'), true);
      onNext = nextFn || null;
      show($('p09Next'), !!nextFn);
    }
    $('p09Next').addEventListener('click', () => {
      playClick();
      clearFingers();
      const fn = onNext;
      onNext = null;
      if (fn) fn();
    });

    // 지도
    PLACES.forEach((p) => {
      const btn = document.createElement('button');
      btn.className = 'p09-spot';
      btn.dataset.key = p.key;
      btn.style.left = p.spot[0] + 'px';
      btn.style.top = p.spot[1] + 'px';
      btn.innerHTML = "<i style=\"background-image:url('img/p09_spot_" + p.key + ".png')\"></i><span>" + p.name + '</span><b></b>';
      btn.addEventListener('click', () => { playClick(); start(p); });
      $('p09Spots').appendChild(btn);
    });

    function toMap() {
      clearFingers();
      show($('p09Next'), false);
      show($('p09Bubble'), false);
      show($('p09Char'), false);
      view('p09Map');
      if (done.size === PLACES.length) setTimeout(() => $('p09Done').classList.remove('is-off'), 400);
    }

    // 1) 미션 → 2) 휴대폰 맞추기 → 3) 렌즈 버튼
    function start(p) {
      place = p;
      view('p09SceneView');
      $('p09Scene').style.backgroundImage = "url('img/p09_scene_" + p.key + ".png')";
      $('p09SceneName').textContent = p.name;
      show($('p09Target'), false);
      show($('p09Cam'), false);
      show($('p09Shutter'), false);
      show($('p09Home'), true);
      say(p.mission);
      pointFingerAt($('p09App'), { onMain: true });
    }

    $('p09App').addEventListener('click', () => {
      playClick();
      clearFingers();
      show($('p09Home'), false);
      aim();
    });

    const cam = $('p09Cam');
    const target = $('p09Target');
    const CAM_HOME = [640, 200];

    function aim() {
      say('핸드폰을 움직여<br>이미지 검색할 곳을 찾아보세요.');
      cam.style.left = CAM_HOME[0] + 'px';
      cam.style.top = CAM_HOME[1] + 'px';
      cam.dataset.locked = '';
      show(target, true);
      show(cam, true);
    }

    cam.addEventListener('pointerdown', (e) => {
      if (cam.dataset.locked || e.target.closest('.p09-shutter')) return;
      e.preventDefault();
      const s = stage.getBoundingClientRect().width / 1920;
      const sx = e.clientX;
      const sy = e.clientY;
      const x0 = parseFloat(cam.style.left);
      const y0 = parseFloat(cam.style.top);
      cam.setPointerCapture(e.pointerId);
      cam.classList.remove('is-back');
      cam.classList.add('is-dragging');
      const move = (ev) => {
        cam.style.left = x0 + (ev.clientX - sx) / s + 'px';
        cam.style.top = y0 + (ev.clientY - sy) / s + 'px';
      };
      const up = () => {
        cam.removeEventListener('pointermove', move);
        cam.removeEventListener('pointerup', up);
        cam.removeEventListener('pointercancel', up);
        cam.classList.remove('is-dragging');
        cam.classList.add('is-back');
        const dx = parseFloat(cam.style.left) - target.offsetLeft;
        const dy = parseFloat(cam.style.top) - target.offsetTop;
        if (Math.hypot(dx, dy) < 220) {
          cam.style.left = target.offsetLeft + 'px';
          cam.style.top = target.offsetTop + 'px';
          cam.dataset.locked = '1';
          show(target, false);
          playCorrect();
          show($('p09Shutter'), true);
          say('검색 아이콘을 클릭해보세요.');
          // 휴대폰이 간판 자리로 붙는 애니메이션(0.3초) 뒤에 위치를 재야 검색 아이콘을 정확히 가리킴
          setTimeout(() => pointFingerAt($('p09Shutter'), { onMain: true }), 350);
        }
      };
      cam.addEventListener('pointermove', move);
      cam.addEventListener('pointerup', up);
      cam.addEventListener('pointercancel', up);
    });

    $('p09Shutter').addEventListener('click', () => {
      playClick();
      clearFingers();
      openResult();
    });

    // 4) 결과 창 끌어올리기 → 5) 더보기 → 6) 알맞은 줄 클릭
    const sheet = $('p09Sheet');
    function openResult() {
      view('p09ResultView');
      $('p09Screen').style.backgroundImage = "url('img/p09_scene_" + place.key + ".png')";
      show($('p09Chat'), false);
      show($('p09Ask'), false);
      show($('p09QBtn'), false);
      $('p09AskText').textContent = '질문하기';
      $('p09Ask').classList.remove('is-typed');
      sheet.classList.remove('is-open', 'is-anim');
      sheet.style.top = SHEET_CLOSED + 'px';
      findMode = false;
      $('p09Scroll').scrollTop = 0;
      $('p09Scroll').innerHTML = '<p class="p09-ai">AI 개요</p><h4>' + place.title + '</h4><h5>' + place.sub + '</h5>' +
        '<div class="p09-lines" id="p09Lines">' + place.lines.map((l, i) => '<button class="p09-line" data-i="' + i + '"><b>' + l[0] + ':</b> ' + l[1] + '</button>').join('') + '</div>' +
        '<button class="p09-more" id="p09More">더보기</button>' +
        '<div class="p09-extra is-hide" id="p09Extra"><p>' + place.extraHead + '</p><ul>' + place.extra.map((t) => '<li>' + t + '</li>').join('') + '</ul></div>';
      say('화면을 끌어 올려봐요.');
      swipeFinger(sheet.querySelector('.p09-handle'));
      $('p09More').addEventListener('click', () => {
        playClick();
        clearFingers();
        show($('p09More'), false);
        show($('p09Extra'), true);
        startFind();
      });
    }

    sheet.addEventListener('pointerdown', (e) => {
      if (sheet.classList.contains('is-open')) return;
      e.preventDefault();
      const s = stage.getBoundingClientRect().width / 1920;
      const sy = e.clientY;
      sheet.setPointerCapture(e.pointerId);
      sheet.classList.remove('is-anim');
      const move = (ev) => {
        const top = Math.min(SHEET_CLOSED, Math.max(SHEET_OPEN, SHEET_CLOSED + (ev.clientY - sy) / s));
        sheet.style.top = top + 'px';
      };
      const up = () => {
        sheet.removeEventListener('pointermove', move);
        sheet.removeEventListener('pointerup', up);
        sheet.removeEventListener('pointercancel', up);
        sheet.classList.add('is-anim');
        // 기획서: 어느 정도(3분의 1쯤)만 올리면 나머지는 자동으로 올라감
        if (parseFloat(sheet.style.top) < SHEET_CLOSED - 150) {
          sheet.style.top = SHEET_OPEN + 'px';
          sheet.classList.add('is-open');
          clearFingers();
          show($('p09Ask'), true);
          say('더보기 버튼을 눌러<br>내용을 자세히 확인해봐요.');
          // 결과 창이 올라가는 애니메이션(0.35초)이 끝난 뒤 위치를 재야 더보기 버튼을 정확히 가리킴
          setTimeout(() => pointFingerAt($('p09More'), { onMain: true }), 400);
        } else {
          sheet.style.top = SHEET_CLOSED + 'px';
        }
      };
      sheet.addEventListener('pointermove', move);
      sheet.addEventListener('pointerup', up);
      sheet.addEventListener('pointercancel', up);
    });

    // 결과 창 손잡이에서 위로 끌어올리는 손가락(반복). clearFingers로 같이 지워지게 js-point-finger를 붙임
    function swipeFinger(el) {
      clearFingers();
      const main = el.closest('main');
      const s = main.getBoundingClientRect().width / main.offsetWidth;
      const r = el.getBoundingClientRect();
      const m = main.getBoundingClientRect();
      const f = document.createElement('img');
      f.className = 'p09-swipe js-point-finger';
      f.src = '../../img/common/img_finger01.png';
      f.style.left = ((r.left - m.left + r.width / 2) / s - 30) + 'px';
      f.style.top = ((r.top - m.top) / s + 10) + 'px';
      main.appendChild(f);
    }

    function startFind() {
      findMode = true;
      $('p09Lines').classList.add('is-pick');
      say(place.find);
    }

    $('p09Scroll').addEventListener('click', (e) => {
      const line = e.target.closest('.p09-line');
      if (!findMode || !line) return;
      if (Number(line.dataset.i) !== place.answer) {
        playWrong();
        line.classList.remove('is-wrong');
        void line.offsetWidth;
        line.classList.add('is-wrong');
        $('p09Lines').children[place.answer].classList.add('is-key');
        say(place.wrong);
        return;
      }
      findMode = false;
      playCorrect();
      line.classList.add('is-right');
      $('p09Lines').classList.remove('is-pick');
      say(place.right, () => say(place.more, askStep));
    });

    // 7) 추가 질문: 입력창 → 질문 버튼 → 보내기 → 로딩 2초 → 답변 타이핑
    let askPhase = '';
    function askStep() {
      askPhase = 'input';
      say('질문하기 입력창을 클릭해요.');
      pointFingerAt($('p09Ask'), { onMain: true, x: 0.45 });
    }
    $('p09Ask').addEventListener('click', (e) => {
      if (e.target.closest('.p09-send')) return;
      if (askPhase !== 'input') return;
      playClick();
      askPhase = 'button';
      clearFingers();
      show($('p09Chat'), true);
      $('p09Chat').innerHTML = '';
      $('p09QBtn').textContent = place.question;
      show($('p09QBtn'), true);
      say('오른쪽의 버튼을 눌러<br>질문을 입력해요.');
    });
    $('p09QBtn').addEventListener('click', () => {
      if (askPhase !== 'button') return;
      playClick();
      askPhase = 'send';
      clearFingers();
      show($('p09QBtn'), false);
      $('p09AskText').textContent = place.question;
      $('p09Ask').classList.add('is-typed');
      say('보내기 버튼을 클릭해요.');
      pointFingerAt($('p09Send'), { onMain: true });
    });
    $('p09Send').addEventListener('click', () => {
      if (askPhase !== 'send') return;
      playClick();
      askPhase = '';
      clearFingers();
      $('p09AskText').textContent = '질문하기';
      $('p09Ask').classList.remove('is-typed');
      const chat = $('p09Chat');
      chat.innerHTML = '<div class="p09-me">' + place.question + '</div><div class="p09-loading">답변을 생성하고 있어요</div>';
      say('구글 렌즈가<br>답변을 생성하고 있어요.');
      setTimeout(() => {
        chat.querySelector('.p09-loading').remove();
        const ans = document.createElement('div');
        ans.className = 'p09-ans';
        chat.appendChild(ans);
        let i = 0;
        const typer = setInterval(() => {
          i += 1;
          ans.textContent = place.answerText.slice(0, i);
          if (i >= place.answerText.length) {
            clearInterval(typer);
            say(place.done, finishPlace);
          }
        }, 40);
      }, 2000);
    });

    function finishPlace() {
      done.add(place.key);
      document.querySelector('.p09-spot[data-key="' + place.key + '"]').classList.add('is-done');
      toMap();
    }
  })();
  </script>
</body>
</html>
