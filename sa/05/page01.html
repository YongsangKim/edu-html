<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 선택 미션</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 2p 도입 화면, 공용 .intro-* */
        main{position:absolute;left:0;top:120px;width:1920px;height:960px}
        .intro-panel{justify-content:flex-start;padding:80px 50px 50px 50px}
        .intro-panel:has(.intro-lead) .intro-lead{font-size:56px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="intro-character"><img src="img/p_character_intro.png" alt="메인 캐릭터"></div>
          <div class="intro-panel">
            <p class="intro-tab">게임 방법</p>
            <p class="intro-lead">박물관으로 현장체험학습을 가요!<br>출발하기 전에 여러 가지 결정해야 할 것들이 있어요.</p>
            <ol class="intro-list">
              <li>1. 제시된 시간, 비용 등의 조건을 확인해요.</li>
              <li>2. 조건을 생각하며 여러 가지 방법 중 알맞은 방법을 선택해요.</li>
              <li>3. 선택한 방법의 장단점을 찾아봐요.</li>
            </ol>
          </div>

          <a href="page02.html" class="js-nav-effect next-btn-intro">
            <img src="../../img/common/btn_start.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_start_on.png" data-src-over="../../img/common/btn_start_over.png" data-sound="sound/click.mp3" alt="시작하기">
          </a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="오늘의 선택 미션" data-next="page02.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
