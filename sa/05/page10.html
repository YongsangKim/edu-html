<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 32~58p. 준비물 그림 img/p10_item_{key}.png. 가운데 휴대폰 화면(홈 → Gemini 채팅 → Gemini Live)은 기획서 캡처를 CSS로 그린 것.
           1라운드는 두 카드를 하나씩 Gemini에게 물어본 뒤 고르고, 2라운드·결승은 바로 고름. 결과 문구는 최종 선택에 따라 다름.
           기획서 46p 접이식 우산 답변은 앞 문장이 빠져 있어 49p 요약 문구로 채움 */

        .p10-bubble{left:111px;width:555px;min-height:217px;font-size:48px}
        .p10-character{left:128px;top:307px;width:472px;height:629px}

        .p10-phone{position:absolute;left:715px;top:21px;width:496px;height:898px;box-sizing:border-box;border:solid 8px var(--c-ink);border-radius:48px;background:var(--c-white) center / cover no-repeat;overflow:hidden}
        .scr{display:none;position:absolute;inset:0;font-family:'Pretendard';color:var(--c-ink)}
        .p10-phone[data-screen="home"] .scr-home, .p10-phone[data-screen="chat"] .scr-chat, .p10-phone[data-screen="live"] .scr-live, .p10-phone[data-screen="answer"] .scr-live{display:block}
        .p10-phone[data-screen="answer"] .scr-hello{display:none}
        .scr svg{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        .scr-status{position:absolute;left:0;top:0;width:100%;height:50px;padding:14px 26px 0;box-sizing:border-box;display:flex;justify-content:space-between;font-size:20px;font-weight:600}
        .scr-nav{position:absolute;left:0;bottom:0;width:100%;height:70px;display:flex;justify-content:space-around;align-items:center;color:#4a4f5c}
        .scr-nav svg{width:34px;height:34px}
        .scr-star{display:block}
        .scr-home{background:linear-gradient(170deg,#8fd3e8,#b9a8f5 60%,#f0b2d6)}
        .scr-home .scr-status{color:var(--c-white)}
        .scr-home .scr-nav{color:var(--c-white)}
        .scr-app{position:absolute;left:157px;top:358px;width:166px;height:166px;display:flex;align-items:center;justify-content:center}
        .scr-app{flex-direction:column;gap:12px;font-size:24px;font-weight:600;color:var(--c-white)}
        .scr-app span{display:flex;align-items:center;justify-content:center;width:110px;height:110px;border-radius:30px;background:var(--c-white);box-shadow:0 6px 14px rgba(0,0,0,.2)}

        .scr-chat, .scr-live{background:linear-gradient(180deg,var(--c-cream) 0,var(--c-cream) 55%,var(--c-pale) 75%,#a9c8f7 100%)}
        .scr-top{position:absolute;left:0;top:76px;width:100%;height:50px;padding:0 24px;box-sizing:border-box;display:flex;align-items:center;gap:20px}
        .scr-top svg{width:34px;height:34px}
        .scr-top .is-gap{flex:1}
        .scr-model{font-size:25px}
        .scr-hello{position:absolute;left:0;top:380px;width:100%;text-align:center;font-size:30px;line-height:1.4}
        .scr-hello svg{margin:0 auto 18px;width:46px;height:46px;stroke:none}
        .scr-input{position:absolute;left:24px;right:24px;top:718px;height:84px;border-radius:42px;background:var(--c-white);box-shadow:0 4px 14px rgba(27,23,56,.08);display:flex;align-items:center;gap:14px;padding:0 9px 0 24px;box-sizing:border-box;font-size:22px;color:#8d97a6}
        .scr-input .is-gap{flex:1}
        .scr-input svg{width:30px;height:30px;color:var(--c-ink)}
        .scr-wave{display:flex;align-items:center;justify-content:center;width:66px;height:66px;border-radius:50%;background:var(--c-mist)}
        .scr-ctl{position:absolute;left:0;top:735px;width:100%;display:flex;align-items:center;justify-content:center;gap:12px}
        .scr-ctl i{display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:var(--c-white)}
        .scr-ctl i svg{width:28px;height:28px}
        .scr-ctl b{width:132px;height:76px;border-radius:38px;background:linear-gradient(180deg,var(--c-white) 0,var(--c-white) 45%,#8fb4ee 100%)}
        .p10-answer{position:absolute;left:740px;top:160px;width:450px;min-height:208px;box-sizing:border-box;padding:26px 28px;background:var(--c-pale);border-radius:28px;
          font-family:'Pretendard';font-size:32px;line-height:1.5;font-weight:600;color:var(--c-ink);letter-spacing:-0.02em;word-break:keep-all}
        .p10-acts{display:flex;gap:30px;margin-top:22px;color:var(--c-ink)}
        .p10-acts svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

        .p10-side{position:absolute;left:1344px;top:107px;width:360px;height:761px;box-sizing:border-box;padding:30px 0;display:flex;flex-direction:column;align-items:center;justify-content:space-around;
          background:var(--c-cream);border:solid 6px var(--c-purple);border-radius:40px;box-shadow:-7px 10px 6px 2px rgba(92,61,240,.17)}
        .p10-item{width:285px;height:309px;padding:0 0 16px;box-sizing:border-box;border:solid 6px #eae0fd;border-radius:28px;background:var(--c-white);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;
          font-family:'Cafe24 Ssurround';font-size:44px;color:var(--c-indigo);letter-spacing:-0.04em}
        .p10-item i{flex:1 1 auto;width:100%;border-radius:20px 20px 0 0;background:var(--c-pale) center / cover no-repeat}
        .p10-item:hover{border-color:var(--c-violet)}
        .p10-item.is-selected{border-color:#ff4ff9}
        .p10-item:disabled{opacity:.4;cursor:default;border-color:#eae0fd}

        .p10-panel{position:absolute;left:722px;top:77px;width:1091px;height:833px;box-sizing:border-box;background:var(--c-cream);border:solid 6px var(--c-purple);border-radius:48px;box-shadow:-7px 10px 6px 2px rgba(92,61,240,.17)}
        .p10-round{position:absolute;left:918px;top:30px;width:678px;height:95px;box-sizing:border-box;padding:6px 40px 0;display:flex;align-items:center;justify-content:center;z-index:2;
          background:var(--c-sky);border:solid 5px var(--c-ink);border-radius:48px;font-family:'Cafe24 Ssurround';font-size:50px;color:var(--c-white);letter-spacing:-0.02em}
        .p10-vs{position:absolute;left:785px;top:215px;width:972px;display:flex;justify-content:space-between}
        .p10-vs .p10-item{width:454px;height:394px;padding:0 0 20px}
        .p10-vs .p10-item i{flex:1 1 0;min-height:0}
        .p10-vs.is-summary{top:168px}
        .p10-vs.is-summary .p10-item{height:570px}
        .p10-vs.is-summary .p10-item i{flex:0 0 300px}
        .p10-vs .p10-item small{padding:0 26px;font-family:'Pretendard';font-size:28px;line-height:1.45;font-weight:600;color:var(--c-ink);letter-spacing:-0.03em;word-break:keep-all;text-align:left}

        .p10-overview{position:absolute;left:232px;top:79px;width:1456px;height:810px;box-sizing:border-box;padding:40px 0 0;background:var(--c-cream);border:solid 6px var(--c-purple);border-radius:48px;box-shadow:-7px 10px 6px 2px rgba(92,61,240,.17)}
        .p10-overview-title{margin:0 0 30px;text-align:center;font-family:'Cafe24 Ssurround';font-size:60px;color:var(--c-purple);letter-spacing:-0.04em}
        .p10-overview-grid{display:grid;grid-template-columns:repeat(4,268px);gap:24px 36px;justify-content:center}
        .p10-overview-grid .p10-item{width:268px;height:240px;cursor:default;font-size:38px}
        .p10-overview-grid .p10-item:hover{border-color:#eae0fd}

        .p10-result{position:absolute;left:613px;top:121px;width:1188px;height:706px;box-sizing:border-box;background:var(--c-cream);border:solid 6px var(--c-purple);border-radius:60px;box-shadow:-7px 10px 6px 2px rgba(92,61,240,.17)}
        .p10-result-title{position:absolute;left:0;top:40px;width:100%;margin:0;text-align:center;font-family:'Cafe24 Ssurround';font-size:70px;letter-spacing:-0.06em;
          background:linear-gradient(180deg,#02185c,#0362d7);-webkit-background-clip:text;background-clip:text;color:transparent}
        .p10-result .p10-item{position:absolute;left:46px;top:173px;width:325px;height:353px;cursor:default}
        .p10-result-type small{display:block;color:var(--c-ink);font-size:inherit}
        .p10-result-type{position:absolute;left:417px;top:173px;width:710px;height:353px;margin:0;display:flex;flex-direction:column;justify-content:center;text-align:left;
          font-family:'Cafe24 Ssurround';font-size:52px;line-height:1.3;color:var(--c-purple);letter-spacing:-0.05em;word-break:keep-all}

        .p10-hit{position:absolute}

        .p10.is-overview .p10-bubble, .p10.is-overview .p10-character, .p10.is-result .p10-bubble{display:none}
        .p10 .hit-area{padding:0;border:0;background:transparent;border-radius:30px;cursor:pointer}

        .p10 .is-off{display:none}
    </style>
</head>

        type: '친구들과 추억을 모아 보고 공유하는 분위기 메이커 타입!' },
      game: { name: '휴대용 게임기', obj: '휴대용 게임기를',
        answer: '이동 시간이나 숙소에서 친구들과 함께 게임을 즐길 수 있습니다. 다만, 게임이 너무 몰입하다 보면 수학여행 본연의 목적에 소홀해질 수 있습니다.',
        summary: '이동 시간이나 숙소에서 친구들과 함께 게임을 즐길 수 있지만, 게임이 너무 몰입하다 보면 수학여행 본연의 목적에 소홀해질 수 있습니다.',
        type: '틈새 시간까지 즐거움으로 가득 채우는 재미 추구 타입!' }
    };
    const ROUND1 = [['charger', 'battery'], ['carrier', 'backpack'], ['umbrella', 'raincoat'], ['tablet', 'game']];
    const PICK_ASK = '질문하고 싶은<br>준비물 카드를 클릭해요.';

    const bubble = $('p10Bubble');
    const phone = $('p10Phone');
    const answer = $('p10Answer');
    const hit = $('p10Hit');
    const side = $('p10Side');
    const vs = $('p10Vs');
    const nextBtn = $('p10Next');

    let onNext = null;
    let chosen = null;

    function itemBtn(key, withSummary) {
      const it = ITEMS[key];
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'p10-item';
      btn.innerHTML = '<i style="background-image:url(\'img/p10_item_' + key + '.png\')"></i>' + it.name + (withSummary ? '<small>' + it.summary + '</small>' : '');
      return btn;
    }

    function show(ids) {
      ['p10Overview', 'p10Phone', 'p10Answer', 'p10Hit', 'p10Side', 'p10VsView', 'p10Result', 'p10Next'].forEach((id) => $(id).classList.toggle('is-off', !ids.includes(id)));
      document.querySelector('.p10').classList.remove('is-overview', 'is-result');
      // 다음 버튼: 큰 패널 화면은 패널 안 가운데 빈 공간에, 나머지는 기본(오른쪽 아래)
      const at = ids.includes('p10Overview') ? [758, 742] : ids.includes('p10VsView') ? [1065, 665] : ids.includes('p10Result') ? [1005, 670] : null;
      nextBtn.style.cssText = at ? 'left:' + at[0] + 'px;top:' + at[1] + 'px;right:auto;bottom:auto' : '';
      clearFingers();
    }

    function nextThen(fn) {
      onNext = fn;
      nextBtn.classList.remove('is-off');
      resetImageSwap(nextBtn);
    }

    function typeText(el, text, done) {
      let i = 0;
      el.textContent = '';
      const timer = setInterval(() => {
        i += 1;
        el.textContent = text.slice(0, i);
        if (i >= text.length) {
          clearInterval(timer);
          done();
        }
      }, 50);
    }

    function clickGuide(bubbleHtml, screen, rect, then) {
      show(['p10Phone', 'p10Hit']);
      bubble.innerHTML = bubbleHtml;
      phone.dataset.screen = screen;
      hit.style.cssText = 'left:' + rect[0] + 'px;top:' + rect[1] + 'px;width:' + rect[2] + 'px;height:' + rect[3] + 'px;border-radius:' + (rect[4] || '30px');
      pointFingerAt(hit);
      hit.onclick = () => { playClick(); then(); };
    }

    function overview() {
      show(['p10Overview']);
      document.querySelector('.p10').classList.add('is-overview');
      Object.keys(ITEMS).forEach((k) => $('p10OverviewGrid').appendChild(itemBtn(k)));
      nextThen(() => clickGuide('Gemini 앱을 클릭해요.', 'home', [908, 395, 110, 110, '30px'],
        () => clickGuide('Gemini Live 모드<br>버튼을 클릭해요.', 'chat', [1096, 748, 82, 82, '50%'], () => match(0))));
    }

    function match(m, asked) {
      asked = asked || [];
      const pair = ROUND1[m];
      show(['p10Phone', 'p10Side']);
      phone.dataset.screen = 'live';
      bubble.innerHTML = PICK_ASK;
      side.innerHTML = '';
      pair.forEach((key) => {
        const btn = itemBtn(key);
        btn.disabled = asked.includes(key);
        btn.addEventListener('click', () => {
          playClick();
          askGemini(m, key, asked.concat(key));
        });
        side.appendChild(btn);
      });
    }

    const ACTS = '<div class="p10-acts">'
      + '<svg viewBox="0 0 24 24"><path d="M7 11v9H4v-9zM7 11l4-7c1.5 0 2.5 1.2 2.2 2.7L12.7 9H19a2 2 0 011.9 2.6l-1.8 6.5A2 2 0 0117.2 20H7"/></svg>'
      + '<svg viewBox="0 0 24 24"><path d="M7 13V4H4v9zM7 13l4 7c1.5 0 2.5-1.200 2.2-2.700L12.700 15H19a2 2 0 001.900-2.600L19.100 5.900A2 2 0 0017.200 4H7"/></svg>'
      + '<svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 13v7h14v-7"/></svg>'
      + '<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.500"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></svg>'
      + '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.300" fill="currentColor"/><circle cx="12" cy="12" r="1.300" fill="currentColor"/><circle cx="19" cy="12" r="1.300" fill="currentColor"/></svg>'
      + '</div>';

    function askGemini(m, key, asked) {
      show(['p10Phone', 'p10Answer']);
      phone.dataset.screen = 'answer';
      bubble.innerHTML = '수학여행에 ' + ITEMS[key].obj + '<br>가져가면 좋은 점은<br>무엇인가요?';
      answer.innerHTML = '<span></span>';
      typeText(answer.firstChild, ITEMS[key].answer, () => { answer.insertAdjacentHTML('beforeend', ACTS); nextThen(() => {
        if (asked.length < 2) match(m, asked);
        else choose('ROUND 1&nbsp;&nbsp;&nbsp;' + (m + 1) + '/4', '어떤 준비물을<br>가져가는 게 좋을까?', ROUND1[m], true, (w) => {
          round1Winners.push(w);
          if (m < 3) match(m + 1);
          else round2(0);
        });
      }); });
    }

    const round1Winners = [];
    const round2Winners = [];
    const NEED_ASK = '나에게 가장 필요할 것 같은<br>준비물을 골라봐요.';

    function round2(i) {
      choose('ROUND 2&nbsp;&nbsp;&nbsp;' + (i + 1) + '/2', NEED_ASK, round1Winners.slice(i * 2, i * 2 + 2), false, (w) => {
        round2Winners.push(w);
        if (i === 0) round2(1);
        else choose('FINAL ROUND', NEED_ASK, round2Winners, false, result);
      });
    }

    function choose(roundText, ask, pair, withSummary, done) {
      show(['p10VsView']);
      vs.classList.toggle('is-summary', !!withSummary);
      nextBtn.style.top = withSummary ? '765px' : '665px';
      $('p10Round').innerHTML = roundText;
      bubble.innerHTML = ask;
      vs.innerHTML = '';
      chosen = null;
      pair.forEach((key) => {
        const btn = itemBtn(key, withSummary);
        btn.addEventListener('click', () => {
          playClick();
          vs.querySelectorAll('.p10-item').forEach((b) => b.classList.toggle('is-selected', b === btn));
          chosen = key;
          nextThen(() => done(chosen));
        });
        vs.appendChild(btn);
      });
    }

    function result(key) {
      show(['p10Result']);
      document.querySelector('.p10').classList.add('is-result');
      const btn = itemBtn(key);
      btn.disabled = false;
      $('p10ResultItem').replaceChildren(btn);
      $('p10ResultType').innerHTML = ITEMS[key].type + '<small>Gemini Live의 도움을 받아<br>나에게 꼭 필요한 준비물을 골랐어요!</small>';
      nextThen(() => navigateTo('page11.html'));
    }

    nextBtn.addEventListener('click', () => {
      if (!onNext) return;
      const fn = onNext;
      onNext = null;
      nextBtn.classList.add('is-off');
      setTimeout(fn, 300);
    });

    overview();
  })();
  </script>
</body>
</html>
