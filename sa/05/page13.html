<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>최선의 결정 보드게임</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 기획서 63~77p. 보드판 img/p13_bg.png(칸 5곳 포함, TILES 좌표는 그 칸 위치). 미션 성공 칸에 닿으면 캐릭터가 img/p13_student_success.png 로 바뀜(없으면 기존 그림 유지).
           칸에 도착하면 1초 뒤 그 칸의 창이 뜸. 삽화 img/p13_mission.png, 방법 그림 img/p13_way_{sign|ask|map|ai}.png, 학생 캐릭터 img/p13_student.png.
           AI 단점은 기획서 72p(끌어 넣기) 문구로 통일(76p 정리 화면은 다른 문구) */

        .p13-board{position:absolute;left:56px;top:29px;width:1808px;height:886px;background:url('img/p13_bg.png') center / 100% 100% no-repeat;pointer-events:none}
        .p13-student{position:absolute;width:223px;height:259px;margin:-239px 0 0 -112px;z-index:5;pointer-events:none}
        .p13-student img{display:block;width:100%;height:100%;object-fit:contain;object-position:bottom;transform-origin:50% 100%}
        .p13-student.is-win{width:280px;height:298px;margin:-278px 0 0 -140px}
        .p13-student.is-win img{animation:p13Jump .6s ease-in-out infinite alternate}
        @keyframes p13Jump{to{transform:translateY(-30px)}}
        .p13-go{position:absolute;right:130px;bottom:90px;width:288px}

        .p13-pop{position:absolute;left:112px;top:120px;width:1698px;height:762px;box-sizing:border-box;background:#fff;border:solid 6px #4a12b0;border-radius:30px;box-shadow:0 12px 0 0 rgba(60,20,120,.35);
          font-family:'Cafe24 Ssurround';color:var(--c-purple);letter-spacing:-0.04em;word-break:keep-all}
        .p13-pop-btns{position:absolute;left:0;top:612px;width:100%;display:flex;justify-content:center;gap:40px}
        .p13-pop-btns .card-btn{min-width:288px}
        .p13-pop-btns .card-btn.is-disabled{opacity:.35}

        .p13-mission{left:112px;top:87px;width:1698px;height:788px;background:#fff;border-color:#4a12b0;border-radius:30px;box-shadow:0 12px 0 0 rgba(60,20,120,.35)}
        .p13-mission-img{position:absolute;left:39px;top:33px;width:655px;height:709px;box-sizing:border-box;border:solid 5px #4a12b0;border-radius:30px;background:var(--c-purple) url('img/p13_mission.png') center / cover no-repeat}
        .p13-mission-title{position:absolute;left:714px;top:62px;width:1000px;margin:0;font-size:60px;line-height:78px;letter-spacing:-0.07em;white-space:nowrap;color:#5a12b0}
        .p13-conds{position:absolute;left:718px;top:242px;width:936px;height:378px;box-sizing:border-box;padding:29px 54px;display:grid;grid-template-columns:397px 397px;grid-template-rows:99px 99px;gap:20px 31px;align-content:start;background:#e1d3ff;border-radius:16px}
        .p13-cond{height:99px;box-sizing:border-box;padding:0 10px;display:flex;align-items:center;justify-content:center;text-align:center;background:#7c63b8;border-radius:12px;font-size:40px;line-height:44px;color:#fff;letter-spacing:-0.03em}
        .p13-mission-foot{position:absolute;left:733px;top:516px;width:904px;height:76px;box-sizing:border-box;margin:0;display:flex;align-items:center;justify-content:center;background:#fff;border:solid 4px #672eda;border-radius:40px;box-shadow:0 5px 0 #cdbdf0;font-size:38px;color:#7d42f5;letter-spacing:-0.08em;white-space:nowrap}
        .p13-mission .p13-pop-btns{left:1035px;top:635px;width:327px}
        .p13-mission .p13-pop-btns .card-btn{min-width:327px}

        .p13-ways{position:absolute;left:80px;top:118px;width:1524px;height:468px;box-sizing:border-box;padding:23px 37px 0;display:flex;justify-content:space-between;background:#e1d3ff;border-radius:16px}
        .p13-way{position:relative;flex:none;width:355px;height:419px;padding:0;box-sizing:border-box;border:solid 5px #fffaf5;border-radius:20px;background:#fff;box-shadow:0 6px 0 #cfc3ef;cursor:pointer;display:flex;flex-direction:column;align-items:center;
          font-family:'Cafe24 Ssurround';font-size:44px;color:#4a12b0;letter-spacing:-0.06em;white-space:nowrap}
        .p13-way i{flex:none;width:100%;height:301px;border-radius:16px 16px 0 0;background:var(--c-purple) center / cover no-repeat}
        .p13-way span{flex:1 1 auto;display:flex;align-items:center;padding-top:4px}
        /* .p13-way:hover{border-color:#ff4ff9} */
        .p13-way:hover{border-color:var(--c-violet)}
        .p13-way.is-selected{border-color:#ff4ff9}
        .p13-way.is-checked{opacity:.4;pointer-events:none}
        .p13-pill.is-line{min-height:120px;top:60px}
        .p13-pill.is-one{min-height:162px;top:45px}
        .p13-pill{top:43px;min-height:175px;border-color:#4a12b0;color:#4a12b0;background:#fffaf5;box-shadow:0 12px 0 0 rgba(74,18,176,.2);letter-spacing:-0.1em;border-radius:100px}

        .p13-dragbg{position:absolute;left:80px;top:136px;width:1524px;height:619px;background:#e1d3ff;border-radius:16px}
        .p13-slot{position:absolute;top:219px;width:685px;height:198px;box-sizing:border-box;padding:36px 14px 0;background:#7c63b8;border-radius:30px 30px 16px 16px}
        .p13-slot[data-key=pro]{left:140px}
        .p13-slot[data-key=con]{left:859px;background:#9066b4}
        .p13-slot:before{content:'';position:absolute;left:14px;top:36px;width:657px;height:147px;box-sizing:border-box;background:#fff;border:solid 5px #4a12b0;border-radius:22px}
        .p13-slot b{position:absolute;left:111px;top:-57px;width:463px;height:70px;box-sizing:border-box;padding-top:18px;text-align:center;font-weight:normal;font-size:66px;line-height:1.1;color:#fff;background:inherit;border-radius:40px 40px 0 0}
        .p13-cards{position:absolute;left:140px;top:431px;width:1404px;height:305px;box-sizing:border-box;padding:16px 68px 0;display:grid;grid-template-columns:599px 599px;grid-auto-rows:128px;gap:18px 70px;background:#c9b8f5;border-radius:0 0 16px 16px}
        .p13-hold{width:599px;height:128px}
        .p13-card{width:599px;height:128px;box-sizing:border-box;padding:4px 20px 0;text-align:center;font-size:40px;line-height:44px;letter-spacing:-0.05em;color:#4a12b0;background:#fff;border:solid 5px #4a12b0;border-radius:22px;box-shadow:0 5px 0 #b9a8e8;cursor:grab;user-select:none;position:relative;z-index:5;display:flex;align-items:center;justify-content:center}
        .p13-card:after{content:'';position:absolute;left:5px;top:5px;right:5px;bottom:5px;border:dashed 2px #b9a8e0;border-radius:15px;pointer-events:none}
        .p13-card.is-dragging{cursor:grabbing;z-index:50}
        .p13-slot .p13-card{width:657px;height:147px;box-shadow:none;cursor:default;margin:0}
        .p13-slot .p13-card:after{display:none}

        #p13Sum .p13-pop{top:135px;height:740px;background:#e1d3ff}
        #p13Sum .p13-pop-btns{top:601px}
        .p13-sum{position:absolute;left:108px;top:79px;width:1468px;display:grid;grid-template-columns:726px 726px;grid-auto-rows:251px;gap:7px 16px}
        .p13-sum-card{position:relative;box-sizing:border-box;padding:5px;display:flex;gap:11px;background:#fff;border:solid 5px #7d42f5;border-radius:26px}
        .p13-sum-card i{flex:none;width:339px;height:100%;border-radius:16px 0 0 16px;background:var(--c-purple) center / cover no-repeat}
        .p13-sum-card div{flex:1 1 auto;min-width:0}
        .p13-sum-card b{display:block;margin:0 0 4px;padding-bottom:2px;padding-top:5px;text-align:center;font-weight:normal;font-size:44px;line-height:1.1;letter-spacing:-0.07em;white-space:nowrap;color:#4a12b0;border-bottom:solid 5px #e9defc}
        .p13-sum-card p{position:relative;margin:6px 0 0;padding-left:56px;font-size:30px;line-height:1.3;letter-spacing:-0.06em;white-space:nowrap;color:#7d42f5}
        .p13-sum-card p:before{content:'';position:absolute;left:4px;top:-8px;width:50px;height:50px;background:url('img/icon_star.png') center / contain no-repeat}
        .p13-pill.p13-sum-pill{top:73px;width:612px;min-height:127px;background:#7c63b8;color:#fff}

        .p13 .is-off{display:none}
        #p13Mission{z-index:120}
        #p13Wrong{z-index:130}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default p13">
          <div class="p13-board"></div>
          <div class="p13-student" id="p13Student"><img src="img/p13_student.png" alt=""></div>
          <button type="button" class="card-btn is-popup p13-go" id="p13Go">출발하기</button>

          <div class="avatar-modal is-off" id="p13Mission">
            <div class="p13-pop p13-mission">
              <div class="p13-mission-img"></div>
              <p class="p13-mission-title">성준이가 청소년 문화의 집에서<br>동아리 활동 장소를 찾지 못하고 있어요!</p>
              <div class="p13-conds">
                <div class="p13-cond">약속까지 20분</div>
                <div class="p13-cond">휴대전화 사용 가능</div>
                <div class="p13-cond">주변에<br>안내 표지판이 있음</div>
                <div class="p13-cond">주변에<br>사람들이 있음</div>
              </div>
              <p class="p13-mission-foot">위 조건을 확인하고, 장소를 찾아갈 수 있도록 도와주세요.</p>
              <div class="p13-pop-btns"><button type="button" class="card-btn is-popup is-purple is-short" id="p13MissionOk">확인</button></div>
            </div>
          </div>

          <div class="avatar-modal is-off" id="p13Think">
            <div class="p13-pop">
              <div class="p13-ways" id="p13ThinkWays"></div>
              <div class="p13-pop-btns">
                <button type="button" class="card-btn is-popup is-purple" id="p13MissionAgain">미션 다시 보기</button>
                <button type="button" class="card-btn is-popup is-purple is-short is-disabled" id="p13ThinkOk">확인</button>
              </div>
            </div>
            <p class="ask-pill is-fit p13-pill is-medium">어떻게 해결할 수 있을까요?<br>아래의 보기를 하나씩 클릭해서 모두 확인해봐요.</p>
          </div>

          <div class="avatar-modal is-off" id="p13Drag">
            <div class="p13-pop">
              <div class="p13-dragbg"></div>
              <div class="p13-slot" data-key="pro"><b>장점</b></div>
              <div class="p13-slot" data-key="con"><b>단점</b></div>
              <div class="p13-cards" id="p13Cards"></div>
            </div>
            <p class="ask-pill is-fit p13-pill is-one" id="p13DragTitle"></p>
          </div>

          <div class="avatar-modal is-off" id="p13Decide">
            <div class="p13-pop">
              <div class="p13-ways" id="p13DecideWays"></div>
              <div class="p13-pop-btns">
                <button type="button" class="card-btn is-popup is-purple" id="p13SumOpen">장단점 다시 보기</button>
                <button type="button" class="card-btn is-popup is-purple is-short is-disabled" id="p13DecideOk">확인</button>
              </div>
            </div>
            <p class="ask-pill is-fit p13-pill is-medium is-line">어떤 방법을 선택할까요?</p>
          </div>

          <div class="avatar-modal is-off" id="p13Sum">
            <div class="p13-pop">
              <div class="p13-sum" id="p13SumList"></div>
              <div class="p13-pop-btns"><button type="button" class="card-btn is-popup is-purple is-short" id="p13SumOk">확인</button></div>
            </div>
            <p class="ask-pill is-fit p13-pill p13-sum-pill">장단점 보기</p>
          </div>

          <div class="ox-result-wrong is-avatar is-off" id="p13Wrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">다시 생각해볼까요?</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="최선의 결정 보드게임" data-next="page14.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const TILES = [
      { x: 300, y: 305 },
      { x: 908, y: 314 },
      { x: 778, y: 609 },
      { x: 1259, y: 714 },
      { x: 1445, y: 305 }
    ];
    const WAYS = [
      { key: 'sign', name: '표지판 확인하기', pro: '글과 화살표를 보고<br>방향을 알 수 있어요.', con: '표시를 이해하기<br>어려울 수 있어요.',
        extra: ['궁금한 것을<br>직접 물어볼 수 있어요.', '배터리가 부족하면<br>사용하기 어려워요.'] },
      { key: 'ask', name: '행인에게 물어보기', pro: '궁금한 것을<br>직접 물어볼 수 있어요.', con: '상대방이 그 장소를<br>잘 모를 수 있어요.',
        extra: ['배터리가 부족하면<br>사용하기 어려워요.', 'AI가 정확하지 않은 정보를<br>알려줄 수 있어요.'] },
      { key: 'map', name: '휴대전화 지도 보기', pro: '현재 위치와 이동할 방향을<br>확인할 수 있어요.', con: '배터리가 부족하면<br>사용하기 어려워요.',
        extra: ['상대방이 그 장소를<br>잘 모를 수 있어요.', '궁금한 것을<br>직접 물어볼 수 있어요.'] },
      { key: 'ai', name: 'AI에게 물어보기', pro: '궁금한 것을<br>얼마든지 질문할 수 있어요.', con: 'AI의 답만으로는 실제 이동<br>방향을 알기 어려울 수 있어요.',
        extra: ['기기가 없어도 확인할 수 있어요.', '상대방이 그 장소를<br>잘 모를 수 있어요.'] }
    ];

    const student = $('p13Student');
    const goBtn = $('p13Go');
    const checked = new Set();

    // 칸 사이 길(화면 좌표, 헤더 포함). 끝 칸 좌표는 TILES 로 맞춤
    const ROUTES = [
      null,
      [[560, 385], [700, 350], [800, 380]],
      [[1040, 480], [1110, 540], [1080, 600], [990, 650], [880, 690]],
      [[600, 760], [680, 880], [900, 930], [1100, 900], [1200, 860]],
      [[1400, 850], [1450, 770], [1440, 700], [1360, 620], [1335, 560], [1380, 480]]
    ];
    const studentImg = student.querySelector('img');
    let pos = 0;
    function placeStudent(x, y) { student.style.left = x + 'px'; student.style.top = y + 'px'; }
    function moveTo(i, then) {
      const from = TILES[pos];
      pos = i;
      if (!student.style.left) { placeStudent(TILES[i].x, TILES[i].y); return; }
      const pts = [[from.x, from.y]].concat((ROUTES[i] || []).map((p) => [p[0], p[1] - 110]), [[TILES[i].x, TILES[i].y]]);
      const lens = [];
      let total = 0;
      for (let k = 1; k < pts.length; k++) { const d = Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]); lens.push(d); total += d; }
      const dur = Math.max(1200, total / 0.45);
      const t0 = performance.now();
      student.style.transition = 'none';
      (function step(now) {
        const f = Math.min(1, (now - t0) / dur);
        const e = f < .5 ? 2 * f * f : 1 - Math.pow(-2 * f + 2, 2) / 2;
        let d = e * total, k = 0;
        while (k < lens.length - 1 && d > lens[k]) { d -= lens[k]; k++; }
        const u = lens[k] ? d / lens[k] : 1;
        placeStudent(pts[k][0] + (pts[k + 1][0] - pts[k][0]) * u, pts[k][1] + (pts[k + 1][1] - pts[k][1]) * u);
        if (f < 1) {
          const hop = Math.abs(Math.sin((now - t0) / 95)) * 14 * Math.min(1, (1 - f) * 6, f * 6);
          studentImg.style.transform = 'translateY(' + (-hop).toFixed(1) + 'px)';
          return requestAnimationFrame(step);
        }
        studentImg.style.transform = '';
        if (i === TILES.length - 1) {
          studentImg.onerror = () => { studentImg.onerror = null; studentImg.src = 'img/p13_student.png'; };
          studentImg.src = 'img/p13_student_success.png';
          student.classList.add('is-win');
        }
        if (then) setTimeout(then, 900);
      })(t0);
    }
    moveTo(0);

    function open(id) { $(id).classList.remove('is-off'); }
    function close(id) { $(id).classList.add('is-off'); }

    function waitGo(label, next, arrive) {
      goBtn.textContent = label;
      goBtn.classList.toggle('next-btn', label === '다음');
      goBtn.classList.remove('is-off');
      pointFingerAt(goBtn);
      document.querySelectorAll('.js-point-finger').forEach((f) => { f.style.left = '1792px'; f.style.top = '845px'; });
      goBtn.onclick = () => {
        playClick();
        clearFingers();
        goBtn.classList.add('is-off');
        moveTo(next, arrive);
      };
    }

    function wayBtn(w) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'p13-way';
      btn.innerHTML = '<i style="background-image:url(\'img/p13_way_' + w.key + '.png\')"></i><span>' + w.name + '</span>';
      return btn;
    }

    // 1. 미션 확인하기
    $('p13MissionOk').onclick = () => {
      playClick();
      close('p13Mission');
      if (pos === 1) waitGo('다음', 2, () => open('p13Think'));
    };

    // 2. 해결 방법 생각하기: 방법마다 장단점 끌어 넣기
    WAYS.forEach((w) => {
      const btn = wayBtn(w);
      btn.onclick = () => { playClick(); openDrag(w, btn); };
      $('p13ThinkWays').appendChild(btn);
    });
    $('p13MissionAgain').onclick = () => { playClick(); open('p13Mission'); };
    $('p13ThinkOk').onclick = () => {
      if ($('p13ThinkOk').classList.contains('is-disabled')) return;
      playClick();
      close('p13Think');
      waitGo('다음', 3, () => open('p13Decide'));
    };

    function openDrag(w, wayEl) {
      $('p13DragTitle').textContent = '‘' + w.name + '’의 장단점을 찾아봐요.';
      const slots = Array.from(document.querySelectorAll('#p13Drag .p13-slot'));
      slots.forEach((s) => { delete s.dataset.filled; s.querySelectorAll('.p13-card').forEach((c) => c.remove()); });
      const box = $('p13Cards');
      box.innerHTML = '';
      shuffleArray([{ text: w.pro, key: 'pro' }, { text: w.con, key: 'con' }].concat(w.extra.map((t) => ({ text: t, key: 'x' })))).forEach((c) => {
        const el = document.createElement('div');
        el.className = 'emotion-option p13-card';
        el.dataset.key = c.key;
        el.innerHTML = c.text;
        const hold = document.createElement('div');
        hold.className = 'p13-hold';
        hold.appendChild(el);
        box.appendChild(hold);
      });
      open('p13Drag');
      initMatchDrag({
        cards: Array.from(box.querySelectorAll('.p13-card')),
        zones: slots,
        onRight: () => {},
        onWrong: (card, slot) => {
          if (!slot) return;
          playWrong();
          flashLayer($('p13Wrong'), 'is-off', 1000);
        },
        onDone: () => {
          playCorrect();
          checked.add(w.key);
          wayEl.classList.add('is-checked');
          setTimeout(() => {
            close('p13Drag');
            if (checked.size === WAYS.length) $('p13ThinkOk').classList.remove('is-disabled');
          }, 1000);
        }
      });
    }

    // 3. 장단점 찾아보기 → 해결 방법 고르기(정답 없음)
    let decided = null;
    WAYS.forEach((w) => {
      const btn = wayBtn(w);
      btn.onclick = () => {
        playClick();
        $('p13DecideWays').querySelectorAll('.p13-way').forEach((b) => b.classList.toggle('is-selected', b === btn));
        decided = w.key;
        $('p13DecideOk').classList.remove('is-disabled');
      };
      $('p13DecideWays').appendChild(btn);
    });
    const SUM = {
      sign: ['글과 화살표를 보고<br>방향을 알 수 있어요.', '표시를 이해하기<br>어려울 수 있어요.'],
      ask: ['궁금한 것을 직접<br>물어볼 수 있어요.', '상대방이 그 장소를<br>잘 모를 수 있어요.'],
      map: ['현재 위치와 이동할<br>방향을 확인할 수 있어요.', '배터리가 부족하면<br>사용하기 어려워요.'],
      ai: ['궁금한 것을 얼마든지<br>질문할 수 있어요.', 'AI가 정확하지 않은<br>정보를 알려줄 수 있어요.']
    };
    $('p13SumList').innerHTML = WAYS.map((w) => '<div class="p13-sum-card"><i style="background-image:url(img/p13_way_' + w.key + '.png)"></i><div><b>' + w.name + '</b><p>' + SUM[w.key][0] + '</p><p>' + SUM[w.key][1] + '</p></div></div>').join('');
    $('p13SumOpen').onclick = () => { playClick(); open('p13Sum'); };
    $('p13SumOk').onclick = () => { playClick(); close('p13Sum'); };
    $('p13DecideOk').onclick = () => {
      if (!decided || $('p13DecideOk').classList.contains('is-disabled')) return;
      playClick();
      close('p13Decide');
      moveTo(4, () => {
        const done = new Audio(ASSET_BASE + 'sound/correct.mp3');
        let moved = false;
        const next = () => { if (!moved) { moved = true; navigateTo('page14.html'); } };
        done.onended = next;
        done.play().catch(next);
        setTimeout(next, 5000);
      });
    };

    waitGo('출발하기', 1, () => open('p13Mission'));
  })();
  </script>
</body>
</html>
