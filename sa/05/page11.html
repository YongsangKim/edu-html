<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀴즈 풀기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 59~61p. sa/02/page12(QUIZ) 구조 그대로, Q1·Q2는 정답 2개, Q3은 긴 보기 3개를 세로로 */
        main{position:absolute;left:0;top:120px;width:1920px;height:960px}

        .p11-opt{position:absolute;margin-left:10px}
        .p11-q1 .p11-opt{width:380px;margin-left:0}
        .p11-q1-opt1{left:110px;top:560px}
        .p11-q1-opt2{left:550px;top:560px}
        .p11-q1-opt3{left:990px;top:560px}
        .p11-q1-opt4{left:1430px;top:560px}

        .p11-q2 .p11-opt{width:380px;margin-left:0}
        .p11-q2-opt1{left:110px;top:560px}
        .p11-q2-opt2{left:550px;top:560px}
        .p11-q2-opt3{left:990px;top:560px}
        .p11-q2-opt4{left:1430px;top:560px}

        .p11-q3-opt{position:absolute;left:310px;width:1300px;height:110px;font-size:54px}
        .p11-q3-opt1{top:470px}
        .p11-q3-opt2{top:620px}
        .p11-q3-opt3{top:770px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="quiz-stage">
          <div class="step-flow">

            <div class="step-panel p11-panel p11-q1">

              <div class="quiz-ask-box">

                <div class="quiz-ask-row">

                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>

                  <span class="quiz-qnum">Q1.</span>

                  <p class="quiz-ask">결정을 내리기 전에 무엇을 고민해야 할까요? 모두 골라보세요.</p>

                </div>

              </div>
              <div class="answer-pick-quiz">
                <button class="answer-pick card-btn is-quiz is-long p11-opt p11-q1-opt1" data-correct="true" aria-label="내가 원하는 것">내가<br>원하는 것</button>
                <button class="answer-pick card-btn is-quiz is-long p11-opt p11-q1-opt2" data-correct="false" aria-label="친구가 원하는 것">친구가<br>원하는 것</button>
                <button class="answer-pick card-btn is-quiz is-long p11-opt p11-q1-opt3" data-correct="true" aria-label="필요한 것">필요한 것</button>
                <button class="answer-pick card-btn is-quiz is-long p11-opt p11-q1-opt4" data-correct="false" aria-label="유명한 것">유명한 것</button>
              </div>
            </div>

            <div class="step-panel p11-panel p11-q2">

              <div class="quiz-ask-box">

                <div class="quiz-ask-row">

                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>

                  <span class="quiz-qnum">Q2.</span>

                  <p class="quiz-ask">계획을 세우기 전에 어떤 조건을 생각해야 할까요? 모두 골라보세요.</p>

                </div>

              </div>
              <div class="answer-pick-quiz">
                <button class="answer-pick card-btn is-quiz is-long p11-opt p11-q2-opt1" data-correct="true" aria-label="시간과 장소">시간과 장소</button>
                <button class="answer-pick card-btn is-quiz is-long p11-opt p11-q2-opt2" data-correct="false" aria-label="오늘의 기분">오늘의 기분</button>
                <button class="answer-pick card-btn is-quiz is-long p11-opt p11-q2-opt3" data-correct="false" aria-label="지난 주말의 날씨">지난 주말의<br>날씨</button>
                <button class="answer-pick card-btn is-quiz is-long p11-opt p11-q2-opt4" data-correct="true" aria-label="준비물">준비물</button>
              </div>
            </div>

            <div class="step-panel p11-panel p11-q3">

              <div class="quiz-ask-box">

                <div class="quiz-ask-row">

                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>

                  <span class="quiz-qnum">Q3.</span>

                  <p class="quiz-ask">AI의 조언을 들은 뒤 해야 할 행동으로 마땅한 것은 무엇인가요?</p>

                </div>

              </div>
              <div class="answer-pick-quiz" data-next="page12.html">
                <button class="answer-pick card-btn p11-q3-opt p11-q3-opt1" data-correct="false" aria-label="AI의 답변을 믿고 그대로 행동한다.">AI의 답변을 믿고 그대로 행동한다.</button>
                <button class="answer-pick card-btn p11-q3-opt p11-q3-opt2" data-correct="true" aria-label="나에게 맞는지 다시 확인하고 스스로 결정한다.">나에게 맞는지 다시 확인하고 스스로 결정한다.</button>
                <button class="answer-pick card-btn p11-q3-opt p11-q3-opt3" data-correct="false" aria-label="앞으로 모든 결정을 AI에게 맡긴다.">앞으로 모든 결정을 AI에게 맡긴다.</button>
              </div>
            </div>

          </div>

          <div class="ox-result-correct is-avatar is-off" data-sound="sound/correct.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_correct.png" alt=""></div>
              <p class="avatar-popup-text">정답이에요!</p>
              <div class="avatar-popup-extra"><img src="../../img/common/icon_correct.png" alt=""></div>
            </div>
          </div>
          <div class="ox-result-wrong is-avatar is-off" data-sound="sound/incorrect.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <p class="avatar-popup-text is-small">문장을 다시 한 번 잘 읽어봐요.</p>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="퀴즈 풀기" data-next="page12.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
