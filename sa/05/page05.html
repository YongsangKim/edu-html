<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조건 퍼즐 완성하기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 12~19p. 퍼즐 3판, 판마다 정답 조각 4개(2x2 칸이 정해져 있음) + 오답 2개를 무작위 순서로 보여줌.
           기획서 12p 정답 표기는 '장소'지만 조각·완성 화면(12·15p)은 '비용'이라 비용을 정답으로 둠 */

        .p05-bubble{left:92px;bottom:691px;width:480px;padding:26px 10px;font-size:40px}
        .p05-bubble::before{left:120px}
        .p05-character{left:140px;top:271px;width:258px;height:313px}

        .p05-next{position:absolute;left:1470px;top:440px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <p class="guide-bubble is-center p05-bubble" id="p05Bubble"></p>
          <div class="char-box p05-character"><img src="img/p_character_main.png" alt="메인 캐릭터"></div>

          <div class="jig-board"><div class="jig-grid" id="p05Grid"></div></div>

          <div class="jig-tray-label">조건 퍼즐 조각</div>
          <div class="jig-tray" id="p05Tray"></div>

          <a href="javascript:;" class="js-sfx jig-next is-off p05-next" id="p05Next" data-sound="sound/click.mp3">
            <img src="../../img/common/btn_next_content.png" class="js-img-swap" data-src-alt="../../img/common/btn_next_content_on.png" data-src-over="../../img/common/btn_next_content_over.png" alt="다음">
          </a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="조건 퍼즐 완성하기" data-next="page06.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  initJigsawPuzzle({
    next: 'page06.html',
    puzzles: [
      { ask: '박물관에 갈 계획을<br>세우려고 해요.<br>무엇을 생각해야 할까요?', done: '좋아요!<br>즐거운 박물관 방문을<br>위해 고민해봐요.',
        pieces: [
          { text: '비용', cell: 0 }, { text: '이동<br>방법', cell: 1 }, { text: '식사<br>방법', cell: 2 }, { text: '함께<br>갈 사람', cell: 3 },
          { text: '내가<br>잘하는 일' }, { text: '필요한 이유' }
        ] },
      { ask: '나의 미래 직업을<br>선택해봐요.<br>무엇을 생각해야 할까요?', done: '좋아요!<br>나의 미래 직업을<br>선택하기 전에 고민해봐요.',
        pieces: [
          { text: '하고<br>싶은 일', cell: 0 }, { text: '일하는<br>시간', cell: 1 }, { text: '내가<br>잘하는 일', cell: 2 }, { text: '일하는<br>장소', cell: 3 },
          { text: '가격' }, { text: '식사<br>방법' }
        ] },
      { ask: '필요한 물건을 사야 해요.<br>무엇을 생각해야 할까요?', done: '좋아요!<br>물건을 사기 전에<br>신중하게 고민해봐요.',
        pieces: [
          { text: '가격', cell: 0 }, { text: '좋은 점', cell: 1 }, { text: '불편한<br>점', cell: 2 }, { text: '필요한<br>이유', cell: 3 },
          { text: '식사<br>방법' }, { text: '내가<br>잘하는 일' }
        ] }
    ]
  });
  </script>
</body>
</html>
