<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어떤 말을 전할까?</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 20~31p. 친구 3명에게 알맞은 말 고르기 → 맞으면 마음 전달 화면(게이지가 참) → 다음 친구.
           틀리면 캐릭터 말풍선이 친구 감정 안내로 2초 바뀜. 상황 그림 img/p05_sit{번호}.png, 전달 화면 그림 img/p05_send{번호}.png, 게이지 별 img/p05_star.png */

        .p05-bubble{left:62px;bottom:655px;width:475px;z-index:5;margin:0}
        .p05-character{left:70px;top:348px;width:380px;height:582px}

        .p05-panel{position:absolute;left:512px;top:39px;width:1352px;height:890px;box-sizing:border-box;border:solid 5px var(--c-ink);border-radius:10px;overflow:hidden;background:#266cc8}
        .p05-photo{width:100%;height:388px;background:var(--c-purple) center / cover no-repeat}
        .p05-caption{width:100%;height:126px;margin:0;box-sizing:border-box;padding-top:6px;display:flex;align-items:center;justify-content:center;background:#faf8f9;font-family:'Cafe24 Ssurround';font-size:58px;color:var(--c-ink);letter-spacing:-0.05em}
        .p05-opts{box-sizing:border-box;padding:44px 24px 0;display:grid;grid-template-columns:1fr 1fr;gap:41px 36px}
        .p05-opts .card-btn{min-width:0;height:115px;padding:8px 20px 4px;font-size:46px;line-height:1.15;letter-spacing:-0.05em;word-break:keep-all}

        .p05-send{position:absolute;left:261px;top:46px;width:1399px;height:595px;box-sizing:border-box;border:solid 5px #2077ec;border-radius:12px;background:var(--c-white);box-shadow:7px 10px 0 0 #bbc9e6}
        .p05-send i{position:absolute;left:23px;top:22px;width:1345px;height:433px;;background: center / cover no-repeat}
        .p05-send p{position:absolute;left:0;right:0;top:455px;height:130px;margin:0;display:flex;align-items:center;justify-content:center;font-family:'Cafe24 Ssurround';font-size:60px;color:var(--c-ink);letter-spacing:-0.05em}
        .p05-gauge{left:340px;top:681px;width:1215px;height:70px}
        .p05-gauge.gauge:before{left:-105px;top:-79px;width:220px;height:213px;background-image:url(img/p05_gauge_robot.png)}
        .p05-gauge:after{content:'';position:absolute;left:1155px;top:-43px;width:180px;height:137px;background:url(img/p05_gauge_mail.png) 0 0 / contain no-repeat;z-index:1}
        .p05-gauge .gauge-fill{transition:none}
        .p05-gauge .gauge-fill.is-go{width:100%;transition:width 2.5s linear}
        .p05-status{position:absolute;left:0;top:775px;width:1920px;margin:0;text-align:center;font-family:'Cafe24 Ssurround';font-size:52px;color:var(--c-purple);letter-spacing:-0.04em}
        .p05-send-next{position:absolute;left:1447px;top:800px;width:383px;min-width:0;height:110px;display:flex;align-items:center;justify-content:center;text-decoration:none}

        .p05 .is-off{display:none}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default p05">
          <div id="p05Pick">
            <p class="guide-bubble is-center p05-bubble" id="p05Bubble"></p>
            <div class="char-box p05-character"><img src="img/p05_character.png" alt="메인 캐릭터"></div>
            <div class="p05-panel">
              <div class="p05-photo" id="p05Photo"></div>
              <p class="p05-caption" id="p05Caption"></p>
              <div class="p05-opts" id="p05Opts"></div>
            </div>
          </div>

          <div class="is-off" id="p05SendView">
            <div class="p05-send"><i id="p05SendImg"></i><p id="p05SendText"></p></div>
            <div class="gauge is-thin p05-gauge"><div class="gauge-fill" id="p05Fill"></div></div>
            <p class="p05-status" id="p05Status"></p>
            <a href="javascript:;" class="js-sfx card-btn p05-send-next is-off" id="p05Next" data-sound="sound/click.mp3">다음</a>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="어떤 말을 전할까?" data-next="page06.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const ASK = '친구에게 어떤<br>말을 해줄까요?';
    // 기획서 24~25p 보기 '네 덕분이'는 28p와 같은 '네 덕분에'로 맞춤
    const ROUNDS = [
      { caption: '시험에서 실수로 문제를 많이 틀린 친구',
        opts: ['정말 대단해!', '다음에는 더 잘할 수 있을 거야!', '그것도 못 했어?', '축하해!'], answer: 1,
        wrong: '친구는 지금 속상한 감정을 느끼고 있어요. 어떤 말을 해야 할까요?' },
      { caption: '열심히 노력하여 태권도 검은 띠를 딴 친구',
        opts: ['미안해. 내가 잘못했어.', '괜찮아. 다음에 다시 도전해보자!', '정말 대단해! 멋있다!', '고마워! 네 덕분에 힘이 나.'], answer: 2,
        wrong: '친구는 지금 기쁘고 행복한 감정을 느끼고 있어요. 어떤 말을 해야 할까요?' },
      { caption: '텃밭에서 기르던 작물이 시들어 슬퍼하는 친구',
        opts: ['열심히 길렀을 텐데<br>정말 속상하겠다.', '고마워! 네 덕분에 힘이 나.', '정말 대단해! 멋있다!', '축하해. 열심히 노력했구나!'], answer: 0,
        wrong: '친구는 지금 속상한 감정을 느끼고 있어요. 어떤 말을 해야 할까요?' }
    ];

    const bubble = $('p05Bubble');
    const optsBox = $('p05Opts');
    const nextBtn = $('p05Next');
    const fill = $('p05Fill');

    let index = 0;
    let busy = false;
    let bubbleTimer = null;

    function renderPick() {
      const r = ROUNDS[index];
      busy = false;
      bubble.classList.remove('is-small');
      bubble.innerHTML = ASK;
      $('p05Photo').style.backgroundImage = "url('img/p05_sit" + (index + 1) + ".png')";
      $('p05Caption').textContent = r.caption;
      optsBox.innerHTML = '';
      r.opts.forEach((o, k) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'card-btn';
        btn.innerHTML = o;
        btn.addEventListener('click', () => pick(k, btn));
        optsBox.appendChild(btn);
      });
      $('p05SendView').classList.add('is-off');
      $('p05Pick').classList.remove('is-off');
    }

    function pick(k, btn) {
      if (busy) return;
      const r = ROUNDS[index];
      if (k !== r.answer) {
        playWrong();
        bubble.classList.add('is-small');
        bubble.innerHTML = r.wrong;
        clearTimeout(bubbleTimer);
        bubbleTimer = setTimeout(() => { bubble.classList.remove('is-small'); bubble.innerHTML = ASK; }, 2000);
        return;
      }
      busy = true;
      clearTimeout(bubbleTimer);
      playCorrect();
      btn.classList.add('is-selected');
      setTimeout(() => send(r.opts[k]), 600);
    }

    function send(message) {
      $('p05Pick').classList.add('is-off');
      $('p05SendView').classList.remove('is-off');
      $('p05SendImg').style.backgroundImage = "url('img/p05_send" + (index + 1) + ".png')";
      $('p05SendText').innerHTML = ROUNDS[index].caption;
      $('p05Status').textContent = '마음을 전달하는 중이에요';
      nextBtn.classList.add('is-off');
      fill.className = 'gauge-fill';
      void fill.offsetWidth;
      fill.classList.add('is-go');
      setTimeout(() => {
        $('p05Status').textContent = '마음을 성공적으로 전달했어요!';
        nextBtn.classList.remove('is-off');
      }, 2600);
    }

    nextBtn.addEventListener('click', () => {
      setTimeout(() => {
        index += 1;
        if (index < ROUNDS.length) renderPick();
        else navigateTo('page06.html');
      }, 300);
    });

    renderPick();
  })();
  </script>
</body>
</html>
