<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀴즈 풀기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 62~65p. sa/05/page11(QUIZ) 구조, 세 문제 모두 긴 보기 3개를 세로로. Q1 오답 문구는 63p */
        .p10-opt{position:absolute;left:210px;width:1500px;height:110px;min-width:0;font-size:52px;letter-spacing:-0.05em}
        .p10-opt1{top:460px}
        .p10-opt2{top:610px}
        .p10-opt3{top:760px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="quiz-stage">
          <div class="step-flow">

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q1.</span>
                  <p class="quiz-ask">친구가 슬프거나 힘든 일을 겪었을 때 우리가 해줄 수 있는 가장 올바른 행동은 무엇일까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz" data-wrong="<span>조금 더 따뜻한 위로의 말을 찾아볼까요?</span>">
                <button class="answer-pick card-btn p10-opt p10-opt1" data-correct="true" aria-label="친구의 마음을 위로하고 공감해주기">친구의 마음을 위로하고 공감해주기</button>
                <button class="answer-pick card-btn p10-opt p10-opt2" data-correct="false" aria-label="친구의 실수를 지적하며 혼내주기">친구의 실수를 지적하며 혼내주기</button>
                <button class="answer-pick card-btn p10-opt p10-opt3" data-correct="false" aria-label="친구의 이야기를 무시하고 자리를 피하기">친구의 이야기를 무시하고 자리를 피하기</button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q2.</span>
                  <p class="quiz-ask">캔바에서 글자의 모양을 예쁘게 꾸미거나 다채로운 색상 효과를 넣기 위해 사용하는 기능은 무엇일까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz">
                <button class="answer-pick card-btn p10-opt p10-opt1" data-correct="false" aria-label="영상 추천 템플릿 기능">영상 추천 템플릿 기능</button>
                <button class="answer-pick card-btn p10-opt p10-opt2" data-correct="true" aria-label="텍스트 입력 및 텍스트 효과 기능">텍스트 입력 및 텍스트 효과 기능</button>
                <button class="answer-pick card-btn p10-opt p10-opt3" data-correct="false" aria-label="배경 색상 변경 기능">배경 색상 변경 기능</button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q3.</span>
                  <p class="quiz-ask">디지털 도구를 사용하여 친구에게 보낼 응원 카드를 만들 때 반드시 지켜야 할 약속은 무엇일까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz" data-next="page11.html">
                <button class="answer-pick card-btn p10-opt p10-opt1" data-correct="false" aria-label="친구가 싫어하는 말이라도 재미있으면 자유롭게 사용하기">친구가 싫어하는 말이라도 재미있으면 자유롭게 사용하기</button>
                <button class="answer-pick card-btn p10-opt p10-opt2" data-correct="true" aria-label="온라인 공간에서도 욕설을 쓰지 않고 따듯한 언어 예절 실천하기">온라인 공간에서도 욕설을 쓰지 않고 따듯한 언어 예절 실천하기</button>
                <button class="answer-pick card-btn p10-opt p10-opt3" data-correct="false" aria-label="온라인에서는 얼굴을 보지 않으니 마음대로 행동하기">온라인에서는 얼굴을 보지 않으니 마음대로 행동하기</button>
              </div>
            </div>

          </div>

          <div class="ox-result-correct is-avatar is-off" data-sound="sound/correct.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_correct.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">정답이에요!</p>
              </div>
              <div class="avatar-popup-extra"><img src="../../img/common/icon_correct.png" alt=""></div>
            </div>
          </div>
          <div class="ox-result-wrong is-avatar is-off" data-sound="sound/incorrect.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="hint-title">힌트</p>
                <p class="avatar-popup-text is-small">문장을 다시 한 번 잘 읽어봐요.</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="퀴즈 풀기" data-next="page11.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
