<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀴즈 풀기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 기획서 82~84p. Q1 4지선다(목록), Q2 O/X, Q3 4지선다. 정답/오답 팝업은 공용 아바타 팝업(기능 V). 기획서의 '고도화 때 추가' 피드백 문구는 이번에 넣지 않음 */
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="quiz-stage">
          <div class="step-flow">

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q1.</span>
                  <p class="quiz-ask">처음 도서관에 오는 친구에게 입구를<br>알려 주려고 해요.<br>브이로그에 어떤 장면을 담으면 좋을까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-grid is-long">
                <button class="answer-pick card-btn" data-correct="true">도서관 이름과 들어가는 문이 보이는 장면</button>
                <button class="answer-pick card-btn" data-correct="false">대출대에서 책을 빌리는 장면</button>
                <button class="answer-pick card-btn" data-correct="false">책상에서 책을 읽는 장면</button>
                <button class="answer-pick card-btn" data-correct="false">책장에 책이 꽂혀 있는 장면</button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q2.</span>
                  <p class="quiz-ask">동네를 소개하는 브이로그에 모르는 이웃의 얼굴이 함께 찍혔어요. 공유 허락을 받지 않았으니 모자이크로 얼굴을 가려 이웃의 초상권을 보호해야 해요.</p>
                </div>
              </div>
              <div class="answer-pick-quiz">
                <button class="answer-pick ox-pick is-o" data-correct="true" aria-label="O">
                  <img class="js-img-swap" src="../../img/common/icon_o.png" data-src-on="../../img/common/icon_o_on.png" alt="O">
                </button>
                <button class="answer-pick ox-pick is-x" data-correct="false" aria-label="X">
                  <img class="js-img-swap" src="../../img/common/icon_x.png" data-src-on="../../img/common/icon_x_on.png" alt="X">
                </button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q3.</span>
                  <p class="quiz-ask">사람이 움직이자 스티커가 얼굴에서 벗어났어요.<br>어떤 기능이 필요할까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-grid" data-next="page11.html">
                <button class="answer-pick card-btn" data-correct="false">영상 자르기</button>
                <button class="answer-pick card-btn" data-correct="false">자동 자막</button>
                <button class="answer-pick card-btn" data-correct="false">배경 제거</button>
                <button class="answer-pick card-btn" data-correct="true">얼굴 트래킹</button>
              </div>
            </div>

          </div>

          <div class="ox-result-correct is-avatar is-off" data-sound="sound/correct.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_correct.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">정답이에요!</p>
              </div>
              <div class="avatar-popup-extra"><img src="../../img/common/icon_correct.png" alt=""></div>
            </div>
          </div>
          <div class="ox-result-wrong is-avatar is-off" data-sound="sound/incorrect.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">다시 한번 생각해볼까요?</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="퀴즈 풀기" data-next="page11.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
