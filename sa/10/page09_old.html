<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뚝딱! 우리 동네 브이로그 제작소</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 기획서 47~81p. VLLO로 우리 동네 브이로그 만들기 실습. 휴대폰 화면은 기획서에 들어 있는 실제 VLLO 앱 캡처(img/ui/u{기획서 그림 번호}.jpg)를 그대로 쓰고,
           학생이 고른 장소 장면(미리보기)·자막·모자이크는 기획서 슬라이드처럼 캡처 위에 얹음(좌표는 모두 캡처 픽셀 540x1170 기준). 캡처는 폭에 맞춰 줄이고 하단 시스템 버튼 자리를 위해 빈 띠를 잘라 붙임(CUT_AT). 누를 곳(.p09-hot)은 분홍 깜빡임, 손가락이 가리킴.
           흐름: 홈에서 VLLO → 장소 고르기(마트·우체국·도서관·공원) → 음성 녹음(준비된 목소리 TTS) → 자동 자막 생성 → 음성과 자막 비교해 틀린 단어 찾기 → 자막 수정 → 효과·왜곡(모자이크)·블러 → 얼굴 트래킹 → 추출하기 → 완성 영상 보기.
           장소 장면은 임시 이모지 그림(img/p09_place_*.jpg), 완성 영상은 영상 파일이 없어 이모지 이웃이 걸어가는 짧은 애니메이션으로 대신함. TTS는 브라우저 음성(speechSynthesis) — 음성 파일(m4a)이 오면 교체 */

        .p09-bubble{position:absolute;left:30px;top:auto;bottom:560px;width:600px;margin:0;box-sizing:border-box;padding:30px;background:var(--c-cream);border:solid 5px var(--c-purple);border-radius:30px;box-shadow:-7px 10px 6px 2px rgba(92,61,240,.17);
          font-family:'Cafe24 Ssurround';font-size:38px;line-height:1.35;color:var(--c-purple);text-align:center;letter-spacing:-0.05em;word-break:keep-all;z-index:3}
        .p09-bubble:before{content:'';position:absolute;left:230px;bottom:-58px;width:100px;height:70px;background:url('../../img/common/p_guide_tail.png') 0 0 / contain no-repeat}
        .p09-character{left:40px;top:470px;width:540px;height:470px}

        .p09-phone{left:735px;top:21px;width:450px;height:895px}
        .p09-base{position:absolute;left:0;top:0;width:100%;height:833px;overflow:hidden}
        .p09-base i{position:absolute;left:0;width:100%;background-repeat:no-repeat;background-size:100% auto}
        .p09-ov{position:absolute;box-sizing:border-box;overflow:hidden}
        .p09-hot{position:absolute;box-sizing:border-box;padding:0;border:solid 3px transparent;border-radius:24px;background:transparent;cursor:pointer;transition:box-shadow .15s,border-color .15s;z-index:6}
        .p09-hot{animation:cv-target 1.2s ease-in-out infinite}
        .p09-hot.is-in{animation-name:cv-target-in}
        .app-home ~ .p09-hot{animation:none}
        .p09-swipe{position:absolute;z-index:6;touch-action:none;cursor:grab;animation:cv-target-in 1.2s ease-in-out infinite}

        .vl-prev{position:absolute;z-index:2;overflow:hidden;background:#fff center / cover no-repeat;container-type:size}
        .vl-sub{position:absolute;left:0;width:100%;bottom:9%;margin:0;text-align:center;font-family:'Pretendard';font-weight:800;font-size:5.6cqw;color:#fff;-webkit-text-stroke:.5cqw #111;paint-order:stroke fill;letter-spacing:-0.02em;white-space:nowrap}
        .vl-npc{position:absolute;left:44%;top:14%;font-size:30cqh;line-height:1;font-family:'Segoe UI Emoji','Apple Color Emoji',sans-serif}
        /* 얼굴 가리기는 모자이크 상자를 덮지 않고 이웃 그림에 직접 블러(filter)를 줌 */
        .vl-npc.is-blur{filter:blur(5px)}
        .vl-prev.is-play .vl-npc{animation:vl-walk 3s linear forwards}
        @keyframes vl-walk{from{transform:translateX(-14cqw)}to{transform:translateX(14cqw)}}
        @keyframes vl-walk-l{from{transform:translateX(-25cqw)}to{transform:translateX(25cqw)}}
        .vl-field{position:absolute;z-index:3;background:#fff;display:flex;align-items:center;padding:0 3%;font-size:18px;font-weight:500;color:#111;white-space:nowrap}
        .vl-track{position:absolute;z-index:3;background:#3b3c40;border-radius:99px;overflow:hidden}
        .vl-track i{display:block;height:100%;width:0;background:#fff}
        .vl-track.is-run i{width:100%;transition:width 2.4s linear}
        .vl-place{position:absolute;left:0;top:35%;width:100%;height:65%;background:#111;z-index:3;display:flex;flex-wrap:wrap;align-content:flex-start;gap:40px 20px;padding:18px 16px}
        .vl-place button{position:relative;width:calc(50% - 10px);height:166px;padding:0;border:0;border-radius:16px;background:#fff;cursor:pointer;display:block}
        .vl-place button:hover{border-color:#b10c7a;box-shadow:0 0 0 4px rgb(199, 3, 94)}
        .vl-place img{display:block;width:100%;height:100%;object-fit:cover;border-radius:16px}
        .vl-place span{position:absolute;left:10px;right:0;bottom:-33px;height:40px;display:flex;align-items:center;justify-content:flex-start;font-size:19px;font-weight:700;color:#fff}

        .p09-right{position:absolute;left:1290px;top:50%;transform:translateY(-50%);width:560px;display:flex;flex-direction:column;gap:30px}
        .p09-right.is-off{display:none}
        .p09-right .card-btn{width:100%;min-width:0;height:auto;min-height:130px;padding:18px 30px 12px;font-size:44px;line-height:1.2}
        .p09-cmp{width:100%;display:flex;flex-direction:column;gap:6px}
        .p09-cmp b{align-self:flex-start;margin:18px 0 0;padding:6px 24px 0;height:54px;box-sizing:border-box;background:var(--c-white);border:solid 4px var(--c-ink);border-bottom:0;border-radius:14px 14px 0 0;font-family:'Cafe24 Ssurround';font-weight:normal;font-size:30px;color:var(--c-ink);line-height:46px}
        .p09-cmp div{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:18px 22px 12px;background:var(--c-white);border:solid 4px var(--c-ink);border-radius:0 18px 18px 18px;font-family:'Pretendard';font-weight:700;font-size:38px;color:var(--c-ink);letter-spacing:-0.03em;min-height:92px}
        .p09-cmp span{padding:4px 8px 2px;border-radius:10px}
        .p09-cmp span:last-child{margin-left:-14px}
        .p09-cmp button{padding:4px 8px 2px;border:0;border-radius:10px;background:none;font:inherit;color:inherit;cursor:pointer}
        @media (hover:hover){.p09-cmp button:hover{background:#e8dcff}}
        .p09-cmp button.is-mark,.p09-cmp span.is-mark{background:#ffe27a}
        .p09-cmp button.is-wrong{animation:fix-word-shake .3s ease}
        .p09-next.card-btn{display:flex;align-items:center;justify-content:center;min-width:0;width:300px;height:110px;margin-bottom:20px;padding:8px 10px 0;font-size:56px;z-index:7}
        .is-hide{display:none!important}

        .p09-vlog{position:absolute;left:380px;top:100px;width:1160px;height:653px;box-sizing:border-box;border:solid 6px var(--c-ink);background:#fff center / cover no-repeat;overflow:hidden;box-shadow:-7px 10px 6px 2px rgba(92,61,240,.17);z-index:2;container-type:size}
        .p09-vlog .vl-sub{font-size:4.2cqw;bottom:8%}
        .p09-vlog .vl-npc.is-blur{filter:blur(1.7cqh)}
        .p09-vlog.is-play .vl-npc{animation:vl-walk 3s linear forwards}
        .p09-play{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;padding:0;border:0;background:url('../../img/common/btn_play.png') center / contain no-repeat;cursor:pointer;z-index:4}

        .p09-swhand{position:absolute;left:0;top:0;width:110px;z-index:30;pointer-events:none;animation:p09-sw 1.6s ease-in-out infinite}
        .p09-nav{position:absolute;z-index:5;pointer-events:none}
        .p09-nav-del{position:absolute;left:0;top:0;height:100%}
        .p09-nav-clip{position:absolute;top:0;height:100%;overflow:hidden}
        .p09-nav-clip img{display:block;max-width:none;height:100%}
        .p09-swhand.is-left{animation-name:p09-swl}
        @keyframes p09-swl{0%{opacity:0;transform:translateX(0)}15%{opacity:1}70%{opacity:1;transform:translateX(-150px)}100%{opacity:0;transform:translateX(-150px)}}
        @keyframes p09-sw{0%{opacity:0;transform:translateX(0)}15%{opacity:1}70%{opacity:1;transform:translateX(150px)}100%{opacity:0;transform:translateX(150px)}}
        #p09Info,#p09Done{z-index:120}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <p class="p09-bubble" id="p09Bubble"></p>
          <div class="char-box p09-character" id="p09Char"><img src="../img/sa_main.png" alt="메인 캐릭터"></div>
          <div class="phone-frame p09-phone" id="p09Phone"><div class="phone-screen" id="p09Screen"></div></div>
          <div class="p09-right is-off" id="p09Right"></div>
          <button class="card-btn js-sfx next-btn p09-next is-hide" id="p09Next" data-sound="sound/click.mp3">다음</button>

          <div class="p09-vlog is-hide" id="p09Vlog">
            <div class="vl-npc is-blur">🧑</div><p class="vl-sub" id="p09VlogSub"></p>
            <button type="button" class="p09-play" id="p09Play" aria-label="재생"></button>
          </div>

          <div class="avatar-modal is-off" id="p09Info">

                <p class="avatar-popup-text is-small">여기에서는 준비된 목소리가 나와요!<br>실제 어플을 사용할 때는 내가 직접 말해요.</p>
                <button type="button" class="avatar-popup-next card-btn is-popup js-sfx" id="p09InfoOk" data-sound="sound/click.mp3">확인</button>
              </div>
            </div>
          </div>

          <div class="avatar-modal is-off" id="p09Done">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_correct.png" alt=""></div>
              <div class="avatar-popup-body is-finish is-side">
                <p class="avatar-popup-text">멋진 브이로그가 완성 되었어요!</p>
                <p class="avatar-popup-sub">AI의 도움을 받아 이웃의 초상권을<br>지키며 우리 동네를 소개했어요.</p>
                <a href="page10.html" class="js-nav-effect avatar-popup-next card-btn is-popup js-sfx" data-sound="sound/click.mp3">다음</a>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="뚝딱! 우리 동네 브이로그 제작소" data-next="page10.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
  <script src="../../js/box-edit.js"></script>
  <script>
  (function () {
    const PLACES = {
      mart: { name: '마트', img: 'p09_place_mart', words: ['여기는', '우리', '동네', '마트'], err: '동내', bad: 2 },
      post: { name: '우체국', img: 'p09_place_post', words: ['여기는', '우리', '동네', '우체국'], err: '우채국', bad: 3 },
      library: { name: '도서관', img: 'p09_place_library', words: ['여기는', '우리', '동네', '도서관'], err: '도서간', bad: 3 },
      park: { name: '공원', img: 'p09_place_park', words: ['여기는', '우리', '동네', '공원'], err: '공언', bad: 3 }
    };
    const st = { pl: null, i: 0 };
    const screen = $('p09Screen'), bubble = $('p09Bubble'), right = $('p09Right'), nextBtn = $('p09Next');
    const main = document.querySelector('main');
    const show = (el, on) => el.classList.toggle('is-hide', !on);
    // 캡처(540x1170)는 폭 434에 맞춰 줄이고(위·아래 줄임 없음), 폰 하단 시스템 버튼(46px) 자리를 내려고 캡처의 빈 어두운 띠(CUT_AT 위치부터 약 134px)를 잘라 붙임
    const SW = 434, SH = 879, NAVH = 46, SC = SW / 540, NONAV = { 17: 1 };
    const cutLen = () => 1170 - (SH - (NONAV[STEPS[st.i].img] ? 0 : NAVH)) / SC;
    const CUT_AT = { 7: 480, 28: 840 };
    const cutFrom = () => (STEPS[st.i] && CUT_AT[STEPS[st.i].img]) || 110;
    // 좌표(box)는 모두 캡처 픽셀(540x1170) 기준 [x, y, 폭, 높이]
    const mapY = (src) => { const f = cutFrom(); return (src <= f ? src : src >= f + cutLen() ? src - cutLen() : f) * SC / SH * 100; };
    const mbox = (a) => { const t = mapY(a[1]), b = mapY(a[1] + a[3]); return [a[0] / 5.4, t, a[2] / 5.4, b - t]; };
    const pct = (a) => { if (STEPS[st.i].home) return 'left:' + a[0] / 5.4 + '%;top:' + a[1] / 11.7 + '%;width:' + a[2] / 5.4 + '%;height:' + a[3] / 11.7 + '%'; const m = mbox(a); return 'left:' + m[0] + '%;top:' + m[1] + '%;width:' + m[2] + '%;height:' + m[3] + '%'; };
    const PREV = [6, 255, 527, 295];
    const PREV_TRACK = [0, 205, 540, 351];
    const errWords = () => st.pl.words.map((w, k) => (k === st.pl.bad ? st.pl.err : w));
    const sentence = (ws) => ws.slice(0, 3).join(' ') + ' ' + ws[3] + '입니다.';
    const okText = () => sentence(st.pl.words);
    const errText = () => sentence(errWords());

    // 단계 목록: img(캡처 번호) · bubble · 누를 곳(hot) / 스와이프(swipe) / next / right / load 등
    const STEPS = [
      { home: true, bubble: 'VLLO를 클릭해요.', hot: [[201, 515, 137, 164]] },
      { img: 7, bubble: '우리 동네를 소개하는<br>브이로그를 만들어볼까요?<br>원하는 장소를 하나 선택해요.', place: true },
      { img: 8, prev: 1, bubble: '먼저, 우리 동네를 소개해봐요.<br>음성 녹음을 클릭해요.', hot: [[4, 970, 72, 68]] },
      { img: 9, prev: 1, bubble: '녹음 버튼을 클릭해<br>우리 동네를 소개하는 말을<br>녹음해봐요.', hot: [[226, 976, 88, 88]], info: true },
      { img: 10, prev: 1, bubble: '녹음이 완료되면<br>정지 버튼을 클릭해요.', tts: true, hot: [[226, 975, 88, 88]] },
      { img: 11, prev: 1, bubble: '완료 버튼을 클릭해요.', hot: [[197, 1107, 330, 60]], finger: [8, 54] },
      { img: 12, prev: 1, bubble: '좋아요!<br>이제 녹음한 음성을<br>AI 기능을 활용해 자막으로<br>만들어봐요.', next: true },
      { img: 12, prev: 1, bubble: '하단의 메뉴 바를<br>오른쪽으로 슬라이드 해요.', swipe: [0, 1030, 540, 78], nav: 'a' },
      { img: 13, base: 12, navEnd: 'a', prev: 1, bubble: '자동 자막을 클릭해요.', hot: [[361, 1025, 86, 90]] },
      { img: 14, prev: 1, bubble: '생성하기 버튼을 클릭해요.', hot: [[276, 1112, 250, 56]], finger: [0, 56] },
      { img: 15, bubble: '자막을 생성하는 중이에요.', load: [29, 573, 475, 26] },
      { img: 16, prev: 1, sub: 'err', bubble: 'AI 자동 자막을 생성했어요!<br>음성을 알맞게 인식했는지<br>확인해볼까요?', next: true },
      { img: 16, prev: 1, sub: 'err', bubble: '음성 녹음 내용과<br>AI가 만든 자동 자막을 비교해<br>틀린 부분을 클릭해보세요.', cmp: true },
      { img: 16, prev: 1, sub: 'err', bubble: 'AI는 틀릴 수 있으니<br>꼭 다시 한번 확인해야 해요!<br>아래의 편집을 클릭해요.', hot: [[474, 1033, 60, 76]] },
      { img: 17, prev: 1, sub: 'err', field: 'err', bubble: '오른쪽 버튼을 클릭해<br>틀린 부분을 수정해요.', fix: true },
      { img: 17, prev: 1, sub: 'fix', field: 'fix', bubble: '좋아요!<br>자막을 올바르게 수정했어요.<br>확인 버튼을 클릭해요.', hot: [[478, 616, 54, 54]] },
      { img: 16, prev: 1, sub: 'fix', bubble: '아래의 완료 버튼을 눌러<br>자막 수정을 마무리해요.', hot: [[14, 1114, 512, 53]], finger: [0, 58] },
      { img: 18, prev: 1, sub: 'fix', bubble: '이제 영상에 찍힌<br>이웃의 얼굴을 가려볼까요?', next: true },
      { img: 18, prev: 1, sub: 'fix', bubble: '하단의 효과 탭을 클릭해요.', hot: [[422, 1113, 94, 48]], finger: [0, 56] },
      { img: 19, prev: 1, sub: 'fix', bubble: '왜곡(모자이크)를 클릭해요.', hot: [[2, 972, 76, 72]], finger: [9, -17] },
      { img: 20, prev: 1, sub: 'fix', bubble: '얼굴을 흐릿하게 만드는 효과인<br>‘블러’를 클릭해요.', hot: [[28, 944, 114, 151]], finger: [4, -17] },
      { img: 21, prev: 1, sub: 'fix', mos: true, bubble: '현재 장면의 얼굴을 가렸어요.<br>완료 버튼을 클릭해요.', hot: [[275, 1114, 252, 54]], finger: [0, 54] },
      { img: 22, prev: 1, sub: 'fix', mos: true, bubble: '이제 모자이크를 이웃의 얼굴에<br>고정시켜 볼까요?<br>하단의 도구 탭을 오른쪽으로<br>슬라이드 해요.', swipe: [0, 1030, 540, 78], nav: 'b' },
      { img: 23, base: 22, navEnd: 'b', prev: 1, sub: 'fix', mos: true, bubble: '얼굴 트래킹을 클릭해요.', hot: [[250, 1032, 81, 74]], finger: [8, -19] },
      { img: 24, prev: 1, sub: 'fix', mos: true, bubble: '모자이크 효과를 추가한 부분이<br>트래킹 영역으로 설정됐어요.<br>트래킹하기 버튼을 클릭해요.', hot: [[172, 1026, 196, 54]], finger: [0, -18] },
      { img: 25, prevTrack: 1, bubble: '트래킹하는 중이에요.', load: [29, 749, 475, 16] },
      { img: 26, prev: 1, sub: 'fix', mos: true, play: true, bubble: '영상 끝까지 얼굴이<br>잘 가려졌나요?', choices: ['잘 가려졌어요.', '다시 한번 확인해볼래요.'] },
      { img: 26, prev: 1, sub: 'fix', mos: true, bubble: '아래의 완료 버튼을 클릭해<br>얼굴 트래킹을 마무리해보세요.', hot: [[14, 1114, 513, 53]], finger: [0, 51] },
      { img: 27, prev: 1, sub: 'fix', mos: true, bubble: '좋아요!<br>우리 동네 브이로그 편집을<br>완료했어요.', next: true },
      { img: 27, prev: 1, sub: 'fix', mos: true, bubble: '추출하기 버튼을 클릭해<br>영상을 저장해봐요.', hot: [[435, 58, 91, 34]], finger: [3, -7] },
      { img: 28, bubble: '아래의 추출하기 버튼을<br>한 번 더 클릭해요.', hot: [[51, 1036, 438, 98]], finger: [4, -27] },
      { img: 29, bubble: '비디오를 만드는 중이에요.', load: [29, 590, 475, 14] },
      { img: 30, bubble: '완성했어요!<br>내가 만든 브이로그를<br>한 번 재생해볼까요?', next: true },
      { vlog: true, bubble: '재생 버튼을 눌러<br>내가 만든 브이로그를 확인해요.' }
    ];

    function clearOverlays() { screen.innerHTML = ''; right.innerHTML = ''; right.classList.add('is-off'); show(nextBtn, false); clearFingers(); document.querySelectorAll('.p09-swhand').forEach((h) => h.remove()); }
    function add(html) { const d = document.createElement('div'); d.innerHTML = html; const e = d.firstElementChild; screen.appendChild(e); return e; }
    // 손가락 위치 보정: 단계에 finger: [dx, dy] 를 적으면 기본 위치에서 그만큼 더 옮김(?edit 으로 열어 손가락을 클릭 → 방향키로 맞춘 값을 그대로 적음)
    const fingerOff = () => STEPS[st.i].finger || [0, 0];
    function tagFinger() {
      if (!BoxEdit.on) return;
      const f = main.querySelector('.js-point-finger');
      if (!f) return;
      f.style.pointerEvents = 'auto';
      f._last = fingerOff().slice();
      BoxEdit.tag(f, STEPS[st.i].finger);
    }
    const fingerTo = (el, dy, x) => setTimeout(() => {
      if (!el || !el.isConnected) return;
      const o = fingerOff();
      pointFingerAt(el, { onMain: true, x: x || 1, dx: o[0], dy: (dy || 0) + o[1] });
      tagFinger();
    }, 350);

    function hotButton(box) {
      const b = document.createElement('button');
      b.className = 'p09-hot' + (box[2] > 300 || box[0] < 6 || box[0] + box[2] > 534 || box[1] < 54 || box[1] + box[3] > 1100 ? ' is-in' : '');
      b.style.cssText = pct(box);
      BoxEdit.tag(b, box);
      screen.appendChild(b);
      return b;
    }

    function go(n) { st.i = n; render(); }
    const advance = () => go(st.i + 1);

    function render() {
      const s = STEPS[st.i];
      clearOverlays();
      screen.classList.toggle('is-dark', !s.home);
      show($('p09Phone'), !s.vlog);
      show($('p09Char'), true);
      show($('p09Vlog'), !!s.vlog);
      bubble.classList.remove('is-hide');
      bubble.innerHTML = s.bubble;
      if (s.vlog) { vlog(); return; }

      if (s.home) {
        add('<div class="app-home is-purple"><div class="phone-status is-dark"></div><div class="app-icon is-static"><i><img src="../../img/common/logo_vllo.png" alt=""></i>VLLO</div><div class="phone-nav"></div></div>');
        initPhoneBars();
      } else {
        const f = cutFrom(), bg = 'background-image:url(img/ui/u' + (s.base || s.img) + '.jpg)';
        const base = document.createElement('div');
        base.className = 'p09-base';
        base.style.height = (NONAV[s.img] ? SH : SH - NAVH) + 'px';
        base.innerHTML = '<i style="' + bg + ';top:0;height:' + f * SC + 'px"></i><i style="' + bg + ';top:' + f * SC + 'px;height:' + (1170 - f - cutLen()) * SC + 'px;background-position:0 -' + (f + cutLen()) * SC + 'px"></i>';
        screen.appendChild(base);
        add('<div class="phone-status" style="background:' + (s.img === 7 ? '#111' : s.img === 25 ? '#000' : '#17181c') + '"></div>');
        if (!NONAV[s.img]) add('<div class="phone-nav is-dark"></div>');
        initPhoneBars();
        if (s.navEnd) { const n = navSlide(s.navEnd); n.set(n.end); }
      }
      if (s.prev || s.prevTrack) {
        const box = s.prevTrack ? PREV_TRACK : PREV;
        const p = add('<div class="vl-prev" id="vlPrev" style="' + pct(box) + ';background-image:url(img/' + st.pl.img + '.jpg)"></div>');
        p.insertAdjacentHTML('beforeend', '<div class="vl-npc' + (s.mos ? ' is-blur' : '') + '">🧑</div>');
        if (s.sub) p.insertAdjacentHTML('beforeend', '<p class="vl-sub">' + (s.sub === 'err' ? errText() : okText()) + '</p>');
      }
      if (s.field) add('<div class="vl-field" style="' + pct([11, 616, 442, 50]) + '">' + (s.field === 'err' ? errText() : okText()) + '</div>');

      if (s.place) { placePick(); return; }
      if (BoxEdit.on && (s.hot || s.home) && !s.finger) s.finger = [0, 0];
      if (s.hot) {
        const hots = s.hot.map((box) => hotButton(box));
        hots.forEach((b) => b.addEventListener('click', () => {
          playClick();
          if (s.info) { $('p09Info').classList.remove('is-off'); return; }
          advance();
        }));
        const dy = s.hot[0][1] > 1050 ? -70 : 0;
        if (s.home) setTimeout(() => { const o = fingerOff(); pointFingerAt(screen.querySelector('.app-icon'), { onMain: true, dx: 15 + o[0], dy: -37 + o[1] }); tagFinger(); }, 350);
        else if (!s.tts) fingerTo(hots[0], dy, s.hot[0][2] > 300 ? 0.82 : undefined); else ttsRun(hots[0]);
      }
      if (s.swipe) swipe(s.swipe);
      if (s.next) { show(nextBtn, true); }
      if (s.load) load(s.load);
      if (s.cmp) compare();
      if (s.fix) {
        setRight([{ t: '‘' + st.pl.err + '’를 ‘' + st.pl.words[st.pl.bad] + '’로<br>수정하기', fn: () => advance() }]);
      }
      if (s.choices) {
        const prev = $('vlPrev');
        setRight(s.choices.map((t, k) => ({ t, fn: () => { if (k === 0) advance(); else replay(prev); } })));
        setTimeout(() => replay(prev), 400);
      }
    }
    function setRight(items) {
      right.innerHTML = '';
      items.forEach((it) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'card-btn js-sfx';
        b.dataset.sound = 'sound/click.mp3';
        b.innerHTML = it.t;
        b.addEventListener('click', () => it.fn());
        right.appendChild(b);
      });
      right.classList.remove('is-off');
    }

    // 장소 고르기(기획서 48p)
    function placePick() {
      const w = add('<div class="vl-place" style="top:' + mapY(480) + '%;height:auto;bottom:' + NAVH + 'px"></div>');
      Object.keys(PLACES).forEach((k) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.innerHTML = '<img src="img/' + PLACES[k].img + '.jpg" alt=""><span>' + PLACES[k].name + '</span>';
        b.addEventListener('click', () => { playClick(); st.pl = PLACES[k]; advance(); });
        w.appendChild(b);
      });
    }

    // 녹음: TTS가 끝나면 정지 버튼 손가락 안내(기획서 51p)
    function ttsRun(btn) {
      let done = false;
      const end = () => { if (done) return; done = true; if (btn.isConnected) fingerTo(btn); };
      try {
        const u = new SpeechSynthesisUtterance('여기는 우리 동네 ' + st.pl.name + '입니다');
        u.lang = 'ko-KR';
        u.onend = end;
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      } catch (e) { /* 음성 합성이 없으면 타이머만 */ }
      setTimeout(end, 3800);
    }

    // 로딩 게이지(자동 진행)
    function load(box) {
      add('<div class="vl-track" style="' + pct(box) + '"><i></i></div>');
      const tr = screen.querySelector('.vl-track');
      BoxEdit.tag(tr, box);
      setTimeout(() => tr.classList.add('is-run'), 60);
      setTimeout(() => { if (STEPS[st.i].load === box) advance(); }, 2700);
    }

    // 하단 메뉴 밀기용 그림: 고정 칸(del) + 옆으로 밀리는 줄(slide). 캡처 픽셀(540x1170) 기준 — 고정 칸은 (0,y), 줄은 (x,y)에서 시작해 end 만큼 왼쪽으로 밀리면 다음 캡처와 같아짐(캡처와 겹쳐 맞춘 값)
    const NAVS = {
      a: { del: 'nav_del.png', slide: 'nav_slide.png', x: 89, y: 1025, w: 823, h: 91, dw: 89, end: 372 },
      b: { del: 'nav2_del.png', slide: 'nav2_slide.png', x: 88, y: 1025, w: 760, h: 89, dw: 88, end: 308 }
    };
    function navSlide(key) {
      const c = NAVS[key];
      const n = add('<div class="p09-nav" style="' + pct([0, c.y, 540, c.h]) + '"><img class="p09-nav-del" src="img/ui/' + c.del + '" alt="" style="width:' + c.dw / 5.4 + '%"><div class="p09-nav-clip" style="left:' + c.x / 5.4 + '%;width:' + (540 - c.x) / 5.4 + '%"><img src="img/ui/' + c.slide + '" alt="" style="width:' + c.w / (540 - c.x) * 100 + '%"></div></div>');
      const s = n.querySelector('.p09-nav-clip img');
      return { end: c.end, set(off, anim) { s.style.transition = anim ? 'transform .25s ease' : 'none'; s.style.transform = 'translateX(' + (-off / c.w * 100) + '%)'; } };
    }

    // 하단 메뉴 밀기(기획서 54·69p). nav 가 있는 단계는 위 그림이 손가락을 따라 왼쪽으로 밀림, 아니면 캡처를 오른쪽으로 끌어냄
    function swipe(box) {
      const z = document.createElement('div');
      z.className = 'p09-swipe';
      const m = mbox(box);
      z.style.cssText = pct(box);
      BoxEdit.tag(z, box);
      screen.appendChild(z);
      const sr = screen.getBoundingClientRect(), mr = main.getBoundingClientRect(), sc = mr.width / 1920;
      const nav = STEPS[st.i].nav ? navSlide(STEPS[st.i].nav) : null;
      const hand = document.createElement('img');
      hand.className = 'p09-swhand' + (nav ? ' is-left' : '');
      hand.src = '../../img/common/img_finger01.png';
      hand.style.left = ((sr.left - mr.left) / sc + sr.width / sc * (nav ? 0.72 : 0.28)) + 'px';
      hand.style.top = ((sr.top - mr.top) / sc + sr.height / sc * (m[1] + m[3] / 2) / 100) + 'px';
      main.appendChild(hand);
      let x0 = null, ghost = null, navOff = 0;
      const base = screen.querySelector('.p09-base');
      const arm = () => {
        ghost = base.cloneNode(true);
        ghost.style.cssText = 'position:absolute;left:0;top:-' + (m[1] * SH / 100) + 'px;width:' + SW + 'px;height:' + (SH - NAVH) + 'px;overflow:hidden';
        z.style.overflow = 'hidden';
        z.style.background = '#232428';
        z.appendChild(ghost);
      };
      const rest = () => {
        if (nav) { nav.set(0, true); return; }
        if (!ghost) return;
        const g = ghost;
        g.style.transition = 'transform .25s ease';
        g.style.transform = 'translateX(0)';
        setTimeout(() => { g.remove(); z.style.background = 'none'; }, 280);
        ghost = null;
      };
      z.addEventListener('pointerdown', (e) => { x0 = e.clientX; z.setPointerCapture(e.pointerId); if (base && !nav) arm(); });
      z.addEventListener('pointermove', (e) => {
        if (x0 === null) return;
        const d = e.clientX - x0;
        if (nav) {
          const off = Math.max(0, Math.min(nav.end, -d / (z.getBoundingClientRect().width / 540)));
          nav.set(off);
          navOff = off;
          if (off >= nav.end) { x0 = null; playClick(); setTimeout(advance, 250); }
          return;
        }
        if (ghost && d > 0) ghost.style.transform = 'translateX(' + d / sc + 'px)';
        if (d > 70 * sc) { x0 = null; playClick(); advance(); }
      });
      z.addEventListener('pointerup', () => {
        if (x0 !== null && nav && navOff >= nav.end * 0.5) { x0 = null; nav.set(nav.end, true); playClick(); setTimeout(advance, 300); return; }
        if (x0 !== null) rest();
        x0 = null;
      });
      z.addEventListener('pointercancel', () => { if (x0 !== null) rest(); x0 = null; });
    }

    // 음성 녹음 내용 ↔ AI 자막 비교(기획서 59p)
    function compare() {
      const pl = st.pl, ew = errWords();
      const box = document.createElement('div');
      box.className = 'p09-cmp';
      const rec = document.createElement('div');
      rec.id = 'cmpRec';
      pl.words.forEach((w, k) => { const e = document.createElement('span'); e.textContent = w; e.dataset.k = k; rec.appendChild(e); });
      rec.insertAdjacentHTML('beforeend', '<span>입니다.</span>');
      const ai = document.createElement('div');
      ew.forEach((w, k) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = w;
        b.addEventListener('click', () => {
          if (k === pl.bad) { playCorrect(); b.classList.add('is-mark'); setTimeout(advance, 900); return; }
          playWrong();
          b.classList.add('is-wrong');
          setTimeout(() => b.classList.remove('is-wrong'), 400);
          rec.querySelector('[data-k="' + pl.bad + '"]').classList.add('is-mark');
          ai.children[pl.bad].classList.add('is-mark');
        });
        ai.appendChild(b);
      });
      ai.insertAdjacentHTML('beforeend', '<span>입니다.</span>');
      box.innerHTML = '<b>음성 녹음 내용</b>';
      box.appendChild(rec);
      box.insertAdjacentHTML('beforeend', '<b>AI 자동 자막</b>');
      box.appendChild(ai);
      right.appendChild(box);
      right.classList.remove('is-off');
    }

    // 트래킹 영상 재생(이모지 이웃이 걸어가고 모자이크가 따라감)
    function replay(prev) {
      if (!prev) return;
      prev.classList.remove('is-play');
      void prev.offsetWidth;
      prev.classList.add('is-play');
    }

    // 완성 영상(기획서 80~81p)
    function vlog() {
      const v = $('p09Vlog');
      v.style.backgroundImage = "url('img/" + st.pl.img + ".jpg')";
      $('p09VlogSub').textContent = okText();
      v.classList.remove('is-play');
      show($('p09Play'), true);
    }
    $('p09Play').addEventListener('click', () => {
      playClick();
      show($('p09Play'), false);
      const v = $('p09Vlog');
      v.classList.remove('is-play');
      void v.offsetWidth;
      v.classList.add('is-play');
      let spoke = false, timed = false;
      const finish = () => { if (spoke && timed) { bubble.innerHTML = '완성했어요!'; $('p09Done').classList.remove('is-off'); } };
      setTimeout(() => { timed = true; finish(); }, 3300);
      // 녹음해 둔 내레이션(자막 문장) — 음성 파일이 없어 브라우저 음성 합성으로 재생, 끝나면 완료 안내
      try {
        const u = new SpeechSynthesisUtterance(okText());
        u.lang = 'ko-KR';
        u.onend = u.onerror = () => { spoke = true; finish(); };
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
        setTimeout(() => { spoke = true; finish(); }, 8000);
      } catch (e) { spoke = true; }
    });

    nextBtn.addEventListener('click', advance);
    $('p09InfoOk').addEventListener('click', () => { $('p09Info').classList.add('is-off'); advance(); });
    // 화면 전환 때 끊기지 않게 쓰는 그림을 미리 불러와 디코딩해 둠(단계 순서대로, 지금 단계부터)
    const PRELOAD = [];
    STEPS.forEach((s) => { if (s.img) PRELOAD.push('img/ui/u' + s.img + '.jpg'); if (s.base) PRELOAD.push('img/ui/u' + s.base + '.jpg'); });
    PRELOAD.push('../../img/common/logo_vllo.png', '../../img/common/img_finger01.png', '../../img/common/img_finger02.png', '../../img/common/btn_play.png');
    Object.keys(NAVS).forEach((k) => PRELOAD.push('img/ui/' + NAVS[k].del, 'img/ui/' + NAVS[k].slide));
    Object.keys(PLACES).forEach((k) => PRELOAD.push('img/' + PLACES[k].img + '.jpg'));
    window.p09Cache = Array.from(new Set(PRELOAD)).map((src) => { const im = new Image(); im.src = src; if (im.decode) im.decode().catch(() => {}); return im; });

    BoxEdit.init({
      setup: () => { st.pl = PLACES[Object.keys(PLACES)[0]]; },
      name: (el) => (el.classList.contains('js-point-finger') ? '손가락 finger: ' : '박스 '),
      apply: (el) => el.classList.contains('js-point-finger')
        ? (el.style.left = parseFloat(el.style.left) + el._ref[0] - el._last[0] + 'px', el.style.top = parseFloat(el.style.top) + el._ref[1] - el._last[1] + 'px', el._last = el._ref.slice())
        : pct(el._ref).split(';').forEach((kv) => { const k = kv.split(':'); el.style.setProperty(k[0], k[1]); }),
      step: { count: STEPS.length, get: () => st.i, set: (n) => { st.i = n; }, go,
        label: (n) => '단계 ' + n + ' / ' + (STEPS.length - 1) + ' (캡처 ' + (STEPS[n].img || (STEPS[n].home ? 'home' : '—')) + ')' }
    });
    render();
  })();
  </script>
</body>
