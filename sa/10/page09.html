<!--
  [편집 모드 사용법] 주소 뒤에 ?edit 을 붙여 열 때만 동작(평소 화면은 그대로)
    page09.html?edit&step=26&place=park
      step=N     N번째 단계(0부터)에서 바로 시작. 위쪽 노란 막대의 [◀ 이전][다음 ▶], ] [ , PageDown/PageUp 으로도 이동
      place=이름 library 도서관(기본) · mart 마트 · post 우체국 · park 공원
    자주 쓰는 단계: 17~21 효과·블러 고르기 · 22,23 도구 탭 밀기·얼굴 트래킹 · 24 트래킹 영역 설정 · 25 트래킹 중(자동으로 안 넘어감) · 26 영상 재생 확인 · 32 저장 완료 · 33 영상 재생
    박스·손가락 좌표: 박스를 클릭 → 방향키 1px(Shift 10px) 이동, Alt+방향키 폭·높이. 노란 막대에 나오는 값을 STEPS 의 그 단계(hot / finger / swipe / swhand)에 붙여 넣음
    손가락 'finger = [dx, dy]' · 밀기 손 'swhand = [dx, dy]' · 로고 모션 위치 VL.LOGO = [x, y, 폭, 높이] (vllo-ui.js, 단계 10 같은 로딩 화면에서 맞춤)
    얼굴 따라가기(PLACES 의 size·keys)는 7페이지 ?edit&scene=1~5 에서 영상을 멈춰 가며 맞춘 뒤 [복사]한 값을 붙여 넣음 (scene 1=library · 2=mart · 3=post · 4=park)
-->

    /* 영상 안의 위치(0~1) → 영상 칸(528x248) 안 px. 칸을 꽉 채우게(cover) 깔려 있음 */
    const faceAt = (t) => {
      const KS = st.pl.keys;
      for (let i = 1; i < KS.length; i++) {
        if (t <= KS[i][0]) { const a = KS[i - 1], b = KS[i], f = (t - a[0]) / ((b[0] - a[0]) || 1); return [a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f]; }
      }
      const l = KS[KS.length - 1];
      return [l[1], l[2]];
    };
    function placeBlur(el, W, H, t) {
      const dw = Math.max(W, H * 16 / 9), dh = dw * 9 / 16, f = faceAt(t), d = st.pl.size * dw * 1.15;
      el.style.width = el.style.height = d + 'px';
      el.style.left = ((W - dw) / 2 + f[0] * dw - d / 2) + 'px';
      el.style.top = ((H - dh) / 2 + f[1] * dh - d / 2) + 'px';
    }

    function swap(html, instant) {
      const old = Array.from(stack.children);
      const d = document.createElement('div');
      d.className = 'v-layer';
      d.innerHTML = html;
      stack.appendChild(d);
      const lgo = d.querySelector('#vlLogo');

      old.forEach((n) => n.remove());
      return d;
    }

      { scr: 'saved', bubble: '완성했어요!<br>내가 만든 브이로그를<br>한 번 재생해볼까요?', next: true },

    /* ---- 렌더 ---- */
    let timer = 0, tts = null, lastScr = '';
    function clearAll() {
      document.querySelectorAll('#p09Screen > .kbd-db').forEach((k) => k.remove());
      clearTimeout(timer);
      if (tts) { tts.pause(); tts = null; }
      hots.innerHTML = '';
      right.innerHTML = ''; right.classList.add('is-off');
      show(nextBtn, false);
      clearFingers();
      document.querySelectorAll('.p09-swhand').forEach((h) => h.remove());
    }
    const place = (el, b) => { el.style.cssText += ';left:' + b[0] + 'px;top:' + b[1] + 'px;width:' + b[2] + 'px;height:' + b[3] + 'px'; };
    function hotBtn(box, fn) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'p09-hot';
      place(b, box);
      BoxEdit.tag(b, box);
      b.addEventListener('click', () => { if (BoxEdit.on) return; playClick(); fn(); });
      hots.appendChild(b);
      return b;
    }
    const fingerOff = () => STEPS[st.i].finger || [0, 0];
    function tagFinger() {
      if (!BoxEdit.on) return;
      const f = main.querySelector('.js-point-finger');
      if (!f) return;
      f.style.pointerEvents = 'auto';
      f._last = fingerOff().slice();
      BoxEdit.tag(f, STEPS[st.i].finger);
    }
    function fingerTo(el, dy) {
      setTimeout(() => {
        if (!el || !el.isConnected) return;
        const o = fingerOff();
        pointFingerAt(el, { onMain: true, dx: o[0], dy: (dy || 0) + o[1] });
        tagFinger();
      }, 380);
    }

    function setView(s) {
      const has = !!s.view;
      vl.classList.toggle('is-nov', !has);
      sub.classList.toggle('is-on', !!s.sub);
      if (s.sub) sub.textContent = s.sub === 'err' ? errText() : okText();
      blur.classList.toggle('is-on', !!s.mos);
      const keep = s.mos === 'play';
      vid.classList.toggle('is-on', keep);
      if (!s.play) { vid.pause(); if (!keep || !s.keepT) vid.currentTime = 0; }
      blurMode = s.mos || '';
      hand.classList.toggle('is-on', s.mos === 'edit');
      trk.classList.toggle('is-on', s.mos === 'track');
    }

    const vlogVid = $('vlogVid'), vlogBlur = $('vlogBlur'), vlogBox = $('p09Vlog');
    function frame() {
      if (st.pl) {
        if (blurMode) {
          const W = viewer.clientWidth, H = viewer.clientHeight, t = blurMode === 'play' ? (vid.currentTime || 0) : 0;
          placeBlur(blur, W, H, t);
          if (blurMode === 'edit') { hand.style.cssText = 'left:' + blur.style.left + ';top:' + blur.style.top + ';width:' + blur.style.width + ';height:' + blur.style.height; }
          if (blurMode === 'track') {
            const dw = Math.max(W, H * 16 / 9), dh = dw * 9 / 16, f = faceAt(0), d = st.pl.size * dw * 1.7;
            trk.style.cssText = 'left:' + ((W - dw) / 2 + f[0] * dw - d / 2) + 'px;top:' + ((H - dh) / 2 + f[1] * dh - d / 2) + 'px;width:' + d + 'px;height:' + d + 'px';
          }
        }
        if (vlogBox && !vlogBox.classList.contains('is-hide')) placeBlur(vlogBlur, vlogBox.clientWidth - 12, vlogBox.clientHeight - 12, vlogVid.currentTime || 0);
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    function playClip() { vid.classList.add('is-on'); vid.currentTime = 0; vid.play().catch(() => {}); }
    function go(n) {
      st.i = n;
      render();
      if (BoxEdit.on) {
        try { const q = /[?&]step=/.test(location.search) ? location.search.replace(/([?&]step=)\d+/, '$1' + n) : location.search + '&step=' + n; history.replaceState(null, '', q); } catch (e) { /* 주소 갱신이 막힌 환경 */ }
      }
    }
    const advance = () => go(st.i + 1);

    function render() {
      const s = STEPS[st.i];
      if (BoxEdit.on && (s.hot || s.home) && !s.finger) s.finger = [0, 0];
      clearAll();
      st.vdone = false;
      show($('p09End'), false);
      say(s.bubble, s.pose || (s.next ? 'wink_present' : s.hot || s.swipe || s.home ? 'wink_point2' : 'main'));
      $('p09Set').style.display = s.nochar ? 'none' : '';
      if (s.vlog) { vlog(); return; }
      show($('p09Phone'), true);
      show($('p09Vlog'), false);
      if (s.home) {
        $('p09Home').style.display = '';
        vl.style.opacity = '0';
        $('p09Status').classList.add('is-dark');
        const icon = screen.querySelector('.app-icon');
        icon.style.cursor = 'pointer';
        icon.onclick = () => { if (BoxEdit.on || st.i !== 0) return; playClick(); icon.onclick = null; advance(); };
        const o = fingerOff();
        if (BoxEdit.on) setTimeout(() => { pointFingerAt(icon, { onMain: true, dx: 15 + o[0], dy: -37 + o[1] }); tagFinger(); }, 200);
        else setTimeout(() => { pointFingerAt(icon, { onMain: true, dx: 15 + o[0], dy: -37 + o[1] }); }, 350);
        return;
      }
      $('p09Home').style.display = 'none';
      vl.style.opacity = '';
      $('p09Set').style.display = s.nochar ? 'none' : '';
      $('p09Status').classList.remove('is-dark');
      setView(s);
      let inner = VL.screen(s.scr, s.scr === 'keyboard' ? { text: s.opt === 'err' ? errText() : okText() } : (s.opt || {}));
      swap(inner, lastScr === '');
      if (s.scr === 'keyboard') $('p09Screen').insertAdjacentHTML('beforeend', kbdDbHtml());
      lastScr = s.scr;
      if (s.opt && s.opt.msg !== undefined) { /* 로딩 */ }
      if (s.place) placePick();
      if (s.hot) {
        const hs = s.hot.map((box) => hotBtn(box, () => { if (s.info) { $('p09Info').classList.remove('is-off'); return; } advance(); }));
        if (s.tts) ttsRun(hs[0]);
        else fingerTo(hs[0], s.hot[0][1] > 1050 ? -70 : 0);
      }
      if (s.swipe) swipe(s.swipe);
      if (s.next) show(nextBtn, true);
      if (s.load) load(s.load);
      if (s.cmp) compare();
      if (s.fix) setRight([{ t: '‘' + st.pl.err + '’를 ‘' + st.pl.words[st.pl.bad] + '’로<br>수정하기', fn: () => advance() }]);
      if (s.choices) {
        setRight(s.choices.map((t, k) => ({ t, fn: () => { if (k === 0) advance(); else playClip(); } })));
        setTimeout(() => { if (STEPS[st.i] === s) playClip(); }, 450);
      }
    }

    // 장소 고르기: 내 프로젝트 자리에 장소 4개
    function placePick() {
      const w = stack.lastElementChild.querySelector('.v-full');
      const box = document.createElement('div');
      box.className = 'v-places';
      Object.keys(PLACES).forEach((k) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.innerHTML = '<img src="img/' + PLACES[k].thumb + '.jpg" alt=""><span>' + PLACES[k].name + '</span>';
        b.addEventListener('click', () => { playClick(); choose(PLACES[k]); });
        box.appendChild(b);
      });
      w.appendChild(box);
    }
    function choose(pl) { applyPlace(pl); advance(); }
    function applyPlace(pl) {
      st.pl = pl;
      st.key = Object.keys(PLACES).find((k) => PLACES[k] === pl);
      viewer.style.backgroundImage = "url('img/" + pl.thumb + ".jpg')";
      vid.classList.remove('is-on');
      vid.src = pl.video;
      vid.pause();
      stack.style.setProperty('--thumb', "url('img/" + pl.thumb + ".jpg')");
    }

    // 녹음: 장소별 소리 파일(sound/sa10_vllo_{mart,post,library,park}.mp3)이 끝나면 정지 버튼 손가락 안내
    function ttsRun(btn) {
      let done = false;
      const end = () => { if (done) return; done = true; if (btn.isConnected) fingerTo(btn); };
      try {
        const a = new Audio(ASSET_BASE + 'sound/sa10_vllo_' + st.key + '.mp3');
        a.onended = end;
        a.onerror = end;
        a.play().catch(end);
        tts = a;
      } catch (e) { end(); }
      timer = setTimeout(end, 9000);
    }
    // 로딩: 막대와 %가 차오름
    function load(ms) {
      const bar = stack.lastElementChild.querySelector('#vlLoadBar'), pct = stack.lastElementChild.querySelector('#vlLoadPct');
      const t0 = performance.now();
      const step = (now) => {
        const p = Math.min(1, (now - t0) / ms);
        if (bar) bar.style.width = (p * 100) + '%';
        if (pct) pct.textContent = Math.round(p * 100) + '%';
        if (p < 1 && stack.contains(bar)) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
      const cur = st.i;
      if (!BoxEdit.on) timer = setTimeout(() => { if (st.i === cur) advance(); }, ms + 150);
    }

    function setRight(items) {
      right.innerHTML = '';
      items.forEach((it) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'card-btn js-sfx';
        b.dataset.sound = 'sound/click.mp3';
        b.innerHTML = it.t;
        b.addEventListener('click', () => it.fn());
        right.appendChild(b);
      });
      right.classList.remove('is-off');
    }
    // 음성 녹음 내용 ↔ AI 자막 비교
    function compare() {
      const pl = st.pl, ew = errWords();
      const box = document.createElement('div');
      box.className = 'p09-cmp';
      const rec = document.createElement('div');
      pl.words.forEach((w, k) => { const e = document.createElement('span'); e.textContent = w; e.dataset.k = k; rec.appendChild(e); });
      rec.insertAdjacentHTML('beforeend', '<span>입니다.</span>');
      const ai = document.createElement('div');
      ew.forEach((w, k) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = w;
        b.addEventListener('click', () => {
          if (k === pl.bad) { playCorrect(); b.classList.add('is-mark'); setTimeout(advance, 900); return; }
          playWrong();
          b.classList.add('is-wrong');
          setTimeout(() => b.classList.remove('is-wrong'), 400);
          rec.querySelector('[data-k="' + pl.bad + '"]').classList.add('is-mark');
          ai.children[pl.bad].classList.add('is-mark');
        });
        ai.appendChild(b);
      });
      ai.insertAdjacentHTML('beforeend', '<span>입니다.</span>');
      box.innerHTML = '<b>음성 녹음 내용</b>';
      box.appendChild(rec);
      box.insertAdjacentHTML('beforeend', '<b>AI 자동 자막</b>');
      box.appendChild(ai);
      right.appendChild(box);
      right.classList.remove('is-off');
    }
    // 완성 영상
    function vlog() {
      show($('p09Phone'), false);
      show($('p09Vlog'), true);
      vlogBox.style.backgroundImage = "url('img/" + st.pl.thumb + ".jpg')";
      vlogVid.src = st.pl.video;
      vlogVid.currentTime = 0;
      vlogVid.pause();
      vlogVid.style.opacity = '0';
      vlogBlur.classList.add('is-on');
      $('p09VlogSub').textContent = okText();
      $('p09VlogSub').classList.add('is-on');
      show($('p09Play'), true);
    }
    $('p09Play').addEventListener('click', () => {
      playClick();
      show($('p09Play'), false);
      vlogVid.style.opacity = '1';
      vlogVid.currentTime = 0;
      vlogVid.play().catch(() => {});
      let spoke = false, timed = false;
      const finish = () => { if (spoke && timed) { say('완성했어요!', 'wink_jump'); st.vdone = true; show(nextBtn, true); } };
      vlogVid.onended = () => { timed = true; finish(); };
      setTimeout(() => { timed = true; finish(); }, 5600);
      try {
        const a = new Audio(ASSET_BASE + 'sound/sa10_vllo_' + st.key + '.mp3');
        a.onended = a.onerror = () => { spoke = true; finish(); };
        a.play().catch(() => { spoke = true; finish(); });
      } catch (e) { spoke = true; }
      setTimeout(() => { spoke = true; finish(); }, 9000);
    });

    // 하단 메뉴 밀기: 손가락 따라 줄이 왼쪽으로 밀려 자동 자막이 보이면 다음 단계
    function swipe(box) {
      const z = document.createElement('div');
      z.className = 'p09-swipe';
      place(z, box);
      BoxEdit.tag(z, box);
      hots.appendChild(z);
      const MAXO = STEPS[st.i].wide || VL.NAVW;
      const row = stack.lastElementChild.querySelector('#vlRow2');
      const sr = screen.getBoundingClientRect(), mr = main.getBoundingClientRect(), sc = mr.width / 1920, k = K();
      const hand = document.createElement('img');
      hand.className = 'p09-swhand';
      hand.src = '../../img/common/img_finger01.png';
      hand.style.left = ((sr.left - mr.left) / sc + sr.width / sc * 0.72) + 'px';
      hand.style.top = ((sr.top - mr.top) / sc + (box[1] + box[3] / 2) * k - 10) + 'px';
      hand.style.marginLeft = (STEPS[st.i].swhand || [0, 0])[0] + 'px';
      hand.style.marginTop = (STEPS[st.i].swhand || [0, 0])[1] + 'px';
      if (BoxEdit.on) { if (!STEPS[st.i].swhand) STEPS[st.i].swhand = [0, 0]; BoxEdit.tag(hand, STEPS[st.i].swhand); hand._base = true; hand._fg = 'swhand'; hand.style.pointerEvents = 'auto'; }
      main.appendChild(hand);
      let x0 = null, off = 0;
      const set = (v, anim) => { off = v; row.style.transition = anim ? 'transform .25s ease' : 'none'; row.style.transform = 'translateX(' + (-v) + 'px)'; };
      z.addEventListener('pointerdown', (e) => { x0 = e.clientX; z.setPointerCapture(e.pointerId); });
      z.addEventListener('pointermove', (e) => {
        if (x0 === null) return;
        const v = Math.max(0, Math.min(MAXO, (x0 - e.clientX) / (sr.width / 540)));
        set(v);
        if (v >= MAXO) { x0 = null; playClick(); setTimeout(advance, 120); }
      });
      const rel = () => { if (x0 === null) return; x0 = null; if (off >= MAXO * 0.5) { set(MAXO, true); playClick(); setTimeout(advance, 280); } else set(0, true); };
      z.addEventListener('pointerup', rel);
      z.addEventListener('pointercancel', rel);
    }

    nextBtn.addEventListener('click', () => {
      if (st.vdone) { show($('p09End'), true); return; }
      advance();
    });
    $('p09InfoOk').addEventListener('click', () => { $('p09Info').classList.add('is-off'); advance(); });
    window.addEventListener('resize', fit);

    BoxEdit.init({
      setup: () => { const m = location.search.match(/[?&]place=([a-z]+)/); applyPlace(PLACES[(m && m[1]) || 'library'] || PLACES.library); },
      name: (el) => (el.classList.contains('js-point-finger') ? '손가락 finger: ' : el.classList.contains('p09-swhand') ? '밀기 손 swhand: ' : '박스 '),
      apply: (el) => el.classList.contains('p09-swhand') ? (el.style.marginLeft = el._ref[0] + 'px', el.style.marginTop = el._ref[1] + 'px') : el.classList.contains('js-point-finger')
        ? (el.style.left = parseFloat(el.style.left) + el._ref[0] - el._last[0] + 'px', el.style.top = parseFloat(el.style.top) + el._ref[1] - el._last[1] + 'px', el._last = el._ref.slice())
        : place(el, el._ref),
      unit: 1,
      step: { count: STEPS.length, get: () => st.i, set: (n) => { st.i = n; }, go,
        label: (n) => '단계 ' + n + ' / ' + (STEPS.length - 1) + ' (' + (STEPS[n].scr || (STEPS[n].home ? 'home' : '—')) + ')' }
    });
    const startStep = () => { const m = location.search.match(/[?&]step=([0-9]+)/); return m ? parseInt(m[1], 10) : st.i; };
    Promise.all(['300', '400', '500', '600', '700', '800'].map((w) => document.fonts.load(w + ' 16px Pretendard', '가A1'))).then(() => { fit(); render(); }, () => { fit(); render(); });
  })();
  </script>
