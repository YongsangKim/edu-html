<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 이모티콘 문장 만들기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 반영 - 디자인/사회4차시 11p-1. 프롬프트 문장이 타이핑되고, 조이스틱 레버를 내리면 왼쪽 화면에서 스피너가 돈 뒤 이모티콘(샘플 조각 img/gen_boy.png)이 나타나고
           그제서야 '다음' 버튼이 나타남(페이지 이동은 없음 — page12는 다음 버튼으로만 이동) */
        .p11-machine{position:absolute;left:185px;top:87px;width:1550px;height:826px;box-sizing:border-box;background:linear-gradient(#faf8ff 0,#fff 14%,#fff 36%,#e9eaf2 58%,#d5d7ea 82%,#e4e1f4 100%);border:solid 28px #2a6bd0;border-radius:120px;box-shadow:0 14px 0 0 rgba(63,111,181,.25)}
        .p11-machine .next-btn.card-btn.is-start{right:100px;bottom:-9px;z-index:10}
        .p11-title{position:absolute;left:50%;top:-70px;width:880px;height:120px;margin:0 0 0 -440px;box-sizing:border-box;padding-top:8px;display:flex;align-items:center;justify-content:center;background:var(--c-white);border:solid 15px #2a6bd0;border-radius:60px;box-shadow:0 15px 0 0 #e0e7fb;font-family:'Cafe24 Ssurround';font-size:70px;color:#053c85;letter-spacing:-0.05em;gap:10px}
        .p11-title span{color:#266cc8}
        .p11-prompt{position:absolute;left:50px;top:95px;width:1394px;height:146px;box-sizing:border-box;padding:0 46px;display:flex;align-items:center;background:#1c1840;border: solid 12px #eef0ff;box-shadow: 0 0 0px 2px #8f96cc;border-radius:30px;font-family:'Cafe24 Ssurround';font-size:60px;color:#e9f6ff;letter-spacing:-0.05em;white-space:nowrap}
        .p11-prompt b{font-weight:normal;color:#8fb5e6}
        .p11-caret{display:inline-block;width:5px;height:60px;margin-left:6px;background:#8fb5e6;vertical-align:-8px;animation:p11-blink 1s steps(1,end) infinite}
        @keyframes p11-blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
        .p11-result{position:absolute;left:50px;top:272px;width:887px;height:455px;box-sizing:border-box;background:#1c1840;border-radius:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 0 #fff}
        .p11-result-hint{margin:0;padding:0 30px;font-family:'Pretendard';font-size:40px;color:#8d97a6;text-align:center}
        /* 로딩: 16개 막대가 원으로 늘어서 파랑→보라로 이어지고, 하나씩 밝아지며 도는 효과 */
        .p11-spinner{position:relative;width:260px;height:260px}
        .p11-spinner i{position:absolute;left:50%;top:50%;width:20px;height:52px;margin:-130px 0 0 -10px;border-radius:10px;transform-origin:50% 130px;animation:p11-fade 1.2s linear infinite}
        @keyframes p11-fade{0%{opacity:1}100%{opacity:.22}}
        .p11-gen{display:block;width:440px;height:440px;object-fit:contain}
        .p11-console{position:absolute;left:959px;top:272px;width:485px;height:455px;box-sizing:border-box;background:#c7d6f2;border-radius:20px;box-shadow:0 6px 0 0 #fff,inset -30px -30px 15px rgba(140,168,224,.30)}
        /* 콘솔 왼쪽 위의 세로 줄 3개(box-shadow로 31px씩 복제) */
        .p11-console:before{content:'';position:absolute;left:73px;top:13px;width:12px;height:46px;border-radius:7px;background:#4a6286;box-shadow:31px 0 0 #4a6286,62px 0 0 #4a6286}
        .p11-console:after{content:'';position:absolute;left:38px;bottom:-70px;width:384px;height:103px;background:linear-gradient(#0a2a73,#0a2a73) right 20px top 14px/16px 64px no-repeat,linear-gradient(#0a2a73,#0a2a73) right 51px top 14px/16px 64px no-repeat,linear-gradient(#0a2a73,#0a2a73) right 82px top 14px/16px 64px no-repeat,#2a6bd0;border:solid 11px #1b4fae;border-radius:36px}

        /* 조이스틱: 레버를 클릭(또는 아래로 드래그)하면 아래로 내려가는 효과 */
        .p11-joystick{touch-action:none;position:absolute;left:0;top:0;width:485px;height:455px;background:none;border:0;padding:0;cursor:pointer;z-index:2}
        .p11-joystick.is-used{cursor:default}
        .p11-joystick-base{position:absolute;left:128px;top:155px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#46486f 0 24%,transparent 21.4%),radial-gradient(circle at 50% 41%,#3d4066 0 44%,transparent 44.4%),linear-gradient(#383b5c,#2f3252);border:solid 30px #1c1840;box-shadow:0 0 0 15px #c7d6f2,0 0 0 17px #98a6dc}
        .p11-joystick-stick{position:absolute;left:222px;top:43px;width:34px;height:210px;background:linear-gradient(90deg,#c7d6f2 0 70%,#9db6e6 70%);border-radius:17px;box-shadow:inset 0 16px 0 rgba(110,135,205,.3),inset 0 -16px 0 rgba(110,135,205,.3);transition:top .4s ease,height .4s ease}
        /* 기둥이 꽂히는 자리의 작은 어두운 원 */
        .p11-joystick-base:before{content:'';position:absolute;left:52%;top:35%;width:42px;height:42px;margin:-23px 0 0 -23px;border-radius:50%;background:#1c1840}
        .p11-joystick-knob{position:absolute;left:160px;top:-22px;width:160px;height:160px;background:#fd9709;border-radius:50%;box-shadow:inset -17px -17px 0 #f08c21;transition:top .4s ease}
        /* 공 왼쪽 위의 작은 하이라이트 원 */
        .p11-joystick-knob:before{content:'';position:absolute;left:24%;top:24%;width:20%;height:20%;border-radius:50%;background:#fedfab}
        .p11-joystick.is-pulled .p11-joystick-knob{top:276px}
        .p11-joystick.is-pulled .p11-joystick-stick{top:226px;height:130px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">

          <div class="p11-machine">
            <p class="p11-title"><span>AI</span> 이모티콘 생성기</p>
            <div class="p11-prompt"><span id="p11Text"></span><span class="p11-caret"></span></div>

            <div class="p11-result" id="p11Result">
              <p class="p11-result-hint" id="p11ResultHint" style="visibility:hidden">레버를 내리면 이모티콘이 생성돼요</p>
            </div>

            <div class="p11-console">
              <button type="button" class="p11-joystick" id="p11Joystick" aria-label="조이스틱 레버 내리기">
                <span class="p11-joystick-base"></span>
                <span class="p11-joystick-stick"></span>
                <span class="p11-joystick-knob"></span>

                <!-- 손가락이 레버를 누른 채 아래로 드래그하는 모션(기능 N): 글자가 다 나온 뒤 시작해 2번 반복 후 사라짐 -->
                <div class="swipe-guide" style="display:none;position:absolute;left:0;top:0;width:485px;height:455px;pointer-events:none;z-index:20">
                  <img id="p11Finger" src="../../img/common/img_finger01.png" alt=""
                       style="position:absolute;left:215px;top:20px;"
                       data-start-left="215" data-start-top="20"
                       data-end-left="215" data-end-top="300"
                       data-repeat="2">
                </div>
              </button>
            </div>
            <a href="page10.html" class="js-nav-effect card-btn is-start next-btn is-off js-sfx" data-sound="sound/click.mp3">다음</a>
          </div>

          
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="AI 이모티콘 문장 만들기" data-next="page10.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  /* 기획서 29p. 프롬프트 문장을 한 글자씩 타이핑한 뒤 조이스틱 클릭을 기다림 */
  (function () {
    const PROMPT = '고마운 마음을 담은 웃는 얼굴 <b>이모티콘</b>을 만들어 줘.';
    const textEl = document.getElementById('p11Text');
    const joystick = document.getElementById('p11Joystick');
    const result = document.getElementById('p11Result');
    const resultHint = document.getElementById('p11ResultHint');
    const nextBtn = document.querySelector('.next-btn');

    let i = 0;
    let typer;
    const startTyping = () => { typer = setInterval(type, 70); };
    function type() {
      i += 1;
      // 태그(<b>…</b>)는 글자 사이에 끼어 보이지 않게 한 번에 통째로 넘김
      if (PROMPT.charAt(i - 1) === '<') i = PROMPT.indexOf('>', i) + 1;
      textEl.innerHTML = PROMPT.slice(0, i);
      if (i >= PROMPT.length) {
        clearInterval(typer);
        // 글자가 다 나온 뒤에 아래 안내 문구와 손가락 안내가 나옴
        if (pulled) return;
        resultHint.style.visibility = '';
        const guide = document.querySelector('.swipe-guide');
        guide.style.display = '';
        $('p11Finger').classList.add('swipe-guide-finger');
        initSwipeGuide();
      }
    }
    // 페이지가 다 보인 뒤에 타이핑 시작
    pageShown.then(() => setTimeout(startTyping, 400));

    let dragY = null;
    // 끌어서 내릴 때는 손가락을 뗄 때(pointerup)에 소리를 냄: 모바일 브라우저는 손가락을 떼는 순간부터 소리를 허용해서, 끄는 도중(pointermove)에 내면 새로고침 직후 소리가 막힘
    let soundOnUp = false;
    joystick.addEventListener('pointerdown', (e) => { if (pulled) return; dragY = e.clientY; joystick.setPointerCapture(e.pointerId); });
    joystick.addEventListener('pointermove', (e) => {
      if (dragY === null) return;
      const scale = joystick.getBoundingClientRect().height / joystick.offsetHeight || 1;
      if ((e.clientY - dragY) / scale > 40) { dragY = null; soundOnUp = true; joystick.click(); }
    });
    joystick.addEventListener('pointerup', () => { dragY = null; if (soundOnUp) { soundOnUp = false; playDrag(); } });
    joystick.addEventListener('pointercancel', () => { dragY = null; });

    let pulled = false;
    joystick.addEventListener('click', (e) => {
      if (pulled) return;
      pulled = true;
      joystick.classList.add('is-used');
      joystick.classList.add('is-pulled');
      if (e.isTrusted) playDrag();
      document.querySelectorAll('.swipe-guide').forEach((el) => { el.style.display = 'none'; });

      // 레버를 내리면 생성 영역에 스피너가 돌다가, 잠시 뒤 이모티콘 결과로 바뀌고
      // 그제서야 '다음' 버튼이 나타남(자동 이동은 하지 않음)
      resultHint.remove();
      const spinner = document.createElement('div');
      spinner.className = 'p11-spinner';
      for (let k = 0; k < 16; k++) {
        const t = document.createElement('i');
        t.style.transform = 'rotate(' + k * 22.5 + 'deg)';
        t.style.background = 'hsl(' + (205 + k * 5) + ',90%,' + (66 - k * 1.1) + '%)';
        t.style.animationDelay = (-1.2 + k * 0.075) + 's';
        spinner.appendChild(t);
      }
      result.appendChild(spinner);

      setTimeout(() => {
        spinner.remove();
        joystick.classList.remove('is-pulled');
        const gen = document.createElement('img');
        gen.className = 'p11-gen';
        gen.src = 'img/gen_boy.png';
        gen.alt = '';
        result.appendChild(gen);
        try { sessionStorage.setItem('sa04_emoji', '😊'); } catch (e) {}
        nextBtn.classList.remove('is-off');
      }, 1800);
    });
  })();
  </script>
</body>
</html>
