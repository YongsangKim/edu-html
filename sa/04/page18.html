<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 마음 이모티콘 제작소</title>
    <link rel="stylesheet" href="../../css/common.css">
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-sky">

          <div class="guide-character"><img src="img/p_character_main.png" alt="메인 캐릭터"></div>

          <div class="chatapp">
            <div class="chatapp-body"></div>
            <div class="chatapp-input">
              <span class="chatapp-input-field">메시지를 입력해요</span>
              <button type="button" class="chatapp-icon-btn is-dim" aria-label="이모티콘">&#128512;</button>
              <button type="button" class="chatapp-icon-btn is-dim" aria-label="보내기">&#10148;</button>
            </div>
          </div>

          <div class="step-flow">

            <div class="step-panel">
              <p class="guide-bubble">이렇게 이모티콘을 사용하면<br>자신의 마음을 더 분명하게<br>전달할 수 있어요.</p>
              <a href="page19.html" class="js-nav-effect next-btn">
                <img src="../../img/common/btn_next_content.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_next_content_on.png" data-src-over="../../img/common/btn_next_content_over.png" data-sound="sound/click.mp3" alt="다음">
              </a>
            </div>

            <div class="step-panel is-hidden">
              <p class="guide-bubble">내가 사용한 이모티콘도<br>한 번에 모아보는 것도 가능해요.<br>함께 확인해볼까요?</p>
              <a href="page19.html" class="js-nav-effect next-btn">
                <img src="../../img/common/btn_next_content.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_next_content_on.png" data-src-over="../../img/common/btn_next_content_over.png" data-sound="sound/click.mp3" alt="다음">
              </a>
            </div>

          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="나의 마음 이모티콘 제작소" data-next="page19.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
