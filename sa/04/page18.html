<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 마음 이모티콘 제작소</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        .cf-phone .cf-chat{height:352px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">

          <p class="guide-bubble" id="p18Guide">이렇게 이모티콘을 사용하면<br>자신의 마음을 더 분명하게<br>전달할 수 있어요.</p>
          <div class="guide-character"><img src="../img/sa_wink_open.png" alt="메인 캐릭터"></div>

          <div class="phone-frame is-thin has-cam cf-phone"><div class="phone-screen" id="cfScreen">
            <div class="phone-status is-dark"></div>
            <div class="cf-head"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span class="nm"></span><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></div>
            <div class="cf-chat is-tall"></div>
            <div class="cf-input is-bottom"></div>
            <div class="phone-nav is-dark"></div>
          </div></div>

          <a href="javascript:;" class="card-btn is-start next-btn js-sfx" id="p18Next" data-sound="sound/click.mp3">다음</a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="나의 마음 이모티콘 제작소" data-next="page19.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
  <script>document.querySelectorAll('.cf-input').forEach((e) => { e.innerHTML = cfUI.bar(false); });</script>
  <script>
  /* 디자인/사회4차시 14p-7. 안내 두 단계 뒤 page19(이모티콘 수첩) */
  (function () {
    const guide = document.getElementById('p18Guide');
    const next = document.getElementById('p18Next');
    let step = 0;
    next.addEventListener('click', () => {
      next.classList.add('is-selected');
      if (step === 0) {
        step = 1;
        setTimeout(() => {
          next.classList.remove('is-selected');
          guide.innerHTML = '내가 사용한 이모티콘도<br>한 번에 모아보는 것도 가능해요.<br>함께 확인해볼까요?';
        }, 300);
      } else {
        setTimeout(() => navigateTo('page19.html'), 300);
      }
    });
  })();
  </script>
</body>
</html>
