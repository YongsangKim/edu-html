<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 마음 이모티콘 제작소</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 와이어프레임. 기획서 47~49p. page14~17은 상황만 다른 같은 구조라
           생김새는 공용 .chatapp-* , 진행은 공용 initEmotionChatFlow */
        main{position:absolute;left:0;top:120px;width:1920px;height:960px;background:#dbe9f7}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main>

          <p class="guide-bubble" id="chatappGuide"></p>
          <div class="guide-character"><img src="img/p_character_main.png" alt="메인 캐릭터"></div>

          <div class="chatapp">
            <div class="chatapp-body" id="chatappChat"></div>
            <div class="chatapp-input">
              <span class="chatapp-input-field">메시지를 입력해요</span>
              <button type="button" class="chatapp-icon-btn is-dim js-sfx" id="chatappEmojiBtn" data-sound="sound/click.mp3" aria-label="이모티콘">&#128512;</button>
              <button type="button" class="chatapp-icon-btn is-dim js-sfx" id="chatappSendBtn" data-sound="sound/click.mp3" aria-label="보내기">&#10148;</button>
            </div>

            <div class="chatapp-picker is-off" id="chatappPicker">
              <div class="chatapp-picker-bar">
                <span class="chatapp-picker-input" id="chatappPickerInput">감정 키워드를 검색해요</span>
                <button type="button" class="chatapp-icon-btn js-sfx" id="chatappSearchBtn" data-sound="sound/click.mp3" aria-label="검색">&#128269;</button>
              </div>
              <div class="chatapp-candidates is-off" id="chatappCandidates"></div>
            </div>
          </div>

          <div class="emotion-picker" id="chatappEmotions"></div>
          <button type="button" class="card-btn chatapp-keyword-btn is-off js-sfx" data-sound="sound/click.mp3"></button>

          <a href="javascript:;" class="next-btn is-off js-sfx" id="chatappNext" data-sound="sound/click.mp3">
            <img src="../../img/common/btn_next_content.png" class="js-img-swap" data-src-alt="../../img/common/btn_next_content_on.png" data-src-over="../../img/common/btn_next_content_over.png" alt="다음">
          </a>

          <div class="avatar-modal is-off" id="chatappPopup">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <p class="avatar-popup-text" id="chatappPopupText"></p>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="나의 마음 이모티콘 제작소" data-next="page18.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  /* 기획서 47~49p (상황 4: 태우 / 슬픔) — 마지막 상황이지만 49p도 모달이 아니라
     다른 상황들과 같은 안내문구+다음버튼 화면이라 별도 모달 없이 처리 */
  initEmotionChatFlow({
    data: {
      friend: '태우',
      friendMsg: '다음 달에 다른 학교로 전학 가게 됐어.<br>이제 자주 못 볼 것 같아…',
      emotions: ['감사', '미안', '축하', '슬픔'],
      correctEmotion: '슬픔',
      wrongEmotion: '친구의 메시지를 다시 한 번 읽어봐요.',
      myMsg: '너와 친구가 되어서 즐거웠는데<br>정말 슬프고 아쉽다…<br>전학 가서도 잘 지내야 해!',
      keyword: '슬퍼',
      pickGuide: '슬픈 마음을 담은 이모티콘을 찾았어요!<br>나의 마음에 드는 이모티콘을 선택해요.',
      candidates: ['&#128546;', '&#129394;']
    },
    nextHref: 'page18.html'
  });
  </script>
</body>
</html>
