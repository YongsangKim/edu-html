<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마음 톡톡! 감정 찾기 게임</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 와이어프레임. 기획서 11p(배지 획득 마무리):
           큰 패널 위에 리본 제목, 패널 안 왼쪽 캐릭터 / 오른쪽 설명+다음 버튼.
           캐릭터는 차시 공용 이미지(img/p_character_main.png) —
           "가슴에 배지" 버전은 아직 없어서 기본 캐릭터로 대체 */
        .p03-panel{position:absolute;left:264px;top:118px;width:1392px;height:720px;background:var(--c-cream);border:solid 6px var(--c-ink);border-radius:48px;box-shadow:0 12px 0 0 var(--c-sky-pale);box-sizing:border-box}
        .p03-ribbon{position:absolute;left:50%;top:56px;width:870px;height:130px;transform:translateX(-50%);z-index:1;margin:0;
          display:flex;align-items:center;justify-content:center;background:var(--c-navy);
          clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%,5% 50%);
          font-family:'Cafe24 Ssurround';font-size:56px;color:var(--c-white);letter-spacing:-0.04em}
        .p03-character{position:absolute;left:65px;top:105px;width:482px;height:581px;display:flex;align-items:center;justify-content:center}
        .p03-character img{max-width:100%;max-height:100%;object-fit:contain}
        .p03-side{position:absolute;left:570px;top:140px;width:750px;height:500px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:60px}
        .p03-next img{display:block}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">

          <p class="p03-ribbon">마음 표현 준비 완료 배지 획득!</p>

          <div class="p03-panel">
            <div class="p03-character"><img src="img/p_character_main.png" alt="가슴에 배지 달고 있는 메인 캐릭터"></div>
            <div class="p03-side">
              <p class="desc">친구의 말과 상황을 살펴보면<br>마음을 더 잘 이해할 수 있어요.</p>
              <a href="page04.html" class="js-nav-effect p03-next">
                <img src="../../img/common/btn_next_content.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_next_content_on.png" data-src-over="../../img/common/btn_next_content_over.png" data-sound="sound/click.mp3" alt="다음">
              </a>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="마음 톡톡! 감정 찾기 게임" data-next="page04.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
