<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 마음 이모티콘 제작소</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        .cf-phone .cf-chat{height:352px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">

          <p class="guide-bubble" id="p13Guide">이렇게 이모티콘을 사용하면<br>자신의 마음을 더 분명하게<br>전달할 수 있어요.</p>
          <div class="guide-character"><img id="p13Char" src="../img/sa_wink_open.png" alt="메인 캐릭터"></div>

          <div class="phone-frame has-cam cf-phone"><div class="phone-screen" id="cfScreen">
            <div class="phone-status is-dark"></div>
            <div class="cf-head"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span class="nm"></span><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></div>
            <div class="cf-chat is-tall" id="p13Chat"></div>
            <div class="cf-input is-bottom" id="p13Input"></div>
            <div class="cf-panel" id="p13Panel" style="display:none"></div>
            <div class="phone-nav is-dark"></div>
          </div></div>

          <a href="javascript:;" class="card-btn is-start next-btn js-sfx" id="p13Next" data-sound="sound/click.mp3">다음</a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="나의 마음 이모티콘 제작소" data-next="page14.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
  <script src="../../js/box-edit.js"></script>
  <script>document.getElementById('p13Input').innerHTML = cfUI.bar(false);</script>
  <script>
  /* 디자인/사회4차시 14p-7(안내 두 단계)에 이어 19p-1~4(클릭 가이드를 따라 이모티콘 수첩 열기)를 한 페이지에서 진행. 끝나면 page20
     ?step=N 으로 단계별 보기: 1 안내 · 2 안내(내가 사용한 이모티콘) · 3 이모티콘 버튼 클릭 · 4 이모티콘 탭 클릭 · 5 이모티콘 수첩 */
  (function () {
    const screen = document.getElementById('cfScreen');
    const guide = document.getElementById('p13Guide');
    const character = document.getElementById('p13Char');
    const chat = document.getElementById('p13Chat');
    const input = document.getElementById('p13Input');
    const panel = document.getElementById('p13Panel');
    const next = document.getElementById('p13Next');
    const play = makeSfx('sound/click.mp3');
    // 상호작용에서 고른 이모티콘 중 4종만 노출
    const USED = ['stk_dog_thanks', 'stk_sad', 'stk_party', 'stk_cry', 'stk_comfort', 'stk_cheer'];
    // 눌러야 할 곳 좌표 [x, y, 폭, 높이](폰 화면 기준). ?edit 으로 열면 두 곳이 한꺼번에 보이고, 맞춘 값을 여기에 붙여 넣음
    const HOT = { open: [327, 468, 48, 48], tab: [144, 575, 84, 38, 10] };   // 5번째 값은 모서리(없으면 원)
    const radiusOf = (b) => (b[4] === undefined ? '50%' : typeof b[4] === 'number' ? b[4] + 'px' : b[4]);
    let hot = null;
    let phase = 0;

    function clearHot() {
      if (hot) { hot.remove(); hot = null; }
      clearFingers();
    }
    function setHot(name, fn) {
      clearHot();
      const [x, y, w, h] = HOT[name];
      hot = document.createElement('button');
      hot.type = 'button';
      hot.className = 'cf-hot';
      hot.style.cssText = 'left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px;border-radius:' + radiusOf(HOT[name]);
      hot.addEventListener('click', () => { play(); clearHot(); fn(); });
      screen.appendChild(hot);
      const mine = hot;
      setTimeout(() => { if (mine.isConnected) pointFingerAt(mine, { onMain: true }); }, 300);
    }
    function showNext(on) {
      next.classList.toggle('is-off', !on);
      next.classList.remove('is-selected');
    }

    function stepIntro1() {
      phase = 0;
      guide.innerHTML = '이렇게 이모티콘을 사용하면<br>자신의 마음을 더 분명하게<br>전달할 수 있어요.';
      showNext(true);
    }
    function stepIntro2() {
      phase = 1;
      guide.innerHTML = '내가 사용한 이모티콘도<br>한 번에 모아보는 것도 가능해요.<br>함께 확인해볼까요?';
      showNext(true);
    }
    function enterPhone() {
      character.src = '../img/sa_wink_point.png';
      chat.classList.remove('is-tall');
      input.classList.remove('is-bottom');
      panel.style.display = '';
      panel.style.backgroundImage = 'none';
      panel.innerHTML = cfUI.kb();
    }
    function stepOpen() {
      phase = 2;
      enterPhone();
      guide.innerHTML = '이모티콘 버튼을 클릭해요.';
      showNext(false);
      setHot('open', stepTab);
    }
    function stepTab() {
      phase = 2;
      panel.style.backgroundImage = 'none';
      panel.innerHTML = cfUI.searchSheet();
      guide.innerHTML = '이모티콘 탭을 클릭해요.';
      setHot('tab', stepBook);
    }
    function stepBook() {
      phase = 3;
      panel.innerHTML = cfUI.emojiSheet() + '<div class="cf-recent">' + USED.map((n) => '<img src="img/' + n + '.png" alt="">').join('') + '</div>';
      guide.innerHTML = '최근 사용한 이모티콘을<br>한 번에 모아볼 수 있는<br>나만의 이모티콘 수첩이에요!';
      showNext(true);
    }

    next.addEventListener('click', () => {
      next.classList.add('is-selected');
      if (phase === 0) setTimeout(stepIntro2, 300);
      else if (phase === 1) setTimeout(stepOpen, 300);
      else if (phase === 3) setTimeout(() => navigateTo('page14.html'), 300);
    });

    if (BoxEdit.on) {
      enterPhone();
      panel.style.backgroundImage = 'none';
      panel.innerHTML = cfUI.searchSheet();
      showNext(false);
      const NAME = { open: '이모티콘 버튼', tab: '이모티콘 탭' };
      const place = (el) => { const b = el._ref; el.style.left = b[0] + 'px'; el.style.top = b[1] + 'px'; el.style.width = b[2] + 'px'; el.style.height = b[3] + 'px'; el.style.borderRadius = radiusOf(b); };
      Object.keys(HOT).forEach((k) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'cf-hot';
        b.dataset.name = NAME[k];
        b.style.animation = 'none';
        BoxEdit.tag(b, HOT[k]);
        place(b);
        screen.appendChild(b);
      });
      BoxEdit.init({ name: (el) => '[' + el.dataset.name + '] ', apply: place });
      guide.textContent = '좌표 수정 모드 — 버튼을 클릭해 방향키로 맞춰요(Shift 10px, Alt+방향키 크기)';
      return;
    }

    const STEPS = [stepIntro1, () => { stepIntro2(); }, stepOpen, () => { enterPhone(); stepTab(); }, () => { enterPhone(); stepBook(); }];
    const want = parseInt(new URLSearchParams(location.search).get('step'), 10);
    (STEPS[want - 1] || stepIntro1)();
  })();
  </script>
</body>
</html>
