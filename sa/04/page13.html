<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 마음 이모티콘 제작소</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        .cf-phone .cf-chat{height:352px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">

          <div class="guide-set is-wink-open" id="p13Set">
            <p class="guide-bubble is-center" id="p13Guide"></p>
            <div class="guide-character"><img id="p13Char" src="../img/character/sa_wink_open.png" alt="메인 캐릭터"></div>
          </div>

          <div class="phone-frame has-cam cf-phone"><div class="phone-screen" id="cfScreen">
            <div class="phone-status is-dark"></div>
            <div class="cf-head"><i data-ic="back"></i><span class="nm"></span><i data-ic="search"></i><i data-ic="phone"></i><i data-ic="menu"></i></div>
            <div class="cf-chat is-tall" id="p13Chat"></div>
            <div class="cf-input is-bottom" id="p13Input"></div>
            <div class="cf-panel" id="p13Panel" style="display:none"></div>
            <div class="phone-nav is-dark"></div>
          </div></div>

          <a href="javascript:;" class="card-btn is-start next-btn js-sfx" id="p13Next" data-sound="sound/click.mp3">다음</a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="나의 마음 이모티콘 제작소" data-next="page14.html"></script>
  <script src="../../resources/js/toc.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script src="../../resources/js/box-edit.js"></script>
  <script>document.getElementById('p13Input').innerHTML = cfUI.bar(false);</script>
  <script>
  /* 디자인/사회4차시 14p-7(안내 두 단계)에 이어 19p-1~4(클릭 가이드를 따라 이모티콘 수첩 열기)를 한 페이지에서 진행. 끝나면 page20
     ?step=N 으로 단계별 보기: 1 안내 · 2 안내(내가 사용한 이모티콘) · 3 이모티콘 버튼 클릭 · 4 이모티콘 탭 클릭 · 5 이모티콘 수첩 */
  (function () {
    const screen = document.getElementById('cfScreen');
    const guide = document.getElementById('p13Guide');
    const character = document.getElementById('p13Char');
    const chat = document.getElementById('p13Chat');
    const input = document.getElementById('p13Input');
    const panel = document.getElementById('p13Panel');
    const next = document.getElementById('p13Next');
    const say = initGuideSay({ bubble: guide, img: character, set: document.getElementById('p13Set') });
    // 단계별 말풍선 문구와 캐릭터 포즈 한 곳. 포즈 이름은 ?edit 오른쪽 아래 포즈판에서 눌러 보고 pose: 뒤에 옮겨 적음
    const SAYS = {
      intro1: { pose: 'wink_open', bubble: '이렇게 이모티콘을 사용하면<br>자신의 마음을 더 분명하게<br>전달할 수 있어요.' },
      intro2: { pose: 'main', bubble: '내가 사용한 이모티콘도<br>한 번에 모아보는 것도 가능해요.<br>함께 확인해볼까요?' },
      open: { pose: 'wink_point2', bubble: '이모티콘 버튼을 클릭해요.' },
      tab: { pose: 'wink_point3', bubble: '이모티콘 탭을 클릭해요.' },
      book: { pose: 'wink_present', bubble: '최근 사용한 이모티콘을<br>한 번에 모아볼 수 있는<br>나만의 이모티콘 수첩이에요!' }
    };
    const sayStep = (k) => say(SAYS[k].bubble, SAYS[k].pose);
    const play = makeSfx('sound/click.mp3');
    // 상호작용에서 고른 이모티콘 중 4종만 노출
    const USED = ['stk_dog_thanks', 'stk_sad', 'stk_party', 'stk_cry', 'stk_comfort', 'stk_cheer'];
    // 눌러야 할 곳 = 폰 화면 안의 실제 요소: 이름 → [CSS 선택자, 글자(앞부분)]
    const TARGET = { open: ['#cfScreen .cf-bar .cf-smile'], tab: ['#cfScreen .cf-tabs span', '이모티콘'] };
    // 클릭 영역 보정 [dx, dy, dw, dh] — 버튼 모양은 그대로, 눌리는 범위만 옮기거나 키움/줄임(?edit 로 맞춘 뒤 표시줄 값을 옮겨 적음)
    const HOT = { open: [-6, -5, 10, 10], tab: [-7.3, -3, 10.3, 6] };
    // 손가락 위치 보정 [dx, dy] — 눌러야 할 곳별. ?edit 로 손가락을 눌러 맞춘 뒤 표시줄 값을 옮겨 적음
    const FG = { open: [4, 5], tab: [3, 3] };
    let fgKey = '?';
    let hot = null;
    let hotFn = null;
    let phase = 0;
    let cur = 1;

    function clearHot() {
      if (hot) {
        hot.removeEventListener('click', hotFn);
        hot.classList.remove('hit-pulse');
        hot.removeAttribute('data-hit');
        hot.querySelectorAll(':scope > hit-pad').forEach((p) => p.remove());
        hot = null;
      }
      clearFingers();
    }
    function setHot(name, fn) {
      clearHot();
      const t = TARGET[name];
      hot = Array.from(screen.querySelectorAll(t[0])).filter((e) => !t[1] || e.textContent.trim().indexOf(t[1]) === 0)[0];
      hot.dataset.hit = name;
      hot.classList.add('hit-pulse');
      BoxEdit.padEl(hot, name, HOT);
      hotFn = () => { if (BoxEdit.on) return; play(); clearHot(); fn(); };
      hot.addEventListener('click', hotFn);
      const mine = hot;
      fgKey = name;
      setTimeout(() => { if (mine.isConnected) pointFingerAt(mine, { onMain: true, dx: FG[name][0], dy: FG[name][1] }); }, 300);
    }
    function showNext(on) {
      next.classList.toggle('is-off', !on);
      next.classList.remove('is-selected');
    }

    function leavePhone() {
      chat.classList.add('is-tall');
      input.classList.add('is-bottom');
      panel.style.display = 'none';
    }
    function stepIntro1() {
      phase = 0;
      leavePhone();
      sayStep('intro1');
      showNext(true);
    }
    function stepIntro2() {
      phase = 1;
      leavePhone();
      sayStep('intro2');
      showNext(true);
    }
    function enterPhone() {
      chat.classList.remove('is-tall');
      input.classList.remove('is-bottom');
      panel.style.display = '';
      panel.style.backgroundImage = 'none';
      panel.innerHTML = cfUI.kb();
    }
    function stepOpen() {
      phase = 2;
      enterPhone();
      sayStep('open');
      showNext(false);
      setHot('open', stepTab);
    }
    function stepTab() {
      phase = 2;
      panel.style.backgroundImage = 'none';
      panel.innerHTML = cfUI.searchSheet();
      sayStep('tab');
      setHot('tab', stepBook);
    }
    function stepBook() {
      phase = 3;
      panel.innerHTML = cfUI.emojiSheet() + '<div class="cf-recent">' + USED.map((n) => '<img src="img/' + n + '.png" alt="">').join('') + '</div>';
      sayStep('book');
      showNext(true);
    }

    next.addEventListener('click', () => {
      next.classList.add('is-selected');
      if (phase === 0) setTimeout(stepIntro2, 300);
      else if (phase === 1) setTimeout(stepOpen, 300);
      else if (phase === 3) setTimeout(() => navigateTo('page14.html'), 300);
    });

    const STEPS = [stepIntro1, () => { stepIntro2(); }, stepOpen, () => { enterPhone(); stepTab(); }, () => { enterPhone(); stepBook(); }];
    const run = (n) => { clearHot(); (STEPS[n - 1] || stepIntro1)(); };
    const want = parseInt(new URLSearchParams(location.search).get('step'), 10);
    /* ?edit&step=N : 단계 N 으로 바로 열기(] [ 로 이동). 손가락(FG)·클릭 영역(HOT = [x, y, 폭, 높이(, 모서리])을 클릭해 방향키로 조정, 오른쪽 아래 포즈판에서 포즈를 골라 say(문구, 포즈) 에 옮겨 적음 (_guide/steps.html 기준) */
    if (BoxEdit.on) {
      cur = want >= 1 && want <= STEPS.length ? want : 1;
      BoxEdit.stepEdit({
        key: () => fgKey, count: STEPS.length + 1, get: () => cur, set: (n) => { cur = n; }, go: (n) => { if (n < 1) return; cur = n; BoxEdit.syncStep(n); run(n); }, label: (n) => '단계 ' + n + ' / ' + STEPS.length,
        say, bubble: guide, img: character
      });
    }
    run(BoxEdit.on ? cur : (want >= 1 && want <= STEPS.length ? want : 1));
  })();
  </script>
</body>
</html>
