<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마음 배달 이모티콘 게임</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 반영 - 디자인/사회4차시 22p-1. 위 게이지(별) / 파란 채팅 패널(안에 STAGE 알약 + 친구 메시지 줄) / 아래 파란 선택지 판(카드 3~4개).
           이모티콘 문제의 카드는 스티커 샘플 조각(img/stk_*.png) + 이름 */
        .p16-gauge{left:315px;top:26px;width:1290px}
        .p16-panel{left:140px;top:120px;width:1640px;height:476px;border-radius:100px;border-width:28px}
        .p16-title{position:absolute;left:50%;top:12px;margin:0;transform:translateX(-50%);z-index:4}
        .p16-panel .chat-panel-bar{flex:0 0 114px;padding:0}
        .p16-panel .chat-panel-body{padding:50px 54px 0;background:none}
        .p16-panel .chat-row{height:206px;gap:44px;padding:0 40px 0 10px;font-size:50px;line-height:1.35;white-space:normal}
        .p16-panel .chat-row .face{width:190px;height:190px;background:var(--c-sky) center / cover no-repeat}
        .p16-panel .chat-row .txt{white-space:normal;overflow:visible}
        .p16-opts{left:158px;top:612px;width:1604px;height:320px;padding:34px 62px 0;display:flex;gap:46px;border-radius:100px}
        .p16-opts .card-btn{flex:1 1 0;min-width:0;height:210px;letter-spacing:-0.04em}
        .p16-opts.is-word .card-btn{font-size:78px}
        .p16-opts.is-msg{flex-wrap:wrap;padding-top:18px;gap:6px 30px}
        .p16-opts.is-msg .card-btn{flex:1 1 calc(50% - 15px);height:116px;padding:10px 30px 4px;font-size:40px;line-height:1.15;display:flex;align-items:center;justify-content:center}
        .p16-opts.is-emoji .card-btn{height:236px;padding:6px 10px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:60px;line-height:1}
        .p16-opts.is-emoji .card-btn img{display:block;height:135px;width:auto;max-width:90%;object-fit:contain}
        .p16-opts.is-emoji .card-btn small{font-size:52px}
        .p16-opts .card-btn.is-wrong{animation:fix-word-shake .3s ease}

        .p16-clear{position:absolute;left:0;top:0;width:1920px;height:960px;z-index:120;background:rgba(27,23,56,.55);display:flex;align-items:center;justify-content:center}
        .p16-clear b{display:block;min-width:1090px;height:262px;box-sizing:border-box;padding-top:12px;display:flex;align-items:center;justify-content:center;background:#8556dc;border:solid 10px #e6dcff;border-radius:131px;font-family:'Cafe24 Ssurround';font-size:110px;font-weight:normal;color:var(--c-white);letter-spacing:-0.03em}
        .p16-clear.is-off{display:none}
        .chat-panel-bar:after{top:160px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="quiz-stage">

          <div class="gauge is-thin p16-gauge"><div class="gauge-fill" id="p16GaugeFill"></div></div>

          <div class="chat-panel p16-panel">
            <p class="ask-pill has-stage is-fit p16-title"><i>STAGE&nbsp;<span id="p16StageNum">1</span></i><span id="p16Ask"></span></p>
            <div class="chat-panel-bar"></div>
            <div class="chat-panel-body">
              <div class="chat-row"><span class="face" id="p16Avatar"></span><span class="txt" id="p16Text"></span></div>
            </div>
          </div>

          <div class="opt-panel p16-opts opts" id="p16Opts"></div>

          <div class="avatar-modal is-wrong is-off" id="p16Popup">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text is-small" id="p16PopupText"></p>
              </div>
            </div>
          </div>
          <div class="p16-clear is-off" id="p16Clear"></div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="마음 배달 이모티콘 게임" data-next="page17.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  /* 기획서 59~71p. 한 스테이지에 감정/메시지/이모티콘 3문제, 총 9문제.
     문제를 하나 맞힐 때마다 게이지가 11.1%씩 차고 마지막에 100%가 됨.
     스테이지를 끝내면 STAGE CLEAR 화면이 2초 뜬 뒤 다음 스테이지로 자동 진행.

     주의: 기획서 66p는 STAGE2(축하 상황)의 이모티콘 정답도 '위로 이모티콘'으로
     적혀 있는데, 상황과 맞지 않아 앞 슬라이드에서 복사된 오기로 보고 여기서는
     '축하 이모티콘'을 정답으로 뒀다. 기획서대로 되돌릴지는 확인 필요 */
  (function () {
    const WRONG_POPUP = '친구의 메시지를 다시 한 번 읽어봐요.';

    const STAGES = [
      {
        who: '민준', gender: 'boy',
        text: '오늘 자전거를 타다가 넘어졌어. 무릎이 아픈데,<br>보건실에 가야 할지 그냥 교실에 있어도 될지 모르겠어.',
        questions: [
          { ask: '어떤 감정을 전해야 할까요?', kind: 'word',
            options: [
              { text: '걱정', correct: true },
              { text: '화남' },
              { text: '슬픔' }
            ] },
          { ask: '좋아요! 어떤 메시지를 보낼까요?', kind: 'msg',
            options: [
              { text: '괜찮아? 많이 아프면 선생님께<br>말씀드리고 보건실에 같이 가자.', correct: true },
              { text: '괜찮아? 다음부터는 조심해서 타.' },
              { text: '빨리 나으면 좋겠어. 나중에 놀자.' },
              { text: '왜 넘어졌어? 조심 했어야지.' }
            ] },
          { ask: '완벽해요! 어떤 이모티콘을 보낼까요?', kind: 'emoji',
            options: [
              { text: '&#129303;', label: '위로 이모티콘', correct: true },
              { text: '&#127881;', label: '축하 이모티콘' },
              { text: '&#128584;', label: '사과 이모티콘' }
            ] }
        ]
      },
      {
        who: '수빈', gender: 'girl',
        text: '경시대회에서 금상을 받았어! 어제까지 긴장돼서<br>포기하고 싶었는데, 끝까지 연습한 보람이 있었어.',
        questions: [
          { ask: '어떤 감정을 전해야 할까요?', kind: 'word',
            options: [
              { text: '기쁨', correct: true },
              { text: '걱정' },
              { text: '슬픔' }
            ] },
          { ask: '좋아요! 어떤 메시지를 보낼까요?', kind: 'msg',
            options: [
              { text: '끝까지 노력해서 금상을 받았구나.<br>정말 축하해!', correct: true },
              { text: '금상 받았으니까<br>이제 연습 안 해도 되겠네.' },
              { text: '좋겠다. 나도 상 받고 싶었는데.' },
              { text: '다음에는 더 큰 상을 받아야 해.' }
            ] },
          { ask: '완벽해요! 어떤 이모티콘을 보낼까요?', kind: 'emoji',
            options: [
              { text: '&#129303;', label: '위로 이모티콘' },
              { text: '&#127881;', label: '축하 이모티콘', correct: true },
              { text: '&#128584;', label: '사과 이모티콘' }
            ] }
        ]
      },
      {
        who: '태우', gender: 'boy',
        text: '다음 달부터 다른 학교에 다니게 되었어. 쉬는 시간마다<br>같이 놀던 친구들을 자주 못 볼 것 같아.',
        questions: [
          { ask: '어떤 감정을 전해야 할까요?', kind: 'word',
            options: [
              { text: '걱정' },
              { text: '화남' },
              { text: '슬픔', correct: true }
            ] },
          { ask: '좋아요! 어떤 메시지를 보낼까요?', kind: 'msg',
            options: [
              { text: '헤어지게 되어 아쉽지만,<br>새 학교에서도 잘 지내길 바랄게.', correct: true },
              { text: '왜 전학 가?<br>나랑 안 놀려고 그러는 거야?' },
              { text: '새 학교 가니까 이제 우리 반은<br>잊어도 되겠다.' },
              { text: '전학 가면 이제 연락 하지 마.' }
            ] },
          { ask: '완벽해요! 어떤 이모티콘을 보낼까요?', kind: 'emoji',
            options: [
              { text: '&#129303;', label: '위로 이모티콘', correct: true },
              { text: '&#127881;', label: '축하 이모티콘' },
              { text: '&#128584;', label: '사과 이모티콘' }
            ] }
        ]
      }
    ];

    const FACE_ID = { '민준': 'minjun', '수빈': 'subin', '태우': 'taewoo', '지우': 'jiwoo' };
    const STK = { '위로 이모티콘': 'stk_comfort', '축하 이모티콘': 'stk_cheer', '사과 이모티콘': 'stk_sad' };
    const TOTAL_Q = STAGES.reduce((sum, s) => sum + s.questions.length, 0);

    const stageNumEl = document.getElementById('p16StageNum');
    const gaugeFill = document.getElementById('p16GaugeFill');
    const avatarEl = document.getElementById('p16Avatar');
        const textEl = document.getElementById('p16Text');
    const askEl = document.getElementById('p16Ask');
    const optsBox = document.getElementById('p16Opts');
    const popup = document.getElementById('p16Popup');
    const popupText = document.getElementById('p16PopupText');
    const clearLayer = document.getElementById('p16Clear');


    let stageIndex = 0;
    let questionIndex = 0;
    let solvedCount = 0;

    function showPopup(html) {
      popupText.innerHTML = html;
      flashLayer(popup);
    }

    function renderQuestion() {
      const stage = STAGES[stageIndex];
      const question = stage.questions[questionIndex];

      stageNumEl.textContent = String(stageIndex + 1);
      avatarEl.style.backgroundImage = 'url(img/face_' + FACE_ID[stage.who] + '.png)';
      textEl.innerHTML = stage.text;
      askEl.textContent = question.ask;

      optsBox.innerHTML = '';
      optsBox.className = 'opt-panel p16-opts opts is-' + question.kind;
      shuffleArray(question.options).forEach((opt) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'card-btn';
        btn.innerHTML = question.kind === 'emoji'
          ? '<img src="img/' + STK[opt.label] + '.png" alt=""><small>' + opt.label + '</small>'
          : opt.text;
        btn.addEventListener('click', () => {
          if (!opt.correct) {
            playWrong();
            btn.classList.remove('is-wrong');
            void btn.offsetWidth;
            btn.classList.add('is-wrong');
            showPopup(WRONG_POPUP);
            return;
          }

          playCorrect();
          btn.classList.add('is-selected');
          optsBox.querySelectorAll('.card-btn').forEach((b) => { b.disabled = true; });

          solvedCount += 1;
          // 마지막 문제는 소수점 반올림 오차 없이 딱 100%가 되게 함
          gaugeFill.style.width = (solvedCount >= TOTAL_Q ? 100 : solvedCount * (100 / TOTAL_Q)) + '%';

          setTimeout(advance, 800);
        });
        optsBox.appendChild(btn);
      });
    }

    function advance() {
      questionIndex += 1;
      if (questionIndex < STAGES[stageIndex].questions.length) {
        renderQuestion();
        return;
      }

      const isLastStage = stageIndex >= STAGES.length - 1;
      clearLayer.innerHTML = '<b>' + (isLastStage ? 'STAGE ALL CLEAR!' : 'STAGE ' + (stageIndex + 1) + ' CLEAR!') + '</b>';
      clearLayer.classList.remove('is-off');

      setTimeout(() => {
        clearLayer.classList.add('is-off');
        if (isLastStage) {
          window.location.href = 'page17.html';
          return;
        }
        stageIndex += 1;
        questionIndex = 0;
        renderQuestion();
      }, 2000);
    }

    gaugeFill.style.width = '0%';
    renderQuestion();
  })();
  </script>
</body>
</html>
