<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>감정과 표현 선택하기</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        /* 디자인 없음 - 와이어프레임. 기획서 14~23p. page06 한 페이지에서 상황 3개를 차례로 진행.
           생김새는 공용 .talk-* , 진행은 공용 initEmotionPickFlow */
        /* 기획서 23p 마무리 모달(정답 아바타): 아바타 옆에 문구(왼쪽 정렬), 그 아래 다음 버튼(오른쪽 정렬) */
        #p06Modal{z-index:120}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">

          <div class="chat-panel talk-chat" id="talkChat">
            <p class="chat-panel-bar">채팅</p>
            <div class="chat-panel-body"></div>
          </div>

          <div class="talk-right">
            <div class="opt-panel"></div>
            <p class="talk-ask" id="talkAsk"></p>
            <div class="talk-options opts" id="talkOptions"></div>
          </div>

          <div class="avatar-modal talk-popup is-off" id="talkPopup">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text is-small"></p>
              </div>
            </div>
          </div>

          <div class="avatar-modal talk-popup is-off" id="talkPopupCorrect">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_correct.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">좋아요!</p>
                <p class="avatar-popup-sub"></p>
              </div>
              <div class="avatar-popup-extra"><img src="../../resources/img/common/icon_correct.png" alt=""></div>
            </div>
          </div>

          <div class="avatar-modal is-off" id="talkPopupWarn">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text is-small" id="talkPopupWarnText"></p>
              </div>
            </div>
          </div>
          <div class="avatar-modal is-off" id="p06Modal">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_correct.png" alt=""></div>
              <div class="avatar-popup-body is-finish">
                <p class="avatar-popup-text">좋아요!</p>
                <p class="avatar-popup-sub">친구의 감정을 살펴보고 알맞은 표현을 선택했어요!</p>
                <a href="page07.html" class="js-nav-effect avatar-popup-next card-btn is-popup js-sfx" data-sound="sound/click.mp3">다음</a>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="감정과 표현 선택하기" data-next="page07.html"></script>
  <script src="../../resources/js/toc.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  /* 기획서 14~23p — 상황 3개를 한 페이지에서 차례로 진행(마지막 상황이 끝나면 마무리 모달 → page09). ?step=N 은 상황마다 2단계씩 이어 센 번호(1~6) */
  initEmotionPickFlow({
    rounds: [
      // 상황 1: 지우 / 고마움 (기획서 14~18p)
      {
        faces: { '지우': 'jiwoo', '민준': 'minjun' },
        chat: [
          { who: '지우', me: false, text: '수학 숙제 3번 문제를 계속 틀리고 있어. 내일까지 내야 하는데 아직 방법을 잘 모르겠어.' },
          { who: '민준', me: true,  text: '내가 답을 바로 알려주기 보다, 푸는 방법을 같이 생각해보자. 먼저 문제에서 구해야 하는 것을 표시해봐.' },
          { who: '지우', me: false, text: '아, 이렇게 하니까 조금 알 것 같아. 네가 쉬는 시간까지 써서 알려줘서 미안하고 고마워.' }
        ],
        steps: [
          {
            kind: 'emotion',
            ask: '지우는 어떤 감정을<br>느끼고 있을까요?',
            wrong: '친구의 마음을 다시 생각해볼까요?',
            options: [
              { text: '고마움', correct: true },
              { text: '걱정' },
              { text: '부끄러움' },
              { text: '서운함' }
            ]
          },
          {
            kind: 'message',
            ask: '맞아요! 이 상황에서는<br>고마운 마음을 표현할 수 있어요.<br>어떤 메시지를 보내 볼까요?',
            wrong: '이 말을 들으면 친구의 기분이 어떨까요?<br>따뜻한 마음을 전하는 다른 말을 찾아볼까요?',
            correct: '상황에 맞는 감정과 말을<br>선택하면 마음을 더 잘 전할 수 있어요.',
            options: [
              { text: '고마워. 네가 알려준 방법으로 다시 풀어볼게.', correct: true },
              { text: '고마워. 다음에도 답을 바로 알려줘.' },
              { text: '미안해. 네가 대신 숙제를 다 해 줘.' },
              { text: '이제 알겠어. 그런데 너무 오래 걸렸어.' }
            ]
          }
        ]
      },
      // 상황 2: 수빈 / 서운함 (기획서 19~20p)
      {
        faces: { '수빈': 'subin', '민준': 'minjun' },
        chat: [
          { who: '수빈', me: false, text: '민준아, 우리 오늘 같이 가기로 한 체험관 입장 시간이 거의 다 됐어. 나는 먼저 도착해서 기다리고 있어.' },
          { who: '민준', me: true,  text: '미안해. 갑자기 집에 일이 생겨서 아직 출발을 못 했어. 많이 늦을 것 같아.' },
          { who: '수빈', me: false, text: '괜찮아, 어쩔 수 없지. 그런데 오늘 같이 보려고 기대했는데…' }
        ],
        steps: [
          {
            kind: 'emotion',
            ask: '수빈이는 어떤 감정을<br>느끼고 있을까요?',
            wrong: '친구의 마음을 다시 생각해볼까요?',
            options: [
              { text: '슬픔' },
              { text: '걱정' },
              { text: '서운함', correct: true },
              { text: '화남' }
            ]
          },
          {
            kind: 'message',
            ask: '맞아요! 이 상황에서는<br>서운한 마음을 표현할 수 있어요.<br>어떤 메시지를 보내 볼까요?',
            wrong: '이 말을 들으면 친구의 기분이 어떨까요?<br>따뜻한 마음을 전하는 다른 말을 찾아볼까요?',
            correct: '상황에 맞는 감정과 말을<br>선택하면 마음을 더 잘 전할 수 있어요.',
            options: [
              { text: '약속을 잊은 거야? 다음에는 신경 써 줘.' },
              { text: '네가 안 와서 혼자 가니까 재미없어.' },
              { text: '기다렸는데 못 와서 아쉽지만, 괜찮아.<br>다음에는 꼭 같이 가자!', correct: true },
              { text: '먼저 들어가서 미안해, 다음부터는 늦지 마.' }
            ]
          }
        ]
      },
      // 상황 3: 지우 / 기쁨 (기획서 21~23p)
      {
        faces: { '지우': 'jiwoo', '수빈': 'subin' },
        chat: [
          { who: '지우', me: true,  text: '수빈아, 대회 결과 나왔어? 어제까지 계속 연습하던 거 생각나서 궁금했어.' },
          { who: '수빈', me: false, text: '응, 나 대상 받았어. 어제 네가 같이 연습해 준 것도 도움이 됐어.' },
          { who: '지우', me: true,  text: '정말? 네가 열심히 준비한 걸 알고 있어서 그 소식 들으니까 나도 기분이 좋아졌어.' }
        ],
        steps: [
          {
            kind: 'emotion',
            ask: '지우는 어떤 감정을<br>느끼고 있을까요?',
            wrong: '친구의 마음을 다시 생각해볼까요?',
            options: [
              { text: '속상함' },
              { text: '미안함' },
              { text: '고마움' },
              { text: '기쁨', correct: true }
            ]
          },
          {
            kind: 'message',
            ask: '맞아요! 이 상황에서는<br>기쁜 마음을 표현할 수 있어요.<br>어떤 메시지를 보내 볼까요?',
            wrong: '이 말을 들으면 친구의 기분이 어떨까요?<br>따뜻한 마음을 전하는 다른 말을 찾아볼까요?',
            options: [
              { text: '나도 도와줬으니까 상을 나눠줘.' },
              { text: '다음에는 내가 더 잘할 거야.' },
              { text: '왜 너만 상을 받았어?' },
              { text: '대상 받은 것 정말 축하해!<br>네가 열심히 한 걸 알아서 나도 기뻐.', correct: true }
            ]
          }
        ]
      }
    ],
    nextHref: 'page07.html',
    finishModal: '#p06Modal'
  });
  </script>
</body>
</html>
