<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 마음 이모티콘 제작소</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        .cf-phone .cf-chat{height:352px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">

          <p class="guide-bubble" id="p19Guide">이모티콘 버튼을 클릭해요.</p>
          <div class="guide-character"><img src="img/new/r14.png" alt="메인 캐릭터"></div>

          <div class="phone-frame is-thin has-cam cf-phone"><div class="phone-screen" id="cfScreen">
            <div class="phone-status is-dark"></div>
            <div class="cf-head"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span class="nm"></span><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></div>
            <div class="cf-chat"></div>
            <div class="cf-input" id="p19Input"></div>
            <div class="cf-panel" id="p19Panel" style="background-image:url(img/new/ph_kb.png)"></div>
            <div class="phone-nav is-dark"></div>
          </div></div>

          <a href="page20.html" class="js-nav-effect card-btn is-popup next-btn is-off js-sfx" id="p19Next" data-sound="sound/click.mp3">다음</a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="나의 마음 이모티콘 제작소" data-next="page20.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
  <script src="../../js/box-edit.js"></script>
  <script>document.getElementById('p19Input').innerHTML = cfUI.bar(false);</script>
  <script>
  /* 디자인/사회4차시 19p-1~4. 클릭 가이드를 따라 이모티콘 수첩(최근 사용)을 열어보는 화면 */
  (function () {
    const screen = document.getElementById('cfScreen');
    const guide = document.getElementById('p19Guide');
    const panel = document.getElementById('p19Panel');
    const next = document.getElementById('p19Next');
    const play = makeSfx('sound/click.mp3');
    // 상호작용에서 고른 이모티콘 중 4종만 노출
    const USED = ['stk_dog_thanks', 'stk_sad', 'stk_party', 'stk_cry', 'stk_comfort', 'stk_cheer'];
    // 눌러야 할 곳 좌표 [x, y, 폭, 높이](폰 화면 기준). ?edit 으로 열면 두 곳이 한꺼번에 보이고, 맞춘 값을 여기에 붙여 넣음
    const HOT = { open: [314, 463, 48, 48], tab: [138, 570, 84, 38, 10] };   // 5번째 값은 모서리(없으면 원)
    let hot = null;
    function setHot(name, fn) {
      const [x, y, w, h, rd] = HOT[name];
      if (hot) hot.remove();
      clearFingers();
      hot = document.createElement('button');
      hot.type = 'button';
      hot.className = 'cf-hot';
      hot.style.cssText = 'left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + h + 'px;border-radius:' + (rd === undefined ? '50%' : typeof rd === 'number' ? rd + 'px' : rd);
      hot.addEventListener('click', () => { play(); hot.remove(); hot = null; clearFingers(); fn(); });
      screen.appendChild(hot);
      const mine = hot;
      setTimeout(() => { if (mine.isConnected) pointFingerAt(mine, { onMain: true }); }, 300);
    }
    if (BoxEdit.on) {
      panel.style.backgroundImage = 'none';
      panel.innerHTML = cfUI.searchSheet();
      const NAME = { open: '이모티콘 버튼', tab: '이모티콘 탭' };
      const place = (el) => { const b = el._ref; el.style.left = b[0] + 'px'; el.style.top = b[1] + 'px'; el.style.width = b[2] + 'px'; el.style.height = b[3] + 'px'; el.style.borderRadius = b[4] === undefined ? '50%' : typeof b[4] === 'number' ? b[4] + 'px' : b[4]; };
      Object.keys(HOT).forEach((k) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'cf-hot';
        b.dataset.name = NAME[k];
        b.style.animation = 'none';
        BoxEdit.tag(b, HOT[k]);
        place(b);
        screen.appendChild(b);
      });
      BoxEdit.init({ name: (el) => '[' + el.dataset.name + '] ', apply: place });
      guide.textContent = '좌표 수정 모드 — 버튼을 클릭해 방향키로 맞춰요(Shift 10px, Alt+방향키 크기)';
      return;
    }
    setHot('open', () => {
      panel.style.backgroundImage = 'none';
      panel.innerHTML = cfUI.searchSheet();
      guide.innerHTML = '이모티콘 탭을 클릭해요.';
      setHot('tab', () => {
        panel.innerHTML = cfUI.emojiSheet() + '<div class="cf-recent">' + USED.map((n) => '<img src="img/new/' + n + '.png" alt="">').join('') + '</div>';
        guide.innerHTML = '최근 사용한 이모티콘을<br>한 번에 모아볼 수 있는<br>나만의 이모티콘 수첩이에요!';
        next.classList.remove('is-off');
      });
    });
  })();
  </script>
</body>
</html>
