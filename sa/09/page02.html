<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 동네 숨은 영웅을 찾아라!</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>

        .p02-badge{position:absolute;left:140px;top:48px;display:flex;align-items:stretch;height:108px;border-radius:54px;overflow:hidden;border:solid 5px var(--c-ink);box-shadow:0 10px 0 0 var(--c-sky-pale)}
        .p02-badge-num{display:flex;align-items:center;justify-content:center;padding:6px 50px 0 50px;background:var(--c-sky);font-family:'Cafe24 Ssurround';font-size:70px;letter-spacing:0em;color:var(--c-white);gap:20px}
        .p02-badge-q{display:flex;align-items:center;padding:6px 70px 0 70px;background:var(--c-cream);font-family:'Cafe24 Ssurround';font-size:70px;letter-spacing:0em;color:var(--c-ink)}

        .p02-stars{position:absolute;left:1317px;top:48px;display:flex;align-items:center;justify-content:center;gap:56px;width:462px;height:104px;border-radius:52px;background:var(--c-cream);border:solid 5px var(--c-ink);box-sizing:border-box}
        .p02-stars .find-star{width:72px;height:68px}

        .p02-hints{position:absolute;left:0;top:0}
        .p02-hint{position:absolute;top:200px;width:557px;height:314px;box-sizing:border-box;border:solid 5px var(--c-ink);border-radius:14px;overflow:hidden;background:var(--c-white);display:flex;flex-direction:column}
        .p02-hint i{flex:1 1 auto;background:var(--c-mist) top center / cover no-repeat}
        .p02-hint span{position:absolute;left:0;bottom:0;width:100%;font-family:'Cafe24 Ssurround';font-size:56px;color:var(--c-white);letter-spacing:-0.05em;text-align:center;line-height:1;-webkit-text-stroke: 10px var(--c-ink);paint-order: stroke fill}
        .p02-hint.slot1{left:82px}
        .p02-hint.slot2{left:683px}
        .p02-hint.slot3{left:1282px}
        .p02-hint-btn{position:absolute;background:url('img/p02_hint.png') no-repeat;background-size:contain;top:200px;width:557px;height:314px;border:0;padding:0;cursor:pointer}
        .p02-hint-btn.slot2{left:683px}
        .p02-hint-btn.slot3{left:1282px}

        .p02-cards{position:absolute;left:0;top:0}
        .p02-card{top:560px;width:280px;height:355px;background:var(--c-white);border:solid 5px var(--c-ink);display:flex;flex-direction:column}
        .p02-card:hover{border-color:var(--c-sky)}
        .p02-card.is-selected{border-color:#ff2fc2}
        .p02-card i{flex:1 1 auto;background:var(--c-mist) center / cover no-repeat}
        .p02-card span{flex:0 0 84px;display:flex;align-items:center;justify-content:center;padding-top:6px;background:var(--c-cream);font-family:'Cafe24 Ssurround';font-size:44px;color:var(--c-ink);letter-spacing:-0.05em;line-height:1}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">

          <div class="p02-badge">
            <span class="p02-badge-num">STAGE <span id="p02StageNum">1</span></span>
            <span class="p02-badge-q">어떤 영웅일까?</span>
          </div>
          <div class="p02-stars">
            <img class="find-star" src="../../img/common/icon_star.png" data-src-on="../../img/common/icon_star_on.png" alt="">
            <img class="find-star" src="../../img/common/icon_star.png" data-src-on="../../img/common/icon_star_on.png" alt="">
            <img class="find-star" src="../../img/common/icon_star.png" data-src-on="../../img/common/icon_star_on.png" alt="">
          </div>

          <div class="p02-hints" id="p02Hints"></div>

          <div class="job-quiz">
            <button class="hint-reveal-btn p02-hint-btn slot2 js-sfx" data-sound="sound/click.mp3" aria-label="다른 힌트 보기"></button>
            <button class="hint-reveal-btn p02-hint-btn slot3 js-sfx" data-sound="sound/click.mp3" aria-label="다른 힌트 보기"></button>
            <div class="hint-cards p02-cards" id="p02Cards"></div>
          </div>

          <div class="hint-quiz-wrong is-off" data-sound="sound/incorrect.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text is-small">다시 한 번 힌트를 확인하고<br>알맞은 직업을 찾아볼까요?</p>
              </div>
            </div>
          </div>
          <div class="hint-quiz-correct photo-modal is-off" data-sound="sound/correct.mp3">
            <div class="photo-card">
              <div class="photo-card-img" id="p02CorrectPhoto"></div>
              <p class="photo-card-title">정답이에요!</p>
              <p class="photo-card-text" id="p02CorrectText"></p>
            </div>
            <button type="button" id="p02ConfirmBtn" class="hint-quiz-confirm js-sfx card-btn is-popup" data-sound="sound/click.mp3">확인</button>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="우리 동네 숨은 영웅을 찾아라!" data-next="page03.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  /* 기획서 3~7p. 6개 직업 중 3개를 무작위로 STAGE1~3 출제. 힌트 사진 img/p02_hint_{id}_{1~3}.png, 보기 카드 사진 img/p02_card_{id}.png, 정답 사진 img/p02_photo_{id}.png
     효과음(sound/p02_*.mp3)은 아직 없음 — 힌트가 열릴 때 재생 시도만 함 */
  (function () {
    const JOBS = [
      { id: 'police', label: '경찰관', hints: ['경광등', '호루라기', '순찰'], sounds: { 2: 'sound/p02_whistle.mp3' }, text: '경찰관은 동네를 살피고 사람들의 안전을 지켜줘요.' },
      { id: 'bus', label: '버스기사', hints: ['운전대', '교통카드 단말기', '버스'], sounds: { 2: 'sound/p02_bus.mp3' }, text: '버스 기사는 사람들이 목적지까지 안전하게 갈 수 있도록 해줘요.' },
      { id: 'cook', label: '급식조리사', hints: ['조리용 모자와 앞치마', '커다란 조리용 솥', '급식실'], text: '급식 조리사는 학생들이 먹을 급식을 맛있고 위생적으로 만들어요.' },
      { id: 'cleaner', label: '환경미화원', hints: ['새벽', '빗자루', '쓰레기'], text: '환경미화원은 쓰레기를 치워 동네를 깨끗하게 해줘요.' },
      { id: 'paramedic', label: '구급대원', hints: ['응급처치 키트', '들것', '구급차'], sounds: { 3: 'sound/p02_siren.mp3' }, text: '구급대원은 아프거나 다친 사람을 응급 처치하고 병원으로 옮겨줘요.' },
      { id: 'courier', label: '택배기사', hints: ['택배 상자', '택배 차량', '택배 배송'], text: '택배 기사는 사람들이 주문한 물건을 집까지 안전하게 배송해줘요.' },
    ];
    const CARD_LEFT = [100, 388, 676, 965, 1252, 1541];

    const stageJobs = shuffleArray(JOBS).slice(0, 3);
    let stageIndex = 0;
    let answered = false;

    const hintsBox = $('p02Hints');
    const cardsBox = $('p02Cards');
    const stageNumEl = $('p02StageNum');
    const stars = Array.from(document.querySelectorAll('.p02-stars .find-star'));
    const revealBtns = Array.from(document.querySelectorAll('.hint-reveal-btn'));
    const wrongLayer = document.querySelector('.hint-quiz-wrong');
    const correctLayer = document.querySelector('.hint-quiz-correct');
    const correctPhoto = $('p02CorrectPhoto');
    const correctText = $('p02CorrectText');
    const confirmBtn = $('p02ConfirmBtn');

    const wrongSound = new Audio(ASSET_BASE + wrongLayer.dataset.sound);
    const correctSound = new Audio(ASSET_BASE + correctLayer.dataset.sound);

    function fillStars(count) {
      stars.forEach((star, i) => {
        star.src = i < count ? star.dataset.srcOn : '../../img/common/icon_star.png';
      });
    }

    function playHintSound(path) {
      if (path) new Audio(path).play().catch(() => {});
    }

    function setupStage() {
      const job = stageJobs[stageIndex];
      answered = false;

      stageNumEl.textContent = String(stageIndex + 1);
      fillStars(stageIndex);

      hintsBox.innerHTML = job.hints.map((name, i) =>
        '<div class="p02-hint slot' + (i + 1) + '"><i style="background-image:url(\x27img/p02_hint_' + job.id + '_' + (i + 1) + '.png\x27)"></i><span>' + name + '</span></div>').join('');
      correctPhoto.style.backgroundImage = `url('img/p02_photo_${job.id}.png')`;
      correctPhoto.style.backgroundPosition = 'center';
      correctPhoto.style.backgroundSize = 'cover';
      correctText.textContent = job.text;

      cardsBox.innerHTML = '';
      shuffleArray(JOBS).forEach((j, i) => {
        const card = document.createElement('button');
        card.className = 'hint-card pick-card p02-card';
        card.style.left = CARD_LEFT[i] + 'px';
        card.dataset.correct = String(j.id === job.id);
        card.setAttribute('aria-label', j.label);
        card.innerHTML = '<i style="background-image:url(\x27img/p02_card_' + j.id + '.png\x27)"></i><span>' + j.label + '</span>';
        card.addEventListener('click', () => onPick(card));
        cardsBox.appendChild(card);
      });

      revealBtns.forEach((btn) => btn.classList.remove('hidden'));
      wrongLayer.classList.add('is-off');
      correctLayer.classList.add('is-off');
    }

    function onPick(card) {
      if (answered) return;
      if (card.dataset.correct === 'true') {
        answered = true;
        cardsBox.querySelectorAll('.p02-card').forEach((c) => c.classList.toggle('is-selected', c === card));
        const wasRevealing = revealBtns.some((b) => !b.classList.contains('hidden'));
        revealBtns.forEach((b) => b.classList.add('hidden'));
        fillStars(stageIndex + 1);
        setTimeout(() => {
          correctLayer.classList.remove('is-off');
          correctSound.cloneNode().play().catch(() => {});
        }, wasRevealing ? 1000 : 0);
      } else {
        wrongLayer.classList.remove('is-off');
        wrongSound.cloneNode().play().catch(() => {});
        clearTimeout(wrongLayer.__hideTimer);
        wrongLayer.__hideTimer = setTimeout(() => wrongLayer.classList.add('is-off'), 2000);
      }
    }

    revealBtns.forEach((btn) => {
      btn.addEventListener('click', () => {
        btn.classList.add('hidden');
        const sounds = stageJobs[stageIndex].sounds;
        playHintSound(sounds && sounds[btn.classList.contains('slot2') ? 2 : 3]);
      });
    });

    confirmBtn.addEventListener('click', () => {
      setTimeout(() => {
        stageIndex += 1;
        if (stageIndex >= stageJobs.length) navigateTo('page03.html');
        else setupStage();
      }, 300);
    });

    setupStage();
  })();
  </script>
</body>
</html>
