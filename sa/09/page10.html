<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 동네 안전 지킴이 인터뷰</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        .p10-character{position:absolute;left:0;bottom:0;z-index:10}
        .p10-character img{display:block}
        /* 기획서 47p. page09에서 저장한 팩트체크 정답 수(sa09_score, 0~3)만큼 별이 켜지고, 2~3개면 칭찬 / 0~1개면 다시 확인 문구 */
        .p10-stars{display:flex;justify-content:center;gap:40px;margin-bottom:30px}
        #p10Desc{font-size:56px;line-height:1.3}
        .p10-stars img{width:120px;height:auto;display:block}
        .p10-next{position:absolute;left:1050px;top:776px;z-index:20}
        .p10-next img{height:122px;width:auto;display:block}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="p10-character"><img src="img/p10_character.png" alt="메인 캐릭터"></div>

          <p class="end-title">팩트체크 결과</p>
          <div class="end-panel">
            <div>
              <div class="p10-stars" id="p10Stars">
                <img src="../../img/common/icon_star.png" data-src-on="../../img/common/icon_star_on.png" alt="">
                <img src="../../img/common/icon_star.png" data-src-on="../../img/common/icon_star_on.png" alt="">
                <img src="../../img/common/icon_star.png" data-src-on="../../img/common/icon_star_on.png" alt="">
              </div>
              <p class="end-desc" id="p10Desc"></p>
            </div>
          </div>

          <a href="page11.html" class="js-nav-effect p10-next">
            <img src="../../img/common/btn_next_content.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_next_content_on.png" data-src-over="../../img/common/btn_next_content_over.png" data-sound="sound/click.mp3" alt="다음">
          </a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="우리 동네 안전 지킴이 인터뷰" data-next="page11.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    let score = 3;
    try {
      const v = sessionStorage.getItem('sa09_score');
      if (v !== null) score = Math.max(0, Math.min(3, Number(v) || 0));
    } catch (e) {}
    document.querySelectorAll('#p10Stars img').forEach((s, i) => { if (i < score) s.src = s.dataset.srcOn; });
    $('p10Desc').innerHTML = score >= 2
      ? '훌륭해요!<br>AI의 답변을 그대로 믿지 않고<br>사실인지 확인하는<br>멋진 정보 탐정이에요!'
      : 'AI는 그럴듯한 답변을<br>만들어 내기도 해요.<br>믿을 수 있는 자료로<br>다시 한 번 확인해봐요!';
  })();
  </script>
</body>
</html>
