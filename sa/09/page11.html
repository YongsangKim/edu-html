<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀴즈 풀기</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        /* 기획서 48~52p. Q1·Q2·Q3 모두 4지선다. 정답/오답 팝업은 공용 아바타 팝업(기능 V) */
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="quiz-stage">
          <div class="step-flow">

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../resources/img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q1.</span>
                  <p class="quiz-ask">우리 동네의 쾌적한 환경을 위해 이른 새벽부터 거리를 청소하며 주민들의 안전과 위생을 지켜주는 사람은 누구일까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-grid">
                <button class="answer-pick card-btn" data-correct="true">환경미화원</button>
                <button class="answer-pick card-btn" data-correct="false">경찰관</button>
                <button class="answer-pick card-btn" data-correct="false">요리사</button>
                <button class="answer-pick card-btn" data-correct="false">버스 기사</button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../resources/img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q2.</span>
                  <p class="quiz-ask">ChatGPT나 Gemini 같은 챗봇 AI에게 ‘경찰관’이나 ‘버스 기사’처럼 특정한 인물의 역할을 맡도록 지시하는 설명 글을 무엇이라고 할까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-grid">
                <button class="answer-pick card-btn" data-correct="false">요약 프롬프트</button>
                <button class="answer-pick card-btn" data-correct="false">이미지 프롬프트</button>
                <button class="answer-pick card-btn" data-correct="true">페르소나 프롬프트</button>
                <button class="answer-pick card-btn" data-correct="false">번역 프롬프트</button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../resources/img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q3.</span>
                  <p class="quiz-ask">챗봇 AI가 질문에 대해 마치 사실인 것처럼 그럴듯하게 거짓 정보를 지어내서 대답하는 현상에 속지 않기 위해 우리가 정보의 사실 여부를 확인하는 과정을 무엇이라고 하나요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-grid is-low" data-next="page12.html">
                <button class="answer-pick card-btn" data-correct="false">할루시네이션</button>
                <button class="answer-pick card-btn" data-correct="true">팩트체크</button>
                <button class="answer-pick card-btn" data-correct="false">딥러닝</button>
                <button class="answer-pick card-btn" data-correct="false">AI 학습</button>
              </div>
            </div>

          </div>

          <div class="ox-result-correct is-avatar is-off" data-sound="sound/correct.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_correct.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">정답이에요!</p>
              </div>
              <div class="avatar-popup-extra"><img src="../../resources/img/common/icon_correct.png" alt=""></div>
            </div>
          </div>
          <div class="ox-result-wrong is-avatar is-off" data-sound="sound/incorrect.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">다시 한번 생각해볼까요?</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="퀴즈 풀기" data-next="page12.html"></script>
  <script src="../../resources/js/toc.js"></script>
  <script src="../../resources/js/common.js"></script>
</body>
</html>
