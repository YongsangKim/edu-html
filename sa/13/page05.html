<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이 사진, 올려도 될까?</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        /* 기획서 10~13p. 사진 6장을 1→4→5→2→6→3 순서로 한 장씩 보여 주고 '공유 가능한 사진' / '확인, 수정이 필요한 사진' 폴더로 끌어 넣기.
           정답이면 효과음 + 다음 사진, 오답이면 팝업. 다 하면 활동 종료 팝업 */
        /* .p05-tip{position:absolute;left:0;top:50px;width:1920px;margin:0;text-align:center;font-size:56px;font-weight:500;color:var(--c-ink);letter-spacing:-0.04em} */
        .p05-frame{position:absolute;left:28px;top:86px;width:1864px;height:849px;box-sizing:border-box;background:var(--c-white);border:solid 5px var(--c-ink);border-radius:30px;z-index:1}
        .p05-stage{position:absolute;left:33px;top:91px;width:1282px;height:834px;z-index:4}
        .p05-photo{position:absolute;left:50%;top:50%;width:1000px;height:563px;margin:-282px 0 0 -500px;cursor:grab;touch-action:none;user-select:none;z-index:30}
        .p05-photo img{display:block;width:100%;height:100%;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none;-webkit-user-drag:none}
        .p05-photo.is-dragging{cursor:grabbing;z-index:90}
        .p05-photo.is-back{transition:transform .25s ease}
        .p05-photo.is-off{display:none}
        .p05-photo small{position:absolute;left:0;right:0;bottom:0;padding:12px 18px;border-radius:0 0 12px 12px;background:rgba(0,0,0,.65);color:#fff;font-size:32px;text-align:center;letter-spacing:-0.03em}

        .p05-zones{position:absolute;left:1320px;top:158px;width:547px;height:752px;box-sizing:border-box;background:#266cc8;border:solid 5px var(--c-ink);border-radius:25px;z-index:3}
        .p05-folder{position:absolute;left:42px;width:455px;height:347px;box-sizing:border-box;border-radius:36px;background:#dff6ff;text-align:center}
        .p05-folder.is-safe{top:17px}
        .p05-folder.is-danger{top:380px}
        .p05-folder i{position:absolute;left:73px;top:20px;width:317px;height:245px}
        .p05-folder i:before,.p05-folder i:after{content:'';position:absolute;top:0;height:245px;background-repeat:no-repeat}
        .p05-folder i:before{right:0;top:1px;width:268px;height:243px}
        .p05-folder i:after{left:0;width:317px;opacity:0}
        .p05-folder.is-over i:before{opacity:0}
        .p05-folder.is-over i:after{opacity:1}
        .p05-folder.is-safe i:before{background-image:url('img/p05_fold_yellow_close.png')}
        .p05-folder.is-safe i:after{background-image:url('img/p05_fold_yellow_open.png')}
        .p05-folder.is-danger i:before{background-image:url('img/p05_fold_orange_close.png')}
        .p05-folder.is-danger i:after{background-image:url('img/p05_fold_orange_open.png')}
        .p05-folder span{position:absolute;left:0;right:0;top:282px;display:block;font-family:'Cafe24 Ssurround';font-size:58px;line-height:1.1;color:#053c85;letter-spacing:-0.1em;white-space:nowrap}
        .p05-folder.is-danger span{left:50%;right:auto;transform:translateX(-50%) scaleX(.79)}
        #p05Wrong,#p05Done{z-index:120}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <p class="ask-pill is-wide is-tight2">사진을 보고 알맞은 폴더로 드래그해 옮겨보세요.</p>

          <!-- <p class="p05-tip">사진을 보고 알맞은 폴더로 드래그해 옮겨보세요.</p> -->
          <div class="p05-frame"></div>
          <div class="p05-stage" id="p05Stage"></div>
          <div class="p05-zones">
            <div class="p05-folder is-safe" data-key="safe"><i></i><span>공유 가능한 사진</span></div>
            <div class="p05-folder is-danger" data-key="danger"><i></i><span>확인, 수정이 필요한 사진</span></div>
          </div>

          <div class="avatar-modal is-wrong is-off" id="p05Wrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body is-finish">
                <p class="avatar-popup-sub">개인정보나 친구의 얼굴이 포함되어 있는지<br>다시 한번 확인해봐요.</p>
                <button type="button" class="avatar-popup-next card-btn is-popup js-sfx" id="p05WrongOk" data-sound="sound/click.mp3">다음</button>
              </div>
            </div>
          </div>
          <div class="avatar-modal is-off" id="p05Done">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_correct.png" alt=""></div>
              <div class="avatar-popup-body is-finish">
                <p class="avatar-popup-text">좋아요!</p>
                <p class="avatar-popup-sub">사진을 공유하기 전에, 개인정보가 찍혀 있지 않은지 확인하고 친구의 얼굴이 찍혀 있다면 공유해도 되는지 허락을 받아야 해요.</p>
                <a href="page06.html" class="avatar-popup-next card-btn is-popup js-nav-effect js-sfx" data-sound="sound/click.mp3">다음</a>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="이 사진, 올려도 될까?" data-next="page06.html"></script>
  <script src="../../resources/js/toc.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  (function () {
    const ORDER = [
      { n: 1, key: 'safe' }, { n: 4, key: 'danger', note: '아직 친구에게 사진을 올려도 되는지 물어보지 않았어요.' },
      { n: 5, key: 'danger' }, { n: 2, key: 'safe' }, { n: 6, key: 'danger' }, { n: 3, key: 'safe' }
    ];
    const box = $('p05Stage');
    const stage = $('stage');
    const folders = Array.from(document.querySelectorAll('.p05-folder'));
    let idx = 0;

    const folderAt = (x, y) => folders.find((f) => { const r = f.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; }) || null;

    function show() {
      box.innerHTML = '';
      const q = ORDER[idx];
      const el = document.createElement('div');
      el.className = 'p05-photo';
      el.innerHTML = '<img src="img/p05_photo_' + q.n + '.jpg" alt="">' + (q.note ? '<small>' + q.note + '</small>' : '');
      box.appendChild(el);

      el.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        const s = stage.getBoundingClientRect().width / 1920;
        const sx = e.clientX, sy = e.clientY;
        el.setPointerCapture(e.pointerId);
        el.classList.remove('is-back');
        el.classList.add('is-dragging');
        const move = (ev) => {
          el.style.transform = 'translate(' + (ev.clientX - sx) / s + 'px,' + (ev.clientY - sy) / s + 'px) scale(.4)';
          const over = folderAt(ev.clientX, ev.clientY);
          folders.forEach((f) => f.classList.toggle('is-over', f === over));
        };
        const up = (ev) => {
          el.removeEventListener('pointermove', move);
          el.removeEventListener('pointerup', up);
          el.removeEventListener('pointercancel', up);
          el.classList.remove('is-dragging');
          folders.forEach((f) => f.classList.remove('is-over'));
          const f = folderAt(ev.clientX, ev.clientY);
          if (f && f.dataset.key === q.key) {
            el.classList.add('is-off');
            playCorrect();
            idx += 1;
            if (idx === ORDER.length) setTimeout(() => $('p05Done').classList.remove('is-off'), 700);
            else setTimeout(show, 700);
            return;
          }
          el.classList.add('is-back');
          el.style.transform = '';
          if (f) {
            playWrong();
            setTimeout(() => $('p05Wrong').classList.remove('is-off'), 300);
          }
        };
        el.addEventListener('pointermove', move);
        el.addEventListener('pointerup', up);
        el.addEventListener('pointercancel', up);
      });
    }
    $('p05WrongOk').addEventListener('click', () => $('p05Wrong').classList.add('is-off'));
    show();
  })();
  </script>
</body>
</html>
