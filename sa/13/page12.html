<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안전한 SNS 업로드 챌린지</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        /* 기획서 35~37p. 사진 6장이 번호 순서대로 왼쪽 폰에 나오고(스크롤) 순서 상관없이 업로드, 6장 모두 끝나면 SNS(page13, 올린 순서대로 6장)(img/p12_photo_1~6.jpg, 개인정보가 없는 사진 1·6은 boxes 가 빈 배열). 사진을 고르면 오른쪽에 크게 뜨고, [AI 지우개]를 누른 뒤 개인정보를 하나씩 클릭하면 흰색으로 가려짐.
           [안전하게 업로드]: 남았으면 '개인정보가 아직 남아 있어요!'(2초, 남은 곳 강조) / 다 지웠으면 사진이 사라지고 '안전하게 업로드 완료!'. 완료한 사진은 흑백·클릭 불가, 6장 모두 끝나면 폰이 가운데로 이동하며 SNS 화면(page13).
           좌표는 사진에 대한 [왼쪽%, 위%, 폭%, 높이%] (?edit) */
        .p12-panel{position:absolute;left:28px;top:70px;width:1864px;height:865px;box-sizing:border-box;background:#266cc8;border:solid 5px var(--c-ink);border-radius:10px}
        .ask-pill.p12-pill{left:1253px;top:21px;width:1192px;min-height:104px;padding-top:14px;max-width:none;white-space:nowrap}
        .p12-sub{position:absolute;left:720px;top:128px;width:1064px;margin:0;text-align:center;font-family:'Cafe24 Ssurround';font-size:50px;line-height:1.3;color:#dff6ff;letter-spacing:-0.1em;white-space:nowrap}
        main:not(.is-c1) .p12-sub{opacity:0;pointer-events:none}
        .p12-phone{left:137px;top:20px;transition:transform .8s ease}
        .p12-phone.is-center{transform:translateX(588px)}
        .p12-slots{position:absolute;left:0;top:60px;width:100%;bottom:46px;padding:10px 30px 0 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px;background:#fff;overflow-y:auto;scrollbar-width:thin}
        .p12-slot{position:relative;flex:0 0 auto;height:216px;border:solid 5px #d6d6dd;border-radius:14px;padding:0;overflow:hidden;background:#fff;cursor:pointer}
        .p12-slot img{display:block;width:100%;height:100%;object-fit:cover}
        .p12-slot.is-on{border-color:#ff4ff9;box-shadow:0 0 0 2px #ff4ff9}
        .p12-slot.is-done{filter:grayscale(1);opacity:.6;cursor:default;pointer-events:none}

        .p12-tray{position:absolute;left:723px;top:627px;width:534px;height:273px}
        .p12-tray svg{display:block;width:100%;height:100%}
        .p12-view{position:absolute;left:720px;top:196px;width:1064px;height:570px;box-sizing:border-box;border:solid 5px #053c85;border-radius:10px;background:var(--c-white);overflow:hidden}
        .p12-view .p12-ph{position:absolute;left:0;top:50%;width:100%;aspect-ratio:3/2;transform:translateY(-50%);display:none}
        .p12-view.is-photo .p12-ph{display:block}
        .p12-ph>img{display:block;width:100%;height:100%;object-fit:fill;-webkit-user-drag:none;user-select:none}
        .p12-view .p12-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
        .p12-view .p12-empty img{width:130px;opacity:.35}
        .p12-view.is-photo .p12-empty{display:none}
        .p12-view .p12-ok{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-family:'Cafe24 Ssurround';font-size:84px;color:var(--c-purple);letter-spacing:-0.04em}
        .p12-view.is-ok .p12-ok{display:flex}
        .p12-view.is-ok .p12-ph, .p12-view.is-ok .p12-empty{display:none}
        .p12-box{position:absolute;box-sizing:border-box;cursor:pointer}
        .p12-box.is-erased{background:#fff;border-radius:6px;box-shadow:0 0 0 2px rgba(0,0,0,.08);pointer-events:none}
        .p12-box.is-left{outline:6px solid #ffb400;outline-offset:2px;border-radius:10px;animation:p12-pulse .4s ease-in-out 5 alternate}
        @keyframes p12-pulse{to{outline-color:#ff5a00;background:rgba(255,200,0,.3)}}
        body.is-edit .p12-box{outline:3px dashed #e60000;background:rgba(255,0,0,.15);z-index:20}

        .p12-eraser{position:absolute;left:881px;top:743px;width:221px;height:159px;padding:0;border:0;background:none;cursor:pointer}
        .p12-eraser img{position:absolute;left:0;top:0;width:221px;height:159px;display:none;pointer-events:none}
        .p12-eraser .e-off{display:block}
        .p12-eraser.is-on .e-off{display:none}
        .p12-eraser.is-on .e-on{display:block}
        .p12-eraser:disabled{cursor:default;pointer-events:none}
        .p12-eraser:disabled .e-off, .p12-eraser:disabled .e-on{display:none}
        .p12-eraser:disabled .e-dis{display:block}
        .p12-up{position:absolute;left:1281px;top:780px;width:496px;min-width:0;height:97px;padding:0;display:flex;align-items:center;justify-content:center;gap:9px;font-size:52px;letter-spacing:-0.05em}
        .p12-up img{width:65px;height:65px}
        .p12-up .i-o,.p12-up .i-c,.p12-up .i-off{display:none}
        @media (hover:hover){.p12-up:hover:not(:disabled) .i-n{display:none}.p12-up:hover:not(:disabled) .i-o{display:block}}
        .p12-up:active:not(:disabled) .i-n,.p12-up:active:not(:disabled) .i-o{display:none}
        .p12-up:active:not(:disabled) .i-c{display:block}
        .p12-up:disabled{pointer-events:none;background:linear-gradient(180deg,#f6f6f6,#fcfcfc);border-color:#f0f0f0;box-shadow:0 10px 0 0 #e5e5e5,0 10px 0 10px #aeaeae;color:#a4a4a4}
        .p12-up:disabled .i-n{display:none}
        .p12-up:disabled .i-off{display:block}
        main.is-finish :is(.p12-pill,.p12-sub,.p12-tray,.p12-view,.p12-eraser,.p12-up){opacity:0;pointer-events:none}
        .p12-toast{position:absolute;left:1264px;top:330px;width:1000px;margin-left:-500px;box-sizing:border-box;padding:30px 20px 24px;border:solid 6px var(--c-ink);border-radius:28px;background:#fff;text-align:center;font-family:'Cafe24 Ssurround';font-size:50px;color:var(--c-ink);letter-spacing:-0.04em;box-shadow:0 10px 0 0 rgba(86,148,231,.3);z-index:100;pointer-events:none}
        .p12-toast.is-off{display:none}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default is-c1" id="p12Main">
          <div class="p12-panel"></div>
          <p class="ask-pill is-fit is-medium is-tight2 p12-pill"><span id="p12Tip"></span></p>
          <p class="p12-sub">사진을 고르고, 가려야 할 개인정보가 있는지 살펴보세요.</p>
          <div class="phone-frame has-cam p12-phone" id="p12Phone"><div class="phone-screen"><div class="phone-status is-dark" data-time="21:56"></div><div class="p12-slots" id="p12Slots"></div><div class="phone-nav"></div></div></div>
          <div class="p12-tray"><svg viewBox="0 0 534 273"><rect x="2.5" y="2.5" width="529" height="268" rx="10" fill="#91b9e7" stroke="#fff" stroke-width="5" stroke-dasharray="20 10"/></svg></div>
          <div class="p12-view" id="p12View">
            <div class="p12-empty"><img src="img/p12_placeholder.jpeg" alt=""></div>
            <div class="p12-ph" id="p12Ph"><img id="p12Img" alt="" draggable="false"></div>
            <div class="p12-ok">안전하게 업로드 완료!</div>
          </div>
          <button type="button" class="p12-eraser js-sfx" id="p12Eraser" data-sound="sound/click.mp3" disabled><img class="e-off" src="img/p12_eraser_off.png" alt="AI 지우개"><img class="e-on" src="img/p12_eraser_on.png" alt=""><img class="e-dis" src="img/p12_eraser_disabled.png" alt=""></button>
          <button type="button" class="card-btn p12-up js-sfx" id="p12Upload" data-sound="sound/click.mp3" disabled><img class="i-n" src="img/p12_icon_download.png" alt=""><img class="i-o" src="img/p12_icon_download_over.png" alt=""><img class="i-c" src="img/p12_icon_download_on.png" alt=""><img class="i-off" src="img/p12_icon_download_off.png" alt=""><span>안전하게 업로드</span></button>
          <p class="p12-toast is-off" id="p12Toast"></p>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="안전한 SNS 업로드 챌린지" data-next="page13.html"></script>
  <script src="../../resources/js/toc.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script src="../../resources/js/box-edit.js"></script>
  <script>
  (function () {
    const PHOTOS = [
      { img: 'img/p12_photo_1.jpg', boxes: [] },
      { img: 'img/p12_photo_2.jpg', boxes: [[57, 50, 28, 24]] },
      { img: 'img/p12_photo_3.jpg', boxes: [[69, 44, 18, 22]] },
      { img: 'img/p12_photo_4.jpg', boxes: [[44.5, 58.5, 11, 12]] },
      { img: 'img/p12_photo_5.jpg', boxes: [[55, 40, 40, 48]] },
      { img: 'img/p12_photo_6.jpg', boxes: [] }
    ];
    const TIP_PICK = '어떤 사진을 SNS에 공유해볼까요?';
    const TIP_ERASE = 'AI 지우개를 클릭해 개인정보를 모두 지워보세요.';
    const TIP_NEXT = '왼쪽 핸드폰에서 다음 사진을 골라보세요.';
    const place = (el, b) => { el.style.cssText = 'left:' + b[0] + '%;top:' + b[1] + '%;width:' + b[2] + '%;height:' + b[3] + '%'; };
    if (BoxEdit.on) document.body.classList.add('is-edit');

    const sel = (location.search.match(/[?&]p=([\d,]+)/) || [])[1];   // ?edit&p=4,5,6 : 편집 때 볼 사진 번호(기본 1,2,3)
    const picks = BoxEdit.on && sel ? sel.split(',').map((n) => PHOTOS[n - 1]).filter(Boolean) : PHOTOS;
    const slots = $('p12Slots'), view = $('p12View'), ph = $('p12Ph'), eraser = $('p12Eraser'), upload = $('p12Upload'), toast = $('p12Toast');
    const doneOrder = [];
    let cur = null, eraserOn = false, doneN = 0, toastTimer = 0, boxEls = [];

    function say(t) {
      toast.textContent = t;
      toast.classList.remove('is-off');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.add('is-off'), 2000);
    }
    function setEraser(v) {
      eraserOn = v;
      eraser.classList.toggle('is-on', v);
    }
    $('p12Tip').innerHTML = TIP_PICK;

    picks.forEach((p, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'p12-slot js-sfx';
      b.dataset.sound = 'sound/click.mp3';
      b.innerHTML = '<img src="' + p.img + '" alt="">';
      b.addEventListener('click', () => {
        slots.querySelectorAll('.p12-slot').forEach((x) => x.classList.remove('is-on'));
        b.classList.add('is-on');
        cur = p;
        $('p12Img').src = p.img;
        view.classList.remove('is-ok');
        view.classList.add('is-photo');
        ph.querySelectorAll('.p12-box').forEach((e) => e.remove());
        boxEls = p.boxes.map((bx) => {
          const el = document.createElement('div');
          el.className = 'p12-box';
          ph.appendChild(el);
          place(el, bx);
          BoxEdit.tag(el, bx);
          el.addEventListener('click', () => {
            if (BoxEdit.on || el.classList.contains('is-erased')) return;
            if (!eraserOn) { playWrong(); say('개인정보를 지우려면 AI 지우개를 클릭하세요.'); return; }
            el.classList.add('is-erased');
            playCorrect();
          });
          return el;
        });
        setEraser(false);
        eraser.disabled = false;
        upload.disabled = false;
        $('p12Main').classList.remove('is-c1');
        $('p12Tip').textContent = TIP_ERASE;
      });
      b._pick = p;
      slots.appendChild(b);
    });

    ph.addEventListener('click', (e) => {
      if (BoxEdit.on || !cur || e.target !== $('p12Img') || eraserOn) return;
      playWrong();
      say('개인정보를 지우려면 AI 지우개를 클릭하세요.');
    });
    eraser.addEventListener('click', () => {
      if (cur && !cur.boxes.length) { playWrong(); say('사진에 개인정보가 있는지 다시 한번 살펴볼까요?'); return; }
      setEraser(!eraserOn);
    });
    upload.addEventListener('click', () => {
      if (!cur) return;
      const left = boxEls.filter((el) => !el.classList.contains('is-erased'));
      if (left.length) {
        playWrong();
        say('개인정보가 아직 남아 있어요!');
        left.forEach((el) => { el.classList.remove('is-left'); void el.offsetWidth; el.classList.add('is-left'); });
        return;
      }
      playCorrect();
      slots.querySelector('.p12-slot.is-on').classList.add('is-done');
      view.classList.remove('is-photo');
      view.classList.add('is-ok');
      eraser.disabled = true;
      upload.disabled = true;
      doneOrder.push(cur.img);
      cur = null;
      doneN += 1;
      if (doneN === picks.length) {
        try { sessionStorage.setItem('sa13_picks', JSON.stringify(doneOrder)); } catch (e) {}
        setTimeout(() => { $('p12Main').classList.add('is-finish'); $('p12Phone').classList.add('is-center'); }, 1200);
        setTimeout(() => { location.href = 'page13.html'; }, 2200);
      } else {
        $('p12Tip').textContent = TIP_NEXT;
      }
    });

    if (BoxEdit.on) {
      BoxEdit.init({ unit: 0.1, name: (el) => '사진 개인정보', apply: (el) => place(el, el._ref) });
      slots.querySelector('.p12-slot').click();
    }
  })();
  </script>
</body>
</html>
