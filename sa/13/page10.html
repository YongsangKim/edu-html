<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀴즈 풀기</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        /* 기획서 31~33p. Q1(3지선다) · Q2(O/X) · Q3(4지선다 중 정답 2개 모두 고르기). 정답/오답 팝업은 공용 아바타 팝업(기능 V) */
        /* .quiz-ask.is-small{font-size:52px;line-height:1.2} */
        .quiz-opts.is-row{top:600px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="quiz-stage">
          <div class="step-flow">

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../resources/img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q1.</span>
                  <p class="quiz-ask is-small">온라인 공간에 내 사진이나 친구 사진을 올리기 전에 지켜야 할 올바른 예절은 무엇일까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-list">
                <button class="answer-pick card-btn" data-correct="true">친구의 허락을 받고 개인정보를 가려서 올린다.</button>
                <button class="answer-pick card-btn" data-correct="false">사진이 잘 나왔으면 친구에게 묻지 않고 올린다.</button>
                <button class="answer-pick card-btn" data-correct="false">친구의 허락을 받으면 개인정보는 가리지 않고 올린다.</button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../resources/img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q2.</span>
                  <p class="quiz-ask is-small">AI 지우개를 썼더라도 개인정보가 남았는지 다시 확인해야 할까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz">
                <button class="answer-pick ox-pick is-o" data-correct="true" aria-label="O">
                  <img class="js-img-swap" src="../../resources/img/common/icon_o.png" data-src-on="../../resources/img/common/icon_o_on.png" alt="O">
                </button>
                <button class="answer-pick ox-pick is-x" data-correct="false" aria-label="X">
                  <img class="js-img-swap" src="../../resources/img/common/icon_x.png" data-src-on="../../resources/img/common/icon_x_on.png" alt="X">
                </button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../resources/img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q3.</span>
                  <p class="quiz-ask is-small">내 개인정보가 노출되었을 때 발생할 수 있는 위험한 문제점은 무엇일까요?<br>모두 골라보세요.</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-row" data-next="page11.html">
                <button class="answer-pick card-btn" data-correct="false">영상 통화</button>
                <button class="answer-pick card-btn is-quiz" data-correct="true">보이스피싱</button>
                <button class="answer-pick card-btn" data-correct="true">명의 도용</button>
                <button class="answer-pick card-btn is-quiz" data-correct="false">음성 메시지</button>
              </div>
            </div>

          </div>

          <div class="ox-result-correct is-avatar is-off" data-sound="sound/correct.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_correct.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">정답이에요!</p>
              </div>
              <div class="avatar-popup-extra"><img src="../../resources/img/common/icon_correct.png" alt=""></div>
            </div>
          </div>
          <div class="ox-result-wrong is-avatar is-off" data-sound="sound/incorrect.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">다시 한번 생각해볼까요?</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="퀴즈 풀기" data-next="page11.html"></script>
  <script src="../../resources/js/toc.js"></script>
  <script src="../../resources/js/common.js"></script>
</body>
</html>
