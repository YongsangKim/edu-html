<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀴즈 풀기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 기획서 14~16p. Q1(2지선다) · Q2(2지선다) · Q3(4지선다). 정답/오답 팝업은 공용 아바타 팝업(기능 V) */
        /* .quiz-ask.is-small{font-size:52px;line-height:1.2} */
        .quiz-opts.is-row{top:600px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="quiz-stage">
          <div class="step-flow">

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q1.</span>
                  <p class="quiz-ask is-small">디지털 민주시민으로서 지켜야 할<br>디지털 윤리에는 어떤 것이 있을까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-list">
                <button class="answer-pick card-btn" data-correct="true">출처가 확실한 안전 정보 공유하기</button>
                <button class="answer-pick card-btn" data-correct="false">타인의 개인정보 알리기</button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q2.</span>
                  <p class="quiz-ask is-small">여러 가지 긴 문서나 자료를 소스로 업로드하면, AI가 그 내용만을 바탕으로 분석하여 요약해주거나 PPT 슬라이드 구성 등을 도와주는 구글의 AI 서비스 이름은 무엇일까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-row">
                <button class="answer-pick card-btn is-quiz is-long" data-correct="true">제미나이 Notebook</button>
                <button class="answer-pick card-btn is-quiz" data-correct="false">캔바</button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q3.</span>
                  <p class="quiz-ask is-small">여러 가지 자료 중 발표에 사용할 정보를 선택할 때, 가짜 뉴스를 피하기 위해 우리가 가장 중요하게 확인해야 하는 것은 무엇일까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-grid" data-next="page09.html">
                <button class="answer-pick card-btn" data-correct="false">조회수</button>
                <button class="answer-pick card-btn" data-correct="true">정보의 출처와 신뢰성</button>
                <button class="answer-pick card-btn" data-correct="false">멋진 사진과 그림</button>
                <button class="answer-pick card-btn" data-correct="false">재밌는 제목</button>
              </div>
            </div>

          </div>

          <div class="ox-result-correct is-avatar is-off" data-sound="sound/correct.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_correct.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">정답이에요!</p>
              </div>
              <div class="avatar-popup-extra"><img src="../../img/common/icon_correct.png" alt=""></div>
            </div>
          </div>
          <div class="ox-result-wrong is-avatar is-off" data-sound="sound/incorrect.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">다시 한번 생각해볼까요?</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="퀴즈 풀기" data-next="page09.html"></script>
  <script src="../../js/toc.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
