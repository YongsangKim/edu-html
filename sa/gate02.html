<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2. 경제와 문화 탐험</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        /* 디자인 미확정 - gate01과 같은 와이어프레임(색상 박스)으로 통일. 차시 칸 이름은 그 차시 첫 활동 제목(차시 이름 확정되면 교체).
           예전 통이미지 방식(img/gate02_bg.png + 시작 버튼)은 이미지만 남겨둠 */
        main{position:absolute;left:0;top:120px;width:1920px;height:960px;background:#dbe9f7}
        .gate-lessons{position:absolute;left:0;top:340px;width:100%;display:flex;justify-content:center;gap:30px}
        .gate-lesson{width:320px;height:420px;border-radius:20px;background:#4a90d9;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;box-sizing:border-box;cursor:pointer}
        .gate-lesson:hover{background:#3a7bc0}
        .gate-lesson .num{font-size:28px;font-weight:bold;margin-bottom:20px}
        .gate-lesson .name{font-size:30px;font-weight:bold;line-height:1.4}
        .gate-lesson.disabled{background:#b9b9b9;cursor:default;pointer-events:none}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer"><div id="stage" class="stage">
      <main>
        <div class="gate-lessons">
          <a href="06/page01.html" class="gate-lesson js-nav-effect js-sfx" data-sound="sound/click.mp3">
            <div class="num">6차시</div>
            <div class="name">출동!<br>우리 동네<br>심부름 탐험대</div>
          </a>
          <a href="07/page01.html" class="gate-lesson js-nav-effect js-sfx" data-sound="sound/click.mp3">
            <div class="num">7차시</div>
            <div class="name">하루 속<br>이웃 찾기 미션!</div>
          </a>
          <a href="08/page01.html" class="gate-lesson js-nav-effect js-sfx" data-sound="sound/click.mp3">
            <div class="num">8차시</div>
            <div class="name">인기 여행지<br>카드 짝 맞추기</div>
          </a>
          <div class="gate-lesson disabled">
            <div class="num">9차시</div>
            <div class="name">준비 중</div>
          </div>
          <div class="gate-lesson disabled">
            <div class="num">10차시</div>
            <div class="name">준비 중</div>
          </div>
        </div>
      </main>

    </div></div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../js/header.js" data-title="2. 경제와 문화 탐험"></script>
  <script src="../js/toc.js"></script>
  <script src="../js/common.js"></script>
</body>
</html>
