<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 집 속 숨은 마이크 찾기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 8p 안내 화면. page01과 같은 구성: 리본 제목 + 안내 문장 + '활동 방법' 상자. 캐릭터는 임시로 sa/06 캐릭터 복사본 */
        .intro-panel.p04-panel{justify-content:flex-start;gap:30px;padding:100px 60px 170px 70px}
        .p04-lead{margin:0;font-size:48px;line-height:1.3;color:var(--c-ink);letter-spacing:-0.06em}
        .p04-how{position:relative;margin:0;padding:46px 40px 22px;border:solid 5px var(--c-navy);border-radius:12px;background:#dff4fc}
        .p04-how b{position:absolute;left:50%;top:-34px;transform:translateX(-50%);height:66px;padding:4px 50px 0;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;
          font-weight:normal;background:var(--c-navy);border-radius:33px;font-size:40px;color:var(--c-white)}
        .p04-how .intro-list{font-size:38px;color:var(--c-navy)}
        .p04-how .intro-list li + li{margin-top:8px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="intro-character"><img src="img/p_character_intro.png" alt="메인 캐릭터"></div>
          <div class="intro-panel p04-panel">
            <p class="intro-tab">우리 집 속 숨은 마이크 찾기</p>
            <p class="p04-lead">집 안 곳곳에 사람의 목소리와 주변 소리를 듣는<br>물건들이 숨어 있어요.<br>거실, 방, 현관을 살펴보면서 마이크가 있는 물건을 모두 찾아볼까요?</p>
            <div class="p04-how">
              <b>활동 방법</b>
              <ol class="intro-list">
              <li>1. 탐색하고 싶은 장소를 선택해요.</li>
              <li>2. 차례로 살펴보면서, 마이크가 있는 물건 4개를 모두 찾아보세요.</li>
              </ol>
            </div>
          </div>

          <a href="page05.html" class="js-nav-effect next-btn-activity">
            <img src="../../img/common/btn_start.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_start_on.png" data-src-over="../../img/common/btn_start_over.png" data-sound="sound/click.mp3" alt="시작하기">
          </a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="우리 집 속 숨은 마이크 찾기" data-next="page05.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
