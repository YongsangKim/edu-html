<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카메라와 이미지 인식 퀴즈!</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        .p13-phone{left:120px;top:175px;width:450px;height:895px;transform:scale(.85);transform-origin:0 0}
        .p09-app{background:#f4f8ff;font-family:'Pretendard';color:#222}
        .p09-app svg{display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
        .p09-top{position:absolute;left:0;top:44px;width:100%;height:56px;box-sizing:border-box;padding:0 20px;display:flex;align-items:center;justify-content:space-between;color:#333}
        .p09-top svg{width:30px;height:30px}
        .p09-cam{position:absolute;left:0;top:100px;width:450px;height:560px;overflow:hidden;background:#444}
        .p09-lens img{position:absolute;display:block;max-width:none}
        .p09-tabs{position:absolute;left:0;top:660px;width:450px;height:90px;box-sizing:border-box;padding-top:8px;display:flex;justify-content:center;gap:12px}
        .p09-tab{width:128px;height:76px;border:0;border-radius:14px;background:transparent;font-family:inherit;font-size:19px;color:#333;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
        .p09-tab svg{width:30px;height:30px}
        .p09-tab.is-on{background:#2b66a8;color:#fff}
        .p09-tab.is-dim{opacity:.35;pointer-events:none}
        .p09-ctrl{position:absolute;left:0;top:743px;width:450px;height:94px}
        .p09-logo{position:absolute;left:48px;top:20px;width:52px;height:52px}
        .p09-logo svg{width:52px;height:52px;fill:none;stroke:none}
        .p09-shutter{position:absolute;left:172px;top:8px;width:78px;height:78px;box-sizing:border-box;border:solid 4px #2b66a8;border-radius:50%;background:#2b66a8;box-shadow:inset 0 0 0 4px #fff;display:flex;align-items:center;justify-content:center;color:#fff}
        .p09-shutter svg{width:38px;height:38px;stroke-width:2.2}
        .p09-mic{position:absolute;left:290px;top:30px;width:34px;height:34px;color:#2b66a8}
        .p09-mic svg{width:34px;height:34px}
        .p13-photo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:240px;line-height:1;overflow:hidden}
        .p13-photo img{display:block;width:100%;height:100%;object-fit:cover}
        .p13-bg{background:url('img/p12_bg.jpg') center / cover no-repeat}
        .p13-opts{position:absolute;left:560px;top:180px;width:1295px;height:420px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:20px 48px;border-radius:20px;background:rgba(255,255,255,.50);box-shadow:0 0 0 5px rgba(5, 60, 133, 0.5)}
        .p13-opt{height:100px;box-sizing:border-box;padding:5px 10px 0 25px;display:flex;align-items:center;gap:20px;background:var(--c-white);border-radius:20px;
          font-family:'Cafe24 Ssurround';font-size:50px;color:var(--c-ink);letter-spacing:-0.05em;word-break:keep-all}
        .p13-opt span{flex:1 1 auto}
        .p13-opt span em{display:inline-flex;font-style:normal;font-size:46px;width:60px;height:60px;border-radius:50%;background:#023186;color:#ffe15a;align-items:center;justify-content:center;padding-top:5px;box-sizing:border-box}
        .p13-sound{flex:0 0 auto;width:74px;height:74px;margin-top:-8px;padding:0;border:solid 5px #266cc8;border-radius:50%;background:var(--c-white);color:#266cc8;display:flex;align-items:center;justify-content:center;cursor:pointer}
        .p13-sound svg{width:48px;height:48px;fill:currentColor;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
        .p13-sound:disabled{opacity:.35;cursor:default}
        .p13-sound.is-playing{background:#ffe15a}
        .p13-chars{position:absolute;left:560px;bottom:20px;width:1295px;display:flex;justify-content:center;align-items:flex-end}
        .p13-char{position:relative;flex:0 0 291px;height:390px;padding:0;border:0;background:none;cursor:pointer;display:flex;align-items:flex-end;justify-content:center}
        .p13-char img{display:block;max-width:none}
        .p13-char .is-over{position:absolute;left:50%;bottom:0;transform:translateX(-50%);opacity:0}
        .p13-char:hover .is-over{opacity:1}
        .p13-char:hover .is-base{opacity:0}
        .p13-res-score.avatar-card-text{font-size:110px;line-height:1.1;color:var(--c-violet);margin-top:-50px}
        .p13-res-btns{display:flex;gap:30px;margin-bottom:-90px;justify-content:flex-end}
        .p13-res-btns .avatar-card-btn{position:static;white-space:nowrap;min-width:0;padding-left:20px;padding-right:20px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="p13-bg">
          <p class="ask-pill has-stage is-fit"><i id="p13Stage">문제 1</i><span>잘못된 분석 1개를 골라 주세요.</span></p>
          <div class="phone-frame has-cam p13-phone">
            <div class="phone-screen p09-app">
              <div class="phone-status is-dark" data-time="1:27"></div>
              <div class="p09-top"><i data-ic="menu"></i><i data-ic="slvInfo"></i></div>
              <div class="p09-cam"><div class="p13-photo" id="p13Photo"></div></div>
              <div class="p09-tabs">
                <span class="p09-tab is-on"><i data-ic="slvAi"></i>AI 모드</span>
                <span class="p09-tab"><i data-ic="slvTt"></i>문자 인식</span>
                <span class="p09-tab"><i data-ic="slvFace"></i>얼굴 인식</span>
              </div>
              <div class="p09-ctrl">
                <span class="p09-logo"><i data-ic="slvLogo"></i></span>
                <span class="p09-shutter"><i data-ic="slvAi"></i></span>
                <span class="p09-mic"><i data-ic="mic"></i></span>
              </div>
              <div class="phone-nav"></div>
            </div>
          </div>
          <div class="p13-opts" id="p13Opts"></div>
          <div class="p13-chars" id="p13Chars"></div>

          <div class="avatar-modal is-off" id="p13Result">
            <div class="avatar-card is-side">
              <img class="avatar-card-avatar" src="../../resources/img/common/avatar_finish.png" alt="">
              <div class="avatar-card-body">
                <div>
                  <p class="avatar-card-title">채점결과</p>
                  <p class="avatar-card-text p13-res-score" id="p13Score"></p>
                  <div class="p13-res-btns">
                    <a href="javascript:;" class="avatar-card-btn card-btn is-popup js-sfx" id="p13Retry" data-sound="sound/click.mp3">틀린 문제 다시 풀기</a>
                    <a href="javascript:;" class="avatar-card-btn card-btn is-popup js-sfx" id="p13End" data-sound="sound/click.mp3">끝내기</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="카메라와 이미지 인식 퀴즈!" data-next="page13.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  (function () {
    const R = [
      { emoji: '🍎', opts: ['책상 위에 빨간색 사과가 있습니다', '동그란 모양의 과일입니다', '싱싱한 사과 2개가 놓여 있습니다'], wrong: 3 },
      { emoji: '🍌', opts: ['노란 바나나 3개가 송이로 묶여 있습니다', '선명한 노란색의 바나나입니다', '바나나 표면에 검은 반점이 보입니다'], wrong: 1 },
      { emoji: '📕', opts: ['선명하고 또렷한 글자 이미지 입니다', '교과서 표지에 글자가 인쇄 되어 있습니다', '‘내일의 날씨’ 라는 글자로 분석 됩니다'], wrong: 3 },
      { emoji: '😄', opts: ['입을 벌리고 환하게 웃고 있는 얼굴입니다', '화가 나서 눈살을 잔뜩 찌푸리고 있습니다', '단정하게 머리를 빗은 학생 입니다', '10대 학생의 얼굴로 분석 됩니다'], wrong: 2 },
      { emoji: '🚌', opts: ['파란색 버스입니다', '커다란 바퀴가 달린 이동수단 입니다', '아스팔트 도로 위를 지나가는 있습니다', '노란색 꼬마 유치원 버스가 달리고 있습니다'], wrong: 4 }
    ];
    const picked = [];
    let queue = [0, 1, 2, 3, 4], pos = 0, speaking = false;

    const sp = (t, btn) => {
      if (speaking) return;
      speaking = true;
      const all = Array.from(document.querySelectorAll('.p13-sound'));
      all.forEach((b) => { b.disabled = true; });
      btn.classList.add('is-playing');
      const done = () => { speaking = false; btn.classList.remove('is-playing'); all.forEach((b) => { b.disabled = false; }); };
      try {
        const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.onend = done; u.onerror = done;
        speechSynthesis.cancel(); speechSynthesis.speak(u);
      } catch (e) { setTimeout(done, 1500); }
    };

    function showRound() {
      const i = queue[pos], d = R[i];
      speaking = false;
      $('p13Stage').textContent = '문제 ' + (i + 1);
      $('p13Photo').innerHTML = '<img src="img/p13_photo_' + (i + 1) + '.png" alt="" onerror="this.replaceWith(document.createTextNode(\'' + d.emoji + '\'))">';
      $('p13Opts').innerHTML = '';
      d.opts.forEach((t, k) => {
        const row = document.createElement('div');
        row.className = 'p13-opt';
        row.innerHTML = '<span><em>' + (k + 1) + '</em> ' + t + '</span><button class="p13-sound" aria-label="음성 듣기"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" fill="none"/></svg></button>';
        row.querySelector('button').addEventListener('click', (e) => { playClick(); sp(t, e.currentTarget); });
        $('p13Opts').appendChild(row);
      });
      $('p13Chars').innerHTML = '';
      d.opts.forEach((t, k) => {
        const c = document.createElement('button');
        c.className = 'p13-char';
        c.setAttribute('aria-label', '캐릭터 ' + (k + 1));
        c.innerHTML = '<img class="is-base" src="img/p12_char_' + (k + 1) + '.png" alt=""><img class="is-over" src="img/p12_char_' + (k + 1) + '_over.png" alt="">';
        c.addEventListener('click', () => {
          try { speechSynthesis.cancel(); } catch (e) {}
          playClick();
          picked[i] = (k + 1) === d.wrong;
          pos += 1;
          if (pos < queue.length) showRound(); else showResult();
        });
        $('p13Chars').appendChild(c);
      });
    }

    function showResult() {
      const right = picked.filter(Boolean).length;
      $('p13Score').textContent = right * 20 + '점';
      $('p13Retry').style.display = right === R.length ? 'none' : '';
      $('p13Result').classList.remove('is-off');
      playCorrect();
    }

    $('p13Retry').addEventListener('click', () => {
      queue = R.map((d, i) => i).filter((i) => !picked[i]);
      pos = 0;
      $('p13Result').classList.add('is-off');
      showRound();
    });
    $('p13End').addEventListener('click', () => navigateTo('page13.html'));
    showRound();
  })();
  </script>
</body>
</html>
