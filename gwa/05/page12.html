<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이크가 듣는 소리파도를 해석하라!</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 31p. 공용 마무리 구성(end-*), 트로피 img/p12_trophy.png(뒤에 컨페티). 캐릭터는 임시로 sa/06 캐릭터 복사본 */
        .p12-character{left:10px;top:120px;width:700px;height:840px;overflow:hidden;z-index:10}
        .p12-trophy{position:absolute;left:1640px;top:40px;width:200px;height:200px;background:url('img/p12_trophy.png') center / contain no-repeat;z-index:2}
        .end-panel .end-desc{font-size:52px;line-height:1.4;letter-spacing:-0.04em}

<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="char-box p12-character"><img src="img/p_character_intro.png" alt="메인 캐릭터"></div>

          <p class="end-title">최고예요!</p>
          <div class="p12-trophy"></div>
          <div class="end-panel">
            <p class="end-desc">음파와 소리의 단서를 활용해<br>다섯개의 갈림길을 모두 통과했어요!</p>
            <p class="end-desc">음파의 높이와 간격을 정확하게 분석한 덕분에 올바른 문을 찾아 출구까지<br>도착할 수 있었어요.</p>
          </div>

          <a href="page10.html" class="js-nav-effect end-btn-retry">
            <img src="../../img/common/btn_retry.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_retry_on.png" data-src-over="../../img/common/btn_retry_over.png" data-sound="sound/click.mp3" alt="게임 다시하기">
          </a>
          <a href="../06/page01.html" class="js-nav-effect end-btn-next-lesson">
            <img src="../../img/common/btn_next_lesson.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_next_lesson_on.png" data-src-over="../../img/common/btn_next_lesson_over.png" data-sound="sound/click.mp3" alt="다음차시 학습하기">
          </a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="마이크가 듣는 소리파도를 해석하라!" data-next="../gwa.html"></script>
