<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS! 파도를 분석하라!</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 2p 안내 화면. 박스 안 구성은 과학 3차시 안내 화면 디자인 참고: 리본 제목 + 안내 문장 + '게임 방법' 상자. 캐릭터는 임시로 sa/06 캐릭터 복사본 */
        main{position:absolute;left:0;top:120px;width:1920px;height:960px}
        .intro-panel.p01-panel{justify-content:flex-start;gap:40px;padding:90px 60px 170px 70px}
        .intro-tab{top:-60px}
        .p01-lead{margin:0;font-size:42px;line-height:1.3;color:#1b1738;letter-spacing:-0.06em}
        .p01-how{position:relative;margin:0;padding:46px 50px 22px;border:solid 5px #023187;border-radius:12px;background:#dff4fc}
        .p01-how b{position:absolute;left:50%;top:-34px;transform:translateX(-50%);height:66px;padding:4px 50px 0;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;
          font-weight:normal;background:#023187;border-radius:33px;font-size:40px;color:#fff}
        .p01-how .intro-list{font-size:34px;color:#023187}
        .p01-how .intro-list li + li{margin-top:8px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="intro-character"><img src="img/p_character_intro.png" alt="메인 캐릭터"></div>
          <div class="intro-panel p01-panel">
            <p class="intro-tab">SOS! 파도를 분석하라!</p>
            <p class="p01-lead">철썩!<br>많은 사람들이 있는 해변에 다양한 파도가 밀려오고 있어요.<br>사람들이 크고 높은 파도에 대비할 수 있게,<br>화면에 표시된 파도의 모양을 확인하여 안내해주세요!</p>
            <div class="p01-how">
              <b>게임 방법</b>
            <ol class="intro-list">
              <li>1. 밀려오는 파도의 높이와 간격을 확인해요.<br>- 높이: 높은 파도와 낮은 파도<br>- 간격: 파도가 밀려오는 간격이 짧은 것과 긴 것</li>
              <li>2. 파도의 특징을 고르고, 확성기를 클릭하여 안내해요.</li>
            </ol>
            </div>
          </div>

          <a href="page02.html" class="js-nav-effect next-btn-activity">
            <img src="../../img/common/btn_start.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_start_on.png" data-src-over="../../img/common/btn_start_over.png" data-sound="sound/click.mp3" alt="시작하기">
          </a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="SOS! 파도를 분석하라!" data-next="page02.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
