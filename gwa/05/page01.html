      <p class="p-how-lead is-small">철썩! 많은 사람들이 있는 해변에 다양한 파도가 밀려오고 있어요. 사람들이 크고 높은 파도에 대비할 수 있게, 화면에 표시된 파도의 모양을 확인하여 안내해주세요!</p>
