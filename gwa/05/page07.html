<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI의 이미지 분석 정보 알아보기</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        .p07-tiles{position:absolute;left:425px;top:200px;width:1067px;display:flex;justify-content:space-between}
        .p07-tile{width:337px;height:370px;box-sizing:border-box;padding:0;border:solid 4px #2a6bd0;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;background:var(--c-white)}
        .p07-tile.is-q{cursor:pointer;border-color:#5f6f89}
        .p07-tile.is-q:hover{border-color:#2a6bd0;box-shadow:0 6px 16px rgba(42,107,208,.2)}
        .p07-head{flex:0 0 64px;width:100%;display:flex;align-items:center;justify-content:center;padding-top:4px;background:#91b7e8;font-family:'Cafe24 Ssurround';font-weight:400;font-size:56px;color:var(--c-white);letter-spacing:-0.07em}
        .p07-body{flex:1 1 auto;width:100%;display:flex;flex-direction:column;overflow:hidden}
        .p07-tile.is-q .p07-body{background:#dff3fd;align-items:center;justify-content:center}
        .p07-tile.is-q .p07-body img{height:240px;width:auto}
        .p07-body span{flex:1 1 auto;width:100%;display:flex;align-items:center;justify-content:center}
        .p07-body span img{display:block;max-height:185px}
        .p07-body b{flex:0 0 64px;width:100%;display:flex;align-items:center;justify-content:center;padding-bottom:8px;background:none;font-family:'Cafe24 Ssurround';font-weight:700;font-size:44px;color:var(--c-ink);letter-spacing:-0.07em;white-space:nowrap}
        .p07-cards{position:absolute;left:107px;top:645px;width:1707px;display:flex;justify-content:space-between}
        .p07-cards .card-btn{width:515px;min-width:0;height:225px;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 10px 0;font-size:70px}
        .p07-cards .card-btn img{display:block;flex:0 0 auto;max-height:200px}
        .p07-cards .card-btn:hover img{filter:url(#p07ScrHover)}
        .p07-cards .card-btn:active img,.p07-cards .card-btn.is-selected img,.p07-cards .card-btn.is-pressed img{filter:url(#p07ScrActive) drop-shadow(0 0 10px #ecbeff) drop-shadow(0 0 4px #ecbeff)}
        .p07-rcard{border-radius:50px}
        .p07-rcard .photo-card-title{font-size:80px;margin:0 0 20px}
        .photo-card.p07-rcard .photo-card-img{width:auto;height:auto;max-width:700px;max-height:330px}
        .p07-rcard .photo-card-text{font-size:60px;margin:20px 0 0}
        .p07-rfoot{display:flex;justify-content:flex-end;margin-top:10px}
        .p07-rfoot .card-btn{min-width:0;width:175px}
        .p07-hide,.card-btn.p07-hide{display:none}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="p07ScrHover" color-interpolation-filters="sRGB">
        <feFlood flood-color="#8278ff" flood-opacity="0.5" result="c"/>
        <feComposite in="c" in2="SourceAlpha" operator="in" result="m"/>
        <feBlend in="SourceGraphic" in2="m" mode="screen"/>
      </filter>
      <filter id="p07ScrActive" color-interpolation-filters="sRGB">
        <feFlood flood-color="#d168fb" flood-opacity="0.5" result="c"/>
        <feComposite in="c" in2="SourceAlpha" operator="in" result="m"/>
        <feBlend in="SourceGraphic" in2="m" mode="screen"/>
      </filter>
    </defs>
  </svg>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="stage-board has-floor"></div>
          <p class="ask-pill is-fit"><span id="p07Ask">AI가 분석한 이미지 속 사물의 특징을 살펴볼까요?</span></p>
          <div class="p07-tiles" id="p07Tiles"></div>
          <div class="p07-cards opts" id="p07Cards"></div>

          <div class="photo-modal is-middle is-off" id="p07Right">
            <div class="photo-card is-small is-contain p07-rcard">
              <p class="photo-card-title">정답이에요!</p>
              <img class="photo-card-img" id="p07Photo" alt="">
              <p class="photo-card-text" id="p07RightSub"></p>
              <div class="p07-rfoot"><button class="card-btn is-popup is-arrow js-sfx" id="p07RightNext" data-sound="sound/click.mp3">→</button></div>
            </div>
          </div>
          <div class="ox-result-wrong is-avatar is-off" id="p07Wrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">AI가 분석한 사물의 특징을<br>다시 한번 살펴볼까요?</p>
              </div>
            </div>
          </div>

          <div class="avatar-modal is-off" id="p07Done">
            <div class="avatar-card">
              <img class="avatar-card-avatar" src="../../resources/img/common/avatar_finish.png" alt="">
              <div class="avatar-card-body">
                <div class="step-flow">
                  <div class="step-panel is-title">
                    <p class="avatar-card-text">AI가 분석한 정보를 보고, 어떤 이미지인지 모두 맞췄어요.</p>
                    <a href="page08.html" class="avatar-card-btn card-btn is-popup is-arrow js-nav-effect js-sfx" data-sound="sound/click.mp3">→</a>
                  </div>
                  <div class="step-panel">
                    <p class="avatar-card-text">AI는 모양과 색깔 외에도 선, 패턴, 그림자 같은 훨씬 더 많고 세밀한 정보를 다양하게 분석하여 이미지의 특징을 찾아내요.</p>
                    <a href="page08.html" class="avatar-card-btn card-btn is-popup is-arrow js-nav-effect js-sfx" data-sound="sound/click.mp3">→</a>
                  </div>
                  <div class="step-panel">
                    <p class="avatar-card-text">설리번 플러스에서 카메라에 비친 모습을 AI가 어떻게 설명해 주는지 직접 확인해볼까요?</p>
                    <a href="page08.html" class="avatar-card-btn card-btn is-popup is-start js-nav-effect js-sfx" data-sound="sound/click.mp3">다음</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="AI의 이미지 분석 정보 알아보기" data-next="page08.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  (function () {
    const QS = [
      { chips: ['둥근 모양', '빨간색', '꼭지와 잎'],
        opts: [['사과', true], ['토마토'], ['공']], fb: 'AI가 분석한 이미지는 사과였어요.' },
      { chips: ['길쭉하고 휘어진 모양', '노란색', '꼭지'],
        opts: [['레몬'], ['초승달'], ['바나나', true]], fb: 'AI가 분석한 이미지는 바나나였어요.' },
      { chips: ['길쭉한 네모 모양', '파란색', '많은 창문과 큰 문'],
        opts: [['트럭'], ['버스', true], ['승용차']], fb: 'AI가 분석한 이미지는 버스였어요.' }
    ];
    const KINDS = ['shape', 'color', 'feat'];
    const LABELS = ['모양', '색깔', '특징'];
    const img = (n) => '<img src="img/p07_q' + (q + 1) + '_' + n + '.png" alt="">';
    let q = 0;

    function fit(el) {
      let f = 44;
      el.style.fontSize = f + 'px';
      while (el.scrollWidth > el.clientWidth && f > 24) { f -= 2; el.style.fontSize = f + 'px'; }
    }

    function startQ() {
      const d = QS[q];
      const tiles = $('p07Tiles');
      tiles.innerHTML = '';
      LABELS.forEach((label, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'p07-tile is-q';
        btn.innerHTML = '<div class="p07-head">' + label + '</div><div class="p07-body"><img src="img/p07_question.png" alt="' + label + ' 확인하기"></div>';
        btn.addEventListener('click', () => {
          if (!btn.classList.contains('is-q')) return;
          playClick();
          btn.classList.remove('is-q');
          btn.disabled = true;
          const body = btn.querySelector('.p07-body');
          body.innerHTML = '<span>' + img(KINDS[i]) + '</span><b>' + d.chips[i] + '</b>';
          fit(body.querySelector('b'));
        });
        tiles.appendChild(btn);
      });

      $('p07Cards').innerHTML = '';
      d.opts.forEach((o, i) => {
        makeCardBtn(img('c' + (i + 1)) + '<span>' + o[0] + '</span>', '', () => pick(!!o[1]), { html: true, parent: $('p07Cards') });
      });
    }

    function pick(right) {
      playClick();
      if (!right) {
        playWrong();
        flashLayer($('p07Wrong'), 'is-off', 2000);
        return;
      }
      playCorrect();
      $('p07Photo').src = 'img/p07_q' + (q + 1) + '_photo.png';
      $('p07RightSub').textContent = QS[q].fb;
      Array.from($('p07Cards').children).forEach((b) => { b.disabled = true; });
      $('p07Right').classList.remove('is-off');
    }

    $('p07RightNext').addEventListener('click', () => {
      $('p07Right').classList.add('is-off');
      if (q < QS.length - 1) { q += 1; startQ(); }
      else $('p07Done').classList.remove('is-off');
    });

    startQ();
  })();
  </script>
</body>
</html>
