<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 비서와 똑똑하게 소통하기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서(5차시 실습만) 1~6p ai_practice~ai_practice_04를 한 페이지 흐름으로.
           폰 화면은 캡처 없이 배경에 Google Assistant 앱 하나만 가운데 두고, 입력창·결과 카드는 HTML/CSS로 그림.
           마이크 → 구체적으로 질문 안내 → [오케이 구글!] → 명령 4가지를 순서대로(결과 카드 + 설명) → 정리 팝업 2단계 → page09 퀴즈. Assistant 로고 img/p08_assistant_logo.png */

        .p08-bubble{font-size:42px;line-height:1.3;padding:30px 24px}
        .p08-bubble.has-ok{padding-bottom:116px}
        .p08-ok.card-btn{position:absolute;right:20px;bottom:34px;min-width:0;width:170px;height:68px;padding:6px 0 0;font-size:40px;line-height:1}
        .p08-ok.is-off{display:none}

        .p08-phone{left:710px;top:24px;width:500px;height:910px}
        .p08-screen{position:relative;width:100%;height:100%;border-radius:54px;overflow:hidden;background:linear-gradient(160deg,#3a6ea5,#7fb3e8 45%,#c9e2f7);font-family:'Pretendard'}
        .p08-screen:before{content:'';position:absolute;left:50%;top:18px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--c-ink);z-index:3}
        .p08-app{position:absolute;left:50%;top:38%;width:150px;margin-left:-75px;display:flex;flex-direction:column;align-items:center;gap:12px;font-size:26px;font-weight:600;color:var(--c-white);text-shadow:0 1px 3px rgba(0,0,0,.4)}
        .p08-app i{display:block;width:130px;height:130px;border-radius:34px;background:var(--c-white) url('img/p08_assistant_logo.png') center / 92% no-repeat;box-shadow:0 6px 14px rgba(0,0,0,.2)}
        .p08-nav{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:space-around;font-size:36px;color:rgba(255,255,255,.85)}

        .p08-bar{position:absolute;left:24px;right:24px;bottom:84px;height:92px;box-sizing:border-box;padding:0 18px;display:flex;align-items:center;gap:16px;border-radius:46px;background:#121316;color:var(--c-white);font-size:24px;z-index:2}
        .p08-bar .plus{flex:0 0 auto;font-size:44px;font-weight:300;line-height:1}
        .p08-bar .say{flex:1 1 auto;min-width:0;line-height:1.15}
        .p08-bar .mic{flex:0 0 auto;width:56px;height:56px;border-radius:50%;background:#e8e8ec;color:#121316;display:flex;align-items:center;justify-content:center;font-size:30px}
        .p08-bar .wave{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:6px;height:50px}
        .p08-bar .wave i{display:block;width:5px;border-radius:3px;background:#e8e8ec;animation:p08-wave .8s ease-in-out infinite}
        .p08-bar .stop{flex:0 0 auto;width:56px;height:56px;border-radius:50%;background:#e8e8ec;display:flex;align-items:center;justify-content:center}
        .p08-bar .stop:after{content:'';width:20px;height:20px;border-radius:5px;border:solid 4px #121316;box-sizing:border-box}
        @keyframes p08-wave{50%{height:34px}}
        .p08-bar .wave i{height:10px}
        .p08-bar .wave i:nth-child(3n+1){animation-delay:.1s} .p08-bar .wave i:nth-child(3n+2){animation-delay:.3s} .p08-bar .wave i:nth-child(3n){animation-delay:.5s}

        .p08-card{position:absolute;left:24px;right:24px;bottom:196px;box-sizing:border-box;padding:26px 28px 22px;border-radius:34px;background:#121316;color:var(--c-white);font-size:25px;line-height:1.45;z-index:2}
        .p08-card small{display:block;margin-top:12px;font-size:19px;color:#a8aab3}
        .p08-card .big{margin:0;font-size:56px;font-weight:300;line-height:1.2}
        .p08-card .tag{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:22px;color:#c9cad2}
        .p08-card .music{display:flex;align-items:center;gap:20px}
        .p08-card .music i{flex:0 0 auto;width:110px;height:110px;border-radius:14px;background:radial-gradient(circle,#0a2a3a 0 22%,#25d0d0 24% 44%,#8a4bd6 46% 70%,#ff4f9a 72%)}
        .p08-card .music b{font-size:30px}
        .p08-card .music span{display:block;margin-top:4px;font-size:22px;color:#a8aab3}
        .p08-card.is-off, .p08-bar.is-off{display:none}

        .p08-mic{position:absolute;left:1330px;top:300px;width:340px;height:340px;padding:0;border:solid 8px var(--c-ink);border-radius:50%;background:var(--c-white);cursor:pointer;font-size:170px;line-height:1;box-shadow:0 12px 0 0 var(--c-sky-pale)}
        .p08-mic:hover{transform:scale(1.05)}
        .p08-mic:active{transform:scale(.95)}
        .p08-mic.is-off{display:none}

        .p08-wake.card-btn{position:absolute;left:1411px;top:141px;min-width:0;width:330px;height:107px;padding:10px 10px 4px;font-size:52px}
        .p08-cmd.card-btn{position:absolute;left:1309px;min-width:0;width:556px;height:112px;padding:8px 24px 2px;display:flex;align-items:center;justify-content:center;font-size:42px;line-height:1.15}
        .p08-cmd1{top:300px} .p08-cmd2{top:440px} .p08-cmd3{top:580px} .p08-cmd4{top:720px}
        .p08-wake.is-off, .p08-cmd.is-off{display:none}
        .p08-wake:disabled, .p08-cmd:disabled{cursor:default}
        .p08-cmd.is-dim{opacity:.45}
        .p08-cmd.is-done{opacity:.6}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <p class="guide-bubble is-center p08-bubble" id="p08Bubble"><span id="p08Text"></span><button type="button" class="card-btn js-sfx p08-ok is-off" id="p08Ok" data-sound="sound/click.mp3">확인</button></p>
          <div class="guide-character"><img src="img/p_character_main.png" alt="메인 캐릭터"></div>

          <div class="phone-frame p08-phone">
            <div class="p08-screen">
              <div class="p08-app"><i></i>Assistant</div>
              <div class="p08-card is-off" id="p08Card"></div>
              <div class="p08-bar is-off" id="p08Bar"></div>
              <div class="p08-nav"><span>|||</span><span>○</span><span>‹</span></div>
            </div>
          </div>

          <button type="button" class="p08-mic" id="p08Mic" aria-label="마이크">🎤</button>

          <button type="button" class="card-btn js-sfx p08-wake is-off" id="p08Wake" data-sound="sound/click.mp3">오케이 구글!</button>
          <button type="button" class="card-btn js-sfx p08-cmd p08-cmd1 is-off" data-sound="sound/click.mp3" data-i="0">세종대왕에 대해 알려줘</button>
          <button type="button" class="card-btn js-sfx p08-cmd p08-cmd2 is-off" data-sound="sound/click.mp3" data-i="1">내일 아침 7시 알람 맞춰줘</button>
          <button type="button" class="card-btn js-sfx p08-cmd p08-cmd3 is-off" data-sound="sound/click.mp3" data-i="2">유튜브 음악에서 신나는 음악을 재생해줘</button>
          <button type="button" class="card-btn js-sfx p08-cmd p08-cmd4 is-off" data-sound="sound/click.mp3" data-i="3">‘감사합니다’를 영어로 번역해줘</button>

          <div class="avatar-modal is-off" id="p08Done">
            <div class="avatar-card">
              <img class="avatar-card-avatar" src="../../img/common/avatar_finish.png" alt="">
              <div class="step-flow">
                <div class="step-panel">
                  <div class="avatar-card-body is-side">
                    <p class="avatar-card-text">‘오케이 구글’로 핸드폰을 깨우고, 구체적으로 명령하니까 AI가 우리가 원하는 일을 정확하게 처리해 주었어요.</p>
                  </div>
                  <a href="page09.html" class="js-nav-effect avatar-card-btn">
                    <img src="../../img/common/btn_arrow_small.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_arrow_small_on.png" data-src-over="../../img/common/btn_arrow_small_over.png" data-sound="sound/click.mp3" alt="다음">
                  </a>
                </div>
                <div class="step-panel">
                  <div class="avatar-card-body is-side">
                    <p class="avatar-card-text">이렇게 AI 비서에게는 정확한 호출어와 구체적인 질문을 전달하는 것이 아주 중요해요. 이제 퀴즈를 풀며 배운 내용을 확인해 볼까요?</p>
                  </div>
                  <a href="page09.html" class="js-nav-effect avatar-card-btn">
                    <img src="../../img/common/btn_next_small.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_next_small_on.png" data-src-over="../../img/common/btn_next_small_over.png" data-sound="sound/click.mp3" alt="다음">
                  </a>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="AI 비서와 똑똑하게 소통하기" data-next="page09.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const CMDS = [
      { cards: ['<p>세종대왕은 조선의 제4대 국왕으로, 백성을 위해 우리 고유의 문자인 훈민정음을 창제한 인물입니다. 집현전을 통해 학문과 인재를 육성하고 측우기와 해시계 등 과학기술을 발전시켰으며, 북방 4군 6진을 개척해 영토를 확장하는 등 다방면에서 큰 업적을 남겼습니다.</p><small>Gemini는 AI이며 실수를 할 수 있습니다.</small>'],
        say: '‘왕’이 아닌, ‘세종대왕’이라고 명확히 말하니 원하는 정보를 확인할 수 있어요.' },
      { cards: ['<div class="tag">⏰ 알람 · 설정 ✓</div><p class="big">오전 7:00</p>'],
        say: '내일 오전 7시 알람이 설정되었어요. 날짜와 시간을 구체적으로 알려주어야 원하는 시간에 알람을 설정할 수 있어요.' },
      { connect: 'YouTube Music에 연결 중',
        cards: ['<div class="tag">▶ YouTube Music</div><div class="music"><i></i><div><b>에너제틱 국내 댄스 음악</b><span>재생목록</span></div></div>'],
        say: '‘노래 틀어’가 아니라 ‘신나는 음악’처럼 원하는 분위기의 노래를 말해야 해요.' },
      { cards: ['<p>‘감사합니다’는 영어로 “Thank you”라고 해요. 더 편한 사이에서는 간단하게 “Thanks”라고 말해도 돼요.</p><small>Gemini는 AI이며 실수를 할 수 있습니다.</small>'],
        say: '번역할 문장과 바꿀 언어를 함께 알려주어야 정확한 번역을 할 수 있어요.' }
    ];

    const bubble = $('p08Bubble');
    const text = $('p08Text');
    const ok = $('p08Ok');
    const mic = $('p08Mic');
    const wake = $('p08Wake');
    const bar = $('p08Bar');
    const card = $('p08Card');
    const cmds = Array.from(document.querySelectorAll('.p08-cmd'));
    let step = 0;
    let current = 0;
    let done = 0;
    let timer = null;

    // 말풍선은 아래가 고정이라 글이 길면 위로 늘어남 → 위쪽 끝(30px)을 넘으면 글자를 2px씩 줄임
    const say = (t, withOk) => {
      bubble.style.fontSize = '';
      text.textContent = t;
      bubble.classList.toggle('has-ok', !!withOk);
      ok.classList.toggle('is-off', !withOk);
      let size = parseFloat(getComputedStyle(bubble).fontSize);
      while (bubble.offsetTop < 30 && size > 26) { size -= 2; bubble.style.fontSize = size + 'px'; }
    };
    const finger = (el) => { clearFingers(); if (el) pointFingerAt(el, { onMain: true }); };

    // 폰 아래 입력창 상태: idle(물어보기) / listen(듣는 중 막대) / wait(문구 + 정지)
    function setBar(kind, label) {
      bar.classList.remove('is-off');
      if (kind === 'listen') {
        let bars = '';
        for (let i = 0; i < 15; i++) bars += '<i></i>';
        bar.innerHTML = '<span class="plus">+</span><span class="wave">' + bars + '</span><span class="mic">🎤</span>';
      } else if (kind === 'wait') {
        bar.innerHTML = '<span class="say">' + label + '</span><span class="stop"></span>';
      } else {
        bar.innerHTML = '<span class="plus">+</span><span class="say">Assistant에게 물어보기</span><span class="mic">🎤</span>';
      }
    }
    const setCard = (html) => {
      card.classList.toggle('is-off', !html);
      if (html) card.innerHTML = html;
    };

    function paintCmds(now, active) {
      cmds.forEach((c, i) => {
        c.classList.remove('is-off', 'is-selected');
        c.classList.toggle('is-done', i < now);
        c.classList.toggle('is-dim', i > now || (i === now && !active));
        c.disabled = !(i === now && active);
      });
    }

    function intro() {
      say('스마트폰의 Google Assistant를 직접 사용하려면, 마이크를 먼저 깨워야 해요! 마이크를 클릭해볼까요?', false);
      finger(mic);
      // 마이크는 동그라미라서 기본 위치(사각형 모서리)보다 마이크 쪽으로 붙임
      const fg = document.querySelector('.js-point-finger');
      if (fg) { fg.style.width = '200px'; fg.style.left = '1560px'; fg.style.top = '520px'; }
    }

    mic.addEventListener('click', () => {
      clearFingers();
      mic.classList.add('is-off');
      playClick();
      setBar('idle');
      say('둘째, AI가 헷갈리지 않게 구체적으로 질문해야 원하는 답을 얻을 수 있어요. 한번 명령을 해볼까요?', true);
      ok.textContent = '다음';
      step = 1;
      finger(ok);
    });

    function ready(now) {
      current = now;
      setBar('idle');
      setCard('');
      say('오케이 구글! 버튼을 클릭 후, 아래의 [명령버튼]을 클릭하세요.', false);
      wake.classList.remove('is-off', 'is-selected');
      wake.disabled = false;
      paintCmds(now, false);
      finger(wake);
    }

    ok.addEventListener('click', () => {
      if (step === 1) { step = 2; ready(0); return; }
      if (step === 3) {
        if (done < CMDS.length - 1) { step = 2; ready(done + 1); return; }
        clearFingers();
        $('p08Done').classList.remove('is-off');
      }
    });

    wake.addEventListener('click', () => {
      wake.disabled = true;
      wake.classList.add('is-selected');
      setBar('listen');
      paintCmds(current, true);
      finger(cmds[current]);
    });

    cmds.forEach((c) => c.addEventListener('click', () => {
      const i = Number(c.dataset.i);
      cmds.forEach((x) => { x.disabled = true; });
      c.classList.add('is-selected');
      clearFingers();
      setBar('wait', '잠시 기다려 주세요…');
      clearTimeout(timer);
      timer = setTimeout(() => result(i), 3000);
    }));

    function result(i) {
      const d = CMDS[i];
      const finish = () => {
        setBar('idle');
        setCard(d.cards[0]);
        step = 3;
        done = i;
        cmds.forEach((x, k) => { x.classList.toggle('is-done', k < i); x.classList.toggle('is-dim', k > i); x.disabled = true; });
        ok.textContent = '확인';
        say(d.say, true);
        finger(ok);
      };
      if (d.connect) {
        setBar('wait', '▶ ' + d.connect);
        setTimeout(finish, 2000);
      } else {
        finish();
      }
    }

    intro();
  })();
  </script>
</body>
</html>
