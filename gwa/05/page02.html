<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카메라에 찍힌 범인을 찾아라!</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        .p02-board{top:37px;height:891px;--board-floor:561px}
        .p02-count{position:absolute;left:70px;top:72px;width:318px;height:96px;box-sizing:border-box;margin:0;padding-top:10px;display:flex;align-items:center;justify-content:center;
          background:#7ba5e8;border-radius:48px;box-shadow:0 8px 0 0 rgba(86,148,231,.25);font-family:'Cafe24 Ssurround';font-size:76px;color:var(--c-white);letter-spacing:-0.02em}
        .p02-mon{position:absolute;left:493px;top:55px;width:934px;height:528px;box-sizing:border-box;border:solid #2a3547;border-width:13px 17px 15px;border-radius:24px;background:#2a3547;overflow:hidden}
        .p02-mon img{display:block;width:100%;height:100%;object-fit:cover}
        #p02Cul{position:absolute;inset:0}
        .p02-rec{position:absolute;border-radius:50%;animation:p02-rec 1s infinite}
        @keyframes p02-rec{0%,49%{opacity:0}50%,100%{opacity:1}}
        .p02-cands{position:absolute;left:225px;top:636px;width:1470px;display:flex;justify-content:space-between}
        .p02-cand{position:relative;width:270px;height:265px;box-sizing:border-box;padding:0;overflow:hidden;background:var(--c-white);border:solid 5px var(--c-white);border-radius:14px;cursor:pointer;box-shadow:0 6px 0 0 rgba(1,24,92,.3)}
        .p02-cand img{display:block}
        .p02-cand .p02-face{width:100%;height:100%;object-fit:cover}
        .p02-cand:hover:not(.is-caught){outline:solid 6px var(--c-violet);outline-offset:-1px}
        .p02-cand:active:not(.is-caught){outline-color:var(--c-orchid)}
        .p02-cand.is-wrong{animation:fix-word-shake .3s ease}
        .p02-cage{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:fill;transform:translateY(-100%);transition:transform .5s ease-in}
        .p02-cand.is-caught .p02-cage{transform:none}
        .p02-stamp{position:absolute;left:50%;top:50%;margin:0;transform:translate(-50%,-50%) scale(2.2);opacity:0;pointer-events:none}
        .p02-cand.is-caught .p02-stamp{opacity:1;transform:translate(-50%,-50%) scale(1);transition:transform .25s ease .5s,opacity .1s ease .5s}
        .p02-lock .p02-cand{pointer-events:none}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default" id="p02Main">
          <div class="stage-board has-floor p02-board"></div>
          <p class="p02-count" id="p02Count">1/5</p>
          <div class="p02-mon"><div id="p02Cul"></div></div>
          <div class="p02-cands" id="p02Cands"></div>

          <div class="ox-result-wrong is-avatar is-off" id="p02Wrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">범인의 모습이 찍힌 사진(이미지)를<br>다시 한번 확인해 볼까요?</p>
              </div>
            </div>
          </div>

          <div class="avatar-modal is-off" id="p02Done">
            <div class="avatar-card">
              <img class="avatar-card-avatar" src="../../resources/img/common/avatar_finish.png" alt="">
              <div class="avatar-card-body">
                <div class="step-flow">
                  <div class="step-panel is-title">
                    <p class="avatar-card-title">정말 잘했어요!</p>
                    <p class="avatar-card-text">범인을 모두 검거하는데 성공했어요.</p>
                    <a href="page03.html" class="avatar-card-btn card-btn is-popup is-arrow js-nav-effect js-sfx" data-sound="sound/click.mp3">→</a>
                  </div>
                  <div class="step-panel">
                    <p class="avatar-card-text">우리가 눈으로 사람을 알아보듯, 컴퓨터는 카메라를 통해 이미지를 입력 받아 사람을 찾아낼 수 있어요.</p>
                    <a href="page03.html" class="avatar-card-btn card-btn is-popup is-arrow js-nav-effect js-sfx" data-sound="sound/click.mp3">→</a>
                  </div>
                  <div class="step-panel">
                    <p class="avatar-card-text">컴퓨터가 카메라로 세상을 바라보고 이미지를 분석하는 방법에 대해 알아볼까요?</p>
                    <a href="page03.html" class="avatar-card-btn card-btn is-popup js-nav-effect js-sfx" data-sound="sound/click.mp3">다음</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="카메라에 찍힌 범인을 찾아라!" data-next="page03.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  (function () {
    const main = $('p02Main'), cands = $('p02Cands');
    const REC = [[41, 41, 11, '#5b595a'], [46, 41, 12, '#625f56'], [44, 39, 12, '#72757e'], [43, 38, 12, '#212022'], [41, 40, 11, '#666264']];
    const order = shuffleArray([0, 1, 2, 3, 4]);
    let round = 0;

    function setRound() {
      const target = order[round];
      $('p02Count').textContent = (round + 1) + '/5';
      const rc = REC[target];
      $('p02Cul').innerHTML = '<img src="img/p02_cctv_' + (target + 1) + '.png" alt=""><i class="p02-rec" style="left:' + (rc[0] - rc[2]) + 'px;top:' + (rc[1] - rc[2]) + 'px;width:' + rc[2] * 2 + 'px;height:' + rc[2] * 2 + 'px;background:' + rc[3] + '"></i>';
      cands.innerHTML = '';
      shuffleArray([0, 1, 2, 3, 4]).forEach((f) => {
        const b = document.createElement('button');
        b.className = 'p02-cand';
        b.setAttribute('aria-label', '사람 ' + (f + 1));
        b.innerHTML = '<img class="p02-face" src="img/p02_face_' + (f + 1) + '.png" alt=""><img class="p02-cage" src="img/p02_cage.png" alt=""><img class="p02-stamp" src="img/p02_stamp.png" alt="">';
        b.addEventListener('click', () => pick(b, f === target));
        cands.appendChild(b);
      });
      main.classList.remove('p02-lock');
    }

    function pick(btn, right) {
      if (!right) {
        playWrong();
        btn.classList.remove('is-wrong'); void btn.offsetWidth; btn.classList.add('is-wrong');
        flashLayer($('p02Wrong'), 'is-off', 2000);
        return;
      }
      main.classList.add('p02-lock');
      playCorrect();
      btn.classList.add('is-caught');
      round += 1;
      setTimeout(() => {
        if (round < 5) setRound();
        else $('p02Done').classList.remove('is-off');
      }, 2200);
    }
    setRound();
  })();
  </script>
</body>
</html>
