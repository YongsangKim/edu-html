<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 집 속 숨은 카메라 찾기</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        .hunt-house{left:284px;top:119px}
        .hunt-obj[data-key="phone"]{left:507px;top:279px}
        .hunt-obj[data-key="cctv"]{left:1145px;top:319px}
        .hunt-obj[data-key="laptop"]{left:538px;top:530px}
        .hunt-obj[data-key="game"]{left:1140px;top:566px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="stage-board"></div>
          <p class="ask-pill is-fit"><span>카메라가 있는 물건을 찾아 클릭해 보세요.</span></p>
          <img class="hunt-house" src="img/p05_house.png" alt="">
          <button class="hunt-obj" data-key="phone" aria-label="스마트폰"><img src="img/p05_obj_phone.png" alt=""></button>
          <button class="hunt-obj" data-key="cctv" aria-label="가정용 CCTV"><img src="img/p05_obj_cctv.png" alt=""></button>
          <button class="hunt-obj" data-key="laptop" aria-label="노트북"><img src="img/p05_obj_laptop.png" alt=""></button>
          <button class="hunt-obj" data-key="game" aria-label="동작인식 게임기"><img src="img/p05_obj_game.png" alt=""></button>

          <div class="avatar-modal hunt-modal is-off" id="p05Info">
            <div class="avatar-card">
              <img class="avatar-card-avatar" src="../../resources/img/common/avatar_finish.png" alt="">
              <div class="avatar-card-body">
                <div>
                  <p class="avatar-card-title" id="p05Title"></p>
                  <p class="avatar-card-text" id="p05Text"></p>
                  <a href="javascript:;" class="avatar-card-btn card-btn is-popup js-sfx" id="p05Next" data-sound="sound/click.mp3">다음</a>
                </div>
              </div>
            </div>
          </div>

          <div class="avatar-modal is-off" id="p05Done">
            <div class="avatar-card">
              <img class="avatar-card-avatar" src="../../resources/img/common/avatar_finish.png" alt="">
              <div class="avatar-card-body">
                <div class="step-flow">
                  <div class="step-panel is-title">
                    <p class="avatar-card-text">집 안 곳곳에서 카메라가 달린 물건을 모두 찾았어요.</p>
                    <a href="page06.html" class="avatar-card-btn card-btn is-popup is-arrow js-nav-effect js-sfx" data-sound="sound/click.mp3">→</a>
                  </div>
                  <div class="step-panel">
                    <p class="avatar-card-text">카메라는 컴퓨터에 사람이나 주변 모습의 이미지를 전달해요. AI는 이 이미지를 어떤 순서로 분석하는지 알아볼까요?</p>
                    <a href="page06.html" class="avatar-card-btn card-btn is-popup js-nav-effect js-sfx" data-sound="sound/click.mp3">다음</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="우리 집 속 숨은 카메라 찾기" data-next="page06.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  (function () {
    const INFO = {
      game: ['동작인식 게임기', '카메라가 내 몸의 움직임을 알아보면 게임 속 캐릭터도 따라 움직여요.'],
      cctv: ['가정용 CCTV', '카메라가 집 안을 촬영하면서 집 안의 상황을 살펴 안전을 지키는데 도움을 줘요.'],
      phone: ['스마트폰', '카메라가 내 얼굴을 알아보면 잠금이 풀리도록 설정할 수 있어요.'],
      laptop: ['노트북', '카메라로 내 모습을 실시간으로 보여주며 멀리있는 친구와도 얼굴을 보며 영상 통화를 할 수 있어요.']
    };
    const objs = Array.from(document.querySelectorAll('.hunt-obj'));
    let found = 0;
    objs.forEach((o) => o.addEventListener('click', () => {
      if (o.classList.contains('is-found')) return;
      playClick();
      o.classList.add('is-found');
      found += 1;
      $('p05Title').textContent = INFO[o.dataset.key][0];
      $('p05Text').textContent = INFO[o.dataset.key][1];
      $('p05Info').classList.remove('is-off');
    }));
    $('p05Next').addEventListener('click', () => {
      $('p05Info').classList.add('is-off');
      if (found === objs.length) $('p05Done').classList.remove('is-off');
    });
  })();
  </script>
</body>
</html>
