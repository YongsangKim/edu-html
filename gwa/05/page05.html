<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 집 속 숨은 마이크 찾기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 9~11p. 집 구조도(방 칸은 HTML로 그림, 배경 그림은 img/p05_house.png) 위에 마이크가 있는 물건 4개(순서 자유).
           물건에 마우스를 올리면 외곽선, 누르면 설명 팝업 → 다음. 4개 다 찾으면 마무리 안내 2단계. 물건 그림 img/p05_obj_{key}.png */

        .p05-guide{position:absolute;left:360px;top:30px;width:1200px;height:96px;margin:0;box-sizing:border-box;padding-top:6px;display:flex;align-items:center;justify-content:center;
          background:var(--c-white);border:solid 5px var(--c-ink);border-radius:48px;box-shadow:0 10px 0 0 var(--c-sky-pale);font-family:'Cafe24 Ssurround';font-size:50px;color:var(--c-ink);letter-spacing:-0.05em}
        .p05-count{position:absolute;left:1600px;top:30px;width:220px;height:96px;margin:0;box-sizing:border-box;padding-top:6px;display:flex;align-items:center;justify-content:center;
          background:var(--c-ink);border-radius:48px;font-family:'Cafe24 Ssurround';font-size:50px;color:var(--c-white)}

        .p05-house{position:absolute;left:100px;top:160px;width:1720px;height:770px;box-sizing:border-box;border:solid 12px var(--c-ink);border-radius:24px;background:#f6efe2 url('img/p05_house.png') center / cover no-repeat}
        .p05-room{position:absolute;box-sizing:border-box;border:solid 6px #8b6b4a;background:rgba(255,255,255,.25)}
        .p05-room span{position:absolute;left:18px;top:14px;height:56px;padding:4px 24px 0;box-sizing:border-box;display:flex;align-items:center;background:var(--c-ink);border-radius:28px;font-family:'Cafe24 Ssurround';font-size:34px;color:var(--c-white)}
        .p05-room.is-small span{background:#8b6b4a}

        .p05-obj{position:absolute;padding:0;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
        .p05-obj i{display:block;width:100%;height:100%;border-radius:18px;background:var(--c-white) center / contain no-repeat;transition:filter .2s,transform .2s}
        .p05-obj:hover i{filter:drop-shadow(0 0 0 var(--c-yellow)) drop-shadow(0 0 6px var(--c-yellow)) drop-shadow(0 0 6px var(--c-yellow));transform:scale(1.05)}
        .p05-obj.is-found{pointer-events:none}
        .p05-obj.is-found:after{content:'✔';position:absolute;right:-18px;top:-18px;width:60px;height:60px;border-radius:50%;background:#1f9d4c;color:var(--c-white);font-size:36px;line-height:60px;text-align:center}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <p class="p05-guide">마이크가 있는 물건을 찾아 클릭해 보세요.</p>
          <p class="p05-count" id="p05Count">0 / 4</p>

          <div class="p05-house">
            <div class="p05-room" style="left:0;top:0;width:520px;height:440px"><span>방</span></div>
            <div class="p05-room is-small" style="left:0;top:440px;width:520px;height:306px"><span>욕실</span></div>
            <div class="p05-room" style="left:520px;top:0;width:780px;height:746px"><span>거실</span></div>
            <div class="p05-room is-small" style="left:1300px;top:0;width:396px;height:440px"><span>주방</span></div>
            <div class="p05-room" style="left:1300px;top:440px;width:396px;height:306px"><span>현관</span></div>

            <button class="p05-obj" data-key="speaker" style="left:620px;top:150px;width:180px;height:240px" aria-label="AI 스마트 스피커"><i style="background-image:url('img/p05_obj_speaker.png')"></i></button>
            <button class="p05-obj" data-key="remote" style="left:960px;top:440px;width:90px;height:200px" aria-label="음성 인식 TV 리모컨"><i style="background-image:url('img/p05_obj_remote.png')"></i></button>
            <button class="p05-obj" data-key="phone" style="left:180px;top:130px;width:135px;height:240px" aria-label="스마트폰"><i style="background-image:url('img/p05_obj_phone.png')"></i></button>
            <button class="p05-obj" data-key="intercom" style="left:1420px;top:520px;width:160px;height:180px" aria-label="인터폰"><i style="background-image:url('img/p05_obj_intercom.png')"></i></button>
          </div>

          <div class="avatar-modal is-off" id="p05Found">
            <div class="avatar-card is-small">
              <img class="avatar-card-avatar" src="../../img/common/avatar_correct_gwa.png" alt="">
              <p class="avatar-card-title" id="p05FoundTitle"></p>
              <p class="avatar-card-text" id="p05FoundText"></p>
              <button class="avatar-card-btn" id="p05FoundNext" style="padding:0;border:0;background:none;cursor:pointer">
                <img src="../../img/common/btn_next_small.png" class="js-img-swap js-sfx" data-src-over="../../img/common/btn_next_small_over.png" data-sound="sound/click.mp3" alt="다음">
              </button>
            </div>
          </div>

          <div class="avatar-modal is-off" id="p05Done">
            <div class="avatar-card">
              <img class="avatar-card-avatar" src="../../img/common/avatar_finish.png" alt="">
              <div class="step-flow">
                <div class="step-panel">
                  <div class="avatar-card-body is-side">
                    <p class="avatar-card-text">집 안 곳곳에서 마이크가 달린<br>물건을 모두 찾았어요.</p>
                  </div>
                  <a href="page06.html" class="js-nav-effect avatar-card-btn">
                    <img src="../../img/common/btn_arrow_small.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_arrow_small_on.png" data-src-over="../../img/common/btn_arrow_small_over.png" data-sound="sound/click.mp3" alt="다음">
                  </a>
                </div>
                <div class="step-panel">
                  <div class="avatar-card-body is-side">
                    <p class="avatar-card-text">마이크로 들어온 소리를 컴퓨터는<br>어떻게 알아듣는지 살펴볼까요?</p>
                  </div>
                  <a href="page06.html" class="js-nav-effect avatar-card-btn">
                    <img src="../../img/common/btn_next_small.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_next_small_on.png" data-src-over="../../img/common/btn_next_small_over.png" data-sound="sound/click.mp3" alt="다음">
                  </a>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="우리 집 속 숨은 마이크 찾기" data-next="page06.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const OBJS = {
      speaker: { name: '스마트 스피커', text: '마이크로 사람의 목소리를 듣고 음악을 틀거나 집 안 가전을 제어해요.' },
      remote: { name: '음성 인식 TV 리모컨', text: '마이크에 말하는 음성을 들어 원하는 채널이나 영상을 찾아줘요.' },
      phone: { name: '스마트폰', text: '마이크로 목소리를 입력 받아 전화 통화를 하거나 음성 명령을 실행해요.' },
      intercom: { name: '인터폰', text: '방문객의 목소리를 마이크로 전달하거나, 등록된 목소리를 인식해 문을 열어줘요.' }
    };
    const found = new Set();

    document.querySelectorAll('.p05-obj').forEach((btn) => {
      btn.addEventListener('click', () => {
        const o = OBJS[btn.dataset.key];
        playCorrect();
        btn.classList.add('is-found');
        found.add(btn.dataset.key);
        $('p05Count').textContent = found.size + ' / 4';
        $('p05FoundTitle').textContent = o.name;
        $('p05FoundText').textContent = o.text;
        $('p05Found').classList.remove('is-off');
      });
    });

    $('p05FoundNext').addEventListener('click', () => {
      resetImageSwap($('p05FoundNext'));
      $('p05Found').classList.add('is-off');
      if (found.size === Object.keys(OBJS).length) $('p05Done').classList.remove('is-off');
    });
  })();
  </script>
</body>
</html>
