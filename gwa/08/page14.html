<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>첫 블록 코딩, 엔트리로 배우는 순차</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 24~31p. 엔트리 실습창 한 화면에서 단계(phase)가 바뀜: 1. 4구역 살펴보기(마우스를 올리면 밝아지고 누르면 체크, 순서 자유) → 2. 움직임 누르기 → 3. 이동하기 블록을 시작 블록 아래에 끼우기 → 4. 끼운 블록 끌어 보기 → ⑤ 휴지통에 버리기 → ⑥ 입→위→장 안내 → ⑦ 블록 3개를 순서대로 끼우기 → ⑧ 시작하기로 엔트리봇 실행. 블록은 위에서 아래로 착 붙고, 틀리면 놓은 자리에 남아 노랗게 깜빡임. 이미지 img/p13_*.png·p14_*.png */
        .en-win{position:absolute;left:40px;top:30px;width:1840px;height:730px;box-sizing:border-box;border:solid 6px var(--c-ink);border-radius:26px;background:#eef2fb}
        .en-area{position:absolute;box-sizing:border-box;border:solid 4px #b6c4e4;border-radius:14px;background:var(--c-white);overflow:hidden;transition:box-shadow .25s,border-color .25s}
        .en-tag{position:absolute;left:10px;top:8px;z-index:6;width:44px;height:44px;border-radius:50%;background:var(--c-purple);font-family:'Cafe24 Ssurround';font-size:28px;line-height:44px;text-align:center;color:var(--c-white);opacity:0}
        .en-stage{left:60px;top:50px;width:500px;height:450px;background:#fff}
        .en-view{position:absolute;left:0;top:0;width:100%;height:372px;background:url('img/p13_stage_bg.png') center / contain no-repeat}
        .en-objs{left:60px;top:510px;width:500px;height:230px;background:#f6f8fd}
        .en-pal{left:580px;top:50px;width:600px;height:690px;background:#f6f8fd;display:flex}
        .en-ws{left:1200px;top:50px;width:660px;height:690px;background:var(--c-white) radial-gradient(#d9e0f0 2px,transparent 2px) 0 0 / 28px 28px}

        .en-btns{position:absolute;left:8px;right:8px;top:378px;height:54px;display:flex;gap:10px;z-index:3}
        .en-btn{flex:1 1 0;height:54px;box-sizing:border-box;padding:6px 0 0;border:solid 3px #3a68e0;border-radius:10px;background:var(--c-white);font-family:'Cafe24 Ssurround';font-size:26px;color:#3a68e0;letter-spacing:-0.05em;cursor:default}
        .en-btn.is-run{background:#3a68e0;color:var(--c-white);cursor:pointer}
        .en-btn.is-run:before{content:'';display:inline-block;width:0;height:0;margin:-4px 12px 0 0;border:solid transparent;border-width:9px 0 9px 15px;border-left-color:currentColor;vertical-align:middle}
        .en-star{position:absolute;width:30px;height:30px;margin:-35px 0 0 -35px;background:url('../../img/common/icon_star_on.png') center / contain no-repeat;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
        .en-bot{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;background:url('img/p13_bot.svg') center / contain no-repeat;z-index:2;transition:left 1s ease,top 1s ease,width .6s ease,height .6s ease,margin .6s ease}
        .en-stage.is-intro .en-view{background-image:none}
        .en-stage.is-intro .en-star{display:none}
        .en-stage.is-intro .en-bot{left:250px!important;top:190px!important;width:220px;height:220px;margin:-110px 0 0 -110px}

        .en-objlist{margin:56px 14px 0;display:flex;flex-direction:column;gap:10px}
        .en-obj{height:64px;box-sizing:border-box;padding:6px 14px 0;border:solid 3px #b6c4e4;border-radius:10px;background:var(--c-white);display:flex;align-items:center;gap:12px;font-family:'Cafe24 Ssurround';font-size:26px;color:var(--c-ink)}
        .en-obj i{width:44px;height:44px;background:center / contain no-repeat}

        .en-cats{flex:0 0 150px;display:flex;flex-direction:column;border-right:solid 3px #b6c4e4;background:#e7ecf8}
        .en-cat{flex:1 1 0;max-height:96px;padding:6px 0 0;border:0;border-bottom:solid 3px #d3dbef;background:none;font-family:'Cafe24 Ssurround';font-size:28px;color:var(--c-ink);letter-spacing:-0.05em;cursor:pointer}
        .en-cat.is-on{background:#a751e8;color:var(--c-white)}
        .en-cat.is-on[data-cat="시작"]{background:#1fa89a}
        .en-list{flex:1 1 auto;position:relative;padding:60px 40px 0;display:flex;flex-direction:column;gap:30px;align-items:flex-start}
        .en-list .en-blk{width:360px;flex:none}

        /* 엔트리 블록 모양(보내 주신 참고 이미지): 왼쪽은 곧은 면, 오른쪽 끝은 완전히 둥글게, 아래 왼쪽에 작은 역삼각 돌기, 같은 색의 어두운 얇은 테두리.
           시작 블록은 왼쪽에 걸친 큰 재생 버튼 동그라미(.en-play) */
        .en-blk{--b:#a751e8;--blk-c:var(--b);--tab:32px;position:relative;box-sizing:border-box;height:74px;padding:4px 22px 0 20px;display:flex;align-items:center;font-family:'Cafe24 Ssurround';font-size:25px;color:var(--c-white);letter-spacing:-0.05em;white-space:nowrap;touch-action:none;user-select:none}
        .en-blk{background:
          linear-gradient(rgba(255,255,255,.42),rgba(255,255,255,.42)) left top / calc(50% - var(--tab) / 2) 3px no-repeat,
          linear-gradient(rgba(255,255,255,.42),rgba(255,255,255,.42)) right top / calc(50% - var(--tab) / 2) 3px no-repeat,
          linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,.12)) left bottom / 100% 4px no-repeat,
          radial-gradient(circle at 100% 0,transparent 10px,var(--blk-c) 10.5px) calc(50% - (var(--tab) - 10px) / 2) 4px / 10px 10px no-repeat,
          radial-gradient(circle at 0 0,transparent 10px,var(--blk-c) 10.5px) calc(50% + (var(--tab) - 10px) / 2) 4px / 10px 10px no-repeat,
          linear-gradient(var(--blk-c),var(--blk-c)) 50% 100% / var(--tab) calc(100% - 14px) no-repeat,
          linear-gradient(var(--blk-c),var(--blk-c)) left top / calc(50% - var(--tab) / 2 + 1px) 36% no-repeat,
          linear-gradient(var(--blk-c),var(--blk-c)) left bottom / calc(50% - var(--tab) / 2 + 1px) 36% no-repeat,
          linear-gradient(var(--blk-c),var(--blk-c)) left 13px center / calc(50% - var(--tab) / 2 - 13px + 1px) 32% no-repeat,
          radial-gradient(circle at 0 100%,transparent 12px,var(--blk-c) 12.5px) left 1px top calc(35% + 4.2px) / 12px 12px no-repeat,
          radial-gradient(circle at 0 0,transparent 12px,var(--blk-c) 12.5px) left 1px top calc(65% - 4.2px) / 12px 12px no-repeat,
          linear-gradient(var(--blk-c),var(--blk-c)) right top / calc(50% - var(--tab) / 2 + 1px) 36% no-repeat,
          linear-gradient(var(--blk-c),var(--blk-c)) right bottom / calc(50% - var(--tab) / 2 + 1px) 36% no-repeat,
          linear-gradient(var(--blk-c),var(--blk-c)) right 13px center / calc(50% - var(--tab) / 2 - 13px + 1px) 32% no-repeat,
          radial-gradient(circle at 100% 100%,transparent 12px,var(--blk-c) 12.5px) right 1px top calc(35% + 4.2px) / 12px 12px no-repeat,
          radial-gradient(circle at 100% 0,transparent 12px,var(--blk-c) 12.5px) right 1px top calc(65% - 4.2px) / 12px 12px no-repeat,
          var(--fill);filter:drop-shadow(0 1px 0 rgba(0,0,0,.2))}
        .en-blk:after{bottom:-14px;height:21px;border-radius:0 0 12px 12px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
        .en-blk{--fill:linear-gradient(var(--blk-c),var(--blk-c)) left top / 14px 100% no-repeat,linear-gradient(var(--blk-c),var(--blk-c)) right top / 14px 100% no-repeat}
        .en-blk.is-start{--b:#1fa89a;--fill:linear-gradient(rgba(255,255,255,.42),rgba(255,255,255,.42)) left top / 100% 3px no-repeat,linear-gradient(var(--blk-c),var(--blk-c)) 50% 0 / calc(var(--tab) + 2px) 20px no-repeat,linear-gradient(var(--blk-c),var(--blk-c)) left top / 14px 100% no-repeat,linear-gradient(var(--blk-c),var(--blk-c)) right top / 14px 100% no-repeat;z-index:3;border-radius:24px 24px 10px 10px}
        .en-blk.is-start:before{content:'';flex:none;margin-right:12px;border-left:15px solid var(--c-white);border-top:9px solid transparent;border-bottom:9px solid transparent}
        .en-num{display:inline-block;flex:none;box-sizing:border-box;width:32px;height:32px;min-width:32px;margin-right:2px;border-radius:50%;background:var(--c-white);color:var(--b);line-height:34px;text-align:center;font-style:normal;letter-spacing:0}
        .en-blk.is-pick{cursor:grab}
        .en-blk.is-ghost{position:absolute;z-index:80;opacity:.92;box-shadow:0 8px 16px rgba(0,0,0,.3);pointer-events:none}
        .en-blk.is-blink{animation:en-blink .4s ease-in-out 4}
        .en-blk.is-target{box-shadow:0 0 0 6px var(--c-yellow)}
        .en-blk.is-run{box-shadow:0 0 0 6px #2fbf71}
        @keyframes en-blink{0%,100%{filter:none}50%{filter:brightness(1.6) saturate(2);box-shadow:0 0 0 8px var(--c-yellow)}}
        .en-ws .en-blk{position:absolute;left:60px;width:360px}
        .en-slot{position:absolute;left:60px;width:360px;height:74px;box-sizing:border-box;border:dashed 4px var(--c-yellow);border-radius:10px;background:none;display:none}
        .en-slot.is-on{display:block}
        .en-trash{position:absolute;right:16px;bottom:16px;width:100px;height:100px;box-sizing:border-box;background:var(--c-white) url('img/p14_trash.png') center / 100% no-repeat;font-size:0;transition:box-shadow .25s}
        .en-trash.is-glow{box-shadow:0 0 0 8px var(--c-yellow)}
        .en-del{position:absolute;left:150px;top:0;right:0;bottom:0;z-index:4;box-sizing:border-box;border:dashed 3px #ffd84a;background:rgba(255,220,80,.55);display:none;flex-direction:column;align-items:center;padding-top:110px;pointer-events:none}
        .en-del img{display:block;width:150px;height:150px;object-fit:contain}
        .en-del p{margin:6px 0 0;font-family:'Cafe24 Ssurround';font-size:30px;color:var(--c-ink);letter-spacing:-0.04em}
        .en-pal.is-glow .en-del{display:flex}

        .en-guide{position:absolute;left:40px;top:790px;width:1840px;height:150px;box-sizing:border-box;padding:0 40px 0 190px;display:flex;align-items:center;gap:30px;
          background:var(--c-cream);border:solid 5px var(--c-purple);border-radius:36px;box-shadow:-7px 10px 6px 2px rgba(92,61,240,.17)}
        .en-char{position:absolute;left:30px;bottom:6px;width:140px;height:170px}
        .en-char img{width:100%;height:100%;object-fit:contain;object-position:bottom}
        .en-text{margin:0;flex:1 1 auto;font-family:'Cafe24 Ssurround';font-size:38px;line-height:1.3;color:var(--c-purple);letter-spacing:-0.05em;word-break:keep-all}
        .en-next{flex:0 0 auto;min-width:0;width:260px;padding-left:10px;padding-right:10px;white-space:nowrap;text-decoration:none;margin-bottom:20px}
        .en-next.is-off{display:none}

        .phase-a .en-area:not(.is-lit):not(.is-done):after{content:'';position:absolute;left:0;top:0;width:100%;height:100%;background:rgba(15,15,60,.62);z-index:5}
        .phase-a .en-area{cursor:pointer}
        .phase-a .en-tag{opacity:1}
        .en-area.is-lit{border-color:var(--c-yellow);box-shadow:0 0 0 8px rgba(255,216,61,.75)}
        .en-area.is-done{border-color:#2fbf71;box-shadow:0 0 0 6px rgba(47,191,113,.6)}
        .en-area.is-done:before{content:'✓';position:absolute;right:14px;top:10px;z-index:6;width:50px;height:50px;border-radius:50%;background:#2fbf71;font-size:34px;line-height:50px;text-align:center;color:var(--c-white)}
        .en-area.is-hint{animation:en-hint 1.1s ease-in-out infinite}
        @keyframes en-hint{0%,100%{box-shadow:0 0 0 0 rgba(255,216,61,0)}50%{box-shadow:0 0 0 12px rgba(255,216,61,.9)}}
        .en-cat.is-hintcat{animation:en-hint 1.1s ease-in-out infinite}

    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default phase-a" id="enMain">
          <div class="en-win"></div>
          <div class="en-area en-stage is-intro" id="enStage" data-a="1"><span class="en-tag">1</span>
            <div class="en-view"></div>
            <div class="en-star" id="enStarMouth" style="left:227px;top:98px"></div>
            <div class="en-star" id="enStarStomach" style="left:307px;top:235px"></div>
            <div class="en-star" id="enStarIntestine" style="left:271px;top:322px"></div>
            <div class="en-bot" id="enBot" style="left:100px;top:75px"></div>
            <div class="en-btns"><button class="en-btn" type="button">+ 오브젝트 추가하기</button><button class="en-btn is-run" id="enRun" type="button">시작하기</button></div>
          </div>
          <div class="en-area en-objs" id="enObjs" data-a="2"><span class="en-tag">2</span>
            <div class="en-objlist"><div class="en-obj"><i style="background-image:url('img/p13_bot.svg')"></i>엔트리봇</div></div>
          </div>
          <div class="en-area en-pal" id="enPal" data-a="3"><span class="en-tag">3</span>
            <div class="en-cats" id="enCats"></div>
            <div class="en-list" id="enList"></div>
            <div class="en-del"><img src="img/p14_trash.png" alt=""><p>여기로 옮겨 버리기</p></div>
          </div>
          <div class="en-area en-ws" id="enWs" data-a="4"><span class="en-tag">4</span>
            <div class="en-blk blk is-start" id="enStart" style="left:60px;top:70px;width:360px">시작하기 버튼을 클릭했을 때</div>
            <div class="en-slot" id="enSlot"></div>
            <div class="en-trash" id="enTrash"></div>
          </div>

          <div class="en-guide">
            <div class="en-char"><img src="img/p_character_main.png" alt="메인 캐릭터"></div>
            <p class="en-text" id="enText"></p>
            <button class="card-btn is-popup js-sfx en-next is-off" id="enNext" data-sound="sound/click.mp3">다음</button>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="첫 블록 코딩, 엔트리로 배우는 순차" data-next="page15.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const main = document.getElementById('enMain');
    const text = $('enText');
    const ws = $('enWs');
    const pal = $('enPal');
    const list = $('enList');
    const slot = $('enSlot');
    const trash = $('enTrash');
    const bot = $('enBot');
    const CATS = ['시작', '흐름', '움직임', '생김새', '소리', '판단', '계산'];
    const AREA_TEXT = {
      1: '1. 실행 화면: 내가 만든 코딩의 결과를 보여 주는 곳이에요.',
      2: '2. 오브젝트 목록: 명령을 받을 캐릭터(엔트리봇)를 고르는 곳이에요.',
      3: '3. 블록 꾸러미: 색깔별로 명령 블록이 담겨 있는 보관함이에요.',
      4: '4. 블록 조립소: 블록을 끌어와 순서대로 연결하는 곳이에요.'
    };
    const POS = { mouth: [227, 98], stomach: [307, 235], intestine: [271, 322] };
    const BOT_START = [97, 98];
    const SEQ = [
      { key: 'mouth', name: '1초 동안 입 위치로 이동하기', ask: '먼저, ‘1초 동안 입 위치로 이동하기’ 블록을 클릭해 시작 블록 바로 아래에 연결해 보세요.' },
      { key: 'stomach', name: '1초 동안 위 위치로 이동하기', ask: '입을 지난 음식은 위로 이동해요. ‘1초 동안 위 위치로 이동하기’ 블록을 ‘1초 동안 입 위치로 이동하기’ 바로 아래에 놓아 주세요.' },
      { key: 'intestine', name: '1초 동안 장 위치로 이동하기', ask: '위를 지난 음식은 장으로 이동해요. ‘1초 동안 장 위치로 이동하기’ 블록을 마지막에 놓아 주세요.' }
    ];
    const START_TOP = 70;
    const START_H = 74;
    const BLK_H = 74;
    const targetTop = (n) => START_TOP + START_H + n * BLK_H;

    let phase = 'a';
    const doneAreas = new Set();
    let step = 0;
    let snapped = [];

    const say = (t) => { text.innerHTML = t; };
    const setNext = (on, fn) => {
      const b = $('enNext');
      b.classList.toggle('is-off', !on);
      b.onclick = on ? () => { fn(); } : null;
    };
    const mainRect = () => main.getBoundingClientRect();
    const toMain = (e) => { const r = mainRect(); const s = r.width / 1920; return [(e.clientX - r.left) / s, (e.clientY - r.top) / s]; };
    const touches = (el, blk) => {
      const a = el.getBoundingClientRect(); const c = blk.getBoundingClientRect();
      return a.left < c.right && a.right > c.left && a.top < c.bottom && a.bottom > c.top;
    };
    const inside = (el, x, y) => {
      const r = mainRect(); const s = r.width / 1920; const b = el.getBoundingClientRect();
      const L = (b.left - r.left) / s, T = (b.top - r.top) / s;
      return x >= L && x <= L + b.width / s && y >= T && y <= T + b.height / s;
    };
    const wsOrigin = () => { const r = mainRect(); const s = r.width / 1920; const b = ws.getBoundingClientRect(); return [(b.left - r.left) / s, (b.top - r.top) / s, s]; };

    function renderCats(on) {
      $('enCats').innerHTML = CATS.map((c) => '<button class="en-cat' + (c === on ? ' is-on' : '') + '" data-cat="' + c + '">' + c + '</button>').join('');
    }
    function numHtml(n) { return n.replace(/^(\d+)/, '<i class="en-num">$1</i>'); }
    function renderPalette(items, pickable) {
      list.innerHTML = '';
      items.forEach((it, i) => {
        const b = document.createElement('div');
        b.className = 'en-blk blk' + (pickable ? ' is-pick' : '') + (it.start ? ' is-start' : '');
        b.innerHTML = numHtml(it.name);
        b.dataset.idx = it.idx === undefined ? i : it.idx;
        if (pickable) b.addEventListener('pointerdown', (e) => startPaletteDrag(e, b));
        list.appendChild(b);
      });
    }

    /* ---------- 1. 4구역 살펴보기 ---------- */
    const areas = Array.from(document.querySelectorAll('.en-area'));
    function hintNext() {
      areas.forEach((a) => a.classList.remove('is-hint'));
      const nxt = areas.find((a) => !doneAreas.has(a.dataset.a));
      if (nxt) nxt.classList.add('is-hint');
    }
    areas.forEach((a) => {
      a.addEventListener('mouseenter', () => { if (phase === 'a' && !doneAreas.has(a.dataset.a)) a.classList.add('is-lit'); });
      a.addEventListener('mouseleave', () => a.classList.remove('is-lit'));
      a.addEventListener('click', () => {
        if (phase !== 'a' || doneAreas.has(a.dataset.a)) return;
        playCorrect();
        doneAreas.add(a.dataset.a);
        a.classList.remove('is-lit', 'is-hint');
        a.classList.add('is-done');
        say(AREA_TEXT[a.dataset.a]);
        clearFingers();
        hintNext();
        if (doneAreas.size === 4) setTimeout(toPhaseB, 2200);
      });
    });
    function toPhaseA() {
      phase = 'a';
      say('빛나고 있는 곳을 클릭하고, 무엇인지 알아보아요.');
      renderCats('시작');
      renderPalette([{ name: '시작하기 버튼을 클릭했을 때', start: true }, { name: 'A 버튼을 눌렀을 때', start: true }, { name: '마우스를 클릭했을 때', start: true }, { name: '오브젝트를 클릭했을 때', start: true }], false);
      hintNext();
      setTimeout(() => pointFingerAt($('enStage'), { onMain: true, x: 0.5, dy: -120 }), 400);
    }

    /* ---------- 2. 움직임 누르기 ---------- */
    function toPhaseB() {
      phase = 'b';
      main.classList.remove('phase-a');
      areas.forEach((a) => a.classList.remove('is-done', 'is-hint', 'is-lit'));
      say('‘움직임’을 클릭하세요.');
      renderCats('시작');
      const btn = $('enCats').querySelector('[data-cat="움직임"]');
      btn.classList.add('is-hintcat');
      setTimeout(() => pointFingerAt(btn, { onMain: true, x: 0.5 }), 300);
    }
    $('enCats').addEventListener('click', (e) => {
      const b = e.target.closest('.en-cat');
      if (!b || phase !== 'b' || b.dataset.cat !== '움직임') return;
      playClick();
      clearFingers();
      toPhaseC();
    });

    /* ---------- 3. 이동하기 블록을 시작 블록 아래에 ---------- */
    function toPhaseC() {
      phase = 'c';
      renderCats('움직임');
      renderPalette([{ name: '이동하기', idx: 0 }], true);
      slot.style.top = targetTop(0) + 'px';
      slot.classList.add('is-on');
      say('‘이동하기’ 블록을 클릭해 시작 블록 바로 아래에 연결해 보세요.');
      setTimeout(() => { const first = list.querySelector('.en-blk'); if (first) pointFingerAt(first, { onMain: true, x: 0.6 }); }, 300);
    }

    /* ---------- 블록 끌기(팔레트 → 조립소, 조립소 안) ---------- */
    function ghostAt(el) {
      const g = el.cloneNode(true);
      g.classList.add('is-ghost');
      g.classList.remove('is-pick', 'is-target', 'is-blink');
      g.style.width = '360px';
      main.appendChild(g);
      return g;
    }
    function startPaletteDrag(e, src) {
      if (phase !== 'c' && phase !== 'g') return;
      if (src.dataset.idx === '-1') return;
      e.preventDefault();
      clearFingers();
      const ghost = ghostAt(src);
      const idx = Number(src.dataset.idx);
      const move = (ev) => { const [x, y] = toMain(ev); ghost.style.left = (x - 60) + 'px'; ghost.style.top = (y - 37) + 'px'; };
      move(e);
      const up = (ev) => {
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        const [x, y] = toMain(ev);
        ghost.remove();
        if (inside(ws, x, y)) dropInWs(makeWsBlock(src.textContent, idx), x, y);
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    }
    function makeWsBlock(name, idx) {
      const b = document.createElement('div');
      b.className = 'en-blk blk is-pick';
      b.innerHTML = numHtml(name);
      b.dataset.idx = idx;
      b.addEventListener('pointerdown', (e) => startWsDrag(e, b));
      ws.appendChild(b);
      return b;
    }
    function placeFree(b, x, y) {
      const [ox, oy] = wsOrigin();
      b.style.left = Math.max(0, Math.min(740 - 440, x - ox - 60)) + 'px';
      b.style.top = Math.max(10, Math.min(690 - 80, y - oy - 37)) + 'px';
    }
    function startWsDrag(e, b) {
      if (phase === 'a' || phase === 'b' || phase === 'f' || phase === 'h') return;
      if (b.dataset.locked) return;
      e.preventDefault();
      clearFingers();
      const [sx, sy] = toMain(e);
      const startLeft = parseFloat(b.style.left);
      const startTop = parseFloat(b.style.top);
      let moved = false;
      const [ox, oy] = wsOrigin();
      const offX = ox + 4, offY = oy + 4;
      let vl = startLeft, vt = startTop;
      const place = () => { b.style.left = (vl + offX) + 'px'; b.style.top = (vt + offY) + 'px'; };
      b.style.position = 'absolute';
      b.style.width = '360px';
      b.style.zIndex = '90';
      main.appendChild(b);
      place();
      const move = (ev) => {
        const [x, y] = toMain(ev);
        if (Math.hypot(x - sx, y - sy) > 12) moved = true;
        vl = startLeft + x - sx;
        vt = startTop + y - sy;
        place();
        if (phase === 'e') { trash.classList.toggle('is-glow', touches(trash, b)); pal.classList.toggle('is-glow', inside(pal, x, y)); }
      };
      const up = (ev) => {
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        trash.classList.remove('is-glow'); pal.classList.remove('is-glow');
        const [x, y] = toMain(ev);
        ws.appendChild(b);
        b.style.zIndex = ''; b.style.position = '';
        b.style.left = vl + 'px'; b.style.top = vt + 'px';
        if (phase === 'd') {
          if (moved) { b.style.left = startLeft + 'px'; b.style.top = startTop + 'px'; toPhaseE(); }
          return;
        }
        if (phase === 'e') {
          if (touches(trash, b) || inside(pal, x, y)) { playClick(); b.remove(); onTrashed(); }
          else { b.style.left = startLeft + 'px'; b.style.top = startTop + 'px'; }
          return;
        }
        if (!inside(ws, x, y)) { if (phase === 'c' || phase === 'g') { snapped = snapped.filter((n) => n !== b); b.remove(); } return; }
        dropInWs(b, x, y);
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    }
    function nearTarget(b, n) {
      return Math.abs(parseFloat(b.style.left) - 60) < 70 && Math.abs(parseFloat(b.style.top) - targetTop(n)) < 60;
    }
    function dropInWs(b, x, y) {
      placeFree(b, x, y);
      b.style.width = '360px';
      if (phase === 'c') {
        if (nearTarget(b, 0)) {
          b.style.left = '60px'; b.style.top = targetTop(0) + 'px'; b.dataset.locked = '';
          playDrag();
          slot.classList.remove('is-on');
          say('블록의 들어간 곳과 튀어나온 곳을 맞추면 착 붙어요.');
          phase = 'c-done';
          setTimeout(toPhaseD, 1800);
        } else {
          say('괜찮아요! 시작 블록 바로 아래로 다시 옮겨 볼까요?');
        }
        return;
      }
      if (phase === 'g') {
        const ok = Number(b.dataset.idx) === step && nearTarget(b, step);
        if (ok) {
          b.style.left = '60px'; b.style.top = targetTop(step) + 'px';
          b.dataset.locked = '1';
          b.classList.remove('is-pick', 'is-blink');
          playDrag();
          snapped.push(b);
          step += 1;
          if (step >= SEQ.length) { slot.classList.remove('is-on'); setTimeout(toPhaseH, 900); } else { markStep(); }
        } else {
          b.classList.remove('is-blink'); void b.offsetWidth; b.classList.add('is-blink');
          playWrong();
        }
      }
    }

    /* ---------- 4. 끼운 블록 끌어 보기 ---------- */
    function toPhaseD() {
      phase = 'd';
      say('조립소에 놓았던 보라색 블록을 움직여 보세요.');
      const placed = ws.querySelector('.en-blk.is-pick');
      if (placed) setTimeout(() => pointFingerAt(placed, { onMain: true, x: 0.6 }), 200);
    }

    /* ---------- ⑤ 휴지통 ---------- */
    function toPhaseE() {
      phase = 'e';
      clearFingers();
      say('잘못 가져온 블록은 휴지통에 넣으면 지울 수 있어요.<br>왼쪽 휴지통 또는 오른쪽 아래의 휴지통에 넣어 삭제해보세요.');
      pal.classList.add('is-hint'); trash.classList.add('is-glow');
    }
    function onTrashed() {
      pal.classList.remove('is-hint'); trash.classList.remove('is-glow');
      say('잘했어요! 이제 진짜 엔트리 블록코딩을 하러 가볼까요?');
      phase = 'e-done';
      setNext(true, () => { setNext(false); toPhaseF(); });
    }

    /* ---------- ⑥ 입→위→장 안내 ---------- */
    function toPhaseF() {
      phase = 'f';
      $('enStage').classList.remove('is-intro');
      ws.querySelectorAll('.en-blk:not(.is-start)').forEach((b) => b.remove());
      pal.classList.remove('is-hint');
      bot.style.left = BOT_START[0] + 'px'; bot.style.top = BOT_START[1] + 'px';
      renderCats('움직임');
      renderPalette(SEQ.map((s, i) => ({ name: s.name, idx: i })), false);
      say('음식이 입에서 위, 장으로 이동하는 순서대로 엔트리봇을 움직여 볼까요?');
      setNext(true, () => { setNext(false); clearFingers(); toPhaseG(); });
      setTimeout(() => pointFingerAt($('enNext'), { onMain: true, x: 0.5 }), 300);
    }

    /* ---------- ⑦ 블록 3개 순서대로 ---------- */
    function markStep() {
      list.querySelectorAll('.en-blk').forEach((b) => b.classList.toggle('is-target', Number(b.dataset.idx) === step));
      slot.style.top = targetTop(step) + 'px';
      slot.classList.add('is-on');
      say(SEQ[step].ask);
    }
    function toPhaseG() {
      phase = 'g';
      step = 0; snapped = [];
      renderPalette(SEQ.map((s, i) => ({ name: s.name, idx: i })), true);
      markStep();
      setTimeout(() => { const first = list.querySelector('.en-blk'); if (first) pointFingerAt(first, { onMain: true, x: 0.6 }); }, 300);
    }

    /* ---------- ⑧ 실행 ---------- */
    function toPhaseH() {
      phase = 'h';
      list.querySelectorAll('.en-blk').forEach((b) => b.classList.remove('is-target'));
      say('‘시작하기’ 버튼을 클릭하세요.');
      setTimeout(() => pointFingerAt($('enRun'), { onMain: true, x: 0.5 }), 300);
    }
    $('enRun').addEventListener('click', () => {
      if (phase !== 'h') return;
      phase = 'h-run';
      clearFingers();
      playClick();
      const move = (key, i) => setTimeout(() => {
        snapped.forEach((b, j) => b.classList.toggle('is-run', j === i));
        bot.style.left = POS[key][0] + 'px'; bot.style.top = POS[key][1] + 'px';
      }, i * 1200);
      ['mouth', 'stomach', 'intestine'].forEach(move);
      setTimeout(() => {
        snapped.forEach((b) => b.classList.remove('is-run'));
        say('컴퓨터는 우리가 연결해 놓은 순서 그대로만 일해요. 엔트리봇이 입<span style="font-family:Pretendard">→</span>위<span style="font-family:Pretendard">→</span>장으로 이동하는 게 보이죠?');
        setNext(true, () => {
          say('음식이 입<span style="font-family:Pretendard">→</span>위<span style="font-family:Pretendard">→</span>장 순서로 소화되듯, 블록도 위에서 아래로 차례차례 실행돼요. 이것이 ‘순차’에요.');
          setNext(true, () => navigateTo('page15.html'));
        });
      }, 3 * 1200 + 400);
    });

    toPhaseA();
  })();
  </script>
</body>
