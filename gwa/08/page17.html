<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>블록 코딩 순서대로 캐릭터 움직이기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 38p. 게임 전 안내: 3×3 격자 바닥판 위에 아로(출발)와 하트 선물상자(도착), [배달 시작] → page18.
           아로 img/p17_aro.png, 선물상자 img/p17_gift.png, 바닥 img/p17_floor.png */
        .gm-title{position:absolute;left:260px;top:30px;width:1400px;height:100px;margin:0;box-sizing:border-box;padding:8px 40px 0;display:flex;align-items:center;justify-content:center;
          background:var(--c-white);border:solid 5px var(--c-purple);border-radius:50px;box-shadow:0 10px 0 0 var(--c-sky-pale);
          font-family:'Cafe24 Ssurround';font-size:50px;color:var(--c-purple);letter-spacing:-0.05em;word-break:keep-all}
        .gm-floor{position:absolute;left:660px;top:190px;width:600px;height:600px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;padding:8px;box-sizing:border-box;border-radius:24px;background:#8e9fd0 url('img/p17_floor.png') center / cover no-repeat;box-shadow:0 12px 0 0 #6b7db3}
        .gm-cell{border-radius:12px;background:#dfe6f7}
        .gm-cell:nth-child(even){background:#cfd9f0}
        .gm-item{position:absolute;width:184px;height:184px;background:center / contain no-repeat;display:flex;align-items:flex-end;justify-content:center;font-family:'Cafe24 Ssurround';font-size:34px;color:var(--c-ink)}
        .gm-aro{left:668px;top:590px;background-image:url('img/p17_aro.png')}
        .gm-gift{left:1068px;top:390px;background-image:url('img/p17_gift.png')}
        .gm-start{position:absolute;left:660px;top:830px;width:600px;display:flex;justify-content:center}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <p class="gm-title">블록의 순서만 잘 따르면 선물 상자까지 갈 수 있겠지?</p>
          <div class="gm-floor">
            <div class="gm-cell"></div><div class="gm-cell"></div><div class="gm-cell"></div>
            <div class="gm-cell"></div><div class="gm-cell"></div><div class="gm-cell"></div>
            <div class="gm-cell"></div><div class="gm-cell"></div><div class="gm-cell"></div>
          </div>
          <div class="gm-item gm-aro">아로</div>
          <div class="gm-item gm-gift">♥</div>

          <a href="page18.html" class="js-nav-effect card-btn gm-start js-sfx" data-sound="sound/click.mp3" style="min-width:0;width:420px;height:110px;font-size:56px;padding:12px 10px 4px;margin-left:90px">배달 시작</a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="블록 코딩 순서대로 캐릭터 움직이기" data-next="page18.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
