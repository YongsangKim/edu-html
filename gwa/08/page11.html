<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>컴퓨터도 순서대로, 알고리즘 순차 따라</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 19p. 상황 소개 대화: 확인 버튼을 누를 때마다 다음 대사로 바뀌고 마지막 확인에서 page12.html로 이동.
           배경 img/p11_bg.png(방 안 · 책상 위 태블릿 PC · 아로와 루리의 뒷모습) */
        .tk-banner{position:absolute;left:460px;top:30px;width:1000px;height:96px;margin:0;box-sizing:border-box;padding:8px 30px 0;display:flex;align-items:center;justify-content:center;
          background:var(--c-white);border:solid 5px var(--c-purple);border-radius:48px;box-shadow:0 10px 0 0 var(--c-sky-pale);
          font-family:'Cafe24 Ssurround';font-size:48px;color:var(--c-purple);letter-spacing:-0.05em;word-break:keep-all}
        .tk-scene{position:absolute;left:40px;top:150px;width:1840px;height:520px;box-sizing:border-box;border:solid 6px var(--c-purple);border-radius:30px;background:var(--c-mist) url('img/p11_bg.png') center / cover no-repeat}
        .tk-box{position:absolute;left:40px;top:700px;width:1840px;height:210px;box-sizing:border-box;padding:34px 260px 0 60px;
          background:var(--c-cream);border:solid 5px var(--c-purple);border-radius:36px;box-shadow:-7px 10px 6px 2px rgba(92,61,240,.17)}
        .tk-name{position:absolute;left:50px;top:-30px;margin:0;padding:8px 36px 0;height:60px;box-sizing:border-box;border-radius:30px;background:var(--c-navy);font-family:'Cafe24 Ssurround';font-size:36px;color:var(--c-white)}
        .tk-text{margin:0;font-family:'Cafe24 Ssurround';font-size:40px;line-height:1.35;color:var(--c-ink);letter-spacing:-0.05em;word-break:keep-all}
        .tk-ok{position:absolute;right:50px;bottom:28px;padding:0;border:0;background:none;cursor:pointer}
        .tk-ok img{display:block}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <p class="tk-banner">AI 그림 그리기 과정을 알아봐요.</p>
          <div class="tk-scene"></div>
          <div class="tk-box">
            <p class="tk-name" id="tkName"></p>
            <p class="tk-text" id="tkText"></p>
            <button class="tk-ok" id="tkOk"><img src="../../img/common/btn_confirm.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_confirm_on.png" data-src-over="../../img/common/btn_confirm_over.png" data-sound="sound/click.mp3" alt="확인"></button>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="컴퓨터도 순서대로, 알고리즘 순차 따라" data-next="page12.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const LINES = [["아로","루리야, AI에게 원하는 그림을 그려 달라고 부탁해 본 적 있지?<br>어떤 그림을 만들고 싶은지 말해 줄래?"],["루리","나는 모자를 쓴 고양이 그림을 만들고 싶어.<br>“모자를 쓴 고양이 그려줘”라고 입력하면 될 것 같아."],["아로","오! 맞아! 우리 이 과정을 블록으로 정리해 볼까?"]];
    let i = 0;
    function show() {
      $('tkName').textContent = LINES[i][0];
      $('tkText').innerHTML = LINES[i][1];
    }
    $('tkOk').addEventListener('click', () => {
      resetImageSwap($('tkOk'));
      if (i < LINES.length - 1) { i += 1; show(); return; }
      navigateTo('page12.html');
    });
    show();
  })();
  </script>
</body>
</html>
