<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>블록 코딩 순서대로 캐릭터 움직이기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        .intro-panel{padding-top:40px}
        .p-how-lead{margin:0 -20px;letter-spacing:-0.1em}
        .p-how .intro-list li + li{margin-top:0}
        .p-how-tip{text-align:left}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="intro-character"><img src="img/p16_character.png" alt="메인 캐릭터"></div>
          <div class="intro-panel">
            <p class="p-how-lead is-small">삐빅! 로봇 배달 센터에 새로운 배달 임무가 도착했어요! 명령 블록을 위에서 아래로 하나씩 확인하고, 아로를 움직여 선물 상자까지 안전하게 이동해 주세요.</p>
            <div class="p-how">
              <b>게임 방법</b>
              <ol class="intro-list is-small">
                <li>1. 노란 별이 표시된 명령 블록을 확인해요.</li>
                <li>2. 블록에 적힌 방향과 같은 화살표 버튼을 눌러요.</li>
                <li>3. 명령을 순서대로 실행해 선물 상자에 도착해요.</li>
              </ol>
            </div>
            <p class="p-how-tip"><b>Tip.</b>노란 별은 지금 실행해야 하는 블록을 알려 줘요. 블록의 순서와 방향을 잘 확인하세요! 블록에 적힌 명령은 위에서 아래로 하나씩 차례대로 실행돼요!</p>
          </div>

          <a href="page17.html" class="js-nav-effect next-btn-activity">
            <img src="../../img/common/btn_start.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_start_on.png" data-src-over="../../img/common/btn_start_over.png" data-sound="sound/click.mp3" alt="시작하기">
          </a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="블록 코딩 순서대로 캐릭터 움직이기" data-next="page17.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
