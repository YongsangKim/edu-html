<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차례대로 맞추는 몸속 퍼즐 게임</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 4~5p. 퍼즐을 다 맞춘 뒤 소화 과정 시뮬레이션: 음식물이 입→위→장으로 이동하며 기관이 차례로 초록빛,
           끝나면 안내 문구, 2초 뒤 입→위→장 그림이 차례로 나타남. 5p의 완료·순차 설명은 이 화면 위 모달(스텝 3개)로 넣음.
           실루엣 img/p02_body.png, 음식물 img/p03_food.png, 아로 얼굴 img/p02_aro_face.png */
        .p03-gauge{left:62px;top:36px;width:757px;z-index:5}

        .p03-panel{position:absolute;left:90px;top:100px;width:1755px;height:598px;box-sizing:border-box;border:solid 5px var(--c-navy);border-radius:24px;background:#bfe0f7 url('img/p02_bg.png') center / cover no-repeat;overflow:hidden}
        .p03-body{position:absolute;left:565px;top:22px;width:591px;height:540px}
        .p03-body:before{content:'';position:absolute;left:0;top:0;width:100%;height:100%;background:url('img/p02_body.png') center / contain no-repeat}
        .p03-zone{position:absolute;box-sizing:border-box;border:dashed 5px var(--c-purple);border-radius:22px;background:rgba(72,21,156,.12);transition:all .4s;
          display:flex;align-items:center;justify-content:center;font-family:'Cafe24 Ssurround';font-size:36px;color:rgba(72,21,156,.45)}
        .p03-zone[data-key="mouth"]{left:269px;top:126px;width:104px;height:60px}
        .p03-zone[data-key="stomach"]{left:306px;top:298px;width:90px;height:90px}
        .p03-zone[data-key="intestine"]{left:239px;top:391px;width:164px;height:142px}
        .p03-zone.is-done{border-color:#2fbf71;border-style:solid;background:rgba(47,191,113,.3);color:#1f9d5a;box-shadow:0 0 30px 8px rgba(47,191,113,.65)}
        .p03-svg{position:absolute;left:0;top:0;width:591px;height:540px;pointer-events:none}
        .p03-svg path{fill:none;stroke:#2fbf71;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(47,191,113,.9));stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.2s ease}
        .p03-food{position:absolute;left:276px;top:-10px;width:90px;height:90px;display:flex;align-items:center;justify-content:center;font-size:76px;line-height:1;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25));transition:left 1s ease,top 1.2s ease,opacity .5s;z-index:3}
        .p03-food img{width:100%;height:100%;object-fit:contain}

        .p03-flow{position:absolute;left:1397px;top:17px;width:330px;height:554px;box-sizing:border-box;border-radius:30px;background:rgba(255,255,255,.55);border:solid 4px rgba(255,255,255,.9)}
        .p03-chip{position:absolute;left:45px;width:240px;height:110px;box-sizing:border-box;padding-top:6px;display:flex;align-items:center;justify-content:center;border:solid 5px var(--c-purple);border-radius:26px;background:var(--c-white);
          font-family:'Cafe24 Ssurround';font-size:54px;color:var(--c-ink);opacity:0;transform:translateY(20px);transition:opacity .5s,transform .5s}
        .p03-chip.is-on{opacity:1;transform:none}
        .p03-arrow{position:absolute;left:145px;width:0;height:0;border-style:solid;border-width:30px 20px 0 20px;border-color:var(--c-purple) transparent transparent transparent;opacity:0;transition:opacity .5s}
        .p03-arrow.is-on{opacity:1}


        /* 아래 줄: 과학 3차시 page09의 말풍선(흰 알약 + 왼쪽에 걸친 원형 아바타) 그대로. 아바타 그림 img/p02_aro_face.png */
        .p03-icon{position:absolute;left:40px;top:710px;width:236px;height:236px;box-sizing:border-box;border-radius:50%;border:solid 6px var(--c-purple);background:var(--c-purple) url('img/p02_aro_face.png') center bottom / contain no-repeat;box-shadow:0 12px 0 0 rgba(72,21,156,.18);z-index:1}
        .p03-order{position:absolute;left:175px;top:755px;width:1210px;height:156px;box-sizing:border-box;padding:0 40px 0 120px;display:flex;align-items:center;margin:0;
          background:var(--c-white);border:solid 6px var(--c-purple);border-radius:78px;box-shadow:0 12px 0 0 rgba(72,21,156,.18);
          font-family:'Cafe24 Ssurround';font-size:46px;line-height:1.15;color:var(--c-purple);letter-spacing:-0.05em;word-break:keep-all;text-align:left}
        .p03-modal .avatar-card{padding-top:60px}
        .p03-modal .avatar-card-title{margin-bottom:24px}
        .p03-modal .avatar-card.is-center .avatar-card-text{text-align:left;padding-left:200px}
        .p03-modal .avatar-card-text{font-size:54px;line-height:1.3}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="gauge p03-gauge"><div class="gauge-fill" style="width:100%"></div></div>

          <div class="p03-panel">
            <div class="p03-body">
              <div class="p03-zone" data-key="mouth" id="p03Mouth"></div>
              <div class="p03-zone" data-key="stomach" id="p03Stomach"></div>
              <div class="p03-zone" data-key="intestine" id="p03Intestine"></div>
              <svg class="p03-svg" viewBox="0 0 591 540"><path id="p03Path" d="M321 156 L351 342 L322 462" pathLength="1"/></svg>
              <div class="p03-food" id="p03Food"><img src="img/p03_food.png" alt="" onerror="this.replaceWith(document.createTextNode('🍎'))"></div>
            </div>
            <div class="p03-flow">
              <div class="p03-chip" id="p03C1" style="top:30px">입</div><div class="p03-arrow" id="p03A1" style="top:154px"></div>
              <div class="p03-chip" id="p03C2" style="top:222px">위</div><div class="p03-arrow" id="p03A2" style="top:346px"></div>
              <div class="p03-chip" id="p03C3" style="top:414px">장</div>
            </div>
          </div>

          <div class="p03-icon"></div>
          <p class="p03-order" id="p03Ask">음식물은 입, 위, 장의 정해진 순서에 따라 이동하며 소화되는구나!</p>

          <div class="avatar-modal p03-modal is-off" id="p03Modal">
            <div class="avatar-card is-center">
              <img class="avatar-card-avatar" src="../../img/common/avatar_finish.png" alt="">
              <div class="avatar-card-body">
                <div class="step-flow">
                  <div class="step-panel is-title">
                    <p class="avatar-card-title">몸속 퍼즐 완료!</p>
                    <p class="avatar-card-text">음식이 [입] <span style="font-family:Pretendard">→</span> [위] <span style="font-family:Pretendard">→</span> [장] 으로 이동하는<br>소화과정 퍼즐을 완성했어요.</p>
                    <a href="page04.html" class="js-nav-effect avatar-card-btn">
                      <img src="../../img/common/btn_arrow_small.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_arrow_small_on.png" data-src-over="../../img/common/btn_arrow_small_over.png" data-sound="sound/click.mp3" alt="다음">
                    </a>
                  </div>
                  <div class="step-panel">
                    <p class="avatar-card-text">음식이 정해진 순서대로 이동하는 것처럼,<br>컴퓨터도 입력된 명령을 차례차례 실행해.</p>
                    <a href="page04.html" class="js-nav-effect avatar-card-btn">
                      <img src="../../img/common/btn_arrow_small.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_arrow_small_on.png" data-src-over="../../img/common/btn_arrow_small_over.png" data-sound="sound/click.mp3" alt="다음">
                    </a>
                  </div>
                  <div class="step-panel">
                    <p class="avatar-card-text">이것을 컴퓨터 용어로 ‘순차’라고 해.<br>컴퓨터는 어떻게 순서대로 일하는지<br>조금 더 자세히 알아보자!</p>
                    <a href="page04.html" class="js-nav-effect avatar-card-btn">
                      <img src="../../img/common/btn_next_small.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_next_small_on.png" data-src-over="../../img/common/btn_next_small_over.png" data-sound="sound/click.mp3" alt="다음">
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="차례대로 맞추는 몸속 퍼즐 게임" data-next="page04.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const food = $('p03Food');
    const path = $('p03Path');
    const at = (ms, fn) => setTimeout(fn, ms);
    const go = (cx, cy) => { food.style.left = (cx - 45) + 'px'; food.style.top = (cy - 45) + 'px'; };

    at(600, () => go(321, 156));
    at(1700, () => $('p03Mouth').classList.add('is-done'));
    at(2000, () => { path.style.strokeDashoffset = '0.39'; go(351, 342); });
    at(3400, () => $('p03Stomach').classList.add('is-done'));
    at(4400, () => { path.style.strokeDashoffset = '0'; go(322, 462); });
    at(5800, () => { $('p03Intestine').classList.add('is-done'); food.style.opacity = '0'; });
    at(8300, () => { $('p03C1').classList.add('is-on'); });
    at(9100, () => { $('p03A1').classList.add('is-on'); $('p03C2').classList.add('is-on'); });
    at(9900, () => { $('p03A2').classList.add('is-on'); $('p03C3').classList.add('is-on'); });
    at(11500, () => { $('p03Modal').classList.remove('is-off'); });
  })();
  </script>
</body>
</html>
