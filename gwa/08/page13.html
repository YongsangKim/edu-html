<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트홈! 실시간 위기 해결 미션</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        .p13-step{left:40px;top:20px;transform:none;width:1440px;font-size:62px}
        .p13-step>i{width:440px}
        .p13-step>span{justify-content:center;padding:8px 20px 0;white-space:nowrap}
        .p13-timer{position:absolute;margin:0;left:1520px;top:20px;width:360px;height:100px;box-sizing:border-box;padding:6px 40px 0;display:flex;align-items:center;justify-content:space-between;
          background:var(--c-white);border:solid 6px var(--c-ink);border-radius:48px;box-shadow:0 15px 0 0 var(--c-sky-pale);font-family:'Cafe24 Ssurround';font-size:62px;color:var(--c-ink)}
        .p13-timer svg{width:62px;height:62px;margin-top:-6px}
        .p13-timer.is-hurry{border-color:#e5484d;color:#e5484d;animation:p13-beat 1s ease infinite}
        @keyframes p13-beat{50%{transform:scale(1.08)}}

        .p13-dash{position:absolute;left:40px;top:140px;width:560px;height:520px;box-sizing:border-box;border:solid 6px var(--c-ink);border-radius:36px;background:#101a3a;overflow:hidden;
          display:flex;flex-direction:column;align-items:center;font-family:'Cafe24 Ssurround';color:var(--c-white);text-align:center}
        .p13-dash-title{width:100%;height:84px;padding-top:6px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:var(--c-blue);font-size:48px}
        .p13-dash-sensor{margin:40px 0 0;font-size:48px;color:#9fc3ff}
        .p13-dash-alert{flex:1 1 auto;margin:0;padding:0 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;font-size:56px;line-height:1.25;color:#ff6b6b;word-break:keep-all;animation:p13-blink 1s step-end infinite}
        .p13-dash-alert img{width:120px}
        .p13-dash.is-safe .p13-dash-alert{color:#6be39a;animation:none}
        @keyframes p13-blink{50%{opacity:.45}}

        .p13-scene{position:absolute;left:630px;top:140px;width:1250px;height:520px;box-sizing:border-box;border:solid 6px var(--c-purple);border-radius:36px;background:var(--c-mist) center / cover no-repeat}

        .p13-btns{position:absolute;left:40px;top:690px;width:1840px;display:flex;gap:24px}
        .p13-btn{flex:1 1 0;height:252px;box-sizing:border-box;padding:12px 12px 14px;border:solid 5px var(--c-ink);border-radius:28px;background:var(--c-white);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;
          font-family:'Cafe24 Ssurround';font-size:30px;line-height:1.2;color:var(--c-indigo);letter-spacing:-0.06em;word-break:keep-all;box-shadow:0 10px 0 0 var(--c-sky-pale);transition:transform .15s}
        .p13-btn:hover{border-color:var(--c-blue)}
        .p13-btn:active{transform:translateY(6px)}
        .p13-btn i{flex:1 1 auto;width:100%;border-radius:18px;background:var(--c-pale) center / cover no-repeat}
        .p13-btns.is-locked{pointer-events:none}

        .p13-ok img{display:block}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <p class="ask-pill has-stage p13-step"><i id="p13Mission"></i><span id="p13Title"></span></p>
          <p class="p13-timer" id="p13TimerBox">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13.5" r="8"/><path d="M12 13.5V9.5M9.5 2.5h5M12 2.5v3M18.5 6l1.5-1.5"/></svg>
            <span id="p13Timer">20</span>
          </p>

          <div class="p13-dash" id="p13Dash">
            <div class="p13-dash-title">AI 센서 대시보드</div>
            <p class="p13-dash-sensor" id="p13Sensor"></p>
            <p class="p13-dash-alert"><img src="../../resources/img/common/icon_warning.png" alt=""><span id="p13Alert"></span></p>
          </div>
          <div class="p13-scene" id="p13Scene"></div>

          <div class="p13-btns" id="p13Btns">
            <button class="p13-btn" data-key="gas"><i style="background-image:url('img/p13_btn_gas.png')"></i>가스 밸브 자동 잠금 및 환기팬 가동</button>
            <button class="p13-btn" data-key="cool"><i style="background-image:url('img/p13_btn_cool.png')"></i>스마트 에어컨 및 서큘레이터 가동</button>
            <button class="p13-btn" data-key="alarm"><i style="background-image:url('img/p13_btn_alarm.png')"></i>경보음 울리기 및 스마트폰 알림 발송</button>
            <button class="p13-btn" data-key="purifier"><i style="background-image:url('img/p13_btn_purifier.png')"></i>스마트 공기청정기 강풍 가동</button>
            <button class="p13-btn" data-key="sleep"><i style="background-image:url('img/p13_btn_sleep.png')"></i>수면 조명 켜기 및 커튼 닫기</button>
          </div>

          <div class="avatar-modal is-off" id="p13Right">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_correct_gwa.png" alt=""></div>
              <div class="avatar-popup-body is-finish">
                <p class="avatar-popup-text">미션성공!</p>
                <p class="avatar-popup-sub" id="p13RightText"></p>
                <button class="avatar-popup-next card-btn is-popup js-sfx p13-ok" id="p13RightNext" data-sound="sound/click.mp3">다음</button>
              </div>
            </div>
          </div>

          <div class="avatar-modal is-off" id="p13Wrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body is-finish">
                <p class="avatar-popup-text" id="p13WrongTitle">시간 초과!</p>
                <p class="avatar-popup-sub" id="p13WrongText">IoT는 센서의 정보를 바탕으로 빠르게 환경을 조정하여 우리 삶을 편리하게 해줘요! 조금만 더 빠르게 다시 도전 해 볼까요?</p>
                <button class="avatar-popup-next card-btn is-popup js-sfx p13-ok" id="p13WrongOk" data-sound="sound/click.mp3">확인</button>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="스마트홈! 실시간 위기 해결 미션" data-next="page14.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  (function () {
    const LIMIT = 20;
    const MISSIONS = shuffleArray([
      { n: 1, sensor: '가스 센서', alert: '가스 누출 감지!', key: 'gas',
        right: '가스 센서가 가스 누출을 감지해서 가스 밸브가 잠기고 환기팬이 켜졌네. 이제 안전해요!' },
      { n: 2, sensor: '거실 온도 센서', alert: '실내 온도 33도 돌파!', key: 'cool',
        right: '온도 센서가 높은 온도를 감지해서 에어컨과 서큘레이터가 켜졌어요. 거실이 시원해졌어요!' },
      { n: 3, sensor: '현관 CCTV', alert: '외출 중 낯선 움직임 포착!', key: 'alarm',
        right: '현관 CCTV가 낯선 움직임을 감지해서 경보음이 울리고 스마트폰 알림이 전송됐어요. 이제 안심이에요!' },
      { n: 4, sensor: '침실 미세먼지 센서', alert: '공기 오염도 ‘최악’!', key: 'purifier',
        right: '미세먼지 센서가 나쁜 공기를 감지해서 공기청정기가 강하게 작동했어요. 공기가 깨끗해졌어요!' },
      { n: 5, sensor: '조도 센서', alert: '밤 10시, 주변 매우 어두움!', key: 'sleep',
        right: '조도 센서가 어두운 방을 감지해서 수면 조명이 켜지고 커튼이 닫혔어요. 편안한 잠자리가 되었어요!' }
    ]);

    const timerEl = $('p13Timer');
    const timerBox = $('p13TimerBox');
    const btns = $('p13Btns');
    const scene = $('p13Scene');
    let index = 0;
    let remain = LIMIT;
    let tick = null;

    function stopClock() {
      clearInterval(tick);
    }

    function start() {
      const m = MISSIONS[index];
      $('p13Mission').textContent = 'Mission ' + (index + 1);
      $('p13Title').textContent = m.alert;
      $('p13Sensor').textContent = m.sensor;
      $('p13Alert').textContent = m.alert;
      $('p13Dash').classList.remove('is-safe');
      scene.style.backgroundImage = 'url(\'img/p13_scene_m' + m.n + '.jpg\')';
      btns.classList.remove('is-locked');
      remain = LIMIT;
      timerEl.textContent = remain;
      timerBox.classList.remove('is-hurry');
      clearInterval(tick);
      tick = setInterval(() => {
        remain -= 1;
        timerEl.textContent = remain;
        timerBox.classList.toggle('is-hurry', remain <= 5);
        if (remain <= 0) fail(true);
      }, 1000);
    }

    function fail(timeout) {
      stopClock();
      btns.classList.add('is-locked');
      playWrong();
      $('p13WrongTitle').textContent = timeout ? '시간 초과!' : 'AI 판단 오류!';
      $('p13WrongText').innerHTML = timeout
        ? 'IoT는 센서의 정보를 바탕으로 빠르게 환경을 조정하여 우리 삶을 편리하게 해줘요! 조금만 더 빠르게 다시 도전 해 볼까요?'
        : '센서가 보낸 실시간 데이터를 <br>다시 분석해 보세요.';
      $('p13Wrong').classList.remove('is-off');
    }

    btns.addEventListener('click', (e) => {
      const btn = e.target.closest('.p13-btn');
      if (!btn) return;
      if (btn.dataset.key !== MISSIONS[index].key) {
        fail(false);
        return;
      }
      stopClock();
      btns.classList.add('is-locked');
      playCorrect();
      $('p13Dash').classList.add('is-safe');
      scene.style.backgroundImage = 'url(\'img/p13_scene_m' + MISSIONS[index].n + '_on.jpg\')';
      $('p13RightText').textContent = MISSIONS[index].right;
      setTimeout(() => $('p13Right').classList.remove('is-off'), 3000);
    });

    $('p13WrongOk').addEventListener('click', () => {
      $('p13Wrong').classList.add('is-off');
      resetImageSwap($('p13WrongOk'));
      start();
    });

    $('p13RightNext').addEventListener('click', () => {
      if (index === MISSIONS.length - 1) {
        navigateTo('page14.html');
        return;
      }
      $('p13Right').classList.add('is-off');
      resetImageSwap($('p13RightNext'));
      index += 1;
      start();
    });

    start();
  })();
  </script>
</body>
</html>
