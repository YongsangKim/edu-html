<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>첫 블록 코딩, 엔트리로 배우는 순차</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 23p. 엔트리 기본 화면(개발 기능 없는 그림)을 보여 주고, 안내 창의 [다음]을 누르면 문구가 바뀌고 [시작하기] 버튼이 나옴(블록 3개가 위에서 차례로 쌓이는 연출). 엔트리 화면 그림은 HTML 모형, 이미지 img/p13_*.png, 캐릭터는 gwa/07 캐릭터 임시 복사본 */
        .en-win{position:absolute;left:40px;top:20px;width:1840px;height:740px;box-sizing:border-box;border:solid 6px var(--c-ink);border-radius:26px;background:#eef2fb}
        .en-area{position:absolute;box-sizing:border-box;border:solid 4px #b6c4e4;border-radius:14px;background:var(--c-white);overflow:hidden;transition:box-shadow .25s,border-color .25s}
        .en-tag{position:absolute;left:10px;top:8px;z-index:6;width:44px;height:44px;border-radius:50%;background:var(--c-purple);font-family:'Cafe24 Ssurround';font-size:28px;line-height:44px;text-align:center;color:var(--c-white);opacity:0}
        .en-stage{left:60px;top:50px;width:500px;height:380px;background:#fff url('img/p13_stage_bg.png') center / cover no-repeat}
        .en-objs{left:60px;top:450px;width:500px;height:290px;background:#f6f8fd}
        .en-pal{left:580px;top:50px;width:520px;height:690px;background:#f6f8fd;display:flex}
        .en-ws{left:1120px;top:50px;width:740px;height:690px;background:var(--c-white) radial-gradient(#d9e0f0 2px,transparent 2px) 0 0 / 28px 28px}

        .en-bar{position:absolute;left:60px;top:28px;margin:0;font-family:'Cafe24 Ssurround';font-size:20px;line-height:22px;color:var(--c-ink);letter-spacing:-0.05em}
        .en-run{position:absolute;right:12px;top:10px;z-index:4;height:46px;box-sizing:border-box;padding:6px 22px 0;border:0;border-radius:23px;background:#4a8cf0;font-family:'Cafe24 Ssurround';font-size:26px;color:var(--c-white);cursor:pointer}
        .en-star{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:#ffe27a center / contain no-repeat;border:solid 3px var(--c-yellow);box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-family:'Cafe24 Ssurround';font-size:28px;color:var(--c-ink)}
        .en-bot{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:#bfe0ff url('img/p13_bot.png') center / contain no-repeat;border:solid 4px var(--c-blue);box-sizing:border-box;z-index:2;transition:left 1s ease,top 1s ease}

        .en-objlist{margin:56px 14px 0;display:flex;flex-direction:column;gap:10px}
        .en-obj{height:64px;box-sizing:border-box;padding:6px 14px 0;border:solid 3px #b6c4e4;border-radius:10px;background:var(--c-white);display:flex;align-items:center;gap:12px;font-family:'Cafe24 Ssurround';font-size:26px;color:var(--c-ink)}
        .en-obj i{width:44px;height:44px;border-radius:50%;background:#bfe0ff center / contain no-repeat}

        .en-cats{flex:0 0 150px;display:flex;flex-direction:column;border-right:solid 3px #b6c4e4;background:#e7ecf8}
        .en-cat{flex:1 1 0;max-height:96px;padding:6px 0 0;border:0;border-bottom:solid 3px #d3dbef;background:none;font-family:'Cafe24 Ssurround';font-size:28px;color:var(--c-ink);letter-spacing:-0.05em;cursor:pointer}
        .en-cat.is-on{background:#a751e8;color:var(--c-white)}
        .en-list{flex:1 1 auto;position:relative;padding:60px 18px 0;display:flex;flex-direction:column;gap:30px;align-items:flex-start}

        .en-blk{--b:#a751e8;position:relative;box-sizing:border-box;height:58px;padding:8px 22px 0;display:flex;align-items:center;border-radius:10px;background:var(--b);font-family:'Cafe24 Ssurround';font-size:25px;color:var(--c-white);letter-spacing:-0.05em;white-space:nowrap;touch-action:none;user-select:none}
        .en-blk:before,.en-blk:after{content:'';position:absolute;left:26px;width:40px;height:12px}
        .en-blk:before{top:0;background:#fff;border-radius:0 0 8px 8px;opacity:.9}
        .en-blk:after{bottom:-12px;background:var(--b);border-radius:0 0 8px 8px}
        .en-blk.is-start{--b:#1fa89a;height:66px;border-radius:30px 30px 10px 10px}
        .en-blk.is-start:before{display:none}
        .en-blk.is-pick{cursor:grab}
        .en-blk.is-ghost{position:absolute;z-index:80;opacity:.92;box-shadow:0 8px 16px rgba(0,0,0,.3);pointer-events:none}
        .en-blk.is-blink{animation:en-blink .4s ease-in-out 4}
        .en-blk.is-target{box-shadow:0 0 0 6px var(--c-yellow)}
        .en-blk.is-run{box-shadow:0 0 0 6px #2fbf71}
        @keyframes en-blink{0%,100%{filter:none}50%{filter:brightness(1.6) saturate(2);box-shadow:0 0 0 8px var(--c-yellow)}}
        .en-ws .en-blk{position:absolute;left:60px;width:420px}
        .en-slot{position:absolute;left:60px;width:420px;height:58px;box-sizing:border-box;border:dashed 4px var(--c-yellow);border-radius:10px;background:rgba(255,216,61,.18);display:none}
        .en-slot.is-on{display:block}
        .en-trash{position:absolute;right:16px;bottom:16px;width:84px;height:84px;box-sizing:border-box;border:solid 4px #b6c4e4;border-radius:50%;background:var(--c-white) url('img/p14_trash.png') center / 60% no-repeat;font-size:0;transition:box-shadow .25s}
        .en-trash.is-glow,.en-pal.is-glow{box-shadow:0 0 0 8px var(--c-yellow)}

        .en-guide{position:absolute;left:40px;top:790px;width:1840px;height:150px;box-sizing:border-box;padding:0 40px 0 190px;display:flex;align-items:center;gap:30px;
          background:var(--c-cream);border:solid 5px var(--c-purple);border-radius:36px;box-shadow:-7px 10px 6px 2px rgba(92,61,240,.17)}
        .en-char{position:absolute;left:30px;bottom:6px;width:140px;height:170px}
        .en-char img{width:100%;height:100%;object-fit:contain;object-position:bottom}
        .en-text{margin:0;flex:1 1 auto;font-family:'Cafe24 Ssurround';font-size:38px;line-height:1.3;color:var(--c-purple);letter-spacing:-0.05em;word-break:keep-all}
        .en-next{flex:0 0 auto;padding:0;border:0;background:none;cursor:pointer}
        .en-next img{display:block}
        .en-next.is-off{display:none}
        .en-run.is-off{display:none}

    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="en-win"></div>
          <p class="en-bar">엔트리</p>
          <div class="en-area en-stage" id="enStage" data-a="1"><span class="en-tag">1</span>
            <button class="en-run is-off" id="enRun">시작하기</button>
            <div class="en-star" id="enStarMouth" style="left:90px;top:75px">입</div>
            <div class="en-star" id="enStarStomach" style="left:300px;top:175px">위</div>
            <div class="en-star" id="enStarIntestine" style="left:160px;top:310px">장</div>
            <div class="en-bot" id="enBot" style="left:90px;top:75px"></div>
          </div>
          <div class="en-area en-objs" id="enObjs" data-a="2"><span class="en-tag">2</span>
            <div class="en-objlist"><div class="en-obj"><i style="background-image:url('img/p13_bot.png')"></i>엔트리봇</div></div>
          </div>
          <div class="en-area en-pal" id="enPal" data-a="3"><span class="en-tag">3</span>
            <div class="en-cats" id="enCats"></div>
            <div class="en-list" id="enList"></div>
          </div>
          <div class="en-area en-ws" id="enWs" data-a="4"><span class="en-tag">4</span>
            <div class="en-blk is-start" id="enStart" style="left:60px;top:70px;width:420px">시작하기 버튼을 클릭했을 때</div>
            <div class="en-slot" id="enSlot"></div>
            <div class="en-trash" id="enTrash"></div>
          </div>

          <div class="en-guide">
            <div class="en-char"><img src="img/p_character_main.png" alt="메인 캐릭터"></div>
            <p class="en-text" id="enText">블록 코딩이란? 명령이 적힌 블록을 위에서 아래로 차례대로 연결해서 컴퓨터에게 일을 시키는 방법이에요.</p>
            <button class="en-next" id="enNext"><img src="../../img/common/btn_next_small.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_next_small_on.png" data-src-over="../../img/common/btn_next_small_over.png" data-sound="sound/click.mp3" alt="다음"></button>
            <a href="page14.html" class="js-nav-effect en-next is-off" id="enGo"><img src="../../img/common/btn_start.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_start_on.png" data-src-over="../../img/common/btn_start_over.png" data-sound="sound/click.mp3" alt="시작하기"></a>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="첫 블록 코딩, 엔트리로 배우는 순차" data-next="page14.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const CATS = ['시작', '흐름', '움직임', '생김새', '소리', '판단', '계산'];
    $('enCats').innerHTML = CATS.map((c) => '<button class="en-cat' + (c === '움직임' ? ' is-on' : '') + '">' + c + '</button>').join('');
    const names = ['1초 동안 입 위치로 이동하기', '1초 동안 위 위치로 이동하기', '1초 동안 장 위치로 이동하기'];
    $('enList').innerHTML = names.map((n) => '<div class="en-blk">' + n + '</div>').join('');

    $('enNext').addEventListener('click', () => {
      resetImageSwap($('enNext'));
      $('enNext').classList.add('is-off');
      $('enGo').classList.remove('is-off');
      $('enText').textContent = '어려운 글자를 쓰지 않아도, 블록을 끼우기만 하면 컴퓨터가 그 순서대로 움직여요. 한번 같이 알아볼까요?';
      const ws = $('enWs');
      ['입으로 이동하기', '위로 이동하기', '장으로 이동하기'].forEach((n, i) => {
        const b = document.createElement('div');
        b.className = 'en-blk';
        b.textContent = n;
        b.style.cssText = 'top:' + (136 + i * 58) + 'px;opacity:0;transform:translateY(-40px);transition:opacity .5s,transform .5s';
        ws.appendChild(b);
        setTimeout(() => { b.style.opacity = '1'; b.style.transform = 'none'; }, 400 + i * 700);
      });
    });
  })();
  </script>
</body>
</html>
