<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상호작용형 실습 콘텐츠</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        /* 디자인 없음 - 기획서 28p. page10(29p~)과 같은 배치: 왼쪽 말풍선·캐릭터, 가운데 스마트폰(홈 화면의 SmartThings 앱 아이콘 img/p09_app_icon.png를 누르면 실습 시작),
           오른쪽 집 안 그림(img/p09_house.png). 캐릭터는 임시로 sa/06 캐릭터 복사본 */

        .p09-bubble{position:absolute;margin:0;left:70px;bottom:570px;width:540px;min-height:200px;box-sizing:border-box;padding:30px;display:flex;align-items:center;justify-content:center;text-align:center;
          background:var(--c-cream);border:solid 5px var(--c-purple);border-radius:30px;box-shadow:-7px 10px 6px 2px rgba(92,61,240,.17);
          font-family:'Cafe24 Ssurround';font-size:40px;line-height:1.3;color:var(--c-purple);letter-spacing:-0.05em;word-break:keep-all;z-index:2}
        .p09-bubble:before{content:'';position:absolute;left:200px;bottom:-58px;width:100px;height:70px;background:url('../../resources/img/common/p_guide_tail.png') 0 0 / contain no-repeat}
        .p09-character{left:20px;top:420px;width:520px;height:520px}

        .p09-scene{position:absolute;left:1240px;top:40px;width:650px;height:880px;box-sizing:border-box;border:solid 6px var(--c-purple);border-radius:36px;background:var(--c-mist) url('img/p09_house.png') center / cover no-repeat}

        .p09-screen{position:relative;width:100%;height:100%}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <p class="p09-bubble">이제 우리가 직접 AI 스마트 홈 제어 앱인 Smart Things 을 활용해서 3가지 난이도의 자동화 루틴을 만들어 보자!</p>
          <div class="char-box p09-character"><img src="img/p_character_main.png" alt="메인 캐릭터"></div>

          <div class="phone-frame p09-phone">
            <div class="p09-screen phone-screen app-home is-sky">
              <div class="phone-status is-dark"></div>
              <a href="page10.html" class="js-nav-effect js-sfx app-icon is-dark p09-app" data-sound="sound/click.mp3" style="text-decoration:none"><i><img src="../../resources/img/app/logo_smartthings.png" alt=""></i>SmartThings</a>
              <div class="phone-nav"></div>
            </div>
          </div>
          <div class="p09-scene"></div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="상호작용형 실습 콘텐츠" data-next="page10.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>pointFingerAt(document.querySelector('.p09-app'), { onMain: true, dx: 15, dy: -37 });</script>
</body>
</html>
