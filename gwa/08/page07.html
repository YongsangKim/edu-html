<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일상생활 속 순차 찾기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 11~13p. 아래 그림 카드 4장을 1~4단계 칸(블록 코딩 모양 테두리)에 순서대로 끌어 놓기(공용 initStepOrder).
           맞으면 딸깍 소리와 함께 칸에 붙고 장면 그림이 바뀜, 틀리면 카드가 제자리로 돌아가고 단계별 오답 팝업 2초.
           다 놓으면 완료 모달. 장면 img/p07_scene_{0~4}.png. 캐릭터는 gwa/07 캐릭터 임시 복사본 */
        .so-title{position:absolute;left:620px;top:30px;width:1260px;height:90px;margin:0;box-sizing:border-box;padding:6px 30px 0;display:flex;align-items:center;justify-content:center;
          background:var(--c-white);border:solid 5px var(--c-purple);border-radius:45px;box-shadow:0 8px 0 0 var(--c-sky-pale);
          font-family:'Cafe24 Ssurround';font-size:42px;color:var(--c-purple);letter-spacing:-0.05em;word-break:keep-all;text-align:center}
        .so-bubble{left:30px;top:auto;bottom:565px;width:570px;min-height:200px;font-size:38px;line-height:1.3;color:var(--c-purple);font-family:'Cafe24 Ssurround';letter-spacing:-0.05em;word-break:keep-all;text-align:center}
        .so-char{left:30px;top:400px;width:560px;height:540px}

        .so-scene{position:absolute;left:620px;top:30px;width:590px;height:550px;box-sizing:border-box;border:solid 6px var(--c-purple);border-radius:30px;background:var(--c-mist) center / cover no-repeat}

        .so-slots{position:absolute;left:1290px;top:50px;width:590px;--blk-hole:#d4dff0}
        .so-slot{height:124px;display:block}
        .so-no{position:absolute;left:70px;top:50%;transform:translateY(-40%);font-size:38px;color:var(--c-violet);white-space:nowrap}
        .so-slot .so-card{position:absolute;left:215px;top:0;right:24px;bottom:0;width:auto;height:auto;justify-content:flex-start;text-align:left;border:0;border-radius:0;background:none;padding:0;display:flex;align-items:center;cursor:default;box-shadow:none;filter:none;font-size:34px;color:var(--c-ink);padding-top:10px}
        .so-slot .so-card:after{display:none}

        .so-cards{position:absolute;left:620px;top:600px;width:1260px;display:grid;grid-template-columns:repeat(2,590px);gap:36px 80px}
        .so-card[data-step="0"]{--blk-c:#ffd56a}.so-card[data-step="1"]{--blk-c:#f59a9a}.so-card[data-step="2"]{--blk-c:#8fdcb8}.so-card[data-step="3"]{--blk-c:#c4a8f0}
        .so-badge{position:absolute;left:18px;top:14px;width:70px;height:70px;border-radius:50%;background:#e8605f;border:solid 4px var(--c-white);box-sizing:border-box;padding-top:4px;display:flex;align-items:center;justify-content:center;font-family:'Cafe24 Ssurround';font-size:44px;color:var(--c-white);z-index:2}
        .so-cell{height:124px}
        .so-card{width:100%;height:124px;padding:20px 30px 0;display:flex;align-items:center;justify-content:center;text-align:center;cursor:grab;touch-action:none;font-size:34px;line-height:1.15;letter-spacing:-0.05em;word-break:keep-all}
        .so-card.is-dragging{cursor:grabbing;z-index:60}
        .so-card.is-wrong{animation:fix-word-shake .3s ease}

        .so-modal .avatar-card{padding-top:60px}
        .so-modal .avatar-card-text{font-size:50px;line-height:1.3}
        .so-modal .avatar-card.is-center .avatar-card-text{text-align:left;padding-left:200px}
        .so-modal .avatar-card-title{margin-bottom:24px}
        .so-sum{margin:28px 0 0;padding:0;list-style:none;display:flex;gap:16px;font-family:'Cafe24 Ssurround';font-size:34px;color:var(--c-ink)}
        .so-sum li{padding:8px 16px 2px;border:solid 4px var(--c-purple);border-radius:16px;background:var(--c-white);white-space:nowrap}
        .so-sum b{margin-right:8px;color:var(--c-violet);font-weight:normal}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
                    <p class="guide-bubble so-bubble is-center" id="soBubble">물 없는 냄비에 라면을 넣으면 안 되듯이, 양치질도 순서가 중요해! 양치하는 과정을 차례대로 놓아 보자!</p>
          <div class="char-box so-char"><img src="img/p_character_main.png" alt="메인 캐릭터"></div>

          <div class="so-scene" id="soScene"><span class="so-badge" id="soBadge">1</span></div>
          <div class="so-slots blk-col" id="soSlots">
            <div class="so-slot blk is-empty" data-step="0"><span class="so-no">1단계</span></div>
            <div class="so-slot blk is-empty" data-step="1"><span class="so-no">2단계</span></div>
            <div class="so-slot blk is-empty" data-step="2"><span class="so-no">3단계</span></div>
            <div class="so-slot blk is-empty" data-step="3"><span class="so-no">4단계</span></div>
          </div>
          <div class="so-cards" id="soCards">
            <div class="so-cell"><div class="so-card blk" data-step="1">칫솔 위에 치약 짜기</div></div>
            <div class="so-cell"><div class="so-card blk" data-step="3">물로 입 헹구기</div></div>
            <div class="so-cell"><div class="so-card blk" data-step="0">칫솔과 치약 준비하기</div></div>
            <div class="so-cell"><div class="so-card blk" data-step="2">칫솔로 이 닦기</div></div>
          </div>

          <div class="ox-result-wrong is-avatar is-off" id="soWrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">다시 생각해볼까요?</p>
                <p class="avatar-popup-sub" id="soWrongText"></p>
              </div>
            </div>
          </div>

          <div class="avatar-modal so-modal is-off" id="soDone">
            <div class="avatar-card is-center">
              <img class="avatar-card-avatar" src="../../img/common/avatar_finish.png" alt="">
              <div class="avatar-card-body">
                <div class="step-flow">
                  <div class="step-panel">
                    <p class="avatar-card-title">잘했어요!</p><p class="avatar-card-text">양치를 완료했어요. 우리가 먹은 음식이 입, 위, 장의 순서로 이동하는 것처럼 라면 끓이기와 양치하기도 정해진 순서대로 해야 해요.</p>
                    <a href="page08.html" class="js-nav-effect avatar-card-btn">
                      <img src="../../img/common/btn_arrow_small.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_arrow_small_on.png" data-src-over="../../img/common/btn_arrow_small_over.png" data-sound="sound/click.mp3" alt="다음">
                    </a>
                  </div>
                  <div class="step-panel">
                    <p class="avatar-card-text">컴퓨터도 마찬가지로 정해진 순서대로 <br>일을 처리해요.</p>
                    <a href="page08.html" class="js-nav-effect avatar-card-btn">
                      <img src="../../img/common/btn_arrow_small.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_arrow_small_on.png" data-src-over="../../img/common/btn_arrow_small_over.png" data-sound="sound/click.mp3" alt="다음">
                    </a>
                  </div>
                  <div class="step-panel">
                    <p class="avatar-card-text">컴퓨터는 어떻게 순서대로 일을 처리하는지<br> 알아보러 가볼까요?</p>
                    <a href="page08.html" class="js-nav-effect avatar-card-btn">
                      <img src="../../img/common/btn_next_small.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_next_small_on.png" data-src-over="../../img/common/btn_next_small_over.png" data-sound="sound/click.mp3" alt="다음">
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="일상생활 속 순차 찾기" data-next="page08.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const BUBBLES = ["물 없는 냄비에 라면을 넣으면 안 되듯이, 양치질도 순서가 중요해! 양치하는 과정을 차례대로 놓아 보자!","양치하는 순서대로 카드를 놓아 보세요."];
    const WRONG = ["가장 먼저 칫솔과 치약을 준비해야 해요.","칫솔과 치약을 준비한 다음에는 칫솔에 치약을 짜요.","치약을 짠 다음에는 칫솔로 이를 깨끗하게 닦아요.","이를 다 닦은 다음에는 마지막으로 물로 입을 헹궈요."];
    const scene = $('soScene');
    const setScene = (n) => { scene.style.backgroundImage = "url('img/p07_scene_" + n + ".png')"; };
    setScene(0);
    setTimeout(() => { $('soBubble').innerHTML = BUBBLES[1]; }, 5000);

    initStepOrder({
      cards: Array.from(document.querySelectorAll('#soCards .so-card')),
      zones: Array.from(document.querySelectorAll('#soSlots .so-slot')),
      steps: WRONG.map((wrong) => ({ wrong })),
      wrongModal: $('soWrong'),
      wrongText: $('soWrongText'),
      onStep: (n) => { setScene(n); $('soBadge').textContent = Math.min(n + 1, WRONG.length); },
      onDone: () => setTimeout(() => $('soDone').classList.remove('is-off'), 900)
    });
  })();
  </script>
</body>
</html>
