<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>음식 속에 숨겨진 정보를 찾아라!</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 캐릭터 img/p01_character.png는 p12_character_intro 임시 복사본(디자인의 돋보기 로봇 이미지로 교체 필요) */
        .p-how .intro-list{font-size:50px}
        .intro-lead{font-size:58px}
        .intro-panel.p-how-panel{padding-top:86px;gap:18px}
        .p-how{margin-top:12px}
        .p-how-lead.p01-outro{font-size:46px;margin-top:0;word-break:keep-all}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="intro-character"><img src="img/p01_character.png" alt="메인 캐릭터"></div>
          <div class="intro-panel p-how-panel">
            <p class="intro-tab">음식 속에 숨겨진 정보를 찾아라!</p>
            <p class="intro-lead">한 접시에 여러 음식들이 담겨 있어요.<br>음식을 하나씩 잘 살펴보고, 정보를 찾아보세요.</p>
            <div class="p-how">
              <b>게임 방법</b>
              <ol class="intro-list">
                <li>1. 접시에 놓인 음식들을 잘 살펴봐요.</li>
                <li>2. 질문에 해당하는 정보를 선택해요.</li>
              </ol>
            </div>
            <p class="p-how-lead p01-outro">맞는 정보를 찾는 연습을 하면서 인공지능의 원리에 대해 이해해볼까요?</p>
          </div>

          <a href="page02.html" class="js-nav-effect next-btn-intro">
            <img src="../../img/common/btn_start.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_start_on.png" data-src-over="../../img/common/btn_start_over.png" data-sound="sound/click.mp3" alt="시작하기">
          </a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="음식 속에 숨겨진 정보를 찾아라!" data-next="page02.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
