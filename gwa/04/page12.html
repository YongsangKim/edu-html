<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀴즈 풀기</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="quiz-stage">
          <div class="step-flow">

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../resources/img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q1.</span>
                  <p class="quiz-ask">AI가 만든 자료는 항상 정확하므로 무조건 믿어도 될까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz" data-wrong="다시 한번 생각해볼까요?">
                <button class="answer-pick ox-pick is-o" data-correct="false" aria-label="O">
                  <img class="js-img-swap" src="../../resources/img/common/icon_o.png" data-src-on="../../resources/img/common/icon_o_on.png" alt="O">
                </button>
                <button class="answer-pick ox-pick is-x" data-correct="true" aria-label="X">
                  <img class="js-img-swap" src="../../resources/img/common/icon_x.png" data-src-on="../../resources/img/common/icon_x_on.png" alt="X">
                </button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../resources/img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q2.</span>
                  <p class="quiz-ask">AI가 만든 이미지 속 손가락 개수나 글자 모양이 잘못 표현되는 실수는 무엇일까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-row" data-wrong="다시 한번 생각해볼까요?">
                <button class="answer-pick card-btn is-quiz is-long" data-correct="true">이미지 생성 오류</button>
                <button class="answer-pick card-btn is-quiz is-long" data-correct="false">AI 환각</button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../resources/img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q3.</span>
                  <p class="quiz-ask">AI가 근거 없는 정보를 사실처럼 만들어 제시하는 현상은 무엇일까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-row" data-wrong="다시 한번 생각해볼까요?">
                <button class="answer-pick card-btn is-quiz is-long" data-correct="false">이미지 생성 오류</button>
                <button class="answer-pick card-btn is-quiz is-long" data-correct="true">AI 환각</button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../resources/img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q4.</span>
                  <p class="quiz-ask">오류를 확인하고 수정하는 방법으로 알맞지 않은 것은 무엇일까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-list is-left" data-wrong="다시 한번 생각해볼까요?">
                <button class="answer-pick card-btn" data-correct="false">결과물을 자세히 살펴본다</button>
                <button class="answer-pick card-btn" data-correct="false">믿을 수 있는 자료와 비교한다</button>
                <button class="answer-pick card-btn" data-correct="true">틀렸다고 생각되는 부분은 내가 알고 있는대로 고친다.</button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../resources/img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q5.</span>
                  <p class="quiz-ask">AI 정보에 출처가 표시되어 있다면, 직접 학인하지 않고 믿어도 될까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz" data-next="page13.html" data-wrong="다시 한번 생각해볼까요?">
                <button class="answer-pick ox-pick is-o" data-correct="false" aria-label="O">
                  <img class="js-img-swap" src="../../resources/img/common/icon_o.png" data-src-on="../../resources/img/common/icon_o_on.png" alt="O">
                </button>
                <button class="answer-pick ox-pick is-x" data-correct="true" aria-label="X">
                  <img class="js-img-swap" src="../../resources/img/common/icon_x.png" data-src-on="../../resources/img/common/icon_x_on.png" alt="X">
                </button>
              </div>
            </div>

          </div>

          <div class="ox-result-correct is-avatar is-off" data-sound="sound/correct.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_correct_gwa.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">정답이에요!</p>
              </div>
              <div class="avatar-popup-extra"><img src="../../resources/img/common/icon_correct.png" alt=""></div>
            </div>
          </div>
          <div class="ox-result-wrong is-avatar is-off" data-sound="sound/incorrect.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">다시 한번 생각해볼까요?</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="퀴즈 풀기" data-next="page13.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
</body>
</html>
