<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI의 이미지 분석 정보 알아보기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 12~20p. 3문제(사과·바나나·버스). 한 문제 = 정보 단계(모양·색깔·특징 버튼을 눌러 분석 정보 확인, 물음표만 보임 → 다음) +
           정답 단계(분석 정보 요약을 보고 사물 3개 중 고르기). 정답 모달 2초 뒤 다음 버튼, 3번째는 바로 완료 모달 3단계. 사물 그림은 이모지 임시 */
        .p07-ask{position:absolute;left:310px;top:20px;width:1300px;height:80px;margin:0;box-sizing:border-box;padding:6px 30px 0;display:flex;align-items:center;justify-content:center;
          background:var(--c-white);border:solid 5px var(--c-purple);border-radius:40px;box-shadow:0 8px 0 0 var(--c-sky-pale);
          font-family:'Cafe24 Ssurround';font-size:42px;color:var(--c-purple);letter-spacing:-0.05em}
        .p07-obj{position:absolute;left:150px;top:150px;width:700px;height:700px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
          background:var(--c-white);border:solid 6px var(--c-purple);border-radius:40px;box-shadow:0 8px 0 0 var(--c-sky-pale);font-family:'Cafe24 Ssurround';font-size:420px;line-height:1;color:var(--c-violet)}
        .p07-obj.is-open{font-size:360px}
        .p07-obj img{display:block;width:480px;height:480px;object-fit:contain}
        .p07-text{position:absolute;left:940px;top:150px;width:830px;height:260px;box-sizing:border-box;padding:26px 40px 0;display:flex;align-items:center;justify-content:center;text-align:center;
          background:var(--c-white);border:solid 6px var(--c-purple);border-radius:30px;font-family:'Cafe24 Ssurround';font-size:54px;line-height:1.25;color:var(--c-ink);letter-spacing:-0.05em;word-break:keep-all}
        .p07-text.is-empty{color:rgba(0,0,0,.25)}
        .p07-chips{position:absolute;left:940px;top:150px;width:830px;display:flex;flex-direction:column;gap:20px}
        .p07-chip{height:100px;box-sizing:border-box;padding:12px 40px 0;display:flex;align-items:center;background:var(--c-white);border:solid 5px var(--c-purple);border-radius:50px;font-family:'Cafe24 Ssurround';font-size:50px;color:var(--c-ink);letter-spacing:-0.05em}
        .p07-btns{position:absolute;left:940px;top:470px;width:830px;display:flex;justify-content:space-between}
        .p07-btns .card-btn{width:260px;min-width:0;font-size:50px;padding:10px 0 0}
        .p07-opts{position:absolute;left:940px;top:520px;width:830px;display:flex;justify-content:space-between}
        .p07-opts .card-btn{width:260px;min-width:0;height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:48px;padding:10px 0 0}
        .p07-opts .card-btn span{font-size:84px;line-height:1}
        .p07-next{position:absolute;right:150px;bottom:50px}
        .p07-hide{display:none}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <p class="p07-ask" id="p07Ask">AI가 분석한 이미지 속 사물의 특징을 살펴볼까요?</p>
          <div class="p07-obj" id="p07Obj">?</div>

          <div id="p07Info">
            <p class="p07-text is-empty" id="p07Text">?</p>
            <div class="p07-btns">
              <button class="card-btn js-sfx" data-sound="sound/click.mp3" data-i="0">1. 모양</button>
              <button class="card-btn js-sfx" data-sound="sound/click.mp3" data-i="1">2. 색깔</button>
              <button class="card-btn js-sfx" data-sound="sound/click.mp3" data-i="2">3. 특징</button>
            </div>
          </div>
          <div class="p07-hide" id="p07Ans">
            <div class="p07-chips" id="p07Chips"></div>
            <div class="p07-opts" id="p07Opts"></div>
          </div>
          <button class="card-btn p07-next p07-hide js-sfx" id="p07Next" data-sound="sound/click.mp3">다음</button>

          <div class="ox-result-correct is-avatar is-off" id="p07Right">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_correct_gwa.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">정답이에요!</p>
                <p class="avatar-popup-sub" id="p07RightSub"></p>
              </div>
              <div class="avatar-popup-extra"><img src="../../img/common/icon_correct.png" alt=""></div>
            </div>
          </div>
          <div class="ox-result-wrong is-avatar is-off" id="p07Wrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text is-small">AI가 분석한 사물의 특징을<br>다시 한번 살펴볼까요?</p>
              </div>
            </div>
          </div>

          <div class="avatar-modal is-off" id="p07Done">
            <div class="avatar-card is-left">
              <img class="avatar-card-avatar" src="../../img/common/avatar_finish.png" alt="">
              <div class="avatar-card-body">
                <div class="step-flow">
                  <div class="step-panel is-title">
                    <p class="avatar-card-text">AI가 분석한 정보를 보고,<br>어떤 이미지인지 모두 맞췄어요.</p>
                    <a href="page08.html" class="js-nav-effect avatar-card-btn card-btn is-popup js-sfx is-arrow" data-sound="sound/click.mp3">→</a>
                  </div>
                  <div class="step-panel">
                    <p class="avatar-card-text">AI는 모양과 색깔 외에도 선, 패턴, 그림자 같은 훨씬 더 많고 세밀한 정보를 다양하게 분석하여 이미지의 특징을 찾아내요.</p>
                    <a href="page08.html" class="js-nav-effect avatar-card-btn card-btn is-popup js-sfx is-arrow" data-sound="sound/click.mp3">→</a>
                  </div>
                  <div class="step-panel">
                    <p class="avatar-card-text">설리번 플러스에서 카메라에 비친 모습을<br>AI가 어떻게 설명해 주는지<br>직접 확인해볼까요?</p>
                    <a href="page08.html" class="js-nav-effect avatar-card-btn card-btn is-popup js-sfx" data-sound="sound/click.mp3">다음</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="AI의 이미지 분석 정보 알아보기" data-next="page08.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const QS = [
      { emoji: '🍎', texts: ['동그란 모양이에요.', '빨간색이에요.', '꼭지와 잎이 있어요.'], chips: ['둥근 모양', '빨간색', '꼭지와 잎'],
        opts: [['🍎', '사과', true], ['🍅', '토마토'], ['⚽', '공']], fb: 'AI가 분석한 이미지는 사과였어요.' },
      { emoji: '🍌', texts: ['길쭉하고 휘어진 모양이에요.', '노란색이에요.', '양 끝이 가늘고 껍질이 있어요.'], chips: ['길쭉하고 휘어진 모양', '노란색', '꼭지'],
        opts: [['🍋', '레몬'], ['🌙', '초승달'], ['🍌', '바나나', true]], fb: 'AI가 분석한 이미지는 바나나였어요.' },
      { emoji: '🚌', texts: ['길쭉한 네모 모양이에요.', '파란색이에요.', '많은 창문과 큰 문이 있어요.'], chips: ['길쭉한 네모 모양', '파란색', '많은 창문과 큰 문'],
        opts: [['🚚', '트럭'], ['🚌', '버스', true], ['🚗', '승용차']], fb: 'AI가 분석한 이미지는 버스였어요.' }
    ];
    const $q = (s) => document.querySelector(s);
    const infoBtns = Array.from(document.querySelectorAll('.p07-btns .card-btn'));
    let q = 0, seen = new Set();
    const show = (el, on) => el.classList.toggle('p07-hide', !on);

    function startQ() {
      const d = QS[q];
      seen = new Set();
      $('p07Ask').textContent = 'AI가 분석한 이미지 속 사물의 특징을 살펴볼까요?';
      $('p07Obj').textContent = '?';
      $('p07Obj').classList.remove('is-open');
      $('p07Text').textContent = '?';
      $('p07Text').classList.add('is-empty');
      infoBtns.forEach((b) => b.classList.remove('is-selected'));
      show($('p07Info'), true); show($('p07Ans'), false); show($('p07Next'), false);
    }
    infoBtns.forEach((b) => b.addEventListener('click', () => {
      const i = +b.dataset.i;
      $('p07Text').textContent = QS[q].texts[i];
      $('p07Text').classList.remove('is-empty');
      b.classList.add('is-selected');
      seen.add(i);
      if (seen.size === 3) { show($('p07Next'), true); $('p07Next').dataset.phase = 'info'; }
    }));

    function startAnswer() {
      const d = QS[q];
      $('p07Ask').textContent = 'AI가 분석한 특징을 보고, 어떤 사물인지 맞혀 볼까요?';
      $('p07Chips').innerHTML = d.chips.map((c) => '<div class="p07-chip">' + c + '</div>').join('');
      $('p07Opts').innerHTML = '';
      d.opts.forEach((o) => {
        const b = document.createElement('button');
        b.className = 'card-btn';
        b.innerHTML = '<span>' + o[0] + '</span>' + o[1];
        b.addEventListener('click', () => pick(b, !!o[2]));
        $('p07Opts').appendChild(b);
      });
      show($('p07Info'), false); show($('p07Ans'), true); show($('p07Next'), false);
    }

    function pick(btn, right) {
      playClick();
      if (!right) {
        playWrong();
        flashLayer($('p07Wrong'), 'is-off', 2000);
        return;
      }
      playCorrect();
      $('p07Obj').textContent = QS[q].emoji;
      $('p07Obj').classList.add('is-open');
      $('p07RightSub').textContent = QS[q].fb;
      flashLayer($('p07Right'), 'is-off', 2000);
      Array.from($('p07Opts').children).forEach((b) => { b.disabled = true; });
      setTimeout(() => {
        if (q < QS.length - 1) { $('p07Next').dataset.phase = 'right'; show($('p07Next'), true); }
        else $('p07Done').classList.remove('is-off');
      }, 2100);
    }

    $('p07Next').addEventListener('click', () => {
      if ($('p07Next').dataset.phase === 'info') startAnswer();
      else { q += 1; startQ(); }
    });
    startQ();
  })();
  </script>
</body>
</html>
