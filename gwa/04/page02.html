<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카메라에 찍힌 범인을 찾아라!</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 3~5p. 총 5회(범인 5명이 무작위 순서로 한 명씩 CCTV 모니터에 등장, 후보 5명 위치도 매번 무작위).
           맞히면 철창이 위에서 내려오고 검거 도장, 틀리면 오답 모달 2초. 마지막 검거 뒤 완료 모달 3단계.
           사람 그림은 img/p02_face_1~5.png(없으면 이모지로 대체) */
        .p02-count{position:absolute;left:100px;top:40px;height:80px;box-sizing:border-box;padding:12px 40px 0;display:flex;align-items:center;
          background:var(--c-white);border:solid 5px var(--c-purple);border-radius:40px;font-family:'Cafe24 Ssurround';font-size:44px;color:var(--c-purple)}
        .p02-mon{position:absolute;left:560px;top:30px;width:800px;height:480px;box-sizing:border-box;border:solid 16px #2b3445;border-radius:30px;background:#1b2230;overflow:hidden;box-shadow:0 10px 0 0 rgba(43,52,69,.35)}
        .p02-mon:before{content:'';position:absolute;left:30px;top:26px;width:26px;height:26px;border-radius:50%;background:#e8353a;animation:p02-rec 1s steps(2) infinite}
        .p02-cul{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:260px;line-height:1;filter:grayscale(.85) contrast(1.1)}
        .p02-cul img,.p02-cand img{display:block;width:100%;height:100%;object-fit:contain}
        .p02-cul img{width:380px;height:380px}
        .p02-cands{position:absolute;left:60px;top:560px;width:1800px;display:flex;justify-content:space-between}
        .p02-cand{position:relative;width:320px;height:340px;box-sizing:border-box;padding:0;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:170px;line-height:1;
          background:var(--c-white);border:solid 6px var(--c-purple);border-radius:30px;cursor:pointer;box-shadow:0 8px 0 0 var(--c-sky-pale)}
        .p02-cand img{width:240px;height:240px}
        .p02-cand:hover:not(.is-caught){outline:solid 8px var(--c-violet);outline-offset:-2px}
        .p02-cand.is-wrong{animation:fix-word-shake .3s ease}
        .p02-bars{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#9aa4b2 0 14px,transparent 14px 50px),linear-gradient(180deg,#9aa4b2 0 14px,transparent 14px calc(100% - 14px),#9aa4b2 calc(100% - 14px));transform:translateY(-105%);transition:transform .5s ease-in;pointer-events:none}
        .p02-cand.is-caught .p02-bars{transform:none}
        .p02-stamp{position:absolute;white-space:nowrap;left:50%;top:50%;margin:0;padding:6px 20px 0;border:solid 8px #e8353a;border-radius:16px;font-family:'Cafe24 Ssurround';font-size:60px;line-height:1.2;color:#e8353a;letter-spacing:-0.05em;
          background:rgba(255,255,255,.85);transform:translate(-50%,-50%) rotate(-14deg) scale(2.2);opacity:0;pointer-events:none}
        .p02-cand.is-caught .p02-stamp{opacity:1;transform:translate(-50%,-50%) rotate(-14deg) scale(1);transition:transform .25s ease .5s,opacity .1s ease .5s}
        .p02-lock .p02-cand{pointer-events:none}
        @keyframes p02-rec{50%{opacity:0}}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default" id="p02Main">
          <p class="p02-count" id="p02Count">1 / 5</p>
          <div class="p02-mon"><div class="p02-cul" id="p02Cul"></div></div>
          <div class="p02-cands" id="p02Cands"></div>

          <div class="ox-result-wrong is-avatar is-off" id="p02Wrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">범인의 모습이 찍힌 사진(이미지)를<br>다시 한번 확인해 볼까요?</p>
              </div>
            </div>
          </div>

          <div class="avatar-modal is-off" id="p02Done">
            <div class="avatar-card is-left">
              <img class="avatar-card-avatar" src="../../img/common/avatar_finish.png" alt="">
              <div class="avatar-card-body">
                <div class="step-flow">
                  <div class="step-panel is-title">
                    <p class="avatar-card-title">정말 잘했어요!</p>
                    <p class="avatar-card-text">범인을 모두 검거하는데 성공했어요.</p>
                    <a href="page03.html" class="js-nav-effect avatar-card-btn card-btn is-popup js-sfx is-arrow" data-sound="sound/click.mp3">→</a>
                  </div>
                  <div class="step-panel">
                    <p class="avatar-card-text">우리가 눈으로 사람을 알아보듯,<br>컴퓨터는 카메라를 통해 이미지를<br>입력 받아 사람을 찾아낼 수 있어요.</p>
                    <a href="page03.html" class="js-nav-effect avatar-card-btn card-btn is-popup js-sfx is-arrow" data-sound="sound/click.mp3">→</a>
                  </div>
                  <div class="step-panel">
                    <p class="avatar-card-text">컴퓨터가 카메라로 세상을 바라보고<br>이미지를 분석하는 방법에 대해 알아볼까요?</p>
                    <a href="page03.html" class="js-nav-effect avatar-card-btn card-btn is-popup js-sfx" data-sound="sound/click.mp3">다음</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="카메라에 찍힌 범인을 찾아라!" data-next="page03.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const FACES = ['😀', '😎', '🤓', '🥸', '😜'];
    const face = (i) => '<img src="img/p02_face_' + (i + 1) + '.png" alt="" onerror="this.replaceWith(document.createTextNode(\'' + FACES[i] + '\'))">';
    const main = $('p02Main'), cands = $('p02Cands');
    const order = shuffleArray([0, 1, 2, 3, 4]);
    let round = 0;

    function setRound() {
      const target = order[round];
      $('p02Count').textContent = (round + 1) + ' / 5';
      $('p02Cul').innerHTML = face(target);
      cands.innerHTML = '';
      shuffleArray([0, 1, 2, 3, 4]).forEach((f) => {
        const b = document.createElement('button');
        b.className = 'p02-cand';
        b.setAttribute('aria-label', '사람 ' + (f + 1));
        b.innerHTML = face(f) + '<i class="p02-bars"></i><p class="p02-stamp">검거</p>';
        b.addEventListener('click', () => pick(b, f === target));
        cands.appendChild(b);
      });
      main.classList.remove('p02-lock');
    }

    function pick(btn, right) {
      if (!right) {
        playWrong();
        btn.classList.remove('is-wrong'); void btn.offsetWidth; btn.classList.add('is-wrong');
        flashLayer($('p02Wrong'), 'is-off', 2000);
        return;
      }
      main.classList.add('p02-lock');
      playCorrect();
      btn.classList.add('is-caught');
      round += 1;
      setTimeout(() => {
        if (round < 5) setRound();
        else $('p02Done').classList.remove('is-off');
      }, 2200);
    }
    setRound();
  })();
  </script>
</body>
</html>
