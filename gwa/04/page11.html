                <div class="gg-bar is-active" data-g-show="list" style="top:130px"><i data-ic="search"></i><span>가장 피해를 많이 준 태풍</span><b><i data-ic="micFill"></i><i data-ic="lensCam"></i></b></div>
                <div class="gg-tabs" data-g-show="none list"><span>AI 모드</span><span>전체</span><span>쇼핑</span><span>이미지</span><span class="is-on">뉴스</span><span>동영상</span></div>
                <div class="gg-none" data-g-show="none">검색어와 일치하는 뉴스 검색 결과가 없습니다.</div>
                <div class="gg-list" data-g-show="list" id="ggList"></div>
                <div class="gg-nav"><div class="on"><b><i data-ic="home"></i></b>홈</div><div><b><i data-ic="search"></i></b>검색</div><div><b><i data-ic="bellG"></i></b>알림</div><div><b><i data-ic="histG"></i></b>활동</div></div>
              </div>
              <div class="kbd-cj"></div>
              <button type="button" class="gg-go" id="ggGo" aria-label="검색"></button>
              <div class="phone-nav" id="p11NavGg"></div>
            </div>
          </div></div>

          <div class="p11-cmp is-off" id="p11Cmp">
            <div><h4>환각 답변</h4><span id="cmpA1"></span></div>
            <div><h4>수정 답변</h4><div id="cmpA2"></div></div>
          </div>

          <div class="p11-side" id="p11Side"></div>
          <button type="button" class="card-btn is-start p11-ref is-hide js-sfx" id="p11Ref" data-sound="sound/click.mp3">자료 확인하기</button>
          <button type="button" class="card-btn is-start next-btn is-hide js-sfx" id="p11Next" data-sound="sound/click.mp3">다음</button>

          <div class="p11-md is-off" id="p11News">
            <div class="p11-md-panel">
              <img class="pic" data-src="img/p11_data.png" alt="">
              <button type="button" class="p11-md-x js-sfx" id="p11NewsClose" data-sound="sound/click.mp3" aria-label="닫기"></button>
            </div>
          </div>

          <div class="avatar-modal p11-end is-off" id="p11End">
            <div class="avatar-card is-side">
              <img class="avatar-card-avatar" src="../../resources/img/common/avatar_finish.png" alt="">
              <div class="avatar-card-body"><p class="avatar-card-text">AI가 만든 그림과 글의 실수를 찾아 수정했어요!<br>이제 퀴즈를 풀며 배운 내용을 확인해볼까요?</p></div>
              <a href="page12.html" class="js-nav-effect avatar-card-btn card-btn next-btn is-popup js-sfx" data-sound="sound/click.mp3">다음</a>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="AI의 실수를 직접 확인하고 수정하기" data-next="page12.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script src="../../resources/js/box-edit.js"></script>
  <script>
  (function () {
    const Q1 = '우리나라에서 가장 큰 재산 피해를 준 태풍의 이름과 발생 연도를 알려 줘.';
    const A1 = '우리나라에서 가장 큰 재산 피해를 준 태풍은 2025년에 발생한 태풍 ‘갤럭시’입니다.';
    const Q2 = '기상청 자료를 확인해 보니 2025년에 태풍 갤럭시는 발생하지 않았어. 기상청의 실제 기록을 바탕으로 우리나라에서 가장 큰 재산 피해를 준 태풍의 이름과 발생 연도를 정확하게 다시 알려 줘.';
    const A2 = '기상청 통계 및 재난 연보 기록에 따른 우리나라 역대 가장 큰 재산 피해 및 인명 피해를 준 태풍의 이름과 발생 연도는 다음과 같습니다.';
    const A2L = ['<b>발생 연도: 2002년</b> (8월 23일 북서태평양 발생, 8월 31일~9월 1일 한반도 상륙)', '<b>재산 피해액: 5조 1,479</b>억 원 (대한민국 기상관측 이래 역대 1위)', '<b>특징:</b> 느린 이동 속도로 한반도를 관통하며 강릉 지역에 하루 동안 870.5mm라는 전무후무한 기록적인 폭우를 내렸습니다.'];
    const S1 = '태풍 갤럭시', S2 = '가장 피해를 많이 준 태풍';
    const NEWS = ['OO뉴스|우리나라에 가장 큰 재산 피해를 준 태풍, 2002년 ‘루사’', 'OO신문|2002년 태풍 ‘루사’, 재산 피해 5조원 넘어', 'OO일보|우리나라에 큰 피해를 남긴 2002년 태풍 ‘루사’', 'OO뉴스|기상청 기록으로 살펴보는 2002년 태풍 ‘루사’', 'OO신문|2002년 태풍 ‘루사’는 얼마나 큰 피해를 남겼을까?'];
    const FINAL = ['이번에는 실제 자료에 맞게 답변이 수정되었네요!', 'AI에게 정확한 자료를 알려 주고 구체적으로 질문하면 잘못된 정보를 수정하는 데 도움이 돼요.', '수정된 답변도 실제 자료와 비교하여 확인하는 것을 잊지 마세요!'];
    const SAYS = {
      prompt: ['입력창에 입력해보세요.', 'main_point'],
      send: ['전송 버튼을 눌러,<br>Gemini에게 물어볼까요?', 'main_point'],
      sendS: ['전송 버튼을 클릭해요.', 'main_point'],
      gen: ['AI가 답변을 생성하고 있어요.', 'main'],
      done: ['AI가 답변을 생성했어요!', 'smile_point'],
      src: ['그런데 이 정보가 정말 사실 일까요? AI가 어떤 자료를 참고했는지 확인해 보아요.', 'main_point'],
      err: ['AI가 알려 준 인터넷 주소로 들어갔는데 자료를 찾을 수<br>없어요!', 'main_point'],
      other: ['다른 믿을 만한 자료에서도 확인해 볼까요?', 'wink_point'],
      web: ['인터넷에 검색해 볼까요?', 'main_point'],
      none: ['태풍 갤럭시에 대한 자료를 찾을 수<br>없어요!', 'main_point'],
      retry: ['‘가장 피해를 많이 준 태풍’으로 다시 검색해 볼까요?', 'wink_point'],
      found: ['기상청 자료를 확인해 보니 태풍 갤럭시는 실제로 존재하지 않는<br>태풍이에요.', 'smile_point'],
      again: ['AI가 잘못된 정보를 만들어 낸 거예요. 정확한 자료를 바탕으로 다시 질문해 볼까요?', 'main_point'],
      back: ['Google Gemini로 다시 이동해요.', 'main_point']
    };
    const phone = $('p11Phone'), screen = $('p11Screen'), chat = $('p11Chat'), input = $('p11Input'), text = $('p11Text'), send = $('p11Send');
    const side = $('p11Side'), nextBtn = $('p11Next'), refBtn = $('p11Ref'), gg = $('p11Gg'), cmp = $('p11Cmp');
    const say = initGuideSay({ bubble: $('p11Bubble'), img: $('p11Char'), set: $('p11Set'), keep: true });
    const sy = (k) => { const t = SAYS[k]; say(t[0], t[1]); };
    const gc = initGeminiChat({ phone, screen, chat, input, text });
    const FG = { send: [22, -5], src: [0, 0], nav: [30, -20], rcGoogle: [0, 0], rcGem: [0, 0], ggBar: [0, 0], go: [0, 0] };
    const HOT = { send: [0, 0, 0, 0], src: [0, 0, 0, 0], nav: [-10, -10, 20, 20, 10], rcGoogle: [0, 0, 0, 0], rcGem: [0, 0, 0, 0], ggBar: [0, 0, 0, 0], go: [10, -2, -8, 4] };
    let fgKey = '?';
    const guide = (el, key, o) => {
      fgKey = key;
      el.dataset.hit = key;
      BoxEdit.padEl(el, key, HOT);
      pointFingerAt(el, Object.assign({ onMain: true, pulse: true, dx: FG[key][0], dy: FG[key][1] }, o));
    };
    const setSide = (...els) => { side.innerHTML = ''; els.forEach((e) => side.appendChild(e)); };
    const hideNext = () => { nextBtn.classList.add('is-hide'); nextBtn.onclick = null; };
    const showNext = (fn) => { nextBtn.classList.remove('is-hide'); nextBtn.onclick = () => { hideNext(); fn(); }; };
    const sayNext = (html, pose, fn) => {
      say(html, pose, undefined, undefined, '다음');
      $('p11Bubble').onclick = (e) => {
        if (!e.target.closest('.card-btn')) return;
        playClick();
        $('p11Bubble').onclick = null;
        fn();
      };
    };
    const sayNextK = (k, fn) => sayNext(SAYS[k][0], SAYS[k][1], fn);
    const para = (s) => '<p>' + s + '</p>';
    const view = (v, g) => { phone.dataset.view = v; if (g) gg.dataset.g = g; screen.classList.toggle('has-kb', false); };
    const sideBtn = (label, fn, cls) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'card-btn js-sfx ' + (cls || '');
      b.dataset.sound = 'sound/click.mp3';
      b.textContent = label;
      b.addEventListener('click', () => { playClick(); setSide(); fn(); });
      return b;
    };
    const SRC = '<span class="gc-answer-src" id="srcChip">출처 확인하기</span>';
    const SRC2 = '<span class="gc-src-tag"><img src="img/p11_kma.png" alt="">기상청</span>';
    const ans2 = () => '<p>' + A2 + ' ' + SRC2 + '</p><div class="p11-ah">역대 가장 큰 재산 피해: 태풍 ‘루사 (RUSA)’</div><ul class="p11-list">' + A2L.map((t) => '<li>' + t + '</li>').join('') + '</ul>';

    function reset() {
      clearFingers();
      phone.style.display = '';
      cmp.classList.add('is-off');
      $('p11News').classList.add('is-off');
      $('p11End').classList.add('is-off');
      refBtn.classList.add('is-hide');
      setSide(); hideNext();
      $('p11Bubble').onclick = null;
    }
    function gem(stage) {
      reset();
      view('gem');
      gc.clear(); gc.wait(false); gc.kb(false); gc.setInput('');
      if (stage === 'a1' || stage === 'a1p2') {
        gc.talk();
        gc.addMe(Q1);
        const a = gc.addAi(para(A1) + SRC); gc.acts(a, 'text');
      } else gc.talk(false);
      if (stage === 'a2') {
        gc.talk();
        gc.addMe(Q2);
        const a = gc.addAi(ans2()); gc.acts(a, 'text');
      }
      if (stage === 'a1p2' || stage === 'empty') gc.kb(true);
    }

    /* Gemini 1회차 */
    function g1Prompt() { gem('empty'); sy('prompt'); setSide(sideBtn(Q1, () => gc.typePrompt(Q1, () => g1Send()))); }
    function g1Send(edit) {
      if (edit) { gem('empty'); gc.setInput(Q1); }
      sy('send'); guide(send, 'send');
      send.onclick = () => { send.onclick = null; playClick(); clearFingers(); gc.kb(false); gc.talk(); gc.addMe(Q1); gc.setInput(''); g1Gen(true); };
    }
    function g1Gen(live) {
      if (!live) { gem('empty'); gc.kb(false); gc.talk(); gc.addMe(Q1); }
      gc.wait(true); const ai = gc.addAi(''); gc.think(ai); sy('gen');
      if (live) setTimeout(() => g1Done(true), 3000);
    }
    function g1Done(live) {
      if (live) { chat.lastElementChild.remove(); gc.wait(false); const a = gc.addAi(para(A1) + SRC); gc.acts(a, 'text'); }
      else gem('a1');
      sayNextK('done', () => g1Src());
    }
    function g1Src(edit) {
      if (edit) gem('a1');
      sy('src');
      const chip = $('srcChip');
      guide(chip, 'src');
      chip.onclick = () => { chip.onclick = null; playClick(); clearFingers(); err(); };
    }
    function err() {
      reset(); view('chrome');
      sayNextK('err', () => sayNextK('other', () => webHint()));
    }
    function webHint(edit) {
      if (edit) gem('a1');
      sy('web');
      const target = phone.dataset.view === 'chrome' ? $('p11NavChrome').querySelector('i') : document.querySelector('.v-gem .phone-nav i');
      guide(target, 'nav');
      target.onclick = () => { target.onclick = null; playClick(); clearFingers(); recents('google'); };
    }
    function recents(to, edit) {
      reset(); view('rc'); sy(to === 'google' ? 'web' : 'back');
      $('rcGoogle').parentNode.classList.toggle('is-google', to === 'google');
      const card = to === 'google' ? $('rcGoogle') : $('rcGem');
      guide(card, to === 'google' ? 'rcGoogle' : 'rcGem');
      card.onclick = () => { card.onclick = null; playClick(); clearFingers(); if (to === 'google') ggHome(); else g2Prompt(); };
    }
    function ggHome() {
      reset(); view('gg', 'home'); sy('web');
      const bar = $('ggBarHome');
      guide(bar, 'ggBar');
      bar.onclick = () => { bar.onclick = null; playClick(); clearFingers(); ggSearch(1); };
    }
    function ggSearch(n, edit) {
      reset(); view('gg', 'search'); screen.classList.add('has-kb');
      $('ggTyped').textContent = 'Google에 물어보기';
      $('ggBarSearch').classList.remove('is-typed');
      $('ggIcons').style.visibility = '';
      sy(n === 1 ? 'prompt' : 'retry');
      const q = n === 1 ? S1 : S2;
      setSide(sideBtn(q, () => {
        typeText($('ggTyped'), q, { speed: 90, clear: true, onTick: () => { $('ggIcons').style.visibility = 'hidden'; $('ggBarSearch').classList.add('is-typed'); }, onDone: () => ggGo(n) });
      }, 'is-short'));
    }
    function ggGo(n, edit) {
      if (edit) { ggSearch(n); $('ggTyped').textContent = n === 1 ? S1 : S2; $('ggBarSearch').classList.add('is-typed'); }
      sy('sendS');
      guide($('ggGo'), 'go');
      $('ggGo').onclick = () => { $('ggGo').onclick = null; playClick(); clearFingers(); ggResult(n); };
    }
    function ggResult(n) {
      reset(); view('gg', n === 1 ? 'none' : 'list');
      if (n === 1) sayNextK('none', () => ggSearch(2));
      else sayNextK('found', () => backHint());
    }
    function backHint(edit) {
      if (edit) { reset(); view('gg', 'list'); }
      sy('again');
      const target = $('p11NavGg').querySelector('i');
      guide(target, 'nav');
      target.onclick = () => { target.onclick = null; playClick(); clearFingers(); recents('gem'); };
    }
    /* Gemini 2회차 */
    function g2Prompt() { gem('a1p2'); sy('prompt'); setSide(sideBtn(Q2, () => gc.typePrompt(Q2, () => g2Send()))); }
    function g2Send(edit) {
      if (edit) { gem('a1p2'); gc.setInput(Q2); }
      sy('send'); guide(send, 'send');
      send.onclick = () => { send.onclick = null; playClick(); clearFingers(); gc.kb(false); gc.clear(); gc.talk(); gc.addMe(Q2); gc.setInput(''); g2Gen(true); };
    }
    function g2Gen(live) {
      if (!live) { gem('empty'); gc.kb(false); gc.talk(); gc.addMe(Q2); }
      gc.wait(true); const ai = gc.addAi(''); gc.think(ai); sy('gen');
      if (live) setTimeout(() => g2Done(true), 3000);
    }
    function g2Done(live) {
      if (live) { chat.lastElementChild.remove(); gc.wait(false); const a = gc.addAi(ans2()); gc.acts(a, 'text'); }
      else gem('a2');
      sayNextK('done', () => compare());
    }
    function compare(edit) {
      if (edit) gem('a2');
      clearFingers();
      phone.style.display = 'none';
      $('cmpA1').textContent = A1;
      $('cmpA2').innerHTML = ans2();
      cmp.classList.remove('is-off');
      let i = 0;
      refBtn.classList.remove('is-hide');
      refBtn.onclick = () => { loadDataPic(); $('p11News').classList.remove('is-off'); };
      const adv = () => {
        i++;
        const pose = i === 1 ? 'main_point' : 'wink_point';
        if (i >= FINAL.length - 1) {
          say(FINAL[i], pose);
          showNext(() => { phone.style.display = ''; $('p11End').classList.remove('is-off'); });
        } else sayNext(FINAL[i], pose, adv);
      };
      sayNext(FINAL[0], 'smile_present', adv);
    }
    const dataPic = document.querySelector('.p11-md-panel .pic');
    const loadDataPic = () => { if (!dataPic.src) dataPic.src = dataPic.dataset.src; };
    window.addEventListener('load', () => setTimeout(loadDataPic, 800));
    $('p11NewsClose').addEventListener('click', () => $('p11News').classList.add('is-off'));

    const STEPS = [
      { t: '1회 · 프롬프트 버튼', run: g1Prompt }, { t: '1회 · 보내기 클릭', run: () => g1Send(true) }, { t: '1회 · 생성 중', run: () => g1Gen(false) },
      { t: '1회 · 환각 답변 + 다음', run: () => g1Done(false) }, { t: '출처 확인하기 누르기', run: () => g1Src(true) }, { t: '기사 없음 화면 + 다음', run: err },
      { t: '최근 앱 버튼 누르기(Gemini)', run: () => webHint(true) }, { t: '최근 앱 · 구글 카드', run: () => recents('google') }, { t: '구글 홈 · 검색창', run: ggHome },
      { t: '검색 1 · 프롬프트 버튼', run: () => ggSearch(1) }, { t: '검색 1 · 검색 키', run: () => ggGo(1, true) }, { t: '검색 1 · 결과 없음 + 다음', run: () => ggResult(1) },
      { t: '검색 2 · 프롬프트 버튼', run: () => ggSearch(2) }, { t: '검색 2 · 검색 키', run: () => ggGo(2, true) }, { t: '검색 2 · 기사 5개 + 다음', run: () => ggResult(2) },
      { t: '최근 앱 버튼 누르기(구글)', run: () => backHint(true) }, { t: '최근 앱 · Gemini 카드', run: () => recents('gem') },
      { t: '2회 · 프롬프트 버튼', run: g2Prompt }, { t: '2회 · 보내기 클릭', run: () => g2Send(true) }, { t: '2회 · 생성 중', run: () => g2Gen(false) },
      { t: '2회 · 수정 답변 + 다음', run: () => g2Done(false) }, { t: '비교 + 자료 확인하기 · 다음', run: () => compare(true) }
    ];

    document.querySelector('.v-gg .kbd-cj').classList.add('is-search');
    $('p11Gg').querySelector('.gg-toplogo').appendChild($('p11Gg').querySelector('.gg-logo svg').cloneNode(true));
    $('ggList').innerHTML = NEWS.map((t, i) => { const [a, b] = t.split('|'); return '<div class="gg-item"><small>' + a + '</small><p>' + b + '</p><div class="th"><img src="img/p11_news' + (i + 1) + '.jpg" alt="" onerror="this.remove()"></div></div>'; }).join('');

    if (BoxEdit.on) {
      const m = location.search.match(/[?&]step=([0-9]+)/);
      let cur = m ? Math.min(Math.max(+m[1], 1), STEPS.length) : 1;
      BoxEdit.stepEdit({
        key: () => fgKey, count: STEPS.length + 1, get: () => cur, set: (n) => { cur = n; },
        go: (n) => { if (n < 1) return; cur = n; BoxEdit.syncStep(n); clearFingers(); STEPS[n - 1].run(); },
        label: (n) => '단계 ' + n + ' / ' + STEPS.length + ' · ' + (STEPS[n - 1] ? STEPS[n - 1].t : ''),
        say, bubble: $('p11Bubble'), img: $('p11Char')
      });
      STEPS[cur - 1].run();
      return;
    }
    g1Prompt();
  })();
  </script>
