<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀴즈 풀기</title>
    <link rel="stylesheet" href="../../css/common.css">
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="quiz-stage">
          <!-- 기획서 21~27p. Q3 힌트는 기획서에 비어 있어 기본 문구, Q2 보기 번호 ②② 는 ③으로 정정 -->
          <div class="step-flow">

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q1.</span>
                  <p class="quiz-ask">사람이 눈으로 세상을 보는 것처럼, AI는 무엇을 통해 세상을 볼까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-row" data-wrong="AI는 카메라를 눈처럼 사용해서 세상을 봐요.">
                <button class="answer-pick card-btn" data-correct="false">1. 마이크</button>
                <button class="answer-pick card-btn" data-correct="true">2. 카메라</button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q2.</span>
                  <p class="quiz-ask">카메라가 받아들인 정보를 컴퓨터에 전달하는 과정을 뭐라고 할까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-row" data-wrong="카메라가 받아들인 정보를 컴퓨터가 전달받아 입력하는 과정을 ‘정보 입력‘이라고 해요.">
                <button class="answer-pick card-btn" data-correct="true">1. 정보 입력</button>
                <button class="answer-pick card-btn" data-correct="false">2. 정보 정리</button>
                <button class="answer-pick card-btn" data-correct="false">3. 데이터 시각화</button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q3.</span>
                  <p class="quiz-ask">카메라 렌즈에 먼지가 많이 붙어 있어요. 정보를 잘 받아들이려면 어떻게 해야 할까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-list is-left">
                <button class="answer-pick card-btn" data-correct="false">1. 렌즈를 손으로 가려요</button>
                <button class="answer-pick card-btn" data-correct="true">2. 렌즈를 부드러운 천으로 닦아요</button>
                <button class="answer-pick card-btn" data-correct="false">3. 렌즈에 먼지를 더 묻혀요</button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q4.</span>
                  <p class="quiz-ask">AI는 사진에 찍힌 물건의 색깔이나 모양을 살펴보고 무엇인지 맞힐 수 있을까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz" data-wrong="AI는 색과 모양 및 특징을 살펴보고 물건을 찾아낼 수 있어요.">
                <button class="answer-pick ox-pick is-o" data-correct="true" aria-label="O">
                  <img class="js-img-swap" src="../../img/common/icon_o.png" data-src-on="../../img/common/icon_o_on.png" alt="O">
                </button>
                <button class="answer-pick ox-pick is-x" data-correct="false" aria-label="X">
                  <img class="js-img-swap" src="../../img/common/icon_x.png" data-src-on="../../img/common/icon_x_on.png" alt="X">
                </button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q5.</span>
                  <p class="quiz-ask">보기 중 카메라가 없는 물건은 무엇일까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-row" data-next="page12.html" data-wrong="카메라는 AI와 연결되어 우리 주변을 안전하고 편리하게 도와줘요.">
                <button class="answer-pick card-btn" data-correct="false">1. CCTV</button>
                <button class="answer-pick card-btn" data-correct="true">2. 드라이기</button>
                <button class="answer-pick card-btn" data-correct="false">3. 노트북</button>
                <button class="answer-pick card-btn" data-correct="false">4. 스마트폰</button>
              </div>
            </div>

          </div>

          <div class="ox-result-correct is-avatar is-off" data-sound="sound/correct.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_correct_gwa.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">정답이에요!</p>
              </div>
              <div class="avatar-popup-extra"><img src="../../img/common/icon_correct.png" alt=""></div>
            </div>
          </div>
          <div class="ox-result-wrong is-avatar is-off" data-sound="sound/incorrect.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="hint-title">힌트</p>
                <p class="avatar-popup-text is-small">다시 한번 생각해볼까요?</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="퀴즈 풀기" data-next="page12.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
