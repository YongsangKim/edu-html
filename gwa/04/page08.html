<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI의 실수, 3단계로 확인하기</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        /* 디자인 없음, 사회 디자인 문법(흰 판 + 번호 카드 + 카드 트레이)으로 만든 러프한 틀 - 기획서 17~18p. 카드 3장(순서 고정)을 1·2·3단계 칸에 끌어 넣기(공용 initMatchDrag): 맞으면 칸에 고정, 틀리면 원위치 → 마무리 안내 */

        .p08-flow{position:absolute;left:60px;top:200px;width:1800px;height:380px;box-sizing:border-box;border-radius:20px;background:var(--c-white);box-shadow:0 10px 0 0 rgba(86,148,231,.2)}
        .p08-slot{position:absolute;top:350px;width:405px;height:180px}
        .p08-slot1{left:200px}
        .p08-slot2{left:757px}
        .p08-slot3{left:1315px}
        .p08-num{position:absolute;left:0;top:-110px;width:100%;margin:0;text-align:center;font-family:'Cafe24 Ssurround';font-size:70px;color:var(--c-purple);letter-spacing:-0.05em}
        .p08-arrow{position:absolute;top:400px;width:60px;height:70px}
        .p08-arrow svg{display:block;width:100%;height:100%}

        .jig-tray.p08-tray{padding:0 120px;top:620px;border-radius:24px}
        .dc-card.is-lg{font-size:46px;line-height:1.1;letter-spacing:-0.06em;-webkit-text-stroke:8px #fff;padding:8px 14px 0;word-break:keep-all}
        #p08End{z-index:120}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="p08-flow"></div>
          <p class="ask-pill is-fit"><span>AI의 실수를 확인하는 방법을 순서대로 배치해 볼까요?</span></p>

          <span class="p08-arrow" style="left:640px"><svg viewBox="0 0 64 70"><path d="M4 2H30L60 35L30 68H4L34 35Z" fill="#2160d8"/></svg></span>
          <span class="p08-arrow" style="left:1197px"><svg viewBox="0 0 64 70"><path d="M4 2H30L60 35L30 68H4L34 35Z" fill="#2160d8"/></svg></span>
          <div class="dc-slot is-lg p08-slot p08-slot1" data-key="1"><p class="p08-num">1단계</p></div>
          <div class="dc-slot is-lg p08-slot p08-slot2" data-key="2"><p class="p08-num">2단계</p></div>
          <div class="dc-slot is-lg p08-slot p08-slot3" data-key="3"><p class="p08-num">3단계</p></div>

          <div class="jig-tray p08-tray" id="p08Tray">
            <div class="dc-hold is-lg"><div class="dc-card is-lg is-yellow" data-key="1">꼼꼼하게 살펴보기</div></div>
            <div class="dc-hold is-lg"><div class="dc-card is-lg is-orange" data-key="3">수정하고 다시 확인하기</div></div>
            <div class="dc-hold is-lg"><div class="dc-card is-lg is-blue" data-key="2">출처를 열어 확인하고 비교하기</div></div>
          </div>

          <div class="avatar-modal is-off" id="p08End">
            <div class="avatar-card is-side">
              <img class="avatar-card-avatar" src="../../resources/img/common/avatar_finish.png" alt="">
              <div class="step-flow">
                <div class="step-panel">
                  <div class="avatar-card-body"><p class="avatar-card-text">AI가 만든 결과물을 꼼꼼하게 살펴보고<br>출처를 직접 확인한 다음, 잘못된 부분을<br>수정해야 한다는 것을 배웠어요.</p></div>
                  <a href="page09.html" class="js-nav-effect avatar-card-btn card-btn is-popup js-sfx is-arrow" data-sound="sound/click.mp3">→</a>
                </div>
                <div class="step-panel">
                  <div class="avatar-card-body"><p class="avatar-card-text">수정한 결과도 다시 확인하는 것이 중요해요.<br>이제 직접 AI의 실수를 확인하고 수정해 볼까요?</p></div>
                  <a href="page09.html" class="js-nav-effect avatar-card-btn card-btn next-btn is-popup js-sfx" data-sound="sound/click.mp3">다음</a>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="AI의 실수, 3단계로 확인하기" data-next="page09.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  (function () {
    const tray = $('p08Tray');
    initMatchDrag({
      cards: Array.from(tray.querySelectorAll('.dc-card')),
      zones: Array.from(document.querySelectorAll('.p08-slot')),
      onRight: () => {},
      onWrong: (card, slot) => { if (slot) playWrong(); },
      onDone: () => {
        playCorrect();
        setTimeout(() => $('p08End').classList.remove('is-off'), 800);
      }
    });
  })();
  </script>
</body>
</html>
