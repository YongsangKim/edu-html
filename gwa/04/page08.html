<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설리번 플러스로 체험하는 이미지 인식</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서(AI실습) 1p. 왼쪽 안내 말풍선+캐릭터, 가운데 폰(기본 홈 화면에 설리번 플러스 앱 아이콘, img/p08_app_icon.png 없으면 이모지),
           오른쪽 주의사항 카드 4장. 말풍선의 [확인]을 누르면 카드가 위에서부터 차례로 나타나고, 4장이 다 나오면 안내가 바뀌며 앱 아이콘이 반짝(클릭 유도) → page09 */
        .p08-bubble{position:absolute;margin:0;left:30px;top:30px;width:560px;min-height:300px;box-sizing:border-box;padding:28px 26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;
          background:var(--c-cream);border:solid 5px var(--c-purple);border-radius:30px;box-shadow:-7px 10px 6px 2px rgba(92,61,240,.17);
          font-family:'Cafe24 Ssurround';font-size:36px;line-height:1.3;color:var(--c-purple);letter-spacing:-0.05em;word-break:keep-all;z-index:2}
        .p08-bubble:before{content:'';position:absolute;left:220px;bottom:-58px;width:100px;height:70px;background:url('../../img/common/p_guide_tail.png') 0 0 / contain no-repeat}
        .p08-bubble .card-btn{width:200px;min-width:0;height:80px;font-size:40px;padding:8px 0 0}
        .p08-character{left:20px;top:440px;width:520px;height:500px}
        .p08-phone{left:735px;top:21px;width:450px;height:895px}
        .p08-screen{position:relative;width:100%;height:100%}
        .p08-app i{background:#4f7cf7;font-size:70px}
        .p08-app.is-blink i{animation:cv-target 1.2s ease-in-out infinite}
        .p08-cards{position:absolute;left:1260px;top:60px;width:610px;display:flex;flex-direction:column;gap:26px}
        .p08-card{min-height:190px;box-sizing:border-box;padding:30px 30px 20px 140px;display:flex;align-items:center;position:relative;
          background:var(--c-white);border:solid 5px var(--c-purple);border-radius:30px;box-shadow:0 8px 0 0 var(--c-sky-pale);
          font-family:'Cafe24 Ssurround';font-size:38px;line-height:1.25;color:var(--c-ink);letter-spacing:-0.05em;word-break:keep-all;opacity:0;transform:translateY(-20px);transition:opacity .4s,transform .4s}
        .p08-card.is-on{opacity:1;transform:none}
        .p08-card:before{content:attr(data-n);position:absolute;left:30px;top:50%;width:80px;height:80px;margin-top:-38px;border-radius:50%;background:#e8605f;border:solid 4px var(--c-white);box-sizing:border-box;padding-top:6px;display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--c-white)}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="p08-bubble" id="p08Bubble">
            <span id="p08Text">눈이 되어주는 설리번+를 활용하여 우리 주변의 사물과 글자, 얼굴을 인식해볼까요?</span>
            <button class="card-btn is-popup js-sfx" id="p08Ok" data-sound="sound/click.mp3">확인</button>
          </div>
          <div class="char-box p08-character"><img src="img/p_character_main.png" alt="메인 캐릭터"></div>

          <div class="phone-frame p08-phone">
            <div class="p08-screen app-home is-sky">
              <div class="phone-status is-dark"></div>
              <a href="page09.html" class="js-nav-effect js-sfx app-icon is-dark p08-app" id="p08App" data-sound="sound/click.mp3" style="text-decoration:none"><i><img src="img/p08_app_icon.png" alt="" onerror="this.replaceWith(document.createTextNode('👁'))"></i>설리번 플러스</a>
              <div class="phone-nav"></div>
            </div>
          </div>

          <div class="p08-cards" id="p08Cards">
            <div class="p08-card" data-n="1">물체 전체가 화면에 들어오게 해요.</div>
            <div class="p08-card" data-n="2">밝고 흔들리지 않게 촬영해요.</div>
            <div class="p08-card" data-n="3">배경은 깔끔하게 정리해요.</div>
            <div class="p08-card" data-n="4">한 번에 하나의 물체만 카메라에 담아요.</div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="설리번 플러스로 체험하는 이미지 인식" data-next="page09.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const cards = Array.from(document.querySelectorAll('.p08-card'));
    $('p08App').addEventListener('click', (e) => { if (!$('p08App').classList.contains('is-blink')) e.stopImmediatePropagation(), e.preventDefault(); }, true);
    $('p08Ok').addEventListener('click', () => {
      $('p08Ok').style.display = 'none';
      $('p08Text').textContent = 'AI가 화면을 정확하게 인식하게 하려면 꼭 확인해야 할 점들이 있어요.';
      cards.forEach((c, i) => setTimeout(() => {
        c.classList.add('is-on');
        playClick();
        if (i === cards.length - 1) setTimeout(() => {
          $('p08Text').textContent = '주의사항 카드 4개를 모두 확인했어요! 설리번 플러스 앱을 클릭하세요.';
          $('p08App').classList.add('is-blink');
          pointFingerAt($('p08App'), { onMain: true, dx: 15, dy: -37 });
        }, 900);
      }, 1200 * (i + 1)));
    });
  })();
  </script>
</body>
</html>
