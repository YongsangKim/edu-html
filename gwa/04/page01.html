<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카메라에 찍힌 범인을 찾아라!</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 도입 문구가 길어 글자만 줄임 */
        .intro-panel .p-how-lead{font-size:44px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="intro-character"><img src="img/p_character_main.png" alt="메인 캐릭터"></div>
          <div class="intro-panel">
            <p class="intro-tab">카메라에 찍힌 범인을 찾아라!</p>
            <p class="p-how-lead">이럴수가, 집에 도둑이 들었나봐요!<br>다행히 집에 설치된 CCTV에 범인들의 얼굴이 찍혔어요.<br>사진 속 얼굴을 비교하여 도망간 범인 5명을 잡아주세요!</p>
            <div class="p-how">
              <b>게임 방법</b>
              <ol class="intro-list is-small is-tight">
                <li>1. CCTV가 찍은 사진(이미지) 속 범인의 눈, 코, 입을 살펴봐요.</li>
                <li>2. 5명의 사람 중 사진과 똑같은 얼굴을 찾아 선택해요.</li>
                <li>3. 경찰관을 도와 범인을 모두 검거해 보세요!</li>
              </ol>
            </div>
          </div>

          <a href="page02.html" class="js-nav-effect next-btn-intro">
            <img src="../../img/common/btn_start.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_start_on.png" data-src-over="../../img/common/btn_start_over.png" data-sound="sound/click.mp3" alt="시작하기">
          </a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="카메라에 찍힌 범인을 찾아라!" data-next="page02.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
