<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마지막 점검! AI의 실수를 찾아라!</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        /* 디자인 없음, 사회 디자인 문법(파란 판 + 흰 카드)으로 만든 러프한 틀 - 기획서 63~73p(Summery 표 반영). 발표자료 5장, 장마다 오류 1개: 잘못된 부분(정답 영역)을 누르면 성공 효과음 → 바른 자료로 수정, 말풍선 문구 변경, [자료 확인하기]가 [다음]으로 바뀜.
           별 5개가 정답마다 왼쪽부터 컬러, 모두 채우면 page15. 오류 위치(data-err)는 임시: 기획서에서 파란 영역으로만 표시돼 텍스트로는 알 수 없음 */

        .p14-char{left:-40px;top:300px}
        .p14-bubble{left:40px;bottom:670px;width:440px;margin:0}
        .p14-board{position:absolute;left:500px;top:150px;width:1380px;height:780px;border-radius:20px;background:#2a6bd0}
        .p14-slide{position:absolute;left:520px;top:170px;width:1000px;height:735px;box-sizing:border-box;padding:25px 30px;border:solid 6px var(--c-ink);border-radius:24px;background:var(--c-white);box-shadow:0 8px 0 0 rgba(1,24,92,.35);display:flex;flex-direction:column;gap:15px}
        .p14-part{position:relative;box-sizing:border-box;border:dashed 4px transparent;border-radius:18px;cursor:pointer;font-family:'Cafe24 Ssurround';letter-spacing:-0.05em;color:var(--c-ink);word-break:keep-all;padding:6px 14px 0}
        .p14-part:hover{border-color:var(--c-violet)}
        .p14-part:active{border-color:var(--c-orchid)}
        .p14-part.is-title{font-size:64px;color:var(--c-purple)}
        .p14-part.is-text{font-size:42px;line-height:1.3}
        .p14-part.is-art{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;padding:0}
        .p14-part.is-art img{display:block;max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
        .p14-mid{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;gap:40px}
        .p14-pic{display:block;height:100%;max-height:420px;width:auto;border:solid 4px var(--c-ink);box-sizing:border-box}
        .p14-tbl{flex:0 0 auto;height:100%;max-height:480px;display:flex;flex-direction:column;width:620px;border:solid 4px var(--c-ink);box-sizing:border-box;background:var(--c-white)}
        .p14-tbl .p14-part{flex:1 1 0;min-height:0;display:flex;align-items:center;padding:0;border-radius:0;border-width:0 0 3px 0;border-style:dashed;border-color:var(--c-ink);font-size:36px;line-height:1}
        .p14-tbl.has-pic{width:560px;height:auto;max-height:none}
        .p14-tbl.has-pic .p14-part{flex:0 0 auto;height:88px}
        .p14-tbl.is-wide{width:100%;height:auto;max-height:none}
        .p14-tbl.is-wide .p14-part{flex:0 0 auto;height:92px}
        .p14-tbl .p14-part:last-child{border-width:0}
        .p14-tbl.has-pic .p14-part.is-head,.p14-tbl.is-wide .p14-part.is-head{background:#f2f2f2}
        .p14-tbl .p14-part.is-head{border-style:solid;font-size:38px;cursor:default;pointer-events:none}
        .p14-tbl .p14-part span{flex:1 1 0;text-align:center}
        .p14-tbl .p14-part img{display:block;height:50px}
        .p14-tbl .p14-part span+span{border-left:3px dashed var(--c-ink);align-self:stretch;display:flex;align-items:center;justify-content:center}
        .p14-tbl .p14-part:hover{box-shadow:inset 0 0 0 4px var(--c-violet)}
        .p14-tbl .p14-part:active{box-shadow:inset 0 0 0 4px var(--c-orchid)}
        .p14-slide.is-solved .p14-tbl .p14-part:hover,.p14-slide.is-solved .p14-tbl .p14-part:active{box-shadow:none}
        .p14-slide.is-solved .p14-tbl .p14-part.is-err{box-shadow:inset 0 0 0 4px #33b560}
        .p14-slide.is-solved .p14-part{pointer-events:none}
        .p14-slide.is-solved .p14-part.is-err{border-color:#33b560;background:rgba(51,181,96,.1)}
        .p14-part.is-wrong{animation:fix-word-shake .3s ease}
        .p14-side{position:absolute;left:1550px;top:800px;width:300px}
        .p14-side .card-btn{min-width:0;width:100%;height:auto;min-height:90px;padding:10px 12px 6px;font-size:46px;line-height:1.15}
        .p14-stars{left:1420px;top:30px;height:100px;gap:8px;border-radius:50px}
        .p14-ref{z-index:130}
        .p14-ref .avatar-card{width:1300px;padding-top:30px;border-radius:50px}
        .p14-ref .avatar-card-text{font-size:50px}
        .p14-ref .avatar-card-title{margin-bottom:30px}
        .p14-rtbl{margin:0 auto 30px;width:1100px;table-layout:fixed;border-collapse:collapse;border:solid 4px var(--c-ink);font-family:'Cafe24 Ssurround';font-size:44px;color:var(--c-ink);text-align:center}
        .p14-rtbl th,.p14-rtbl td{padding:6px 0 0;font-weight:400;border-left:dashed 3px var(--c-ink)}
        .p14-rtbl th:first-child,.p14-rtbl td:first-child{border-left:0}
        .p14-rtbl th{height:80px;border-bottom:solid 3px var(--c-ink)}
        .p14-rtbl td{height:130px}
        .p14-rtbl td img{display:block;margin:0 auto;height:120px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="p14-board"></div>
          <div class="jh-stars p14-stars" id="p14Stars"></div>
          <p class="guide-bubble is-center p14-bubble" id="p14Say"></p>
          <div class="char-box p14-char"><img src="../img/character/gwa_main.png" alt="캐릭터"></div>

          <div class="p14-slide" id="p14Slide"></div>

          <div class="p14-side opts">
            <button type="button" class="card-btn is-popup js-sfx" id="p14Btn" data-sound="sound/click.mp3">자료 확인하기</button>
          </div>

          <div class="avatar-modal p14-ref is-off" id="p14RefModal">
            <div class="avatar-card">
              <p class="avatar-card-title">참고자료</p>
              <div id="p14RefBody"></div>
              <button type="button" class="avatar-card-btn card-btn is-popup next-btn js-sfx" id="p14RefClose" data-sound="sound/click.mp3">닫기</button>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="마지막 점검! AI의 실수를 찾아라!" data-next="page15.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  (function () {
    const ROUNDS = [
      { ask: '자료와 틀린 부분이<br>있을까?', ok: '날씨 기호 이름이<br>잘못 적혀 있었어!', title: '날씨와 날씨 기호', text: '날씨는 다양한 기호로 나타낼 수 있어요. 날씨에 따라 사용하는 기호를 알아볼까요?', head: ['날씨', '기호'], rows: ['맑음', '흐림', '비', '바람', '눈', '미세먼지'].map((t, k) => [t, { img: 'p14_sym_' + (k + 1) + '.png' }]), err: 'row6', ref: '<table class="p14-rtbl">' + (() => { const w = ['맑음', '흐림', '비', '바람', '눈', '태풍']; return '<tr>' + w.map((t) => '<th>' + t + '</th>').join('') + '</tr><tr>' + w.map((t, k) => '<td><img src="img/p14_sym_' + (k + 1) + '.png" alt=""></td>').join('') + '</tr>'; })() + '</table>' },
      { ask: '어디에서 생성 오류가<br>발생했을까?', ok: '이미지의 생성 오류가<br>있었어!', title: '기온과 습도의 측정', text: '기온은 공기의 온도를 나타내고, 습도는 공기가 얼마나 습한지를 나타내요.<br>기온은 온도계로, 습도는 습도계로 측정할 수 있어요.', art: { img: 'p14_art_2.jpg' }, err: 'art', ref: '<p class="avatar-card-text">🌡️ 온도계 &nbsp;&nbsp; 💧 습도계</p>' },
      { ask: '어디에서 생성 오류가<br>발생했을까?', ok: '이미지에서 글자<br>생성 오류가 있었어!', title: '일기예보 표', text: '일기예보를 통해 각 지역의 날씨와 기온, 습도 정보를 알 수 있어요.', art: { img: 'p14_art_3.png' }, err: 'art', ref: '<p class="avatar-card-text">지역별 날씨 정보<br>서울은 맑고, 기온은 22℃, 습도는 50% 입니다.<br>부산은 흐리고, 기온은 24℃, 습도는 65% 입니다.<br>광주는 비가 오고, 기온은 21℃, 습도는 80% 입니다.</p>' },
      { ask: '어디에서 AI 환각이<br>발생했을까?', ok: '발생 장소의 내용<br>오류가 있었어!', title: '태풍이란 무엇일까요?', text: '태풍은 강한 바람과 많은 비를 동반할 수 있는 기상 현상이에요.<br>태풍의 특징을 알아볼까요?', head: ['항목', '내용'], rows: [['발생 장소', '높은 산'], ['주요 특징', '강한 바람'], ['동반 현상', '많은 비']], pic: 'p14_art_4.png', err: 'row1', ref: '<p class="avatar-card-text">태풍의 발생과 특징<br>태풍은 따뜻한 바다에서 발생합니다.<br>강한 바람과 많은 비를 동반할 수 있습니다.</p>' },
      { ask: '자료에 없던<br>부분이 있을까?', ok: '자료에 없던 추가내용<br>부분이 들어있었어!', title: '태풍 ‘루사’가 남긴 피해', text: '2002년 우리나라에 영향을 준 태풍 루사는 강한 바람과 많은 비를 동반하여 큰 피해를 주었어요.', head: ['발생시기', '2002년'], rows: [['주요 특징', '강한 바람과 많은 비'], ['피해 내용', '인명 및 재산 피해 발생'], ['추가 내용', '학교 300곳이 완전히 무너짐']], wide: true, err: 'row3', ref: '<p class="avatar-card-text">2002년 태풍 ‘루사’<br>태풍 ‘루사’는 2002년 우리나라에 영향을 주었습니다.<br>강한 바람과 많은 비를 동반하였으며,<br>인명 및 재산 피해가 발생하였습니다.</p>' },
    ];
    const STAR = ASSET_BASE + 'img/common/icon_star';
    $('p14Stars').innerHTML = ROUNDS.map(() => '<img class="find-star" src="' + STAR + '.png" alt="">').join('');
    let idx = 0;
    let solved = false;

    const slide = $('p14Slide');
    const btn = $('p14Btn');

    const cell = (v) => (v.img ? '<img src="img/' + v.img + '" alt="">' : v);

    function body(r) {
      if (r.art) return '<div class="p14-part is-art' + (r.err === 'art' ? ' is-err' : '') + '" data-part="art">' + cell(r.art) + '</div>';
      const rows = r.rows.map((t, k) => '<div class="p14-part' + (r.err === 'row' + (k + 1) ? ' is-err' : '') + '" data-part="row' + (k + 1) + '"><span>' + t[0] + '</span><span>' + cell(t[1]) + '</span></div>').join('');
      return '<div class="p14-mid"><div class="p14-tbl' + (r.pic ? ' has-pic' : '') + (r.wide ? ' is-wide' : '') + '"><div class="p14-part is-head"><span>' + r.head[0] + '</span><span>' + r.head[1] + '</span></div>' + rows + '</div>' +
        (r.pic ? '<img class="p14-pic" src="img/' + r.pic + '" alt="">' : '') + '</div>';
    }

    function show() {
      const r = ROUNDS[idx];
      solved = false;
      $('p14Say').innerHTML = r.ask;
      slide.classList.remove('is-solved');
      slide.innerHTML =
        '<div class="p14-part is-title' + (r.err === 'title' ? ' is-err' : '') + '" data-part="title">' + r.title + '</div>' +
        '<div class="p14-part is-text' + (r.err === 'text' ? ' is-err' : '') + '" data-part="text">' + r.text + '</div>' +
        body(r);
      $('p14RefBody').innerHTML = r.ref;
      btn.textContent = '자료 확인하기';
    }

    function stars() {
      Array.from($('p14Stars').children).forEach((s, i) => { s.src = STAR + (i < idx + (solved ? 1 : 0) ? '_on.png' : '.png'); });
    }

    slide.addEventListener('click', (e) => {
      const part = e.target.closest('.p14-part');
      if (!part || solved) return;
      if (part.dataset.part === ROUNDS[idx].err) {
        solved = true;
        playCorrect();
        slide.classList.add('is-solved');
        $('p14Say').innerHTML = ROUNDS[idx].ok;
        btn.textContent = '다음';
        stars();
      } else {
        playWrong();
        part.classList.remove('is-wrong');
        void part.offsetWidth;
        part.classList.add('is-wrong');
      }
    });

    btn.addEventListener('click', () => {
      if (!solved) { $('p14RefModal').classList.remove('is-off'); return; }
      idx++;
      if (idx >= ROUNDS.length) { navigateTo('page15.html'); return; }
      show();
      stars();
    });

    $('p14RefClose').addEventListener('click', () => $('p14RefModal').classList.add('is-off'));

    show();
    stars();
  })();
  </script>
</body>
</html>
