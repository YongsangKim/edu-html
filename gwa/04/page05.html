<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 집 속 숨은 카메라 찾기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 8~10p. 집 구조도(거실·주방·현관·방·욕실)는 CSS 도형 임시, 물건 그림은 img/p05_obj_{game,cctv,phone,laptop}.png(없으면 이모지).
           물건에 마우스를 올리면 외곽선, 클릭하면 안내 팝업(다음 버튼) → 4개 모두 찾으면 완료 모달 2단계. 물건 밖 영역은 반응 없음 */
        .p05-ask{position:absolute;left:310px;top:20px;width:1300px;height:80px;margin:0;box-sizing:border-box;padding:6px 30px 0;display:flex;align-items:center;justify-content:center;
          background:var(--c-white);border:solid 5px var(--c-purple);border-radius:40px;box-shadow:0 8px 0 0 var(--c-sky-pale);
          font-family:'Cafe24 Ssurround';font-size:42px;color:var(--c-purple);letter-spacing:-0.05em}
        .p05-house{position:absolute;left:160px;top:125px;width:1600px;height:820px;box-sizing:border-box;border:solid 14px #2b2b2b;border-radius:10px;background:#fff;overflow:hidden}
        .p05-room{position:absolute;box-sizing:border-box;border:solid 6px #2b2b2b;display:flex;align-items:flex-start;justify-content:flex-start;padding:10px 20px 0;font-family:'Cafe24 Ssurround';font-size:36px;color:rgba(43,43,43,.7)}
        .p05-living{left:0;top:0;width:1000px;height:480px;background:#e8cfa2}
        .p05-kitchen{left:1000px;top:0;width:600px;height:320px;background:#f3e6c8}
        .p05-entry{left:1000px;top:320px;width:600px;height:160px;background:#dcdcdc}
        .p05-room-b{left:0;top:480px;width:1000px;height:340px;background:#f1e1b8}
        .p05-bath{left:1000px;top:480px;width:600px;height:340px;background:#d9eef7}
        .p05-obj{position:absolute;width:190px;height:190px;padding:0;border:0;border-radius:50%;background:none;display:flex;align-items:center;justify-content:center;font-size:130px;line-height:1;cursor:pointer;transition:filter .15s}
        .p05-obj img{display:block;width:100%;height:100%;object-fit:contain}
        .p05-obj:hover:not(.is-found){background:rgba(255,255,255,.35);box-shadow:0 0 0 8px var(--c-violet)}
        .p05-obj.is-found{cursor:default;opacity:.55}
        .p05-obj.is-found:after{content:'';position:absolute;right:10px;top:10px;width:56px;height:56px;border-radius:50%;background:#2fbf71 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M5 12.5l4.5 4.5L19 7.5' fill='none' stroke='white' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/></svg>") center / 70% no-repeat}
        .p05-obj[data-key="game"]{left:200px;top:200px}
        .p05-obj[data-key="cctv"]{left:700px;top:90px}
        .p05-obj[data-key="phone"]{left:230px;top:570px}
        .p05-obj[data-key="laptop"]{left:660px;top:600px}
        .p05-modal .avatar-card-title{white-space:nowrap}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <p class="p05-ask">카메라가 있는 물건을 찾아 클릭해 보세요.</p>
          <div class="p05-house" id="p05House">
            <div class="p05-room p05-living">거실</div>
            <div class="p05-room p05-kitchen">주방</div>
            <div class="p05-room p05-entry">현관</div>
            <div class="p05-room p05-room-b">방</div>
            <div class="p05-room p05-bath">욕실</div>
            <button class="p05-obj" data-key="game" aria-label="동작인식 게임기"><img src="img/p05_obj_game.png" alt="" onerror="this.replaceWith(document.createTextNode('🎮'))"></button>
            <button class="p05-obj" data-key="cctv" aria-label="가정용 CCTV"><img src="img/p05_obj_cctv.png" alt="" onerror="this.replaceWith(document.createTextNode('📹'))"></button>
            <button class="p05-obj" data-key="phone" aria-label="스마트폰"><img src="img/p05_obj_phone.png" alt="" onerror="this.replaceWith(document.createTextNode('📱'))"></button>
            <button class="p05-obj" data-key="laptop" aria-label="노트북"><img src="img/p05_obj_laptop.png" alt="" onerror="this.replaceWith(document.createTextNode('💻'))"></button>
          </div>

          <div class="avatar-modal p05-modal is-off" id="p05Info">
            <div class="avatar-card is-left">
              <img class="avatar-card-avatar" src="../../img/common/avatar_finish.png" alt="">
              <div class="avatar-card-body">
                <div>
                  <p class="avatar-card-title" id="p05Title"></p>
                  <p class="avatar-card-text" id="p05Text"></p>
                  <a href="javascript:;" class="avatar-card-btn card-btn is-popup js-sfx" id="p05Next" data-sound="sound/click.mp3">다음</a>
                </div>
              </div>
            </div>
          </div>

          <div class="avatar-modal is-off" id="p05Done">
            <div class="avatar-card is-left">
              <img class="avatar-card-avatar" src="../../img/common/avatar_finish.png" alt="">
              <div class="avatar-card-body">
                <div class="step-flow">
                  <div class="step-panel is-title">
                    <p class="avatar-card-text">집 안 곳곳에서 카메라가 달린<br>물건을 모두 찾았어요.</p>
                    <a href="page06.html" class="js-nav-effect avatar-card-btn card-btn is-popup js-sfx is-arrow" data-sound="sound/click.mp3">→</a>
                  </div>
                  <div class="step-panel">
                    <p class="avatar-card-text">카메라는 컴퓨터에 사람이나 주변 모습의 이미지를 전달해요. AI는 이 이미지를 어떤 순서로 분석하는지 알아볼까요?</p>
                    <a href="page06.html" class="js-nav-effect avatar-card-btn card-btn is-popup js-sfx" data-sound="sound/click.mp3">다음</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="우리 집 속 숨은 카메라 찾기" data-next="page06.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const INFO = {
      game: ['동작인식 게임기', '카메라가 내 몸의 움직임을 알아보면 게임 속 캐릭터도 따라 움직여요.'],
      cctv: ['가정용 CCTV', '카메라가 집 안을 촬영하면서 집 안의 상황을 살펴 안전을 지키는데 도움을 줘요.'],
      phone: ['스마트폰', '카메라가 내 얼굴을 알아보면 잠금이 풀리도록 설정할 수 있어요.'],
      laptop: ['노트북', '카메라로 내 모습을 실시간으로 보여주며 멀리있는 친구와도 얼굴을 보며 영상 통화를 할 수 있어요.']
    };
    const objs = Array.from(document.querySelectorAll('.p05-obj'));
    let found = 0;
    objs.forEach((o) => o.addEventListener('click', () => {
      if (o.classList.contains('is-found')) return;
      playClick();
      o.classList.add('is-found');
      found += 1;
      $('p05Title').textContent = INFO[o.dataset.key][0];
      $('p05Text').textContent = INFO[o.dataset.key][1];
      $('p05Info').classList.remove('is-off');
    }));
    $('p05Next').addEventListener('click', () => {
      $('p05Info').classList.add('is-off');
      if (found === objs.length) $('p05Done').classList.remove('is-off');
    });
  })();
  </script>
</body>
</html>
