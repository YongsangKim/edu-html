<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설리번 플러스로 체험하는 이미지 인식</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서(AI실습) 2~9p. 한 페이지에서 AI모드 → 문자인식 → 얼굴인식 순서로 반복:
           ① 하단 모드 버튼 누르기(해당 버튼만 깜빡) → ② 모드 설명 + [확인] → ③ 폰을 움직여(화면을 드래그) 대상이 프레임에 들어오면 찰칵 → ④ 인식 결과(AI 음성) + [<] 로 다음 모드, 마지막은 [>] 로 page10.
           배경·대상 그림은 CSS+이모지 임시(img/p09_scene_{ai,text,face}.png 나오면 .p09-world 배경으로 교체). AI 음성은 mp3가 없어 브라우저 음성 합성으로 임시 재생 */
        .p09-bubble{position:absolute;margin:0;left:30px;top:30px;width:610px;min-height:260px;box-sizing:border-box;padding:28px 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;
          background:var(--c-cream);border:solid 5px var(--c-purple);border-radius:30px;box-shadow:-7px 10px 6px 2px rgba(92,61,240,.17);
          font-family:'Cafe24 Ssurround';font-size:38px;line-height:1.3;color:var(--c-purple);letter-spacing:-0.05em;word-break:keep-all;z-index:2}
        .p09-bubble:before{content:'';position:absolute;left:250px;bottom:-58px;width:100px;height:70px;background:url('../../img/common/p_guide_tail.png') 0 0 / contain no-repeat}
        .p09-bubble.is-small{font-size:31px;line-height:1.35}
        .p09-bubble .card-btn{width:200px;min-width:0;height:80px;font-size:40px;padding:8px 0 0}
        .p09-character{left:20px;top:480px;width:520px;height:460px}
        .p09-phone{left:735px;top:21px;width:450px;height:895px}
        .p09-screen{position:absolute;inset:0;background:#0d0f14;overflow:hidden}
        .p09-cam{position:absolute;left:0;top:44px;width:434px;height:660px;overflow:hidden;background:#222;touch-action:none;cursor:grab}
        .p09-world{position:absolute;left:0;top:0;width:1000px;height:660px;will-change:transform}
        .p09-world.is-room{background:linear-gradient(180deg,#e6d9bd 0 62%,#3a2f2a 62% 100%)}
        .p09-world.is-class{background:linear-gradient(180deg,#d7e6d3 0 60%,#b99872 60% 100%)}
        .p09-world .o{position:absolute;line-height:1;font-size:120px}
        .p09-world .o img{display:block;width:100%;height:100%;object-fit:contain}
        .p09-dim{position:absolute;inset:0;background:rgba(0,0,0,.35);pointer-events:none}
        .p09-frame{position:absolute;left:97px;top:210px;width:240px;height:240px;box-sizing:border-box;border:solid 4px #fff;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.25);pointer-events:none}
        .p09-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
        .p09-flash.is-on{animation:p09-flash .5s ease-out}
        @keyframes p09-flash{0%{opacity:1}100%{opacity:0}}
        .p09-res{position:absolute;left:12px;right:12px;bottom:12px;padding:18px 18px 16px;border-radius:18px;background:rgba(255,255,255,.93);font-family:'Pretendard';font-weight:600;font-size:22px;line-height:1.4;color:#111;word-break:keep-all}
        .p09-back{position:absolute;left:12px;top:56px;width:56px;height:56px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.9);cursor:pointer;z-index:3}
        .p09-back:before{content:'';position:absolute;left:21px;top:19px;width:14px;height:14px;box-sizing:border-box;border:solid #111;border-width:0 0 5px 5px;transform:rotate(45deg)}
        .p09-back.is-next{left:auto;right:12px}
        .p09-back.is-next:before{left:15px;transform:rotate(-135deg)}
        .p09-modes{position:absolute;left:0;top:716px;width:434px;height:112px;display:flex;justify-content:space-around;align-items:center;background:#161a23}
        .p09-mode{width:128px;height:92px;box-sizing:border-box;padding:6px 0 0;border:0;border-radius:18px;background:#262c3a;color:#fff;font-family:'Pretendard';font-weight:600;font-size:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
        .p09-mode span{font-size:36px;line-height:1}
        .p09-mode.is-dim{opacity:.4;pointer-events:none}
        .p09-mode.is-on{background:#4f7cf7}
        .p09-mode.is-blink{animation:cv-target 1.2s ease-in-out infinite}
        .p09-hide{display:none}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="p09-bubble" id="p09Bubble">
            <span id="p09Text"></span>
            <button class="card-btn is-popup js-sfx p09-hide" id="p09Ok" data-sound="sound/click.mp3">확인</button>
          </div>
          <div class="char-box p09-character"><img src="img/p_character_main.png" alt="메인 캐릭터"></div>

          <div class="phone-frame is-thin has-cam p09-phone">
            <div class="p09-screen">
              <div class="phone-status"></div>
              <div class="p09-cam" id="p09Cam">
                <div class="p09-world" id="p09World"></div>
                <div class="p09-dim" id="p09Dim"></div>
                <div class="p09-frame p09-hide" id="p09Frame"></div>
                <div class="p09-flash" id="p09Flash"></div>
                <p class="p09-res p09-hide" id="p09Res"></p>
              </div>
              <button class="p09-back p09-hide js-sfx" id="p09Back" data-sound="sound/click.mp3" aria-label="뒤로"></button>
              <div class="p09-modes" id="p09Modes">
                <button class="p09-mode js-sfx" data-sound="sound/click.mp3" data-m="0"><span>🤖</span>AI모드</button>
                <button class="p09-mode js-sfx" data-sound="sound/click.mp3" data-m="1"><span>🔤</span>문자인식</button>
                <button class="p09-mode js-sfx" data-sound="sound/click.mp3" data-m="2"><span>🙂</span>얼굴인식</button>
              </div>
              <div class="phone-nav"></div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="설리번 플러스로 체험하는 이미지 인식" data-next="page10.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const MODES = [
      { name: 'AI모드', ask: 'AI모드가 무엇인지 알아봐요.',
        info: 'AI 모드는 카메라로 찍은 사진을 살펴봐요. 사진 속 사물과 글자, 얼굴을 인식하여 음성으로 알려줘요. 이를 통해 주변의 정보를 쉽게 확인할 수 있어요.',
        cam: '핸드폰을 움직여<br>콜라를 프레임안에 담아보세요.', bg: 'is-room', tx: 700, ty: 330, emoji: '🥤', size: 130, extra: '📚',
        res: '검은색 책상 위에 빨간색 캔콜라가 놓여 있습니다.' },
      { name: '문자인식', ask: '문자인식이 무엇인지 알아봐요.',
        info: '문자 인식 모드는 카메라에 보이는 글자를 찾아 읽어줘요. 읽고 싶은 글자가 화면에 잘 보이도록 맞춰 주세요. 인식한 글자를 화면과 음성으로 알려줘요.',
        cam: '핸드폰을 움직여<br>인식할 글자를 프레임안에 담아보세요.', bg: 'is-class', tx: 700, ty: 330, emoji: '📖', size: 150, extra: '🖼',
        res: '오늘의 날씨 … 좋습니다.' },
      { name: '얼굴인식', ask: '얼굴인식이 무엇인지 알아봐요.',
        info: '얼굴 인식 모드는 카메라에 보이는 사람의 얼굴을 인식해요. 얼굴의 나이와 성별, 표정을 음성으로 알려줘요. 등록된 얼굴은 이름도 알려줘요.',
        cam: '핸드폰을 움직여<br>얼굴카드를 프레임안에 담아보세요.', bg: 'is-class', tx: 700, ty: 330, emoji: '👧', size: 150, extra: '🏫',
        res: '19살 여자가 … 있습니다.' }
    ];
    const cam = $('p09Cam'), world = $('p09World'), bubble = $('p09Bubble');
    const modeBtns = Array.from(document.querySelectorAll('.p09-mode'));
    const VIEW_W = 434, MIN_X = -(1000 - VIEW_W);
    let m = 0, step = 'pick', off = 0, held = 0, captured = false;

    const show = (el, on) => el.classList.toggle('p09-hide', !on);
    const say = (html, small) => { $('p09Text').innerHTML = html; bubble.classList.toggle('is-small', !!small); };
    const speak = (t) => { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; speechSynthesis.speak(u); } catch (e) {} };
    const place = () => { world.style.transform = 'translateX(' + off + 'px)'; };

    function buildWorld(d) {
      world.className = 'p09-world ' + d.bg;
      world.innerHTML = '<span class="o" style="left:' + (d.tx - d.size / 2) + 'px;top:' + (d.ty - d.size / 2) + 'px;font-size:' + d.size + 'px">' + d.emoji + '</span>' +
        '<span class="o" style="left:330px;top:150px;font-size:150px;opacity:.9">' + d.extra + '</span>';
    }

    function setStep(s) {
      step = s;
      const d = MODES[m];
      clearFingers();
      modeBtns.forEach((b, i) => {
        b.classList.remove('is-on', 'is-blink');
        b.classList.toggle('is-dim', i !== m);
      });
      show($('p09Ok'), s === 'explain');
      show($('p09Frame'), s === 'cam');
      show($('p09Dim'), s === 'pick' || s === 'explain');
      show($('p09Res'), s === 'result');
      show($('p09Back'), s === 'result');
      if (s === 'pick') {
        say(d.ask);
        buildWorld(d); off = 0; place();
        modeBtns[m].classList.add('is-blink');
        pointFingerAt(modeBtns[m], { onMain: true, dx: 25, dy: -45 });
      } else if (s === 'explain') {
        say(d.info, true);
        modeBtns[m].classList.add('is-on');
      } else if (s === 'cam') {
        say(d.cam);
        modeBtns[m].classList.add('is-on');
        captured = false; held = 0; off = 0; place();
      } else if (s === 'result') {
        say('인식되었어요.');
        modeBtns[m].classList.add('is-on');
        $('p09Res').textContent = d.res;
        $('p09Back').classList.toggle('is-next', m === MODES.length - 1);
        speak(d.res);
      }
    }

    modeBtns.forEach((b, i) => b.addEventListener('click', () => { if (step === 'pick' && i === m) setStep('explain'); }));
    $('p09Ok').addEventListener('click', () => setStep('cam'));
    $('p09Back').addEventListener('click', () => {
      try { speechSynthesis.cancel(); } catch (e) {}
      if (m < MODES.length - 1) { m += 1; setStep('pick'); }
      else navigateTo('page10.html');
    });

    let drag = null;
    cam.addEventListener('pointerdown', (e) => { if (step !== 'cam') return; drag = { x: e.clientX, off }; cam.setPointerCapture(e.pointerId); cam.style.cursor = 'grabbing'; });
    cam.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const scale = cam.getBoundingClientRect().width / VIEW_W;
      off = Math.max(MIN_X, Math.min(0, drag.off + (e.clientX - drag.x) / scale));
      place();
      const tx = MODES[m].tx + off;
      if (!captured && Math.abs(tx - VIEW_W / 2) < 60) {
        captured = true; drag = null; cam.style.cursor = '';
        $('p09Flash').classList.remove('is-on'); void $('p09Flash').offsetWidth; $('p09Flash').classList.add('is-on');
        playClick();
        setTimeout(() => setStep('result'), 700);
      }
    });
    const end = () => { drag = null; cam.style.cursor = ''; };
    cam.addEventListener('pointerup', end);
    cam.addEventListener('pointercancel', end);

    setStep('pick');
  })();
  </script>
</body>
</html>
