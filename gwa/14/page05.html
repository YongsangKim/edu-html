<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>의사결정 나무 따라 내려가기</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
      .p05-pn{position:absolute;left:60px;top:165px;width:1800px;height:765px;box-sizing:border-box;border-radius:30px;background:#266cc8}
      .p05-lcard{position:absolute;left:30px;top:30px;width:620px;height:705px;box-sizing:border-box;border-radius:24px;background:#fff;padding:24px;display:flex;flex-direction:column;align-items:center}
      .p05-lcard-hd{margin:0 0 12px;font-family:'Cafe24 Ssurround';font-size:32px;color:var(--c-navy);letter-spacing:-0.04em}
      .p05-shelf{position:relative;width:560px;height:520px;border-radius:20px;background:linear-gradient(180deg,#f7f3eb 0%,#efe6d5 100%);border:solid 6px #c49a6c;box-sizing:border-box;box-shadow:inset 0 6px 0 rgba(255,255,255,.7)}
      .p05-shelf-bar{position:absolute;left:0;right:0;height:22px;background:linear-gradient(180deg,#d8ae7e,#b58552);border-top:solid 4px #8c6239;border-bottom:solid 4px #8c6239}
      .p05-shelf-bar.r1{top:236px}
      .p05-shelf-bar.r2{bottom:0;border-bottom:0;border-radius:0 0 14px 14px}
      .p05-shelf-row{position:absolute;left:0;right:0;display:flex;justify-content:space-evenly;align-items:flex-end}
      .p05-shelf-row.r1{top:14px;height:216px}
      .p05-shelf-row.r2{top:256px;height:234px}
      .p05-cup{position:relative;width:154px;height:204px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px;box-sizing:border-box;cursor:pointer;transition:transform .3s ease}
      .p05-cup.is-on{background:rgba(255,216,61,.28);outline:6px solid var(--c-yellow);box-shadow:0 0 18px rgba(255,200,0,.6)}
      .p05-cup.is-done{opacity:.45;filter:grayscale(.4)}
      .p05-cup.is-tilted{transform:rotate(36deg) translateY(-14px)}
      .p05-cup svg{width:104px;height:130px;overflow:visible;filter:drop-shadow(0 4px 6px rgba(0,0,0,.14))}
      .p05-cup span{margin-top:6px;padding:4px 16px 1px;border-radius:16px;background:var(--c-white);border:solid 3px var(--c-navy);font-family:'Cafe24 Ssurround';font-size:26px;color:var(--c-ink);letter-spacing:-0.04em;white-space:nowrap}
      .p05-cup.is-on span{background:var(--c-yellow)}
      .p05-tilt-btn{margin-top:16px;width:380px;height:84px;border-radius:22px;border:solid 5px var(--c-ink);background:linear-gradient(180deg,#ffe96b,#ffc80d);box-shadow:0 8px 0 #c99300;font-family:'Cafe24 Ssurround';font-size:40px;color:var(--c-ink);display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
      .p05-tilt-btn:active{transform:translateY(4px);box-shadow:0 4px 0 #c99300}
      .p05-rcard{position:absolute;left:680px;top:30px;width:1090px;height:705px;box-sizing:border-box;border-radius:24px;background:#fff}
      .p05-tree-svg{position:absolute;left:25px;top:14px;width:1040px;height:550px;display:block}
      .p05-yn-row{position:absolute;left:0;right:0;bottom:24px;display:flex;justify-content:center;gap:60px}
      .p05-yn-row .card-btn{margin:0;min-width:0;width:340px;height:100px;font-size:56px;display:flex;align-items:center;justify-content:center;padding-top:8px}
      .p05-fg{position:absolute;left:360px;top:790px;width:110px;z-index:10;pointer-events:none}
      .p05-q-active{filter:drop-shadow(0 0 10px #ffd400)}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <p class="ask-pill is-fit"><span id="p05AskText">선반에서 알아볼 액체 컵을 클릭하세요.</span></p>

          <div class="p05-pn">
            <div class="p05-lcard">
              <p class="p05-lcard-hd">선반에서 액체 컵을 선택하세요</p>
              <div class="p05-shelf">
                <div class="p05-shelf-row r1">
                  <div class="p05-cup is-on" data-liquid="cider">
                    <svg viewBox="0 0 100 130">
                      <path d="M14,10 L86,10 L78,120 Q77,126 70,126 L30,126 Q23,126 22,120 Z" fill="rgba(255,255,255,.8)" stroke="#5b6b82" stroke-width="4"/>
                      <path d="M17,42 L83,42 L76,118 Q75,122 70,122 L30,122 Q25,122 24,118 Z" fill="#e3f4ff"/>
                      <circle cx="38" cy="95" r="5" fill="#fff" stroke="#4a90e2" stroke-width="2.5"/>
                      <circle cx="60" cy="80" r="6" fill="#fff" stroke="#4a90e2" stroke-width="2.5"/>
                      <circle cx="46" cy="64" r="4.5" fill="#fff" stroke="#4a90e2" stroke-width="2.5"/>
                      <circle cx="64" cy="104" r="4" fill="#fff" stroke="#4a90e2" stroke-width="2.5"/>
                    </svg>
                    <span>사이다</span>
                  </div>
                  <div class="p05-cup" data-liquid="honey">
                    <svg viewBox="0 0 100 130">
                      <path d="M14,10 L86,10 L78,120 Q77,126 70,126 L30,126 Q23,126 22,120 Z" fill="rgba(255,255,255,.8)" stroke="#5b6b82" stroke-width="4"/>
                      <path d="M17,45 L83,45 L76,118 Q75,122 70,122 L30,122 Q25,122 24,118 Z" fill="#f5a623"/>
                      <path d="M24,52 Q50,60 76,52" fill="none" stroke="#ffd97d" stroke-width="4" stroke-linecap="round"/>
                    </svg>
                    <span>꿀</span>
                  </div>
                </div>
                <div class="p05-shelf-bar r1"></div>
                <div class="p05-shelf-row r2">
                  <div class="p05-cup" data-liquid="water">
                    <svg viewBox="0 0 100 130">
                      <path d="M14,10 L86,10 L78,120 Q77,126 70,126 L30,126 Q23,126 22,120 Z" fill="rgba(255,255,255,.8)" stroke="#5b6b82" stroke-width="4"/>
                      <path d="M17,42 L83,42 L76,118 Q75,122 70,122 L30,122 Q25,122 24,118 Z" fill="#eaf6ff"/>
                    </svg>
                    <span>물</span>
                  </div>
                  <div class="p05-cup" data-liquid="oil">
                    <svg viewBox="0 0 100 130">
                      <path d="M14,10 L86,10 L78,120 Q77,126 70,126 L30,126 Q23,126 22,120 Z" fill="rgba(255,255,255,.8)" stroke="#5b6b82" stroke-width="4"/>
                      <path d="M17,42 L83,42 L76,118 Q75,122 70,122 L30,122 Q25,122 24,118 Z" fill="#ffe66d"/>
                    </svg>
                    <span>식용유</span>
                  </div>
                  <div class="p05-cup" data-liquid="grape">
                    <svg viewBox="0 0 100 130">
                      <path d="M14,10 L86,10 L78,120 Q77,126 70,126 L30,126 Q23,126 22,120 Z" fill="rgba(255,255,255,.8)" stroke="#5b6b82" stroke-width="4"/>
                      <path d="M17,42 L83,42 L76,118 Q75,122 70,122 L30,122 Q25,122 24,118 Z" fill="#5e43b8"/>
                    </svg>
                    <span>포도 주스</span>
                  </div>
                </div>
                <div class="p05-shelf-bar r2"></div>
              </div>
              <button type="button" class="p05-tilt-btn" id="btnTilt">🔄 컵 기울이기</button>
            </div>

            <div class="p05-rcard">
              <svg class="p05-tree-svg" viewBox="0 0 1040 550">
                <line id="lineR_L" x1="520" y1="118" x2="260" y2="180" stroke="#8a94a6" stroke-width="5"/>
                <line id="lineR_R" x1="520" y1="118" x2="760" y2="180" stroke="#8a94a6" stroke-width="5"/>
                <rect x="340" y="126" width="84" height="36" rx="18" fill="#fff"/>
                <text x="382" y="146" text-anchor="middle" dominant-baseline="middle" style="font-family:'Cafe24 Ssurround';font-size:24px;fill:#666">아니오</text>
                <rect x="615" y="126" width="60" height="36" rx="18" fill="#fff"/>
                <text x="645" y="146" text-anchor="middle" dominant-baseline="middle" style="font-family:'Cafe24 Ssurround';font-size:24px;fill:#666">네</text>

                  <text x="520" y="70" text-anchor="middle" dominant-baseline="middle" style="font-family:'Cafe24 Ssurround';font-size:32px;fill:#1b1640;letter-spacing:-1px">색이 있나요?</text>
                </g>

                <line id="lineL_L" x1="260" y1="276" x2="135" y2="390" stroke="#8a94a6" stroke-width="5"/>
                <line id="lineL_R" x1="260" y1="276" x2="355" y2="390" stroke="#8a94a6" stroke-width="5"/>
                <rect x="160" y="312" width="52" height="34" rx="17" fill="#fff"/>
                <text x="186" y="331" text-anchor="middle" dominant-baseline="middle" style="font-family:'Cafe24 Ssurround';font-size:22px;fill:#666">네</text>
                <rect x="280" y="312" width="76" height="34" rx="17" fill="#fff"/>
                <text x="318" y="331" text-anchor="middle" dominant-baseline="middle" style="font-family:'Cafe24 Ssurround';font-size:22px;fill:#666">아니오</text>
                <g id="nodeQ1">
                  <polygon points="260,178 445,227 260,276 75,227" fill="#e8e4f8" stroke="#7c6fc4" stroke-width="5" stroke-linejoin="round"/>
                  <text x="260" y="230" text-anchor="middle" dominant-baseline="middle" style="font-family:'Cafe24 Ssurround';font-size:28px;fill:#1b1640;letter-spacing:-1px">공기 방울이 있나요?</text>
                </g>

                <line id="lineR_L2" x1="760" y1="276" x2="565" y2="390" stroke="#8a94a6" stroke-width="5"/>
                <line id="lineR_R2" x1="760" y1="276" x2="845" y2="320" stroke="#8a94a6" stroke-width="5"/>
                <rect x="625" y="312" width="52" height="34" rx="17" fill="#fff"/>
                <text x="651" y="331" text-anchor="middle" dominant-baseline="middle" style="font-family:'Cafe24 Ssurround';font-size:22px;fill:#666">네</text>
                <rect x="780" y="278" width="76" height="34" rx="17" fill="#fff"/>
                <text x="818" y="297" text-anchor="middle" dominant-baseline="middle" style="font-family:'Cafe24 Ssurround';font-size:22px;fill:#666">아니오</text>
                <g id="nodeQ2">
                  <polygon points="760,178 935,227 760,276 585,227" fill="#e8e4f8" stroke="#7c6fc4" stroke-width="5" stroke-linejoin="round"/>
                  <text x="760" y="230" text-anchor="middle" dominant-baseline="middle" style="font-family:'Cafe24 Ssurround';font-size:28px;fill:#1b1640;letter-spacing:-1px">보라색인가요?</text>
                </g>

                <line id="lineRR_L" x1="845" y1="412" x2="755" y2="450" stroke="#8a94a6" stroke-width="5"/>
                <line id="lineRR_R" x1="845" y1="412" x2="945" y2="450" stroke="#8a94a6" stroke-width="5"/>
                <text x="775" y="432" text-anchor="middle" dominant-baseline="middle" style="font-family:'Cafe24 Ssurround';font-size:22px;fill:#666">네</text>
                <text x="920" y="432" text-anchor="middle" dominant-baseline="middle" style="font-family:'Cafe24 Ssurround';font-size:22px;fill:#666">아니오</text>
                <g id="nodeQ3">
                  <polygon points="845,318 1025,365 845,412 665,365" fill="#e8e4f8" stroke="#7c6fc4" stroke-width="5" stroke-linejoin="round"/>
                  <text x="845" y="368" text-anchor="middle" dominant-baseline="middle" style="font-family:'Cafe24 Ssurround';font-size:26px;fill:#1b1640;letter-spacing:-1px">아주 천천히 흐르나요?</text>
                </g>

                <g id="leafCider">
                  <rect x="55" y="390" width="160" height="130" rx="22" fill="#f3f5fa" stroke="#9aa3b5" stroke-width="5" stroke-dasharray="10 7"/>
                  <text id="txtCider" x="135" y="458" text-anchor="middle" dominant-baseline="middle" style="font-family:'Cafe24 Ssurround';font-size:52px;fill:#7b86a8">?</text>
                </g>

                <g id="leafWater">
                  <rect x="275" y="390" width="160" height="130" rx="22" fill="#f3f5fa" stroke="#9aa3b5" stroke-width="5" stroke-dasharray="10 7"/>
                  <text id="txtWater" x="355" y="458" text-anchor="middle" dominant-baseline="middle" style="font-family:'Cafe24 Ssurround';font-size:52px;fill:#7b86a8">?</text>
                </g>

                <g id="leafGrape">
                  <rect x="485" y="390" width="160" height="130" rx="22" fill="#f3f5fa" stroke="#9aa3b5" stroke-width="5" stroke-dasharray="10 7"/>
                  <text id="txtGrape" x="565" y="458" text-anchor="middle" dominant-baseline="middle" style="font-family:'Cafe24 Ssurround';font-size:52px;fill:#7b86a8">?</text>
                </g>

                <g id="leafHoney">
                  <rect x="680" y="448" width="150" height="92" rx="20" fill="#f3f5fa" stroke="#9aa3b5" stroke-width="5" stroke-dasharray="10 7"/>
                  <text id="txtHoney" x="755" y="496" text-anchor="middle" dominant-baseline="middle" style="font-family:'Cafe24 Ssurround';font-size:46px;fill:#7b86a8">?</text>
                </g>

                <g id="leafOil">
                  <rect x="870" y="448" width="150" height="92" rx="20" fill="#f3f5fa" stroke="#9aa3b5" stroke-width="5" stroke-dasharray="10 7"/>
                  <text id="txtOil" x="945" y="496" text-anchor="middle" dominant-baseline="middle" style="font-family:'Cafe24 Ssurround';font-size:46px;fill:#7b86a8">?</text>
                </g>
              </svg>

              <div class="p05-yn-row">
                <button type="button" class="card-btn" id="btnYes">네</button>
                <button type="button" class="card-btn" id="btnNo">아니오</button>
              </div>
            </div>
          </div>

          <img class="p05-fg" id="p05FingerGuide" src="../../resources/img/common/img_finger01.png" alt="" style="display:none">

          <div class="ox-result-wrong is-avatar is-off" id="wrongModal">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar">
                <img src="../../resources/img/common/avatar_incorrect.png" alt="">
              </div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">다시 한번 생각해볼까요?</p>
              </div>
            </div>
          </div>

          <div class="avatar-modal is-off" id="liquidCorrectModal">
            <div class="avatar-card">
              <img class="avatar-card-avatar" src="../../resources/img/common/avatar_finish.png" alt="">
              <div class="avatar-card-body is-side">
                <p class="avatar-card-text">정답이에요!<br>이 컵에 담긴 액체는 <strong id="doneLiquidName">사이다</strong>였어요.</p>
              </div>
              <a href="javascript:;" class="js-nav-effect js-sfx avatar-card-btn next-btn card-btn is-popup" id="btnNextLiquid" data-sound="sound/click.mp3">다음</a>
            </div>
          </div>

          <div class="avatar-modal is-off" id="allDoneModal">
            <div class="avatar-card">
              <img class="avatar-card-avatar" src="../../resources/img/common/avatar_finish.png" alt="">
              <div class="step-flow">
                <div class="step-panel">
                  <div class="avatar-card-body is-side">
                    <p class="avatar-card-text">다섯 가지 액체를 모두 알아냈어요!<br>질문을 따라 내려가면 무엇인지 쉽게 찾을 수 있어요.</p>
                  </div>
                  <a href="javascript:;" class="js-nav-effect js-sfx avatar-card-btn next-btn card-btn is-popup" data-sound="sound/click.mp3">다음</a>
                </div>
                <div class="step-panel is-hidden">
                  <div class="avatar-card-body is-side">
                    <p class="avatar-card-text">다음에는 우리가 직접 액체를 나누는<br>질문을 만들어 의사결정 나무를 완성해볼까요?</p>
                  </div>
                  <a href="page06.html" class="js-nav-effect js-sfx avatar-card-btn next-btn card-btn is-popup" data-sound="sound/click.mp3">다음</a>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="의사결정 나무 따라 내려가기" data-prev="page04.html" data-next="page06.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
    (function () {
      var liquids = {
        cider: { name: '사이다', path: ['no', 'yes'], leafId: 'leafCider', txtId: 'txtCider' },
        water: { name: '물', path: ['no', 'no'], leafId: 'leafWater', txtId: 'txtWater' },
        grape: { name: '포도 주스', path: ['yes', 'yes'], leafId: 'leafGrape', txtId: 'txtGrape' },
        honey: { name: '꿀', path: ['yes', 'no', 'yes'], leafId: 'leafHoney', txtId: 'txtHoney' },
        oil: { name: '식용유', path: ['yes', 'no', 'no'], leafId: 'leafOil', txtId: 'txtOil' }
      };

      var currentLiquidKey = 'cider';
      var currentStep = 0;
      var completed = {};

      var askText = document.getElementById('p05AskText');
      var btnTilt = document.getElementById('btnTilt');
      var btnYes = document.getElementById('btnYes');
      var btnNo = document.getElementById('btnNo');
      var btnNextLiquid = document.getElementById('btnNextLiquid');
      var doneLiquidName = document.getElementById('doneLiquidName');
      var fg = document.getElementById('p05FingerGuide');
      var cups = document.querySelectorAll('.p05-cup');

      function getActiveNodeId() {
        if (currentStep === 0) return 'nodeQ0';
        var pathSoFar = liquids[currentLiquidKey].path.slice(0, currentStep).join('_');
        if (pathSoFar === 'no') return 'nodeQ1';
        if (pathSoFar === 'yes') return 'nodeQ2';
        if (pathSoFar === 'yes_no') return 'nodeQ3';
        return 'nodeQ0';
      }

      function updateTreeVisuals() {
        ['nodeQ0', 'nodeQ1', 'nodeQ2', 'nodeQ3'].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) {
            var poly = el.querySelector('polygon');
            if (poly) {
              poly.setAttribute('fill', '#e8e4f8');
              poly.setAttribute('stroke', '#7c6fc4');
              poly.setAttribute('stroke-width', '5');
            }
          }
        });

        var activeId = getActiveNodeId();
        var activeEl = document.getElementById(activeId);
        if (activeEl) {
          var poly = activeEl.querySelector('polygon');
          if (poly) {
            poly.setAttribute('fill', '#fff4b8');
            poly.setAttribute('stroke', '#ffcc00');
            poly.setAttribute('stroke-width', '8');
          }
        }

        if (activeId === 'nodeQ3') {
          btnTilt.classList.add('hit-pulse');
          askText.textContent = '컵 기울이기 버튼을 눌러 액체가 흐르는 모습을 확인해보세요.';
        } else {
          btnTilt.classList.remove('hit-pulse');
          askText.textContent = '컵에 담긴 액체를 보고 질문에 답해보세요.';
        }
      }

      function selectLiquid(key) {
        if (completed[key]) return;
        currentLiquidKey = key;
        currentStep = 0;
        cups.forEach(function (c) {
          c.classList.remove('is-on');
          if (c.getAttribute('data-liquid') === key) {
            c.classList.add('is-on');
          }
        });
        updateTreeVisuals();
      }

      cups.forEach(function (c) {
        c.addEventListener('click', function () {
          var k = c.getAttribute('data-liquid');
          selectLiquid(k);
        });
      });

      var isTilted = false;
      btnTilt.addEventListener('click', function () {
        isTilted = !isTilted;
        cups.forEach(function (c) {
          var k = c.getAttribute('data-liquid');
          if (k === 'honey' || k === 'oil') {
            if (isTilted) {
              c.classList.add('is-tilted');
            } else {
              c.classList.remove('is-tilted');
            }
          }
        });
      });

      function handleAnswer(ans) {
        var info = liquids[currentLiquidKey];
        var expected = info.path[currentStep];

        if (ans === expected) {
          SFX.play('correct');
          currentStep++;
          if (currentStep >= info.path.length) {
            completed[currentLiquidKey] = true;
            var cupEl = document.querySelector('.p05-cup[data-liquid="' + currentLiquidKey + '"]');
            if (cupEl) cupEl.classList.add('is-done');

            var leafEl = document.getElementById(info.leafId);
            if (leafEl) {
              var rect = leafEl.querySelector('rect');
              if (rect) {
                rect.setAttribute('fill', '#dcf0ea');
                rect.setAttribute('stroke', '#5c9486');
                rect.removeAttribute('stroke-dasharray');
              }
            }
            var txtEl = document.getElementById(info.txtId);
            if (txtEl) {
              txtEl.textContent = info.name;
              txtEl.style.fontSize = info.name.length > 3 ? '30px' : '34px';
              txtEl.style.fill = '#1b1640';
            }

            doneLiquidName.textContent = info.name;
            document.getElementById('liquidCorrectModal').classList.remove('is-off');
          } else {
            updateTreeVisuals();
          }
        } else {
          SFX.play('wrong');
          flashLayer(document.getElementById('wrongModal'));
        }
      }

      btnYes.addEventListener('click', function () { handleAnswer('yes'); });
      btnNo.addEventListener('click', function () { handleAnswer('no'); });

      btnNextLiquid.addEventListener('click', function () {
        document.getElementById('liquidCorrectModal').classList.add('is-off');
        var keys = ['cider', 'honey', 'water', 'oil', 'grape'];
        var nextKey = null;
        for (var i = 0; i < keys.length; i++) {
          if (!completed[keys[i]]) {
            nextKey = keys[i];
            break;
          }
        }
        if (nextKey) {
          selectLiquid(nextKey);
        } else {
          document.getElementById('allDoneModal').classList.remove('is-off');
        }
      });

      selectLiquid('cider');
    })();
  </script>
</body>
</html>
