<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>의사결정 나무 따라 내려가기</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
      .p05-pn{position:absolute;left:40px;top:165px;width:1840px;height:765px;box-sizing:border-box;border-radius:28px;background:#266cc8}
      .p05-shelf{position:absolute;left:24px;top:20px;width:635px;height:719px;background:url('img/p05_shelf_bg.png') no-repeat center / cover;box-sizing:border-box;overflow:hidden}
      .p05-shelf-row{position:absolute;left:0;right:0}
      .p05-shelf-row.r1{top:57px;height:244px}
      .p05-shelf-row.r2{top:314px;height:244px}
      .p05-shelf-row.r3{bottom:25px;height:80px;display:flex;justify-content:center;align-items:center}
      .p05-cup{position:absolute;width:120px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .3s ease,filter .3s ease}
      .p05-cup[data-liquid="cider"]{left:157px;top:0}
      .p05-cup[data-liquid="honey"]{left:367px;top:0}
      .p05-cup[data-liquid="water"]{left:51px;top:0}
      .p05-cup[data-liquid="oil"]{left:261px;top:0}
      .p05-cup[data-liquid="grape"]{left:472px;top:0}
      .p05-cup.is-on .p05-cup-visual{filter:drop-shadow(5px 0 0 #ff4ff9) drop-shadow(-5px 0 0 #ff4ff9) drop-shadow(0 5px 0 #ff4ff9) drop-shadow(0 -5px 0 #ff4ff9)}
      .p05-cup.is-done{opacity:.4;filter:grayscale(.4)}
      .p05-cup.is-tilted{transform:rotate(36deg) translateY(-14px)}
      .p05-cup-visual{position:relative;width:120px;height:196px;display:flex;align-items:flex-end;justify-content:center}
      .p05-cup-img{display:block;pointer-events:none}
      .p05-liquid-svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:118px;height:196px;z-index:1}
      .p05-glass-overlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:118px;height:196px;z-index:2;pointer-events:none;mix-blend-mode:multiply}
      .p05-liquid{transform-box:view-box;transform-origin:59px 95px}
      .p05-liquid-oil{transition:transform .5s ease-out}
      .p05-liquid-honey{transition:transform 10s cubic-bezier(0.2, 0.8, 0.4, 1)}
      .p05-cup.is-tilted .p05-liquid{transform:rotate(-36deg)}
      .p05-cup span{display:flex;align-items:center;justify-content:center;min-width:100px;height:44px;padding:0 14px;margin-top:4px;border-radius:999px;background:#fff;border:solid 5px #6898fb;font-family:'Cafe24 Ssurround';font-size:30px;color:var(--c-ink);letter-spacing:-0.04em;white-space:nowrap;box-sizing:border-box}
      .p05-tilt-btn{width:320px;height:72px;border-radius:999px;border:solid 3px #eae0fd;background:linear-gradient(180deg,#e6dafe,var(--c-cream));box-shadow:0 6px 0 0 #a9a2ff,0 6px 0 6px #035fd3;font-family:'Cafe24 Ssurround';font-size:38px;color:var(--c-indigo);display:flex;align-items:center;justify-content:center;cursor:pointer;padding-top:4px;letter-spacing:-0.04em;box-sizing:border-box;transition:transform .15s ease,box-shadow .15s ease,color .15s ease}
      @media (hover:hover){.p05-tilt-btn:hover{color:var(--c-violet)}}
      .p05-tilt-btn:active{transform:translateY(6px);box-shadow:0 2px 0 0 #a9a2ff,0 2px 0 6px #035fd3;color:var(--c-orchid)}
      .p05-rcard{position:absolute;left:680px;top:20px;width:1135px;height:720px;box-sizing:border-box;border-radius:24px;border:solid 6px #fff;background:#fff}
      .p05-tree-wrap{position:absolute;left:52px;top:30px;width:1040px;height:525px}
      .p05-tree-svg{position:absolute;left:0;top:0;width:1040px;height:525px;display:block;pointer-events:none}
      .p05-qcard{position:absolute;box-sizing:border-box;padding-top:4px;border-radius:18px;border:solid 4px #7c6fc4;background:#f8f6ff;display:flex;align-items:center;justify-content:center;font-family:'Cafe24 Ssurround';font-size:34px;color:#1b1640;letter-spacing:-0.04em;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.06);transition:all .25s ease;z-index:2}
      .p05-qcard.is-active{background:#fff8cc;border:solid 5px var(--c-yellow);box-shadow:0 0 20px rgba(255,200,0,.85);color:#1b1640;font-weight:bold}
      .p05-leaf{position:absolute;box-sizing:border-box;border-radius:18px;border:dashed 4px #9aa3b5;background:#f3f5fa;display:flex;align-items:center;justify-content:center;font-family:'Cafe24 Ssurround';font-size:42px;color:#7b86a8;letter-spacing:-0.04em;text-align:center;transition:all .25s ease;z-index:2}
      .p05-leaf.is-done{border:solid 4px #5c9486;background:#dcf0ea;color:#0c614b;font-size:32px;font-weight:bold;box-shadow:0 4px 10px rgba(92,148,134,.2)}
      .p05-yn-row{position:absolute;left:0;right:0;bottom:35px;display:flex;justify-content:center;gap:60px}

      .p05-fg{position:absolute;left:360px;top:790px;width:110px;z-index:10;pointer-events:none}
    </style>
</head>

  <script>
    (function () {
      var liquids = {
        cider: { name: '사이다', path: ['no', 'yes'], leafId: 'leafCider' },
        water: { name: '물', path: ['no', 'no'], leafId: 'leafWater' },
        grape: { name: '포도 주스', path: ['yes', 'yes'], leafId: 'leafGrape' },
        honey: { name: '꿀', path: ['yes', 'no', 'yes'], leafId: 'leafHoney' },
        oil: { name: '식용유', path: ['yes', 'no', 'no'], leafId: 'leafOil' }
      };

      var currentLiquidKey = 'cider';
      var currentStep = 0;
      var completed = {};

      var askText = document.getElementById('p05AskText');
      var btnTilt = document.getElementById('btnTilt');
      var btnYes = document.getElementById('btnYes');
      var btnNo = document.getElementById('btnNo');
      var btnNextLiquid = document.getElementById('btnNextLiquid');
      var doneLiquidName = document.getElementById('doneLiquidName');
      var fg = document.getElementById('p05FingerGuide');
      var cups = document.querySelectorAll('.p05-cup');

      function getActiveNodeId() {
        if (currentStep === 0) return 'nodeQ0';
        var pathSoFar = liquids[currentLiquidKey].path.slice(0, currentStep).join('_');
        if (pathSoFar === 'no') return 'nodeQ1';
        if (pathSoFar === 'yes') return 'nodeQ2';
        if (pathSoFar === 'yes_no') return 'nodeQ3';
        return 'nodeQ0';
      }

      function updateTreeVisuals() {
        ['nodeQ0', 'nodeQ1', 'nodeQ2', 'nodeQ3'].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.classList.remove('is-active');
        });

        var activeId = getActiveNodeId();
        var activeEl = document.getElementById(activeId);
        if (activeEl) {
          activeEl.classList.add('is-active');
        }

        if (activeId === 'nodeQ3') {
          btnTilt.classList.add('hit-pulse');
          askText.textContent = '컵 기울이기 버튼을 눌러 액체가 흐르는 모습을 확인해보세요.';
        } else {
          btnTilt.classList.remove('hit-pulse');
          askText.textContent = '컵에 담긴 액체를 보고 질문에 답해보세요.';
        }
      }

      function selectLiquid(key) {
        if (completed[key]) return;
        btnNextLiquid.classList.remove('is-pressed');
        currentLiquidKey = key;
        currentStep = 0;
        cups.forEach(function (c) {
          c.classList.remove('is-on');
          if (c.getAttribute('data-liquid') === key) {
            c.classList.add('is-on');
          }
        });
        updateTreeVisuals();
      }

      cups.forEach(function (c) {
        c.addEventListener('click', function () {
          var k = c.getAttribute('data-liquid');
          selectLiquid(k);
        });
      });

      var isTilted = false;
      btnTilt.addEventListener('click', function () {
        playClick();
        isTilted = !isTilted;
        cups.forEach(function (c) {
          var k = c.getAttribute('data-liquid');
          if (k === 'honey' || k === 'oil') {
            c.classList.toggle('is-tilted', isTilted);
          }
        });
      });

      function handleAnswer(ans) {
        var info = liquids[currentLiquidKey];
        var expected = info.path[currentStep];

        if (ans === expected) {
          SFX.play('correct');
          currentStep++;
          if (currentStep >= info.path.length) {
            completed[currentLiquidKey] = true;
            var cupEl = document.querySelector('.p05-cup[data-liquid="' + currentLiquidKey + '"]');
            if (cupEl) cupEl.classList.add('is-done');

            var leafEl = document.getElementById(info.leafId);
            if (leafEl) {
              leafEl.classList.add('is-done');
              leafEl.textContent = info.name;
            }

            doneLiquidName.textContent = info.name;
            var lastCode = info.name.charCodeAt(info.name.length - 1);
            var hasFinal = lastCode >= 0xAC00 && lastCode <= 0xD7A3 && (lastCode - 0xAC00) % 28 !== 0;
            document.getElementById('doneLiquidEnd').textContent = hasFinal ? '이었어요' : '였어요';
            document.getElementById('liquidPhoto').style.backgroundImage = "url('img/p05_photo_" + currentLiquidKey + ".jpg')";
            btnNextLiquid.classList.remove('is-pressed');
            document.getElementById('liquidCorrectModal').classList.remove('is-off');
          } else {
            updateTreeVisuals();
          }
        } else {
          SFX.play('wrong');
          flashLayer(document.getElementById('wrongModal'));
        }
      }

      btnYes.addEventListener('click', function () { handleAnswer('yes'); });
      btnNo.addEventListener('click', function () { handleAnswer('no'); });

      btnNextLiquid.addEventListener('click', function () {
        btnNextLiquid.classList.remove('is-pressed');
        document.getElementById('liquidCorrectModal').classList.add('is-off');
        isTilted = false;
        cups.forEach(function (c) {
          c.classList.remove('is-tilted');
        });
        var keys = ['cider', 'honey', 'water', 'oil', 'grape'];
        var nextKey = null;
        for (var i = 0; i < keys.length; i++) {
          if (!completed[keys[i]]) {
            nextKey = keys[i];
            break;
          }
        }
        if (nextKey) {
          selectLiquid(nextKey);
        } else {
          document.getElementById('allDoneModal').classList.remove('is-off');
        }
      });

      selectLiquid('cider');
    })();
  </script>
</body>
</html>
