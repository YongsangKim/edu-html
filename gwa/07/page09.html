<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상호작용형 실습 콘텐츠</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 28p. page10(29p~)과 같은 배치: 왼쪽 말풍선·캐릭터, 가운데 스마트폰(홈 화면의 SmartThings 앱 아이콘 img/p09_app_icon.png를 누르면 실습 시작),
           오른쪽 집 안 그림(img/p09_house.png). 캐릭터는 임시로 sa/06 캐릭터 복사본 */

        .p09-bubble{position:absolute;margin:0;left:30px;top:30px;width:500px;min-height:280px;box-sizing:border-box;padding:28px 26px;display:flex;align-items:center;justify-content:center;text-align:center;
          background:var(--c-cream);border:solid 5px var(--c-purple);border-radius:30px;box-shadow:-7px 10px 6px 2px rgba(92,61,240,.17);
          font-family:'Cafe24 Ssurround';font-size:36px;line-height:1.3;color:var(--c-purple);letter-spacing:-0.05em;word-break:keep-all;z-index:2}
        .p09-bubble:before{content:'';position:absolute;left:200px;bottom:-58px;width:100px;height:70px;background:url('../../img/common/p_guide_tail.png') 0 0 / contain no-repeat}
        .p09-character{left:20px;top:420px;width:520px;height:520px}

        .p09-scene{position:absolute;left:1240px;top:40px;width:650px;height:880px;box-sizing:border-box;border:solid 6px var(--c-purple);border-radius:36px;background:var(--c-mist) url('img/p09_house.png') center / cover no-repeat}

        .p09-phone{left:710px;top:24px;width:500px;height:910px}
        .p09-screen{position:relative;width:100%;height:100%;border-radius:54px;background:var(--c-pale)}
        .p09-screen:before{content:'';position:absolute;left:50%;top:18px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--c-ink)}
        .p09-app{position:absolute;left:50%;top:330px;width:180px;margin-left:-90px;display:flex;flex-direction:column;align-items:center;gap:12px;
          font-family:'Pretendard';font-size:26px;font-weight:600;color:var(--c-ink);text-decoration:none}
        .p09-app i{width:150px;height:150px;border-radius:62px;background:url('img/p09_app_icon.png') center / contain no-repeat;box-shadow:0 8px 16px rgba(30,124,242,.3);transition:transform .15s}
        .p09-app:hover i{transform:scale(1.05)}
        .p09-app:active i{transform:scale(.94)}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <p class="p09-bubble">이제 우리가 직접 AI 스마트 홈 제어 앱인 Smart Things 을 활용해서 3가지 난이도의 자동화 루틴을 만들어 보자!</p>
          <div class="char-box p09-character"><img src="img/p_character_main.png" alt="메인 캐릭터"></div>

          <div class="phone-frame p09-phone">
            <div class="p09-screen">
              <a href="page10.html" class="js-nav-effect js-sfx p09-app" data-sound="sound/click.mp3"><i></i>SmartThings</a>
            </div>
          </div>
          <div class="p09-scene"></div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="상호작용형 실습 콘텐츠" data-next="page10.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
