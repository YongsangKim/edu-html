<!DOCTYPE html>
<html lang="ko">
<head>

    <title>내가 바로 스마트홈 AI!</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 61p. 왼쪽 큰 캐릭터 + 말풍선, 오른쪽 위 제목 알약, 쾌적해진 집 안 전체(img/p14_house.png), 아래 '학습 종료하기' 버튼.
           캐릭터는 임시로 sa/06 캐릭터 복사본 */

        .p14-bubble{position:absolute;left:40px;top:40px;width:620px;box-sizing:border-box;padding:30px;margin:0;
          background:var(--c-cream);border:solid 5px var(--c-purple);border-radius:30px;box-shadow:-7px 10px 6px 2px rgba(92,61,240,.17);
          font-family:'Cafe24 Ssurround';font-size:36px;line-height:1.35;color:var(--c-purple);letter-spacing:-0.05em;word-break:keep-all;text-align:center;z-index:3}
        .p14-bubble:before{content:'';position:absolute;left:260px;bottom:-58px;width:100px;height:70px;background:url('../../img/common/p_guide_tail.png') 0 0 / contain no-repeat}
        .p14-character{left:0;bottom:0;width:700px;height:640px;overflow:hidden;z-index:2}

        .p14-title{position:absolute;left:760px;top:40px;width:1000px;height:110px;box-sizing:border-box;padding-top:8px;margin:0;display:flex;align-items:center;justify-content:center;
          background:var(--c-ink);border:solid 6px var(--c-yellow);border-radius:55px;font-family:'Cafe24 Ssurround';font-size:60px;color:var(--c-yellow);letter-spacing:-0.05em;z-index:2}
        .p14-house{position:absolute;left:720px;top:180px;width:1160px;height:580px;box-sizing:border-box;border:solid 6px var(--c-purple);border-radius:36px;background:var(--c-mist) url('img/p14_house.png') center / cover no-repeat}
        .p14-end{position:absolute;left:1050px;top:800px;width:500px;height:122px;display:flex;align-items:center;justify-content:center;font-size:58px;text-decoration:none;z-index:20}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <p class="p14-bubble">완벽해! 네가 바로 최고의 스마트홈 AI야! 센서로 세상을 실시간으로 감지하고, AI 허브가 상황을 판단해 가전을 움직이는 사물인터넷 덕분에 우리 삶이 더욱 안전하고 편리해졌어!</p>
          <div class="char-box p14-character"><img src="img/p14_character.png" alt="메인 캐릭터"></div>

          <p class="p14-title">최고의 AI 스마트홈 두뇌</p>
          <div class="p14-house"></div>

          <a href="../gwa.html" class="js-nav-effect js-sfx card-btn p14-end" data-sound="sound/click.mp3">학습 종료하기</a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="내가 바로 스마트홈 AI!" data-next="../gwa.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
