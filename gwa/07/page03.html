<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>삼촌의 이사를 도와라!</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 3~10p. 아래 트레이의 스마트 기기를 집 그림의 알맞은 점선 칸으로 끌어 놓기, 2라운드(거실 6개 → 현관·주방·침실·다용도실 4개).
           기기를 누르면 말풍선에 기기 설명, 맞으면 기기가 칸에 고정되고 정답 팝업(확인), 틀리면 트레이로 돌아가고 오답 팝업(확인).
           배경 img/p03_bg_round{1|2}.png(1800×615, 칸 좌표는 이 원본 기준 px로 적고 화면 크기에 맞춰 줄임), 기기 img/p03_dev_{key}.png. 캐릭터는 임시로 sa/06 캐릭터 복사본 */
        main{position:absolute;left:0;top:120px;width:1920px;height:960px}

        .p03-title{position:absolute;margin:0;left:420px;top:20px;width:1180px;height:90px;box-sizing:border-box;padding:6px 30px 0;display:flex;align-items:center;justify-content:center;gap:24px;
          background:#91b9e7;border:solid 5px #1b1738;border-radius:45px;box-shadow:0 10px 0 0 #becde7;font-family:'Cafe24 Ssurround';font-size:46px;color:#fff;letter-spacing:-0.04em}
        .p03-title b{font-weight:normal;color:#1b1738}
        .p03-count{position:absolute;margin:0;left:1630px;top:20px;width:250px;height:90px;box-sizing:border-box;padding-top:6px;display:flex;align-items:center;justify-content:center;
          background:#1b1738;border-radius:45px;font-family:'Cafe24 Ssurround';font-size:50px;color:#fff}

        .p03-scene{position:absolute;left:420px;top:145px;width:1460px;height:499px;background:#fefbf9 0 0 / 100% 100% no-repeat}
        .p03-scene.is-round1{background-image:url('img/p03_bg_round1.png')}
        .p03-scene.is-round2{background-image:url('img/p03_bg_round2.png')}
        .p03-zone{position:absolute;box-sizing:border-box;border:dashed 5px #48159c;border-radius:16px;background:rgba(255,255,255,.35)}
        .p03-zone[data-filled]{border-color:transparent;background:none}

        .p03-character{position:absolute;left:10px;top:330px;width:400px;height:330px;display:flex;align-items:flex-end;justify-content:center}
        .p03-character img{max-width:100%;max-height:100%;object-fit:contain}
        .p03-bubble{position:absolute;margin:0;left:20px;top:20px;width:385px;min-height:260px;box-sizing:border-box;padding:26px 28px;display:flex;align-items:center;justify-content:center;text-align:center;
          background:#fefbf9;border:solid 5px #48159c;border-radius:30px;box-shadow:-7px 10px 6px 2px rgba(92,61,240,.17);
          font-family:'Cafe24 Ssurround';font-size:36px;line-height:1.3;color:#48159c;letter-spacing:-0.05em;word-break:keep-all}
        .p03-bubble:before{content:'';position:absolute;left:150px;bottom:-58px;width:100px;height:70px;background:url('../../img/common/p_guide_tail.png') 0 0 / contain no-repeat}
        .p03-bubble.is-off{display:none}

        .p03-tray{position:absolute;left:40px;top:690px;width:1840px;height:240px;box-sizing:border-box;padding:20px;background:#fefbf9;border:solid 6px #48159c;border-radius:36px;
          display:flex;gap:24px;justify-content:center;align-items:center}
        .p03-card{position:relative;width:270px;height:190px;box-sizing:border-box;border:solid 5px #91b9e7;border-radius:24px;background:#fff;display:flex;flex-direction:column;align-items:center;padding:10px 6px 8px;
          font-family:'Cafe24 Ssurround';font-size:32px;color:#31248a;letter-spacing:-0.07em;white-space:nowrap;cursor:grab}
        .p03-card i{flex:1 1 auto;width:100%;background:center / contain no-repeat;pointer-events:none}
        .p03-card.is-dragging{cursor:grabbing;z-index:60}
        .p03-zone .p03-card{position:absolute;left:0;top:0;width:100%;height:100%;padding:0;border:0;background:none;font-size:0;cursor:default}

        .p03-clear{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:780px;box-sizing:border-box;padding:50px 40px 60px;display:flex;flex-direction:column;align-items:center;gap:20px;
          background:#fefbf9;border:solid 8px #1b1738;border-radius:40px;box-shadow:0 14px 0 0 #becde7;font-family:'Cafe24 Ssurround';text-align:center;z-index:40}
        .p03-clear.is-off{display:none}
        .p03-clear-title{margin:0;font-size:80px;color:#02185c;letter-spacing:-0.05em}
        .p03-clear-text{margin:0 0 20px;font-size:48px;line-height:1.3;color:#1b1738;letter-spacing:-0.05em}
        .p03-clear .card-btn{height:110px;font-size:52px}

        .p03-ok{padding:0;border:0;background:none;cursor:pointer}
        .p03-ok img{display:block;height:110px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <p class="p03-title"><b id="p03Round">1라운드</b>스마트 기기를 알맞은 위치로 옮겨 주세요</p>
          <p class="p03-count" id="p03Count">0/6</p>
          <div class="p03-scene is-round1" id="p03Scene"></div>

          <div class="p03-character"><img src="img/p_character_main.png" alt="삼촌과 로운이"></div>
          <p class="p03-bubble is-off" id="p03Bubble"></p>

          <div class="p03-tray" id="p03Tray"></div>

          <div class="p03-clear is-off" id="p03Clear">
            <p class="p03-clear-title" id="p03ClearTitle"></p>
            <p class="p03-clear-text" id="p03ClearText"></p>
            <button class="card-btn js-sfx" id="p03ClearBtn" data-sound="sound/click.mp3"></button>
          </div>

          <div class="avatar-modal is-off" id="p03Right">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_correct_gwa.png" alt=""></div>
              <div class="avatar-popup-body is-finish">
                <p class="avatar-popup-text">잘했어요!</p>
                <p class="avatar-popup-sub" id="p03RightText"></p>
                <button class="p03-ok avatar-popup-next" data-close="p03Right">
                  <img src="../../img/common/btn_confirm.png" class="js-img-swap js-sfx" data-src-over="../../img/common/btn_confirm_over.png" data-sound="sound/click.mp3" alt="확인">
                </button>
              </div>
            </div>
          </div>

          <div class="avatar-modal is-off" id="p03Wrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body is-finish">
                <p class="avatar-popup-text">다시 한번 해볼까요?</p>
                <p class="avatar-popup-sub">삼촌의 말을 다시 한번 확인해봐!</p>
                <button class="p03-ok avatar-popup-next" data-close="p03Wrong">
                  <img src="../../img/common/btn_confirm.png" class="js-img-swap js-sfx" data-src-over="../../img/common/btn_confirm_over.png" data-sound="sound/click.mp3" alt="확인">
                </button>
              </div>
            </div>
          </div>

          <div class="avatar-modal is-off" id="p03Video">
            <div class="avatar-card is-side">
              <img class="avatar-card-avatar" src="../../img/common/avatar_finish.png" alt="">
              <div class="avatar-card-body">
                <p class="avatar-card-text">그런데 스마트 기기는<br>어떻게 주변 상황을 알아차릴까요?<br>센서와 AI 허브의 비밀을<br>영상으로 확인해 봐요!</p>
              </div>
              <a href="page04.html" class="js-nav-effect avatar-card-btn">
                <img src="../../img/common/btn_next_small.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_next_small_on.png" data-src-over="../../img/common/btn_next_small_over.png" data-sound="sound/click.mp3" alt="다음">
              </a>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="삼촌의 이사를 도와라!" data-next="page04.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const ROUNDS = [
      {
        clearTitle: '1라운드 완료!', clearText: '거실의 스마트 기기를<br>모두 배치했어요.', clearBtn: '다음 라운드',
        devices: [
          { key: 'tv', name: '스마트 TV', zone: [261.37, 295.89, 198.49, 138.08],
            desc: '인터넷으로 연결되어 내가 좋아하는 영상을 추천해 주는 TV',
            right: '스마트 TV는 평소 내가 즐겨 보던 영상을 분석하여, 내가 좋아할 만한 영상을 추천해 줘요.' },
          { key: 'aircon', name: '스마트 에어컨', zone: [1015.89, 136.85, 332.88, 135.62],
            desc: '실내 온도를 감지하여 자동으로 시원한 바람을 보내주는 에어컨',
            right: '스마트 에어컨은 집 안의 온도를 확인하여, 실내가 더울 때 시원한 바람을 내보내요.' },
          { key: 'sensor', name: '온습도 센서', zone: [1368.49, 247.81, 104.79, 104.79],
            desc: '집 안의 온도와 습도를 실시간으로 측정하여 알려주는 센서',
            right: '온습도 센서는 집 안의 온도와 습도를 실시간으로 측정하여 AI 허브에 전달해요.' },
          { key: 'light', name: '스마트 전등', zone: [597.95, 12.33, 283.56, 98.63],
            desc: '원격으로 켜고 끄거나 밝기와 색상을 바꿀 수 있는 전등',
            right: '스마트 전등은 원격으로 불을 켜고 끌 수 있으며, 밝기와 색상도 알맞게 조절할 수 있어요.' },
          { key: 'robot', name: '스마트 로봇청소기', zone: [1199.59, 506.71, 237.95, 93.70],
            desc: '집안 구조를 스스로 파악하며 돌아다니는 청소기',
            right: '스마트 로봇청소기는 집 안의 구조와 장애물을 파악하며 스스로 이동해 바닥을 청소해요.' },
          { key: 'hub', name: 'AI 허브', zone: [600.41, 441.37, 197.26, 61.64],
            desc: '집 안의 모든 센서 정보를 모아 AI가 상황을 판단하는 중심 두뇌',
            right: 'AI 허브는 여러 센서가 보낸 정보를 모아 상황을 판단하고, 알맞은 스마트 가전이 작동하도록 해요.' }
        ]
      },
      {
        clearTitle: '2라운드 완료!', clearText: '스마트 기기를<br>모두 배치했어요.', clearBtn: '다음',
        devices: [
          { key: 'cctv', name: 'CCTV 카메라', zone: [73.97, 98.63, 196.03, 123.29],
            desc: '집 안팎의 움직임을 실시간으로 감지하고 감시하는 시각 센서',
            right: 'CCTV 카메라는 현관문 위에 설치해요.<br>집 안팎의 움직임을 감지해요.' },
          { key: 'fridge', name: '스마트 냉장고', zone: [720, 311.92, 165.21, 251.51],
            desc: '내부 음식의 유통기한을 확인하고 레시피를 추천하는 냉장고',
            right: '스마트 냉장고는 주방에 놓아요.<br>음식의 유통기한을 확인하고 요리를 추천해 줘요.' },
          { key: 'purifier', name: '스마트 공기청정기', zone: [1296.99, 361.23, 109.73, 199.73],
            desc: '공기 오염도를 감지하여 먼지를 깨끗하게 없애주는 공기청정기',
            right: '스마트 공기청정기는 침실 구석에 놓아요.<br>공기 오염도를 감지해 먼지를 없애 줘요.' },
          { key: 'washer', name: '스마트 세탁기', zone: [1536.16, 351.37, 212.05, 204.66],
            desc: '빨래 양을 감지해 세제를 자동으로 넣어주는 세탁기',
            right: '스마트 세탁기는 다용도실에 놓아요.<br>빨래 양을 감지해 세제를 자동으로 넣어 줘요.' }
        ]
      }
    ];

    const $ = (id) => document.getElementById(id);
    const scene = $('p03Scene');
    const tray = $('p03Tray');
    const bubble = $('p03Bubble');
    const count = $('p03Count');
    const clear = $('p03Clear');
    const playCorrect = makeSfx('sound/correct.mp3');
    const playWrong = makeSfx('sound/incorrect.mp3');

    let round = 0;
    let placed = 0;

    function open(id) { $(id).classList.remove('is-off'); }

    document.querySelectorAll('.p03-ok').forEach((btn) => {
      btn.addEventListener('click', () => {
        $(btn.dataset.close).classList.add('is-off');
        resetImageSwap(btn);
        if (btn.dataset.close === 'p03Right' && placed === ROUNDS[round].devices.length) showClear();
      });
    });

    function renderRound() {
      const r = ROUNDS[round];
      placed = 0;
      $('p03Round').textContent = (round + 1) + '라운드';
      count.textContent = '0/' + r.devices.length;
      scene.className = 'p03-scene is-round' + (round + 1);
      scene.innerHTML = '';
      tray.innerHTML = '';
      bubble.classList.add('is-off');

      const zones = r.devices.map((d) => {
        const z = document.createElement('div');
        z.className = 'p03-zone';
        z.dataset.key = d.key;
        const k = 1460 / 1800;
        z.style.cssText = 'left:' + d.zone[0] * k + 'px;top:' + d.zone[1] * k + 'px;width:' + d.zone[2] * k + 'px;height:' + d.zone[3] * k + 'px';
        scene.appendChild(z);
        return z;
      });
      const cards = r.devices.map((d) => {
        const c = document.createElement('div');
        c.className = 'p03-card';
        c.dataset.key = d.key;
        c.innerHTML = '<i style="background-image:url(\'img/p03_dev_' + d.key + '.png\')"></i>' + d.name;
        c.addEventListener('pointerdown', () => {
          if (c.dataset.placed) return;
          bubble.textContent = d.desc;
          bubble.classList.remove('is-off');
        });
        tray.appendChild(c);
        return c;
      });

      initMatchDrag({
        cards: cards,
        zones: zones,
        slop: 60,
        onRight: (card) => {
          placed += 1;
          count.textContent = placed + '/' + r.devices.length;
          playCorrect();
          $('p03RightText').innerHTML = r.devices.find((d) => d.key === card.dataset.key).right;
          open('p03Right');
        },
        onWrong: (card, zone) => {
          if (!zone) return;
          playWrong();
          open('p03Wrong');
        }
      });
    }

    function showClear() {
      const r = ROUNDS[round];
      $('p03ClearTitle').textContent = r.clearTitle;
      $('p03ClearText').innerHTML = r.clearText;
      $('p03ClearBtn').textContent = r.clearBtn;
      clear.classList.remove('is-off');
    }

    $('p03ClearBtn').addEventListener('click', () => {
      clear.classList.add('is-off');
      if (round === ROUNDS.length - 1) {
        open('p03Video');
        return;
      }
      round += 1;
      renderRound();
    });

    renderRound();
  })();
  </script>
</body>
</html>
