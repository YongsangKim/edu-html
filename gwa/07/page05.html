<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 기기 역할 분류하기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 12p 도입 화면, 공용 .intro-* + 세 가지 역할 카드. 캐릭터(아로)는 임시로 sa/06 캐릭터 복사본 */
        .p05-panel.intro-panel{height:620px;gap:24px}
        .p05-panel.intro-panel .intro-lead{font-size:48px}
        .p05-desc{margin:0;font-size:40px;line-height:1.3;text-align:center;letter-spacing:-0.05em}
        .p05-roles{display:flex;gap:24px}
        .p05-role{flex:1 1 0;height:210px;box-sizing:border-box;padding:18px 16px;border:solid 5px var(--c-purple);border-radius:26px;background:var(--c-pale);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
        .p05-role b{font-weight:normal;font-size:36px;color:var(--c-purple);letter-spacing:-0.07em;white-space:nowrap}
        .p05-role span{font-size:30px;line-height:1.3;color:var(--c-ink);letter-spacing:-0.06em}
        .next-btn-activity{left:1080px;top:760px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="intro-character"><img src="img/p_character_intro.png" alt="아로"></div>
          <div class="intro-panel is-title p05-panel">
            <p class="intro-lead">스마트 기기들을 센서·AI허브·스마트 가전으로<br>역할에 따라 분류해 보자!</p>
            <p class="p05-desc">AI 스마트홈은 세 가지 역할이 서로 연결되어 움직여요.<br>기기 카드를 살펴보고 알맞은 역할 상자에 넣어 볼까요?</p>
            <div class="p05-roles">
              <div class="p05-role"><b>센서(입력)</b><span>주변환경에 대한 정보를 수집하는 눈/귀/코/피부</span></div>
              <div class="p05-role"><b>AI허브(판단)</b><span>수집된 정보를 중심으로 판단하고, 명령을 보내는 뇌</span></div>
              <div class="p05-role"><b>스마트가전(실행)</b><span>뇌에서 보내는 명령에 따라 움직이는 손과 발</span></div>
            </div>
          </div>

          <a href="page06.html" class="js-nav-effect next-btn-activity">
            <img src="../../img/common/btn_start.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_start_on.png" data-src-over="../../img/common/btn_start_over.png" data-sound="sound/click.mp3" alt="시작하기">
          </a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="스마트 기기 역할 분류하기" data-next="page06.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
