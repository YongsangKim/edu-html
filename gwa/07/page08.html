<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온도 센서로 에어컨 알리미 만들기</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        /* 디자인 없음 - 기획서 14~36p. 실제 MakeCode 캡처(img/p_mc_NN.png, 위·아래 잘라냄, 왼쪽 시뮬레이터 색은 하늘색으로 통일)를 단계마다 한 장씩 깔고
           눌러야 할 곳(클릭 영역)만 얹음. 그 밖의 영역은 무반응. 블록 끌기는 캡처에서 오려 낸 블록 그림이 마우스를 따라감 */
        .mc{position:absolute;left:252px;top:18px;width:1523px;height:752px;transform:scale(.93);transform-origin:0 0;background:#fff;box-shadow:0 0 0 4px #fff,0 8px 24px rgba(40,50,120,.25);user-select:none;-webkit-user-select:none;touch-action:none}
        .mc>img{position:absolute;left:0;top:0;width:1523px;height:752px;pointer-events:none}
        .mc-over{opacity:0}
        .mc-ov{position:absolute;overflow:hidden;pointer-events:none}
        .mc-ov img{position:absolute;max-width:none}
        .mc-hit{position:absolute;display:block;padding:0;border:0;background:transparent;cursor:pointer;touch-action:none;z-index:5}
        .p08-talk{position:absolute;left:40px;top:692px;width:1345px;height:236px}
        .p08-talk-bar{position:absolute;left:135px;top:52px;width:1210px;height:150px;box-sizing:border-box;padding:0 40px 0 130px;display:flex;align-items:center;
          background:var(--c-white);border:solid 6px var(--c-purple);border-radius:75px;box-shadow:0 12px 0 0 rgba(72,21,156,.18)}
        .p08-talk-bar p{margin:0;font-family:'Cafe24 Ssurround';font-size:46px;line-height:1.15;color:var(--c-purple);letter-spacing:-0.05em;word-break:keep-all}
        .p08-talk-avatar{position:absolute;left:0;top:0;width:236px;height:236px;border-radius:50%;overflow:hidden;background:var(--c-purple);box-shadow:0 12px 0 0 rgba(72,21,156,.18);border:solid 6px var(--c-purple);box-sizing:border-box;z-index:1}
        .p08-talk-avatar img{position:absolute;left:50%;top:-6px;width:330px;max-width:none;transform:translateX(-50%)}
        .p08-next.card-btn.is-start{position:absolute;left:1440px;top:736px;min-width:0;width:420px}
        .p08-hide{display:none!important}
        .p08-next:disabled{opacity:.4;pointer-events:none}
        .mc-ghost{position:absolute;display:none;pointer-events:none;z-index:9;background-repeat:no-repeat;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}

.mc-finger-drag{
  position:absolute;
  width:70px;
  z-index:999;
  pointer-events:none;
}

.mc-finger-move{
  transition:
    left 0.8s ease-out,
    top 0.8s ease-out,
    opacity .4s ease-out;
}

    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="p08-talk">
            <div class="p08-talk-avatar"><img id="p08Char" src="../img/character/gwa_main.png" alt="메인 캐릭터"></div>
            <div class="p08-talk-bar"><p id="p08Bubble"></p></div>
          </div>
          <button type="button" class="card-btn is-start js-sfx p08-next p08-hide" id="p08Btn" data-sound="sound/click.mp3">다음</button>

          <div class="mc" id="mc">
            <img id="mcBase" alt="">
            <img id="mcOver" class="mc-over" alt="">
            <div class="mc-ov" id="mcOv"><img id="mcOvImg" alt=""></div>
            <div class="mc-ghost" id="mcGhost"></div>
            <button type="button" class="mc-hit" id="mcHit" data-hit=""></button>
          </div>

          <div class="avatar-modal is-off" id="p08Modal">
            <div class="avatar-card is-left">
              <img class="avatar-card-avatar" src="../../resources/img/common/avatar_finish.png" alt="">
              <div class="avatar-card-body">
                <div class="step-flow">
                  <div class="step-panel is-title">
                    <p class="avatar-card-text">센서 데이터와 조건문을 연결해,<br>온도 변화에 따른 LED 알림을 만들었어요!<br>이제 퀴즈를 풀며 배운 내용을<br>확인해볼까요?</p>
                    <a href="page09.html" class="js-nav-effect avatar-card-btn card-btn is-popup js-sfx" data-sound="sound/click.mp3">다음</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="온도 센서로 에어컨 알리미 만들기" data-next="page09.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script src="../../resources/js/box-edit.js"></script>
  <script>
  (function () {
    const W = 1523, H = 752, DROP_X = 870;
    const IMG = (n) => 'img/p_mc_' + String(n).padStart(2, '0') + '.png';
    const R = {
      catBasic: [432, 105, 200, 40], catInput: [432, 145, 200, 40], catLogic: [432, 345, 200, 40],
      blkA: [645, 123, 157, 96], blkNum: [645, 123, 129, 53], blkTemp: [645, 678, 94, 38],
      blkIf: [645, 285, 162, 168], blkCmp: [646, 570, 164, 38], blkLed: [645, 181, 167, 212],
      ddB: [1123, 199, 96, 26], cmpArrow: [1322, 167, 42, 30], geOpt: [1294, 352, 98, 26],
      numSlot: [1371, 166, 36, 30], btnA: [36, 218, 46, 46], btnB: [342, 218, 46, 46]
    };
    const FLY = [632, 64, 232, 688];
    const FG = { 
      catInput: [0, -10], catBasic: [0, -10], catLogic: [20, 10], blkA: [20, 10], blkNum: [20, 10], blkTemp: [20, 10], blkIf: [20, 10], blkCmp: [20, 10], blkLed: [20, 10], ddB: [20, 10], cmpArrow: [20, 10], geOpt: [20, 10], numSlot: [20, 10], btnA: [20, 10], btnB: [20, 10], btn: [20, 10] 
    };
    // 드래그 손가락의 시작 오프셋과 이동 거리(delta)를 관리하는 객체
    const FD = {
      blkA:   { sx: 0, sy: 0, mx: 200, my: 0 },
      blkNum: { sx: 0, sy: 0, mx: 200, my: 0 },
      blkTemp:{ sx: 0, sy: 0, mx: 300, my: -510 },
      blkIf:  { sx: 0, sy: 0, mx: 180, my: 20 },
      blkCmp: { sx: 0, sy: 0, mx: 180, my: 20 },
      blkLed: { sx: 0, sy: 0, mx: 180, my: 20 },
      blkA2:  { sx: 0, sy: 0, mx: 400, my: 0 },
      blkTemp2:{ sx: 0, sy: 0, mx: 180, my: 20 },
      blkLed2:{ sx: 0, sy: 0, mx: 180, my: 20 }
    };

    const SAY = {
      intro1: ['MakeCode의 [입력] 블록으로 버튼을 누를 때마다 온도를 확인하고,', 'smile_present'],
      intro2: ['[논리] 블록의 조건문을 사용해서 온도가 26도 이상일 때, 표정이 변하게 만들어 볼까요?', 'wink_present'],
      inA: ['‘입력’에서 ‘A 버튼 누를 때’ 블록을 클릭해 판으로 드래그 하세요.', 'wink_point2'],
      basic: ['‘기본’에서 ‘숫자 출력’ 블록을 클릭해 판으로 드래그 하세요.', 'wink_point3'],
      temp: ['‘입력’에서 ‘온도’ 블록을 클릭해 판으로 드래그 하세요.', 'wink_point2'],
      btn: ['‘입력’에서 ‘A 버튼 누를 때’ 블록을 클릭해 판으로 드래그 하세요.', 'wink_point3'],
      toB: ['버튼을 B로 변경하세요.', 'wink_point2'],
      logic: ['‘논리’에서 ‘만약 참 이라면, 아니면’ 블록을 선택해 판으로 드래그 하세요.', 'wink_point3'],
      cmp: ['[0<0] 블록을 클릭해 ‘참’ 블록 안으로 드래그 하세요.', 'wink_point2'],
      temp2: ['‘입력’에서 [온도]를 클릭해 판으로 드래그 하세요.', 'wink_point3'],
      ge: ['부호를 ‘≥’로 변경해 주세요.', 'wink_point2'],
      num: ['숫자 26을 입력해 볼까요?', 'wink_point3'],
      led: ['‘기본’에서 [LED 출력]을 클릭해 판으로 드래그 하세요.', 'wink_point2'],
      done: ['완성됐어요! 이제 온도에 따라 달라지는 결과를 확인해볼까요?', 'wink_present'],
      result: ['완성됐어요! 이제 온도에 따라 달라지는 결과를 확인해볼까요?', 'smile_present']
    };

    const FR = [
      { img: 1, say: 'intro1', btn: '다음' },
      { img: 1, say: 'intro2', btn: '시작하기' },
      { img: 1, say: 'inA', type: 'click', key: 'catInput' },
      { img: 2, say: 'inA', type: 'drag', key: 'blkA', hover: 3, ghost: 3 },
      { img: 8, say: 'basic', type: 'click', key: 'catBasic' },
      { img: 9, say: 'basic', type: 'drag', key: 'blkNum', hover: 10, ghost: 10 },
      { img: 11, say: 'temp', type: 'click', key: 'catInput' },
      { img: '11_2', say: 'temp', type: 'drag', key: 'blkTemp', hover: 12, ghost: 12 },
      { img: 14, say: 'btn', type: 'click', key: 'catInput' },
      { img: '14_2', say: 'btn', type: 'drag', key: 'blkA', hover: 15, ghost: 15, fd: 'blkA2' },
      { img: 16, say: 'toB', type: 'click', key: 'ddB' },
      { img: 17, say: 'logic', type: 'click', key: 'catLogic' },
      { img: 18, say: 'logic', type: 'drag', key: 'blkIf', hover: 19, ghost: 19 },
      { img: 20, say: 'cmp', type: 'drag', key: 'blkCmp', hover: 21, ghost: 21 },
      { img: 22, say: 'temp2', type: 'click', key: 'catInput' },
      { img: '22_2', say: 'temp2', type: 'drag', key: 'blkTemp', hover: 23, ghost: 23, fd: 'blkTemp2' },
      { img: 24, say: 'ge', type: 'click', key: 'cmpArrow' },
      { img: 25, say: 'ge', type: 'click', key: 'geOpt' },
      { img: 27, say: 'num', type: 'num', key: 'numSlot', btn: '숫자 입력하기' },
      { img: 28, say: 'led', type: 'click', key: 'catBasic' },
      { img: 29, say: 'led', type: 'drag', key: 'blkLed', hover: 30, ghost: 30 },
      { img: 31, ov: { img: 29, rect: FLY }, say: 'led', type: 'drag', key: 'blkLed', ghost: 30, ghostSrc: 30, fd: 'blkLed2' },
      { img: 36, say: 'done', type: 'click', key: 'btnA' },
      { img: 37, say: 'result', type: 'result', key: 'btnB', btn: '다음' }
    ];
    
    const HOT = {};
    Object.keys(R).forEach((k) => { HOT[k] = [0, 0, 0, 0]; });

    const mc = $('mc'), base = $('mcBase'), over = $('mcOver'), ov = $('mcOv'), ovImg = $('mcOvImg'), ghost = $('mcGhost'), hit = $('mcHit');
    const bubble = $('p08Bubble'), modal = $('p08Modal');
    const say = initGuideSay({ bubble: bubble, img: $('p08Char') });
    const btn = $('p08Btn');
    let cur = 0, drag = null, shown = '', lastDrop = 0;

    const scale = () => mc.getBoundingClientRect().width / W;
    const placeHit = (key) => {
      hit.querySelectorAll('hit-pad').forEach((p) => p.remove());
      hit.dataset.hit = key || '';
      hit.style.display = key ? '' : 'none';
      if (!key) return;
      const r = R[key];
      hit.style.cssText = 'left:' + r[0] + 'px;top:' + r[1] + 'px;width:' + r[2] + 'px;height:' + r[3] + 'px';
      BoxEdit.padEl(hit, key, HOT);
    };
    const finger = (el, key) => { if (el) pointFingerAt(el, BoxEdit.fgo(FG, key, { pulse: true })); };
    const stopFingers = () => {
      fingerDemoStop = true;
      if (fingerDemoTimer) { clearTimeout(fingerDemoTimer); fingerDemoTimer = null; }
      clearFingers();
      document.querySelectorAll('.mc-finger-drag').forEach((v) => v.remove());
    };
    const fingerMode = (f) => f.finger || (f.type === 'drag' ? 'drag' : 'click');
    const showFinger = (f) => {
      stopFingers();
      const m = fingerMode(f);
      if (m === 'drag') playFingerDrag(f.key);
      else if (m === 'click' && f.key) finger(hit, f.key);
    };

    function render(i) {
      const f = FR[i];
      stopFingers();
      drag = null;
      ghost.style.display = 'none';
      modal.classList.add('is-off');
      base.src = IMG(f.img);
      over.style.opacity = 0;
      if (f.hover) over.src = IMG(f.hover);
      ov.style.display = f.ov ? '' : 'none';
      if (f.ov) {
        ov.style.cssText = 'left:' + f.ov.rect[0] + 'px;top:' + f.ov.rect[1] + 'px;width:' + f.ov.rect[2] + 'px;height:' + f.ov.rect[3] + 'px';
        ovImg.src = IMG(f.ov.img);
        ovImg.style.left = -f.ov.rect[0] + 'px';
        ovImg.style.top = -f.ov.rect[1] + 'px';
        ovImg.style.width = W + 'px';
        ovImg.style.height = H + 'px';
      }
      const s = SAY[f.say];
      say(s[0], s[1]);
      btn.classList.toggle('p08-hide', !f.btn);
      btn.textContent = f.btn || '';
      btn.disabled = f.type === 'num';
      shown = f.type === 'result' ? 'a' : '';
      if (f.type === 'num') placeHit(f.key);
      else if (f.type === 'result') placeHit(f.key);
      else placeHit(f.key || '');
      setTimeout(() => {
        if (cur !== i) return;
        showFinger(f);
      }, 60);
    }

    function go(i) {
      cur = i;
      BoxEdit.syncStep(i + 1);
      if (i >= FR.length) {
        stopFingers();
        placeHit('');
        say('', 'wink_present');
        btn.classList.add('p08-hide');
        modal.classList.remove('is-off');
        return;
      }
      render(i);
    }

    hit.addEventListener('pointerenter', () => {
      const f = FR[cur];
      if (f && f.hover && !drag) over.style.opacity = 1;
    });

    hit.addEventListener('pointerleave', () => { over.style.opacity = 0; });
    hit.addEventListener('pointerdown', (e) => {
      const f = FR[cur];
      if (!f || f.type !== 'drag') return;

      stopFingers();

      e.preventDefault();
      hit.setPointerCapture(e.pointerId);
      const r = R[f.key], s = scale();
      drag = { x: e.clientX, y: e.clientY, l: r[0], t: r[1], s: s };
      ghost.style.cssText = 'display:block;left:' + r[0] + 'px;top:' + r[1] + 'px;width:' + r[2] + 'px;height:' + r[3] + 'px;background-image:url(' + IMG(f.ghost) + ');background-position:' + (-r[0]) + 'px ' + (-r[1]) + 'px;background-size:' + W + 'px ' + H + 'px';
      over.style.opacity = 0;
      // clearFingers();
    });
    hit.addEventListener('pointermove', (e) => {
      if (!drag) return;
      ghost.style.left = drag.l + (e.clientX - drag.x) / drag.s + 'px';
      ghost.style.top = drag.t + (e.clientY - drag.y) / drag.s + 'px';
    });
    const drop = (e) => {
      if (!drag) return;
      const rc = mc.getBoundingClientRect();
      const px = (e.clientX - rc.left) / drag.s, py = (e.clientY - rc.top) / drag.s;
      drag = null;
      lastDrop = Date.now();
      ghost.style.display = 'none';
      if (px > DROP_X && py > 64 && py < H) { playDrag(); go(cur + 1); }
      else showFinger(FR[cur]);
    };
    hit.addEventListener('pointerup', drop);
    hit.addEventListener('pointercancel', () => { if (!drag) return; drag = null; ghost.style.display = 'none'; });

    hit.addEventListener('click', () => {
      const f = FR[cur];
      if (!f || Date.now() - lastDrop < 400) return;
      if (f.type === 'click') { playClick(); go(cur + 1); }
      else if (f.type === 'num') {
        playClick();
        stopFingers();
        placeHit('');
        btn.disabled = false;
      } else if (f.type === 'result') {
        playClick();
        base.src = IMG(40);
        stopFingers();
      }
    });

    btn.addEventListener('click', () => {
      const f = FR[cur];
      if (!f) return;
      playClick();
      if (f.type === 'result') go(FR.length);
      else go(cur + 1);
    });

    let fingerDemoStop = false;
    let fingerDemoTimer = null;

    function playFingerDrag(key, width = 110){
      if (fingerDemoTimer) { clearTimeout(fingerDemoTimer); fingerDemoTimer = null; }
      fingerDemoStop = false;
      clearFingers();
      document.querySelectorAll('.mc-finger-drag').forEach(v => v.remove());

      const r = R[key];
      
      // 1. FD 객체에서 현재 key에 해당하는 값을 가져옵니다. (없으면 기본값 사용)
      const fd = FD[(FR[cur] && FR[cur].fd) || key] || { sx: 0, sy: 0, mx: 180, my: 20 };

      const fingerEl = document.createElement('img');
      fingerEl.src = '../../resources/img/common/img_finger01.png';
      fingerEl.className = 'mc-finger-drag';
      fingerEl.style.width = width + 'px';

      const main = document.querySelector('main');
      const mcRect = mc.getBoundingClientRect();
      const mainRect = main.getBoundingClientRect();
      const sm = mainRect.width / main.offsetWidth;
      const s = scale() / sm;

      // 손가락은 main(스테이지) 안에 붙으므로 화면 배율(sm)을 나눠 스테이지 좌표로 계산: sx·sy 0 이면 끌 요소 오른쪽 끝(클릭 손가락과 같은 x)의 세로 가운데
      const startLeft = (mcRect.left - mainRect.left) / sm + (r[0] + r[2] - 20 + fd.sx) * s;
      const startTop = (mcRect.top - mainRect.top) / sm + (r[1] + r[3] / 2 - 10 + fd.sy) * s;

      fingerEl.style.left = startLeft + 'px';
      fingerEl.style.top = startTop + 'px';
      main.appendChild(fingerEl);

      // 클릭 애니메이션 시퀀스 ...
      setTimeout(() => { fingerEl.src = '../../resources/img/common/img_finger02.png'; }, 250);
      setTimeout(() => { fingerEl.src = '../../resources/img/common/img_finger01.png'; }, 500);
      setTimeout(() => { fingerEl.src = '../../resources/img/common/img_finger02.png'; }, 850);
      setTimeout(() => { fingerEl.src = '../../resources/img/common/img_finger01.png'; }, 1100);

      // 이동 시뮬레이션 (FD 설정의 mx, my만큼 이동)
      setTimeout(() => {
        fingerEl.classList.add('mc-finger-move');
        fingerEl.style.left = (startLeft + fd.mx * s) + 'px';
        fingerEl.style.top = (startTop + fd.my * s) + 'px';
      }, 1600);

      // 이동 완료 후 페이드아웃
      setTimeout(() => { fingerEl.style.opacity = '0'; }, 2900);
      setTimeout(() => { fingerEl.remove(); }, 3300);

      // 반복 재생
      fingerDemoTimer = setTimeout(() => {
        if (fingerDemoStop) return;
        const f = FR[cur];
        if (f && f.type === 'drag' && f.key === key) {
          playFingerDrag(key, width);
        }
      }, 3500);
    }

    BoxEdit.stepEdit({
      key: () => (FR[cur] && (FR[cur].key || (FR[cur].btn ? 'btn' : ''))) || '',
      count: FR.length + 1,
      get: () => cur + 1,
      set: (n) => { cur = Math.max(0, Math.min(n, FR.length + 1) - 1); },
      go: (n) => { if (n < 1) return; go(n - 1); },
      label: (n) => '단계 ' + n + ' / ' + (FR.length + 1) + (n > FR.length ? ' (마무리 모달)' : ' (캡처 ' + FR[n - 1].img + ')'),
      say, bubble, img: $('p08Char'), noPose: true
    });
    go(cur);
  })();
  </script>
</body>
</html>
