<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀴즈 풀기</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        .q10-pic{position:absolute;left:110px;top:430px;height:500px;width:560px;display:flex;align-items:center;justify-content:center}
        .q10-pic img{max-width:100%;max-height:100%;object-fit:contain}
        .q10-pic.is-small{height:360px;width:360px;top:480px;left:170px}
        .q10-pic.is-small img{width:260px}
        .q10-split.quiz-opts{left:740px;width:1070px}
        .q10-split.quiz-opts.is-grid{top:430px;grid-template-columns:repeat(2,510px);gap:24px 50px}
        .q10-split.quiz-opts.is-grid .card-btn{font-size:46px;height:120px}
        .q10-split.quiz-opts.is-list{top:470px}
        .q10-split.quiz-opts.is-list .card-btn{width:1000px}
        .q10-shapes.quiz-graphs.is-4{left:740px;width:1070px;top:450px;grid-template-columns:repeat(3,1fr);gap:30px}
        .q10-shapes .quiz-graph{height:400px;font-size:54px;text-align:center;padding-bottom:24px}
        .q10-shapes .quiz-graph span{display:flex;align-items:center;justify-content:center;padding:20px}
        .q10-shapes .quiz-graph img{width:150px;height:auto;display:block}
        .q10-label{position:absolute;margin:0;font-family:'Cafe24 Ssurround';font-size:44px;color:var(--c-purple);letter-spacing:-0.04em}
        .q10-photos{position:absolute;top:490px;display:flex;gap:20px}
        .q10-photos img{width:260px;height:256px;object-fit:contain;display:block}
        .q10-q5.quiz-opts.is-row{top:775px;flex-wrap:nowrap;gap:30px}
        .q10-q5.quiz-opts.is-row .card-btn{width:580px;height:120px;font-size:42px;line-height:1.1;display:flex;align-items:center;justify-content:center;padding:6px 20px 0}
        .q10-flow.quiz-flow{top:430px}
        .q10-slot{position:relative;width:360px}
        .q10-slot:not(:has(.quiz-card))::after{content:'?'}
        .q10-no{position:absolute;left:-18px;top:-26px;width:56px;height:56px;line-height:60px;border-radius:50%;background:var(--c-violet);color:var(--c-white);font-style:normal;font-size:36px;text-align:center}
        .q10-cards.quiz-cards{top:690px;gap:80px}
        .q10-cards .quiz-card.multi-option{width:400px;height:200px;flex-direction:column;gap:4px;font-size:50px}
        .q10-cards .quiz-card img{height:100px;width:auto;display:block}
        .quiz-blank .quiz-card img{display:none}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="quiz-stage">
          <div class="step-flow">

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../resources/img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q1.</span>
                  <p class="quiz-ask">사이다의 특징을 3가지 골라 보세요.</p>
                </div>
              </div>
              <div class="q10-pic"><img src="img/p10_cider.png" alt=""></div>
              <div class="answer-pick-quiz quiz-opts is-grid q10-split">
                <button class="answer-pick card-btn is-quiz" data-correct="true">색이 없어요</button>
                <button class="answer-pick card-btn is-quiz" data-correct="false">하얀색이에요</button>
                <button class="answer-pick card-btn is-quiz" data-correct="true">투명해요</button>
                <button class="answer-pick card-btn is-quiz" data-correct="false">투명하지 않아요</button>
                <button class="answer-pick card-btn is-quiz" data-correct="true">공기방울이 있어요</button>
                <button class="answer-pick card-btn is-quiz" data-correct="false">주황색이에요</button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../resources/img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q2.</span>
                  <p class="quiz-ask is-tight">사진을 보는 AI가 해바라기와 국화를 구별하려면 어떤 특징을 봐야 할까요?</p>
                </div>
              </div>
              <div class="q10-pic"><img src="img/p10_flowers.png" alt=""></div>
              <div class="answer-pick-quiz quiz-opts is-list q10-split">
                <button class="answer-pick card-btn is-quiz" data-correct="false">노란 꽃잎</button>
                <button class="answer-pick card-btn is-quiz" data-correct="true">가운데 모양</button>
                <button class="answer-pick card-btn is-quiz" data-correct="false">꽃병 색깔</button>
              </div>
            </div>

            <div class="step-panel" id="p10Q3">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../resources/img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q3.</span>
                  <p class="quiz-ask">AI가 무엇인지 알아내는 순서대로 카드를 놓아 보세요.</p>
                </div>
              </div>
              <div class="quiz-flow q10-flow">
                <div class="quiz-slot quiz-blank q10-slot drop-zone" data-key="study"><i class="q10-no">1</i></div>
                <div class="quiz-slot quiz-blank q10-slot drop-zone" data-key="look"><i class="q10-no">2</i></div>
                <div class="quiz-slot quiz-blank q10-slot drop-zone" data-key="answer"><i class="q10-no">3</i></div>
              </div>
              <div class="quiz-cards q10-cards">
                <div class="multi-option quiz-card" data-key="look"><img src="img/p10_card_look.png" alt="">알아보기</div>
                <div class="multi-option quiz-card" data-key="answer"><img src="img/p10_card_answer.png" alt="">정답 찾기</div>
                <div class="multi-option quiz-card" data-key="study"><img src="img/p10_card_study.png" alt="">공부하기</div>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../resources/img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q4.</span>
                  <p class="quiz-ask is-tight">퀵 드로우 AI가 사과라고 알아보려면 무엇을 더 그려야 할까요?</p>
                </div>
              </div>
              <div class="q10-pic is-small"><img src="img/p10_circle.png" alt=""></div>
              <div class="answer-pick-quiz quiz-graphs is-4 q10-shapes">
                <button class="answer-pick quiz-graph" data-correct="true"><span><img src="img/p10_stem.png" alt=""></span>짧은 꼭지</button>
                <button class="answer-pick quiz-graph" data-correct="false"><span><img src="img/p10_hands.png" alt=""></span>시곗바늘</button>
                <button class="answer-pick quiz-graph" data-correct="false"><span><img src="img/p10_wheel.png" alt=""></span>바퀴</button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../resources/img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q5.</span>
                  <p class="quiz-ask is-tight">물, 우유, 오렌지 주스를 공부한 AI에게 투명한 식초 사진을 보여 주면 어떻게 답할까요?</p>
                </div>
              </div>
              <p class="q10-label" style="left:110px;top:425px">AI가 공부한 사진</p>
              <div class="q10-photos" style="left:80px">
                <img src="img/p10_water.png" alt="">
                <img src="img/p10_milk.png" alt="">
                <img src="img/p10_oj.png" alt="">
              </div>
              <p class="q10-label" style="left:1230px;top:425px">새로운 사진</p>
              <div class="q10-photos" style="left:1200px"><img src="img/p10_vinegar.png" alt=""></div>
              <div class="answer-pick-quiz quiz-opts is-row q10-q5" data-next="page11.html">
                <button class="answer-pick card-btn is-quiz" data-correct="false">식초라고 바르게 답한다</button>
                <button class="answer-pick card-btn is-quiz" data-correct="true">물이라고 답할 수 있다</button>
                <button class="answer-pick card-btn is-quiz" data-correct="false">냄새를 맡고 식초라고 답한다</button>
              </div>
            </div>

          </div>

          <div class="ox-result-correct is-avatar is-off" data-sound="sound/correct.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_correct_gwa.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">정답이에요!</p>
              </div>
              <div class="avatar-popup-extra"><img src="../../resources/img/common/icon_correct.png" alt=""></div>
            </div>
          </div>
          <div class="ox-result-wrong is-avatar is-off" data-sound="sound/incorrect.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">다시 한번 생각해볼까요?</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="퀴즈 풀기" data-next="page11.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  (function () {
    const rightLayer = document.querySelector('.ox-result-correct');
    const wrongLayer = document.querySelector('.ox-result-wrong');
    const zones = Array.from(document.querySelectorAll('#p10Q3 .q10-slot'));

    initMatchDrag({
      cards: Array.from(document.querySelectorAll('#p10Q3 .quiz-card')),
      zones: zones,
      onDone: () => {
        playCorrect();
        flashLayer(rightLayer);
        setTimeout(() => advancePanelOrNavigate(zones[0], null), 2000);
      },
      onWrong: (card, zone) => {
        if (!zone) return;
        playWrong();
        card.classList.remove('is-wrong');
        void card.offsetWidth;
        card.classList.add('is-wrong');
        flashLayer(wrongLayer);
      }
    });
  })();
  </script>
</body>
</html>
