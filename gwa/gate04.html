<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4단원</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        /* 임시 - 단원 이름·디자인 미확정. 차시 칸 이름은 그 차시 첫 활동 제목(차시 이름 나오면 교체). 실제 이미지 나오면 sa/gate02처럼 배경 이미지 + 좌표 방식으로 교체 */
        main{position:absolute;left:0;top:120px;width:1920px;height:960px;background:#dbe9f7}
        .gate-lessons{position:absolute;left:0;top:270px;width:100%;display:flex;justify-content:center;gap:40px}
        .gate-lesson{width:420px;height:420px;border-radius:20px;background:#4a90d9;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px;box-sizing:border-box;cursor:pointer;word-break:keep-all}
        .gate-lesson:hover{background:#3a7bc0}
        .gate-lesson .num{font-size:34px;font-weight:bold;margin-bottom:20px}
        .gate-lesson .name{font-size:32px;font-weight:bold;line-height:1.4}
        .gate-lesson.disabled{background:#b9b9b9;cursor:default;pointer-events:none}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer"><div id="stage" class="stage">
      <main>
        <div class="gate-lessons">
          <div class="gate-lesson disabled">
            <div class="num">10차시</div>
            <div class="name">준비 중</div>
          </div>
          <div class="gate-lesson disabled">
            <div class="num">11차시</div>
            <div class="name">준비 중</div>
          </div>
          <div class="gate-lesson disabled">
            <div class="num">12차시</div>
            <div class="name">준비 중</div>
          </div>
        </div>
      </main>

    </div></div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../js/header.js" data-title="4단원"></script>
  <script src="../js/toc-gwa.js"></script>
  <script src="../js/common.js"></script>
</body>
</html>
