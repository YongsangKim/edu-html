            <p class="p-how-lead">피가 우리 몸속에서 어떤 길을 따라 도는지 알아봐요. 안내를 잘 듣고, 심장과 혈관 조각 퍼즐을 알맞은 위치에 놓아주세요.</p>

                <li>3. [계속 반복하기] 버튼을 눌러 주세요.</li>
                <li>4. 피가 온몸을 돈 후 심장으로 되돌아오는 모습을 살펴보세요.</li>
