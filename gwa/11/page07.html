<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생활 속 조건 찾기</title>
<link rel="stylesheet" href="../../resources/css/common.css">
<style>
.p07-panel{position:absolute;left:60px;top:180px;width:1800px;height:740px;box-sizing:border-box;border-radius:30px;background:#266cc8}
.p07-ill{position:absolute;left:40px;top:40px;width:600px;height:400px;box-sizing:border-box;border-radius:24px;background:var(--c-white);display:flex;align-items:center;justify-content:center}
.p07-ill-img{max-width:540px;max-height:360px;object-fit:contain;border-radius:16px;pointer-events:none;user-select:none}
/* .photo-card .p07-modal-img{width:616px;height:462px;object-fit:cover;background:none} */
.p07-sent{position:absolute;left:680px;top:40px;width:1080px;height:400px;box-sizing:border-box;border-radius:24px;background:var(--c-white);display:flex;justify-content:center;gap:40px;align-items:flex-start;padding:76px 0 0}
.p07-col{position:relative;flex:0 0 auto;white-space:nowrap;font-family:'Cafe24 Ssurround';font-size:64px;line-height:1;color:var(--c-ink);letter-spacing:-0.04em}
.p07-row{height:130px;display:flex;align-items:center;gap:20px}
.p07-sub{position:relative;height:100px;display:flex;align-items:center;padding-left:90px;margin-top:20px;color:var(--c-purple)}
.p07-sub:before{content:'';position:absolute;left:22px;top:-40px;width:50px;height:90px;box-sizing:border-box;border-left:6px solid var(--c-ink);border-bottom:6px solid var(--c-ink);border-bottom-left-radius:22px}
.dc-slot.p07-blank{width:320px;height:110px;flex:0 0 auto}
.p07-cards{position:absolute;left:40px;right:40px;top:480px;height:220px;display:flex;justify-content:space-between;align-items:center}
.p07-hold{width:540px;height:220px;display:flex;align-items:center;justify-content:center}
.dc-card.p07-card{width:540px;height:220px;gap:18px;font-size:56px;padding:8px 16px 0}
.p07-card-ico{width:90px;height:90px;object-fit:contain;flex:0 0 auto;pointer-events:none;user-select:none}
.p07-card span{white-space:nowrap}
.p07-hold.dc-slot.is-lg{width:540px;height:220px}
.p07-hide{display:none!important}
.dc-card.p07-mini{width:320px;height:110px}
</style>
</head>
<body>
<div id="page-fade"></div>
<div id="viewport" class="viewport">
  <div id="stage-spacer">
    <div id="stage" class="stage">
      <main class="bg-default">
        <p class="ask-pill is-fit"><span id="p07Ask"></span></p>

        <div class="p07-panel">
          <div class="p07-ill" id="p07Ill"></div>
          <div class="p07-sent">
            <div class="p07-col"><div class="p07-row"><span>만약</span><div class="dc-slot is-sm drop-zone p07-blank" id="p07Blank"></div></div><div class="p07-sub" id="p07Then"></div></div>
            <div class="p07-col"><div class="p07-row"><span>아니면</span></div><div class="p07-sub" id="p07Else"></div></div>
          </div>
          <div class="p07-cards" id="p07Cards"></div>
        </div>

        <div class="ox-result-wrong is-avatar is-off" id="p07Wrong">
          <div class="avatar-popup-panel">
            <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
            <div class="avatar-popup-body">
              <p class="avatar-popup-text">다시 한번 생각해볼까요?</p>
            </div>
          </div>
        </div>

        <div class="photo-modal is-off" id="p07Right">
          <div class="photo-card">
            <img class="photo-card-img p07-modal-img" id="p07RightImg" src="" alt="">
            <p class="photo-card-title">정답이에요!</p>
            <p class="photo-card-text" id="p07RightText"></p>
          </div>
          <button type="button" class="card-btn is-popup js-sfx" id="p07RightBtn" data-sound="sound/click.mp3">다음</button>
        </div>

        <div class="avatar-modal is-off" id="p07Fin">
          <div class="avatar-card">
            <img class="avatar-card-avatar" src="../../resources/img/common/avatar_finish.png" alt="">
            <div class="avatar-card-body"><p class="avatar-card-text" id="p07FinText"></p></div>
            <a class="avatar-card-btn card-btn is-popup js-sfx" id="p07FinBtn" data-sound="sound/click.mp3">다음</a>
            <a href="page08.html" class="avatar-card-btn card-btn is-popup js-nav-effect js-sfx p07-hide" id="p07FinGo" data-sound="sound/click.mp3">다음</a>
          </div>
        </div>
      </main>
    </div>
  </div>
</div>
<div class="zoom-info" id="zoomInfo"></div>

<script src="../../resources/js/header.js" data-title="생활 속 조건 찾기" data-next="page08.html"></script>
<script src="../../resources/js/toc-gwa.js"></script>
<script src="../../resources/js/common.js"></script>
<script>
(function () {
  const QUIZ = [
    {
      ask: '자동문이 열리는 조건을 골라 빈칸에 넣어보세요.',
      ill: 'img/p07_door_close.png', illDone: 'img/p07_door_open.png', then: '문 열기', other: '문 닫아두기',
      cards: [
        { icon: 'img/p07_walk.png', text: '사람이 다가오면', cls: 'is-yellow', ok: true },
        { icon: 'img/p07_rain.png', text: '비가 오면', cls: 'is-blue' },
        { icon: 'img/p07_moon.png', text: '밤이 되면', cls: 'is-purple' },
      ],
      right: '자동문은 사람을 인식해서 문을 열고, 사람이 인식되지 않으면 닫혀 있어요.',
    },
    {
      ask: 'AI 스피커가 반응하는 조건을 골라 빈칸에 넣어보세요.',
      ill: 'img/p07_speaker_off.png', illDone: 'img/p07_speaker_on.png', then: '대답하기', other: '조용히 기다리기',
      cards: [
        { icon: 'img/p07_light.png', text: '불이 켜지면', cls: 'is-yellow' },
        { icon: 'img/p07_speak.png', text: '이름을 부르면', cls: 'is-blue', ok: true },
        { icon: 'img/p07_door.png', text: '문이 열리면', cls: 'is-purple' },
      ],
      right: 'AI 스피커는 이름이 들리면 반응하고 이름을 부르지 않으면 반응하지 않아요.',
    },
  ];
  const FIN = [
    '자동문과 AI 스피커는 조건에 따라 다르게 작동해요.',
    '‘만약 ~ 라면, 아니면’으로 언제, 어떻게 작동되는지 표현할 수 있어요.',
    '콩팥에서 물질이 걸러지는 과정을 엔트리로 직접 표현해볼까요?',
  ];
  let qi = 0;
  let finStep = 0;

  const wrongLayer = $('p07Wrong');
  const blank = $('p07Blank');

  function showBig(card) {
    card.className = 'dc-card is-lg p07-card ' + card.dataset.cls;
    card.innerHTML = '<img class="p07-card-ico" src="' + card.dataset.icon + '" alt=""><span>' + card.dataset.text + '</span>';
    card.style.left = '';
    card.style.top = '';
  }

  function showMini(card, e) {
    card.className = 'dc-card is-sm p07-mini ' + card.dataset.cls;
    card.textContent = card.dataset.text;
    card.style.left = '';
    card.style.top = '';
    const s = $('stage').getBoundingClientRect().width / 1920;
    const r = card.getBoundingClientRect();
    card.style.left = (e.clientX - (r.left + r.width / 2)) / s + 'px';
    card.style.top = (e.clientY - (r.top + r.height / 2)) / s + 'px';
  }

  function render() {
    const q = QUIZ[qi];
    $('p07Ask').textContent = q.ask;
    const ill = $('p07Ill');
    ill.innerHTML = '<img class="p07-ill-img" src="' + q.ill + '" alt="">';
    new Image().src = q.illDone;
    $('p07Then').textContent = q.then;
    $('p07Else').textContent = q.other;
    blank.innerHTML = '';
    delete blank.dataset.filled;
    blank.classList.remove('is-over');
    const wrap = $('p07Cards');
    wrap.innerHTML = '';
    q.cards.forEach((c) => {
      const hold = document.createElement('div');
      hold.className = 'p07-hold';
      const card = document.createElement('div');
      card.className = 'dc-card is-lg p07-card ' + c.cls;
      card.dataset.ok = c.ok ? '1' : '';
      card.dataset.cls = c.cls;
      card.dataset.text = c.text;
      card.dataset.icon = c.icon;
      card.innerHTML = '<img class="p07-card-ico" src="' + c.icon + '" alt=""><span>' + c.text + '</span>';
      hold.appendChild(card);
      wrap.appendChild(hold);
      card.addEventListener('pointerdown', (e) => {
        if (card.dataset.placed) return;
        showMini(card, e);
      });
    });
    initMatchDrag({
      cards: Array.from(wrap.querySelectorAll('.dc-card')),
      zones: [blank],
      silent: true,
      match: (card) => !!card.dataset.ok,
      onRight: (card) => {
        card.className = 'dc-card is-sm ' + card.dataset.cls;
        card.textContent = card.dataset.text;
        card.style.left = '';
        card.style.top = '';
        card.parentNode.classList.add('dc-slot', 'is-lg');
        card.style.cursor = 'default';
        const ill = $('p07Ill');
        ill.innerHTML = '<img class="p07-ill-img" src="' + q.illDone + '" alt="">';
        $('p07RightImg').src = q.illDone;
        $('p07RightBtn').classList.remove('is-pressed');
        playCorrect();
        $('p07RightText').innerHTML = q.right;
        $('p07Right').classList.remove('is-off');
      },
      onWrong: (card, zone) => {
        showBig(card);
        if (!zone) return;
        playWrong();
        flashLayer(wrongLayer, 'is-off', 2000);
      },
    });
  }

  $('p07RightBtn').addEventListener('click', () => {
    $('p07Right').classList.add('is-off');
    if (qi < QUIZ.length - 1) {
      qi += 1;
      render();
    } else {
      $('p07FinText').innerHTML = FIN[0];
      $('p07Fin').classList.remove('is-off');
    }
  });

  $('p07FinBtn').addEventListener('click', () => {
    finStep += 1;
    $('p07FinText').innerHTML = FIN[finStep];
    if (finStep === FIN.length - 1) {
      $('p07FinBtn').classList.add('p07-hide');
      $('p07FinGo').classList.remove('p07-hide');
    }
  });

  render();
})();
</script>
</body>
</html>
