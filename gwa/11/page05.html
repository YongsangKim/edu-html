<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조건을 바꾸면 결과가 달라져요</title>
<link rel="stylesheet" href="../../resources/css/common.css">
<style>
  .p05-left-frame{position:absolute;left:20px;top:182px;width:1023px;height:751px;box-sizing:border-box;border:solid 5px var(--c-ink);border-radius:30px;background:#fff}
  .p05-code{position:absolute;box-sizing:border-box;border-radius:22px;background:#083b84;left:42px;top:205px;width:980px;height:435px;padding:0 60px;display:flex;flex-direction:column;justify-content:center;border:solid 5px var(--c-ink)}
  .p05-g{position:relative}
  .p05-g svg{position:absolute;overflow:visible}
  .p05-ln{display:flex;align-items:center;height:76px;margin:0 0 6px;font-family:"Cafe24 Ssurround";font-size:64px;color:#fff;letter-spacing:-0.04em;white-space:nowrap}
  .p05-ln.is-in{padding-left:150px}
  .p05-ln.is-hd{height:104px}
  .p05-blank{position:relative;box-sizing:border-box;width:316px;height:96px;margin:0 20px;border-radius:18px;background:#d6d6d6;border:solid 5px #bdbdbd;display:flex;align-items:center;justify-content:center;gap:4px}
  .p05-blank.is-filled{border:solid 4px #fff;color:var(--c-ink)}
  .p05-blank.is-filled::after{content:'';position:absolute;inset:5px;border:dashed 3px rgba(255,255,255,.85);border-radius:12px;pointer-events:none}
  .p05-blank.is-blue{background:#2882f6}
  .p05-blank.is-yellow{background:#ffd329;color:var(--c-ink)}
  .p05-blank.is-red{background:#ff4d58}
  .p05-blank.is-yellow::after{border-color:rgba(255,255,255,.9)}
  .p05-cards{position:absolute;left:47px;top:674px;width:968px;display:flex;justify-content:space-between}
  .p05-cards .dc-card{position:relative;width:308px;height:96px;padding:0;gap:4px;font-size:54px;border:solid 4px #fff;border-radius:18px;letter-spacing:-0.04em;box-shadow:0 8px 0 rgba(13,16,77,.2);touch-action:none}
  .p05-cards .dc-card::after{content:'';position:absolute;inset:5px;border:dashed 3px rgba(255,255,255,.85);border-radius:12px;pointer-events:none}
  .p05-cards .dc-card.is-blue{background:#2882f6;color:var(--c-ink)}
  .p05-cards .dc-card.is-yellow{background:#ffd329;color:var(--c-ink)}
  .p05-cards .dc-card.is-red{background:#ff4d58;color:var(--c-ink)}
  .p05-cards .dc-card.is-used{opacity:.45}
  .p05-ico{width:74px;height:74px;margin-top:3px;object-fit:contain;pointer-events:none;flex:none}
  .p05-res{position:absolute;box-sizing:border-box;border:solid 5px #266cc8;border-radius:30px;left:1060px;top:182px;width:800px;height:588px;background:#dff6ff}
  .p05-bk{position:absolute;top:76px;width:354px;height:242px;box-sizing:border-box;background:url('img/p05_basket.png') center/100% 100% no-repeat;display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;align-content:center;padding:34px 16px 16px}
  .p05-bn{position:absolute;top:-28px;left:50%;transform:translateX(-50%);height:54px;padding:0 24px;border-radius:14px;background:#31248a;color:#fff;border:solid 3px #4e97ff;box-shadow:0 4px 10px rgba(13,16,77,.2);display:flex;align-items:center;justify-content:center;font-family:"Cafe24 Ssurround";font-size:34px;white-space:nowrap;box-sizing:border-box}
  .p05-ball{position:relative;width:122px;height:122px;flex:none;background:center/contain no-repeat;transition:transform .65s cubic-bezier(.22,1,.36,1)}
  .p05-ball.is-b{background-image:url('img/p05_ball_b.png')}
  .p05-ball.is-y{background-image:url('img/p05_ball_y.png')}
  .p05-ball.is-r{background-image:url('img/p05_ball_r.png')}
  .p05-pool{position:absolute;left:0;right:0;top:334px;height:122px;display:flex;justify-content:center;align-items:center;gap:14px}
  .p05-rt{position:absolute;left:30px;right:30px;top:450px;height:110px;margin:0;display:flex;align-items:center;justify-content:center;text-align:center;font-family:"Cafe24 Ssurround";font-size:44px;line-height:1.25;color:var(--c-ink);letter-spacing:-0.04em;word-break:keep-all}
  .p05-next.is-dim{opacity:.4;filter:grayscale(.6);pointer-events:none}
  .p05-hide{display:none!important}
</style>
</head>
<body>
<div id="page-fade"></div>
<div id="viewport" class="viewport">
  <div id="stage-spacer">
    <div id="stage" class="stage">
      <main class="bg-default">
        <p class="ask-pill is-fit"><span>색깔을 골라 조건을 완성해 보세요.</span></p>

        <div class="p05-left-frame"></div>
        <div class="p05-code">
          <div class="p05-g">
            <p class="p05-ln is-hd">만약<span class="p05-blank drop-zone" id="p05Blank"></span>(이)라면</p>
            <svg style="left:36px;top:98px" width="100" height="60" viewBox="0 0 100 60"><path d="M3 3V40Q3 52 15 52H94" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <p class="p05-ln is-in">1번 바구니로</p>
          </div>
          <div class="p05-g">
            <p class="p05-ln">아니면</p>
            <svg style="left:36px;top:82px" width="100" height="50" viewBox="0 0 100 50"><path d="M3 3V28Q3 40 15 40H94" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <p class="p05-ln is-in">2번 바구니로</p>
          </div>
        </div>

        <div class="p05-cards" id="p05Cards">
          <div class="dc-card is-blue" data-color="b"><img class="p05-ico" src="img/p05_ball_b.png" alt="">파란색</div>
          <div class="dc-card is-yellow" data-color="y"><img class="p05-ico" src="img/p05_ball_y.png" alt="">노란색</div>
          <div class="dc-card is-red" data-color="r"><img class="p05-ico" src="img/p05_ball_r.png" alt="">빨간색</div>
        </div>

        <div class="p05-res">
          <div class="p05-bk" style="left:36px"><span class="p05-bn">1번 바구니</span><span id="p05B1" style="display:contents"></span></div>
          <div class="p05-bk" style="left:410px"><span class="p05-bn">2번 바구니</span><span id="p05B2" style="display:contents"></span></div>
          <div class="p05-pool" id="p05Pool"><i class="p05-ball is-b"></i><i class="p05-ball is-y"></i><i class="p05-ball is-r"></i></div>
          <p class="p05-rt" id="p05Text"></p>
        </div>

        <a class="next-btn-activity">
          <span class="p05-next next-btn card-btn is-start is-dim js-sfx" id="p05Next" data-sound="sound/click.mp3">다음</span>
        </a>

        <div class="avatar-modal is-off" id="p05Fin">
          <div class="avatar-card">
            <img class="avatar-card-avatar" src="../../resources/img/common/avatar_finish.png" alt="">
            <div class="avatar-card-body"><p class="avatar-card-text" id="p05FinText"></p></div>
            <a class="avatar-card-btn card-btn is-popup js-sfx" id="p05FinBtn" data-sound="sound/click.mp3">다음</a>
            <a href="page06.html" class="avatar-card-btn card-btn is-popup js-nav-effect js-sfx p05-hide" id="p05FinGo" data-sound="sound/click.mp3">다음</a>
          </div>
        </div>
      </main>
    </div>
  </div>
</div>
<div class="zoom-info" id="zoomInfo"></div>

<script src="../../resources/js/header.js" data-title="조건을 바꾸면 결과가 달라져요" data-next="page06.html"></script>
<script src="../../resources/js/toc-gwa.js"></script>
<script src="../../resources/js/common.js"></script>
<script>
(function () {
  const COLORS = {
    b: { name: '파란', label: '파란색', cls: 'is-blue' },
    y: { name: '노란', label: '노란색', cls: 'is-yellow' },
    r: { name: '빨간', label: '빨간색', cls: 'is-red' },
  };
  const FIN = [
    '조건을 바꾸면서 달라지는 결과를 모두 확인했어요.',
    '우리 생활 속 기계들도 조건에 따라 작동해요. 어떤 조건에서 작동하는지 알아볼까요?',
  ];
  const blank = $('p05Blank');
  const cards = Array.from(document.querySelectorAll('#p05Cards .dc-card'));
  const next = $('p05Next');
  const seen = new Set();
  let finStep = 0;
  let timers = [];

  const balls = (keys, hidden) => keys.map((k) => '<i class="p05-ball is-' + k + '" data-ball="' + k + '"' + (hidden ? ' style="opacity:0"' : '') + '></i>').join('');

  function place(key) {
    timers.forEach(clearTimeout);
    timers = [];
    const c = COLORS[key];
    blank.className = 'p05-blank drop-zone is-filled ' + c.cls;
    blank.innerHTML = '<img class="p05-ico" src="img/p05_ball_' + key + '.png" alt="">' + c.label;
    cards.forEach((card) => card.classList.toggle('is-used', card.dataset.color === key));

    const pool = $('p05Pool');
    const b1 = $('p05B1');
    const b2 = $('p05B2');
    const txt = $('p05Text');
    pool.innerHTML = balls(['b', 'y', 'r'], false);
    b1.innerHTML = balls([key], true);
    b2.innerHTML = balls(['b', 'y', 'r'].filter((k) => k !== key), true);
    txt.innerHTML = '';

    const s = scale();
    const order = [key, ...['b', 'y', 'r'].filter((k) => k !== key)];
    order.forEach((k, i) => {
      const t1 = setTimeout(() => {
        const src = pool.querySelector('[data-ball="' + k + '"]');
        const dst = (k === key ? b1 : b2).querySelector('[data-ball="' + k + '"]');
        if (!src || !dst) return;
        const sr = src.getBoundingClientRect();
        const dr = dst.getBoundingClientRect();
        src.style.zIndex = '10';
        src.style.transform = 'translate(' + (dr.left - sr.left) / s + 'px,' + (dr.top - sr.top) / s + 'px)';
        const t2 = setTimeout(() => {
          dst.style.opacity = '1';
          src.style.visibility = 'hidden';
        }, 650);
        timers.push(t2);
      }, 300 + i * 700);
      timers.push(t1);
    });

    const tDone = setTimeout(() => {
      txt.innerHTML = c.name + ' 공은 1번 바구니에,<br>나머지 공들은 2번 바구니에 담겼어요.';
      seen.add(key);
      if (seen.size === 3) next.classList.remove('is-dim');
    }, 300 + (order.length - 1) * 700 + 700);
    timers.push(tDone);
  }

  const scale = () => currentScale;
  const over = (x, y) => {
    const r = blank.getBoundingClientRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  };

  cards.forEach((card) => {
    card.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      playClick();
      const s = scale();
      const sx = e.clientX;
      const sy = e.clientY;
      card.setPointerCapture(e.pointerId);
      card.classList.add('is-dragging');
      const move = (ev) => {
        card.style.transform = 'translate(' + (ev.clientX - sx) / s + 'px,' + (ev.clientY - sy) / s + 'px)';
        blank.classList.toggle('is-over', over(ev.clientX, ev.clientY));
      };
      const up = (ev) => {
        card.removeEventListener('pointermove', move);
        card.removeEventListener('pointerup', up);
        card.removeEventListener('pointercancel', up);
        card.classList.remove('is-dragging');
        card.style.transform = '';
        blank.classList.remove('is-over');
        if (over(ev.clientX, ev.clientY)) {
          playDrag();
          place(card.dataset.color);
        }
      };
      card.addEventListener('pointermove', move);
      card.addEventListener('pointerup', up);
      card.addEventListener('pointercancel', up);
    });
  });

  next.addEventListener('click', () => {
    if (next.classList.contains('is-dim')) return;
    $('p05FinText').innerHTML = FIN[0];
    $('p05Fin').classList.remove('is-off');
  });
  $('p05FinBtn').addEventListener('click', () => {
    finStep += 1;
    $('p05FinText').innerHTML = FIN[finStep];
    if (finStep === FIN.length - 1) {
      $('p05FinBtn').classList.add('p05-hide');
      $('p05FinGo').classList.remove('p05-hide');
    }
  });
})();
</script>
</body>
</html>
