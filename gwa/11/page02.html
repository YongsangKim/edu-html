<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>콩팥 필터를 부탁해~</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        .p02-lab-wrap{position:absolute;left:41px;top:210px;width:1838px;height:736px;z-index:1}
        .p02-blood-zone{position:absolute;left:0;top:0;width:1838px;height:444px;box-sizing:border-box;background:#a33726 url('img/p02_blud_zone.png') center / 100% 100% no-repeat;border:5px solid #233567;border-bottom:none;border-radius:60px 60px 0 0;overflow:hidden}
        .p02-bg-cells{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:0.72}
        .p02-cell{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 35%, rgba(255, 150, 175, 0.35) 0%, rgba(165, 10, 42, 0.5) 60%, rgba(85, 2, 20, 0.65) 100%);box-shadow:inset 0 4px 10px rgba(255, 180, 200, 0.25);filter:blur(1px)}
        .p02-cell.c1{left:80px;top:70px;width:110px;height:65px;transform:rotate(-18deg)}
        .p02-cell.c2{left:340px;top:220px;width:130px;height:75px;transform:rotate(24deg)}
        .p02-cell.c3{left:620px;top:60px;width:95px;height:55px;transform:rotate(-8deg)}
        .p02-cell.c4{left:910px;top:210px;width:125px;height:70px;transform:rotate(15deg)}
        .p02-cell.c5{left:1180px;top:90px;width:140px;height:80px;transform:rotate(-25deg)}
        .p02-cell.c6{left:1350px;top:250px;width:100px;height:60px;transform:rotate(12deg)}
        .p02-filter-bar{position:absolute;left:0;top:440px;width:1838px;height:68px;box-sizing:border-box;background:#2b0c15;border-left:5px solid #233567;border-right:5px solid #233567;z-index:3;overflow:visible}
        .p02-mem-wing{position:absolute;top:0;height:68px;box-sizing:border-box;background:linear-gradient(180deg, #ffa89b 0%, #f37d6a 50%, #d85743 100%);border-top:5px solid #233567;border-bottom:5px solid #233567;box-shadow:inset 0 4px 6px rgba(255, 255, 255, 0.7), inset 0 -4px 6px rgba(120, 25, 15, 0.4);z-index:4;pointer-events:none;overflow:hidden}
        .p02-mem-wing.is-l{left:0;border-left:none;border-right:4px solid #233567;border-radius:0 34px 34px 0}
        .p02-mem-wing.is-r{right:0;border-right:none;border-left:4px solid #233567;border-radius:34px 0 0 34px}
        .p02-filter-pores{position:absolute;inset:0;background-image:radial-gradient(ellipse 9px 5px at center, rgba(140, 25, 15, 0.4) 100%, transparent 100%);background-size:34px 22px;background-repeat:repeat-x;background-position:center;opacity:0.7;pointer-events:none}
        .p02-hole{position:absolute;top:440px;width:140px;height:68px;transform:translateX(-50%);box-sizing:border-box;border-radius:34px;border:4px solid #00f0ff;background:radial-gradient(ellipse at center, rgba(0, 240, 255, 0.15) 0%, rgba(20, 8, 14, 0.95) 75%);box-shadow:0 0 18px #00f0ff, 0 0 32px rgba(0, 240, 255, 0.6), inset 0 0 14px rgba(0, 240, 255, 0.85);z-index:6;pointer-events:none}
        .p02-hole-arrow{position:absolute;top:50%;transform:translateY(-50%);font-size:26px;line-height:1;color:#00f0ff;text-shadow:0 0 10px #00f0ff;animation:p02PulseArrow 1.2s ease-in-out infinite alternate}
        .p02-hole-arrow.is-l{left:-32px}
        .p02-hole-arrow.is-r{right:-32px}
        @keyframes p02PulseArrow{
          from{transform:translateY(-50%) scale(0.9);opacity:0.7}
          to{transform:translateY(-50%) scale(1.15);opacity:1}
        }
        .p02-hole-stream{position:absolute;left:50%;top:64px;transform:translateX(-50%);width:124px;height:160px;background:linear-gradient(180deg, rgba(0, 240, 255, 0.45) 0%, rgba(255, 255, 255, 0.25) 30%, rgba(255, 255, 255, 0) 100%);clip-path:polygon(18% 0%, 82% 0%, 100% 100%, 0% 100%);pointer-events:none;filter:blur(1.5px);opacity:0.85;animation:p02StreamShimmer 1.8s ease-in-out infinite alternate}
        @keyframes p02StreamShimmer{
          from{opacity:0.6;height:140px}
          to{opacity:0.95;height:175px}
        }
        .p02-urine-zone{position:absolute;left:0;top:508px;width:1838px;height:212px;box-sizing:border-box;background:#fff4b2;border:5px solid #233567;border-top:none;border-radius:0 0 36px 36px;overflow:hidden}
        .p02-urine-zone::after{content:'';position:absolute;inset:0;border-radius:0 0 31px 31px;border:10px solid rgba(255, 224, 110, 0.72);border-top:none;box-shadow:inset 0 6px 6px rgba(255, 255, 255, 0.75), inset 0 -10px 16px rgba(215, 145, 0, 0.45);pointer-events:none;z-index:3}
        .p02-urine-wave{position:absolute;inset:0;background:url('img/p02_urine_wave.png') 0 0 / 3554px 100% repeat-x;animation:p02WaveMove 60s linear infinite;pointer-events:none}
        @keyframes p02WaveMove{
          from{background-position-x:0}
          to{background-position-x:-3554px}
        }
        .p02-bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 28%, #ffffff 0%, rgba(255, 248, 195, 0.65) 45%, rgba(255, 200, 30, 0.72) 100%);border:2px solid rgba(255, 255, 255, 0.92);box-shadow:0 0 12px rgba(255, 245, 160, 0.75);pointer-events:none;animation:p02BubbleRise 5.5s ease-in infinite}
        .p02-bubble.b1{left:160px;bottom:20px;width:22px;height:22px;animation-duration:5s;animation-delay:0.5s}
        .p02-bubble.b2{left:420px;bottom:35px;width:32px;height:32px;animation-duration:6.5s;animation-delay:1.8s}
        .p02-bubble.b3{left:740px;bottom:15px;width:26px;height:26px;animation-duration:5.2s;animation-delay:2.7s}
        .p02-bubble.b4{left:1050px;bottom:30px;width:36px;height:36px;animation-duration:7s;animation-delay:0.2s}
        .p02-bubble.b5{left:1330px;bottom:25px;width:20px;height:20px;animation-duration:5.8s;animation-delay:3.3s}
        @keyframes p02BubbleRise{
          0%{transform:translateY(0) scale(0.85);opacity:0}
          20%{opacity:0.85}
          80%{opacity:0.85}
          100%{transform:translateY(-240px) scale(1.15);opacity:0}
        }
        .p02-tag{position:absolute;box-sizing:border-box;display:inline-flex;align-items:center;gap:10px;font-family:'Cafe24 Ssurround', sans-serif;font-weight:700;border-radius:30px;z-index:10;pointer-events:none;letter-spacing:-0.03em}
        .p02-tag-dot{display:inline-block;width:14px;height:14px;border-radius:50%}
        .p02-tag.is-blood{left:24px;top:20px;background:#ffffff;border:5px solid #b31f23;color:#b31f23;font-size:30px;padding:4px 28px}
        .p02-tag.is-filter{left:24px;top:450px;background:#e83856;border:4px solid #ffffff;color:#ffffff;font-size:28px;padding:2px 20px;z-index:12}
        .p02-tag.is-urine{left:24px;top:520px;background:#ffffff;border:5px solid #ad6200;color:#ad6200;font-size:30px;padding:2px 26px;box-shadow:0 6px 14px rgba(180, 130, 10, 0.22);z-index:12}
        .p02-score-capsule{position:absolute;left:41px;top:28px;width:1838px;height:176px;box-sizing:border-box;display:flex;align-items:center;padding:0 64px 0 110px;background:#ffffff;border:5px solid #31248a;border-radius:85px;box-shadow:0 8px 18px rgba(35, 53, 103, 0.16);z-index:15;gap:54px}
        .p02-gauge.gauge{position:relative;flex:1;width:auto;border-color:#266cc8}
        .gauge.p02-gauge.gauge.is-thin:before{display:none}
        .p02-score-marker{position:absolute;left:0%;top:-54px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none;transition:left 0.35s ease-out;z-index:4}
        .p02-score-marker span{padding:2px 20px;background:#f9cd04;border:5px solid #ad6200;border-radius:24px;font-family:'Cafe24 Ssurround', sans-serif;font-size:24px;color:#7d4a13;line-height:1.2;box-shadow:0 3px 6px rgba(0, 0, 0, 0.25)}
        .p02-score-marker img{margin-top:-10px}
        .p02-score-text{font-family:'Cafe24 Ssurround', sans-serif;font-size:70px;font-weight:400;color:#233567;min-width:170px;text-align:center;white-space:nowrap}
        .p02-score-text b{font-weight:400;color:#ff44ba}
        .p02-field{position:absolute;left:0;top:0;width:1920px;height:960px;z-index:8;touch-action:none;cursor:ew-resize;clip-path:inset(225px 46px 24px 46px round 36px)}
        .p02-it{position:absolute;transform:translateX(-50%);pointer-events:none;display:flex;flex-direction:column;align-items:center}
        .p02-it-img-box{position:relative}
        .p02-it-img-box img{display:block;width:auto;height:auto}
        .p02-it-badge{padding:4px 15px;background:#ffffff;border-radius:16px;font-family:'Cafe24 Ssurround', sans-serif;font-size:30px;line-height:1.2;color:#31248a;white-space:nowrap;box-shadow:0 4px 8px rgba(0, 0, 0, 0.18)}
        .p02-it.is-gone{opacity:0;transition:opacity 0.5s ease}
        .p02-it.is-quick{opacity:0;transition:opacity 0.15s ease}
        .p02-wrong{z-index:30}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="p02-score-capsule">
            <div class="gauge is-thin p02-gauge">
              <div class="gauge-fill" id="p02ScoreFill"></div>
              <div class="p02-score-marker" id="p02ScoreMarker">
                <span>오줌</span>
                <img src="img/p02_urine_drop.png" alt="">
              </div>
            </div>
            <span class="p02-score-text"><b id="p02ScoreCur">0</b>/ 10</span>
          </div>

          <div class="p02-lab-wrap">
            <div class="p02-blood-zone">
              <div class="p02-tag is-blood">혈관 속</div>
            </div>

            <div class="p02-filter-bar">
              <div class="p02-mem-wing is-l" id="p02MemL">
                <div class="p02-filter-pores"></div>
              </div>
              <div class="p02-mem-wing is-r" id="p02MemR">
                <div class="p02-filter-pores"></div>
              </div>
            </div>
            <div class="p02-tag is-filter">콩팥 필터</div>

            <div class="p02-hole" id="p02Hole">
              <span class="p02-hole-arrow is-l">◄</span>
              <span class="p02-hole-arrow is-r">►</span>
              <div class="p02-hole-stream"></div>
            </div>

            <div class="p02-urine-zone">
              <div class="p02-urine-wave"></div>
              <div class="p02-bubble b1"></div>
              <div class="p02-bubble b2"></div>
              <div class="p02-bubble b3"></div>
              <div class="p02-bubble b4"></div>
              <div class="p02-bubble b5"></div>
            </div>
            <div class="p02-tag is-urine">오줌이 모이는곳</div>
          </div>

          <div class="p02-field" id="p02Field"></div>

          <div class="ox-result-wrong is-avatar is-off p02-wrong" id="p02Wrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body"><p class="avatar-popup-text">이 알갱이는 구멍보다 커서<br>통과할 수 없어요.</p></div>
            </div>
          </div>

          <div class="avatar-modal is-off" id="p02Done" style="z-index:30">
            <div class="avatar-card">
              <img class="avatar-card-avatar" src="../../resources/img/common/avatar_finish.png" alt="">
              <div class="step-flow">
                <div class="step-panel">
                  <div class="avatar-card-body is-side">
                    <p class="avatar-card-title is-left" style="padding:0;margin-bottom:40px">정말 잘했어요!</p>
                    <p class="avatar-card-text">필터 구멍보다 작으면 통과하고 크면 남겨서<br>위쪽 피는 깨끗해지고<br>아래에는 오줌이 모이게 됐어요!</p>
                  </div>
                  <a href="javascript:;" class="js-nav-effect js-sfx avatar-card-btn card-btn is-popup" data-sound="sound/click.mp3">다음</a>
                </div>
                <div class="step-panel is-hidden">
                  <div class="avatar-card-body is-side">
                    <p class="avatar-card-text">‘만약 구멍보다 작다면 통과’처럼<br>조건에 따라 행동을 달리했어요.</p>
                  </div>
                  <a href="javascript:;" class="js-nav-effect js-sfx avatar-card-btn card-btn is-popup" data-sound="sound/click.mp3">다음</a>
                </div>
                <div class="step-panel is-hidden">
                  <div class="avatar-card-body is-side">
                    <p class="avatar-card-text">컴퓨터도 조건에 따라<br>어떻게 작동되는지 알아볼까요?</p>
                  </div>
                  <a href="page03.html" class="js-nav-effect js-sfx avatar-card-btn card-btn is-popup" data-sound="sound/click.mp3">다음</a>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="콩팥 필터를 부탁해~" data-next="page03.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  (function () {
    const SUBS = {
      water:   { name: '물',     ok: true },
      waste:   { name: '노폐물', ok: true },
      rbc:     { name: '적혈구', ok: false },
      protein: { name: '단백질', ok: false },
      wbc:     { name: '백혈구', ok: false },
    };
    const KEYS = Object.keys(SUBS);
    KEYS.forEach((k) => { new Image().src = 'img/p02_' + k + '.png'; });
    const LANES = [540, 960, 1380];
    const HOLE_W = 140;
    const HOLE_MIN = 120, HOLE_MAX = 1800, HOLE_SPEED = 900;
    const MEM_TOP = 655, START_Y = 100, SPEED = 85, FIRST_MS = 300, GAP_MS = 800, TARGET = 10, FALL_END = 770;

    const field = $('p02Field');
    const holeEl = $('p02Hole');
    const memL = $('p02MemL');
    const memR = $('p02MemR');
    const scoreFill = $('p02ScoreFill');
    const scoreMarker = $('p02ScoreMarker');
    const scoreCur = $('p02ScoreCur');
    const wrongLayer = $('p02Wrong');
    const mainEl = document.querySelector('main');

    let holeX = 960;
    let items = [];
    let waitMs = FIRST_MS;
    let judging = false;
    let lastKey = '';
    let lastLane = -1;
    let correct = 0;
    let paused = false;
    let ended = false;
    let last = 0;
    const keys = { left: false, right: false };
    let dragging = false;

    const drawHole = () => {
      const relX = holeX - 41;
      holeEl.style.left = relX + 'px';
      const half = HOLE_W / 2;
      memL.style.width = Math.max(0, relX - half) + 'px';
      memR.style.left = (relX + half) + 'px';
      memR.style.width = Math.max(0, 1828 - (relX + half)) + 'px';
    };

    const setGauge = () => {
      const pct = Math.min(100, Math.round((correct / TARGET) * 100));
      scoreFill.style.width = pct + '%';
      scoreMarker.style.left = pct + '%';
      scoreCur.textContent = String(correct);
    };

    const createItemNode = (key, s, x, y) => {
      const el = document.createElement('div');
      el.className = 'p02-it';
      el.style.left = x + 'px';
      el.style.top = y + 'px';

      const imgBox = document.createElement('div');
      imgBox.className = 'p02-it-img-box';
      const img = document.createElement('img');
      img.src = 'img/p02_' + key + '.png';
      img.alt = s.name;
      if (s.w) img.style.width = s.w + 'px';
      if (s.h) img.style.height = s.h + 'px';
      imgBox.appendChild(img);

      const badge = document.createElement('span');
      badge.className = 'p02-it-badge';
      badge.textContent = s.name;

      el.appendChild(badge);
      el.appendChild(imgBox);
      return el;
    };

    const spawn = () => {
      let key;
      do { key = KEYS[Math.floor(Math.random() * KEYS.length)]; } while (key === lastKey);
      lastKey = key;
      const s = SUBS[key];
      let lane;
      do { lane = Math.floor(Math.random() * LANES.length); } while (lane === lastLane);
      lastLane = lane;
      const x = LANES[lane];
      judging = true;

      const el = createItemNode(key, s, x, START_Y);
      field.appendChild(el);
      items.push({ el, s, x, y: START_Y, state: 'fall' });
    };

    const finish = () => {
      ended = true;
      setTimeout(() => $('p02Done').classList.remove('is-off'), 900);
    };

    const reach = (it) => {
      judging = false;
      waitMs = GAP_MS;
      const w = it.el.offsetWidth || 100;
      const h = it.el.offsetHeight || 100;
      const half = w / 2;
      const hl = holeX - HOLE_W / 2, hr = holeX + HOLE_W / 2;
      const ov = Math.min(it.x + half, hr) - Math.max(it.x - half, hl);
      if (it.s.ok) {
        if (Math.abs(it.x - holeX) <= HOLE_W / 2) {
          it.state = 'through';
          playCorrect();
          correct++;
          setGauge();
          if (correct >= TARGET) finish();
        } else {
          it.state = 'done';
          it.y = MEM_TOP - h;
          it.el.style.top = it.y + 'px';
          it.el.classList.add('is-quick');
          setTimeout(() => it.el.remove(), 200);
        }
        return;
      }
      it.state = 'done';
      it.y = MEM_TOP - h;
      it.el.style.top = it.y + 'px';
      if (ov >= HOLE_W * 0.4) {
        playWrong();
        paused = true;
        flashLayer(wrongLayer, 'is-off', 2000);
        setTimeout(() => { paused = false; }, 2000);
      }
      setTimeout(() => it.el.classList.add('is-gone'), 800);
      setTimeout(() => it.el.remove(), 1400);
    };

    const tick = (t) => {
      const dt = Math.min(0.05, (t - (last || t)) / 1000);
      last = t;
      if (!paused) {
        const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
        if (dir) holeX = Math.max(HOLE_MIN, Math.min(HOLE_MAX, holeX + dir * HOLE_SPEED * dt));
        drawHole();
        if (!ended) {
          if (!judging) {
            waitMs -= dt * 1000;
            if (waitMs <= 0) spawn();
          }
        }
        items.forEach((it) => {
          if (it.state === 'done') return;
          it.y += SPEED * dt;
          if (it.state === 'fall' && it.y + (it.el.offsetHeight || 100) >= MEM_TOP) reach(it);
          if (it.state === 'through') {
            if (it.y > FALL_END) { it.state = 'done'; it.el.remove(); return; }
            it.el.style.opacity = Math.max(0, Math.min(1, (FALL_END - it.y) / 160));
          }
          if (it.state !== 'done') it.el.style.top = it.y + 'px';
        });
        items = items.filter((it) => it.state !== 'done' || it.el.isConnected);
      }
      requestAnimationFrame(tick);
    };

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') { keys.left = true; e.preventDefault(); }
      else if (e.key === 'ArrowRight') { keys.right = true; e.preventDefault(); }
    });
    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft') keys.left = false;
      else if (e.key === 'ArrowRight') keys.right = false;
    });
    window.addEventListener('blur', () => { keys.left = keys.right = false; });

    const moveTo = (e) => {
      if (paused) return;
      const r = mainEl.getBoundingClientRect();
      holeX = Math.max(HOLE_MIN, Math.min(HOLE_MAX, (e.clientX - r.left) / currentScale));
    };
    field.addEventListener('pointerdown', (e) => { dragging = true; field.setPointerCapture(e.pointerId); moveTo(e); });
    field.addEventListener('pointermove', (e) => { if (dragging) moveTo(e); });
    const endDrag = () => { dragging = false; };
    field.addEventListener('pointerup', endDrag);
    field.addEventListener('pointercancel', endDrag);

    drawHole();
    requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
