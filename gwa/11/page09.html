<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀴즈 풀기</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        .q9-blk{position:absolute;left:190px;top:425px;width:780px;box-sizing:border-box;background:var(--c-white);border:solid 6px var(--c-purple);border-radius:20px}
        .q9-code{position:absolute;transform-origin:0 0}
        .q9-code .lb.is-c{left:0;width:100%;justify-content:center;padding:4px 0 0;height:100%}
        .q9-opts{left:1010px;width:700px}
        .q9-opts.quiz-opts.is-col .card-btn{width:640px;height:120px;font-size:64px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="quiz-stage">
          <div class="step-flow">

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../resources/img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q1.</span>
                  <p class="quiz-ask">콩팥은 구멍보다 작은 알갱이만 오줌으로 내보내고 큰 알갱이는 피 속에 남겨요.</p>
                </div>
              </div>
              <div class="answer-pick-quiz">
                <button class="answer-pick ox-pick is-o" data-correct="true" aria-label="O">
                  <img class="js-img-swap" src="../../resources/img/common/icon_o.png" data-src-on="../../resources/img/common/icon_o_on.png" alt="O">
                </button>
                <button class="answer-pick ox-pick is-x" data-correct="false" aria-label="X">
                  <img class="js-img-swap" src="../../resources/img/common/icon_x.png" data-src-on="../../resources/img/common/icon_x_on.png" alt="X">
                </button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../resources/img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q2.</span>
                  <p class="quiz-ask">이 블록은 어떤 명령을 나타내는 블록일까요?</p>
                </div>
              </div>
              <div class="q9-blk"><div class="q9-code"></div></div>
              <div class="answer-pick-quiz quiz-opts is-col q9-opts">
                <button class="answer-pick card-btn is-quiz" data-correct="false">반복</button>
                <button class="answer-pick card-btn is-quiz" data-correct="false">순차</button>
                <button class="answer-pick card-btn is-quiz" data-correct="true">조건</button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../resources/img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q3.</span>
                  <p class="quiz-ask">위와 같이 코딩된 로봇은 파란 공을 몇 번 바구니에 넣어야 할까요?</p>
                </div>
              </div>
              <div class="q9-blk"><div class="q9-code"></div></div>
              <div class="answer-pick-quiz quiz-opts is-col q9-opts">
                <button class="answer-pick card-btn is-quiz" data-correct="true">1번 바구니</button>
                <button class="answer-pick card-btn is-quiz" data-correct="false">2번 바구니</button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../resources/img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q4.</span>
                  <p class="quiz-ask">위와 같이 코딩된 로봇은 노란 공을 몇 번 바구니에 넣어야 할까요?</p>
                </div>
              </div>
              <div class="q9-blk"><div class="q9-code"></div></div>
              <div class="answer-pick-quiz quiz-opts is-col q9-opts">
                <button class="answer-pick card-btn is-quiz" data-correct="false">1번 바구니</button>
                <button class="answer-pick card-btn is-quiz" data-correct="true">2번 바구니</button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../resources/img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q5.</span>
                  <p class="quiz-ask">생활 속에서 조건으로 판단하는 것이 아닌 것은 무엇일까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-list is-left" data-next="page10.html">
                <button class="answer-pick card-btn is-quiz" data-correct="false">사람이 다가오면 열리는 자동문</button>
                <button class="answer-pick card-btn is-quiz" data-correct="true">벽에 걸린 시계가 초마다 움직이는 초침</button>
                <button class="answer-pick card-btn is-quiz" data-correct="false">이름을 부르면 대답하는 AI 스피커</button>
              </div>
            </div>

          </div>

          <div class="ox-result-correct is-avatar is-off" data-sound="sound/correct.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_correct_gwa.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">정답이에요!</p>
              </div>
              <div class="avatar-popup-extra"><img src="../../resources/img/common/icon_correct.png" alt=""></div>
            </div>
          </div>
          <div class="ox-result-wrong is-avatar is-off" data-sound="sound/incorrect.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">다시 한번 생각해볼까요?</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="퀴즈 풀기" data-next="page10.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script src="../../resources/js/entry.js"></script>
  <script>
  (function () {
    const RULES = [
      { c: '', a: null, e: null, end: '라면' },
      { c: '파란 공', a: '1번 바구니로', e: '2번 바구니로', end: '이면' },
      { c: ['파란 공', '빨간 공'], a: '1번 바구니로', e: '2번 바구니로', end: '이면' }
    ];
    const BW = 560, S = 1.3, PAD = 20;
    document.querySelectorAll('.q9-blk').forEach((blk, i) => {
      const rule = RULES[i];
      const r = Entry.ifBlock(rule, { w: BW, end: rule.end });
      const code = blk.querySelector('.q9-code');
      code.innerHTML = r.html;
      code.style.cssText = 'width:' + BW + 'px;height:' + r.h + 'px;left:' + ((768 - BW * S) / 2) + 'px;top:' + PAD + 'px;transform:scale(' + S + ')';
      blk.style.height = Math.ceil(r.h * S + PAD * 2 + 12) + 'px';
    });
  })();
  </script>
</body>
</html>
