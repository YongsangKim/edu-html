<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내가 모은 데이터로 AI에게 질문하기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        .gn-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:18px 0 0}
        .gn-photo{position:relative;height:142px;padding:0;border:0;font-size:56px;cursor:pointer;overflow:hidden}
        .gn-photo img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
        .gn-photo.is-on{outline:5px solid #ff4ff9;outline-offset:-3px}
        .gn-photo.is-on:after{content:'✓';position:absolute;left:8px;top:8px;width:30px;height:30px;border-radius:50%;background:#1a73e8;color:#fff;font-size:23px;line-height:30px}
        .gn-check{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:#c9c9cf;color:#fff;font-size:29px;text-decoration:none}
        .gn-check.is-ready{background:#1a73e8}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <p class="guide-bubble is-center gn-bubble is-sm" id="bub">뉴스 기사 이미지만 선택해볼까요?</p>
          <div class="guide-character"><img src="img/p13_character.png" alt="메인 캐릭터"></div>
          <div class="phone-frame gn-phone">
<div class="gn-screen" style="background:#8b8b8b">
            <div class="gn-status"><span class="">11:55</span><span class="gn-sys"><svg class="gn-wifi" viewBox="0 0 24 18" width="24" height="18" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 6.6Q12-2 22 6.6"/><path d="M5.6 10.4Q12 4.6 18.4 10.4"/><path d="M9.2 14Q12 11.6 14.8 14"/></g><circle cx="12" cy="16.4" r="1.5" fill="currentColor"/></svg><svg class="gn-sig" viewBox="0 0 18 15" width="18" height="15" aria-hidden="true"><rect x="0" y="9" width="3" height="6" rx="1" fill="currentColor"/><rect x="5" y="6" width="3" height="9" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="12" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="15" rx="1" fill="currentColor" opacity=".35"/></svg><span class="gn-bat">77</span></span></div>
            <div class="gn-sheet" style="top:68px;background:#fff">
              <p style="margin:22px 0 0;text-align:center;font-size:18px">최대 10장의 사진을 선택합니다.</p>
              <div style="display:flex;align-items:center;justify-content:space-between;margin:12px 12px 0">
                <span style="display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:#f1f1f4;font-size:26px">✕</span>
                <span style="display:flex;background:#f1f1f4;border-radius:22px;font-size:18px"><b style="padding:10px 14px;border-radius:22px;background:#dcdce2;font-weight:500">사진</b><b style="padding:10px 14px;font-weight:500">모음</b></span>
                <a href="javascript:;" class="js-sfx gn-check" id="p13Check" data-sound="sound/click.mp3" aria-label="선택 완료">✓</a>
              </div>
              <div style="display:flex;gap:12px;margin:18px 12px 0;padding:14px;border-radius:16px;background:#f4f4f6;font-size:17px;line-height:1.5;color:#555">
                <span style="font-size:34px"><img src="img/p13_photo.png" alt=""></span>
                <span><b style="color:#1b1b1f;font-weight:600">사진에 비공개 접근</b><br>사용자의 사진 보관함이 여기에 나타나지만 ‘Notebook’ 앱은 오직 사용자가 선택한 항목에만 접근할 수 있습니다.<br><span style="color:#1a73e8">더 알아보기...</span></span>
              </div>
              <div class="gn-grid">
                <button class="gn-photo c1r1" data-correct="true" aria-label="청소년 과학 체험 교실 뉴스"><img src="img/p13_photo_news1.png" alt=""></button>
                <button class="gn-photo c2r1" data-correct="false" aria-label="강아지 사진"><img src="img/p13_photo_news2.png" alt=""></button>
                <button class="gn-photo c3r1" data-correct="true" aria-label="깨끗한 바다 뉴스"><img src="img/p13_photo_news3.png" alt=""></button>
                <button class="gn-photo c1r2" data-correct="false" aria-label="떡볶이 사진"><img src="img/p13_photo_news4.png" alt=""></button>
                <button class="gn-photo c2r2" data-correct="true" aria-label="오늘 전국 날씨 뉴스"><img src="img/p13_photo_news5.png" alt=""></button>
                <button class="gn-photo c3r2" data-correct="false" aria-label="야경 사진"><img src="img/p13_photo_news6.png" alt=""></button>
              </div>
            </div>
          </div>
          </div>

          <div class="avatar-modal is-off" id="p13Wrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <p class="avatar-popup-text is-pill">뉴스 기사 이미지만 선택해볼까요?</p>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="내가 모은 데이터로 AI에게 질문하기" data-next="page14.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const photos = Array.from(document.querySelectorAll('.gn-photo'));
    const check = document.getElementById('p13Check');
    const wrongModal = document.getElementById('p13Wrong');
    const NEED = photos.filter((p) => p.dataset.correct === 'true').length;
    let locked = false;
  
    function guideFinger() {
      clearFingers();
      const on = (p) => p.classList.contains('is-on');
      const allDone = photos.every((p) => (p.dataset.correct === 'true') === on(p));
      if (allDone) pointFingerAt(check, { onMain: true });
    }
  
    photos.forEach((p) => {
      p.addEventListener('click', () => {
        if (locked) return;
        p.classList.toggle('is-on');
        check.classList.toggle('is-ready', photos.some((x) => x.classList.contains('is-on')));
        guideFinger();
        playClick();
      });
    });
  
    check.addEventListener('click', () => {
      if (locked) return;
      const picked = photos.filter((p) => p.classList.contains('is-on'));
      if (!picked.length) return;
      const allCorrect = picked.length === NEED && picked.every((p) => p.dataset.correct === 'true');
  
      if (allCorrect) {
        locked = true;
        playCorrect();
        setTimeout(() => navigateTo('page14.html'), 700);
        return;
      }
      playWrong();
      photos.forEach((p) => p.classList.remove('is-on'));
      check.classList.remove('is-ready');
      guideFinger();
      wrongModal.classList.remove('is-off');
      clearTimeout(wrongModal.__hideTimer);
      wrongModal.__hideTimer = setTimeout(() => wrongModal.classList.add('is-off'), 2000);
    });
  })();
  </script>
</body>
</html>
