<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알록달록 과일 농장 알바왕</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        main{background:url('img/p03_bg.png') no-repeat}

        /* 배경에 구워진 게이지 위에 실시간 DOM을 덮어 그림(page02와 동일) */
        .p03-gauge{left:62px;top:36px;width:757px}

        /* 컨베이어 위를 내려오는 과일 한 개.
           칸을 고정해 두고 그 안에서 가운데 정렬해야 과일마다 비율이 달라도 줄이 맞음.
           벨트가 위로 갈수록 좁아지는 원근이라 위에서 작게 시작해 내려오며 커짐 */
        .p03-fruit{position:absolute;left:810px;width:300px;height:320px;padding:0;margin:0;border:none;background:none;
          display:flex;align-items:center;justify-content:center;
          transform-origin:50% 50%;cursor:grab;touch-action:none;z-index:20}
        .p03-fruit img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;pointer-events:none}
        /* 이동 시간은 아래 스크립트의 TRAVEL_MS 한 곳에서만 정함(CSS와 어긋나지 않게) */
        .p03-fruit.is-moving{transition-property:top,transform;transition-timing-function:linear}
        .p03-fruit.is-grabbed{cursor:grabbing;z-index:60}
        .p03-fruit.is-dropped{opacity:0;transform:scale(.3);transition:opacity .3s ease,transform .3s ease;pointer-events:none}

        /* 상자 드롭 영역 — 배경의 상자 위에 투명하게 겹치고 판정은 상자보다 조금 넓게.
           상자 사이에 35px 간격을 둬 인접 상자로 잘못 인식되지 않게 함 */
        .p03-box{position:absolute;top:627px;width:367px;height:281px;border-radius:24px}
        .p03-box img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
        .p03-box.is-wrong{animation:fix-word-shake .4s ease}
        .p03-box-apple{left:43px}
        .p03-box-lemon{left:410px}
        .p03-box-banana{left:777px}
        .p03-box-grape{left:1144px}
        .p03-box-strawberry{left:1511px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main>

          <div class="gauge p03-gauge"><div class="gauge-fill" id="p03GaugeFill"></div></div>

          <div class="p03-box drop-zone p03-box-apple"      data-box="apple_red"><img src="img/p03_box_apple.png" alt=""></div>
          <div class="p03-box drop-zone p03-box-lemon"      data-box="lemon"><img src="img/p03_box_lemon.png" alt=""></div>
          <div class="p03-box drop-zone p03-box-banana"     data-box="banana"><img src="img/p03_box_banana.png" alt=""></div>
          <div class="p03-box drop-zone p03-box-grape"      data-box="grape"><img src="img/p03_box_grape.png" alt=""></div>
          <div class="p03-box drop-zone p03-box-strawberry" data-box="strawberry"><img src="img/p03_box_strawberry.png" alt=""></div>

          <div id="p03Belt"></div>

          <div class="avatar-modal is-off" id="p03Modal">
            <div class="avatar-card is-side is-middle">
              <img class="avatar-card-avatar" src="../../img/common/avatar_finish.png" alt="">
            <div class="step-flow">

              <div class="step-panel">
                <div class="avatar-card-body is-center">
                  <p class="avatar-card-title">정말 잘했어요!</p>
                  <p class="avatar-card-text">과일을 종류별로 완벽하게 정리했어요.</p>
                </div>
                <a href="javascript:;" class="js-nav-effect js-sfx avatar-card-btn card-btn is-popup is-arrow" data-sound="sound/click.mp3">→</a>
              </div>

              <div class="step-panel is-hidden">
                <div class="avatar-card-body"><p class="avatar-card-text">정리는 여러가지가 섞여 있는 것을 비슷한 것끼리 모으는 것을 의미해요.</p></div>
                <a href="javascript:;" class="js-nav-effect js-sfx avatar-card-btn card-btn is-popup is-arrow" data-sound="sound/click.mp3">→</a>
              </div>

              <div class="step-panel is-hidden">
                <div class="avatar-card-body"><p class="avatar-card-text">게임에서 했던 정리와 수집을 AI도 똑같이 하고 있다는 사실, 알고 있었나요?</p></div>
                <a href="javascript:;" class="js-nav-effect js-sfx avatar-card-btn card-btn is-popup is-arrow" data-sound="sound/click.mp3">→</a>
              </div>

              <div class="step-panel is-hidden">
                <div class="avatar-card-body"><p class="avatar-card-text">AI는 과일 대신 정보를 수집하고 정리해요. 우리가 일을 정확하게 해서 보상을 받았듯이, AI도 데이터가 잘 정리될수록 더 똑똑한 답을 할 수 있어요.</p></div>
                <a href="javascript:;" class="js-nav-effect js-sfx avatar-card-btn card-btn is-popup is-arrow" data-sound="sound/click.mp3">→</a>
              </div>

              <!-- 기획서 5번: 마지막 단계에서 문구와 버튼이 함께 바뀜(화살표 → 다음) -->
              <div class="step-panel is-hidden">
                <div class="avatar-card-body is-center"><p class="avatar-card-text">AI는 어떻게 일하는지,<br>지금 만나러 가볼까요?</p></div>
                <a href="page04.html" class="js-nav-effect js-sfx avatar-card-btn card-btn is-popup" data-sound="sound/click.mp3">다음</a>
              </div>

            </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="알록달록 과일 농장 알바왕" data-next="page04.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  /* 기획서 5p(game01_02) — 컨베이어 벨트 분류
     - 5종 과일 중 10개를 무작위 제시. 같은 과일은 연이어 2번까지만 나옴
     - 이 라운드에는 빨간 사과만 등장(초록 사과 X)
     - 과일은 벨트 상단에서 조작 영역까지 2초 동안 내려오고, 도착하면 멈춤
     - 현재 과일의 분류가 끝나기 전에는 다음 과일이 나오지 않음
     - 과일을 잡으면 작아지고, 상자 판정 영역에 들어가면 그 상자 외곽선이 강조됨
     - 정답이면 상자에 들어가는 연출 + 정답음 → 게이지 10% 상승 → 다음 과일
     - 오답이면 상자가 좌우로 흔들리고 오답음 → 과일은 벨트 위 제자리로 돌아감
     - 제한 시간·실패 조건 없음. 10개를 모두 정리해 100%가 되면 종료 모달
     - 과일 이미지는 디자인에서 잘라낸 임시본(배경이 함께 붙어 있음) */
  (function () {
    const FRUITS = {
      apple_red:  'img/fruit_apple_red.png',
      lemon:      'img/fruit_lemon.png',
      banana:     'img/fruit_banana.png',
      grape:      'img/fruit_grape.png',
      strawberry: 'img/fruit_strawberry.png',
    };
    const KEYS = Object.keys(FRUITS);

    const TOTAL = 10;        // 이 라운드에 내려오는 과일 수
    const HOME_X = 810;      // 조작 영역에서의 가로 위치(칸 기준)
    const TOP_Y = 40;        // 벨트 상단 출발 위치(main 좌표)
    const STOP_Y = 236;      // 조작 영역 도착 위치 — 디자인에서 측정한 과일 자리
    const TOP_SCALE = 0.45;  // 벨트가 위로 갈수록 좁아지는 원근 표현
    const TRAVEL_MS = 1100;  // 상단 → 조작 영역 이동 시간(기획서는 2초였으나 더 빠르게 조정)

    const belt = document.getElementById('p03Belt');
    const gaugeFill = document.getElementById('p03GaugeFill');
    const boxes = Array.from(document.querySelectorAll('.p03-box'));


    const rectOf = (el) => el.getBoundingClientRect();
    const overlaps = (a, b) =>
      a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;

    // 10개를 무작위로 뽑되 같은 과일이 3번 연속 나오지 않게 함(연이어 2번까지 허용)
    function buildQueue() {
      const out = [];
      while (out.length < TOTAL) {
        const k = KEYS[Math.floor(Math.random() * KEYS.length)];
        const n = out.length;
        if (n >= 2 && out[n - 1] === k && out[n - 2] === k) continue;
        out.push(k);
      }
      return out;
    }

    const queue = buildQueue();
    let index = 0;
    let solved = 0;
    let current = null;

    function sendNext() {
      if (index >= queue.length) return;
      const key = queue[index];

      const el = document.createElement('button');
      el.className = 'p03-fruit';
      el.dataset.fruit = key;
      el.style.left = HOME_X + 'px';
      el.style.top = TOP_Y + 'px';
      el.style.transform = 'scale(' + TOP_SCALE + ')';
      el.innerHTML = '<img src="' + FRUITS[key] + '" alt="">';
      el.querySelectorAll('img').forEach((im) => { im.draggable = false; });
      el.addEventListener('dragstart', (e) => e.preventDefault());
      belt.appendChild(el);
      current = el;

      // 시작값을 강제로 계산시킨 뒤 목표값을 줘야 transition이 실제로 재생됨.
      // rAF에 맡기면 다른 페이지에서 넘어온 직후엔 시작값이 반영되기 전에 실행돼 과일이 멈춰 보임
      void el.offsetWidth;
      el.style.transitionDuration = TRAVEL_MS + 'ms';
      el.classList.add('is-moving');
      el.style.top = STOP_Y + 'px';
      el.style.transform = 'scale(1)';

      // 조작 영역에 도착하면 벨트를 멈추고 그때부터 드래그를 받음.
      // 인라인 transitionDuration을 반드시 지워야 함 — 남겨두면 transition-property가
      // 기본값 all이라 드래그 중의 left/top까지 그 시간만큼 따라와서 드래그가 안 먹음
      setTimeout(() => {
        if (current !== el) return;
        el.classList.remove('is-moving');
        el.style.transitionDuration = '';
        attachDrag(el);
      }, TRAVEL_MS);
    }

    function attachDrag(el) {
      let dragging = false;
      let startX = 0, startY = 0, startLeft = HOME_X, startTop = STOP_Y;
      let pendingX = 0, pendingY = 0, frame = 0;

      const flush = () => {
        frame = 0;
        if (!dragging) return;
        el.style.left = pendingX + 'px';
        el.style.top = pendingY + 'px';
      };

      const goHome = () => {
        el.style.left = HOME_X + 'px';
        el.style.top = STOP_Y + 'px';
        el.style.transform = 'scale(1)';
      };

      el.addEventListener('pointerdown', (e) => {
        if (el.classList.contains('is-dropped')) return;
        dragging = true;
        el.setPointerCapture(e.pointerId);
        el.classList.add('is-grabbed');
        el.style.transform = 'scale(.75)';   // 과일을 선택하면 크기가 작아짐
        startX = e.clientX;
        startY = e.clientY;
        startLeft = parseFloat(el.style.left);
        startTop = parseFloat(el.style.top);
      });

      el.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        // 화면 이동량을 현재 스테이지 배율로 나눠 1920x1080 좌표계 이동량으로 변환
        pendingX = startLeft + (e.clientX - startX) / currentScale;
        pendingY = startTop + (e.clientY - startY) / currentScale;
        if (!frame) frame = requestAnimationFrame(flush);

        const r = rectOf(el);
        boxes.forEach((b) => b.classList.toggle('is-over', overlaps(r, rectOf(b))));
      });

      const endDrag = () => {
        if (!dragging) return;
        if (frame) {
          cancelAnimationFrame(frame);
          frame = 0;
          el.style.left = pendingX + 'px';
          el.style.top = pendingY + 'px';
        }
        dragging = false;
        el.classList.remove('is-grabbed');
        boxes.forEach((b) => b.classList.remove('is-over'));

        const r = rectOf(el);
        const target = boxes.find((b) => overlaps(r, rectOf(b)));

        if (!target) {
          goHome();
          return;
        }

        if (target.dataset.box === el.dataset.fruit) {
          el.classList.add('is-dropped');
          playCorrect();
          solved += 1;
          index += 1;
          gaugeFill.style.width = (solved * (100 / TOTAL)) + '%';

          setTimeout(() => {
            el.remove();
            if (solved >= TOTAL) {
              // 10개를 다 정리하면 페이지를 넘기지 않고
              // 이 화면 위에 종료 모달(기획서 6p)을 띄움
              setTimeout(() => document.getElementById('p03Modal').classList.remove('is-off'), 700);
              return;
            }
            sendNext();
          }, 250);
        } else {
          playWrong();
          target.classList.remove('is-wrong');
          void target.offsetWidth;
          target.classList.add('is-wrong');
          goHome();
        }
      };

      el.addEventListener('pointerup', endDrag);
      el.addEventListener('pointercancel', endDrag);
    }

    gaugeFill.style.width = '0%';
    // 페이드 인(0.4초)이 끝나고 이미지가 다 뜬 뒤에 첫 과일을 내려보냄
    window.addEventListener('load', () => setTimeout(sendNext, 600));
  })();
  </script>
</body>
</html>
