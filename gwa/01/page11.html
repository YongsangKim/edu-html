<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀴즈 풀기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 기획서 37~41p. Q3 화면은 기획서에 없어 Q1·Q2·Q4·Q5 네 문항. 디자인은 37p(2지선다)·38p(OX)만 있어 Q5(3지선다)는 같은 틀. 오답은 문항별 힌트(data-wrong) */
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="quiz-stage">
          <div class="step-flow">

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q1.</span>
                  <p class="quiz-ask">인터넷에서 날씨 정보를 모으는 행동을 뭐라고 할까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-row" data-wrong="날씨 정보를 ‘차곡차곡’ 모으는 행동을 뭐라고 할까요?">
                <button class="answer-pick card-btn is-quiz" data-correct="false">데이터 제거</button>
                <button class="answer-pick card-btn is-quiz" data-correct="true">데이터 수집</button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q2.</span>
                  <p class="quiz-ask">단어를 표에 깔끔하게 정리하면 AI가 잘 이해할까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz" data-wrong="데이터의 정리가 잘 되어 있으면 AI도 쉽게 읽을 수 있어요!">
                <button class="answer-pick ox-pick is-o" data-correct="true" aria-label="O">
                  <img class="js-img-swap" src="../../img/common/icon_o.png" data-src-on="../../img/common/icon_o_on.png" alt="O">
                </button>
                <button class="answer-pick ox-pick is-x" data-correct="false" aria-label="X">
                  <img class="js-img-swap" src="../../img/common/icon_x.png" data-src-on="../../img/common/icon_x_on.png" alt="X">
                </button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q4.</span>
                  <p class="quiz-ask">AI에게 신문이나 동영상을 넣으면 중요한 내용을 요약할 수 있을까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz" data-wrong="AI는 길고 어려운 글을 짧게 줄여주는 능력이 있어요.">
                <button class="answer-pick ox-pick is-o" data-correct="true" aria-label="O">
                  <img class="js-img-swap" src="../../img/common/icon_o.png" data-src-on="../../img/common/icon_o_on.png" alt="O">
                </button>
                <button class="answer-pick ox-pick is-x" data-correct="false" aria-label="X">
                  <img class="js-img-swap" src="../../img/common/icon_x.png" data-src-on="../../img/common/icon_x_on.png" alt="X">
                </button>
              </div>
            </div>

            <div class="step-panel">
              <div class="quiz-ask-box">
                <div class="quiz-ask-row">
                  <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
                  <span class="quiz-qnum">Q5.</span>
                  <p class="quiz-ask">내일의 부산 날씨에 대해 물어볼 때, 어떻게 질문해야 똑똑하게 답할까요?</p>
                </div>
              </div>
              <div class="answer-pick-quiz quiz-opts is-row" data-next="page12.html" data-wrong="필요한 정보에 대해 자세하게 물어볼수록 AI가 원하는 답을 잘 찾아줘요!">
                <button class="answer-pick card-btn is-quiz is-long" data-correct="true">내일 부산의<br>날씨는 어때?</button>
                <button class="answer-pick card-btn is-quiz is-long" data-correct="false">내일 서울의<br>날씨는 어때?</button>
                <button class="answer-pick card-btn is-quiz" data-correct="false">날씨</button>
              </div>
            </div>

          </div>

          <div class="ox-result-correct is-avatar is-off" data-sound="sound/correct.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_correct_gwa.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">정답이에요!</p>
              </div>
              <div class="avatar-popup-extra"><img src="../../img/common/icon_correct.png" alt=""></div>
            </div>
          </div>
          <div class="ox-result-wrong is-avatar is-off" data-sound="sound/incorrect.mp3">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="hint-title">힌트</p>
                <p class="avatar-popup-text is-small">문장을 다시 한 번 잘 읽어봐요.</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="퀴즈 풀기" data-next="page12.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
