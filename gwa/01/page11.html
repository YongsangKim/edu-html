<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>퀴즈 풀기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        .p26-opt.is-wrong{animation:fix-word-shake .3s ease}
        .p26-opt img{display:block;width:360px;height:360px;object-fit:contain}
        .p26-opt.is-icon{padding:0;border:none;background:none;cursor:pointer}
        .p26-opts.is-ox{top:470px;height:360px;gap:320px}
        #p26Hint{max-width:1000px;word-break:keep-all}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="quiz-stage">

          <div class="quiz-ask-box">
            <div class="quiz-ask-row">
              <div class="quiz-avatar"><img src="../../img/common/avatar_quiz.png" alt=""></div>
              <span class="quiz-qnum" id="p26No"></span>
              <p class="quiz-ask" id="p26Text"></p>
            </div>
          </div>
          <div class="quiz-opts is-row p26-opts" id="p26Opts"></div>

          <div class="avatar-modal is-off" id="p26Correct">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_correct_gwa.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">정답이에요!</p>
              </div>
              <div class="avatar-popup-extra"><img src="../../img/common/icon_correct.png" alt=""></div>
            </div>
          </div>
          <div class="avatar-modal is-off" id="p26Wrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="hint-title">힌트</p>
                <p class="avatar-popup-text is-small" id="p26Hint"></p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="퀴즈 풀기" data-next="page12.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  /* 기획서 37p~41p — 퀴즈 풀기(뼈대)
     - 한 페이지 안에서 문항을 순서대로 진행(사회 1차시 page16과 같은 방식)
     - 정답이면 정답음 후 다음 문항, 오답이면 문항별 힌트 팝업(2초 뒤 자동으로 닫힘)
     - 기획서에 Q3 화면이 없어 Q1·Q2·Q4·Q5 네 문항만 넣음
     - 디자인은 37p(2지선다)와 38p(OX)만 있어서, Q5(3지선다)는 같은 틀을 그대로 씀 */
  (function () {
    const QUIZ = [
      { no: 'Q1.', text: '인터넷에서 날씨 정보를 모으는 행동을 뭐라고 할까요?',
        options: ['데이터 제거', '데이터 수집'], answer: 1,
        hint: '날씨 정보를 ‘차곡차곡’ 모으는 행동을 뭐라고 할까요?' },
      { no: 'Q2.', text: '단어를 표에 깔끔하게 정리하면 AI가 잘 이해할까요?',
        ox: true, answer: 0,
        hint: '데이터의 정리가 잘 되어 있으면 AI도 쉽게 읽을 수 있어요!' },
      { no: 'Q4.', text: 'AI에게 신문이나 동영상을 넣으면 중요한 내용을 요약할 수 있을까요?',
        ox: true, answer: 0,
        hint: 'AI는 길고 어려운 글을 짧게 줄여주는 능력이 있어요.' },
      { no: 'Q5.', text: '내일의 부산 날씨에 대해 물어볼 때, 어떻게 질문해야 똑똑하게 답할까요?',
        options: ['내일 부산의<br>날씨는 어때?', '내일 서울의<br>날씨는 어때?', '날씨'], answer: 0,
        hint: '필요한 정보에 대해 자세하게 물어볼수록 AI가 원하는 답을 잘 찾아줘요!' },
    ];

    const noEl = document.getElementById('p26No');
    const textEl = document.getElementById('p26Text');
    const optsEl = document.getElementById('p26Opts');
    const wrongModal = document.getElementById('p26Wrong');
    const correctModal = document.getElementById('p26Correct');
    const hintEl = document.getElementById('p26Hint');


    // 주소에 ?q=N 이 있으면 N번째 문항부터(UI 가이드의 퀴즈 나열용)
    const wantQ = parseInt(new URLSearchParams(window.location.search).get('q'), 10);
    let index = wantQ >= 1 && wantQ <= QUIZ.length ? wantQ - 1 : 0;
    let locked = false;

    function render() {
      const q = QUIZ[index];
      noEl.textContent = q.no;
      textEl.textContent = q.text;
      optsEl.innerHTML = '';
      optsEl.classList.toggle('is-ox', !!q.ox);

      const labels = q.ox ? ['O', 'X'] : q.options;
      labels.forEach((label, i) => {
        const b = document.createElement('button');
        b.className = q.ox ? 'p26-opt is-icon' : 'card-btn is-quiz p26-opt' + (label.replace(/<br>/g, '').length > 6 ? ' is-long' : '');
        if (q.ox) b.setAttribute('aria-label', label);
        if (q.ox) {
          b.innerHTML = '<img src="../../img/common/icon_' + (i === 0 ? 'o' : 'x') + '.png" data-src-on="../../img/common/icon_' + (i === 0 ? 'o' : 'x') + '_on.png" alt="' + label + '">';
        } else {
          b.innerHTML = label;
        }
        b.addEventListener('click', () => onPick(b, i));
        optsEl.appendChild(b);
      });
      locked = false;
    }

    // 선택 표시: OX는 색이 바뀐 이미지(_on), 글자 선택지는 눌린 모양(.is-selected)
    function mark(btn, on) {
      const img = btn.querySelector('img');
      if (img) {
        const src = img.getAttribute('src');
        if (on) img.setAttribute('src', img.dataset.srcOn);
        else img.setAttribute('src', src.replace('_on.png', '.png'));
      } else {
        btn.classList.toggle('is-selected', on);
      }
    }

    function onPick(btn, i) {
      if (locked) return;
      const q = QUIZ[index];
      mark(btn, true);

      if (i === q.answer) {
        locked = true;
        playCorrect();
        index += 1;
        correctModal.classList.remove('is-off');
        setTimeout(() => {
          correctModal.classList.add('is-off');
          if (index >= QUIZ.length) {
            navigateTo('page12.html');
            return;
          }
          render();
        }, 2000);
        return;
      }

      playWrong();
      btn.classList.remove('is-wrong');
      void btn.offsetWidth;
      btn.classList.add('is-wrong');
      hintEl.textContent = q.hint;
      wrongModal.classList.remove('is-off');
      locked = true;
      clearTimeout(wrongModal.__hideTimer);
      wrongModal.__hideTimer = setTimeout(() => {
        wrongModal.classList.add('is-off');
        mark(btn, false);
        locked = false;
      }, 2000);
    }

    render();
  })();
  </script>
</body>
</html>
