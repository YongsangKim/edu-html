<div class="gn-screen is-dark">
            <div class="gn-status"><span class="">1:16</span><span class="gn-sys"><svg class="gn-wifi" viewBox="0 0 24 18" width="24" height="18" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 6.6Q12-2 22 6.6"/><path d="M5.6 10.4Q12 4.6 18.4 10.4"/><path d="M9.2 14Q12 11.6 14.8 14"/></g><circle cx="12" cy="16.4" r="1.5" fill="currentColor"/></svg><svg class="gn-sig" viewBox="0 0 18 15" width="18" height="15" aria-hidden="true"><rect x="0" y="9" width="3" height="6" rx="1" fill="currentColor"/><rect x="5" y="6" width="3" height="9" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="12" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="15" rx="1" fill="currentColor" opacity=".35"/></svg><span class="gn-bat">55</span></span></div>

              <div style="display:flex;gap:12px;padding:12px 14px;font-size:16px;line-height:1.5"><span style="flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:#7a1f2c;font-size:29px">📺</span><span>[날씨] 동해안·제주 5~30㎜ 비..충청·남부 소나기 / SBS 모닝와이드 1부<br><span style="font-size:14px;color:#aaa">SBS 뉴스 · 조회수 1.1만회 · 6시간 전</span></span></div>
              <div style="height:240px;background:url(img/p19_news.png) 0 0 / cover no-repeat"></div>

              <div style="display:flex;justify-content:space-around;margin:14px 0 0;font-size:14px;text-align:center">
                <span><span style="display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:#111;font-size:31px"><img src="img/src_icon_etc3.png" alt="" style="width:100%"></span>X</span>

              </div>

            <div class="gn-nav is-white"><a href="page20.html" class="js-nav-effect js-sfx gn-hit" id="hit2" data-sound="sound/click.mp3">|||</a><span>○</span><span>‹</span></div>

          </div>

    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="내가 모은 데이터로 AI에게 질문하기" data-next="page20.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    var hit1 = document.getElementById('hit1');
    var hit2 = document.getElementById('hit2');
    window.addEventListener('load', function () { pointFingerAt(hit1, { onMain: true }); });
    hit1.addEventListener('click', function () {
      clearFingers();
      hit1.classList.remove('gn-hl');
      document.getElementById('toast').classList.remove('gn-off');
      setTimeout(function () {
        document.getElementById('toast').classList.add('gn-off');
        hit2.classList.add('is-ready');
        pointFingerAt(hit2, { onMain: true, dx: 4, dy: -34, w: 80 });
      }, 3000);
    });
  })();
  </script>
