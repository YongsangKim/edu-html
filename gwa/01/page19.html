<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내가 모은 데이터로 AI에게 질문하기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        main{position:absolute;left:0;top:120px;width:1920px;height:960px;background:url('img/p19_bg.png') no-repeat}
        /* 기획서 29p: 링크복사 후 복사 완료 3초, 그다음 백그라운드 아이콘 — 강조 위치가 두 군데라 순서대로 눌러야 다음으로 넘어감 */
        .p-hit{position:absolute;border-radius:14px}
        .p-hit.is-off{display:none}
        .p-hit-1{left:741px;top:724px;width:155px;height:67px}
        .p-hit-2{left:784px;top:862px;width:69px;height:67px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main>
          <a href="javascript:;" class="js-sfx p-hit p-hit-1" id="hit1" data-sound="sound/click.mp3" aria-label="첫 번째 단계"></a>
          <a href="page20.html" class="js-nav-effect js-sfx p-hit p-hit-2 is-off" id="hit2" data-sound="sound/click.mp3" aria-label="두 번째 단계"></a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="내가 모은 데이터로 AI에게 질문하기" data-next="page20.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  /* 첫 번째 영역을 누른 뒤 3000ms가 지나야 두 번째 영역이 열림(기획서의 단계 순서) */
  (function () {
    var hit1 = document.getElementById('hit1');
    var hit2 = document.getElementById('hit2');
    hit1.addEventListener('click', function () {
      hit1.classList.add('is-off');
      setTimeout(function () { hit2.classList.remove('is-off'); }, 3000);
    });
  })();
  </script>
</body>
</html>
