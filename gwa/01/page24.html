<body>

          <div class="phone-frame gn-phone">
<div class="gn-screen">

            <div class="gn-bar"><span>←</span><em>내가 모은 데이터로 AI에게 질문하기</em><span><img class="gn-ico" src="img/src_icon_share.png" alt="공유"></span><span>⋮</span></div>
            <div class="gn-act" style="position:absolute;left:0;right:0;top:118px">⧉ <span>👍</span> <span>👎</span></div>
            <div class="gn-audio" style="position:absolute;left:0;right:0;top:166px"><img src="img/src_icon_aiaudio.png" alt="">AI 오디오 오버뷰</div>
            <div style="position:absolute;left:0;right:0;top:230px"><div style="display:flex;gap:10px;margin:0 14px"><span class="gn-chip">오늘 지역별 강수량과<br>소나기 예보를 자세히 알려줘</span><span class="gn-chip">현재 기온 현황과 남부지방의<br>폭염 특보 상황이 궁금해</span></div></div>
            <p class="gn-disc" style="position:absolute;left:0;right:0;top:356px">Gemini Notebook은 부정확할 수 있으므로 다시 한번 확인하세요.</p>
            <div class="p24-input"><span id="p24Text"></span><div class="p24-count"><span>🗂️ 2 ▾</span><b>➤</b></div></div>
            <div class="gn-kbd">
              <div class="gn-kbd-top"><span>☺</span><span>⌨</span><span>▤</span><span>⚙</span><span>⋯</span></div>
              <div class="gn-keys">
                <span class="gn-key"><i>1</i>ㅣ</span><span class="gn-key"><i>2</i>·</span><span class="gn-key"><i>3</i>ㅡ</span><span class="gn-key"><i></i>⌫</span>
                <span class="gn-key"><i>4</i>ㄱㅋ</span><span class="gn-key"><i>5</i>ㄴㄹ</span><span class="gn-key"><i>6</i>ㄷㅌ</span><span class="gn-key"><i></i>↵</span>
                <span class="gn-key"><i>7</i>ㅂㅍ</span><span class="gn-key"><i>8</i>ㅅㅎ</span><span class="gn-key"><i>9</i>ㅈㅊ</span><span class="gn-key"><i></i>.,?!</span>
                <span class="gn-key"><i></i>!#1</span><span class="gn-key"><i></i>한/영</span><span class="gn-key"><i></i>ㅇㅁ</span><span class="gn-key"><i></i>␣</span>
              </div>
            </div>
          </div>
          </div>
          <div class="p24-panel">
            <h3>프롬프트 선택하기</h3>
            <button class="p24-opt" id="p24Opt1"></button>
            <button class="p24-opt" id="p24Opt2"></button>

  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="내가 모은 데이터로 AI에게 질문하기" data-next="page25.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const STEPS = [
      { options: ['첨부한 신문 기사와 동영상에서'], action: '다음' },
      { options: ['서울의 최고 기온을', '오후 날씨 상태를'], action: '다음' },
      { options: ['가르쳐 줘.', '요약해 줘.'], action: '입력 완료' },
    ];
  
    const opt1 = document.getElementById('p24Opt1');
    const opt2 = document.getElementById('p24Opt2');
    const act = document.getElementById('p24Act');
    const text = document.getElementById('p24Text');
  
    let step = 0;
    const picked = [];
  
    function render() {
      const s = STEPS[step];
      opt1.textContent = s.options[0];
      opt2.textContent = s.options[1] || '';
      opt2.style.display = s.options[1] ? '' : 'none';
      opt1.classList.remove('is-on');
      opt2.classList.remove('is-on');
      act.textContent = s.action;
      act.classList.add('is-disabled');
      renderText();
      clearFingers();
    }
  
    function renderText() {
      text.textContent = picked.join(' ');
    }
  
    [opt1, opt2].forEach((btn) => {
      btn.addEventListener('click', () => {
        opt1.classList.toggle('is-on', btn === opt1);
        opt2.classList.toggle('is-on', btn === opt2);
        picked[step] = btn.textContent;
        renderText();
        act.classList.remove('is-disabled');
        clearFingers();
        pointFingerAt(act);
        playClick();
      });
    });
  
    act.addEventListener('click', () => {
      playClick();
      if (step < STEPS.length - 1) {
        step += 1;
        render();
        return;
      }
      try {
        sessionStorage.setItem('gwa01_prompt', picked.join(' '));
      } catch (err) { /* sessionStorage를 못 쓰는 환경이면 무시 */ }
      setTimeout(() => navigateTo('page25.html'), 300);
    });
  
    render();
  })();
  </script>
</body>
