<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내가 모은 데이터로 AI에게 질문하기</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        main{position:absolute;left:0;top:120px;width:1920px;height:960px;background:url('img/p14_bg.png') no-repeat}

        /* 안내 말풍선은 7초 뒤 문구가 바뀌므로 배경에 그려진 자리를 덮고 다시 그림
           (좌표는 디자인에서 측정한 값) */
        .p-bubble{position:absolute;left:185px;top:123px;width:505px;height:228px;background:#fff;
          border:6px solid #3b1e87;border-radius:26px;box-sizing:border-box;
          display:flex;align-items:center;justify-content:center;text-align:center;padding:0 24px}
        .p-bubble span{font-family:'Cafe24 Ssurround';font-size:46px;line-height:1.3;color:#3b1e87;letter-spacing:-0.04em}

        /* 로딩이 끝나기 전에는 클릭 영역이 열리지 않음 */
        .p-hit{position:absolute;left:900px;top:767px;width:145px;height:58px;border-radius:14px}
        .p-hit.is-off{display:none}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main>
          <div class="p-bubble"><span id="bubbleText">Gemini Notebook에<br>날씨 뉴스 이미지가<br>업로드 중이에요..</span></div>
          <a href="page15.html" class="js-nav-effect js-sfx p-hit is-off" id="hit" data-sound="sound/click.mp3" aria-label="다음 단계"></a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="내가 모은 데이터로 AI에게 질문하기" data-next="page15.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  /* 기획서: 업로드 로딩 7초가 지나면 안내 문구가 바뀌고, 그 뒤에야 다음 위치를 누를 수 있음 */
  (function () {
    setTimeout(function () {
      document.getElementById('bubbleText').innerHTML = 'Gemini Notebook에 날씨 뉴스<br>이미지가 업로드 되었어요!<br>이제 유튜브 링크를 추가해볼까요?';
      setTimeout(function () { document.getElementById('hit').classList.remove('is-off'); }, 1000);
    }, 7000);
  })();
  </script>
</body>
</html>
