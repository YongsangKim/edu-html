<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정답을 부탁해!</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        .ask-pill.p14-pill{left:810px;top:78px;width:966px;min-height:104px;font-size:72px}
        .p14-mail{left:72px;top:247px;width:1053px;height:490px}
        .p14-weather{left:1144px;top:247px;width:730px;height:490px}
        .p14-subject{position:absolute;left:365px;top:327px;height:50px;display:flex;align-items:center;gap:22px;font-family:'Pretendard';font-size:27px;font-weight:700;color:#202124;white-space:nowrap}
        .p14-subject em{display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 9px;border-radius:5px;background:#e8eaed;font-style:normal;font-size:16px;color:#444}
        .card-btn.p14-ans{position:absolute;top:765px;width:862px;height:130px;box-sizing:border-box;margin:0;cursor:pointer;padding:12px 20px 6px;display:flex;align-items:center;justify-content:center;min-width:0;font-size:58px;line-height:1.2;word-break:keep-all}
        .card-btn.p14-ans.is-wrong{animation:fix-word-shake .3s ease}
        .p14-ans-1{left:80px}
        .p14-ans-2{left:1010px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">

          <p class="ask-pill p14-pill">어떤 답을 알려줘야 할까요?</p>

          <div class="gm-frame p14-mail"><img src="img/p14_mail.jpg" alt="의뢰 메일"></div>
          <div class="p14-subject"><span id="p14Subject"></span><em>받은편지함 <span>×</span></em></div>
          <div class="gm-frame p14-weather"><img src="img/p14_weather.jpg" alt="전국 날씨"></div>

          <div class="gm-time" id="p14Clock"><div><span class="gm-ampm">AM</span><b class="gm-digits"><i>09:00</i></b></div></div>

          <button class="card-btn p14-ans p14-ans-1" id="p14Ans1"></button>
          <button class="card-btn p14-ans p14-ans-2" id="p14Ans2"></button>

          <div class="avatar-modal is-off" id="p14Wrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text is-small">날씨 자료를 다시 살펴볼까요?</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="정답을 부탁해!" data-next="page15.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  (function () {
    const MAILS = [
      { q: '부산의 기온은 어떻게 될까요?',
        answers: ['20도입니다.', '27도입니다.'], correct: 0 },
      { q: '서울의 날씨는 어떻게 될까요?',
        answers: ['맑아요.', '비가 와요.'], correct: 0 },
      { q: '제주도로 소풍을 가려고 하는데, 우산이 필요할까요?',
        answers: ['아니요. 우산이 필요 없어요.', '비가 올 예정이라 우산이 필요해요.'], correct: 0 },
      { q: '대구와 제주 중 더 따뜻한 곳은 어디일까요?',
        answers: ['대구입니다.', '제주입니다.'], correct: 0 },
      { q: '기온이 가장 낮은 곳은 어디일까요?',
        answers: ['부산입니다.', '서울입니다.'], correct: 0 },
    ];

    const CLOCK = [['AM', '09:00'], ['AM', '11:00'], ['PM', '01:00'], ['PM', '03:00'], ['PM', '05:00'], ['PM', '06:00']];

    const subjectEl = document.getElementById('p14Subject');
    const clockEl = document.getElementById('p14Clock');
    const ans1 = document.getElementById('p14Ans1');
    const ans2 = document.getElementById('p14Ans2');
    const wrongModal = document.getElementById('p14Wrong');

    const queue = shuffleArray(MAILS);
    let index = 0;
    let locked = false;

    function render() {
      ans1.blur();
      ans2.blur();
      ans1.classList.remove('is-selected');
      ans2.classList.remove('is-selected');
      const m = queue[index];
      subjectEl.textContent = m.q;
      ans1.textContent = m.answers[0];
      ans2.textContent = m.answers[1];
      locked = false;
    }

    [ans1, ans2].forEach((btn, i) => {
      btn.addEventListener('click', () => {
        if (locked) return;
        const m = queue[index];
        btn.classList.add('is-selected');

        if (i === m.correct) {
          locked = true;
          playCorrect();
          index += 1;
          const t = CLOCK[Math.min(index, CLOCK.length - 1)];
          gmTimeSet(clockEl, t[0], t[1], true);
          setTimeout(() => {
            if (index >= queue.length) {
              navigateTo('page15.html');
              return;
            }
            render();
          }, 900);
          return;
        }

        playWrong();
        btn.classList.remove('is-wrong');
        void btn.offsetWidth;
        btn.classList.add('is-wrong');
        wrongModal.classList.remove('is-off');
        clearTimeout(wrongModal.__hideTimer);
        wrongModal.__hideTimer = setTimeout(() => {
          wrongModal.classList.add('is-off');
          btn.classList.remove('is-selected');
        }, 2000);
      });
    });

    render();
  })();
  </script>
</body>
</html>
