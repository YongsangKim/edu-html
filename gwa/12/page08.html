<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canva로 완성하는 달리기 순서도</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        .p08-ph{position:absolute;left:735px;top:20px;--pulse-w:6px}
        .p08 .app-home,.p08 .cv-sheet,.p08-body{display:none}
        .p08 .cv[data-screen="home"] .app-home{display:block}
        .p08 .cv[data-screen="elements"] .cv-sheet{display:block}
        .p08 .cv[data-screen="edit"] .p08-body,.p08 .cv[data-screen="elements"] .p08-body{display:block}
        .cv[data-screen="home"] .cv-top,.cv[data-screen="home"] .cv-tabs{display:none}
        .cv[data-screen="home"]>.phone-screen>.phone-status{color:#111}
        .cv[data-screen="home"]>.phone-screen>.phone-status em{background:#333;color:#fff}
        .cv[data-screen="home"]>.phone-screen>.phone-nav{display:none}
        .p08 .cv.has-nav .cv-sheet{top:60px}

        .p08-body{position:absolute;left:0;right:0;top:104px;bottom:145px;background:#b0bfd3}
        .p08-page{position:absolute;left:0;top:40px;width:538px;height:700px;background:#fff}
        .p08-dots{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:8px;padding:8px 14px;border-radius:20px;background:#e9ebf3}
        .p08-dots i{width:30px;height:12px;border-radius:6px;background:#a9acb5}
        .p08-dots i+i{width:12px;background:#d4d6dc}
        .p08-svg{display:block}
        .p08-zone{position:absolute;pointer-events:none;box-sizing:border-box}
        .p08-n.hl{filter:url(#p08gl)}
        .p08-n.hl .sh{stroke:#ffcc00;stroke-width:10}
        .p08-n.hl .ln{stroke-width:9}
        .p08-n.p08-pop{transform-box:fill-box;transform-origin:center;animation:p08-pop .45s ease-out}
        @keyframes p08-pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
        .p08-n.p08-blink .sh{animation:p08-bl 1s ease-in-out infinite}
        @keyframes p08-bl{50%{stroke:#ff2fc2;stroke-width:9}}
        .p08-blinkg{animation:p08-fd 1s ease-in-out infinite}
        @keyframes p08-fd{50%{opacity:.35}}

        .p08-cats{position:absolute;left:16px;top:150px;width:calc(100% - 32px)}
        .p08-cats>div{padding:6px 0 4px;border-radius:16px}
        .p08-cats>div[data-hit]{cursor:pointer}

        .p08-rp{position:absolute;left:1300px;top:60px;width:560px;height:840px;box-sizing:border-box;border-radius:30px;background:#266cc8;padding:30px}
        .p08-rp-in{position:relative;width:100%;height:100%;border-radius:24px;background:var(--c-white)}
        .p08-head{position:absolute;left:22px;top:16px;margin:0;display:flex;align-items:center;gap:8px;font-family:'Pretendard';font-size:24px;color:#6b6d7c}
        .p08-head svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
        .p08-list{position:absolute;left:0;right:0;top:64px;display:flex;flex-direction:column;align-items:center;gap:24px}
        .p08-it{position:relative;width:240px;box-sizing:border-box;padding:6px;border-radius:16px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
        .p08-it svg{display:block;width:100%;height:auto;pointer-events:none}
        .p08-it.is-text{position:absolute;left:80px;top:340px;width:340px;height:100px;padding:0;display:flex;align-items:center;justify-content:center;border:solid 4px var(--c-ink);background:var(--c-white);font-family:'Cafe24 Ssurround';font-size:44px;color:var(--c-ink);letter-spacing:-0.04em}
        .p08-ghost{position:absolute;z-index:60;pointer-events:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
        .p08-ghost.is-text{position:absolute}

        .p08-track{position:absolute;left:50px;top:170px;width:400px;height:440px;box-sizing:border-box;border:solid 60px #e9774f;border-radius:200px;box-shadow:inset 0 0 0 4px #fff,0 0 0 4px #fff}
        .p08-track:after{content:'';position:absolute;inset:-34px;border:dashed 4px #fff;border-radius:230px}
        .p08-runner{position:absolute;left:0;top:0;width:110px;height:110px;display:flex;align-items:center;justify-content:center;font-size:96px;line-height:1}

        .p08-tags{position:absolute;left:0;right:0;top:120px;display:flex;flex-direction:column;align-items:center;gap:80px}
        .p08-tag{margin:0;width:300px;height:120px;display:flex;align-items:center;justify-content:center;padding-top:6px;box-sizing:border-box;border:solid 6px var(--c-ink);border-radius:60px;font-family:'Cafe24 Ssurround';font-size:64px;color:var(--c-ink);opacity:.25;transition:opacity .3s}
        .p08-tag.is-on{opacity:1;background:#ffe96b}
        .p08-tag.p08-pop{animation:p08-tp .4s ease-out}
        @keyframes p08-tp{0%{transform:scale(.7)}60%{transform:scale(1.1)}100%{transform:scale(1)}}

        .p08-trophy{display:flex;align-items:center;justify-content:center;width:305px;height:305px;font-size:210px;line-height:1}
        .p08-hide{display:none!important}
        .guide-set#p08Set{top:40px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default p08">
          <div class="guide-set is-main" id="p08Set">
            <p class="guide-bubble is-center" id="p08Bubble"></p>
            <div class="guide-character"><img id="p08Char" src="../img/character/gwa_main.png" alt="메인 캐릭터"></div>
          </div>

          <div class="phone-frame has-cam cv has-nav is-edited p08-ph" id="p08Phone" data-screen="home">
            <div class="phone-screen">
              <div class="phone-status"><span>11:56</span><span class="sys"><i data-ic="mute"></i><i data-ic="wifi"></i><i data-ic="sig"></i><em>100</em></span></div>

              <div class="app-home is-purple">
                <button type="button" class="app-icon" id="p08Icon" data-hit="canva"><i><img src="../../resources/img/app/logo_canva.png" alt=""></i>Canva</button>
                <div class="phone-nav"><i></i><b></b><u></u></div>
              </div>

              <div class="cv-top">
                <i data-ic="home"></i>
                <i data-ic="undo" class="cv-undo"></i>
                <i data-ic="redo" class="cv-undo is-dim"></i>
                <span class="is-gap"></span>
                <i data-ic="dotsH"></i>
                <i data-ic="crownPro" style="color:#e3d8ff"></i>
                <i data-ic="download"></i>
                <i data-ic="out"></i>
              </div>

              <div class="p08-body">
                <div class="p08-page" id="p08Page"></div>
                <div class="p08-dots"><i></i><i></i></div>
              </div>

              <div class="cv-sheet">
                <div class="cv-search"><i data-ic="plus"></i><span class="cv-search-text">요소를 검색하세요</span><i data-ic="mic"></i></div>
                <p class="cv-h" style="top:118px">카테고리 둘러보기</p>
                <div class="cv-cats p08-cats">
                  <div><i style="background:linear-gradient(135deg,#ffc83d,#f59a23)">▤</i>스티커 메모</div>
                  <div id="p08Shape" data-hit="shape"><i style="background:linear-gradient(135deg,#31c6c0,#1a98a8)">◆</i>도형</div>
                  <div><i style="background:linear-gradient(135deg,#ff9f45,#f06a2a)">✿</i>그래픽</div>
                  <div><i style="background:linear-gradient(135deg,#5ccf7a,#2f9e55)">☺</i>애니메이션</div>
                  <div><i style="background:linear-gradient(135deg,#c06cf5,#7b4ae6)">◆</i>3D</div>
                  <div><i style="background:linear-gradient(135deg,#6fd59a,#3aa86b)">☑</i>폼</div>
                  <div><i style="background:linear-gradient(135deg,#6aa8ff,#3c6fe0)">▣</i>사진</div>
                  <div><i style="background:linear-gradient(135deg,#e46cf0,#a33de0)">▶</i>동영상</div>
                  <div><i style="background:linear-gradient(135deg,#6aa8ff,#4a78e8)">▦</i>시트</div>
                  <div><i style="background:linear-gradient(135deg,#ff9f45,#ee5a1c)">▦</i>표</div>
                  <div><i style="background:linear-gradient(135deg,#5ed0d0,#3a9fc0)">▲</i>차트</div>
                  <div><i style="background:linear-gradient(135deg,#6fd59a,#3aa86b)">☁</i>프레임</div>
                </div>
              </div>

              <nav class="cv-tabs">
                <button type="button" class="cv-tab" data-icon="template"><i></i>추천 템플릿</button>
                <button type="button" class="cv-tab" id="p08Tab" data-tab="elements" data-hit="elements" data-icon="elements"><i></i>요소</button>
                <button type="button" class="cv-tab" data-icon="text"><i></i>텍스트</button>
                <button type="button" class="cv-tab" data-icon="gallery"><i></i>갤러리</button>
                <button type="button" class="cv-tab" data-icon="brand"><i></i>브랜드 센터</button>
                <button type="button" class="cv-tab" data-icon="upload"><i></i>업로드</button>
              </nav>
              <div class="phone-nav"></div>
            </div>
          </div>

          <div class="p08-rp"><div class="p08-rp-in" id="p08Panel"></div></div>

          <div class="avatar-modal is-off" id="p08Fin">
            <div class="avatar-card">
              <img class="avatar-card-avatar" src="../../resources/img/common/avatar_finish.png" alt="">
              <div class="avatar-card-body is-side"><p class="avatar-card-text">이제 퀴즈를 풀며 배운 내용을<br>확인해볼까요?</p></div>
              <a href="page09.html" class="js-nav-effect avatar-card-btn next-btn card-btn is-popup js-sfx" data-sound="sound/click.mp3">다음</a>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="Canva로 완성하는 달리기 순서도" data-next="page09.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script src="../../resources/js/box-edit.js"></script>
  <script>
  (function () {
    const INK = '#1b1640';
    const GRAY = '#ccc';
    const FONT = "font-family:'Cafe24 Ssurround'";
    const WRONG_DIA = '모양이 달라요. 흐리게 보이는 그림이랑 같은 걸 골라 봐요.';
    const WRONG_LOOP = '숨이 안 차면 달리기를 계속 할 수 있어요. 위로 되돌아가는 화살표로 반복할 수 있게 해주세요.';

    const STEPS = [
      { pose: 'smile_present', bubble: '달리기를 열심히 하다 숨이 차고 힘들어서 다시 걸어 본 적이 있죠?', next: true, screen: 'home' },
      { pose: 'smile_present', bubble: '오늘은 그 경험을 생각하며 캔바를 이용해서 달리기 순서도를 완성해 <br>볼 거예요.', next: true, screen: 'home' },
      { pose: 'wink_point2', bubble: 'Canva를 클릭하세요.', screen: 'home', hit: 'canva' },
      { pose: 'wink_present', bubble: '달리기를 할 때 숨이 안 차면 계속 달릴 수 있고, 숨이 차면 힘들어서 걷는<br>순서도예요.', next: true, screen: 'edit' },
      { pose: 'smile_present', bubble: '거의 다 그려져 있는데 가운데가 비었어요. 함께<br>완성해볼까요?', next: true, screen: 'edit' },
      { pose: 'wink_point3', bubble: '아래의 [요소] 버튼을 클릭하세요.', screen: 'edit', hit: 'elements' },
      { pose: 'wink_point4', bubble: '[도형] 을 클릭하세요.', screen: 'elements', hit: 'shape' },
      { pose: 'wink_point2', bubble: '[마름모] 를 달리기와 걷기 사이에 끌어 놓아요.', screen: 'edit', panel: 'shapes', hit: 'dia', slot: 'dia', wrong: WRONG_DIA },
      { pose: 'wink_point3', bubble: '새로 놓은 모양에 글자를 끌어 놓아요. 글자를 도형에 직접 쓸 수 도 있어요!', screen: 'edit', panel: 'text', hit: 'text', slot: 'text' },
      { pose: 'wink_point4', bubble: '회색 점선에 되돌아가는 화살표를 끌어 놓아 길을 이어요.', screen: 'edit', panel: 'shapes', hit: 'loop', slot: 'loop', wrong: WRONG_LOOP },
      { pose: 'wink_present', bubble: '완성한 순서도 대로 실행 한 모습을 확인해보세요.', screen: 'edit', panel: 'run', next: 'late' },
      { pose: 'smile_present', bubble: '순서도 한 장에 지금까지 배운 내용이 모두 들어있죠? 따로 배웠지만 코딩을 하다 보면 순차, 반복, 조건을 자주 볼 수<br>있답니다.', screen: 'edit', panel: 'tags', next: 'late' }
    ];
    const FG = { canva: [0, 0], elements: [0, 0], shape: [0, 0], dia: [0, 0], text: [0, 0], loop: [0, 0] };
    const HOT = { canva: [0, 0, 0, 0], elements: [0, 0, 0, 0], shape: [0, 0, 0, 0], dia: [0, 0, 0, 0], text: [0, 0, 0, 0], loop: [0, 0, 0, 0] };

    const bubble = $('p08Bubble');
    const say = initGuideSay({ bubble: bubble, img: $('p08Char'), set: $('p08Set') });
    const phone = $('p08Phone');
    const page = $('p08Page');
    const panel = $('p08Panel');
    let index = 0;
    let tok = 0;
    let pop = null;
    let drag = null;

    const later = (fn, ms, my) => setTimeout(() => { if (my === tok) fn(); }, ms);

    function flow(st, pop) {
      const T = (x, y, s, fs, c) => '<text x="' + x + '" y="' + y + '" text-anchor="middle" dominant-baseline="middle" style="' + FONT + ';font-size:' + (fs || 34) + 'px;fill:' + (c || INK) + ';letter-spacing:-1px;stroke:none">' + s + '</text>';
      const g = (id, inner, extra) => '<g class="p08-n' + (extra ? ' ' + extra : '') + (pop === id ? ' p08-pop' : '') + '" data-id="' + id + '">' + inner + '</g>';
      const oval = (y, s) => '<rect class="sh" x="160" y="' + y + '" width="180" height="64" rx="32" fill="#6dd36f" stroke="' + INK + '" stroke-width="5"/>' + T(250, y + 35, s);
      const box = (y, s) => '<rect class="sh" x="130" y="' + y + '" width="240" height="64" rx="10" fill="#4a83c6" stroke="' + INK + '" stroke-width="5"/>' + T(250, y + 35, s, 34, '#fff');
      const arrow = (y1, y2) => '<line class="ln" x1="250" y1="' + y1 + '" x2="250" y2="' + (y2 - 12) + '" stroke="' + INK + '" stroke-width="6"/><polygon points="238,' + (y2 - 14) + ' 262,' + (y2 - 14) + ' 250,' + y2 + '" fill="' + INK + '"/>';
      const DIA = '250,250 390,325 250,400 110,325';
      let s = '<svg class="p08-svg" width="538" height="700" viewBox="0 0 538 700"><defs><filter id="p08gl" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ffd400" flood-opacity="1"/></filter></defs>';
      s += g('start', oval(24, '시작')) + g('a1', arrow(88, 126));
      s += g('run', box(126, '달리기'), st.slot === 'loop' ? 'p08-blink' : '') + g('a2', arrow(190, 246));
      if (st.slot === 'dia') s += '<polygon points="' + DIA + '" fill="#ffd34d" fill-opacity=".28" stroke="' + GRAY + '" stroke-width="4" stroke-dasharray="12 8" stroke-linejoin="round"/>';
      if (st.dia) s += g('dia', '<polygon class="sh" points="' + DIA + '" fill="#ffd34d" stroke="' + INK + '" stroke-width="5" stroke-linejoin="round"/>' + (st.text ? T(250, 305, '숨이', 30) + T(250, 345, '차나요?', 30) : ''));
      s += g('a3', arrow(404, 460) + T(278, 432, '예', 28));
      s += g('walk', box(460, '걷기')) + g('a4', arrow(524, 580)) + g('end', oval(580, '끝'));
      if (st.slot === 'loop') s += '<g class="p08-blinkg"><polyline points="390,325 465,325 465,158 384,158" fill="none" stroke="#9aa0b3" stroke-width="6" stroke-dasharray="12 8"/><polygon points="384,146 384,170 370,158" fill="#9aa0b3"/></g>';
      if (st.loop) s += g('loop', '<polyline class="ln" points="390,325 465,325 465,158 384,158" fill="none" stroke="' + INK + '" stroke-width="6"/><polygon points="384,146 384,170 370,158" fill="' + INK + '"/>' + T(430, 350, '아니오', 24));
      s += '</svg>';
      const Z = { dia: 'left:100px;top:244px;width:300px;height:166px', text: 'left:100px;top:244px;width:300px;height:166px', loop: 'left:365px;top:140px;width:115px;height:195px' };
      if (st.slot) s += '<div class="p08-zone drop-zone" style="' + Z[st.slot] + '"></div>';
      return s;
    }

    const ITEM_SVG = {
      oval: '<svg viewBox="0 0 240 84"><rect x="4" y="4" width="232" height="76" rx="38" fill="#6dd36f"/></svg>',
      rect: '<svg viewBox="0 0 240 84"><rect x="4" y="4" width="232" height="76" rx="10" fill="#4a83c6"/></svg>',
      dia: '<svg viewBox="0 0 240 120"><polygon points="120,4 236,60 120,116 4,60" fill="#ffd34d" stroke-linejoin="round"/></svg>',
      loop: '<svg viewBox="0 0 240 110"><polyline points="34,92 206,92 206,26 64,26" fill="none" stroke="#1b1640" stroke-width="6"/><polygon points="62,12 62,40 38,26" fill="#1b1640"/></svg>',
      down: '<svg viewBox="0 0 240 110"><line x1="120" y1="6" x2="120" y2="78" stroke="#1b1640" stroke-width="6"/><polygon points="100,74 140,74 120,106" fill="#1b1640"/></svg>'
    };

    function panelHtml(s) {
      if (s.panel === 'shapes') {
        return '<p class="p08-head">' + ic('back') + '도형</p><div class="p08-list">' + ['oval', 'rect', 'dia', 'loop', 'down'].map((k) => '<div class="p08-it" data-k="' + k + '"' + (k === s.hit ? ' data-hit="' + k + '"' : '') + '>' + ITEM_SVG[k] + '</div>').join('') + '</div>';
      }
      if (s.panel === 'text') return '<div class="p08-it is-text" data-k="text" data-hit="text">숨이 차나요?</div>';
      if (s.panel === 'run') return '<div class="p08-track"></div><span class="p08-runner" id="p08Runner">🏃</span>';
      if (s.panel === 'tags') return '<div class="p08-tags"><p class="p08-tag">순차</p><p class="p08-tag">반복</p><p class="p08-tag">조건</p></div>';
      return '';
    }

    function setHl(ids) {
      page.querySelectorAll('.p08-n').forEach((n) => n.classList.toggle('hl', ids.indexOf(n.dataset.id) >= 0));
    }

    function guide() {
      clearFingers();
      const s = STEPS[index];
      if (!s.hit || s.next) return;
      const t = document.querySelector('[data-hit="' + s.hit + '"]');
      if (!t) return;
      BoxEdit.padEl(t, s.hit, HOT);
      pointFingerAt(t, BoxEdit.fgo(FG, s.hit, s.hit === 'canva' ? {} : { pulse: true }));
    }

    function cancelDrag() {
      if (!drag) return;
      drag.ghost.remove();
      drag.el.style.opacity = '';
      page.querySelectorAll('.p08-zone').forEach((z) => z.classList.remove('is-over'));
      drag = null;
    }

    function nearZone(ghost, sc) {
      const z = page.querySelector('.p08-zone');
      if (!z) return null;
      const zr = z.getBoundingClientRect();
      const g = ghost.getBoundingClientRect();
      const cx = g.left + g.width / 2, cy = g.top + g.height / 2, pad = 40 * sc;
      return cx > zr.left - pad && cx < zr.right + pad && cy > zr.top - pad && cy < zr.bottom + pad ? z : null;
    }

    function bindDrag(el) {
      el.addEventListener('pointerdown', (e) => {
        if (BoxEdit.on || drag || e.button > 0) return;
        e.preventDefault();
        const main = document.querySelector('main');
        const mr = main.getBoundingClientRect();
        const sc = mr.width / 1920;
        const r = el.getBoundingClientRect();
        const ghost = el.cloneNode(true);
        ghost.classList.remove('hit-pulse');
        ghost.removeAttribute('data-hit');
        ghost.classList.add('p08-ghost');
        ghost.querySelectorAll('hit-pad').forEach((p) => p.remove());
        const L = (r.left - mr.left) / sc, T = (r.top - mr.top) / sc;
        ghost.style.cssText = 'left:' + L + 'px;top:' + T + 'px;width:' + r.width / sc + 'px;height:' + r.height / sc + 'px';
        main.appendChild(ghost);
        el.style.opacity = '.35';
        clearFingers();
        el.setPointerCapture(e.pointerId);
        drag = { el: el, ghost: ghost, sx: e.clientX, sy: e.clientY, L: L, T: T, sc: sc };
      });
      el.addEventListener('pointermove', (e) => {
        if (!drag || drag.el !== el) return;
        drag.ghost.style.left = drag.L + (e.clientX - drag.sx) / drag.sc + 'px';
        drag.ghost.style.top = drag.T + (e.clientY - drag.sy) / drag.sc + 'px';
        const z = page.querySelector('.p08-zone');
        if (z) z.classList.toggle('is-over', !!nearZone(drag.ghost, drag.sc));
      });
      el.addEventListener('pointerup', () => {
        if (!drag || drag.el !== el) return;
        const s = STEPS[index];
        const near = nearZone(drag.ghost, drag.sc);
        const key = el.dataset.k;
        cancelDrag();
        if (near && key === s.hit) {
          pop = s.slot === 'text' ? 'dia' : s.slot;
          playClick();
          go();
          return;
        }
        if (near && s.wrong) {
          playWrong();
          say(s.wrong, 'wink_present');
        }
        guide();
      });
      el.addEventListener('pointercancel', () => {
        if (!drag || drag.el !== el) return;
        cancelDrag();
        guide();
      });
    }

    function showNextBtn() {
      const btn = bubble.querySelector('.card-btn');
      if (btn) {
        btn.style.opacity = '';
        btn.style.visibility = '';
        btn.style.pointerEvents = '';
      }
    }

    function runSeq(my) {
      const SEQ = ['start', 'a1', 'run', 'a2', 'dia', 'loop', 'run', 'a2', 'dia', 'loop', 'run', 'a2', 'dia', 'a3', 'walk', 'a4', 'end'];
      const runner = $('p08Runner');
      const L = 80 + 2 * Math.PI * 170, ARC = Math.PI * 170;
      let pos = 0, speed = 0, last = 0;
      const place = () => {
        const d = pos * L;
        let x, y, a;
        if (d < 40) { x = 80; y = 410 - d; }
        else if (d < 40 + ARC) { a = Math.PI + (d - 40) / 170; x = 250 + 170 * Math.cos(a); y = 370 + 170 * Math.sin(a); }
        else if (d < 80 + ARC) { x = 420; y = 370 + (d - 40 - ARC); }
        else { a = (d - 80 - ARC) / 170; x = 250 + 170 * Math.cos(a); y = 410 + 170 * Math.sin(a); }
        runner.style.left = (x - 55) + 'px';
        runner.style.top = (y - 55) + 'px';
      };
      const frame = (ts) => {
        if (my !== tok) return;
        if (last) pos = (pos + speed * (ts - last) / 1000) % 1;
        last = ts;
        place();
        requestAnimationFrame(frame);
      };
      place();
      requestAnimationFrame(frame);
      SEQ.forEach((id, i) => later(() => {
        setHl([id]);
        if (i === 2) speed = 0.28;
        if (i === 12) { runner.textContent = '🥵'; speed = 0.1; }
        if (i === 14) { runner.textContent = '🚶'; speed = 0.07; }
        if (i === 16) speed = 0;
      }, 500 + i * 800, my));
      later(() => {
        setHl([]);
        showNextBtn();
      }, 500 + SEQ.length * 800 + 500, my);
    }

    function tagSeq(my) {
      const tags = Array.from(panel.querySelectorAll('.p08-tag'));
      const PARTS = [[['start', 'a1', 'run', 'a2'], 0], [['dia', 'a3'], 2], [['loop'], 1]];
      PARTS.forEach((p, i) => {
        later(() => setHl(p[0]), 700 + i * 2000, my);
        later(() => { tags[p[1]].classList.add('is-on', 'p08-pop'); playClick(); }, 1200 + i * 2000, my);
      });
      later(() => {
        setHl([]);
        showNextBtn();
      }, 700 + PARTS.length * 2000, my);
    }

    function render() {
      const s = STEPS[index];
      const my = ++tok;
      const popNow = pop;
      pop = null;
      cancelAppLaunch();
      cancelDrag();
      clearFingers();
      const withNext = !!s.next;
      say(s.bubble, s.pose, undefined, undefined, withNext ? '다음' : undefined);
      const nextBtn = bubble.querySelector('.card-btn');
      if (nextBtn) {
        if (s.next === 'late' && !BoxEdit.on) {
          nextBtn.style.opacity = '0';
          nextBtn.style.visibility = 'hidden';
          nextBtn.style.pointerEvents = 'none';
          nextBtn.style.transition = 'none';
        } else {
          nextBtn.style.opacity = '';
          nextBtn.style.visibility = '';
          nextBtn.style.pointerEvents = '';
          nextBtn.style.transition = '';
        }
      }
      phone.dataset.screen = s.screen;
      $('p08Tab').classList.toggle('is-on', s.screen === 'elements');
      page.innerHTML = flow({ dia: index >= 8, text: index >= 9, loop: index >= 10, slot: s.slot }, popNow);
      panel.innerHTML = panelHtml(s);
      $('p08Fin').classList.toggle('is-off', !s.fin);
      panel.querySelectorAll('.p08-it').forEach(bindDrag);
      if (s.panel === 'tags' && s.fin) panel.querySelectorAll('.p08-tag').forEach((t) => t.classList.add('is-on'));
      guide();
      if (s.panel === 'run') runSeq(my);
      if (s.panel === 'tags' && !s.fin) tagSeq(my);
    }

    function go() {
      index += 1;
      BoxEdit.syncStep(index + 1);
      render();
    }

    const onHit = (el, key, fn) => el.addEventListener('click', () => {
      if (BoxEdit.on || STEPS[index].hit !== key) return;
      playClick();
      fn();
    });
    onHit($('p08Icon'), 'canva', () => {
      clearFingers();
      playAppLaunch({ icon: $('p08Icon'), text: 'Canva', logo: ASSET_BASE + 'img/app/logo_canva.png', colors: ['#00c4cc', '#7d2ae8', '#c9b3ff'], onMid: go });
    });
    onHit($('p08Tab'), 'elements', go);
    onHit($('p08Shape'), 'shape', go);

    bubble.addEventListener('click', (e) => {
      if (!e.target.closest('.card-btn') || BoxEdit.on) return;
      playClick();
      if (index >= STEPS.length - 1) {
        $('p08Fin').classList.remove('is-off');
      } else {
        go();
      }
    });

    BoxEdit.hitPad(Array.from(phone.querySelectorAll('[data-hit]')), HOT);
    BoxEdit.stepEdit({
      key: () => STEPS[index].hit || '?',
      count: STEPS.length + 1,
      get: () => index + 1,
      set: (n) => { index = Math.max(0, Math.min(n, STEPS.length) - 1); },
      go: (n) => { if (n < 1) return; index = n - 1; BoxEdit.syncStep(n); render(); },
      label: (n) => '단계 ' + n + ' / ' + STEPS.length,
      say, bubble, img: $('p08Char')
    });
    render();
  })();
  </script>
</body>
</html>
