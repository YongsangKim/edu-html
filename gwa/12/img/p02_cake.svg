<!-- 고품질 2단 딸기 생크림 생일 케이크 (입체감과 광택이 살아있는 일러스트) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380">
  <defs>
    <!-- 접시 그라데이션 -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e3f2fd"/>
      <stop offset="60%" stop-color="#bbdefb"/>
      <stop offset="100%" stop-color="#90caf9"/>
    </linearGradient>
    <!-- 케이크 스폰지 빵 그라데이션 -->
    <linearGradient id="spongeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="35%" stop-color="#ffe0b2"/>
      <stop offset="42%" stop-color="#ff80ab"/>
      <stop offset="52%" stop-color="#ff4081"/>
      <stop offset="60%" stop-color="#ffe0b2"/>
      <stop offset="100%" stop-color="#ffcc80"/>
    </linearGradient>
    <!-- 화이트 생크림 광택 -->
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f5efe6"/>
    </linearGradient>
    <!-- 딸기 그라데이션 -->
    <radialGradient id="strawberryGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="65%" stop-color="#d50000"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </radialGradient>
    <!-- 블루베리 그라데이션 -->
    <radialGradient id="berryGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="70%" stop-color="#311b92"/>
      <stop offset="100%" stop-color="#1a237e"/>
    </radialGradient>
    <!-- 그림자 필터 -->
    <filter id="cakeShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#2b3a55" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- 도자기 케이크 스탠드 접시 -->
  <g filter="url(#cakeShadow)">
    <ellipse cx="280" cy="330" rx="260" ry="36" fill="url(#plateGrad)" stroke="#2b3a55" stroke-width="7"/>
    <ellipse cx="280" cy="326" rx="240" ry="26" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- 케이크 본체 (둥근 원통형 입체) -->
  <g filter="url(#cakeShadow)">
    <!-- 빵 몸체 -->
    <path d="M50,150 L50,290 C50,335 510,335 510,290 L510,150 Z" fill="url(#spongeGrad)" stroke="#2b3a55" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- 흘러내리는 풍성한 생크림 드리핑 (상단 크림) -->
    <path d="M50,150 
             C50,180 80,210 100,185 
             C120,160 140,230 170,230 
             C195,230 210,175 235,175 
             C255,175 270,240 300,240 
             C330,240 345,170 370,170 
             C395,170 410,225 435,225 
             C460,225 480,175 510,175 
             L510,150 
             C510,100 50,100 50,150 Z" 
          fill="url(#creamGrad)" stroke="#2b3a55" stroke-width="7" stroke-linejoin="round"/>
    
    <!-- 케이크 윗면 타원 (크림 윗면) -->
    <ellipse cx="280" cy="145" rx="230" ry="46" fill="#ffffff" stroke="#2b3a55" stroke-width="7"/>
    <!-- 안쪽 하이라이트 -->
    <ellipse cx="280" cy="142" rx="205" ry="34" fill="#fffdf9" opacity="0.9"/>
  </g>

  <!-- 상단 생딸기 & 블루베리 장식 -->
  <!-- 딸기 1 (왼쪽) -->
  <g transform="translate(100, 105)">
    <path d="M25,0 C42,0 50,25 40,48 C30,62 20,62 10,48 C0,25 8,0 25,0 Z" fill="url(#strawberryGrad)" stroke="#2b3a55" stroke-width="4"/>
    <ellipse cx="20" cy="18" rx="3" ry="5" fill="#fff" opacity="0.5"/>
    <!-- 꼭지 잎사귀 -->
    <path d="M25,0 L18,-8 L25,-4 L32,-8 Z" fill="#4caf50" stroke="#2b3a55" stroke-width="3"/>
  </g>
  <!-- 블루베리 1 -->
  <circle cx="165" cy="150" r="14" fill="url(#berryGrad)" stroke="#2b3a55" stroke-width="3"/>

  <!-- 딸기 2 -->
  <g transform="translate(190, 85)">
    <path d="M25,0 C42,0 50,25 40,48 C30,62 20,62 10,48 C0,25 8,0 25,0 Z" fill="url(#strawberryGrad)" stroke="#2b3a55" stroke-width="4"/>
    <ellipse cx="20" cy="18" rx="3" ry="5" fill="#fff" opacity="0.5"/>
    <path d="M25,0 L18,-8 L25,-4 L32,-8 Z" fill="#4caf50" stroke="#2b3a55" stroke-width="3"/>
  </g>

  <!-- 딸기 3 (중앙 메인 큰 딸기) -->
  <g transform="translate(280, 75) scale(1.15)">
    <path d="M25,0 C42,0 50,25 40,48 C30,62 20,62 10,48 C0,25 8,0 25,0 Z" fill="url(#strawberryGrad)" stroke="#2b3a55" stroke-width="4"/>
    <ellipse cx="20" cy="18" rx="3" ry="5" fill="#fff" opacity="0.5"/>
    <path d="M25,0 L18,-8 L25,-4 L32,-8 Z" fill="#4caf50" stroke="#2b3a55" stroke-width="3"/>
  </g>
  <!-- 블루베리 2 -->
  <circle cx="345" cy="145" r="14" fill="url(#berryGrad)" stroke="#2b3a55" stroke-width="3"/>

  <!-- 딸기 4 (오른쪽) -->
  <g transform="translate(390, 95)">
    <path d="M25,0 C42,0 50,25 40,48 C30,62 20,62 10,48 C0,25 8,0 25,0 Z" fill="url(#strawberryGrad)" stroke="#2b3a55" stroke-width="4"/>
    <ellipse cx="20" cy="18" rx="3" ry="5" fill="#fff" opacity="0.5"/>
    <path d="M25,0 L18,-8 L25,-4 L32,-8 Z" fill="#4caf50" stroke="#2b3a55" stroke-width="3"/>
  </g>
</svg>
