<!-- 고품질 바람 부는 소녀 캐릭터 (초등 학습 콘텐츠 톤앤매너) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 520" width="340" height="520">
  <defs>
    <!-- 머리카락 그라데이션 -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e342e"/>
      <stop offset="100%" stop-color="#2d1c18"/>
    </linearGradient>
    <!-- 옷 그라데이션 -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b388ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <!-- 바지 그라데이션 -->
    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80d8ff"/>
      <stop offset="100%" stop-color="#40c4ff"/>
    </linearGradient>
    <!-- 고깔모자 그라데이션 -->
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <filter id="charShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2b3a55" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#charShadow)">
    <!-- 뒤쪽 머리카락 묶음 -->
    <path d="M190,140 C260,150 250,260 210,270 C175,280 160,220 165,170 Z" fill="url(#hairGrad)" stroke="#2b3a55" stroke-width="6" stroke-linejoin="round"/>
    <!-- 머리끈 -->
    <ellipse cx="205" cy="185" rx="10" ry="16" fill="#ff4081" stroke="#2b3a55" stroke-width="4"/>

    <!-- 몸통: 멜빵 바지와 티셔츠 -->
    <!-- 티셔츠 소매 & 몸체 -->
    <path d="M130,270 C185,260 195,330 190,400 L95,400 C90,320 105,275 130,270 Z" fill="url(#shirtGrad)" stroke="#2b3a55" stroke-width="7" stroke-linejoin="round"/>
    
    <!-- 멜빵 바지 -->
    <path d="M100,345 L185,345 L180,410 L100,410 Z" fill="url(#pantsGrad)" stroke="#2b3a55" stroke-width="6"/>
    <!-- 멜빵 끈 -->
    <path d="M125,270 L120,345" stroke="#00b0ff" stroke-width="12" stroke-linecap="round"/>
    <path d="M125,270 L120,345" stroke="#2b3a55" stroke-width="4" stroke-linecap="round"/>
    <!-- 멜빵 단추 -->
    <circle cx="120" cy="342" r="5" fill="#ffd54f" stroke="#2b3a55" stroke-width="3"/>

    <!-- 다리 & 바지단 -->
    <path d="M100,410 L140,410 L135,485 L105,485 Z" fill="url(#pantsGrad)" stroke="#2b3a55" stroke-width="6" stroke-linejoin="round"/>
    <path d="M145,410 L180,410 L175,485 L145,485 Z" fill="url(#pantsGrad)" stroke="#2b3a55" stroke-width="6" stroke-linejoin="round"/>

    <!-- 귀여운 운동화 -->
    <!-- 뒤쪽 발 -->
    <ellipse cx="160" cy="492" rx="26" ry="14" fill="#ffffff" stroke="#2b3a55" stroke-width="6"/>
    <path d="M140,490 Q160,480 180,490" stroke="#ff4081" stroke-width="4"/>
    <!-- 앞쪽 발 -->
    <ellipse cx="118" cy="492" rx="26" ry="14" fill="#ffffff" stroke="#2b3a55" stroke-width="6"/>
    <path d="M98,490 Q118,480 138,490" stroke="#ff4081" stroke-width="4"/>

    <!-- 목 -->
    <rect x="135" y="240" width="28" height="35" rx="6" fill="#ffe0b2" stroke="#2b3a55" stroke-width="6"/>

    <!-- 귀여운 얼굴 (옆모습, 볼이 빵빵하게 부푼 모습) -->
    <!-- 기본 피부 베이스 -->
    <path d="M130,135 
             C175,120 200,165 195,215 
             C190,255 155,265 125,260 
             C95,255 75,230 75,200 
             C70,195 52,196 52,185 
             C52,175 75,170 80,160 
             C95,140 110,135 130,135 Z" 
          fill="#ffecb3" stroke="#2b3a55" stroke-width="7" stroke-linejoin="round"/>

    <!-- 귀 -->
    <ellipse cx="170" cy="200" rx="14" ry="18" fill="#ffecb3" stroke="#2b3a55" stroke-width="5"/>
    <path d="M167,195 Q174,200 168,206" stroke="#e0a96d" stroke-width="3" fill="none"/>

    <!-- 빵빵한 볼 홍조 (사랑스러운 핑크 치크) -->
    <ellipse cx="98" cy="205" rx="20" ry="15" fill="#ff80ab" opacity="0.6"/>

    <!-- 옆모습 지그시 감은 눈 (바람을 힘차게 뿜는 표정) -->
    <path d="M108,172 Q122,186 136,174" stroke="#2b3a55" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- 긴 속눈썹 -->
    <line x1="135" y1="172" x2="142" y2="167" stroke="#2b3a55" stroke-width="4" stroke-linecap="round"/>
    <!-- 눈썹 -->
    <path d="M102,156 Q120,150 135,155" stroke="#4e342e" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- 오므린 귀여운 입술 (후~~ 모양) -->
    <path d="M52,180 C40,183 40,193 52,196 C62,196 66,188 62,180 Z" fill="#ff5252" stroke="#2b3a55" stroke-width="4"/>
    <circle cx="48" cy="188" r="3" fill="#ffebee"/>

    <!-- 앞머리 & 옆머리 -->
    <path d="M120,135 C150,130 175,155 170,180 C155,160 135,160 115,165 Z" fill="url(#hairGrad)"/>
    <path d="M120,135 C100,150 90,175 95,200 C92,180 95,160 110,145 Z" fill="url(#hairGrad)"/>

    <!-- 모은 손 (가슴 앞에 주먹을 쥐고 응원하듯 쥔 포즈) -->
    <g transform="translate(110, 290)">
      <circle cx="16" cy="16" r="16" fill="#ffecb3" stroke="#2b3a55" stroke-width="6"/>
      <path d="M12,10 Q20,16 12,22" stroke="#e0a96d" stroke-width="3" fill="none"/>
    </g>

    <!-- 머리 위 생일 고깔 모자 -->
    <g transform="translate(130, 20)">
      <!-- 모자 삼각 뿔 -->
      <polygon points="10,110 50,15 75,115" fill="url(#hatGrad)" stroke="#2b3a55" stroke-width="6" stroke-linejoin="round"/>
      <!-- 모자 장식 스트라이프 -->
      <path d="M22,85 Q45,78 68,90" stroke="#ff4081" stroke-width="9" stroke-linecap="round"/>
      <path d="M32,55 Q50,50 60,60" stroke="#00e676" stroke-width="8" stroke-linecap="round"/>
      <!-- 모자 꼭대기 폼폼 방울 -->
      <circle cx="50" cy="15" r="16" fill="#ff5252" stroke="#2b3a55" stroke-width="5"/>
      <circle cx="46" cy="11" r="5" fill="#ffffff" opacity="0.8"/>
    </g>
  </g>
</svg>
