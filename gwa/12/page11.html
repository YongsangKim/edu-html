<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생일 선물 팔찌 만들기</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
<style>
/* 1. 좌측 순서도 패널 (유저 선호 유지 - 절대 변경 금지) */
.p11-fp{position:absolute;left:40px;top:40px;width:560px;height:880px;box-sizing:border-box;border-radius:30px;background:#266cc8;padding:20px;box-shadow:0 12px 24px rgba(38,108,200,0.25)}
.p11-fp-in{width:100%;height:100%;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center}

/* 2. 상단 진행도 & 카운터 알약 배지 */
.p11-cnt-wrap{position:absolute;left:630px;top:28px;height:72px;display:flex;align-items:center;gap:20px;padding:0 26px;border:solid 4px var(--c-navy);border-radius:36px;background:#fff;box-shadow:0 8px 16px rgba(0,0,0,0.08);box-sizing:border-box}
.p11-cnt-title{font-family:'Cafe24 Ssurround';font-size:26px;color:#266cc8;display:flex;align-items:center;gap:10px}
.p11-cnt-bead-badge{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 32%, #ffffff 0%, #ff7cb8 30%, #ff3b88 70%, #c40a55 100%);border:solid 2.5px #b0084c;box-shadow:0 3px 6px rgba(196,10,85,0.3)}
.p11-dots{display:flex;align-items:center;gap:10px}
.p11-dot{width:24px;height:24px;border-radius:50%;border:dashed 2.5px #b8c4d8;box-sizing:border-box;transition:all .3s cubic-bezier(0.34, 1.56, 0.64, 1)}
.p11-dot.is-filled{border:solid 2px #b0084c;background:radial-gradient(circle at 35% 32%, #ffffff 0%, #ff7cb8 30%, #ff3b88 70%, #c40a55 100%);box-shadow:0 2px 6px rgba(196,10,85,0.4);transform:scale(1.2)}
.p11-cnt-num{font-family:'Cafe24 Ssurround';font-size:32px;color:var(--c-ink);letter-spacing:-0.02em;margin-left:4px}
.p11-cnt-num span{color:#ff3b88}

/* 3. 중앙 공예 책상 작업대 */
.p11-desk{position:absolute;left:630px;top:118px;width:580px;height:790px;box-sizing:border-box;border-radius:36px;background:linear-gradient(145deg, #fffcf5 0%, #f6ecd8 100%);border:solid 6px #bf8e5c;box-shadow:0 16px 32px rgba(138,90,43,0.18), inset 0 2px 10px rgba(255,255,255,0.9);overflow:hidden}

/* 팔찌 실/스트링 영역 */
.p11-str-track{position:absolute;left:34px;top:40px;width:90px;height:710px;display:flex;flex-direction:column;align-items:center}
.p11-str-clip{width:56px;height:28px;border-radius:14px;background:#5a6882;border:solid 3px #2d3748;box-shadow:0 4px 6px rgba(0,0,0,0.2);position:relative;z-index:3}
.p11-str-clip::after{content:'';position:absolute;left:50%;top:50%;width:12px;height:12px;border-radius:50%;background:#e2e8f0;transform:translate(-50%,-50%)}
.p11-str{width:8px;height:660px;background:linear-gradient(180deg, #94a3b8 0%, #cbd5e1 50%, #94a3b8 100%);box-shadow:0 0 4px rgba(255,255,255,0.8);position:relative;transition:transform 1.1s cubic-bezier(0.4, 0, 0.2, 1), opacity .8s ease}
.p11-str .p11-bd{position:absolute;left:-26px;width:60px;height:60px}
.p11-str.is-sent{transform:translate(240px, 180px) scale(0.1);opacity:0}

/* 비즈 보관 트레이 */
.p11-tray{position:absolute;left:135px;top:40px;width:410px;height:350px;box-sizing:border-box;border-radius:32px;background:#ffffff;border:solid 5px #70a1e3;box-shadow:0 10px 24px rgba(38,108,200,0.15), inset 0 4px 12px rgba(240,246,255,0.8);padding:24px 20px;display:flex;flex-wrap:wrap;gap:14px 16px;align-content:flex-start}
.p11-tray-label{position:absolute;right:24px;top:-16px;background:#266cc8;color:#fff;font-family:'Cafe24 Ssurround';font-size:18px;padding:4px 16px;border-radius:14px;box-shadow:0 4px 8px rgba(38,108,200,0.3);letter-spacing:-0.03em}

/* 크리스탈 젤리 비즈 (유리알 광택 고도화) */
.p11-bd{width:56px;height:56px;border-radius:50%;box-sizing:border-box;position:relative;transition:transform .2s ease;box-shadow:0 6px 10px rgba(0,0,0,0.18), inset 0 -3px 5px rgba(0,0,0,0.25)}
.p11-bd::after{content:'';position:absolute;top:15%;left:22%;width:34%;height:24%;border-radius:50%;background:rgba(255,255,255,0.85);transform:rotate(-35deg);pointer-events:none}
.p11-bd.p{background:radial-gradient(circle at 35% 32%, #ffffff 0%, #ff7cb8 30%, #ff3b88 70%, #c40a55 100%);border:solid 2.5px #b0084c}
.p11-bd.b{background:radial-gradient(circle at 35% 32%, #ffffff 0%, #68b4ff 30%, #227bf0 70%, #0d4fa6 100%);border:solid 2.5px #0c4794}
.p11-bd.y{background:radial-gradient(circle at 35% 32%, #ffffff 0%, #ffe368 30%, #ffbe1a 70%, #cc7a00 100%);border:solid 2.5px #b36b00}

/* 캐릭터 손 애니메이션 */
.p11-hand-area{position:absolute;left:180px;top:440px;width:320px;height:330px;display:flex;align-items:center;justify-content:center;transition:transform .75s cubic-bezier(0.34, 1.2, 0.64, 1), opacity .5s ease}
.p11-hand-img{width:290px;height:auto;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(0,0,0,0.15));pointer-events:none}
.p11-hand-area .p11-bd{position:absolute;left:128px;top:105px;width:64px;height:64px;transform:scale(1.2);box-shadow:0 8px 16px rgba(0,0,0,0.3);z-index:2;animation:beadPop .35s ease-out}
@keyframes beadPop{0%{transform:scale(0.3);opacity:0}80%{transform:scale(1.3)}100%{transform:scale(1.2);opacity:1}}

/* 비즈 보관 트레이 */
.p11-tray{position:absolute;left:135px;top:40px;width:410px;height:350px;box-sizing:border-box;border-radius:32px;background:#ffffff;border:solid 5px #70a1e3;box-shadow:0 10px 24px rgba(38,108,200,0.15), inset 0 4px 12px rgba(240,246,255,0.8);padding:24px 20px;display:flex;flex-wrap:wrap;gap:14px 16px;align-content:flex-start;transition:opacity .5s ease}
.p11-tray-label{position:absolute;right:24px;top:-16px;background:#266cc8;color:#fff;font-family:'Cafe24 Ssurround';font-size:18px;padding:4px 16px;border-radius:14px;box-shadow:0 4px 8px rgba(38,108,200,0.3);letter-spacing:-0.03em}

/* 완성 시 트레이와 손 부드럽게 숨김 */
.p11-desk.is-finished .p11-tray,
.p11-desk.is-finished .p11-hand-area{opacity:0;pointer-events:none}

/* 완성 선물 상자 팝업 */
.p11-gift{position:absolute;left:50%;top:50%;width:500px;height:500px;margin-left:-250px;margin-top:-250px;z-index:20;opacity:0;transform:scale(0.3);pointer-events:none;transition:all .8s cubic-bezier(0.34, 1.56, 0.64, 1);display:flex;flex-direction:column;align-items:center;justify-content:center}
.p11-gift img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 20px 36px rgba(0,0,0,0.32))}
.p11-gift.is-on{opacity:1;transform:scale(1.08);pointer-events:auto}
.p11-gift-banner{position:absolute;bottom:15px;background:#ff3b88;color:#fff;font-family:'Cafe24 Ssurround';font-size:28px;padding:10px 28px;border-radius:24px;border:solid 4px #fff;box-shadow:0 8px 18px rgba(255,59,136,0.45);white-space:nowrap;animation:bannerBounce 1s infinite alternate ease-in-out}
@keyframes bannerBounce{0%{transform:translateY(0)}100%{transform:translateY(-8px)}}

/* 4. 우측 4개 동작 카드 그리드 (이모지 완전 퇴출 -> 고품질 PNG 아이콘 적용) */
.p11-cards{position:absolute;left:1245px;top:118px;width:635px;height:790px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.p11-card{background:#ffffff;border:solid 5px #266cc8;border-radius:32px;box-shadow:0 10px 0 #184b94, 0 16px 22px rgba(24,75,148,0.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px 10px;cursor:pointer;outline:none;transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;position:relative;user-select:none;-webkit-tap-highlight-color:transparent}
.p11-card:hover{transform:translateY(-4px);box-shadow:0 14px 0 #184b94, 0 20px 28px rgba(24,75,148,0.22);border-color:#1c59aa}
.p11-card:active{transform:translateY(6px);box-shadow:0 4px 0 #184b94, 0 8px 12px rgba(24,75,148,0.2)}
.p11-card-icon-wrap{width:160px;height:160px;display:flex;align-items:center;justify-content:center;background:#f3f7fd;border-radius:24px;border:solid 3px #d8e5f7;transition:transform .2s ease}
.p11-card:hover .p11-card-icon-wrap{transform:scale(1.06)}
.p11-card-icon-wrap img{max-width:130px;max-height:130px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.08))}
.p11-card-text{font-family:'Cafe24 Ssurround';font-size:34px;font-weight:400;color:var(--c-ink);letter-spacing:-0.04em;line-height:1.2;text-align:center}
</style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <!-- 좌측 순서도 패널 (유저 선호 유지) -->
          <div class="p11-fp"><div class="p11-fp-in" id="p11Chart"></div></div>

          <!-- 상단 진행도 & 끼운 구슬 카운터 -->
          <div class="p11-cnt-wrap">
            <div class="p11-cnt-title">
              <span class="p11-cnt-bead-badge"></span>
              <span>끼운 구슬</span>
            </div>
            <div class="p11-dots" id="p11Dots">
              <i class="p11-dot"></i><i class="p11-dot"></i><i class="p11-dot"></i><i class="p11-dot"></i><i class="p11-dot"></i>
              <i class="p11-dot"></i><i class="p11-dot"></i><i class="p11-dot"></i><i class="p11-dot"></i><i class="p11-dot"></i>
            </div>
            <div class="p11-cnt-num"><span id="p11N">0</span> / 10</div>
          </div>

          <!-- 중앙 비즈 공예 책상 작업대 -->
          <div class="p11-desk">
            <!-- 팔찌 줄 & 고정 클립 -->
            <div class="p11-str-track">
              <div class="p11-str-clip"></div>
              <div class="p11-str" id="p11Str"></div>
            </div>

            <!-- 비즈 보관 트레이 -->
            <div class="p11-tray" id="p11Tub">
              <span class="p11-tray-label">비즈 보관함</span>
            </div>

            <!-- 캐릭터 손 인터랙션 -->
            <div class="p11-hand-area" id="p11Hand">
              <img src="img/p11_hand_open.png" alt="손" class="p11-hand-img" id="p11HandImg">
            </div>

            <!-- 완성된 선물 상자 팝업 -->
            <div class="p11-gift" id="p11Gift">
              <img src="img/p11_gift_bracelet.png" alt="완성된 생일 선물 팔찌">
              <div class="p11-gift-banner">예쁜 팔찌 선물 완성!</div>
            </div>
          </div>

          <!-- 우측 4개 동작 카드 (이모지 대체 고품질 PNG 아이콘) -->
          <div class="p11-cards" id="p11Cards">
            <button class="p11-card" data-act="pick">
              <div class="p11-card-icon-wrap"><img src="img/p11_card_pick.png" alt="구슬 꺼내기"></div>
              <b class="p11-card-text">구슬 꺼내기</b>
            </button>
            <button class="p11-card" data-act="string">
              <div class="p11-card-icon-wrap"><img src="img/p11_card_string.png" alt="끈에 끼우기"></div>
              <b class="p11-card-text">끈에 끼우기</b>
            </button>
            <button class="p11-card" data-act="back">
              <div class="p11-card-icon-wrap"><img src="img/p11_card_back.png" alt="구슬 통에 다시 넣기"></div>
              <b class="p11-card-text">구슬 통에<br>다시 넣기</b>
            </button>
            <button class="p11-card" data-act="knot">
              <div class="p11-card-icon-wrap"><img src="img/p11_card_knot.png" alt="매듭 묶기"></div>
              <b class="p11-card-text">매듭 묶기</b>
            </button>
          </div>

          <!-- 오답 팝업 레이어 -->
          <div class="ox-result-wrong is-avatar is-off" id="p11Wrong" style="z-index:30">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">순서도를 다시 한번<br>살펴볼까요?</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="생일 선물 팔찌 만들기" data-next="page12.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
<script>
(function () {
  const F = "font-family:'Cafe24 Ssurround'";
  const INK = '#1b1640';
  const T = (x, y, s, fs, c) => '<text x="' + x + '" y="' + y + '" text-anchor="middle" dominant-baseline="middle" style="' + F + ';font-size:' + (fs || 34) + 'px;fill:' + (c || INK) + ';letter-spacing:-1px">' + s + '</text>';
  const stroke = (hl) => 'stroke="' + (hl ? '#ffcc00' : INK) + '" stroke-width="' + (hl ? 10 : 5) + '"';
  const glow = (svg, hl) => hl ? '<g filter="url(#gl)">' + svg + '</g>' : svg;
  const oval = (cx, y, w, s, hl) => glow('<rect x="' + (cx - w / 2) + '" y="' + y + '" width="' + w + '" height="64" rx="32" fill="#6dd36f" ' + stroke(hl) + '/>' + T(cx, y + 35, s), hl);
  const rect = (cx, y, w, s, hl) => glow('<rect x="' + (cx - w / 2) + '" y="' + y + '" width="' + w + '" height="64" rx="10" fill="#4a83c6" ' + stroke(hl) + '/>' + T(cx, y + 35, s, 34, '#fff'), hl);
  const dia = (cx, y, w, h, l1, l2, hl) => glow('<polygon points="' + cx + ',' + y + ' ' + (cx + w / 2) + ',' + (y + h / 2) + ' ' + cx + ',' + (y + h) + ' ' + (cx - w / 2) + ',' + (y + h / 2) + '" fill="#ffd34d" ' + stroke(hl) + ' stroke-linejoin="round"/>' + T(cx, y + h / 2 - 18, l1, 30) + T(cx, y + h / 2 + 20, l2, 30), hl);
  const arrow = (x, y1, y2) => '<line x1="' + x + '" y1="' + y1 + '" x2="' + x + '" y2="' + (y2 - 12) + '" stroke="' + INK + '" stroke-width="6"/><polygon points="' + (x - 12) + ',' + (y2 - 14) + ' ' + (x + 12) + ',' + (y2 - 14) + ' ' + x + ',' + y2 + '" fill="' + INK + '"/>';

  /* 좌측 순서도 SVG 렌더러 (유저 선호 유지) */
  function chart(hl) {
    const cx = 270, w = 300, L = INK;
    let s = '<svg width="510" height="722" viewBox="0 0 720 1020"><defs><filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ffd400" flood-opacity="1"/></filter></defs>';
    s += oval(cx, 10, 200, '시작', hl === 0) + arrow(cx, 74, 120);
    s += rect(cx, 120, w, '구슬 하나 꺼내기', hl === 1) + arrow(cx, 184, 224);
    s += dia(cx, 224, 300, 150, '분홍색인', '가요?', hl === 2) + arrow(cx, 374, 420) + T(cx + 28, 396, '예', 28);
    s += rect(595, 267, 230, '통에 다시 넣기', hl === 3);
    s += '<line x1="' + (cx + 150) + '" y1="299" x2="466" y2="299" stroke="' + L + '" stroke-width="6"/><polygon points="466,287 466,311 480,299" fill="' + L + '"/>' + T(cx + 165, 272, '아니오', 24);
    s += '<polyline points="595,267 595,152 ' + (cx + 165) + ',152" fill="none" stroke="' + L + '" stroke-width="6"/><polygon points="' + (cx + 164) + ',140 ' + (cx + 164) + ',164 ' + (cx + 150) + ',152" fill="' + L + '"/>';
    s += rect(cx, 420, w, '끈에 끼우기', hl === 4) + arrow(cx, 484, 524);
    s += dia(cx, 524, 380, 160, '구슬이', '10개인가요?', hl === 5) + arrow(cx, 684, 730) + T(cx + 28, 706, '예', 28);
    s += '<polyline points="' + (cx - 190) + ',604 40,604 40,152 ' + (cx - 165) + ',152" fill="none" stroke="' + L + '" stroke-width="6"/><polygon points="' + (cx - 164) + ',140 ' + (cx - 164) + ',164 ' + (cx - 150) + ',152" fill="' + L + '"/>' + T(cx - 190, 570, '아니오', 24);
    s += rect(cx, 730, w, '매듭 묶기', hl === 6) + arrow(cx, 794, 840);
    s += oval(cx, 840, 200, '끝', hl === 7);
    return s + '</svg>';
  }

  const hand = $('p11Hand');
  const strEl = $('p11Str');
  const dots = document.querySelectorAll('#p11Dots .p11-dot');
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const GOAL = 10;
  let state = 'start';
  let locked = true;
  let color = null;
  let count = 0;
  let nonPinkRun = 0;

  const show = (n) => { $('p11Chart').innerHTML = chart(n); };

  // 비즈 트레이 내 알록달록 구슬 20개 생성 (5 x 4)
  const beadColors = ['p', 'b', 'y', 'b', 'p', 'y', 'y', 'p', 'b', 'p', 'b', 'p', 'y', 'b', 'y', 'p', 'y', 'b', 'p', 'y'];
  const tubHtml = beadColors.map((c) => '<i class="p11-bd ' + c + '"></i>').join('') + '<span class="p11-tray-label">비즈 보관함</span>';
  $('p11Tub').innerHTML = tubHtml;

  function rollColor() {
    if (nonPinkRun >= 2) { nonPinkRun = 0; return 'p'; }
    const c = ['p', 'b', 'y'][Math.floor(Math.random() * 3)];
    nonPinkRun = c === 'p' ? 0 : nonPinkRun + 1;
    return c;
  }

  function setHandPos(tf) {
    hand.style.transform = tf || 'none';
  }

  function handBead(c) {
    const old = hand.querySelector('.p11-bd');
    if (old) old.remove();
    if (c) {
      const b = document.createElement('i');
      b.className = 'p11-bd ' + c;
      hand.appendChild(b);
    }
  }

  function updateDots(num) {
    dots.forEach((dot, idx) => {
      if (idx < num) dot.classList.add('is-filled');
      else dot.classList.remove('is-filled');
    });
  }

  async function doPick() {
    color = rollColor();
    show(1);
    // 손이 비즈 트레이 위쪽으로 이동하여 구슬 집기
    setHandPos('translateY(-230px)');
    await sleep(750);
    handBead(color);
    // 손이 아래 중앙으로 복귀하여 사용자에게 비즈를 명확히 보여줌
    setHandPos('none');
    await sleep(750);
    state = 'judge';
    show(2);
  }

  async function doBack() {
    show(3);
    // 비즈가 분홍색이 아니므로 통으로 다시 가져다 넣기
    setHandPos('translateY(-230px)');
    await sleep(750);
    handBead(null);
    setHandPos('none');
    await sleep(750);
    state = 'pick';
    show(1);
  }

  async function doString() {
    show(4);
    handBead(null);
    setHandPos('none');

    // 분홍 구슬이 끈 상단에서 아래로 미끄러져 내려감
    const b = document.createElement('i');
    b.className = 'p11-bd p';
    b.style.bottom = (count * 60) + 'px';
    b.style.transform = 'translateY(-680px)';
    strEl.appendChild(b);
    void b.offsetWidth;
    b.style.transition = 'transform .85s cubic-bezier(0.2, 0.8, 0.4, 1)';
    b.style.transform = 'none';

    await sleep(900);
    count += 1;
    $('p11N').textContent = count;
    updateDots(count);

    state = count >= GOAL ? 'check10' : 'check';
    show(5);
  }

  async function doKnot() {
    show(6);
    playCorrect();
    await sleep(600);
    strEl.classList.add('is-sent');
    document.querySelector('.p11-desk').classList.add('is-finished');
    await sleep(750);
    $('p11Gift').classList.add('is-on');
    await sleep(900);
    show(7);
    await sleep(2200);
    location.href = 'page12.html';
  }

  function expected() {
    if (state === 'pick' || state === 'check') return 'pick';
    if (state === 'judge') return color === 'p' ? 'string' : 'back';
    if (state === 'check10') return 'knot';
    return '';
  }

  function curHl() {
    if (state === 'pick') return 1;
    if (state === 'judge') return 2;
    return 5;
  }

  $('p11Cards').addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn || locked) return;
    const act = btn.dataset.act;
    if (act !== expected()) {
      playWrong();
      flashLayer($('p11Wrong'), 'is-off', 2000);
      show(curHl());
      return;
    }
    locked = true;
    if (act === 'pick') await doPick();
    else if (act === 'back') await doBack();
    else if (act === 'string') await doString();
    else if (act === 'knot') { await doKnot(); return; }
    locked = false;
  });

  show(0);
  setTimeout(() => {
    state = 'pick';
    show(1);
    locked = false;
  }, 1800);
})();
</script>
</body>
</html>
