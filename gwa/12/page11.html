<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생일 선물 팔찌 만들기</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
<style>
.p11-fp{position:absolute;left:40px;top:40px;width:560px;height:880px;box-sizing:border-box;border-radius:30px;background:#266cc8;padding:20px}
.p11-fp-in{width:100%;height:100%;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center}
.p11-desk{position:absolute;left:710px;top:120px;width:530px;height:780px;box-sizing:border-box;border-radius:30px;background:#d9a86b;border:solid 6px #8a5a2b}
.p11-tub{position:absolute;left:45px;top:60px;width:430px;height:380px;box-sizing:border-box;border-radius:40px;background:#f3f6fb;border:solid 6px var(--c-navy);display:flex;flex-wrap:wrap;gap:14px;padding:30px;align-content:flex-start}
.p11-bd{width:56px;height:56px;border-radius:50%;box-sizing:border-box;border:solid 4px rgba(0,0,0,.25)}
.p11-bd.p{background:#ff6fa8}.p11-bd.b{background:#4e97ff}.p11-bd.y{background:#ffd23f}
.p11-hand{position:absolute;left:135px;top:420px;width:260px;height:320px;display:flex;align-items:center;justify-content:center;font-size:250px;line-height:1;transition:transform .8s ease-in-out}
.p11-hand .p11-bd{position:absolute;left:100px;top:150px;width:70px;height:70px}
.p11-cards{position:absolute;left:1270px;top:120px;width:600px;height:780px;display:grid;grid-template-columns:1fr 1fr;gap:30px}
.p11-cards .quiz-graph{height:375px;font-size:42px;align-items:center;justify-content:center;gap:16px;padding-top:10px}
.p11-cards .quiz-graph i{font-style:normal;font-size:110px;line-height:1}
.p11-cards .quiz-graph b{font-weight:400;letter-spacing:-0.04em;line-height:1.1;text-align:center}
.p11-cnt{position:absolute;left:710px;top:20px;height:84px;margin:0;padding:6px 30px 0;box-sizing:border-box;display:flex;align-items:center;gap:16px;border:solid 5px var(--c-ink);border-radius:42px;background:#fff;font-family:'Cafe24 Ssurround';font-size:44px;color:var(--c-ink)}
.p11-cnt small{font-size:34px;color:var(--c-purple)}
.p11-cnt i{width:44px;height:44px;border-radius:50%;background:#ff6fa8;border:solid 3px rgba(0,0,0,.25);box-sizing:border-box}
.p11-str{position:absolute;left:652px;top:150px;width:6px;height:680px;background:#555;transition:transform 1.2s ease-in,opacity 1.2s ease-in}
.p11-str .p11-bd{position:absolute;left:-29px;width:64px;height:64px}
.p11-str.is-sent{transform:translate(420px,420px) scale(.3);opacity:0}
.p11-gift{position:absolute;left:960px;top:660px;font-size:170px;line-height:1;opacity:0;transition:opacity .5s,transform .5s}
.p11-gift.is-on{opacity:1;transform:scale(1.15)}
</style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="p11-fp"><div class="p11-fp-in" id="p11Chart"></div></div>
          <p class="p11-cnt"><small>끼운 구슬</small><i></i><span id="p11N">X0</span></p>
          <div class="p11-str" id="p11Str"></div>
          <div class="p11-desk">
            <div class="p11-tub" id="p11Tub"></div>
            <div class="p11-hand" id="p11Hand"><span id="p11HandG">🤚</span></div>
          </div>
          <span class="p11-gift" id="p11Gift">🎁</span>
          <div class="p11-cards" id="p11Cards">
            <button class="quiz-graph" data-act="pick"><i>🫳</i><b>구슬 꺼내기</b></button>
            <button class="quiz-graph" data-act="string"><i>🧵</i><b>끈에 끼우기</b></button>
            <button class="quiz-graph" data-act="back"><i>↩️</i><b>구슬 통에<br>다시 넣기</b></button>
            <button class="quiz-graph" data-act="knot"><i>🎀</i><b>매듭 묶기</b></button>
          </div>
          <div class="ox-result-wrong is-avatar is-off" id="p11Wrong" style="z-index:30">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">순서도를 다시 한번<br>살펴볼까요?</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="생일 선물 팔찌 만들기" data-next="page12.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
<script>
(function () {
  const F = "font-family:'Cafe24 Ssurround'";
  const INK = '#1b1640';
  const T = (x, y, s, fs, c) => '<text x="' + x + '" y="' + y + '" text-anchor="middle" dominant-baseline="middle" style="' + F + ';font-size:' + (fs || 34) + 'px;fill:' + (c || INK) + ';letter-spacing:-1px">' + s + '</text>';
  const stroke = (hl) => 'stroke="' + (hl ? '#ffcc00' : INK) + '" stroke-width="' + (hl ? 10 : 5) + '"';
  const glow = (svg, hl) => hl ? '<g filter="url(#gl)">' + svg + '</g>' : svg;
  const oval = (cx, y, w, s, hl) => glow('<rect x="' + (cx - w / 2) + '" y="' + y + '" width="' + w + '" height="64" rx="32" fill="#6dd36f" ' + stroke(hl) + '/>' + T(cx, y + 35, s), hl);
  const rect = (cx, y, w, s, hl) => glow('<rect x="' + (cx - w / 2) + '" y="' + y + '" width="' + w + '" height="64" rx="10" fill="#4a83c6" ' + stroke(hl) + '/>' + T(cx, y + 35, s, 34, '#fff'), hl);
  const dia = (cx, y, w, h, l1, l2, hl) => glow('<polygon points="' + cx + ',' + y + ' ' + (cx + w / 2) + ',' + (y + h / 2) + ' ' + cx + ',' + (y + h) + ' ' + (cx - w / 2) + ',' + (y + h / 2) + '" fill="#ffd34d" ' + stroke(hl) + ' stroke-linejoin="round"/>' + T(cx, y + h / 2 - 18, l1, 30) + T(cx, y + h / 2 + 20, l2, 30), hl);
  const arrow = (x, y1, y2) => '<line x1="' + x + '" y1="' + y1 + '" x2="' + x + '" y2="' + (y2 - 12) + '" stroke="' + INK + '" stroke-width="6"/><polygon points="' + (x - 12) + ',' + (y2 - 14) + ' ' + (x + 12) + ',' + (y2 - 14) + ' ' + x + ',' + y2 + '" fill="' + INK + '"/>';

  function chart(hl) {
    const cx = 270, w = 300, L = INK;
    let s = '<svg width="510" height="722" viewBox="0 0 720 1020"><defs><filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ffd400" flood-opacity="1"/></filter></defs>';
    s += oval(cx, 10, 200, '시작', hl === 0) + arrow(cx, 74, 120);
    s += rect(cx, 120, w, '구슬 하나 꺼내기', hl === 1) + arrow(cx, 184, 224);
    s += dia(cx, 224, 300, 150, '분홍색인', '가요?', hl === 2) + arrow(cx, 374, 420) + T(cx + 28, 396, '예', 28);
    s += rect(595, 267, 230, '통에 다시 넣기', hl === 3);
    s += '<line x1="' + (cx + 150) + '" y1="299" x2="466" y2="299" stroke="' + L + '" stroke-width="6"/><polygon points="466,287 466,311 480,299" fill="' + L + '"/>' + T(cx + 180, 272, '아니오', 24);
    s += '<polyline points="595,267 595,152 ' + (cx + 165) + ',152" fill="none" stroke="' + L + '" stroke-width="6"/><polygon points="' + (cx + 164) + ',140 ' + (cx + 164) + ',164 ' + (cx + 150) + ',152" fill="' + L + '"/>';
    s += rect(cx, 420, w, '끈에 끼우기', hl === 4) + arrow(cx, 484, 524);
    s += dia(cx, 524, 380, 160, '구슬이', '10개인가요?', hl === 5) + arrow(cx, 684, 730) + T(cx + 28, 706, '예', 28);
    s += '<polyline points="' + (cx - 190) + ',604 40,604 40,152 ' + (cx - 165) + ',152" fill="none" stroke="' + L + '" stroke-width="6"/><polygon points="' + (cx - 164) + ',140 ' + (cx - 164) + ',164 ' + (cx - 150) + ',152" fill="' + L + '"/>' + T(cx - 235, 580, '아니오', 24);
    s += rect(cx, 730, w, '매듭 묶기', hl === 6) + arrow(cx, 794, 840);
    s += oval(cx, 840, 200, '끝', hl === 7);
    return s + '</svg>';
  }

  const hand = $('p11Hand');
  const handG = $('p11HandG');
  const strEl = $('p11Str');
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const GOAL = 10;
  let state = 'start';
  let locked = true;
  let color = null;
  let count = 0;
  let nonPinkRun = 0;

  const show = (n) => { $('p11Chart').innerHTML = chart(n); };

  $('p11Tub').innerHTML = ['p', 'b', 'y', 'b', 'p', 'y', 'y', 'p', 'b', 'p', 'y', 'b', 'b', 'y', 'p', 'y', 'p', 'b'].map((c) => '<i class="p11-bd ' + c + '"></i>').join('');

  function rollColor() {
    if (nonPinkRun >= 2) { nonPinkRun = 0; return 'p'; }
    const c = ['p', 'b', 'y'][Math.floor(Math.random() * 3)];
    nonPinkRun = c === 'p' ? 0 : nonPinkRun + 1;
    return c;
  }

  function setHand(tf, glyph) {
    hand.style.transform = tf || 'none';
    if (glyph) handG.textContent = glyph;
  }
  function handBead(c) {
    const old = hand.querySelector('.p11-bd');
    if (old) old.remove();
    if (c) {
      const b = document.createElement('i');
      b.className = 'p11-bd ' + c;
      hand.appendChild(b);
    }
  }

  async function doPick() {
    color = rollColor();
    show(1);
    setHand('translateY(-250px)', '✊');
    await sleep(900);
    handBead(color);
    setHand('none');
    await sleep(900);
    setHand('rotateY(180deg)', '🖐️');
    await sleep(700);
    state = 'judge';
    show(2);
  }

  async function doBack() {
    show(3);
    setHand('rotateY(180deg) translateY(250px)');
    await sleep(900);
    handBead(null);
    setHand('none', '🤚');
    await sleep(900);
    state = 'pick';
    show(1);
  }

  async function doString() {
    show(4);
    handBead(null);
    setHand('none', '🤚');
    const b = document.createElement('i');
    b.className = 'p11-bd p';
    b.style.bottom = (-30 + count * 70) + 'px';
    b.style.transform = 'translateY(-700px)';
    strEl.appendChild(b);
    void b.offsetWidth;
    b.style.transition = 'transform .9s cubic-bezier(.5,0,1,.6)';
    b.style.transform = 'none';
    await sleep(1000);
    count += 1;
    $('p11N').textContent = 'X' + count;
    state = count >= GOAL ? 'check10' : 'check';
    show(5);
  }

  async function doKnot() {
    show(6);
    playCorrect();
    await sleep(600);
    strEl.classList.add('is-sent');
    await sleep(900);
    $('p11Gift').classList.add('is-on');
    await sleep(900);
    show(7);
    await sleep(2000);
    location.href = 'page12.html';
  }

  function expected() {
    if (state === 'pick' || state === 'check') return 'pick';
    if (state === 'judge') return color === 'p' ? 'string' : 'back';
    if (state === 'check10') return 'knot';
    return '';
  }
  function curHl() {
    if (state === 'pick') return 1;
    if (state === 'judge') return 2;
    return 5;
  }

  $('p11Cards').addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn || locked) return;
    const act = btn.dataset.act;
    if (act !== expected()) {
      playWrong();
      flashLayer($('p11Wrong'), 'is-off', 2000);
      show(curHl());
      return;
    }
    locked = true;
    if (act === 'pick') await doPick();
    else if (act === 'back') await doBack();
    else if (act === 'string') await doString();
    else if (act === 'knot') { await doKnot(); return; }
    locked = false;
  });

  show(0);
  setTimeout(() => {
    state = 'pick';
    show(1);
    locked = false;
  }, 2000);
})();
</script>
</body>
</html>
