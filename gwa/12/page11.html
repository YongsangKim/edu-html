<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생일 선물 팔찌 만들기</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
<style>
.p11-fp{position:absolute;left:36px;top:40px;width:560px;height:876px;box-sizing:border-box;border:solid 4px var(--c-ink);border-radius:16px;background:#1060c8;padding:20px}
.p11-fp-in{width:100%;height:100%;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center}

.p11-panel{position:absolute;left:617px;top:40px;width:1248px;height:876px;box-sizing:border-box;border:solid 4px var(--c-ink);border-radius:52px 52px 24px 24px;background:#1060c8}

.p11-cnt-wrap{position:absolute;left:-4px;top:-4px;width:1248px;height:107px;display:flex;align-items:center;gap:12px;padding:0 26px 0 24px;border:solid 4px var(--c-ink);border-radius:54px;background:#fff;box-sizing:border-box}
.p11-cnt-bead-badge{width:76px;height:80px;object-fit:contain;flex:0 0 auto}
.p11-cnt-title{font-family:'Cafe24 Ssurround';font-size:48px;color:#31248a;letter-spacing:-0.08em;white-space:nowrap}
.p11-dots{flex:1;height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-radius:38px;background:#e4ebf5;box-sizing:border-box}
.p11-dot{width:56px;height:56px;border-radius:50%;border:dashed 3px #d27aa0;background:#e9c2dc;box-sizing:border-box;background-position:center;background-repeat:no-repeat;background-size:contain;transition:transform .3s cubic-bezier(0.34, 1.56, 0.64, 1)}
.p11-dot.is-filled{border:none;background-color:transparent;background-image:url('img/p11_bead_p.png');transform:scale(1.1)}
.p11-cnt-num{font-family:'Cafe24 Ssurround';font-size:60px;color:#31248a;letter-spacing:-0.08em;white-space:nowrap;min-width:130px;text-align:right}
.p11-cnt-num span{color:#ff4ff9}

.p11-desk{position:absolute;left:15px;top:115px;width:615px;height:741px;box-sizing:border-box;border-radius:20px;background:#ebe3d5;border:solid 4px #fff;overflow:hidden}

.p11-str-track{position:absolute;left:10px;top:40px;width:180px;height:690px;pointer-events:none}
.p11-str-img{position:absolute;left:57px;top:2px;width:63px;height:637px;object-fit:contain;display:block;transition:transform 1.1s cubic-bezier(0.4, 0, 0.2, 1), opacity .8s ease}
.p11-str-beads{position:absolute;left:55px;top:6px;width:63px;height:598px;transition:transform 1.1s cubic-bezier(0.4, 0, 0.2, 1), opacity .8s ease}
.p11-str-beads.is-sent,.p11-str-img.is-sent{transform:translate(220px, 160px) scale(0.1);opacity:0}
.p11-str-label{position:absolute;left:0;bottom:4px;width:178px;height:46px;display:flex;align-items:center;justify-content:center;background:#6b9ce8;color:#fff;border:solid 3px #fff;border-radius:23px;font-family:'Cafe24 Ssurround';font-size:22px;letter-spacing:-0.03em;box-shadow:0 4px 10px rgba(0,0,0,0.12);box-sizing:border-box}

.p11-bd{position:absolute;width:62px;height:62px;object-fit:contain;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,0.2))}
.p11-str-beads .p11-bd{left:0}

.p11-tray{position:absolute;left:207px;top:33px;width:387px;height:322px;transition:opacity .5s ease}
.p11-tray-img{width:100%;height:100%;object-fit:contain;display:block}
.p11-tray-label{position:absolute;left:50%;top:-18px;transform:translateX(-50%);width:178px;height:46px;display:flex;align-items:center;justify-content:center;background:#6b9ce8;color:#fff;border:solid 3px #fff;border-radius:23px;font-family:'Cafe24 Ssurround';font-size:22px;letter-spacing:-0.03em;box-shadow:0 4px 10px rgba(0,0,0,0.12);box-sizing:border-box}

.p11-hand-lower{position:absolute;left:178px;top:421px;width:431px;height:282px;pointer-events:none;transition:opacity .5s ease}
.p11-hand-lower img{width:100%;height:100%;object-fit:contain;display:block}
.p11-hand-pick{position:absolute;left:356px;top:95px;width:349px;height:283px;pointer-events:none;z-index:4;transition:transform .75s cubic-bezier(0.34, 1.2, 0.64, 1), opacity .4s ease}
.p11-hand-pick img{width:100%;height:100%;object-fit:contain;display:block}
.p11-hand-pick .p11-bd{left:2px;top:70px;width:64px;height:64px;animation:beadPop .3s ease-out}
.p11-picked-bead{position:absolute;left:359px;top:505px;width:68px;height:68px;z-index:5;animation:beadPop .3s ease-out}
@keyframes beadPop{0%{transform:scale(0.3);opacity:0}80%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

.p11-desk.is-finished .p11-tray,
.p11-desk.is-finished .p11-hand-lower,
.p11-desk.is-finished .p11-hand-pick,
.p11-desk.is-finished .p11-picked-bead,
.p11-desk.is-finished .p11-str-track{opacity:0;pointer-events:none}

.p11-gift{position:absolute;inset:0;z-index:20;opacity:0;transform:scale(0.85);pointer-events:none;transition:all .8s cubic-bezier(0.34, 1.56, 0.64, 1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px}
.p11-gift.is-on{opacity:1;transform:scale(1);pointer-events:auto}
.p11-gift-banner{--rb-w:486px;--rb-h:84px;--rb-fs:46px;--rb-ls:-0.04em}
.p11-gift img{width:540px;max-width:100%;height:auto;object-fit:contain;filter:drop-shadow(0 14px 24px rgba(0,0,0,0.18))}

.p11-cards{position:absolute;left:656px;top:138px;width:559px;display:grid;grid-template-columns:265px 265px;gap:35px 30px}
.p11-cards .card-btn{min-width:0;width:265px;height:315px;padding:16px 12px 14px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.p11-card-ico{position:relative;width:220px;height:176px;box-sizing:border-box;border:solid 5px #fff;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;pointer-events:none}
.p11-card-ico img{width:100%;height:100%;object-fit:cover;display:block}
.p11-cards .card-btn:hover .p11-card-ico img{filter:url(#p11ScrHover)}
.p11-cards .card-btn:active .p11-card-ico img,
.p11-cards .card-btn.is-selected .p11-card-ico img,
.p11-cards .card-btn.is-pressed .p11-card-ico img{filter:url(#p11ScrActive) drop-shadow(0 0 10px #ecbeff) drop-shadow(0 0 4px #ecbeff)}
.p11-cards .card-btn b{font-family:'Cafe24 Ssurround',sans-serif;font-weight:700;font-size:34px;line-height:1.15;letter-spacing:-0.05em;pointer-events:none}
</style>
</head>
<body>
  <div id="page-fade"></div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="p11ScrHover" color-interpolation-filters="sRGB">
        <feFlood flood-color="#8278ff" flood-opacity="0.5" result="c"/>
        <feComposite in="c" in2="SourceAlpha" operator="in" result="m"/>
        <feBlend in="SourceGraphic" in2="m" mode="screen"/>
      </filter>
      <filter id="p11ScrActive" color-interpolation-filters="sRGB">
        <feFlood flood-color="#d168fb" flood-opacity="0.5" result="c"/>
        <feComposite in="c" in2="SourceAlpha" operator="in" result="m"/>
        <feBlend in="SourceGraphic" in2="m" mode="screen"/>
      </filter>
    </defs>
  </svg>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="p11-fp"><div class="p11-fp-in" id="p11Chart"></div></div>

          <div class="p11-panel">
            <div class="p11-cnt-wrap">
              <img class="p11-cnt-bead-badge" src="img/p11_bead_badge.png" alt="">
              <span class="p11-cnt-title">끼운 구슬</span>
              <div class="p11-dots" id="p11Dots">
                <i class="p11-dot"></i><i class="p11-dot"></i><i class="p11-dot"></i><i class="p11-dot"></i><i class="p11-dot"></i>
                <i class="p11-dot"></i><i class="p11-dot"></i><i class="p11-dot"></i><i class="p11-dot"></i><i class="p11-dot"></i>
              </div>
              <div class="p11-cnt-num"><span id="p11N">0</span> / 10</div>
            </div>

            <div class="p11-desk" id="p11Desk">
              <div class="p11-str-track">
                <img class="p11-str-img" id="p11StrImg" src="img/p11_str.png" alt="비즈 꽂이 끈">
                <div class="p11-str-beads" id="p11Str"></div>
                <span class="p11-str-label">비즈 꽂이 끈</span>
              </div>

              <div class="p11-tray" id="p11Tub">
                <img class="p11-tray-img" src="img/p11_tray.png" alt="비즈 보관함">
                <span class="p11-tray-label">비즈 보관함</span>
              </div>

              <div class="p11-hand-pick" id="p11HandPick">
                <img src="img/p11_hand_2.png" alt="구슬 집는 손">
              </div>

              <div class="p11-hand-lower" id="p11HandLower">
                <img src="img/p11_hand_1.png" alt="구슬 받는 손">
              </div>

              <div class="p11-gift" id="p11Gift">
                <div class="ribbon-wrap"><p class="ribbon is-tag p11-gift-banner">예쁜 팔찌 생일선물 완성</p></div>
                <img src="img/p11_gift_bracelet.png" alt="완성된 생일 선물 팔찌">
              </div>
            </div>

            <div class="p11-cards opts" id="p11Cards">
              <button type="button" class="card-btn" data-act="pick">
                <span class="p11-card-ico"><img src="img/p11_card_pick.png" alt="구슬 꺼내기"></span>
                <b>구슬 꺼내기</b>
              </button>
              <button type="button" class="card-btn" data-act="string">
                <span class="p11-card-ico"><img src="img/p11_card_string.png" alt="끈에 끼우기"></span>
                <b>끈에 끼우기</b>
              </button>
              <button type="button" class="card-btn" data-act="back">
                <span class="p11-card-ico"><img src="img/p11_card_back.png" alt="구슬 통에 다시 넣기"></span>
                <b>구슬 통에<br>다시 넣기</b>
              </button>
              <button type="button" class="card-btn" data-act="knot">
                <span class="p11-card-ico"><img src="img/p11_card_knot.png" alt="매듭 묶기"></span>
                <b>매듭 묶기</b>
              </button>
            </div>
          </div>

          <div class="ox-result-wrong is-avatar is-off" id="p11Wrong" style="z-index:30">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">순서도를 다시 한번<br>살펴볼까요?</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="생일 선물 팔찌 만들기" data-next="page12.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
<script>
(function () {
  const F = "font-family:'Cafe24 Ssurround'";
  const INK = '#1b1640';
  const T = (x, y, s, fs, c) => '<text x="' + x + '" y="' + y + '" text-anchor="middle" dominant-baseline="middle" style="' + F + ';font-size:' + (fs || 34) + 'px;fill:' + (c || INK) + ';letter-spacing:-1px">' + s + '</text>';
  const stroke = (hl) => 'stroke="' + (hl ? '#ff2fc2' : INK) + '" stroke-width="' + (hl ? 10 : 5) + '"';
  const glow = (svg, hl) => hl ? '<g filter="url(#gl)">' + svg + '</g>' : svg;
  const oval = (cx, y, w, s, hl) => glow('<rect x="' + (cx - w / 2) + '" y="' + y + '" width="' + w + '" height="64" rx="32" fill="#6dd36f" ' + stroke(hl) + '/>' + T(cx, y + 35, s), hl);
  const rect = (cx, y, w, s, hl) => glow('<rect x="' + (cx - w / 2) + '" y="' + y + '" width="' + w + '" height="64" rx="10" fill="#4a83c6" ' + stroke(hl) + '/>' + T(cx, y + 35, s, 34, '#fff'), hl);
  const dia = (cx, y, w, h, l1, l2, hl) => glow('<polygon points="' + cx + ',' + y + ' ' + (cx + w / 2) + ',' + (y + h / 2) + ' ' + cx + ',' + (y + h) + ' ' + (cx - w / 2) + ',' + (y + h / 2) + '" fill="#ffd34d" ' + stroke(hl) + ' stroke-linejoin="round"/>' + T(cx, y + h / 2 - 18, l1, 30) + T(cx, y + h / 2 + 20, l2, 30), hl);
  const arrow = (x, y1, y2) => '<line x1="' + x + '" y1="' + y1 + '" x2="' + x + '" y2="' + (y2 - 12) + '" stroke="' + INK + '" stroke-width="6"/><polygon points="' + (x - 12) + ',' + (y2 - 14) + ' ' + (x + 12) + ',' + (y2 - 14) + ' ' + x + ',' + y2 + '" fill="' + INK + '"/>';

  function chart(hl) {
    const cx = 270, w = 300, L = INK;
    let s = '<svg width="512" height="650" viewBox="15 0 720 914"><defs><filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ff2fc2" flood-opacity="1"/></filter></defs>';
    s += oval(cx, 10, 200, '시작', hl === 0) + arrow(cx, 74, 120);
    s += rect(cx, 120, w, '구슬 하나 꺼내기', hl === 1) + arrow(cx, 184, 224);
    s += dia(cx, 224, 300, 150, '분홍색인', '가요?', hl === 2) + arrow(cx, 374, 420) + T(cx + 28, 396, '예', 28);
    s += rect(595, 267, 230, '통에 다시 넣기', hl === 3);
    s += '<line x1="' + (cx + 150) + '" y1="299" x2="466" y2="299" stroke="' + L + '" stroke-width="6"/><polygon points="466,287 466,311 480,299" fill="' + L + '"/>' + T(cx + 165, 272, '아니오', 24);
    s += '<polyline points="595,267 595,152 ' + (cx + 165) + ',152" fill="none" stroke="' + L + '" stroke-width="6"/><polygon points="' + (cx + 164) + ',140 ' + (cx + 164) + ',164 ' + (cx + 150) + ',152" fill="' + L + '"/>';
    s += rect(cx, 420, w, '끈에 끼우기', hl === 4) + arrow(cx, 484, 524);
    s += dia(cx, 524, 380, 160, '구슬이', '10개인가요?', hl === 5) + arrow(cx, 684, 730) + T(cx + 28, 706, '예', 28);
    s += '<polyline points="' + (cx - 190) + ',604 40,604 40,152 ' + (cx - 165) + ',152" fill="none" stroke="' + L + '" stroke-width="6"/><polygon points="' + (cx - 164) + ',140 ' + (cx - 164) + ',164 ' + (cx - 150) + ',152" fill="' + L + '"/>' + T(cx - 190, 570, '아니오', 24);
    s += rect(cx, 730, w, '매듭 묶기', hl === 6) + arrow(cx, 794, 840);
    s += oval(cx, 840, 200, '끝', hl === 7);
    return s + '</svg>';
  }

  const desk = $('p11Desk');
  const handPick = $('p11HandPick');
  const strEl = $('p11Str');
  const strImg = $('p11StrImg');
  const dots = document.querySelectorAll('#p11Dots .p11-dot');
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const GOAL = 10;
  const BEAD_SRC = { p: 'img/p11_bead_p.png', b: 'img/p11_bead_b.png', y: 'img/p11_bead_y.png' };
  let state = 'start';
  let locked = true;
  let color = null;
  let count = 0;
  let nonPinkRun = 0;

  const show = (n) => { $('p11Chart').innerHTML = chart(n); };

  function rollColor() {
    if (nonPinkRun >= 2) { nonPinkRun = 0; return 'p'; }
    const c = ['p', 'b', 'y'][Math.floor(Math.random() * 3)];
    nonPinkRun = c === 'p' ? 0 : nonPinkRun + 1;
    return c;
  }

  function clearPickedBead() {
    const oldPick = handPick.querySelector('.p11-bd');
    if (oldPick) oldPick.remove();
    const oldDesk = desk.querySelector('.p11-picked-bead');
    if (oldDesk) oldDesk.remove();
  }

  function showPickBead(c, target) {
    clearPickedBead();
    if (!c) return;
    const b = document.createElement('img');
    b.src = BEAD_SRC[c];
    b.alt = '';
    b.className = target === 'desk' ? 'p11-bd p11-picked-bead' : 'p11-bd';
    (target === 'desk' ? desk : handPick).appendChild(b);
  }

  function updateDots(num) {
    dots.forEach((dot, idx) => dot.classList.toggle('is-filled', idx < num));
  }

  async function doPick() {
    color = rollColor();
    show(1);
    showPickBead(color, 'hand');
    handPick.style.transform = 'translateY(349px)';
    await sleep(750);
    showPickBead(color, 'desk');
    handPick.style.transform = 'none';
    await sleep(600);
    state = 'judge';
    show(2);
  }

  async function doBack() {
    show(3);
    handPick.style.transform = 'translateY(349px)';
    await sleep(450);
    showPickBead(color, 'hand');
    handPick.style.transform = 'none';
    await sleep(700);
    clearPickedBead();
    state = 'pick';
    show(1);
  }

  async function doString() {
    show(4);
    clearPickedBead();

    const b = document.createElement('img');
    b.src = BEAD_SRC.p;
    b.alt = '';
    b.className = 'p11-bd';
    b.style.bottom = (count * 56) + 'px';
    b.style.transform = 'translateY(-620px)';
    strEl.appendChild(b);
    void b.offsetWidth;
    b.style.transition = 'transform .85s cubic-bezier(0.2, 0.8, 0.4, 1)';
    b.style.transform = 'none';

    await sleep(900);
    count += 1;
    $('p11N').textContent = count;
    updateDots(count);

    state = count >= GOAL ? 'check10' : 'check';
    show(5);
  }

  async function doKnot() {
    show(6);
    playCorrect();
    await sleep(600);
    strEl.classList.add('is-sent');
    strImg.classList.add('is-sent');
    desk.classList.add('is-finished');
    await sleep(750);
    $('p11Gift').classList.add('is-on');
    await sleep(900);
    show(7);
    await sleep(2200);
    location.href = 'page12.html';
  }

  function expected() {
    if (state === 'pick' || state === 'check') return 'pick';
    if (state === 'judge') return color === 'p' ? 'string' : 'back';
    if (state === 'check10') return 'knot';
    return '';
  }

  function curHl() {
    if (state === 'pick') return 1;
    if (state === 'judge') return 2;
    return 5;
  }

  $('p11Cards').addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn || locked) return;
    const act = btn.dataset.act;
    if (act !== expected()) {
      playWrong();
      flashLayer($('p11Wrong'), 'is-off', 2000);
      show(curHl());
      return;
    }
    locked = true;
    if (act === 'pick') await doPick();
    else if (act === 'back') await doBack();
    else if (act === 'string') await doString();
    else if (act === 'knot') { await doKnot(); return; }
    locked = false;
  });

  const stepParam = new URLSearchParams(location.search).get('step');
  if (stepParam === '2') {
    count = GOAL;
    $('p11N').textContent = GOAL;
    updateDots(GOAL);
    desk.classList.add('is-finished');
    $('p11Gift').classList.add('is-on');
    show(7);
  } else {
    show(0);
    setTimeout(() => {
      state = 'pick';
      show(1);
      locked = false;
    }, 1800);
  }
})();
</script>
</body>
</html>
