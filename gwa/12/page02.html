<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>생일 축하해! 케이크 촛불 끄기</title>
  <link rel="stylesheet" href="../../resources/css/common.css">
  <style>
    .p02-bg-room {
      position: absolute;
      inset: 0;
      background: url('img/p02_bg.jpg') no-repeat center / cover;
      pointer-events: none;
    }

    .p02-lv {
      position: absolute;
      left: 50px;
      top: 42px;
      height: 82px;
      margin: 0;
      padding: 4px 44px 0 116px;
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #91b9f9 0%, #6d99ec 100%);
      border: 4px solid #91b9e7;
      border-radius: 45px;
      box-shadow: 0 10px 24px rgba(34, 63, 191, 0.28);
      font-family: 'Cafe24 Ssurround', sans-serif;
      font-size: 54px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 3px 6px rgba(30, 58, 138, 0.35);
      letter-spacing: -1px;
      z-index: 20;
    }
    .p02-lv-cake {
      position: absolute;
      left: -18px;
      top: -34px;
      width: 118px;
      height: 118px;
      pointer-events: none;
      filter: drop-shadow(0 6px 10px rgba(30, 41, 59, 0.22));
    }
    .p02-cnt {
      position: absolute;
      left: 1296px;
      top: 14px;
      width: 573px;
      height: 90px;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      display: block;
      background: #ffffff;
      border: 4px solid #6b9ce8;
      border-radius: 45px;
      box-shadow: 0 6px 16px rgba(30, 58, 138, 0.16), inset 0 -3px 0 rgba(107, 156, 232, 0.22);
      font-family: 'Cafe24 Ssurround', sans-serif;
      color: #1f2d5a;
      z-index: 20;
    }
    .p02-cnt .candle-mini-icon {
      position: absolute;
      left: 56px;
      top: 50%;
      transform: translateY(-50%);
      width: 64px;
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .p02-cnt small {
      position: absolute;
      left: 162px;
      top: 52%;
      transform: translateY(-50%);
      font-size: 50px;
      font-weight: 700;
      color: #1f2d5a;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }
    #p02Cnt {
      position: absolute;
      right: 68px;
      top: 53%;
      transform: translateY(-50%);
      min-width: 82px;
      text-align: center;
      font-size: 80px;
      font-weight: 700;
      color: #1a2b88;
      line-height: 1;
    }

    .p02-right-box-wrap {
      position: absolute;
      left: 1360px;
      top: 118px;
      width: 440px;
      height: 830px;
      overflow: hidden;
      border-radius: 20px 0 0 20px;
      border-right: 5px solid #91b9e7;
      box-sizing: border-box;
      z-index: 13;
      pointer-events: none;
    }
    .p02-right-box {
      display: block;
      width: 583px;
      height: 830px;
      max-width: none;
    }

    .p02-cake-wrap {
      position: absolute;
      left: 80px;
      top: 420px;
      width: 530px;
      height: 430px;
      z-index: 10;
      pointer-events: none;
    }
    .p02-cake-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 15px 25px rgba(43, 58, 85, 0.22));
    }

    #p02Candles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
    }
    .p02-candle {
      position: absolute;
      pointer-events: none;
      transition: transform 0.2s;
    }
    .p02-candle-img {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      height: 82%;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.25));
    }
    .p02-flame {
      position: absolute;
      left: 50%;
      bottom: 79%;
      transform: translateX(-50%);
      width: 11px;
      height: 26px;
      background: radial-gradient(ellipse at 50% 72%, #ffffff 0%, #fff3bf 35%, #ffaa2b 72%, rgba(255, 136, 0, 0) 100%);
      border-radius: 50% 50% 45% 45% / 80% 80% 20% 20%;
      filter: drop-shadow(0 0 6px rgba(255, 184, 64, 0.95)) drop-shadow(0 -3px 8px rgba(255, 146, 43, 0.7));
      animation: p02FlameFlicker 0.55s ease-in-out infinite alternate;
      transform-origin: 50% 92%;
      transition: opacity 0.2s, transform 0.2s;
    }
    @keyframes p02FlameFlicker {
      0% { transform: translateX(-50%) scale(1) rotate(-2deg); }
      50% { transform: translateX(-50%) scale(1.08, 0.96) rotate(3deg); }
      100% { transform: translateX(-50%) scale(0.95, 1.05) rotate(-3deg); }
    }
    .p02-candle.is-out .p02-flame {
      opacity: 0;
      transform: translateX(-50%) scale(0.1) translateY(10px);
    }
    .p02-smoke-puff {
      position: absolute;
      left: 50%;
      bottom: 75%;
      transform: translateX(-50%);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(180, 190, 205, 0.7);
      pointer-events: none;
      animation: p02SmokeRise 1.2s ease-out forwards;
    }
    .p02-banner.is-off { display: none; }
    .p02-banner { position: absolute; left: 0; top: 410px; width: 1920px; margin: 0; text-align: center; z-index: 30; pointer-events: none; }
    .p02-banner span { display: inline-block; min-width: 560px; box-sizing: border-box; padding: 18px 60px 10px; border: solid 9px #e4f4ff; border-radius: 80px; background: #043f9b; font-family: 'Cafe24 Ssurround'; font-size: 76px; color: var(--c-white); letter-spacing: -0.03em; }
    @keyframes p02SmokeRise {
      0% { opacity: 0.8; transform: translate(-50%, 0) scale(0.6); }
      50% { opacity: 0.6; transform: translate(-70%, -40px) scale(1.5); }
      100% { opacity: 0; transform: translate(-90%, -80px) scale(2.2); }
    }

    .p02-girl-wrap {
      position: absolute;
      left: 380px;
      top: 0px;
      width: 1180px;
      height: 960px;
      z-index: 12;
      transition: transform 0.25s ease;
      pointer-events: none;
    }
    .p02-girl-wrap.is-blowing {
      transform: translateX(-15px) rotate(-3deg);
    }
    .p02-girl-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      filter: drop-shadow(0 12px 20px rgba(43, 58, 85, 0.15));
    }
    .p02-wind-stream {
      position: absolute;
      left: 265px;
      top: 372px;
      width: 420px;
      height: 220px;
      pointer-events: none;
      z-index: 18;
      opacity: 0;
      filter: drop-shadow(0 0 12px rgba(210, 238, 255, 0.75));
      transition: opacity 0.2s ease;
    }
    .p02-wind-stream.is-on {
      opacity: 1;
      animation: p02WindFlow 0.75s cubic-bezier(0.22, 0.61, 0.36, 1) infinite;
    }
    @keyframes p02WindFlow {
      0% { transform: translate(34px, -10px) scale(0.75); opacity: 0; }
      28% { opacity: 0.95; }
      75% { opacity: 0.75; }
      100% { transform: translate(-36px, 16px) scale(1.1); opacity: 0; }
    }

    .p02-lung-apparatus {
      position: absolute;
      left: 1378px;
      top: 150px;
      width: 340px;
      height: 700px;
      z-index: 14;
    }
    .p02-dome-bottle {
      position: absolute;
      left: 3px;
      top: 0px;
      width: 334px;
      height: 392px;
      overflow: visible;
    }
    .p02-dome-img {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      z-index: 4;
      pointer-events: none;
    }
    .p02-lungs-pair {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    .p02-lung-balloon {
      position: absolute;
      transition: transform 0.15s ease-out;
      filter: drop-shadow(0 6px 12px rgba(140, 20, 40, 0.25));
    }
    .p02-lung-balloon.is-left {
      left: 11px;
      top: 126px;
      width: 137px;
      height: 212px;
      transform-origin: 86% 4%;
      transform: scale(0.64);
    }
    .p02-lung-balloon.is-right {
      left: 183px;
      top: 126px;
      width: 149px;
      height: 236px;
      transform-origin: 12% 4%;
      transform: scale(0.64);
    }

    .p02-mem {
      position: absolute;
      left: 8px;
      bottom: 46px;
      width: 318px;
      height: 92px;
      background: linear-gradient(180deg, rgba(226, 98, 118, 0.94) 0%, rgba(196, 62, 85, 0.98) 100%);
      border-radius: 80% 80% 0 0 / 100% 100% 0 0;
      box-shadow: inset 0 6px 12px rgba(255, 200, 210, 0.35);
      box-sizing: border-box;
      transition: height 0.15s ease-out, border-radius 0.15s ease-out;
      z-index: 9;
    }

    .p02-pull {
      position: absolute;
      left: 50%;
      top: 376px;
      transform: translateX(-50%);
      width: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: grab;
      touch-action: none;
      user-select: none;
      z-index: 25;
    }
    .p02-pull.is-drag {
      cursor: grabbing;
    }
    .p02-pull-string {
      width: 10px;
      height: 50px;
      background: linear-gradient(90deg, #1f2937 0%, #4b5563 50%, #1f2937 100%);
      border-radius: 5px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      z-index: 10;
      transition: height 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .p02-pull.is-drag .p02-pull-string {
      transition: none;
    }
    .p02-knob {
      width: 150px;
      height: 62px;
      background: linear-gradient(180deg, #fff078 0%, #ffd43b 52%, #f0b400 100%);
      border: 4px solid #ffffff;
      border-radius: 31px;
      box-shadow: 0 8px 18px rgba(20, 42, 92, 0.28), inset 0 4px 6px rgba(255, 255, 255, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: 'Cafe24 Ssurround', sans-serif;
      font-size: 30px;
      font-weight: 700;
      color: #1f2d5a;
      box-sizing: border-box;
      transition: transform 0.15s, background 0.15s;
    }
    .p02-pull:hover .p02-knob {
      background: linear-gradient(180deg, #fff6a6 0%, #ffe066 100%);
      transform: scale(1.04);
    }
    .p02-pull-arrow {
      margin-top: 14px;
      width: 82px;
      height: 112px;
      pointer-events: none;
      filter: drop-shadow(0 4px 10px rgba(255, 63, 164, 0.45));
      animation: p02ArrowBob 1.3s ease-in-out infinite;
      transition: opacity 0.25s ease;
    }
    .p02-pull-arrow.is-hidden {
      opacity: 0;
      animation: none;
    }
    @keyframes p02ArrowBob {
      0%, 100% { transform: translateY(0); opacity: 0.92; }
      50% { transform: translateY(10px); opacity: 1; }
    }

    .p02-gauge-wrap {
      position: absolute;
      left: 1729px;
      top: 118px;
      width: 214px;
      height: 830px;
      z-index: 15;
    }
    .p02-gauge-label {
      position: absolute;
      left: 50%;
      top: -24px;
      transform: translateX(-50%);
      white-space: nowrap;
      text-align: center;
      font-family: 'Cafe24 Ssurround', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #2b3a55;
    }
    .p02-gauge-tube.gauge.is-thin.is-vertical {
      left: 0px;
      top: 4px;
      width: 70px;
      height: 822px;
      border-width: 5px;
      border-radius: 35px;
      box-sizing: border-box;
      overflow: hidden;
    }
    .p02-gauge-tube.gauge.is-thin.is-vertical::before {
      content: none;
    }
    .gauge.is-vertical .p02-gauge-fill.gauge-fill {
      border-radius: 30px;
      transition: height 0.25s ease-out;
    }
    .p02-mark {
      position: absolute;
      left: 5px;
      top: 360px;
      width: 60px;
      height: 0;
      border-top: 4px dotted #ff52a8;
      z-index: 25;
      pointer-events: none;
      filter: drop-shadow(0 2px 4px rgba(233, 46, 136, 0.45));
      transition: top 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .p02-marker-tag {
      position: absolute;
      left: 64px;
      top: -25px;
      height: 44px;
      padding: 3px 18px 0;
      background: #ffffff;
      border: 3px solid #ff4ff9;
      border-radius: 22px;
      box-shadow: 3px 8px 0 2px rgba(58, 41, 112, 0.2);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: 'Cafe24 Ssurround', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: #d020ca;
      white-space: nowrap;
      box-sizing: border-box;
    }
    .p02-marker-tag::before {
      display: none;
    }
    .p02-max {
      position: absolute;
      left: 104px;
      top: 24px;
      margin: 0;
      font-family: 'Cafe24 Ssurround', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #e03131;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      filter: drop-shadow(0 2px 3px rgba(255, 255, 255, 0.9));
    }
    .p02-max[hidden] {
      display: none !important;
    }
    .p02-max::before {
      content: '';
      display: inline-block;
      width: 14px;
      height: 4px;
      background: #e03131;
      border-radius: 2px;
    }

    .ox-result-wrong.is-avatar,
    .avatar-modal,
    #p02Wrong,
    #p02Done {
      z-index: 1000 !important;
    }
</style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default" id="p02Main">

          <!-- 배경: 고화질 생일 파티 룸 일러스트 -->
          <div class="p02-bg-room"></div>

          <!-- 상단 UI: Level & 남은 초 -->
          <p class="p02-lv" id="p02Lv">
            <img class="p02-lv-cake" src="img/p02_lv_cake.png" alt="">
            <span id="p02LvTx">Level 1</span>
          </p>
          <p class="p02-cnt">
            <span class="candle-mini-icon">
              <img src="img/p02_cnt_candle.png" alt="" style="width:100%;height:100%;object-fit:contain;display:block">
            </span>
            <small>남은 초</small>
            <span id="p02Cnt">5</span>
          </p>

          <!-- 우측 감싸는 영역 이미지 -->
          <div class="p02-right-box-wrap">
            <img class="p02-right-box" src="img/p02_box.png" alt="">
          </div>

          <!-- 좌측: 고화질 생일 케이크 (PNG 이미지) -->
          <div class="p02-cake-wrap">
            <img src="img/p02_cake.png" class="p02-cake-img" alt="생일 케이크">
          </div>

          <!-- 케이크 위 양초들 (크림 윗면에 쏙 꽂히는 지그재그 배치) -->
          <div id="p02Candles"></div>

          <!-- 중앙: 측면 바람 부는 소녀 캐릭터 (고화질 PNG) & 바람 -->
          <div class="p02-girl-wrap" id="p02GirlWrap">
            <img src="img/p02_girl.png" class="p02-girl-img" id="p02Girl" alt="바람 부는 캐릭터">
          </div>

          <!-- 입에서 나가는 바람 이펙트 -->
          <div class="p02-wind-stream" id="p02Wind">
            <svg viewBox="0 0 420 220" width="100%" height="100%">
              <defs>
                <linearGradient id="windGradA" x1="100%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
                  <stop offset="22%" stop-color="#ffffff" stop-opacity="0.88"/>
                  <stop offset="68%" stop-color="#cbe8ff" stop-opacity="0.62"/>
                  <stop offset="100%" stop-color="#a5d8ff" stop-opacity="0"/>
                </linearGradient>
                <linearGradient id="windGradB" x1="100%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
                  <stop offset="30%" stop-color="#e7f5ff" stop-opacity="0.72"/>
                  <stop offset="80%" stop-color="#99d1ff" stop-opacity="0.35"/>
                  <stop offset="100%" stop-color="#99d1ff" stop-opacity="0"/>
                </linearGradient>
                <filter id="windSoft" x="-10%" y="-10%" width="120%" height="120%">
                  <feGaussianBlur stdDeviation="2.2"/>
                </filter>
              </defs>
              <g filter="url(#windSoft)">
                <path d="M392,48 Q280,58 175,104 T22,150" stroke="url(#windGradA)" stroke-width="10" stroke-linecap="round" fill="none"/>
                <path d="M396,60 Q295,86 195,126 T44,182" stroke="url(#windGradB)" stroke-width="7" stroke-linecap="round" fill="none"/>
                <path d="M385,42 Q265,32 162,76 T30,118" stroke="url(#windGradB)" stroke-width="6" stroke-linecap="round" fill="none"/>
                <path d="M350,64 Q275,95 210,118" stroke="url(#windGradA)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85"/>
                <path d="M235,62 C210,50 185,68 202,84 C214,94 232,82 222,70" stroke="url(#windGradB)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
                <path d="M135,112 C110,98 86,118 104,134 C118,144 134,132 124,120" stroke="url(#windGradB)" stroke-width="4" stroke-linecap="round" fill="none"/>
              </g>
              <circle cx="290" cy="82" r="4" fill="#ffffff" opacity="0.65"/>
              <circle cx="215" cy="108" r="5.5" fill="#e7f5ff" opacity="0.55"/>
              <circle cx="145" cy="142" r="4.5" fill="#ffffff" opacity="0.45"/>
              <circle cx="90" cy="158" r="3.5" fill="#cbe8ff" opacity="0.4"/>
            </svg>
          </div>

          <!-- 우측 중앙: 폐 모형 실험 기구 -->
          <div class="p02-lung-apparatus">
            <div class="p02-dome-bottle">
              <img class="p02-dome-img" src="img/p02_dome.png" alt="유리관 폐 모형">
              <div class="p02-lungs-pair" id="p02Lung">
                <img class="p02-lung-balloon is-left" id="p02LungL" src="img/p02_lung_l.png" alt="">
                <img class="p02-lung-balloon is-right" id="p02LungR" src="img/p02_lung_r.png" alt="">
              </div>
              <div class="p02-mem" id="p02Mem"></div>
            </div>

            <!-- 당김 손잡이 조립체 -->
            <div class="p02-pull" id="p02Pull">
              <div class="p02-pull-string" id="p02PullStr"></div>
              <div class="p02-knob">
                <span>당기기</span>
              </div>
              <svg class="p02-pull-arrow" id="p02PullArrow" viewBox="0 0 82 112" aria-hidden="true">
                <rect x="23" y="4" width="36" height="10" rx="4" fill="#ff3fa4" opacity="0.5"/>
                <rect x="23" y="20" width="36" height="12" rx="4" fill="#ff3fa4" opacity="0.72"/>
                <rect x="23" y="38" width="36" height="14" rx="4" fill="#ff3fa4" opacity="0.9"/>
                <path d="M23,58 L59,58 L59,74 L76,74 L41,108 L6,74 L23,74 Z" fill="#ff3fa4"/>
              </svg>
            </div>
          </div>

          <!-- 우측 끝: 공기 게이지 -->
          <div class="p02-gauge-wrap">
            <div class="gauge is-thin is-vertical p02-gauge-tube">
              <div class="gauge-fill p02-gauge-fill" id="p02Fill"></div>
            </div>
          </div>

          <!-- 힌트 모달 팝업 -->
          <div class="ox-result-wrong is-avatar is-off p02-wrong" id="p02Wrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body"><p class="avatar-popup-text">초가 아직 남아있어요!</p><span class="avatar-popup-sub">더 오래, 더 쎈 바람을 내보내려면<br>어떻게 해야 할까요?</span></div>
            </div>
          </div>

          <!-- 레벨 배너 -->
          <p class="p02-banner is-off" id="p02Banner"><span id="p02BannerText"></span></p>

          <!-- 전체 성공 모달 -->
          <div class="avatar-modal is-off" id="p02Done">
            <div class="avatar-card">
              <img class="avatar-card-avatar" src="../../resources/img/common/avatar_finish.png" alt="">
              <div class="step-flow">
                <div class="step-panel">
                  <div class="avatar-card-body">
                    <p class="avatar-card-title">정말 잘했어요!</p>
                    <p class="avatar-card-text">모든 촛불을 끄는데 성공했어요!</p>
                  </div>
                  <a href="javascript:;" class="avatar-card-btn card-btn is-popup js-nav-effect js-sfx" data-sound="sound/click.mp3">다음</a>
                </div>
                <div class="step-panel is-hidden">
                  <div class="avatar-card-body">
                    <p class="avatar-card-text">손잡이를 깊게 당길수록 폐가 크게 부풀고, 공기가 더 많이 들어왔어요. 공기를 많이 들이마시면 더 길게 내쉴 수 있어요.</p>
                  </div>
                  <a href="javascript:;" class="avatar-card-btn card-btn is-popup js-nav-effect js-sfx" data-sound="sound/click.mp3">다음</a>

                  <div class="avatar-card-body">
                    <p class="avatar-card-text">숨쉬기는 공기를 들이마시고 내쉬는 순서가 계속 반복되는 활동이에요. 이 과정을 ‘순서도’로 나타내 볼까요?</p>
                  </div>

  <script src="../../resources/js/header.js" data-title="생일 축하해! 케이크 촛불 끄기" data-next="page03.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  (function () {
    const clearSfx = makeSfx('sound/12차시_클리어 효과음.mp3', true);
    const HINT_AT = 2;
    const HINT_ONCE = true;

    // 양초 꽂힘 좌표 (p02_cake.png 실제 케이크 중심 x=301px 기준)
    const ROUNDS = [
      {
        n: 5,
        scale: 0.9,
        positions: [
          { x: 361, y: 552, z: 16 },
          { x: 331, y: 522, z: 12 },
          { x: 301, y: 556, z: 16 },
          { x: 271, y: 522, z: 12 },
          { x: 241, y: 552, z: 16 }
        ]
      },
      {
        n: 10,
        scale: 0.78,
        positions: [
          { x: 371, y: 554, z: 16 }, { x: 354, y: 522, z: 12 },
          { x: 336, y: 556, z: 16 }, { x: 318, y: 520, z: 12 },
          { x: 301, y: 558, z: 16 }, { x: 284, y: 520, z: 12 },
          { x: 266, y: 556, z: 16 }, { x: 248, y: 522, z: 12 },
          { x: 231, y: 554, z: 16 }, { x: 214, y: 526, z: 12 }
        ]
      },
      {
        n: 15,
        scale: 0.72,
        positions: [
          { x: 374, y: 558, z: 17 }, { x: 358, y: 538, z: 14 }, { x: 342, y: 518, z: 11 },
          { x: 338, y: 560, z: 17 }, { x: 324, y: 538, z: 14 }, { x: 312, y: 516, z: 11 },
          { x: 301, y: 562, z: 17 }, { x: 290, y: 538, z: 14 }, { x: 280, y: 516, z: 11 },
          { x: 264, y: 560, z: 17 }, { x: 252, y: 538, z: 14 }, { x: 242, y: 518, z: 11 },
          { x: 228, y: 558, z: 17 }, { x: 218, y: 538, z: 14 }, { x: 208, y: 520, z: 11 }
        ]
      }
    ];

    const PULL_PX = 260, MIN_PULL = 0.08, BLOW_MIN = 550, BLOW_MAX = 2200, MAX_BLOW = 4;

    const candlesEl = $('p02Candles');
    const pull = $('p02Pull');
    const pullStr = $('p02PullStr');
    const mem = $('p02Mem');
    const fill = $('p02Fill');
    const lungL = $('p02LungL');
    const lungR = $('p02LungR');
    const girlWrap = $('p02GirlWrap');
    const girlImg = $('p02Girl');
    const wind = $('p02Wind');

    let level = 0;
    let candles = [];
    let remain = 0;
    let attempts = 0;
    let hintShown = false;
    let busy = false;
    let dragging = false;
    let startY = 0;
    let p = 0;

    const updateGauge = (n) => {
      fill.style.height = ((n / MAX_BLOW) * 100) + '%';
    };

    const draw = () => {
      const r = ROUNDS[level];
      candlesEl.innerHTML = '';
      candles = [];

      r.positions.forEach((pt, idx) => {
        const w = 26 * r.scale, h = 112 * r.scale;
        const el = document.createElement('div');
        el.className = 'p02-candle';
        el.style.left = (pt.x - w / 2) + 'px';
        el.style.top = (pt.y - h) + 'px';
        el.style.width = w + 'px';
        el.style.height = h + 'px';
        el.style.zIndex = pt.z || 15;
        el.innerHTML = `<img class="p02-candle-img" src="img/p02_candle_${(idx % 5) + 1}.png" alt=""><div class="p02-flame"></div>`;
        candlesEl.appendChild(el);
        candles.push({ el, pt, h, out: false });
      });

      remain = r.n;
      attempts = 0;
      hintShown = false;
      $('p02LvTx').textContent = 'Level ' + (level + 1);
      $('p02Cnt').textContent = remain;
      girlWrap.classList.remove('is-blowing');
      girlImg.src = 'img/p02_girl.png';
      updateGauge(0);
    };

    const snuff = () => {
      const c = candles.find((x) => !x.out);
      if (!c) return;
      c.out = true;
      c.el.classList.add('is-out');

      const s = document.createElement('div');
      s.className = 'p02-smoke-puff';
      c.el.appendChild(s);
      setTimeout(() => s.remove(), 1200);

      remain--;
      $('p02Cnt').textContent = remain;
    };

    const setPull = (v) => {
      p = v;
      pullStr.style.height = (50 + v * PULL_PX) + 'px';
      mem.style.height = (92 - v * 72) + 'px';
      mem.style.borderRadius = (80 - v * 40) + '% ' + (80 - v * 40) + '% 0 0 / 100% 100% 0 0';

      const s = 0.64 + v * 0.36;
      lungL.style.transform = 'scale(' + s + ')';
      lungR.style.transform = 'scale(' + s + ')';

      const k = v < MIN_PULL ? 0 : Math.min(remain, MAX_BLOW, Math.floor(v * 4.2));
      updateGauge(k);
    };

    const afterBlow = () => {
      wind.classList.remove('is-on');
      girlWrap.classList.remove('is-blowing');
      girlImg.src = 'img/p02_girl.png';
      if (remain <= 0) {
        playCorrect();
        if (level >= ROUNDS.length - 1) {
          setTimeout(() => {
            clearSfx();
            $('p02Done').classList.remove('is-off');
          }, 1800);
        } else {
          const showBanner = (text, ms, then) => {
            $('p02BannerText').textContent = text;
            $('p02Banner').classList.remove('is-off');
            setTimeout(() => { $('p02Banner').classList.add('is-off'); if (then) then(); }, ms);
          };
          setTimeout(() => showBanner('Level ' + (level + 1) + ' 종료!', 1500, () => {
            level++;
            draw();
            showBanner('Level ' + (level + 1) + ' 시작!', 1200, () => { busy = false; });
          }), 600);
        }
        return;
      }
      const hint = HINT_ONCE ? (attempts === HINT_AT && !hintShown) : attempts >= HINT_AT;
      if (hint) {
        hintShown = true;
        playWrong();
        flashLayer($('p02Wrong'), 'is-off', 2000);
        setTimeout(() => { busy = false; }, 2000);
        return;
      }
      busy = false;
    };

    const release = () => {
      if (!dragging) return;
      dragging = false;
      pull.classList.remove('is-drag');
      const depth = p;
      if (depth < MIN_PULL) {
        setPull(0);
        return;
      }
      busy = true;
      attempts++;
      const k = Math.min(remain, MAX_BLOW, Math.floor(depth * 4.2));
      const blowMs = BLOW_MIN + depth * (BLOW_MAX - BLOW_MIN);

      pull.style.transform = 'translate(-50%, 0)';
      pullStr.style.height = '50px';
      mem.style.transition = 'height ' + blowMs + 'ms linear, border-radius ' + blowMs + 'ms linear';
      mem.style.height = '92px';
      mem.style.borderRadius = '80% 80% 0 0 / 100% 100% 0 0';

      lungL.style.transition = 'transform ' + blowMs + 'ms linear';
      lungR.style.transition = 'transform ' + blowMs + 'ms linear';
      fill.style.transition = 'height ' + blowMs + 'ms linear';

      lungL.style.transform = 'scale(0.64)';
      lungR.style.transform = 'scale(0.64)';
      updateGauge(0);
      p = 0;

      wind.classList.add('is-on');
      girlWrap.classList.add('is-blowing');
      girlImg.src = 'img/p02_girl_blow.png';

      for (let i = 0; i < k; i++) {
        setTimeout(snuff, 200 + (blowMs * 0.8) * (i / k));
      }
      setTimeout(() => {
        lungL.style.transition = '';
        lungR.style.transition = '';
        fill.style.transition = '';
        afterBlow();
      }, blowMs + 300);
    };

    pull.addEventListener('pointerdown', (e) => {
      if (busy) return;
      const pullArrow = $('p02PullArrow');
      if (pullArrow) pullArrow.classList.add('is-hidden');
      dragging = true;
      startY = e.clientY;
      pull.classList.add('is-drag');
      lungL.style.transition = 'none';
      lungR.style.transition = 'none';
      mem.style.transition = 'none';
      fill.style.transition = 'height 0.15s ease-out';
      pull.setPointerCapture(e.pointerId);
      playClick();
      e.preventDefault();
    });

    pull.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dy = (e.clientY - startY) / currentScale;
      setPull(Math.max(0, Math.min(1, dy / PULL_PX)));
    });

    pull.addEventListener('pointerup', release);
    pull.addEventListener('pointercancel', release);

    draw();
  })();
  </script>
</body>
