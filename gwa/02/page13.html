<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그래프 해석 왕!</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        .p13-q{position:absolute;left:40px;top:28px;width:1375px;height:178px;box-sizing:border-box;border:solid 5px var(--c-ink);border-radius:60px;background:#fefbf9;box-shadow:0 12px 0 0 rgba(86,148,231,.2);overflow:hidden;font-family:'Cafe24 Ssurround';color:var(--c-ink)}
        .p13-q b{position:absolute;left:0;top:0;bottom:0;width:185px;display:flex;align-items:center;justify-content:center;background:#91b9e7;color:var(--c-white);font-weight:normal;font-size:60px;letter-spacing:-0.04em}
        .p13-q p{position:absolute;left:215px;right:25px;top:50%;transform:translateY(-50%);margin:0;font-size:52px;line-height:1.15;letter-spacing:-0.08em;word-break:keep-all}

        .p13-pause{position:absolute;left:1430px;top:65px;width:100px;height:100px;box-sizing:border-box;padding:0;display:flex;align-items:center;justify-content:center;border:solid 5px var(--c-ink);border-radius:28px;background:linear-gradient(180deg,#fff 0%,#e5ecff 100%);box-shadow:0 10px 0 0 rgba(86,148,231,.25);color:var(--c-ink);cursor:pointer;transition:transform .1s,background .15s}
        .p13-pause:active{transform:translateY(3px)}
        .p13-pause svg{width:78px;height:78px;fill:currentColor;display:block}

        .p13-timer{position:absolute;left:1543px;top:20px;width:342px;height:195px;margin:0}
        .p13-timer img{display:block;width:100%;height:100%}
        .p13-timer span{position:absolute;left:112px;top:50px;width:200px;height:90px;display:flex;align-items:center;justify-content:center;font-family:'Cafe24 Ssurround';font-size:90px;line-height:1;color:var(--c-white);text-shadow:0 0 10px #4cc3ff,0 0 24px #1e8cff}
        .p13-timer.is-hurry span{color:#ffd1d1;text-shadow:0 0 10px #ff5a5a,0 0 24px #e5252a;animation:p13-beat 1s ease infinite}
        @keyframes p13-beat{50%{transform:scale(1.1)}}

        .p13-side{position:absolute;left:40px;top:226px;width:232px;height:707px;box-sizing:border-box;border:solid 3px #053c85;border-radius:16px;background:#266cc8}
        .gauge.is-vertical.p13-gauge{left:110px;top:235px;height:655px}

        .p13-graph{position:absolute;left:287px;top:225px;width:956px;height:708px;box-sizing:border-box;border:solid 5px #266cc8;border-radius:16px;background:var(--c-white)}
        .p13-graph svg{display:block;width:100%;height:100%}
        .p13-graph .p13-star{position:absolute;width:80px;height:80px;background:url('../../resources/img/common/icon_star_on.png') center / contain no-repeat;transform:translate(-50%,-50%);animation:p13-star .8s ease-in-out infinite alternate;pointer-events:none}
        @keyframes p13-star{to{transform:translate(-50%,-70%) scale(1.2)}}

        .p13-opts{position:absolute;left:1260px;top:226px;width:623px;height:707px;box-sizing:border-box;padding-top:65px;display:flex;flex-direction:column;align-items:center;gap:40px;border-radius:16px;background:#266cc8}
        .p13-opts.is-paused{pointer-events:none}
        .p13-opts.is-paused .p13-opt{opacity:.55}
        .p13-opt.card-btn{width:486px;min-width:0;height:110px;padding:6px 0 0;font-size:62px;letter-spacing:-0.04em}
        .deg{font-family:'Pretendard', sans-serif;line-height:1;font-weight:700;vertical-align:-1px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="p13-q"><b id="p13No"></b><p id="p13Ask"></p></div>
          <button type="button" class="p13-pause js-sfx" id="p13Pause" data-sound="sound/click.mp3" aria-label="일시정지">
            <svg id="p13PauseIcon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          </button>
          <div class="p13-timer" id="p13TimerBox"><img src="img/p13_timer.png" alt=""><span id="p13Timer">15</span></div>

          <div class="p13-side"></div>
          <div class="gauge is-vertical p13-gauge"><div class="gauge-fill" id="p13Gauge"></div></div>
          <div class="p13-graph" id="p13Graph"></div>
          <div class="p13-opts opts" id="p13Opts"></div>

          <div class="ox-result-wrong is-avatar is-off" id="p13Wrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text" id="p13WrongText"></p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="그래프 해석 왕!" data-next="page14.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  (function () {
    const LIMIT = 15;
    const formatTime = (h) => {
      const m = h % 24;
      return (m < 12 ? '오전 ' : '오후 ') + (m % 12 || 12) + '시';
    };
    const DATA = [15, 15, 12, 20, 25, 30, 20, 15, 14].map((v, i) => ({ label: formatTime(i * 3), value: v }));
    const QUIZ = [
      { ask: '하루 중 기온이 가장 높은 시간은 언제일까요?', type: 'bar', opts: ['오전 6시', '오전 9시', '오후 3시', '오후 9시'], answer: 2, mark: 5 },
      { ask: '오전 9시부터 오후 3시까지 기온은 어떻게 변하고 있나요?', type: 'line', opts: ['올라간다', '내려간다', '그대로다', '알 수 없다'], answer: 0, ball: [3, 5] },
      { ask: '오후 3시(30<span class="deg">℃</span>)와 오후 9시(15<span class="deg">℃</span>) 사이에 위치한 오후 6시의 기온으로 가장 알맞게 예측한 것은 무엇일까요?', type: 'line', opts: ['40<span class="deg">℃</span>', '20<span class="deg">℃</span>', '5<span class="deg">℃</span>', '0<span class="deg">℃</span>'], answer: 1, hide: 6, mark: 6 },
      { ask: '기온이 두 번째로 높은 시간은?', type: 'bar', opts: ['오전 3시', '오전 6시', '오후 12시', '오전 12시'], answer: 2, mark: 4 }
    ];
    const W = 946;
    const H = 698;
    const PAD = { l: 100, r: 20, t: 68, b: 94 };
    const MAXV = 35;
    const opts = $('p13Opts');
    const graph = $('p13Graph');
    const timerEl = $('p13Timer');
    const timerBox = $('p13TimerBox');
    const pauseBtn = $('p13Pause');
    const pauseIcon = $('p13PauseIcon');
    let index = 0;
    let score = 0;
    let remain = LIMIT;
    let tick = null;
    let lockTimer = null;
    let paused = false;
    let wrongLock = false;
    let resolving = false;

    const draw = (q, opt) => { graph.innerHTML = chartSvg(DATA, Object.assign({ type: q.type, width: W, height: H, color: '#ff7a1a', pad: PAD, max: MAXV, fs: 20, fsUnit: 22 }, opt)); };
    const stopClock = () => { clearInterval(tick); };
    const startClock = () => {
      clearInterval(tick);
      tick = setInterval(() => {
        remain -= 1;
        timerEl.textContent = remain;
        timerBox.classList.toggle('is-hurry', remain <= 5);
        if (remain <= 0) wrong(true);
      }, 1000);
    };
    const setDisabled = (on) => { opts.querySelectorAll('.p13-opt').forEach((b) => b.classList.toggle('is-disabled', on)); };
    const setPauseUi = (on) => {
      paused = on;
      pauseBtn.classList.toggle('is-paused', on);
      pauseBtn.setAttribute('aria-label', on ? '재생' : '일시정지');
      pauseIcon.innerHTML = on
        ? '<polygon points="8,5 20,12 8,19"/>'
        : '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
      opts.classList.toggle('is-paused', on);
    };

    function start() {
      const q = QUIZ[index];
      resolving = false;
      wrongLock = false;
      setPauseUi(false);
      $('p13No').textContent = '질문' + (index + 1);
      $('p13Ask').innerHTML = q.ask.replace('|', '<br>');
      draw(q, { hide: q.hide === undefined ? -1 : q.hide });
      opts.innerHTML = q.opts.map((o, i) => '<button type="button" class="card-btn p13-opt" data-i="' + i + '">' + o + '</button>').join('');
      setDisabled(false);
      remain = LIMIT;
      timerEl.textContent = remain;
      timerBox.classList.remove('is-hurry');
      startClock();
    }

    function next() {
      index += 1;
      if (index < QUIZ.length) { start(); return; }
      try { sessionStorage.setItem('gwa02_score', String(score)); } catch (e) {}
      navigateTo('page14.html');
    }

    function wrong(timeout) {
      setDisabled(true);
      clearTimeout(lockTimer);
      playWrong();
      if (timeout) {
        resolving = true;
        stopClock();
        setTimeout(next, 2000);
        return;
      }
      wrongLock = true;
      $('p13WrongText').textContent = (QUIZ[index].type === 'bar' ? '막대' : '꺾은선') + ' 그래프를 다시 살펴볼까요?';
      flashLayer($('p13Wrong'));
      lockTimer = setTimeout(() => { wrongLock = false; if (!paused) setDisabled(false); }, 2000);
    }

    function effect(q) {
      draw(q, { mark: q.mark === undefined ? -1 : q.mark });
      const svg = graph.querySelector('svg');
      const gap = (W - PAD.l - PAD.r) / DATA.length;
      const px = (i) => PAD.l + gap * i + gap / 2;
      const py = (v) => PAD.t + (H - PAD.t - PAD.b) * (1 - v / MAXV);
      if (q.ball) {
        const pts = [];
        for (let i = q.ball[0]; i <= q.ball[1]; i++) pts.push(px(i) + ',' + py(DATA[i].value));
        svg.insertAdjacentHTML('beforeend', '<circle r="16" fill="#ff8a1f" stroke="#fff" stroke-width="4"><animateMotion dur="1.6s" repeatCount="indefinite" path="M' + pts.join(' L') + '"/></circle>');
      }
      if (q.mark !== undefined) {
        const star = document.createElement('span');
        star.className = 'p13-star';
        star.style.left = px(q.mark) + 'px';
        star.style.top = (py(DATA[q.mark].value) - 50) + 'px';
        graph.appendChild(star);
      }
    }

    pauseBtn.addEventListener('click', () => {
      if (resolving) return;
      setPauseUi(!paused);
      if (paused) {
        stopClock();
        setDisabled(true);
      } else {
        startClock();
        if (!wrongLock) setDisabled(false);
      }
    });

    opts.addEventListener('click', (e) => {
      if (paused) return;
      const b = e.target.closest('.p13-opt');
      if (!b) return;
      const q = QUIZ[index];
      if (Number(b.dataset.i) !== q.answer) { wrong(false); return; }
      resolving = true;
      clearTimeout(lockTimer);
      stopClock();
      setDisabled(true);
      b.classList.add('is-selected');
      playCorrect();
      score += 25;
      $('p13Gauge').style.height = score + '%';
      effect(q);
      setTimeout(next, 3000);
    });

    start();
  })();
  </script>
</body>
</html>
