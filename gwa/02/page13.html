<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그래프 해석 왕!</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 34~35p. 4문제, 문제마다 60초(배경 시계 소리 sound/p13_clock.mp3). 왼쪽 문제+보기 4개, 오른쪽 그래프(공용 chartSvg, 1·4번 막대 / 2·3번 꺾은선).
           정답이면 타이머 멈추고 점수판 한 칸(25점) + 그래프 효과, 오답·시간 초과면 2초 오답 팝업. 어느 쪽이든 다음 문제로, 4문제 뒤 점수를 넘기고(sessionStorage gwa02_score) page14 */
        main{background:linear-gradient(160deg,var(--c-ink),#3a2a6b 60%,#7a5a1e)}

        .p13-q{position:absolute;left:40px;top:30px;width:1380px;height:110px;margin:0;box-sizing:border-box;padding:6px 40px 0;display:flex;align-items:center;gap:30px;
          background:var(--c-white);border:solid 6px var(--c-yellow);border-radius:55px;font-family:'Cafe24 Ssurround';font-size:42px;line-height:1.2;color:var(--c-ink);letter-spacing:-0.05em;word-break:keep-all}
        .p13-q b{flex:0 0 auto;font-weight:normal;color:#c78a00}
        .p13-timer{position:absolute;margin:0;left:1460px;top:30px;width:420px;height:110px;box-sizing:border-box;padding:6px 40px 0;display:flex;align-items:center;justify-content:space-between;
          background:var(--c-white);border:solid 6px var(--c-yellow);border-radius:55px;font-family:'Cafe24 Ssurround';font-size:64px;color:var(--c-ink)}
        .p13-timer svg{width:66px;height:66px;margin-top:-6px}
        .p13-timer.is-hurry{border-color:#e5484d;color:#e5484d;animation:p13-beat 1s ease infinite}
        @keyframes p13-beat{50%{transform:scale(1.06)}}

        .p13-opts{position:absolute;left:40px;top:180px;width:620px;display:flex;flex-direction:column;gap:26px}
        .p13-opt{height:130px;box-sizing:border-box;padding:6px 30px 0;display:flex;align-items:center;gap:24px;border:solid 6px var(--c-yellow);border-radius:30px;background:#fff8dc;cursor:pointer;
          font-family:'Cafe24 Ssurround';font-size:52px;color:var(--c-ink);letter-spacing:-0.04em;box-shadow:0 10px 0 0 #b98a14;transition:transform .15s}
        .p13-opt:hover{transform:translateY(-4px)}
        .p13-opt b{width:76px;height:76px;flex:0 0 auto;border-radius:50%;background:var(--c-ink);color:var(--c-yellow);font-weight:normal;font-size:44px;display:flex;align-items:center;justify-content:center;padding-top:4px;box-sizing:border-box}
        .p13-opt.is-right{background:var(--c-yellow)}
        .p13-opts.is-locked{pointer-events:none}

        .p13-graph{position:absolute;left:700px;top:180px;width:1180px;height:640px;box-sizing:border-box;padding:20px 24px;border:solid 8px var(--c-yellow);border-radius:36px;background:var(--c-white)}
        .p13-graph svg{display:block;width:100%;height:100%}
        .p13-graph .p13-star{position:absolute;font-size:80px;transform:translate(-50%,-50%);animation:p13-star .8s ease-in-out infinite alternate;pointer-events:none}
        @keyframes p13-star{to{transform:translate(-50%,-70%) scale(1.2)}}

        .p13-score{position:absolute;left:700px;top:845px;width:1180px;height:90px;display:flex;align-items:center;gap:20px;font-family:'Cafe24 Ssurround';font-size:44px;color:var(--c-yellow)}
        .p13-score i{flex:1;height:70px;border:solid 5px var(--c-yellow);border-radius:20px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:36px;color:transparent;transition:all .4s}
        .p13-score i.is-on{background:var(--c-yellow);color:var(--c-ink);transform:scale(1.05)}
        .deg{font-family:sans-serif}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main>
          <p class="p13-q"><b id="p13No"></b><span id="p13Ask"></span></p>
          <p class="p13-timer" id="p13TimerBox">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13.5" r="8"/><path d="M12 13.5V9.5M9.5 2.5h5M12 2.5v3M18.5 6l1.5-1.5"/></svg>
            <span id="p13Timer">60</span>
          </p>

          <div class="p13-opts" id="p13Opts"></div>
          <div class="p13-graph" id="p13Graph"></div>

          <div class="p13-score">점수<i>25</i><i>50</i><i>75</i><i>100</i></div>

          <div class="ox-result-wrong is-avatar is-off" id="p13Wrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <p class="avatar-popup-text is-medium" id="p13WrongText"></p>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="그래프 해석 왕!" data-next="page14.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const LIMIT = 60;
    const DATA = [15, 15, 12, 20, 25, 30, 20, 15, 14].map((v, i) => ({ label: i * 3 + '시', value: v }));
    const QUIZ = [
      { ask: '하루 중 기온이 가장 높은 시간은 언제일까요?', type: 'bar', opts: ['오전 6시', '오전 9시', '오후 3시', '오후 9시'], answer: 2, mark: 5 },
      { ask: '오전 9시부터 오후 3시까지 기온은 어떻게 변하고 있나요?', type: 'line', opts: ['올라간다', '내려간다', '그대로다', '알 수 없다'], answer: 0, ball: [3, 5] },
      { ask: '오후 3시(30도)와 오후 9시(15도) 사이에 위치한 오후 6시의 기온으로 가장 알맞게 예측한 것은 무엇일까요?', type: 'line', opts: ['40<span class="deg">℃</span>', '20<span class="deg">℃</span>', '5<span class="deg">℃</span>', '0<span class="deg">℃</span>'], answer: 1, hide: 6, mark: 6 },
      { ask: '기온이 두 번째로 높은 시간은?', type: 'bar', opts: ['오전 3시', '오전 6시', '낮 12시', '자정'], answer: 2, mark: 4 }
    ];
    const NUM = ['①', '②', '③', '④'];
    const W = 1116;
    const H = 584;
    const opts = $('p13Opts');
    const graph = $('p13Graph');
    const timerEl = $('p13Timer');
    const timerBox = $('p13TimerBox');
    const scores = Array.from(document.querySelectorAll('.p13-score i'));
    const clock = new Audio('sound/p13_clock.mp3');
    clock.loop = true;

    let index = 0;
    let score = 0;
    let remain = LIMIT;
    let tick = null;

    const draw = (q, opt) => { graph.innerHTML = chartSvg(DATA, Object.assign({ type: q.type, width: W, height: H, color: q.type === 'line' ? '#2f6fed' : '#ff7a1a' }, opt)); };
    const stopClock = () => { clearInterval(tick); clock.pause(); };

    function start() {
      const q = QUIZ[index];
      $('p13No').textContent = '질문' + (index + 1);
      $('p13Ask').textContent = q.ask;
      draw(q, { hide: q.hide === undefined ? -1 : q.hide });
      opts.innerHTML = q.opts.map((o, i) => '<button type="button" class="p13-opt" data-i="' + i + '"><b class="deg">' + NUM[i] + '</b><span>' + o + '</span></button>').join('');
      opts.classList.remove('is-locked');
      remain = LIMIT;
      timerEl.textContent = remain;
      timerBox.classList.remove('is-hurry');
      clock.currentTime = 0;
      clock.play().catch(() => {});
      clearInterval(tick);
      tick = setInterval(() => {
        remain -= 1;
        timerEl.textContent = remain;
        timerBox.classList.toggle('is-hurry', remain <= 10);
        if (remain <= 0) wrong();
      }, 1000);
    }

    function next() {
      index += 1;
      if (index < QUIZ.length) { start(); return; }
      try { sessionStorage.setItem('gwa02_score', String(score)); } catch (e) {}
      navigateTo('page14.html');
    }

    function wrong() {
      stopClock();
      opts.classList.add('is-locked');
      playWrong();
      $('p13WrongText').textContent = (QUIZ[index].type === 'bar' ? '막대' : '꺾은선') + ' 그래프를 다시 살펴볼까요?';
      flashLayer($('p13Wrong'));
      setTimeout(next, 2200);
    }

    // 정답 효과: 1·4번 해당 막대 노랗게(+별), 2번 공이 꺾은선을 따라 이동, 3번 가린 점이 드러나며 강조
    function effect(q) {
      draw(q, { mark: q.mark === undefined ? -1 : q.mark });
      const svg = graph.querySelector('svg');
      const gap = (W - 110) / DATA.length;
      const px = (i) => 80 + gap * i + gap / 2;
      const py = (v) => 40 + (H - 110) - (v / 35) * (H - 110);
      if (q.ball) {
        const pts = [];
        for (let i = q.ball[0]; i <= q.ball[1]; i++) pts.push(px(i) + ',' + py(DATA[i].value));
        svg.insertAdjacentHTML('beforeend', '<circle r="16" fill="#ff8a1f" stroke="#fff" stroke-width="4"><animateMotion dur="1.6s" repeatCount="indefinite" path="M' + pts.join(' L') + '"/></circle>');
      }
      if (q.mark !== undefined) {
        const star = document.createElement('span');
        star.className = 'p13-star';
        star.textContent = '⭐';
        const r = svg.getBoundingClientRect();
        const s = r.width / W;
        star.style.left = (24 + px(q.mark) * s * (graph.clientWidth - 48) / r.width) + 'px';
        star.style.top = (20 + (py(DATA[q.mark].value) - 50) * (graph.clientHeight - 40) / H) + 'px';
        graph.appendChild(star);
      }
    }

    opts.addEventListener('click', (e) => {
      const b = e.target.closest('.p13-opt');
      if (!b) return;
      const q = QUIZ[index];
      if (Number(b.dataset.i) !== q.answer) { wrong(); return; }
      stopClock();
      opts.classList.add('is-locked');
      b.classList.add('is-right');
      playCorrect();
      score += 25;
      scores[score / 25 - 1].classList.add('is-on');
      effect(q);
      setTimeout(next, 3000);
    });

    start();
  })();
  </script>
</body>
</html>
