<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>직접 만드는 막대그래프와 꺾은선그래프</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        .ask-pill{font-size:64px;letter-spacing:-0.1em}

        .temp-table{position:absolute;left:35px;top:174px;width:520px;height:756px;box-sizing:border-box;border-collapse:separate;border-spacing:0;border:solid 4px #023186;border-radius:14px;overflow:hidden;background:#dff6ff;
        font-family:'Cafe24 Ssurround';text-align:center}
        .temp-table th{height:68px;padding-top:4px;background:#266cc8;color:var(--c-white);font-weight:normal;font-size:42px;letter-spacing:-0.04em}
        .temp-table th:first-child{width:190px}
        .temp-table th + th{background:#69a0e8}
        .temp-table td{height:73px;padding:2px 0 0;font-size:48px;line-height:1;letter-spacing:-0.04em;color:var(--c-ink);background:#b7d9f7}
        .temp-table td + td{background:#dff6ff;color:#266cc8}
        .temp-table tr:nth-child(even) td{background:#b7dff5}
        .temp-table tr:nth-child(even) td + td{background:#dffffb}
        .temp-table tr.is-now td{background:#c5c2f6;color:#49225f;box-shadow:inset 0 3px 0 #a1b2e5,inset 0 -3px 0 #a1b2e5}
        .temp-table tr.is-now td + td{background:#e5dcfb;color:#5166d2;box-shadow:inset 0 3px 0 #c1c9eb,inset 0 -3px 0 #c1c9eb}
        .deg{font-family:'Pretendard', sans-serif;line-height:1;font-weight:500}
        .temp-table{transition:opacity .4s}
        .temp-table.is-off{opacity:0;pointer-events:none}

        .p09-chart{position:absolute;left:580px;top:174px;width:1305px;height:756px;box-sizing:border-box;border:solid 4px #2a6dd0;border-radius:20px;background:var(--c-white);transition:left .6s ease}
        .p09-chart.is-quiz{left:40px}
        .p09-plot{position:absolute;left:84px;top:138px;width:1184px;height:473px;border-left:solid 4px var(--c-ink);border-bottom:solid 4px var(--c-ink);
          background-image:linear-gradient(#dde3ee 2px,transparent 2px);background-size:100% 94.6px;touch-action:none}
        .p09-yl{position:absolute;left:-76px;width:60px;text-align:right;font-family:'Cafe24 Ssurround';font-size:26px;color:#5b5e6e;transform:translateY(-50%)}
        .p09-yt{position:absolute;left:-82px;top:-55px;font-family:'Cafe24 Ssurround';font-size:24px;color:#5b5e6e;white-space:nowrap}
        .p09-x{position:absolute;bottom:-46px;width:120px;margin-left:-60px;text-align:center;font-family:'Cafe24 Ssurround';font-size:28px;color:var(--c-ink);letter-spacing:-0.04em}
        .p09-bar{position:absolute;bottom:0;width:80px;margin-left:-40px;background:#ffc89a;transition:opacity .8s}
        .p09-plot.is-line .p09-bar{opacity:0}
        .p09-plot svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
        .p09-dot{fill:var(--c-white);stroke:#ff7a1a;stroke-width:5}
        .p09-dot.is-done{fill:#ff7a1a}
        .p09-dot.is-next{fill:#ffd633;stroke:#ff9f1a;stroke-width:6}
        .p09-dot.is-now{fill:#ff7a1a;stroke:#ff4ff9;stroke-width:6;cursor:grab}
        .p09-dot.is-blink{animation:p09-blink .4s ease-in-out 5}
        @keyframes p09-blink{50%{opacity:.2}}
        .p09-plot.is-line .p09-dot{fill:#ff7a1a;stroke:#ff7a1a}

        .p09-opts{position:absolute;left:1370px;top:174px;width:522px;height:756px;box-sizing:border-box;padding-top:164px;display:flex;flex-direction:column;align-items:center;gap:74px;border-radius:20px;background:#2a6dd0}
        .p09-opts .card-btn{width:466px;min-width:0;height:170px;padding-top:8px;font-size:62px;letter-spacing:-0.04em}
        .p09-opts.is-off{display:none}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <p class="ask-pill is-fit"><span id="p09Ask">시간 순서대로 점을 이어 보세요!</span></p>

          <table class="temp-table" id="p09Table"><thead><tr><th>시간</th><th>기온(<span class="deg">℃</span>)</th></tr></thead><tbody id="p09Rows"></tbody></table>

          <div class="p09-chart" id="p09Chart">
            <div class="p09-plot" id="p09Plot"><span class="p09-yt">기온(<span class="deg">℃</span>)</span></div>
          </div>

          <div class="p09-opts opts is-off" id="p09Opts">
            <button type="button" class="card-btn js-sfx" data-sound="sound/click.mp3" data-pick="up">점점 올라간다</button>
            <button type="button" class="card-btn js-sfx" data-sound="sound/click.mp3" data-pick="down">점점 내려간다</button>
          </div>

          <div class="ox-result-correct is-avatar is-off" id="p09Right">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_correct_gwa.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">정답이에요!</p>
              </div>
              <div class="avatar-popup-extra"><img src="../../img/common/icon_correct.png" alt=""></div>
            </div>
          </div>
          <div class="ox-result-wrong is-avatar is-off" id="p09Wrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text is-small" id="p09WrongText"></p>
              </div>
            </div>
          </div>

          <div class="avatar-modal is-off" id="p09Done">
            <div class="avatar-card">
              <img class="avatar-card-avatar" src="../../img/common/avatar_finish.png" alt="">
              <div class="step-flow">
                <div class="step-panel">
                  <div class="avatar-card-body is-side"><p class="avatar-card-text">점을 선으로 연결하니 꺾은선그래프가 완성되었어요!<br>낮에는 기온이 올라가고, 저녁에는 다시 내려가는 모습이 한눈에 보여요.</p></div>
                  <a href="page10.html" class="js-nav-effect avatar-card-btn card-btn is-popup js-sfx is-arrow" data-sound="sound/click.mp3">→</a>
                </div>
                <div class="step-panel">
                  <div class="avatar-card-body is-side"><p class="avatar-card-text">숫자만 있을 때보다 그래프로 나타내니 기온이 올라가고 내려가는 모습이 한눈에 보여요!</p></div>
                  <a href="page10.html" class="js-nav-effect avatar-card-btn card-btn is-popup js-sfx is-arrow" data-sound="sound/click.mp3">→</a>
                </div>
                <div class="step-panel">
                  <div class="avatar-card-body is-side"><p class="avatar-card-text">막대그래프는 수치의 크기를 비교해요.<br>꺾은선그래프는 시간에 따른 변화 모습을 알아봐요.</p></div>
                  <a href="page10.html" class="js-nav-effect avatar-card-btn card-btn is-popup js-sfx is-arrow" data-sound="sound/click.mp3">→</a>
                </div>
                <div class="step-panel">
                  <div class="avatar-card-body is-side"><p class="avatar-card-text">숫자를 그림이나 그래프로 한눈에 보기 쉽게 나타내는 것을 ‘시각화’라고 해요.<br>이제 AI에게 그래프 만들기를 부탁해 볼까요?</p></div>
                  <a href="page10.html" class="js-nav-effect avatar-card-btn is-popup next-btn js-sfx card-btn" data-sound="sound/click.mp3">확인</a>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="직접 만드는 막대그래프와 꺾은선그래프" data-next="page10.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const TEMPS = [15, 15, 12, 20, 25, 30, 20, 15, 14];
    const MAX = 30;
    const W = 1184;
    const H = 473;
    const PX = H / MAX;
    const PITCH = (W - 118) / 8;
    const QUIZ = [
      { ask: '3시 ~ 15시까지 기온은 어떻게 변화하고 있나요?', answer: 'up' },
      { ask: '15시 ~ 24시까지 기온은 어떻게 변화하고 있나요?', answer: 'down' }
    ];
    const plot = $('p09Plot');

    TEMPS.forEach((t, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>' + i * 3 + '시</td><td>' + t + '</td>';
      $('p09Rows').appendChild(tr);
    });
    for (let v = 0; v <= MAX; v += 5) plot.insertAdjacentHTML('beforeend', '<span class="p09-yl" style="top:' + (H - v * PX) + 'px">' + v + '</span>');

    const pts = TEMPS.map((t, i) => ({ x: 59 + PITCH * i, y: H - t * PX }));
    pts.forEach((p, i) => {
      plot.insertAdjacentHTML('beforeend', '<div class="p09-bar" style="left:' + p.x + 'px;height:' + (H - p.y) + 'px"></div><span class="p09-x" style="left:' + p.x + 'px">' + i * 3 + '시</span>');
    });
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    plot.appendChild(svg);
    const lines = document.createElementNS(NS, 'g');
    svg.appendChild(lines);
    const temp = document.createElementNS(NS, 'line');
    temp.setAttribute('stroke', '#ff7a1a');
    temp.setAttribute('stroke-width', '6');
    temp.setAttribute('stroke-dasharray', '12 10');
    temp.setAttribute('stroke-linecap', 'round');
    temp.style.display = 'none';
    svg.appendChild(temp);
    const dots = pts.map((p) => {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', p.x);
      c.setAttribute('cy', p.y);
      c.setAttribute('r', 12);
      c.setAttribute('class', 'p09-dot');
      svg.appendChild(c);
      return c;
    });

    let now = 0;
    function mark() {
      dots.forEach((d, i) => {
        d.setAttribute('class', 'p09-dot' + (i < now ? ' is-done' : i === now ? ' is-now' : i === now + 1 ? ' is-next' : ''));
        d.setAttribute('r', i === now + 1 ? 20 : 12);
      });
    }
    mark();

    const toPlot = (e) => {
      const r = plot.getBoundingClientRect();
      return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
    };
    let drawing = false;
    plot.addEventListener('pointerdown', (e) => {
      if (now >= pts.length - 1) return;
      const p = toPlot(e);
      if (Math.hypot(p.x - pts[now].x, p.y - pts[now].y) > 50) return;
      e.preventDefault();
      plot.setPointerCapture(e.pointerId);
      drawing = true;
      temp.setAttribute('x1', pts[now].x);
      temp.setAttribute('y1', pts[now].y);
      temp.setAttribute('x2', p.x);
      temp.setAttribute('y2', p.y);
      temp.style.display = '';
    });
    plot.addEventListener('pointermove', (e) => {
      if (!drawing) return;
      const p = toPlot(e);
      temp.setAttribute('x2', p.x);
      temp.setAttribute('y2', p.y);
    });
    const end = (e) => {
      if (!drawing) return;
      drawing = false;
      temp.style.display = 'none';
      const p = toPlot(e);
      const next = pts[now + 1];
      if (Math.hypot(p.x - next.x, p.y - next.y) > 50) {
        playWrong();
        $('p09WrongText').textContent = '반짝이는 다음 점을 이어 주세요.';
        flashLayer($('p09Wrong'));
        [dots[now], dots[now + 1]].forEach((d) => { d.classList.remove('is-blink'); void d.getBBox(); d.classList.add('is-blink'); });
        return;
      }
      const l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', pts[now].x);
      l.setAttribute('y1', pts[now].y);
      l.setAttribute('x2', next.x);
      l.setAttribute('y2', next.y);
      l.setAttribute('stroke', '#ff7a1a');
      l.setAttribute('stroke-width', '7');
      l.setAttribute('stroke-linecap', 'round');
      lines.appendChild(l);
      playClick();
      now += 1;
      mark();
      if (now === pts.length - 1) {
        plot.classList.add('is-line');
        setTimeout(() => quiz(0), 1600);
      }
    };
    plot.addEventListener('pointerup', end);
    plot.addEventListener('pointercancel', end);

    // 미니퀴즈 2개: 꺾은선만 남은 그래프를 보고 2지선다
    const opts = $('p09Opts');
    let q = 0;
    function quiz(n) {
      q = n;
      $('p09Ask').textContent = QUIZ[n].ask;
      $('p09Chart').classList.add('is-quiz');
      $('p09Table').classList.add('is-off');
      opts.classList.remove('is-off');
    }
    opts.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      if (b.dataset.pick !== QUIZ[q].answer) {
        playWrong();
        $('p09WrongText').innerHTML = '꺾은선 그래프를 다시 확인해보세요.';
        flashLayer($('p09Wrong'), 'is-off', 3000);
        return;
      }
      playCorrect();
      flashLayer($('p09Right'));
      setTimeout(() => {
        if (q + 1 < QUIZ.length) quiz(q + 1);
        else $('p09Done').classList.remove('is-off');
      }, 2100);
    }));
  })();
  </script>
</body>
</html>
