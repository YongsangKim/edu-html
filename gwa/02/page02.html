<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생선 무게를 재고 블록으로 나타내요</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 3~4p. 매대 생선 4개(도미 200·광어 500·우럭 300·멍게 100g)를 접시저울로 끌어 놓으면 바늘이 움직이고, 표에 숫자로 무게 입력.
           맞으면 정답 팝업 + 게이지 25%, 틀리면 입력 지우고 바늘·눈금 반짝. 4개 다 맞히면 완료 안내 → page03.
           생선 그림 img/p02_fish_{dom|gwang|urok|mung}.png(없으면 이모지), 저울은 SVG */

        .p02-ask{position:absolute;left:620px;top:34px;width:1240px;height:100px;margin:0;box-sizing:border-box;padding:6px 40px 0;display:flex;align-items:center;
          background:var(--c-white);border:solid 5px var(--c-ink);border-radius:50px;box-shadow:0 10px 0 0 var(--c-sky-pale);font-family:'Cafe24 Ssurround';font-size:55px;color:var(--c-ink);letter-spacing:-0.05em}
        .p02-gauge{left:100px;top:52px;width:450px}
        .p02-gauge:before{background-image:url('../../img/common/icon_star_on.png')}

        .p02-scale{position:absolute;left:460px;top:190px;width:600px;height:520px}
        .p02-char{position:absolute;left:50px;top:170px;width:360px;height:520px;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
        .p02-char img{max-width:100%;max-height:100%;object-fit:contain}
        .p02-scale svg{width:100%;height:100%;display:block}
        .p02-needle{transform-origin:300px 320px;transition:transform 1s cubic-bezier(.3,1.4,.6,1)}
        .p02-scale.is-hint .p02-needle line, .p02-scale.is-hint .p02-tick.is-on{animation:p02-hint .4s ease-in-out 5}
        @keyframes p02-hint{50%{stroke:var(--c-yellow);fill:#ff9f1a}}
        .p02-plate{position:absolute;left:150px;top:0;width:300px;height:120px}
        .p02-plate .p02-fish{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);cursor:default}

        .p02-table{position:absolute;left:1320px;top:200px;width:500px;border-collapse:separate;border-spacing:0;border:solid 5px var(--c-ink);border-radius:24px;overflow:hidden;background:var(--c-white);
          font-family:'Cafe24 Ssurround';font-size:44px;color:var(--c-ink);text-align:center}
        .p02-table th{height:90px;background:var(--c-sky);color:var(--c-white);font-weight:normal}
        .p02-table td{height:104px;border-top:solid 3px var(--c-mist)}
        .p02-table td + td, .p02-table th + th{border-left:solid 3px var(--c-mist)}
        .p02-table tr.is-now td{background:#fff7d6}
        .p02-table input{width:170px;height:70px;box-sizing:border-box;border:solid 4px #b9b3dd;border-radius:14px;font:inherit;font-size:42px;text-align:center;color:var(--c-blue);background:var(--c-white)}
        .p02-table input:disabled{border-color:var(--c-mist);background:var(--c-pale)}
        .p02-table input.is-ok{border-color:transparent;background:transparent;color:var(--c-blue)}
        .p02-table b{font-weight:normal;margin-left:6px}
        .p02-check{margin-left:10px;height:70px;padding:0 20px;font-size:34px;vertical-align:middle}

        .p02-shelf{position:absolute;left:200px;top:730px;width:1080px;height:190px;box-sizing:border-box;border-radius:30px;background:#c98c56;box-shadow:inset 0 -18px 0 #a86c3a;
          display:flex;align-items:center;justify-content:space-around;padding-bottom:18px}
        .p02-fish{width:200px;height:160px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;border-radius:20px;background:center top / contain no-repeat;
          font-family:'Cafe24 Ssurround';font-size:30px;color:var(--c-white);text-shadow:0 2px 3px rgba(0,0,0,.35);touch-action:none;cursor:grab}
        .p02-fish i{font-style:normal;font-size:130px;line-height:1}
        .p02-emoji{margin-right:10px;font-size:46px;vertical-align:-4px}
        .p02-fish.is-img i{visibility:hidden}
        .p02-fish.is-dragging{z-index:50;cursor:grabbing}
        .p02-fish.is-done{opacity:.35;cursor:default;pointer-events:none}
        .p02-drop{position:absolute;left:600px;top:155px;width:320px;height:150px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <p class="p02-ask">생선을 접시저울에 하나씩 올려 무게를 재어 보세요!</p>
          <div class="gauge is-thin p02-gauge"><div class="gauge-fill" id="p02Fill"></div></div>

          <div class="p02-char"><img src="img/p_character_main.png" alt="메인 캐릭터"></div>
          <div class="p02-scale" id="p02Scale"></div>
          <div class="p02-drop" id="p02Drop" data-key="fish"></div>

          <table class="p02-table">
            <thead><tr><th>생선</th><th>무게</th></tr></thead>
            <tbody id="p02Rows"></tbody>
          </table>

          <div class="p02-shelf" id="p02Shelf"></div>

          <div class="ox-result-correct is-avatar is-off" id="p02Right">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_correct_gwa.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">딩동!</p>
                <p class="avatar-popup-sub" id="p02RightText"></p>
              </div>
              <div class="avatar-popup-extra"><img src="../../img/common/icon_correct.png" alt=""></div>
            </div>
          </div>
          <div class="ox-result-wrong is-avatar is-off" id="p02Wrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <p class="avatar-popup-text is-medium">저울의 바늘이 가리키는 숫자를<br>다시 확인해 보세요.</p>
            </div>
          </div>

          <div class="avatar-modal is-off" id="p02Done">
            <div class="avatar-card">
              <img class="avatar-card-avatar" src="../../img/common/avatar_finish.png" alt="">
              <div class="step-flow">
                <div class="step-panel">
                  <div class="avatar-card-body">
                    <p class="avatar-card-title">측정과 기록 완료!</p>
                    <p class="avatar-card-text">도구를 사용해 무게나 수치를 확인하는 것을 ‘측정’이라고 해요.</p>
                  </div>
                  <a href="page03.html" class="js-nav-effect avatar-card-btn">
                    <img src="../../img/common/btn_arrow_small.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_arrow_small_on.png" data-src-over="../../img/common/btn_arrow_small_over.png" data-sound="sound/click.mp3" alt="다음">
                  </a>
                </div>
                <div class="step-panel">
                  <div class="avatar-card-body is-side">
                    <p class="avatar-card-text">이번에는 생선의 무게만큼<br>블록을 쌓아 올려<br>한눈에 알기 쉽게 표현해볼까?</p>
                  </div>
                  <a href="page03.html" class="js-nav-effect avatar-card-btn">
                    <img src="../../img/common/btn_start_small.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_start_small_on.png" data-src-over="../../img/common/btn_start_small_over.png" data-sound="sound/click.mp3" alt="시작하기">
                  </a>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="생선 무게를 재고 블록으로 나타내요" data-next="page03.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const FISH = [
      { key: 'dom', name: '도미', g: 200, emoji: '🐟' },
      { key: 'gwang', name: '광어', g: 500, emoji: '🐠' },
      { key: 'urok', name: '우럭', g: 300, emoji: '🐡' },
      { key: 'mung', name: '멍게', g: 100, emoji: '🪸' }
    ];
    const MAX = 600;
    const scale = $('p02Scale');
    // 저울에 올려놓는 소리(page03과 같은 소리, 절반 볼륨)
    const dragSfx = new Audio(ASSET_BASE + 'sound/drag.mp3');
    const playDrag = () => { const a = dragSfx.cloneNode(); a.volume = 0.5; a.play().catch(() => {}); };

    // 접시저울: 위 접시 + 둥근 눈금판(0~600g, 100g마다 큰 눈금)
    let ticks = '';
    for (let v = 0; v <= MAX; v += 20) {
      const a = (-120 + (v / MAX) * 240) * Math.PI / 180;
      const big = v % 100 === 0;
      const r1 = big ? 136 : 148;
      ticks += '<line class="p02-tick' + (big ? ' is-big' : '') + '" data-v="' + v + '" x1="' + (300 + r1 * Math.sin(a)) + '" y1="' + (320 - r1 * Math.cos(a)) + '" x2="' + (300 + 162 * Math.sin(a)) + '" y2="' + (320 - 162 * Math.cos(a)) + '" stroke="#1b1738" stroke-width="' + (big ? 6 : 3) + '"/>';
      if (big) ticks += '<text class="p02-tick" data-v="' + v + '" x="' + (300 + 104 * Math.sin(a)) + '" y="' + (320 - 104 * Math.cos(a) + 12) + '" text-anchor="middle" font-size="34" fill="#1b1738" font-family="Cafe24 Ssurround">' + v + '</text>';
    }
    scale.innerHTML = '<svg viewBox="0 0 600 520" aria-hidden="true">' +
      '<rect x="150" y="96" width="300" height="24" rx="12" fill="#9aa3b8"/><rect x="285" y="116" width="30" height="40" fill="#9aa3b8"/>' +
      '<rect x="80" y="140" width="440" height="370" rx="60" fill="#e84b4b"/>' +
      '<circle cx="300" cy="320" r="182" fill="#fff" stroke="#1b1738" stroke-width="8"/>' + ticks +
      '<text x="300" y="430" text-anchor="middle" font-size="30" fill="#5b5e6e" font-family="Cafe24 Ssurround">g</text>' +
      '<g class="p02-needle" id="p02Needle"><line x1="300" y1="320" x2="300" y2="180" stroke="#e84b4b" stroke-width="8" stroke-linecap="round"/></g>' +
      '<circle cx="300" cy="320" r="18" fill="#1b1738"/></svg>' +
      '<div class="p02-plate" id="p02Plate"></div>';
    const needle = $('p02Needle');
    const setNeedle = (g) => { needle.style.transform = 'rotate(' + (-120 + (g / MAX) * 240) + 'deg)'; };
    setNeedle(0);

    function fishEl(f) {
      const el = document.createElement('div');
      el.className = 'p02-fish';
      el.dataset.key = 'fish';
      el.dataset.id = f.key;
      el.innerHTML = '<i>' + f.emoji + '</i>';
      el.setAttribute('aria-label', f.name);
      const img = new Image();
      img.onload = () => { el.style.backgroundImage = "url('" + img.src + "')"; el.classList.add('is-img'); };
      img.src = 'img/p02_fish_' + f.key + '.png';
      return el;
    }

    const rows = $('p02Rows');
    FISH.forEach((f) => {
      const tr = document.createElement('tr');
      tr.dataset.id = f.key;
      tr.innerHTML = '<td><span class="p02-emoji">' + f.emoji + '</span>' + f.name + '</td><td><input type="text" inputmode="numeric" maxlength="3" disabled><b>g</b></td>';
      rows.appendChild(tr);
    });
    const shelf = $('p02Shelf');
    const cards = FISH.map((f) => { const el = fishEl(f); shelf.appendChild(el); return el; });

    let current = null;
    let solved = 0;

    // 숫자만 입력, 세 자리 입력하면(또는 엔터) 바로 확인
    rows.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
      if (e.target.value.length === 3) check(e.target);
    });
    rows.addEventListener('keydown', (e) => { if (e.key === 'Enter') check(e.target); });

    function place(card) {
      playDrag();
      current = FISH.find((f) => f.key === card.dataset.id);
      const plate = $('p02Plate');
      plate.innerHTML = '';
      const copy = fishEl(current);
      plate.appendChild(copy);
      card.classList.add('is-done');
      setNeedle(current.g);
      rows.querySelectorAll('tr').forEach((tr) => {
        const on = tr.dataset.id === current.key;
        tr.classList.toggle('is-now', on);
        const input = tr.querySelector('input');
        if (on) { input.disabled = false; setTimeout(() => input.focus(), 1000); }
      });
      dropZone.dataset.filled = '1';
    }

    function check(input) {
      if (!current || input.disabled || !input.value) return;
      if (Number(input.value) !== current.g) {
        playWrong();
        flashLayer($('p02Wrong'));
        input.value = '';
        scale.querySelectorAll('.p02-tick').forEach((t) => t.classList.toggle('is-on', Number(t.dataset.v) === current.g));
        scale.classList.remove('is-hint');
        void scale.offsetWidth;
        scale.classList.add('is-hint');
        return;
      }
      input.disabled = true;
      input.classList.add('is-ok');
      input.closest('tr').classList.remove('is-now');
      playCorrect();
      $('p02RightText').textContent = current.name + ' ' + current.g + 'g!';
      flashLayer($('p02Right'));
      solved += 1;
      $('p02Fill').style.width = (solved * 25) + '%';
      current = null;
      setTimeout(() => {
        $('p02Plate').innerHTML = '';
        setNeedle(0);
        delete dropZone.dataset.filled;
        if (solved === FISH.length) {
          $('p02Done').classList.remove('is-off');
        }
      }, 2000);
    }

    const dropZone = $('p02Drop');
    initMatchDrag({ cards: cards, zones: [dropZone], slop: 60, onRight: (card) => { shelf.insertBefore(card, shelf.children[cards.indexOf(card)] || null); place(card); } });
  })();
  </script>
</body>
</html>
