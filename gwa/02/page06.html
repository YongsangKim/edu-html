<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>순서대로! 데이터 측정에서 시각화까지</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 9~11p. 1·2·3단계 칸 중 지금 단계만 밝게, 아래 섞인 카드 3장(측정·기록·정리·시각화)을 끌어 놓기.
           맞으면 카드 고정 + 단계 설명(5초, 설명 음성 sound/p06_step{1~3}.mp3), 틀리면 2초 오답 팝업 후 제자리. 3단계 끝나면 반짝 테두리 → 정리 3단계 → page07.
           카드 그림 img/p06_card_{measure|record|visual}.png(없으면 이모지) */
        main{position:absolute;left:0;top:120px;width:1920px;height:960px}

        .p06-ask{position:absolute;left:160px;top:34px;width:1600px;height:100px;margin:0;box-sizing:border-box;padding:6px 40px 0;display:flex;align-items:center;justify-content:center;
          background:#fff;border:solid 5px #1b1738;border-radius:50px;box-shadow:0 10px 0 0 #becde7;font-family:'Cafe24 Ssurround';font-size:44px;color:#1b1738;letter-spacing:-0.05em}

        .p06-steps{position:absolute;left:160px;top:180px;width:1600px;height:400px;box-sizing:border-box;border:solid 6px #48159c;border-radius:36px;background:#fff;
          display:flex;align-items:center;justify-content:space-around;padding:0 40px}
        .p06-steps.is-all{animation:p06-glow 1s ease-in-out 3}
        @keyframes p06-glow{50%{box-shadow:0 0 0 12px #ffd83d,0 0 40px 10px #ffd83d}}
        .p06-step{display:flex;flex-direction:column;align-items:center;gap:14px;opacity:.35;transition:opacity .3s}
        .p06-step.is-now, .p06-step.is-done{opacity:1}
        .p06-step b{font-weight:normal;font-family:'Cafe24 Ssurround';font-size:44px;color:#48159c}
        .p06-slot{width:360px;height:270px;box-sizing:border-box;border:dashed 5px #b9b3dd;border-radius:28px;background:#f6f4ff;display:flex;align-items:center;justify-content:center}
        .p06-step.is-now .p06-slot{border-color:#ff4ff9;animation:p06-slot 1.2s ease-in-out infinite}
        @keyframes p06-slot{50%{background:#ffe9fb}}
        .p06-step.is-done .p06-slot{border:solid 5px #22a35a;background:#e9f8ee;animation:none}
        .p06-arrow{font-size:70px;color:#b9b3dd}

        .p06-tray{position:absolute;left:160px;top:640px;width:1600px;height:290px;display:flex;justify-content:center;gap:80px}
        .p06-card{width:330px;height:250px;box-sizing:border-box;border:solid 5px #1b1738;border-radius:24px;background:#fff;box-shadow:0 10px 0 0 #becde7;
          display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:'Cafe24 Ssurround';font-size:52px;color:#1b1738;touch-action:none;cursor:grab}
        .p06-card i{width:150px;height:130px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:96px;background:center / contain no-repeat}
        .p06-card i.is-img{font-size:0}
        .p06-card.is-dragging{z-index:50;cursor:grabbing}
        .p06-slot .p06-card{box-shadow:none;border:0;background:transparent;cursor:default}

        .p06-talk{position:absolute;left:160px;top:640px;width:1600px;height:290px;box-sizing:border-box;padding:30px 60px 30px 300px;display:flex;align-items:center;
          background:#fefbf9;border:solid 5px #48159c;border-radius:40px;box-shadow:-7px 10px 6px 2px rgba(92,61,240,.17);
          font-family:'Cafe24 Ssurround';font-size:46px;line-height:1.35;color:#48159c;letter-spacing:-0.05em;word-break:keep-all;z-index:20}
        .p06-talk img{position:absolute;left:30px;top:30px;width:230px}
        .p06-talk.is-off{display:none}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <p class="p06-ask" id="p06Ask">온습도계가 데이터를 처리하는 순서에 맞게 카드를 올려보세요!</p>

          <div class="p06-steps" id="p06Steps">
            <div class="p06-step"><b>1단계</b><div class="p06-slot" data-key="measure"></div></div>
            <span class="p06-arrow">▶</span>
            <div class="p06-step"><b>2단계</b><div class="p06-slot" data-key="record"></div></div>
            <span class="p06-arrow">▶</span>
            <div class="p06-step"><b>3단계</b><div class="p06-slot" data-key="visual"></div></div>
          </div>

          <div class="p06-tray" id="p06Tray"></div>
          <p class="p06-talk is-off" id="p06Talk"><img src="../../img/common/avatar_correct_gwa.png" alt=""><span id="p06TalkText"></span></p>

          <div class="ox-result-wrong is-avatar is-off" id="p06Wrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../img/common/avatar_incorrect.png" alt=""></div>
              <p class="avatar-popup-text is-medium">아직 이 단계가 아니에요.<br>데이터 처리 순서를 다시 생각해 보세요!</p>
            </div>
          </div>

          <div class="avatar-modal is-off" id="p06Done">
            <div class="avatar-card">
              <img class="avatar-card-avatar" src="../../img/common/avatar_finish.png" alt="">
              <div class="step-flow">
                <div class="step-panel">
                  <div class="avatar-card-body">
                    <p class="avatar-card-title">잘했어요!</p>
                    <p class="avatar-card-text">데이터를 처리하기 위한 3단계를 잘 확인했나요?</p>
                  </div>
                  <a href="page07.html" class="js-nav-effect avatar-card-btn">
                    <img src="../../img/common/btn_arrow_small.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_arrow_small_on.png" data-src-over="../../img/common/btn_arrow_small_over.png" data-sound="sound/click.mp3" alt="다음">
                  </a>
                </div>
                <div class="step-panel">
                  <div class="avatar-card-body is-side">
                    <p class="avatar-card-text">1단계는 도구로 수치를 ‘측정’하는 단계!<br>2단계는 측정한 값을 기록하는 단계!<br>3단계는 그래프로 시각화하는 단계예요!</p>
                  </div>
                  <a href="page07.html" class="js-nav-effect avatar-card-btn">
                    <img src="../../img/common/btn_arrow_small.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_arrow_small_on.png" data-src-over="../../img/common/btn_arrow_small_over.png" data-sound="sound/click.mp3" alt="다음">
                  </a>
                </div>
                <div class="step-panel">
                  <div class="avatar-card-body is-side">
                    <p class="avatar-card-text">이제 우리 그래프로 시각화하는 3단계를 조금 더 연습해 볼까요?</p>
                  </div>
                  <a href="page07.html" class="js-nav-effect avatar-card-btn">
                    <img src="../../img/common/btn_next_small.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_next_small_on.png" data-src-over="../../img/common/btn_next_small_over.png" data-sound="sound/click.mp3" alt="다음">
                  </a>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="순서대로! 데이터 측정에서 시각화까지" data-next="page07.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    const STEPS = [
      { key: 'measure', name: '측정', emoji: '🌡️', text: '잘했어! 첫번째 단계는 ‘측정’이야. 온도계나 습도계 같은 도구로 수치를 재는 것을 ‘측정’이라고 해.' },
      { key: 'record', name: '기록·정리', emoji: '📋', text: '잘했어! 두번째 단계는 ‘기록·정리’야. 측정한 숫자를 표의 알맞은 칸에 적고 다듬는 것을 ‘기록·정리’라고 해.' },
      { key: 'visual', name: '시각화', emoji: '📊', text: '마지막 단계는 ‘시각화’야. 복잡한 숫자를 그림이나 그래프로 바꾸어 한눈에 보기 쉽게 만드는 것을 ‘시각화’라고 해.' }
    ];
    const ASK = '온습도계가 데이터를 처리하는 순서에 맞게 카드를 올려보세요!';
    const $ = (id) => document.getElementById(id);
    const ask = $('p06Ask');
    const tray = $('p06Tray');
    const talk = $('p06Talk');
    const steps = Array.from(document.querySelectorAll('.p06-step'));
    const zones = steps.map((s) => s.querySelector('.p06-slot'));
    const playCorrect = makeSfx('sound/correct.mp3');
    const playWrong = makeSfx('sound/incorrect.mp3');

    const cards = shuffleArray(STEPS).map((s) => {
      const c = document.createElement('div');
      c.className = 'p06-card';
      c.dataset.key = s.key;
      c.innerHTML = '<i>' + s.emoji + '</i>' + s.name;
      const img = new Image();
      img.onload = () => { const i = c.querySelector('i'); i.style.backgroundImage = "url('" + img.src + "')"; i.classList.add('is-img'); };
      img.src = 'img/p06_card_' + s.key + '.png';
      tray.appendChild(c);
      return c;
    });

    let now = 0;
    let hintTimer = null;
    // 지금 단계 칸만 받음(나머지 칸은 찬 것으로 처리해서 놓아도 반응 없음)
    function activate() {
      steps.forEach((s, i) => s.classList.toggle('is-now', i === now));
      zones.forEach((z, i) => { if (i === now) delete z.dataset.filled; else z.dataset.filled = '1'; });
      ask.textContent = ASK;
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => { ask.textContent = (now + 1) + '단계에 와야 할 카드는 무엇일까요?'; }, 3000);
    }

    initMatchDrag({
      cards: cards,
      zones: zones,
      slop: 40,
      onRight: () => {
        clearTimeout(hintTimer);
        playCorrect();
        const step = STEPS[now];
        steps[now].classList.remove('is-now');
        steps[now].classList.add('is-done');
        zones.forEach((z) => { z.dataset.filled = '1'; });
        $('p06TalkText').textContent = step.text;
        talk.classList.remove('is-off');
        const voice = new Audio('sound/p06_step' + (now + 1) + '.mp3');
        voice.play().catch(() => {});
        setTimeout(() => {
          talk.classList.add('is-off');
          now += 1;
          if (now < STEPS.length) { activate(); return; }
          ask.textContent = ASK;
          $('p06Steps').classList.add('is-all');
          setTimeout(() => $('p06Done').classList.remove('is-off'), 3200);
        }, 5000);
      },
      onWrong: (card, zone) => {
        if (!zone) return;
        playWrong();
        flashLayer($('p06Wrong'));
      }
    });

    activate();
  })();
  </script>
</body>
</html>
