<!DOCTYPE html>
<html lang="ko">
<head>

    <title>순서대로! 데이터 측정에서 시각화까지</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 8p 안내 화면. gwa/03 page12와 같은 구성: 리본 제목 + 안내 문장 + '활동 방법' 상자. 캐릭터는 gwa/05 임시 캐릭터 복사본 */
        main{position:absolute;left:0;top:120px;width:1920px;height:960px}
        .intro-panel.p-how-panel{justify-content:flex-start;gap:40px;padding:100px 60px 170px 70px}
        .intro-tab{top:-60px;font-size:54px;letter-spacing:-0.1em;line-height:1.9em}
        .p-how-lead{margin:0;font-size:46px;line-height:1.3;color:#1b1738;letter-spacing:-0.06em}
        .p-how{position:relative;margin:0;padding:46px 40px 22px;border:solid 5px #023187;border-radius:12px;background:#dff4fc}
        .p-how b{position:absolute;left:50%;top:-34px;transform:translateX(-50%);height:66px;padding:4px 50px 0;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;
          font-weight:normal;background:#023187;border-radius:33px;font-size:40px;color:#fff}
        .p-how .intro-list{font-size:38px;color:#023187}
        .p-how .intro-list li + li{margin-top:8px}

</head>
<body>
  <div id="page-fade"></div>

              <li>1. 영상에서 확인한 데이터 처리 순서에 따라 카드를 알맞은 순서에 놓아요.</li>

              </ol>

          </div>

          <a href="page06.html" class="js-nav-effect next-btn-activity">
            <img src="../../img/common/btn_start.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_start_on.png" data-src-over="../../img/common/btn_start_over.png" data-sound="sound/click.mp3" alt="시작하기">

  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="순서대로! 데이터 측정에서 시각화까지" data-next="page06.html"></script>
