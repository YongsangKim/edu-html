<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그래프 해석 왕!</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 36p 학습 종료. 공용 마무리 구성(end-*).
           page13 점수(sessionStorage gwa02_score)가 100점이면 축하 문구 + 두 버튼, 아니면 다시 도전 문구 + [게임 다시하기]만. 목차로 바로 들어오면 100점으로 봄 */
        .p14-character{position:absolute;left:0;bottom:0;width:800px;height:944px;z-index:10}
        .p14-character img{display:block;width:100%;height:100%;object-fit:contain}
        .end-panel .end-desc{font-size:46px;line-height:1.3;letter-spacing:-0.04em;color:var(--c-ink)}
        .end-lead{font-size:52px;letter-spacing:-0.06em}
        .end-btn-next-lesson.is-disabled{filter:grayscale(1);opacity:.45;pointer-events:none}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="p14-character"><img src="img/p14_character.png" alt="메인 캐릭터"></div>

          <p class="end-title" id="p14Title">최고예요!</p>
          <div class="end-panel" id="p14Panel">
            <p class="end-lead">축하해! 그래프를 보고 가장 높은 기온과 기온의 변화를 모두 찾아냈어!<br>넌 그래프 해석 왕이야!</p>
            <p class="end-desc">정확한 데이터 측정과 한눈에 보이는 데이터 시각화 덕분에 기온의 크기와 변화를 쉽게 알아낼 수 있었어요.</p>
          </div>

          <a href="page12.html" class="js-nav-effect end-btn-retry">
            <img src="../../img/common/btn_retry.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_retry_on.png" data-src-over="../../img/common/btn_retry_over.png" data-sound="sound/click.mp3" alt="게임 다시하기">
          </a>
          <a href="../03/page01.html" class="js-nav-effect end-btn-next-lesson" id="p14Next">
            <img src="../../img/common/btn_next_lesson.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_next_lesson_on.png" data-src-over="../../img/common/btn_next_lesson_over.png" data-sound="sound/click.mp3" alt="다음차시 학습하기">
          </a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="그래프 해석 왕!" data-next="../gwa.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
  <script>
  (function () {
    let score = 100;
    try { const v = sessionStorage.getItem('gwa02_score'); if (v !== null) score = Number(v); } catch (e) {}
    if (score >= 100) return;
    document.getElementById('p14Panel').innerHTML = '<p class="end-lead">100점을 위해 다시 한번 도전해 볼까?</p>';
    document.getElementById('p14Next').classList.add('is-disabled');
  })();
  </script>
</body>
</html>
