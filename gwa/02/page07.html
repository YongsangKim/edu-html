<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>직접 만드는 막대그래프와 꺾은선그래프</title>
    <link rel="stylesheet" href="../../css/common.css">
    <style>
        /* 디자인 없음 - 기획서 12p 안내 화면. gwa/03 page12와 같은 구성: 리본 제목 + 안내 문장 + '활동 방법' 상자. 캐릭터는 gwa/05 임시 캐릭터 복사본 */
        main{position:absolute;left:0;top:120px;width:1920px;height:960px}
        .intro-panel.p-how-panel{justify-content:flex-start;gap:40px;padding:100px 60px 170px 70px}
        .intro-tab{top:-60px;font-size:56px;letter-spacing:-0.08em;line-height:1.8em}
        .p-how-lead{margin:0;font-size:40px;line-height:1.3;color:#1b1738;letter-spacing:-0.06em}
        .p-how{position:relative;margin:0;padding:46px 40px 22px;border:solid 5px #023187;border-radius:12px;background:#dff4fc}
        .p-how b{position:absolute;left:50%;top:-34px;transform:translateX(-50%);height:66px;padding:4px 50px 0;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;
          font-weight:normal;background:#023187;border-radius:33px;font-size:40px;color:#fff}
        .p-how .intro-list{font-size:36px;color:#023187}
        .p-how .intro-list li + li{margin-top:8px}
        .p-how-tip{margin:14px 0 0;font-family:'Cafe24 Ssurround';font-size:30px;line-height:1.3;color:#48159c;letter-spacing:-0.05em}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="intro-character"><img src="img/p_character_intro.png" alt="메인 캐릭터"></div>
          <div class="intro-panel p-how-panel">
            <p class="intro-tab">직접 만드는 막대그래프와 꺾은선그래프</p>
            <p class="p-how-lead">하룻동안 부산의 기온을 측정하여 기록한 기온표를 확인하고,<br>막대그래프와 꺾은선그래프로 시각화해 봅시다.</p>
            <div class="p-how">
              <b>활동 방법</b>
              <ol class="intro-list">
              <li>1. 부산의 기온이 정리된 기온표를 확인해요.</li>
              <li>2. 기온에 맞게 블록을 쌓아 막대그래프로 나타내요.</li>
              <li>3. 막대 끝의 점을 연결하여 꺾은선그래프로 나타내요.</li>
              </ol>
            </div>
          </div>

          <a href="page08.html" class="js-nav-effect next-btn-activity">
            <img src="../../img/common/btn_start.png" class="js-img-swap js-sfx" data-src-alt="../../img/common/btn_start_on.png" data-src-over="../../img/common/btn_start_over.png" data-sound="sound/click.mp3" alt="시작하기">
          </a>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../js/header.js" data-title="직접 만드는 막대그래프와 꺾은선그래프" data-next="page08.html"></script>
  <script src="../../js/toc-gwa.js"></script>
  <script src="../../js/common.js"></script>
</body>
</html>
