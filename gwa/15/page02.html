<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘은 내가 바리스타!</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        .p02-stage{position:relative;width:1920px;height:960px;overflow:hidden;background:linear-gradient(180deg,#d8e6f3 0%,#eef3f8 58%,#d9c5b2 58%,#c9b29b 72%);font-family:'Cafe24 Ssurround'}
        .p02-bg-img{position:absolute;left:0;top:0;width:1920px;height:960px;object-fit:cover;pointer-events:none;z-index:0}
        .p02-window{position:absolute;left:580px;top:0;width:1080px;height:560px;background:linear-gradient(180deg,rgba(255,252,235,.75),rgba(235,245,255,.55));border-left:18px solid #d5cabd;border-right:18px solid #d5cabd;border-bottom:16px solid #c2b4a3;z-index:0}
        .p02-stools{position:absolute;left:670px;top:450px;width:620px;height:240px;display:flex;justify-content:space-between;pointer-events:none;z-index:1}
        .p02-stool{width:130px;height:230px;position:relative}
        .p02-stool::before{content:'';position:absolute;left:5px;top:0;width:120px;height:24px;border-radius:50%;background:#e3cbb0;box-shadow:0 6px 0 #c6ab8c}
        .p02-stool::after{content:'';position:absolute;left:22px;top:24px;width:86px;height:190px;border-left:12px solid #d8be9e;border-right:12px solid #d8be9e;box-sizing:border-box}
        .p02-counter{position:absolute;left:0;top:690px;width:1920px;height:270px;background:linear-gradient(180deg,#d5a87c 0%,#be8b5b 18%,#a87446 100%);border-top:8px solid #e7c29d;box-shadow:inset 0 18px 30px rgba(255,255,255,.22);z-index:3}
        .p02-guest-wrap{position:absolute;left:80px;top:30px;width:540px;height:660px;display:flex;align-items:flex-end;justify-content:center;z-index:2;transition:transform .45s cubic-bezier(.22,.9,.32,1),opacity .35s}
        .p02-guest-wrap.is-enter{transform:translateX(-140px);opacity:0}
        .p02-guest-card{position:relative;width:460px;height:630px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
        .p02-guest-card img{position:absolute;left:0;bottom:0;width:100%;height:100%;object-fit:contain;object-position:bottom center}
        .p02-guest-svg{width:420px;height:600px;filter:drop-shadow(0 12px 18px rgba(0,0,0,.18))}
        .p02-order-bubble{position:absolute;left:625px;top:206px;width:590px;min-height:230px;padding:34px 40px 28px;box-sizing:border-box;background:#fff;border:6px solid #266cc8;border-radius:24px;box-shadow:0 10px 0 rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;text-align:left;color:#2068c5;font-size:48px;line-height:1.32;letter-spacing:-0.04em;word-break:keep-all;z-index:4;transition:transform .2s}
        .p02-order-bubble.is-center{justify-content:center;text-align:center;font-size:54px}
        .p02-order-bubble::before{content:'';position:absolute;left:-46px;top:92px;border-width:20px 46px 20px 0;border-style:solid;border-color:transparent #266cc8 transparent transparent}
        .p02-order-bubble::after{content:'';position:absolute;left:-34px;top:96px;border-width:16px 38px 16px 0;border-style:solid;border-color:transparent #fff transparent transparent}
        .p02-shot-pill{position:absolute;left:1040px;top:24px;width:798px;height:122px;box-sizing:border-box;border:6px solid #266cc8;border-radius:64px;background:#fff;display:flex;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,.12);z-index:5}
        .p02-shot-label{width:324px;height:100%;background:#7fb2f0;color:#fff;font-size:48px;display:flex;align-items:center;justify-content:center;letter-spacing:-0.04em;padding-top:6px}
        .p02-shot-beans{flex:1;display:flex;align-items:center;justify-content:space-evenly;padding:0 24px}
        .p02-bean{width:88px;height:88px;transition:transform .25s,filter .25s}
        .p02-bean.is-on{transform:scale(1.06)}
        .p02-recipe-open{position:absolute;left:670px;top:38px;height:94px;padding:8px 34px 0;font-size:38px;border-radius:47px;z-index:5}
        .p02-deliver-btn{position:absolute;left:118px;top:735px;width:494px;height:132px;font-size:56px;border-radius:26px;z-index:6}
        .p02-glass-zone{position:absolute;left:835px;top:525px;width:250px;height:395px;display:flex;align-items:flex-end;justify-content:center;z-index:5;transition:transform .25s,opacity .25s}
        .p02-glass-zone.is-over{transform:scale(1.05);filter:drop-shadow(0 0 18px #ffe600)}
        .p02-glass-zone.is-delivered{opacity:0;transform:translateY(-30px) scale(.92);pointer-events:none}
        .p02-glass-svg{width:220px;height:360px;overflow:visible;filter:drop-shadow(0 14px 16px rgba(0,0,0,.22))}
        .p02-liquid{transition:fill .4s ease,opacity .4s ease}
        .p02-machine{position:absolute;left:1335px;top:178px;width:526px;height:742px;z-index:5}
        .p02-hoppers{position:absolute;left:46px;top:0;width:404px;height:112px;display:flex;gap:12px}
        .p02-hopper{flex:1;background:linear-gradient(180deg,rgba(40,30,25,.88) 0%,rgba(65,42,26,.95) 30%,#3d2210 100%);border:5px solid #2b2420;border-bottom:none;border-radius:16px 16px 0 0;position:relative;overflow:hidden}
        .p02-hopper::after{content:'';position:absolute;left:10px;right:10px;top:24px;bottom:6px;border-radius:10px;background:radial-gradient(circle at 20% 30%,#734222 6px,transparent 7px),radial-gradient(circle at 60% 40%,#5c3216 7px,transparent 8px),radial-gradient(circle at 40% 70%,#824c28 6px,transparent 7px),#472611;background-size:28px 24px}
        .p02-machine-body{position:absolute;left:0;top:110px;width:496px;height:520px;background:linear-gradient(90deg,#6e5b4f 0%,#cbb7a8 18%,#968173 48%,#d8c6b8 82%,#5e4c41 100%);border:6px solid #2d241e;border-radius:22px 22px 8px 8px;box-shadow:inset 0 6px 12px rgba(255,255,255,.45)}
        .p02-machine-head{position:absolute;left:128px;top:124px;width:244px;height:178px;background:linear-gradient(180deg,#1d1918 0%,#352f2d 100%);border:5px solid #120f0e;border-radius:14px}
        .p02-brew-btn{position:absolute;left:176px;top:148px;width:148px;height:148px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,#f7f2eb 70%,#e5dacb 100%);border:9px solid #e7c078;box-shadow:0 8px 18px rgba(0,0,0,.38),inset 0 4px 8px #fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:transform .12s,box-shadow .12s;z-index:3}
        .p02-brew-btn:hover{transform:scale(1.05);box-shadow:0 0 0 6px rgba(255,230,0,.75),0 8px 18px rgba(0,0,0,.38)}
        .p02-brew-btn:active{transform:scale(.96)}
        .p02-brew-btn svg{width:92px;height:92px}
        .p02-spout-box{position:absolute;left:192px;top:302px;width:116px;height:100px;background:linear-gradient(90deg,#5b4d44,#cfc2b8 45%,#4b3e36);border:5px solid #241d19;border-top:none;border-radius:0 0 16px 16px;z-index:2}
        .p02-spout-Left,.p02-spout-Right{position:absolute;bottom:-18px;width:14px;height:18px;background:#241d19;border-radius:0 0 4px 4px}
        .p02-spout-Left{left:28px}
        .p02-spout-Right{right:28px}
        .p02-stream{position:absolute;top:416px;width:7px;height:0;background:linear-gradient(180deg,#5c2c0c,#c87d32);border-radius:4px;opacity:0;transition:height .2s,opacity .15s;z-index:2}
        .p02-stream.s1{left:224px}
        .p02-stream.s2{left:270px}
        .p02-machine.is-brewing .p02-stream{height:118px;opacity:1}
        .p02-machine-well{position:absolute;left:120px;top:300px;width:260px;height:310px;background:linear-gradient(180deg,#1a1412 0%,#2d2420 50%,#140f0d 100%);border-left:5px solid #120e0c;border-right:5px solid #120e0c;z-index:1}
        .p02-drip-tray{position:absolute;left:-14px;bottom:0;width:524px;height:122px;background:linear-gradient(180deg,#4d433c 0%,#1f1a17 38%,#120f0d 100%);border:6px solid #120f0d;border-radius:18px;box-shadow:0 14px 24px rgba(0,0,0,.38);z-index:2}
        .p02-drip-grid{position:absolute;left:28px;right:28px;top:10px;height:28px;border-radius:8px;background:repeating-linear-gradient(90deg,#8c7f75 0 10px,#221d1a 10px 24px);border:3px solid #2b2420}
        .p02-shot-cup{position:absolute;left:1510px;top:640px;width:170px;height:140px;z-index:12;cursor:grab;touch-action:none;user-select:none;transition:transform .28s ease,left .28s ease,top .28s ease}
        .p02-shot-cup.is-dragging{transition:none;cursor:grabbing;z-index:40}
        .p02-shot-cup.is-ready{filter:drop-shadow(0 0 14px #ffe600)}
        .p02-shot-cup.is-pouring{transform:rotate(-58deg) translate(-20px,-20px)}
        .p02-shot-cup svg{width:170px;height:140px;overflow:visible}
        .p02-shot-fill{opacity:0;transition:opacity .35s ease}
        .p02-shot-cup.is-ready .p02-shot-fill,.p02-shot-cup.is-pouring .p02-shot-fill{opacity:1}
        .p02-pour-drop{opacity:0;transition:opacity .15s}
        .p02-shot-cup.is-pouring .p02-pour-drop{opacity:1}
        .p02-recipe-modal{position:absolute;left:0;top:0;width:1920px;height:960px;background:rgba(15,12,28,.55);display:flex;align-items:center;justify-content:center;z-index:35}
        .p02-recipe-card{position:relative;width:1492px;height:752px;background:#fff;border:6px solid #48159c;border-radius:42px;box-sizing:border-box;padding:52px 70px 46px;box-shadow:0 20px 44px rgba(0,0,0,.28)}
        .p02-recipe-head{margin:0;text-align:center;font-size:56px;color:#48159c;letter-spacing:-0.04em}
        .p02-recipe-close{position:absolute;right:30px;top:30px;width:90px;cursor:pointer}
        .p02-recipe-box{position: absolute;left:208px;top:156px;width:1140px;height:520px;border:5px solid #48159c;border-radius:32px;overflow:hidden;background:#fff}
        .p02-recipe-box-tit{height:106px;background:#e5d8ff;color:#7a3ee0;font-size:50px;display:flex;align-items:center;justify-content:center;letter-spacing:-0.03em}
        .p02-recipe-rows{padding:10px 80px 0 280px}
        .p02-recipe-row{height:132px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #e6def5;font-size:52px;color:#48159c;letter-spacing:-0.03em;padding:0 40px}
        .p02-recipe-row:last-child{border-bottom:none}
        .p02-recipe-row span{display:inline-block;min-width:270px}
        .p02-recipe-cup{width:96px;height:110px}
        .p02-recipe-aro{position:absolute;left:42px;bottom:0;width:430px;height:580px;pointer-events:none;display:flex;align-items:flex-end;justify-content:center}
        .p02-recipe-aro img{width:100%;height:100%;object-fit:contain;object-position:bottom}
        .p02-limit-modal,.p02-done{z-index:45}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default p02-stage" id="p02Stage">
          <img class="p02-bg-img" src="img/p02_bg.png" alt="" onerror="this.style.display='none'">
          <div class="p02-window"></div>
          <div class="p02-stools">
            <div class="p02-stool"></div>
            <div class="p02-stool"></div>
            <div class="p02-stool"></div>
          </div>

          <button type="button" class="card-btn is-popup p02-recipe-open js-sfx" id="p02RecipeBtn" data-sound="sound/click.mp3">레시피 다시 보기</button>

          <div class="p02-shot-pill">
            <div class="p02-shot-label">넣은 샷 수</div>
            <div class="p02-shot-beans" id="p02Beans"></div>
          </div>

          <div class="p02-guest-wrap" id="p02GuestWrap">
            <div class="p02-guest-card" id="p02GuestCard"></div>
          </div>

          <div class="p02-order-bubble" id="p02Bubble"></div>

          <div class="p02-counter"></div>

          <button type="button" class="card-btn p02-deliver-btn js-sfx" id="p02DeliverBtn" data-sound="sound/click.mp3">커피 전달하기</button>

          <div class="p02-glass-zone" id="p02GlassZone"></div>

          <div class="p02-machine" id="p02Machine">
            <img src="img/p02_machine.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;z-index:2" onerror="this.remove()">
            <div class="p02-hoppers">
              <div class="p02-hopper"></div>
              <div class="p02-hopper"></div>
            </div>
            <div class="p02-machine-body"></div>
            <div class="p02-machine-well"></div>
            <div class="p02-machine-head"></div>
            <button type="button" class="p02-brew-btn js-sfx" id="p02BrewBtn" data-sound="sound/click.mp3" aria-label="커피 샷 추출">
              <svg viewBox="0 0 100 100">
                <path d="M36 28c0-6 8-6 8-12M52 28c0-6 8-6 8-12" fill="none" stroke="#b56cff" stroke-width="5" stroke-linecap="round"/>
                <path d="M24 36h44v24c0 12-10 20-22 20S24 72 24 60V36z" fill="#b56cff"/>
                <path d="M68 42h8c6 0 10 4 10 10s-4 10-10 10h-8" fill="none" stroke="#b56cff" stroke-width="6" stroke-linecap="round"/>
                <rect x="20" y="82" width="52" height="7" rx="3.5" fill="#b56cff"/>
              </svg>
            </button>
            <div class="p02-spout-box">
              <div class="p02-spout-Left"></div>
              <div class="p02-spout-Right"></div>
            </div>
            <div class="p02-stream s1"></div>
            <div class="p02-stream s2"></div>
            <div class="p02-drip-tray">
              <div class="p02-drip-grid"></div>
            </div>
          </div>

          <div class="p02-shot-cup" id="p02ShotCup">
            <svg viewBox="0 0 170 140">
              <path class="p02-pour-drop" d="M18 36 Q4 76 10 128" fill="none" stroke="#4a2208" stroke-width="12" stroke-linecap="round"/>
              <path d="M122 44h18c13 0 22 9 22 21s-9 21-22 21h-14" fill="none" stroke="#e8ddd3" stroke-width="12" stroke-linecap="round"/>
              <path d="M24 26h104l-14 82c-3 14-14 22-28 22H66c-14 0-25-8-28-22L24 26z" fill="#f7f1eb" stroke="#cbbba8" stroke-width="4"/>
              <ellipse cx="76" cy="26" rx="52" ry="12" fill="#e5dbd0" stroke="#cbbba8" stroke-width="3"/>
              <g class="p02-shot-fill">
                <ellipse cx="76" cy="29" rx="45" ry="9" fill="#4b240b"/>
                <ellipse cx="76" cy="28" rx="36" ry="5" fill="#9c5a25" opacity=".65"/>
              </g>
            </svg>
          </div>

          <div class="p02-recipe-modal" id="p02RecipeModal">
            <div class="p02-recipe-card">
              <p class="p02-recipe-head">레시피를 잘 기억해서 커피를 만들어 볼까요?</p>
              <img class="p02-recipe-close js-img-swap js-sfx" id="p02RecipeClose" src="../../resources/img/common/pop_btn_close.png" data-src-alt="../../resources/img/common/pop_btn_close_on.png" data-src-over="../../resources/img/common/pop_btn_close_over.png" data-sound="sound/click.mp3" alt="닫기">
              <div class="p02-recipe-box">
                <div class="p02-recipe-box-tit">레시피</div>
                <div class="p02-recipe-rows">
                  <div class="p02-recipe-row">
                    <span>연하게 1샷</span>
                    <svg class="p02-recipe-cup" viewBox="0 0 90 100">
                      <path d="M14 12h62l-7 74c-1 6-6 10-12 10H33c-6 0-11-4-12-10L14 12z" fill="rgba(230,242,255,.55)" stroke="#7c8ea6" stroke-width="3"/>
                      <path d="M17 34h56l-5 50c-1 4-4 7-9 7H31c-5 0-8-3-9-7L17 34z" fill="#d49553"/>
                      <ellipse cx="45" cy="34" rx="28" ry="6" fill="#e3ac72"/>
                    </svg>
                  </div>
                  <div class="p02-recipe-row">
                    <span>기본 &nbsp;&nbsp;&nbsp;2샷</span>
                    <svg class="p02-recipe-cup" viewBox="0 0 90 100">
                      <path d="M14 12h62l-7 74c-1 6-6 10-12 10H33c-6 0-11-4-12-10L14 12z" fill="rgba(230,242,255,.55)" stroke="#7c8ea6" stroke-width="3"/>
                      <path d="M17 34h56l-5 50c-1 4-4 7-9 7H31c-5 0-8-3-9-7L17 34z" fill="#8b4d20"/>
                      <ellipse cx="45" cy="34" rx="28" ry="6" fill="#a86432"/>
                    </svg>
                  </div>
                  <div class="p02-recipe-row">
                    <span>진하게 3샷</span>
                    <svg class="p02-recipe-cup" viewBox="0 0 90 100">
                      <path d="M14 12h62l-7 74c-1 6-6 10-12 10H33c-6 0-11-4-12-10L14 12z" fill="rgba(230,242,255,.55)" stroke="#7c8ea6" stroke-width="3"/>
                      <path d="M17 34h56l-5 50c-1 4-4 7-9 7H31c-5 0-8-3-9-7L17 34z" fill="#3b1b0a"/>
                      <ellipse cx="45" cy="34" rx="28" ry="6" fill="#592c14"/>
                    </svg>
                  </div>
                </div>
              </div>
              <div class="p02-recipe-aro">
                <img src="img/p02_barista_aro.png" alt="바리스타 아로" onerror="this.src='../../resources/img/common/avatar_correct_gwa.png'">
              </div>
            </div>
          </div>

          <div class="ox-result-wrong is-avatar is-off p02-limit-modal" id="p02LimitModal">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body"><p class="avatar-popup-text">커피 샷은 최대 3번만 가능해요.</p></div>
            </div>
          </div>

          <div class="avatar-modal is-off p02-done" id="p02Done">
            <div class="avatar-card">
              <img class="avatar-card-avatar" src="../../resources/img/common/avatar_finish.png" alt="">
              <div class="step-flow">
                <div class="step-panel">
                  <div class="avatar-card-body is-side">
                    <span style="position:absolute;right:90px;top:50px;font-size:150px;line-height:1">🏆</span>
                    <p class="avatar-card-title is-left" style="padding:0;margin-bottom:40px">정말 잘했어요!</p>
                    <p class="avatar-card-text">손님이 원하는 진하기에 맞게<br>세 잔의 커피를 모두 완성했어요.</p>
                  </div>
                  <a href="javascript:;" class="js-nav-effect js-sfx avatar-card-btn card-btn is-popup is-arrow" data-sound="sound/click.mp3">→</a>
                </div>
                <div class="step-panel is-hidden">
                  <div class="avatar-card-body is-side">
                    <p class="avatar-card-text">샷을 많이 넣을수록 커피 색이 진해졌어요.<br>커피 뿐만 아니라 물감이나 주스도 똑같아요.</p>
                  </div>
                  <a href="javascript:;" class="js-nav-effect js-sfx avatar-card-btn card-btn is-popup is-arrow" data-sound="sound/click.mp3">→</a>
                </div>
                <div class="step-panel is-hidden">
                  <div class="avatar-card-body is-side">
                    <p class="avatar-card-text">인공지능은 사진으로 배워서<br>액체의 진하기를 알 수 있는지 알아볼까요?</p>
                  </div>
                  <a href="page03.html" class="js-nav-effect js-sfx avatar-card-btn card-btn is-popup" data-sound="sound/click.mp3">다음</a>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="오늘은 내가 바리스타!" data-next="page03.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  (function () {
    const GUESTS = shuffleArray([
      {
        id: 'man',
        order: '차가운 커피 한 잔<br>기본 2샷으로 주세요.',
        target: 2,
        iced: true,
        coat: '#26354a',
        shirt: '#e8eef5',
        hair: '#3a2618',
        skin: '#f6d2b8'
      },
      {
        id: 'grandma',
        order: '뜨거운 커피 연하게<br>1샷으로 한 잔 주세요.',
        target: 1,
        iced: false,
        coat: '#c96f5b',
        shirt: '#dcd6ce',
        hair: '#a6a8b0',
        skin: '#f2ccb0'
      },
      {
        id: 'woman',
        order: '차가운 커피 진하게<br>3샷으로 한 잔 주세요.',
        target: 3,
        iced: true,
        coat: '#5c4b8b',
        shirt: '#fff5e8',
        hair: '#2a1b15',
        skin: '#f8d8c0'
      }
    ]);

    const SHOT_COLORS = ['rgba(215,235,250,0.42)', '#d49553', '#8b4d20', '#3b1b0a'];
    const TOP_COLORS = ['rgba(235,248,255,0.6)', '#e3ac72', '#a86432', '#592c14'];

    const beansEl = $('p02Beans');
    const guestWrap = $('p02GuestWrap');
    const guestCard = $('p02GuestCard');
    const bubbleEl = $('p02Bubble');
    const glassZone = $('p02GlassZone');
    const machineEl = $('p02Machine');
    const brewBtn = $('p02BrewBtn');
    const shotCup = $('p02ShotCup');
    const deliverBtn = $('p02DeliverBtn');
    const recipeModal = $('p02RecipeModal');
    const recipeBtn = $('p02RecipeBtn');
    const recipeClose = $('p02RecipeClose');
    const limitModal = $('p02LimitModal');
    const doneModal = $('p02Done');

    let idx = 0;
    let shots = 0;
    let shotReady = false;
    let busy = false;

    const beanSvg = (on) => {
      const fill = on ? '#8c5327' : '#969ba3';
      const stroke = on ? '#593011' : '#737880';
      const crease = on ? '#4a250b' : '#5e636b';
      return '<svg class="p02-bean' + (on ? ' is-on' : '') + '" viewBox="0 0 90 90">' +
        '<g transform="rotate(-28 45 45)">' +
        '<ellipse cx="45" cy="45" rx="30" ry="38" fill="' + fill + '" stroke="' + stroke + '" stroke-width="5"/>' +
        '<path d="M45 10 C36 30, 54 60, 45 80" fill="none" stroke="' + crease + '" stroke-width="5" stroke-linecap="round"/>' +
        '</g></svg>';
    };

    const renderBeans = () => {
      let html = '';
      for (let i = 0; i < 3; i++) html += beanSvg(i < shots);
      beansEl.innerHTML = html;
    };

    const guestSvg = (g, mood) => {
      const mouth = mood === 'happy'
        ? '<path d="M188 228 Q210 250 232 228" fill="none" stroke="#8c3b2b" stroke-width="6" stroke-linecap="round"/>'
        : mood === 'sad'
        ? '<path d="M190 242 Q210 224 230 242" fill="none" stroke="#8c3b2b" stroke-width="6" stroke-linecap="round"/>'
        : '<path d="M194 232 Q210 242 226 232" fill="none" stroke="#8c3b2b" stroke-width="5" stroke-linecap="round"/>';
      const eyes = mood === 'happy'
        ? '<path d="M170 192 Q182 180 194 192M226 192 Q238 180 250 192" fill="none" stroke="#2b211b" stroke-width="6" stroke-linecap="round"/>'
        : '<circle cx="182" cy="192" r="7" fill="#2b211b"/><circle cx="238" cy="192" r="7" fill="#2b211b"/>';
      const hairBack = g.id === 'woman'
        ? '<path d="M126 160 C118 270, 128 360, 146 390 L274 390 C292 360, 302 270, 294 160 Z" fill="' + g.hair + '"/>'
        : '';
      const bun = g.id === 'grandma'
        ? '<circle cx="210" cy="84" r="42" fill="' + g.hair + '"/>'
        : '';
      return '<svg class="p02-guest-svg" viewBox="0 0 420 600">' +
        hairBack + bun +
        '<path d="M74 600 L96 340 C104 300, 148 282, 210 282 C272 282, 316 300, 324 340 L346 600 Z" fill="' + g.coat + '"/>' +
        '<polygon points="168,282 210,390 252,282" fill="' + g.shirt + '"/>' +
        '<rect x="188" y="252" width="44" height="44" rx="16" fill="' + g.skin + '"/>' +
        '<ellipse cx="210" cy="190" rx="74" ry="82" fill="' + g.skin + '"/>' +
        '<path d="M134 176 C134 112, 286 112, 286 176 C264 140, 156 140, 134 176 Z" fill="' + g.hair + '"/>' +
        eyes + mouth +
        '</svg>';
    };

    const renderGuest = (mood) => {
      const g = GUESTS[idx];
      const suffix = mood === 'happy' ? '_happy' : mood === 'sad' ? '_sad' : '';
      guestCard.innerHTML =
        guestSvg(g, mood) +
        '<img src="img/p02_guest_' + g.id + suffix + '.png" alt="" onerror="this.remove()">';
    };

    const renderGlass = () => {
      const g = GUESTS[idx];
      const liq = SHOT_COLORS[shots];
      const top = TOP_COLORS[shots];
      const ice = g.iced
        ? '<g opacity="0.78">' +
          '<rect x="52" y="108" width="44" height="40" rx="8" transform="rotate(-12 74 128)" fill="#f2f9ff" stroke="#b9d6ee" stroke-width="3"/>' +
          '<rect x="108" y="116" width="46" height="42" rx="8" transform="rotate(14 131 137)" fill="#f2f9ff" stroke="#b9d6ee" stroke-width="3"/>' +
          '<rect x="78" y="150" width="46" height="40" rx="8" transform="rotate(6 101 170)" fill="#f2f9ff" stroke="#b9d6ee" stroke-width="3"/>' +
          '</g>'
        : '<path d="M78 46c0-12 12-12 12-24M112 46c0-12 12-12 12-24M144 46c0-12 12-12 12-24" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="5" stroke-linecap="round"/>';
      glassZone.innerHTML =
        '<svg class="p02-glass-svg" viewBox="0 0 220 360">' +
        (!g.iced ? '<path d="M180 140h22c16 0 26 14 26 36s-10 36-26 36h-28" fill="none" stroke="#d8e4f0" stroke-width="14" stroke-linecap="round"/>' : '') +
        '<path class="p02-liquid" d="M36 92h148l-16 226c-2 12-12 20-24 20H76c-12 0-22-8-24-20L36 92z" fill="' + liq + '"/>' +
        '<ellipse class="p02-liquid" cx="110" cy="92" rx="74" ry="14" fill="' + top + '"/>' +
        ice +
        '<path d="M28 54h164l-20 268c-2 15-14 26-30 26H78c-16 0-28-11-30-26L28 54z" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="7"/>' +
        '<ellipse cx="110" cy="54" rx="82" ry="15" fill="rgba(255,255,255,.25)" stroke="rgba(255,255,255,.9)" stroke-width="5"/>' +
        '</svg>';
    };

    const startGuest = (animateIn) => {
      const g = GUESTS[idx];
      shots = 0;
      shotReady = false;
      busy = false;
      shotCup.classList.remove('is-ready', 'is-pouring');
      glassZone.classList.remove('is-delivered');
      bubbleEl.classList.remove('is-center');
      bubbleEl.innerHTML = g.order;
      renderBeans();
      renderGuest('normal');
      renderGlass();
      if (animateIn) {
        guestWrap.classList.add('is-enter');
        requestAnimationFrame(() => {
          requestAnimationFrame(() => guestWrap.classList.remove('is-enter'));
        });
      }
    };

    brewBtn.addEventListener('click', () => {
      if (busy) return;
      if (shotReady) {
        pointFingerAt(shotCup, { dx: -20, dy: -20 });
        return;
      }
      if (shots >= 3) {
        playWrong();
        flashLayer(limitModal, 'is-off', 2000);
        return;
      }
      busy = true;
      clearFingers();
      machineEl.classList.add('is-brewing');
      setTimeout(() => {
        machineEl.classList.remove('is-brewing');
        shotReady = true;
        shotCup.classList.add('is-ready');
        busy = false;
      }, 550);
    });

    const HOME_LEFT = 1510;
    const HOME_TOP = 640;
    let dragging = false;
    let startX = 0, startY = 0;

    shotCup.addEventListener('pointerdown', (e) => {
      if (busy || !shotReady) return;
      e.preventDefault();
      clearFingers();
      dragging = true;
      shotCup.setPointerCapture(e.pointerId);
      shotCup.classList.add('is-dragging');
      startX = e.clientX;
      startY = e.clientY;
    });

    shotCup.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const s = currentScale || 1;
      const dx = (e.clientX - startX) / s;
      const dy = (e.clientY - startY) / s;
      shotCup.style.left = (HOME_LEFT + dx) + 'px';
      shotCup.style.top = (HOME_TOP + dy) + 'px';

      const cRect = shotCup.getBoundingClientRect();
      const gRect = glassZone.getBoundingClientRect();
      const hit = !(cRect.right < gRect.left || cRect.left > gRect.right || cRect.bottom < gRect.top || cRect.top > gRect.bottom);
      glassZone.classList.toggle('is-over', hit);
    });

    const endCupDrag = () => {
      if (!dragging) return;
      dragging = false;
      shotCup.classList.remove('is-dragging');
      const cRect = shotCup.getBoundingClientRect();
      const gRect = glassZone.getBoundingClientRect();
      const hit = !(cRect.right < gRect.left || cRect.left > gRect.right || cRect.bottom < gRect.top || cRect.top > gRect.bottom);
      glassZone.classList.remove('is-over');

      if (hit && shots < 3) {
        busy = true;
        if (typeof playDrag === 'function') playDrag();
        shotCup.style.left = '935px';
        shotCup.style.top = '455px';
        shotCup.classList.add('is-pouring');
        setTimeout(() => {
          shots += 1;
          shotReady = false;
          shotCup.classList.remove('is-ready', 'is-pouring');
          renderBeans();
          renderGlass();
          shotCup.style.left = HOME_LEFT + 'px';
          shotCup.style.top = HOME_TOP + 'px';
          setTimeout(() => { busy = false; }, 280);
        }, 550);
      } else {
        shotCup.style.left = HOME_LEFT + 'px';
        shotCup.style.top = HOME_TOP + 'px';
      }
    };

    shotCup.addEventListener('pointerup', endCupDrag);
    shotCup.addEventListener('pointercancel', endCupDrag);

    deliverBtn.addEventListener('click', () => {
      if (busy) return;
      clearFingers();
      const g = GUESTS[idx];
      busy = true;
      if (shots === g.target) {
        playCorrect();
        renderGuest('happy');
        bubbleEl.classList.add('is-center');
        bubbleEl.innerHTML = '감사합니다!';
        glassZone.classList.add('is-delivered');
        setTimeout(() => {
          if (idx >= GUESTS.length - 1) {
            doneModal.classList.remove('is-off');
          } else {
            idx += 1;
            startGuest(true);
          }
        }, 2000);
      } else {
        playWrong();
        renderGuest('sad');
        bubbleEl.classList.remove('is-center');
        bubbleEl.innerHTML = '이건 제가 주문한<br>커피가 아니에요.';
        setTimeout(() => {
          startGuest(false);
        }, 2000);
      }
    });

    recipeBtn.addEventListener('click', () => {
      recipeModal.classList.remove('is-off');
    });
    recipeClose.addEventListener('click', () => {
      recipeModal.classList.add('is-off');
    });

    startGuest(false);
  })();
  </script>
</body>
</html>
