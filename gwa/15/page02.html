<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘은 내가 바리스타!</title>
  <link rel="stylesheet" href="../../resources/css/common.css">
  <style>
    .p02-stage {
      position: relative;
      width: 1920px;
      height: 960px;
      overflow: hidden;
      font-family: 'Cafe24 Ssurround';
    }
    .p02-bg-img {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 960px;
      object-fit: cover;
      pointer-events: none;
      z-index: 0;
    }
    .p02-guest-wrap {
      position: absolute;
      left: 100px;
      top: -33px;
      width: 620px;
      height: 780px;
      z-index: 2;
      transition: transform .45s cubic-bezier(.22,.9,.32,1), opacity .35s;
    }
    .p02-guest-wrap.is-enter {
      transform: translateX(-140px);
      opacity: 0;
    }
    .p02-guest-wrap.is-leave {
      transform: translateX(140px);
      opacity: 0;
    }
    .p02-guest-card {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .p02-guest-card img {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: bottom center;
    }
    .p02-order-bubble {
      position: absolute;
      left: 690px;
      top: 250px;
      width: 520px;
      min-height: 210px;
      padding: 34px 40px 28px;
      box-sizing: border-box;
      background: #fff;
      border: 6px solid #266cc8;
      border-radius: 24px;
      box-shadow: 0 10px 0 rgba(0,0,0,.08);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: left;
      color: #2068c5;
      font-size: 48px;
      line-height: 1.32;
      letter-spacing: -0.04em;
      word-break: keep-all;
      z-index: 4;
      transition: transform .2s, opacity .3s;
    }
    .p02-order-bubble.p02-hide {
      opacity: 0;
    }
    .p02-order-bubble.is-center {
      justify-content: center;
      text-align: center;
      font-size: 54px;
    }
    .p02-order-bubble::before {
      content: '';
      position: absolute;
      left: -46px;
      top: 92px;
      border-width: 20px 46px 20px 0;
      border-style: solid;
      border-color: transparent #266cc8 transparent transparent;
    }
    .p02-order-bubble::after {
      content: '';
      position: absolute;
      left: -34px;
      top: 96px;
      border-width: 16px 38px 16px 0;
      border-style: solid;
      border-color: transparent #fff transparent transparent;
    }
    .p02-shot-pill {
      position: absolute;
      left: 1038px;
      top: 32px;
      width: 800px;
      height: 124px;
      box-sizing: border-box;
      border: 6px solid #266cc8;
      border-radius: 64px;
      background: #fff;
      display: flex;
      overflow: hidden;
      box-shadow: 0 8px 18px rgba(0,0,0,.12);
      z-index: 5;
    }
    .p02-shot-label {
      width: 324px;
      height: 100%;
      background: #7fb2f0;
      color: #fff;
      font-size: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -0.04em;
      padding-top: 6px;
    }
    .p02-shot-beans {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      padding: 0 24px;
    }
    .p02-bean {
      width: 91px;
      height: 96px;
      object-fit: contain;
      transition: transform .25s;
    }
    .p02-bean.is-on {
      transform: scale(1.06);
    }
    .p02-recipe-open.card-btn.is-popup {
      position: absolute;
      left: 30px;
      top: 20px;
      height: 94px;
      padding: 8px 34px 0;
      font-size: 38px;
      border-radius: 47px;
      line-height: 1em;
      min-width: 0;
      z-index: 5;
    }
    .p02-deliver-btn {
      position: absolute;
      left: 200px;
      top: 800px;
      width: 420px;
      height: 100px;
      font-size: 60px;
      border-radius: 26px;
      padding: 12px 20px 8px;
      z-index: 6;
    }
    .p02-glass-zone {
      position: absolute;
      left: 820px;
      top: 580px;
      width: 210px;
      height: 356px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 5;
      transition: transform .25s, opacity .25s;
    }
    .p02-glass-zone.is-over {
      transform: scale(1.05);
      filter: drop-shadow(0 0 18px #ffe600);
    }
    .p02-glass-zone.is-delivered {
      opacity: 0;
      transform: translateY(-30px) scale(.92);
      pointer-events: none;
    }
    .p02-glass-zone img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }
    .p02-machine {
      position: absolute;
      left: 1327px;
      top: 223px;
      width: 541px;
      height: 742px;
      z-index: 5;
    }
    .p02-machine-img {
      position: absolute;
      left: 0;
      top: 0;
      width: 541px;
      height: 742px;
      pointer-events: none;
      z-index: 1;
    }
    .p02-brew-btn {
      position: absolute;
      left: 214px;
      top: 170px;
      width: 140px;
      height: 137px;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      z-index: 3;
    }
    .p02-brew-btn img {
      width: 100%;
      height: 100%;
      display: block;
    }
    .p02-brew-btn:disabled {
      filter: grayscale(0.5) brightness(.5);
      pointer-events: none;
    }
    .p02-shot-cup {
      position: absolute;
      left: 1552px;
      top: 729px;
      width: 122px;
      height: 134px;
      z-index: 12;
      cursor: grab;
      touch-action: none;
      user-select: none;
      transition: transform .28s ease, left .28s ease, top .28s ease, opacity .2s;
    }
    .p02-shot-cup.is-off {
      display: none;
    }
    .p02-shot-cup.is-ready {
      filter: drop-shadow(0 0 14px #ffe600);
    }
    .p02-shot-cup.is-dragging {
      transition: none;
      cursor: grabbing;
      z-index: 40;
    }
    .p02-shot-cup.is-pouring {
      transform: rotate(-48deg) translate(-15px, -15px);
    }
    .p02-shot-cup img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      display: block;
    }
    .p02-shot-pour-wrap {
      position: absolute;
      left: 906px;
      top: 540px;
      width: 34px;
      height: 82px;
      z-index: 8;
      pointer-events: none;
    }
    .p02-shot-pour-wrap.is-off,
    .p02-shot-ripple.is-off {
      display: none;
    }
    .p02-shot-stream {
      position: absolute;
      left: 11px;
      top: 0;
      width: 12px;
      height: 75px;
      background: linear-gradient(180deg, #8b4a21 0%, #5a2a0f 65%, #341505 100%);
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(90, 42, 15, .65);
      transform-origin: top center;
      animation: p02ShotPulse .18s infinite alternate ease-in-out;
    }
    @keyframes p02ShotPulse {
      0% { transform: scaleX(.85); opacity: .9; }
      100% { transform: scaleX(1.15); opacity: 1; }
    }
    .p02-shot-drop {
      position: absolute;
      background: #4a210b;
      border-radius: 50%;
      box-shadow: 0 0 6px #8b4a21;
    }
    .p02-shot-drop.d1 { left: 5px; top: 64px; width: 8px; height: 8px; animation: p02ShotDrop1 .35s infinite linear; }
    .p02-shot-drop.d2 { left: 20px; top: 68px; width: 6px; height: 6px; animation: p02ShotDrop2 .4s infinite linear .1s; }
    .p02-shot-drop.d3 { left: 12px; top: 70px; width: 9px; height: 9px; animation: p02ShotDrop3 .3s infinite linear .05s; }
    @keyframes p02ShotDrop1 {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(-9px, 14px) scale(.3); opacity: 0; }
    }
    @keyframes p02ShotDrop2 {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(10px, 12px) scale(.3); opacity: 0; }
    }
    @keyframes p02ShotDrop3 {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(2px, 10px) scale(1.25); opacity: 0; }
    }
    .p02-shot-ripple {
      position: absolute;
      left: 900px;
      top: 608px;
      width: 46px;
      height: 16px;
      border-radius: 50%;
      border: 3px solid rgba(110, 56, 22, .75);
      background: rgba(139, 74, 33, .35);
      z-index: 8;
      pointer-events: none;
      animation: p02ShotRipple .48s infinite ease-out;
    }
    @keyframes p02ShotRipple {
      0% { transform: scale(.5); opacity: 1; }
      100% { transform: scale(1.3); opacity: 0; }
    }
    .p02-recipe-modal {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 960px;
      background: rgba(15,12,28,.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 35;
    }
    .p02-recipe-modal.is-off {
      display: none;
    }
    .p02-recipe-card {
      position: relative;
      width: 1400px;
      height: 820px;
      background: #fff;
      border: 6px solid #48159c;
      border-radius: 42px;
      box-sizing: border-box;
      padding: 44px 70px 36px;
      box-shadow: 0 20px 44px rgba(0,0,0,.28);
    }
    .p02-recipe-head {
      margin: -16px -30px 0;
      text-align: left;
      font-size: 66px;
      color: #48159c;
      letter-spacing: -0.04em;
    }
    .p02-recipe-close {
      position: absolute;
      right: 30px;
      top: 30px;
      width: 90px;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease;
    }
    .p02-recipe-close:hover {
      transform: scale(1.08);
      filter: drop-shadow(0 4px 8px rgba(0,0,0,.2));
    }
    .p02-recipe-close:active {
      transform: scale(0.92);
      filter: none;
    }
    .p02-recipe-box {
      position: absolute;
      left: 240px;
      top: 132px;
      width: 1040px;
      height: 640px;
      border: 5px solid #48159c;
      border-radius: 32px;
      overflow: hidden;
      background: #fff;
    }
    .p02-recipe-box-tit {
      height: 86px;
      background: #e5d8ff;
      color: #7a3ee0;
      font-size: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: -0.03em;
    }
    .p02-recipe-rows {
      padding: 6px 100px 0 250px;
    }
    .p02-recipe-row {
      height: 178px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 56px;
      border-bottom: 3px solid #e6def5;
      font-size: 56px;
      color: #48159c;
      letter-spacing: -0.03em;
      padding: 0 30px;
    }
    .p02-recipe-row:last-child {
      border-bottom: none;
    }
    .p02-recipe-row span {
      display: inline-block;
      min-width: 270px;
      padding-top:20px;
    }
    .p02-recipe-cup {
      width: 108px;
      height: 168px;
      object-fit: contain;
    }
    .p02-recipe-aro {
      position: absolute;
      left: 50px;
      bottom: 0;
      width: 421px;
      height: 570px;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .p02-recipe-aro img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: bottom;
    }
    .p02-limit-modal,
    .p02-done {
      z-index: 45;
    }
    .p02-drag-guide {
      position: absolute;
      left: 1590px;
      top: 770px;
      width: 110px;
      pointer-events: none;
      z-index: 30;
      opacity: 0;
      transition: left .95s ease-in-out, top .95s ease-in-out, opacity .25s ease;
    }
    .p02-drag-guide.is-off {
      display: none;
    }
  </style>
</head>

  <script>
  (function () {
    const GUESTS = shuffleArray([
      {
        id: 1,
        order: '차가운 커피 한 잔<br>기본 2샷으로 주세요.',
        target: 2
      },
      {
        id: 2,
        order: '차가운 커피 연하게<br>1샷으로 한 잔 주세요.',
        target: 1
      },
      {
        id: 3,
        order: '차가운 커피 진하게<br>3샷으로 한 잔 주세요.',
        target: 3
      }
    ]);

    GUESTS.forEach((g) => { new Image().src = 'img/p02_guest_' + g.id + '.png'; });
    for (let i = 0; i < 4; i++) new Image().src = 'img/p02_cup_' + i + '.png';
    new Image().src = 'img/p02_machine_on.png';

    const SHOT_ANIM_ON = false;
    const SHOT_ANIM = SHOT_ANIM_ON || /[?&]shot(=|&|$)/.test(location.search);

    const HOME_LEFT = 1552;
    const HOME_TOP = 729;

    const beansEl = $('p02Beans');
    const guestWrap = $('p02GuestWrap');
    const guestImg = $('p02GuestImg');
    const bubbleEl = $('p02Bubble');
    const glassZone = $('p02GlassZone');
    const glassImg = $('p02GlassImg');
    const shotPourWrap = $('p02ShotPourWrap');
    const shotRipple = $('p02ShotRipple');
    const machineImg = $('p02MachineImg');
    const brewBtn = $('p02BrewBtn');
    const shotCup = $('p02ShotCup');
    const deliverBtn = $('p02DeliverBtn');
    const recipeModal = $('p02RecipeModal');
    const recipeBtn = $('p02RecipeBtn');
    const recipeClose = $('p02RecipeClose');
    const limitModal = $('p02LimitModal');
    const doneModal = $('p02Done');

    let idx = 0;
    let shots = 0;
    let shotReady = false;
    let busy = false;
    let dragging = false;
    let dragGuided = false;
    let dragGuideTimers = [];
    let startX = 0;
    let startY = 0;
    const dragGuide = $('p02DragGuide');
    const hideDragGuide = () => {
      dragGuideTimers.forEach(clearTimeout);
      dragGuideTimers = [];
      dragGuide.style.opacity = '0';
      dragGuide.classList.add('is-off');
    };
    const playDragGuideOnce = () => {
      if (dragGuided) return;
      dragGuided = true;
      dragGuideTimers.forEach(clearTimeout);
      dragGuideTimers = [];
      dragGuide.src = '../../resources/img/common/img_finger01.png';
      dragGuide.style.transition = 'none';
      dragGuide.style.left = '1590px';
      dragGuide.style.top = '770px';
      dragGuide.classList.remove('is-off');
      void dragGuide.offsetWidth;
      dragGuide.style.transition = '';
      dragGuide.style.opacity = '1';
      dragGuideTimers.push(setTimeout(() => {
        dragGuide.src = '../../resources/img/common/img_finger02.png';
        dragGuide.style.left = '900px';
        dragGuide.style.top = '640px';
      }, 260));
      dragGuideTimers.push(setTimeout(() => {
        dragGuide.style.opacity = '0';
      }, 1450));
      dragGuideTimers.push(setTimeout(() => {
        dragGuide.classList.add('is-off');
      }, 1750));
    };

    const renderBeans = () => {
      let html = '';
      for (let i = 0; i < 3; i++) {
        const on = i < shots;
        html += '<img class="p02-bean' + (on ? ' is-on' : '') + '" src="img/p02_bean_' + (on ? 'on' : 'off') + '.png" alt="">';
      }
      beansEl.innerHTML = html;
    };

    const renderGuest = () => {
      const g = GUESTS[idx];
      guestImg.src = 'img/p02_guest_' + g.id + '.png';
    };

    const renderGlass = () => {
      glassImg.src = 'img/p02_cup_' + shots + '.png';
    };

    const resetGuestState = () => {
      const g = GUESTS[idx];
      shots = 0;
      shotReady = false;
      shotCup.classList.remove('is-ready', 'is-pouring');
      shotCup.classList.add('is-off');
      shotPourWrap.classList.add('is-off');
      shotRipple.classList.add('is-off');
      shotCup.style.left = HOME_LEFT + 'px';
      shotCup.style.top = HOME_TOP + 'px';
      machineImg.src = 'img/p02_machine.png';
      glassZone.classList.remove('is-delivered');
      bubbleEl.classList.remove('is-center');
      bubbleEl.innerHTML = g.order;
      renderBeans();
      renderGuest();
      renderGlass();
    };

    const enterGuest = () => {
      const ready = guestImg.decode ? guestImg.decode().catch(() => {}) : Promise.resolve();
      ready.then(() => {
        requestAnimationFrame(() => {
          guestWrap.classList.remove('is-enter');
          bubbleEl.classList.remove('p02-hide');
          setTimeout(() => {
            busy = false;
            brewBtn.disabled = false;
          }, 450);
        });
      });
    };

    const startGuest = (animateIn) => {
      if (!animateIn) {
        resetGuestState();
        busy = false;
        brewBtn.disabled = false;
        return;
      }
      busy = true;
      brewBtn.disabled = true;
      guestWrap.classList.add('is-leave');
      bubbleEl.classList.add('p02-hide');
      setTimeout(() => {
        guestWrap.style.transition = 'none';
        guestWrap.classList.remove('is-leave');
        guestWrap.classList.add('is-enter');
        void guestWrap.offsetWidth;
        guestWrap.style.transition = '';
        resetGuestState();
        enterGuest();
      }, 350);
    };

    brewBtn.addEventListener('click', () => {
      if (busy) return;
      if (shots >= 3) {
        playWrong();
        flashLayer(limitModal, 'is-off', 2000);
        return;
      }
      busy = true;
      brewBtn.disabled = true;
      clearFingers();
      machineImg.src = 'img/p02_machine_on.png';
      setTimeout(() => {
        machineImg.src = 'img/p02_machine.png';
        shotReady = true;
        shotCup.classList.remove('is-off');
        shotCup.classList.add('is-ready');
        busy = false;
        playDragGuideOnce();
      }, 600);
    });

    shotCup.addEventListener('pointerdown', (e) => {
      if (busy || !shotReady) return;
      e.preventDefault();
      clearFingers();
      hideDragGuide();
      dragging = true;
      shotCup.setPointerCapture(e.pointerId);
      shotCup.classList.add('is-dragging');
      startX = e.clientX;
      startY = e.clientY;
    });

    shotCup.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const s = (typeof currentScale !== 'undefined' && currentScale) ? currentScale : 1;
      const dx = (e.clientX - startX) / s;
      const dy = (e.clientY - startY) / s;
      shotCup.style.left = (HOME_LEFT + dx) + 'px';
      shotCup.style.top = (HOME_TOP + dy) + 'px';

      const cRect = shotCup.getBoundingClientRect();
      const gRect = glassZone.getBoundingClientRect();
      const hit = !(cRect.right < gRect.left || cRect.left > gRect.right || cRect.bottom < gRect.top || cRect.top > gRect.bottom);
      glassZone.classList.toggle('is-over', hit);
    });

    const endCupDrag = () => {
      if (!dragging) return;
      dragging = false;
      shotCup.classList.remove('is-dragging');
      const cRect = shotCup.getBoundingClientRect();
      const gRect = glassZone.getBoundingClientRect();
      const hit = !(cRect.right < gRect.left || cRect.left > gRect.right || cRect.bottom < gRect.top || cRect.top > gRect.bottom);
      glassZone.classList.remove('is-over');

      if (hit && shots < 3) {
        busy = true;
        shotCup.style.left = SHOT_ANIM ? '950px' : '900px';
        shotCup.style.top = SHOT_ANIM ? '470px' : '520px';
        shotCup.classList.add('is-pouring');
        if (SHOT_ANIM) {
          setTimeout(() => {
            shotPourWrap.classList.remove('is-off');
            shotRipple.classList.remove('is-off');
          }, 180);
        }
        setTimeout(() => {
          shots += 1;
          shotReady = false;
          shotPourWrap.classList.add('is-off');
          shotRipple.classList.add('is-off');
          shotCup.classList.remove('is-ready', 'is-pouring');
          shotCup.classList.add('is-off');
          shotCup.style.left = HOME_LEFT + 'px';
          shotCup.style.top = HOME_TOP + 'px';
          renderBeans();
          renderGlass();
          setTimeout(() => { busy = false; brewBtn.disabled = false; }, 200);
        }, SHOT_ANIM ? 730 : 450);
      } else {
        shotCup.style.left = HOME_LEFT + 'px';
        shotCup.style.top = HOME_TOP + 'px';
      }
    };

    shotCup.addEventListener('pointerup', endCupDrag);
    shotCup.addEventListener('pointercancel', endCupDrag);

    deliverBtn.addEventListener('click', () => {
      if (busy) return;
      clearFingers();
      const g = GUESTS[idx];
      busy = true;
      if (shots === g.target) {
        playCorrect();
        bubbleEl.classList.add('is-center');
        bubbleEl.innerHTML = '감사합니다!';
        glassZone.classList.add('is-delivered');
        setTimeout(() => {
          if (idx >= GUESTS.length - 1) {
            doneModal.classList.remove('is-off');
          } else {
            idx += 1;
            startGuest(true);
          }
        }, 2000);
      } else {
        playWrong();
        bubbleEl.classList.remove('is-center');
        bubbleEl.innerHTML = '이건 제가 주문한<br>커피가 아니에요.';
        setTimeout(() => {
          startGuest(false);
        }, 2000);
      }
    });

    recipeBtn.addEventListener('click', () => {
      recipeClose.classList.remove('is-swapped');
      recipeClose.src = recipeClose.dataset.originalSrc || '../../resources/img/common/pop_btn_close.png';
      recipeModal.classList.remove('is-off');
    });
    recipeClose.addEventListener('click', () => {
      setTimeout(() => {
        recipeModal.classList.add('is-off');
      }, 100);
    });

    busy = true;
    brewBtn.disabled = true;
    resetGuestState();
    enterGuest();
  })();
  </script>
</body>
</html>
