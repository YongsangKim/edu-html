<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>커피주문 확인 AI가 틀리는 이유</title>
  <link rel="stylesheet" href="../../resources/css/common.css">
  <style>
    .p08-board {
      position: absolute;
      left: 54px;
      top: 96px;
      width: 1812px;
      height: 830px;
      background: #266cc8;
      border-radius: 24px;
      box-shadow: inset 0 4px 12px rgba(8, 28, 68, 0.25);
      z-index: 1;
    }
    .line-quiz .line-item.left.p08-left-card {
      left: 274px;
      width: 214px;
      height: 224px;
      padding: 14px 14px 34px;
      box-sizing: border-box;
      border-radius: 6px;
      background: #fff;
      border: none;
      box-shadow: 0 10px 18px rgba(12, 28, 64, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .line-quiz .line-item.left.p08-left-card.row-1 { top: 162px; }
    .line-quiz .line-item.left.p08-left-card.row-2 { top: 400px; }
    .line-quiz .line-item.left.p08-left-card.row-3 { top: 638px; }

    .p08-photo-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(180deg, #b8e1ff 0%, #dcf0ff 68%, #c79158 68%, #b37b42 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .p08-photo-inner > img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 2;
    }
    .p08-photo-svg {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .p08-photo-inner.is-blur .p08-photo-svg {
      filter: blur(4.5px);
      transform: scale(1.06);
    }

    .line-quiz .line-item.left.p08-left-card .line-dot {
      right: -96px;
      width: 44px;
      height: 44px;
      background: #0f2942;
      border: 6px solid #fff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.28);
    }

    .line-quiz .line-item.right.p08-right-card {
      left: 902px;
      width: 806px;
      height: 196px;
      border-radius: 26px;
      border: 5px solid #fff;
      box-shadow: 0 10px 20px rgba(12, 28, 64, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      box-sizing: border-box;
    }
    .line-quiz .line-item.right.p08-right-card.row-1 {
      top: 174px;
      background: #ffc35b;
    }
    .line-quiz .line-item.right.p08-right-card.row-2 {
      top: 412px;
      background: #ff5ce1;
    }
    .line-quiz .line-item.right.p08-right-card.row-3 {
      top: 650px;
      background: #5bc2ff;
    }
    .p08-card-dashed {
      width: 100%;
      height: 100%;
      border-radius: 18px;
      border: 3px dashed rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Malgun Gothic", sans-serif;
      font-size: 52px;
      font-weight: 900;
      color: #0f2347;
      letter-spacing: -1px;
    }
    .line-quiz .line-item.right.p08-right-card .line-dot {
      left: -96px;
      width: 44px;
      height: 44px;
      background: #0f2942;
      border: 6px solid #fff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.28);
    }
  </style>
</head>
<body>
  <div id="stage" class="bg-default">
    <p class="ask-pill is-fit"><span>AI가 잘 확인할 수 있도록 하려면 어떻게 해야 할까요?</span></p>
    <div class="p08-board"></div>

    <div class="line-quiz">
      <div class="line-item left p08-left-card row-1" data-id="1">
        <div class="p08-photo-inner is-blur" id="p08Photo1">
          <img src="img/p07_photo_2.png" alt="흐리게 찍힌 1샷 아이스 커피" onerror="this.style.display='none'">
        </div>
        <span class="line-dot"></span>
      </div>

      <div class="line-item left p08-left-card row-2" data-id="2">
        <div class="p08-photo-inner" id="p08Photo2">
          <img src="img/p07_photo_3.png" alt="손가락이 같이 찍힌 2샷 아이스 커피" onerror="this.style.display='none'">
        </div>
        <span class="line-dot"></span>
      </div>

      <div class="line-item left p08-left-card row-3" data-id="3">
        <div class="p08-photo-inner" id="p08Photo3">
          <img src="img/p07_photo_4.png" alt="확대해서 일부만 찍힌 1샷 아이스 커피" onerror="this.style.display='none'">
        </div>
        <span class="line-dot"></span>
      </div>

      <div class="line-item right p08-right-card row-1" data-id="2">
        <span class="line-dot"></span>
        <div class="p08-card-dashed">손을 치우고 찍어요.</div>
      </div>

      <div class="line-item right p08-right-card row-2" data-id="3">
        <span class="line-dot"></span>
        <div class="p08-card-dashed">커피가 다 보이게 찍어요.</div>
      </div>

      <div class="line-item right p08-right-card row-3" data-id="1">
        <span class="line-dot"></span>
        <div class="p08-card-dashed">선명하게 찍어요.</div>
      </div>

      <svg class="line-quiz-svg" width="1920" height="960"></svg>
    </div>

    <div class="line-result-wrong is-off" data-sound="sound/incorrect.mp3"></div>

    <div class="avatar-modal is-off" id="p08FinishModal">
      <div class="avatar-card step-flow">
        <img class="ox-avatar" src="../../resources/img/avatar_correct_gwa.png" alt="">
        <p class="ox-avatar-text" data-step="0">AI가 알아보지 못한 사진을 살펴보고,<br>어떻게 고치면 좋을지 알아보았어요.</p>
        <p class="ox-avatar-text is-off" data-step="1">AI가 잘 알아보는 사진으로 지도학습을<br>해야 하고 정답을 알려줘서 특징을<br>쉽게 찾게 도와줘야 해요.</p>
        <p class="ox-avatar-text is-off" data-step="2">이제 티처블 머신 프로그램으로 AI에게<br>사진과 정답을 알려주며 직접 가르쳐볼까요?</p>
        <button type="button" class="step-next-btn js-sfx" data-sound="sound/click.mp3" aria-label="다음">→</button>
        <a class="modal-Action-btn is-off js-sfx" data-sound="sound/click.mp3" href="page09.html">다음</a>
      </div>
    </div>
  </div>

  <script src="../../resources/js/header.js" data-title="커피주문 확인 AI가 틀리는 이유" data-next="page09.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
    (function () {
      const SHOT_COLORS = {
        1: { top: '#e2a85c', mid: '#c98438', bot: '#df9e4e', rim: '#ebbc78' },
        2: { top: '#b86828', mid: '#844012', bot: '#9e521e', rim: '#c77c3c' }
      };

      function makePhotoSvg(shot, mode, uid) {
        const c = SHOT_COLORS[shot];
        const groupTransform = mode === 'zoom'
          ? 'transform="translate(-105, -18) scale(1.85)"'
          : '';
        const fingerOverlay = mode === 'finger'
          ? `<g>
               <path d="M95 -10 C105 90, 118 165, 148 228 C168 265, 225 255, 222 205 C218 140, 215 65, 235 -10 Z" fill="#f7c19b" stroke="#d99568" stroke-width="4"/>
               <ellipse cx="168" cy="212" rx="28" ry="34" fill="#ffe0c8" opacity="0.75"/>
             </g>`
          : '';
        return `
          <svg class="p08-photo-svg" viewBox="0 0 248 254" aria-hidden="true">
            <defs>
              <linearGradient id="p08_liq_${uid}" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="${c.top}"/>
                <stop offset="55%" stop-color="${c.mid}"/>
                <stop offset="100%" stop-color="${c.bot}"/>
              </linearGradient>
              <clipPath id="p08_clip_${uid}">
                <path d="M58 46 L190 46 L172 214 Q169 232 148 232 L100 232 Q79 232 76 214 Z"/>
              </clipPath>
            </defs>
            <g ${groupTransform}>
              <ellipse cx="124" cy="234" rx="52" ry="11" fill="rgba(0,0,0,0.18)"/>
              <path d="M52 38 L196 38 L176 218 Q172 238 149 238 L99 238 Q76 238 72 218 Z" fill="rgba(255,255,255,0.82)" stroke="#d7e6f5" stroke-width="5"/>
              <g clip-path="url(#p08_clip_${uid})">
                <rect x="48" y="62" width="152" height="176" fill="url(#p08_liq_${uid})"/>
                <ellipse cx="124" cy="64" rx="66" ry="13" fill="${c.rim}"/>
                <rect x="74" y="68" width="28" height="22" rx="6" transform="rotate(-12 88 79)" fill="rgba(255,255,255,0.75)"/>
                <rect x="112" y="62" width="30" height="24" rx="6" transform="rotate(8 127 74)" fill="rgba(255,255,255,0.78)"/>
                <rect x="144" y="74" width="26" height="22" rx="6" transform="rotate(-6 157 85)" fill="rgba(255,255,255,0.7)"/>
                <path d="M68 54 L82 220" stroke="rgba(255,255,255,0.4)" stroke-width="8" stroke-linecap="round"/>
              </g>
              <ellipse cx="124" cy="38" rx="72" ry="14" fill="rgba(255,255,255,0.68)" stroke="#cfe0f2" stroke-width="4"/>
            </g>
            ${fingerOverlay}
          </svg>
        `;
      }

      $('#p08Photo1').insertAdjacentHTML('beforeend', makePhotoSvg(1, 'blur', '1'));
      $('#p08Photo2').insertAdjacentHTML('beforeend', makePhotoSvg(2, 'finger', '2'));
      $('#p08Photo3').insertAdjacentHTML('beforeend', makePhotoSvg(1, 'zoom', '3'));

      const leftItems = Array.from(document.querySelectorAll('.line-quiz .line-item.left'));
      const finishModal = $('#p08FinishModal');
      const obs = new MutationObserver(() => {
        if (leftItems.every((el) => el.dataset.matched === 'true')) {
          obs.disconnect();
          setTimeout(() => {
            finishModal.classList.remove('is-off');
          }, 600);
        }
      });
      leftItems.forEach((el) => obs.observe(el, { attributes: true, attributeFilter: ['data-matched'] }));
    })();
  </script>
</body>
</html>
