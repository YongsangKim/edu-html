<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS! 파도를 분석하라!</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        .ask-pill.p02-pill{left:52px;top:54px;transform:none;width:1152px;min-height:100px;padding:6px 0 0 105px;justify-content:flex-start;text-align:left;white-space:nowrap;background:var(--c-cream);font-size:54.4px}
        .p02-pill-ic{position:absolute;left:6px;top:5px;width:78px;height:77px}

        .photo-modal.p02-win{padding-bottom:38px}
        .p02-win .photo-card{position:relative;width:1350px;height:790px;padding:64px 59px 0;border-radius:135px}
        .p02-win .photo-card-img{width:1221px;height:512px;box-sizing:border-box;border:solid 5px var(--c-purple);border-radius:55px}
        .p02-win .photo-card-title{position:absolute;left:645px;top:628px;margin:0;font-size:98px;line-height:1}
        .p02-win-robot{position:absolute;left:270px;top:499px;width:385px;height:275px;object-fit:contain}

        .p02-panel{position:absolute;left:1255px;top:103px;width:612px;height:814px;box-sizing:border-box;background:#266cc8;border-radius:20px}
        .p02-panel-white{position:absolute;left:1260px;top:600px;width:602px;height:312px;background:var(--c-white);border-radius:0 0 15px 15px}
        .p02-bar{position:absolute;left:1270px;top:41px;width:580px;height:132px;box-sizing:border-box;display:flex;border:solid 7px #266cc8;border-radius:66px;background:var(--c-white);box-shadow:0 8px 0 #2561ab;overflow:hidden}
        .p02-bar-label{flex:none;width:141px;margin:0;display:flex;align-items:center;justify-content:center;padding-top:4px;background:var(--c-sky);font-family:'Cafe24 Ssurround';font-size:55.5px;color:var(--c-white);letter-spacing:-0.05em}
        .p02-lives{flex:1 1 auto;display:flex;align-items:center;padding:0 0 0 7px}
        .p02-lives i{position:relative;flex:none;width:100px;height:97px}
        .p02-lives i img{position:absolute;left:0;top:-1px;width:104px;height:97px}
        .p02-lives i .is-lit{display:none}
        .p02-lives i.is-on .is-lit{display:block}
        .p02-lives i.is-on .is-dim{display:none}

        .p02-monitor{position:absolute;left:52px;top:191px;width:1150px;height:691px;box-sizing:border-box;border:solid 12px var(--c-ink);border-radius:30px;background:var(--c-white);overflow:hidden}
        .p02-monitor-title{position:absolute;left:26px;top:20px;margin:0;font-family:'Cafe24 Ssurround';font-size:38px;color:var(--c-ink);z-index:2}
        .p02-monitor-title:before{content:'';display:inline-block;width:18px;height:18px;margin-right:15px;border-radius:50%;background:#ffdede;vertical-align:4px;animation:p02-blink 1s step-end infinite}
        @keyframes p02-blink{50%{opacity:.2}}
        .p02-sea{position:absolute;left:0;top:81px;width:100%;height:586px;overflow:hidden;
          background-image:linear-gradient(var(--c-pale) 2px,transparent 2px),linear-gradient(90deg,var(--c-pale) 2px,transparent 2px);background-size:60px 60px;background-position:2px 0}
        .p02-sea svg{position:absolute;left:0;top:0;height:100%;animation:p02-flow linear infinite}
        .p02-axis{position:absolute;left:0;top:373px;width:100%;border-top:dashed 2px #c4c9d4;pointer-events:none}
        @keyframes p02-flow{to{transform:translateX(var(--shift))}}

        .p02-btns{position:absolute;left:1276px;top:219px;width:571px;display:grid;grid-template-columns:271px 271px;gap:24px 29px}
        .p02-opt.card-btn{min-width:0;width:271px;height:144px;padding:0;font-size:60px}

        .p02-horn{position:absolute;left:1357px;top:548px;width:490px;height:384px;padding:0;border:0;background:none;cursor:pointer;transition:transform .15s}
        .p02-horn img{position:absolute;pointer-events:none}
        .p02-horn .is-lit{left:0;top:0;width:490px;height:384px}
        .p02-horn .is-dim{left:173px;top:58px;width:304px;height:299px}
        .p02-horn:not(:disabled) .is-dim,.p02-horn:disabled .is-lit{display:none}
        .p02-horn:hover:not(:disabled){transform:scale(1.04) rotate(-3deg)}
        .p02-horn:active:not(:disabled){transform:scale(.96)}
        .p02-horn:disabled{cursor:default}

    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <p class="ask-pill p02-pill"><img class="p02-pill-ic" src="img/p02_icon_alert.png" alt=""><span>파도의 모양과 높이를 시민들에게 알려주세요!</span></p>

          <div class="p02-panel"></div>
          <div class="p02-panel-white"></div>
          <div class="p02-bar">
            <p class="p02-bar-label">알림</p>
            <div class="p02-lives" id="p02Lives">
              <i><img class="is-dim" src="img/p02_alarm_off.png" alt=""><img class="is-lit" src="img/p02_alarm_on.png" alt=""></i>
              <i><img class="is-dim" src="img/p02_alarm_off.png" alt=""><img class="is-lit" src="img/p02_alarm_on.png" alt=""></i>
              <i><img class="is-dim" src="img/p02_alarm_off.png" alt=""><img class="is-lit" src="img/p02_alarm_on.png" alt=""></i>
              <i><img class="is-dim" src="img/p02_alarm_off.png" alt=""><img class="is-lit" src="img/p02_alarm_on.png" alt=""></i>
            </div>
          </div>

          <div class="p02-monitor">
            <p class="p02-monitor-title">AI 파도 관측 모니터</p>
            <div class="p02-sea" id="p02Sea"></div>
            <div class="p02-axis"></div>
          </div>

          <div class="p02-btns opts">
            <button class="card-btn p02-opt js-sfx" data-sound="sound/click.mp3" data-group="height" data-val="high">높아요</button>
            <button class="card-btn p02-opt js-sfx" data-sound="sound/click.mp3" data-group="height" data-val="low">낮아요</button>
            <button class="card-btn p02-opt js-sfx" data-sound="sound/click.mp3" data-group="gap" data-val="wide">넓어요</button>
            <button class="card-btn p02-opt js-sfx" data-sound="sound/click.mp3" data-group="gap" data-val="narrow">좁아요</button>
          </div>

          <button class="p02-horn" id="p02Horn" disabled aria-label="확성기로 안내하기"><img class="is-dim" src="img/p02_horn_off.png" alt=""><img class="is-lit" src="img/p02_horn_on.png" alt=""></button>

          <div class="photo-modal is-middle p02-win is-off" id="p02Right">
            <div class="photo-card">
              <img class="photo-card-img" src="img/p02_success.jpg" alt="">
              <img class="p02-win-robot" src="img/p02_success_robot.png" alt="">
              <p class="photo-card-title">대피 성공!</p>
            </div>
          </div>

          <div class="ox-result-wrong is-avatar is-off" id="p02Wrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="hint-title">힌트</p>
                <p class="avatar-popup-text is-small" id="p02HintText"></p>
              </div>
            </div>
          </div>

          <div class="avatar-modal is-off" id="p02Done">
            <div class="avatar-card">
              <img class="avatar-card-avatar" src="../../resources/img/common/avatar_finish.png" alt="">
              <div class="step-flow">
                <div class="step-panel">
                  <div class="avatar-card-body">
                    <p class="avatar-card-title">정말 잘했어요!</p>
                    <p class="avatar-card-text">파도의 높이와 간격을 정확하게 분석해서<br>시민들을 안전하게 지켜냈어요.</p>
                  </div>
                  <a href="page03.html" class="js-nav-effect avatar-card-btn card-btn is-popup js-sfx is-arrow" data-sound="sound/click.mp3">→</a>
                </div>
                <div class="step-panel">
                  <div class="avatar-card-body is-side">
                    <p class="avatar-card-text">신기하게도, 우리가 귀로 듣는 소리도<br>마이크를 통과하면 바다의 파도 모양처럼 바뀌어요!</p>
                  </div>
                  <a href="page03.html" class="js-nav-effect avatar-card-btn card-btn is-popup js-sfx is-arrow" data-sound="sound/click.mp3">→</a>
                </div>
                <div class="step-panel">
                  <div class="avatar-card-body is-side">
                    <p class="avatar-card-text">컴퓨터와 AI가 소리 파도를<br>어떻게 분석하는지 알아볼까요?</p>
                  </div>
                  <a href="page03.html" class="js-nav-effect avatar-card-btn card-btn next-btn is-popup js-sfx" data-sound="sound/click.mp3">다음</a>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="SOS! 파도를 분석하라!" data-next="page03.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  (function () {
    // 높이 high/low × 간격 wide/narrow. amp·cycles는 모니터 그림용
    const WAVES = shuffleArray([
      { height: 'high', gap: 'wide', amp: 0.75, cycles: 1.6 },
      { height: 'high', gap: 'narrow', amp: 0.75, cycles: 5.5 },
      { height: 'low', gap: 'wide', amp: 0.2, cycles: 1.6 },
      { height: 'low', gap: 'narrow', amp: 0.2, cycles: 5.5 }
    ]);
    const W = 1126;
    const H = 586;
    // 가로로 물결 한 개 더 그려 두고 그만큼 흘려서 끊김 없이 반복. 가운데 점선 기준선은 흐르지 않게 따로
    function seaSvg(amp, cycles) {
      const total = W + W / cycles;
      const mid = H / 2;
      const a = amp * (H / 2 - 12);
      let d = 'M0 ' + mid;
      for (let x = 2; x <= total; x += 2) d += ' L' + x + ' ' + (mid - a * Math.sin((x / W) * cycles * 2 * Math.PI)).toFixed(1);
      return '<svg viewBox="0 0 ' + total + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
        '<path d="' + d + '" fill="none" stroke="#2f6fed" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }

    const horn = $('p02Horn');
    const lives = Array.from(document.querySelectorAll('#p02Lives i'));
    const beep = new Audio('sound/p02_beep.mp3');
    let waveSound = null;
    let round = 0;
    const picked = {};

    function show() {
      const w = WAVES[round];
      if (waveSound) waveSound.pause();
      waveSound = new Audio('sound/p02_wave_' + w.height + '_' + w.gap + '.mp3');
      waveSound.play().catch(() => {});
      // 가로로 물결 한 개 더 그려 두고 그만큼 왼쪽으로 흘려서 끊김 없이 반복
      $('p02Sea').innerHTML = seaSvg(w.amp, w.cycles);
      const el = $('p02Sea').querySelector('svg');
      el.style.width = (W + W / w.cycles) + 'px';
      el.style.setProperty('--shift', (-W / w.cycles) + 'px');
      el.style.animationDuration = (w.gap === 'narrow' ? 1.2 : 2.6) + 's';
      document.querySelectorAll('.p02-opt').forEach((b) => b.classList.remove('is-selected'));
      delete picked.height;
      delete picked.gap;
      horn.disabled = true;
    }

    // 높이(높아요/낮아요)·간격(넓어요/좁아요) 짝끼리 하나만 선택
    const opts = Array.from(document.querySelectorAll('.p02-opt'));
    opts.forEach((btn) => {
      btn.addEventListener('click', () => {
        opts.filter((b) => b.dataset.group === btn.dataset.group).forEach((b) => b.classList.toggle('is-selected', b === btn));
        picked[btn.dataset.group] = btn.dataset.val;
        horn.disabled = !(picked.height && picked.gap);
      });
    });

    horn.addEventListener('click', () => {
      if (waveSound) waveSound.pause();
      horn.disabled = true;
      beep.currentTime = 0;
      beep.play().catch(() => {});
      const w = WAVES[round];
      setTimeout(() => {
        if (picked.height !== w.height || picked.gap !== w.gap) {
          playWrong();
          const hHint = picked.height !== w.height, gHint = picked.gap !== w.gap;
          $('p02HintText').textContent = hHint && gHint ? '파도의 높이와 간격을 각각 다시 살펴보세요.' : hHint ? '파도가 위 아래로 얼마나 높은지 다시 살펴보세요.' : '파도 사이가 넓은지 촘촘한지 다시 살펴보세요.';
          flashLayer($('p02Wrong'));
          horn.disabled = false;
          return;
        }
        playCorrect();
        lives[round].classList.add('is-on');
        $('p02Right').classList.remove('is-off');
        setTimeout(() => {
          $('p02Right').classList.add('is-off');
          round += 1;
          if (round >= WAVES.length) {
            $('p02Done').classList.remove('is-off');
            return;
          }
          show();
        }, 2000);
      }, 500);
    });

    show();
  })();
  </script>
</body>
</html>
