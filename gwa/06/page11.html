<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이크가 듣는 소리파도를 해석하라!</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        .p11-bg{background:url(img/p11_bg.jpg) center bottom / cover no-repeat}
        .p11-step{width:1500px}
        .p11-step>i{width:340px}
        .p11-step>span{justify-content:center;padding:8px 20px 0;white-space:nowrap}
        .p11-graph{position:absolute;left:560px;top:155px;width:800px;height:130px;box-sizing:border-box;border:solid 8px var(--c-ink);border-radius:24px;background:var(--c-white)}
        .p11-graph svg{width:100%;height:100%;display:block}
        .p11-graph.is-off{display:none}

        .p11-doors{position:absolute;left:0;top:320px;width:1920px;display:flex;justify-content:center;gap:120px;perspective:1400px}
        .p11-door{position:relative;width:380px;height:580px;padding:0;border:0;background:#3b2414;border-radius:190px 190px 10px 10px;cursor:pointer;perspective:1400px;isolation:isolate}
        .p11-door:after{content:'';position:absolute;z-index:1;left:-24px;right:-24px;top:-24px;bottom:0;border-radius:214px 214px 0 0;background:url(img/p11_door_frame.svg) center / 100% 100% no-repeat;transition:box-shadow .2s;pointer-events:none}
        .p11-door:hover:after{box-shadow:0 0 0 10px var(--c-yellow)}
        .p11-leaf{position:absolute;z-index:2;inset:0;border-radius:190px 190px 10px 10px;background:url(img/p11_door.svg) center / 100% 100% no-repeat;transform-origin:left center;transition:transform 1s ease;
          display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
        .p11-door.is-open .p11-leaf{transform:rotateY(-105deg)}
        .p11-leaf > *{backface-visibility:hidden;transition:opacity .3s .35s}
        .p11-door.is-open .p11-leaf > *{opacity:0}
        .p11-door.is-open{background:#171617}
        .p11-plate{width:300px;height:200px;box-sizing:border-box;padding:12px;border:solid 6px var(--c-ink);border-radius:20px;background:var(--c-white)}
        .p11-plate svg{width:100%;height:100%;display:block}
        .p11-plate.is-pic{padding:0;overflow:hidden;background:var(--c-mist) center / cover no-repeat}
        .p11-sound{width:110px;height:110px;border:solid 6px var(--c-blue);border-radius:50%;background:var(--c-white);color:var(--c-ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
        .p11-sound svg{width:64px;height:64px;fill:currentColor;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
        .p11-sound:hover{background:#fff3c9}
        .p11-sound:disabled{opacity:.5;cursor:default}
        .p11-doors.is-locked{pointer-events:none}
        .p11-tbox{position:absolute;left:30px;bottom:30px;width:320px;-webkit-mask-image:radial-gradient(ellipse 65% 65% at center,#000 75%,transparent 100%);mask-image:radial-gradient(ellipse 65% 65% at center,#000 75%,transparent 100%);opacity:0;transform:scale(.3);transform-origin:center bottom;transition:opacity .3s,transform .6s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
        .p11-door.is-found .p11-tbox{opacity:1;transform:scale(1)}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default p11-bg">
          <p class="ask-pill has-stage p11-step"><i id="p11Round"></i><span id="p11Q"></span></p>
          <div class="p11-graph is-off" id="p11Graph"></div>
          <div class="p11-doors" id="p11Doors"></div>

          <div class="ox-result-wrong is-avatar is-off" id="p11Wrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="hint-title">힌트</p>
                <p class="avatar-popup-text is-small" id="p11HintText">파도의 높이가 높을수록 큰 소리,<br>간격이 촘촘할수록 높은 소리가 나요.</p>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="마이크가 듣는 소리파도를 해석하라!" data-next="page12.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  (function () {
    // wave: 문에 붙이는 음파([높이, 촘촘함]), pic/sound: 3~5라운드 문 그림·소리. graph: 3~5라운드 위쪽 음파
    const ROUNDS = [
      { q: '가장 높은 소리는 무엇일까요?', doors: [
        { wave: [0.6, 1.5] }, { wave: [0.6, 8], right: true }, { wave: [0.6, 4] }] },
      { q: '가장 작은 소리는 무엇일까요?', doors: [
        { wave: [0.5, 4] }, { wave: [0.15, 4], right: true }, { wave: [0.95, 4] }] },
      { q: '이 음파 그래프는 어떤 소리일까요?', graph: [0.9, 9], doors: [
        { key: 'bird' }, { key: 'siren', right: true }, { key: 'bell' }] },
      { q: '이 음파 그래프는 어떤 소리일까요?', graph: [0.18, 2], doors: [
        { key: 'whisper', right: true }, { key: 'drum' }, { key: 'alarm' }] },
      { q: '이 음파 그래프는 어떤 소리일까요?', graph: [0.18, 9], doors: [
        { key: 'question', sound: 'mosquito', right: true }, { key: 'question', sound: 'thunder' }, { key: 'question', sound: 'tiger' }] }
    ];

    const doorsBox = $('p11Doors');
    let round = 0;
    let voice = null;
    let activeSound = null;
    // 다른 소리를 켜거나 문을 고르면 재생 중인 소리를 멈추고, 눌려 있던 소리 아이콘도 다시 켜 줌
    function stopVoice() {
      if (voice) { voice.pause(); voice = null; }
      if (activeSound) { delete activeSound.dataset.busy; activeSound.style.opacity = ''; activeSound = null; }
    }

    function show() {
      const r = ROUNDS[round];
      $('p11Round').textContent = (round + 1) + '라운드';
      $('p11Q').textContent = r.q;
      $('p11Graph').classList.toggle('is-off', !r.graph);
      if (r.graph) $('p11Graph').innerHTML = waveSvg(r.graph[0], r.graph[1], { width: 780, height: 150, stroke: 6, axis: true });
      doorsBox.className = 'p11-doors';
      doorsBox.innerHTML = '';
      shuffleArray(r.doors).forEach((d) => {
        const door = document.createElement('button');
        door.className = 'p11-door';
        let inner;
        if (d.wave) {
          inner = '<span class="p11-plate">' + waveSvg(d.wave[0], d.wave[1], { width: 276, height: 176, stroke: 5, axis: true }) + '</span>';
        } else {
          inner = '<span class="p11-plate is-pic" style="background-image:url(\'img/p11_' + d.key + '.jpg\')"></span>' +
            '<span class="p11-sound" role="button" aria-label="소리 듣기"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" fill="none"/></svg></span>';
        }
        door.innerHTML = (d.right ? '<img class="p11-tbox" src="img/p11_treasure.png" alt="보물 상자">' : '') + '<span class="p11-leaf">' + inner + '</span>';
        const sound = door.querySelector('.p11-sound');
        if (sound) {
          sound.addEventListener('click', (e) => {
            e.stopPropagation();
            if (sound.dataset.busy) return;
            stopVoice();
            activeSound = sound;
            sound.dataset.busy = '1';
            sound.style.opacity = '.5';
            const key = d.sound || d.key;
            voice = new Audio('sound/p11_' + key + '.mp3');
            const done = () => {
              delete sound.dataset.busy;
              sound.style.opacity = '';
              if (activeSound === sound) activeSound = null;
            };
            voice.addEventListener('ended', done);
            voice.addEventListener('error', done);
            voice.play().catch(done);
          });
        }
        door.addEventListener('click', () => pick(door, d.right));
        doorsBox.appendChild(door);
      });
    }

    function pick(door, right) {
      if (!right) {
        playWrong();
        flashLayer($('p11Wrong'));
        return;
      }
      stopVoice();
      doorsBox.classList.add('is-locked');
      door.classList.add('is-open');
      makeSfx('sound/p11_door.mp3', true)();
      const last = round === ROUNDS.length - 1;
      const steps = new Audio('sound/p11_walk.mp3');
      // 매 라운드: 문 열림 → 발소리가 끝나면 문 안에 보물 상자 + 성공 효과음 → 효과음이 끝나면 다음 라운드(마지막은 다음 페이지). 소리가 안 나도 일정 시간 뒤 진행
      let finished = false;
      const finish = () => {
        if (finished) return;
        finished = true;
        door.classList.add('is-found');
        const success = new Audio('sound/p11_success.mp3');
        let moved = false;
        const next = () => {
          if (moved) return;
          moved = true;
          if (last) {
            navigateTo('page12.html');
            return;
          }
          round += 1;
          show();
        };
        success.addEventListener('ended', () => setTimeout(next, 2000));
        success.addEventListener('error', () => setTimeout(next, 3000));
        success.play().catch(() => setTimeout(next, 3000));
        setTimeout(next, 8000);
      };
      steps.addEventListener('ended', finish);
      steps.addEventListener('error', finish);
      setTimeout(() => steps.play().catch(finish), 800);
      setTimeout(finish, 8000);
    }

    show();
  })();
  </script>
</body>
</html>
