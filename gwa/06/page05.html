<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 집 속 숨은 마이크 찾기</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        .hunt-house{left:292px;top:174px}
        .hunt-obj[data-key="remote"]{left:434px;top:192px}
        .hunt-obj[data-key="speaker"]{left:672px;top:145px}
        .hunt-obj[data-key="intercom"]{left:1084px;top:257px}
        .hunt-obj[data-key="phone"]{left:629px;top:506px}
    </style></head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="stage-board"></div>
          <p class="ask-pill is-fit"><span>마이크가 있는 물건을 찾아 클릭해 보세요.</span></p>
          <img class="hunt-house" src="img/p05_house.png" alt="">
          <button class="hunt-obj" data-key="remote" aria-label="음성 인식 TV 리모컨"><img src="img/p05_obj_remote.png" alt=""></button>
          <button class="hunt-obj" data-key="speaker" aria-label="AI 스마트 스피커"><img src="img/p05_obj_speaker.png" alt=""></button>
          <button class="hunt-obj" data-key="intercom" aria-label="인터폰"><img src="img/p05_obj_intercom.png" alt=""></button>
          <button class="hunt-obj" data-key="phone" aria-label="스마트폰"><img src="img/p05_obj_phone.png" alt=""></button>

          <div class="avatar-modal hunt-modal is-off" id="p05Info">
            <div class="avatar-card is-left">
              <img class="avatar-card-avatar" src="../../resources/img/common/avatar_finish.png" alt="">
              <div class="avatar-card-body">
                <div>
                  <p class="avatar-card-title" id="p05Title"></p>
                  <p class="avatar-card-text" id="p05Text"></p>
                  <a href="javascript:;" class="avatar-card-btn card-btn is-popup next-btn js-sfx" id="p05Next" data-sound="sound/click.mp3">다음</a>
                </div>
              </div>
            </div>
          </div>

          <div class="avatar-modal is-off" id="p05Done">
            <div class="avatar-card is-left">
              <img class="avatar-card-avatar" src="../../resources/img/common/avatar_finish.png" alt="">
              <div class="avatar-card-body">
                <div class="step-flow">
                  <div class="step-panel is-title">
                    <p class="avatar-card-text">집 안 곳곳에서 마이크가 달린<br>물건을 모두 찾았어요.</p>
                    <a href="page06.html" class="js-nav-effect avatar-card-btn card-btn is-popup js-sfx is-arrow" data-sound="sound/click.mp3">→</a>
                  </div>
                  <div class="step-panel">
                    <p class="avatar-card-text">마이크로 들어온 소리를 컴퓨터는<br>어떻게 알아듣는지 살펴볼까요?</p>
                    <a href="page06.html" class="js-nav-effect avatar-card-btn card-btn is-popup next-btn js-sfx" data-sound="sound/click.mp3">다음</a>
                  </div>
                </div>
              </div>
            </div>
          </div>        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="우리 집 속 숨은 마이크 찾기" data-next="page06.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  (function () {
    const INFO = {
      speaker: ['스마트 스피커', '마이크로 사람의 목소리를 듣고 음악을 틀거나 집 안 가전을 제어해요.'],
      remote: ['음성 인식 TV 리모컨', '마이크에 말하는 음성을 들어 원하는 채널이나 영상을 찾아줘요.'],
      phone: ['스마트폰', '마이크로 목소리를 입력 받아 전화 통화를 하거나 음성 명령을 실행해요.'],
      intercom: ['인터폰', '방문객의 목소리를 마이크로 전달하거나, 등록된 목소리를 인식해 문을 열어줘요.']
    };
    const objs = Array.from(document.querySelectorAll('.hunt-obj'));
    let found = 0;
    objs.forEach((o) => o.addEventListener('click', () => {
      if (o.classList.contains('is-found')) return;
      playClick();
      o.classList.add('is-found');
      found += 1;
      $('p05Title').textContent = INFO[o.dataset.key][0];
      $('p05Text').textContent = INFO[o.dataset.key][1];
      $('p05Info').classList.remove('is-off');
    }));
    $('p05Next').addEventListener('click', () => {
      $('p05Info').classList.add('is-off');
      if (found === objs.length) $('p05Done').classList.remove('is-off');
    });
  })();
  </script></body>
</html>
