<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>차례대로 맞추는 몸속 퍼즐 게임</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        .p02-gauge{left:62px;top:36px;width:757px;z-index:5}

        main.bg-default{background:#bfe0f7 url('img/p02_bg_full.jpg') center top / cover no-repeat}
        .p02-panel{position:absolute;inset:0;overflow:hidden}
        .p02-body{position:absolute;inset:0}
        .p02-zone{position:absolute;box-sizing:border-box;border:dashed 5px var(--c-purple);border-radius:22px;background:rgba(72,21,156,.12);transition:all .4s;
          display:flex;align-items:center;justify-content:center;font-family:'Cafe24 Ssurround';font-size:36px;color:rgba(72,21,156,.45)}
        .p02-zone[data-key="mouth"]{left:888px;top:288px;width:82px;height:56px;border-color:#e6a800;background:rgba(255,191,11,.28)}
        .p02-zone[data-key="stomach"]{left:938px;top:452px;width:88px;height:82px;border-color:#3362ec;background:rgba(105,156,255,.28)}
        .p02-zone[data-key="intestine"]{left:888px;top:536px;width:150px;height:136px;border-color:#ea4828;background:rgba(255,129,89,.28)}
        .p02-zone.is-done{border-color:#2fbf71;border-style:solid;background:rgba(47,191,113,.3);color:#1f9d5a;box-shadow:0 0 30px 8px rgba(47,191,113,.65)}
        .p02-zone .p02-piece{display:none}

        .p02-tray{position:absolute;left:1390px;top:117px;width:450px;height:554px;box-sizing:border-box;border-radius:30px;background:rgba(255,255,255,.65);border:solid 4px rgba(255,255,255,.9)}
        .p02-piece{position:absolute;left:55px;width:340px;height:150px;display:flex;align-items:center;justify-content:center;gap:18px;padding-top:4px;cursor:grab;touch-action:none;font-family:'Cafe24 Ssurround';font-size:60px;color:#141539;-webkit-text-stroke:8px #ffffff;paint-order:stroke fill;filter:drop-shadow(0 6px 0 rgba(20,21,57,.16))}
        .p02-piece .pz-svg{position:absolute;left:0;top:0;width:340px;height:178px;transform-origin:170px 75px;transition:transform .15s ease;pointer-events:none;z-index:0}
        .p02-piece-in{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:18px;transition:transform .15s ease;pointer-events:none}
        .p02-piece-img{width:80px;height:80px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.15))}
        .p02-piece[data-key="mouth"]{top:52px;z-index:9}
        .p02-piece[data-key="stomach"]{top:202px;z-index:8}
        .p02-piece[data-key="intestine"]{top:352px;z-index:7}
        .p02-piece.is-dragging{cursor:grabbing;z-index:60;filter:drop-shadow(0 14px 12px rgba(20,21,57,.28))}
        .p02-piece.is-dragging .pz-svg,.p02-piece.is-dragging .p02-piece-in{transform:scale(.75)}
        .p02-piece.is-picked{filter:drop-shadow(0 0 10px rgba(255,216,61,.95)) drop-shadow(0 6px 0 rgba(20,21,57,.16))}
        .p02-piece.is-wrong{animation:fix-word-shake .3s ease}
        .p02-zone.is-pickable{cursor:pointer;box-shadow:0 0 0 6px rgba(255,216,61,.9)}
        .p02-order.is-hint{color:#d6336c}

        .p02-icon{position:absolute;left:40px;top:710px;width:236px;height:236px;box-sizing:border-box;border-radius:50%;border:solid 6px var(--c-purple);background:var(--c-purple) url('img/p02_aro_face.png') center bottom / contain no-repeat;box-shadow:0 12px 0 0 rgba(72,21,156,.18);z-index:1}
        .p02-order{position:absolute;left:175px;top:755px;width:1210px;height:156px;box-sizing:border-box;padding:0 40px 0 120px;display:flex;align-items:center;margin:0;
          background:var(--c-white);border:solid 6px var(--c-purple);border-radius:78px;box-shadow:0 12px 0 0 rgba(72,21,156,.18);
          font-family:'Cafe24 Ssurround';font-size:46px;line-height:1.15;color:var(--c-purple);letter-spacing:-0.05em;word-break:keep-all;text-align:left}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="gauge p02-gauge"><div class="gauge-fill" id="p02Fill"></div></div>

          <div class="p02-panel">
            <div class="p02-body" id="p02Body">
              <div class="p02-zone" data-key="mouth"></div>
              <div class="p02-zone" data-key="stomach"></div>
              <div class="p02-zone" data-key="intestine"></div>
            </div>
            <div class="p02-tray" id="p02Tray"></div>
          </div>

          <div class="p02-icon"></div>
          <p class="p02-order" id="p02Ask"><span id="p02AskText"></span></p>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="차례대로 맞추는 몸속 퍼즐 게임" data-next="page03.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  (function () {
    const STEPS = [
      { key: 'mouth', name: '입', ask: '음식이 가장 먼저 들어가는 곳은 어디일까?', hint: '음식은 가장 먼저 입으로 들어가요. 입 퍼즐을 찾아볼까요?', gauge: 30 },
      { key: 'stomach', name: '위', ask: '입에서 잘게 씹은 음식은 다음으로 어디에 도착할까?', hint: '입 다음에 음식이 도착하는 곳을 다시 찾아보세요!', gauge: 60 },
      { key: 'intestine', name: '장', ask: '위를 지난 음식은 마지막으로 어디로 이동할까?', hint: '음식은 입과 위를 지나 장으로 이동해요. 장 퍼즐을 찾아볼까요?', gauge: 100 }
    ];
    let step = 0;
    let picked = null;

    const ask = $('p02Ask');
    const showAsk = (text, isHint) => { $('p02AskText').textContent = text; ask.classList.toggle('is-hint', !!isHint); };

    const PZ_OPTS = {
      w: 340, h: 178,
      path: 'M 22,4 L 150,4 A 20,20 0 0,0 190,4 L 318,4 Q 336,4 336,22 L 336,61 A 18,18 0 0,0 336,97 L 336,136 Q 336,154 318,154 L 190,154 A 20,20 0 0,1 150,154 L 22,154 Q 4,154 4,136 L 4,97 A 18,18 0 0,0 4,61 L 4,22 Q 4,4 22,4 Z'
    };
    const THEMES = { mouth: PUZZLE_THEMES.yellow, stomach: PUZZLE_THEMES.blue, intestine: PUZZLE_THEMES.coral };

    const tray = $('p02Tray');
    const cards = STEPS.map((s) => {
      const c = document.createElement('div');
      c.className = 'p02-piece';
      c.dataset.key = s.key;
      c.appendChild(makePuzzleSvg('pz_' + s.key, THEMES[s.key], PZ_OPTS));
      c.insertAdjacentHTML('beforeend', '<div class="p02-piece-in"><img class="p02-piece-img" src="img/p15_' + s.key + '.png" alt=""><span>' + s.name + '</span></div>');
      tray.appendChild(c);
      return c;
    });
    const zones = Array.from(document.querySelectorAll('.p02-zone'));

    const isRight = (card, zone) => card.dataset.key === zone.dataset.key && card.dataset.key === STEPS[step].key;
    function right(card, zone) {
      zone.classList.add('is-done');
      $('p02Fill').style.width = STEPS[step].gauge + '%';
      step += 1;
      if (step >= STEPS.length) {
        setTimeout(() => { playCorrect(); }, 300);
        setTimeout(() => navigateTo('page03.html'), 1800);
        return;
      }
      showAsk(STEPS[step].ask);
    }
    function wrong(card) {
      playWrong();
      restartAnim(card, 'is-wrong');
      showAsk(STEPS[step].hint, true);
    }

    /* 끌어 놓기(기획서 3p: 퍼즐을 알맞은 곳으로 드래그 앤 드롭) */
    initMatchDrag({ cards, zones, slop: 75, match: isRight, onRight: right, onWrong: wrong });

    /* 조각을 누르면 고른 표시, 이어서 칸을 누르면 그 칸에 놓기(터치로 쉽게 고를 수 있게) */
    cards.forEach((card) => {
      let moved = false;
      let sx = 0;
      let sy = 0;
      card.addEventListener('pointerdown', (e) => { moved = false; sx = e.clientX; sy = e.clientY; });
      card.addEventListener('pointermove', (e) => { if (Math.hypot(e.clientX - sx, e.clientY - sy) > 8) moved = true; });
      card.addEventListener('click', () => {
        if (moved || card.dataset.placed) return;
        playClick();
        if (picked) picked.classList.remove('is-picked');
        picked = picked === card ? null : card;
        if (picked) picked.classList.add('is-picked');
        zones.forEach((z) => z.classList.toggle('is-pickable', !!picked && !z.dataset.filled));
      });
    });
    zones.forEach((zone) => zone.addEventListener('click', () => {
      if (!picked || zone.dataset.filled) return;
      const card = picked;
      picked.classList.remove('is-picked');
      picked = null;
      zones.forEach((z) => z.classList.remove('is-pickable'));
      if (isRight(card, zone)) {
        card.dataset.placed = '1';
        zone.dataset.filled = '1';
        zone.appendChild(card);
        playDrag();
        right(card, zone);
      } else {
        wrong(card);
      }
    }));

    showAsk(STEPS[0].ask);
  })();
  </script>
</body>
</html>
