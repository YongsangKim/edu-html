<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>블록 코딩 순서대로 캐릭터 움직이기</title>
    <link rel="stylesheet" href="../../resources/css/common.css">
    <style>
        /* 기획서 38p 게임 전 안내: 왼쪽 아로(로봇) 위 말풍선에 안내 문구 + [배달 시작] 버튼, 오른쪽 3×3 격자 바닥판에는 하트 선물상자만 놓여 있음 → page18.
           아로(로봇) img/p_character_main.png(8차시 메인 캐릭터), 선물상자 img/p17_gift.svg */
        .gm-bubble{left:90px;top:120px;bottom:auto;width:790px;padding:40px 40px 44px;display:flex;flex-direction:column;align-items:center;gap:30px;font-size:56px;line-height:1.3}
        .gm-bubble::before{left:310px}
        .gm-bubble .card-btn{min-width:0;width:300px;padding-left:20px;padding-right:20px;white-space:nowrap;position:relative;left:205px}
        .gm-robot{left:230px;top:530px;width:420px;height:410px}

        .gm-floor{position:absolute;left:1060px;top:140px;width:680px;height:680px;box-sizing:border-box;padding:16px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:16px;
          background:#9eadc7;border-radius:28px;box-shadow:0 14px 0 0 #7d8dad}
        .gm-cell{position:relative;display:flex;align-items:center;justify-content:center;border-radius:22px;background:#f4f0e4;box-shadow:inset 0 -6px 0 0 #e3dccb}
        .gm-cell.is-gift{background:#fde8a0;box-shadow:inset 0 -6px 0 0 #f2cf66,0 0 0 6px rgba(255,214,90,.55)}
        .gm-cell img{display:block;width:170px;height:170px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <div class="guide-bubble gm-bubble">
            <p style="margin:0">블록의 순서만 잘 따르면<br>선물 상자까지 갈 수 있겠지?</p>
            <a href="page18.html" class="js-nav-effect card-btn is-popup js-sfx" data-sound="sound/click.mp3">배달 시작</a>
          </div>
          <div class="char-box gm-robot"><img src="img/p_character_main.png" alt="아로"></div>

          <div class="gm-floor">
            <div class="gm-cell"></div><div class="gm-cell"></div><div class="gm-cell"></div>
            <div class="gm-cell"></div><div class="gm-cell"></div><div class="gm-cell is-gift"><img src="img/p17_gift.svg" alt="하트 선물상자"></div>
            <div class="gm-cell"></div><div class="gm-cell"></div><div class="gm-cell"></div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="블록 코딩 순서대로 캐릭터 움직이기" data-next="page18.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
</body>
</html>
