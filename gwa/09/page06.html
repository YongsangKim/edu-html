<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일상생활 속 순차 찾기</title>
  <link rel="stylesheet" href="../../resources/css/common.css">
  <style>
    .so-bubble{left:30px;top:auto;bottom:565px;width:570px;min-height:200px;font-size:38px;line-height:1.3;color:var(--c-purple);font-family:'Cafe24 Ssurround';letter-spacing:-0.05em;word-break:keep-all;text-align:center}
    .so-char{left:30px;top:400px;width:560px;height:540px}
    .so-scene{position:absolute;left:620px;top:30px;width:590px;height:550px;box-sizing:border-box;border:solid 6px var(--c-purple);border-radius:30px;background:var(--c-mist) center / cover no-repeat}
    .so-badge{position:absolute;left:18px;top:14px;width:70px;height:70px;border-radius:50%;background:#e8605f;border:solid 4px var(--c-white);box-sizing:border-box;padding-top:4px;display:flex;align-items:center;justify-content:center;font-family:'Cafe24 Ssurround';font-size:44px;color:var(--c-white);z-index:2}
    .so-badge:empty{display:none}
    .so-board{position:absolute;left:1254px;top:30px;width:636px;height:550px;box-sizing:border-box;padding:28px 23px 0;border-radius:30px;background:var(--c-white);box-shadow:0 10px 0 0 rgba(86,148,231,.2)}
    .so-slots{position:relative;width:590px;display:flex;flex-direction:column}
    .so-slot{position:relative;width:590px;height:118px;box-sizing:border-box}
    .so-slot:nth-child(1){z-index:9}
    .so-slot:nth-child(2){z-index:8}
    .so-slot:nth-child(3){z-index:7}
    .so-slot:nth-child(4){z-index:6}
    .so-slot .pz-svg{position:absolute;left:0;top:0;width:590px;height:146px;pointer-events:none}
    .so-slot.is-over .pz-body{fill:#fff8d6;stroke:var(--c-yellow);stroke-width:7}
    .so-no{position:absolute;left:86px;top:50%;transform:translateY(-44%);font-family:'Cafe24 Ssurround';font-size:36px;color:#7f90b8;white-space:nowrap;pointer-events:none;z-index:2}
    .so-num{position:absolute;left:38px;top:56%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;background:#ffffff;display:flex;align-items:center;justify-content:center;padding-top:4px;box-sizing:border-box;font-family:'Cafe24 Ssurround';font-size:34px;color:#2b6be6;z-index:2;pointer-events:none}
    .so-slot.is-empty .so-num{top:50%;background:rgba(255,255,255,0);color:#7f90b8;font-size:36px;margin-top:2px}
    .so-cards{position:absolute;left:643px;top:620px;width:1224px;display:grid;grid-template-columns:repeat(2,590px);gap:40px 44px}
    .so-cell{height:118px}
    .so-card{position:relative;width:590px;height:118px;box-sizing:border-box;padding:25px 50px 6px 50px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:grab;touch-action:none;font-family:'Cafe24 Ssurround';font-size:34px;line-height:1.15;letter-spacing:-0.04em;word-break:keep-all;color:#141539;-webkit-text-stroke:8px #ffffff;paint-order:stroke fill;filter:drop-shadow(0 6px 0 rgba(20,21,57,.16))}
    .so-card .pz-svg{position:absolute;left:0;top:0;width:590px;height:146px;pointer-events:none;z-index:0}
    .so-card .so-txt{position:relative;z-index:2;pointer-events:none}
    .so-card.is-dragging{cursor:grabbing;z-index:60;filter:drop-shadow(0 14px 12px rgba(20,21,57,.28))}
    .so-card.is-wrong{animation:fix-word-shake .3s ease}
    .so-slot .so-card{position:absolute;left:0;top:0;width:590px;height:118px;padding:25px 50px 6px 110px;justify-content:flex-start;text-align:left;cursor:default;filter:none}
    .so-slot .so-no{display:none}
    .so-slot.is-empty .so-no{display:block}
  </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main class="bg-default">
          <p class="guide-bubble so-bubble is-center" id="soBubble">라면을 완성하려면 어떤 일을 가장 먼저 해야 할까? 라면 끓이는 순서를 1단계부터 4단계까지 차례대로 놓아 보자!</p>
          <div class="char-box so-char"><img src="../img/character/gwa_main.png" alt="메인 캐릭터"></div>

          <div class="so-scene" id="soScene"><span class="so-badge" id="soBadge"></span></div>

          <div class="so-board">
            <div class="so-slots" id="soSlots">
              <div class="so-slot is-empty" data-step="0"><span class="so-num">1</span><span class="so-no">단계</span></div>
              <div class="so-slot is-empty" data-step="1"><span class="so-num">2</span><span class="so-no">단계</span></div>
              <div class="so-slot is-empty" data-step="2"><span class="so-num">3</span><span class="so-no">단계</span></div>
              <div class="so-slot is-empty" data-step="3"><span class="so-num">4</span><span class="so-no">단계</span></div>
            </div>
          </div>

          <div class="so-cards" id="soCards">
            <div class="so-cell"><div class="so-card" data-step="2"><span class="so-txt">스프와 면을 넣고 면이 익을 때까지 끓이기</span></div></div>
            <div class="so-cell"><div class="so-card" data-step="0"><span class="so-txt">냄비에 물 넣고 불 켜기</span></div></div>
            <div class="so-cell"><div class="so-card" data-step="3"><span class="so-txt">불을 끄고 그릇에 담기</span></div></div>
            <div class="so-cell"><div class="so-card" data-step="1"><span class="so-txt">물이 끓을 때까지 기다리기</span></div></div>
          </div>

          <div class="ox-result-wrong is-avatar is-off" id="soWrong">
            <div class="avatar-popup-panel">
              <div class="avatar-popup-avatar"><img src="../../resources/img/common/avatar_incorrect.png" alt=""></div>
              <div class="avatar-popup-body">
                <p class="avatar-popup-text">다시 생각해볼까요?</p>
                <p class="avatar-popup-sub" id="soWrongText"></p>
              </div>
            </div>
          </div>

          <div class="avatar-modal so-modal is-off" id="soDone">
            <div class="avatar-card">
              <img class="avatar-card-avatar" src="../../resources/img/common/avatar_finish.png" alt="">
              <div class="avatar-card-body">
                <div>
                  <div class="step-panel">
                    <p class="avatar-card-title">잘했어요!</p>
                    <p class="avatar-card-text">순서대로 하니까 라면이 맛있게 완성됐어요! 이번에는 양치하기 임무를 해볼까요?</p>
                    <a href="page07.html" class="avatar-card-btn card-btn is-popup js-nav-effect js-sfx" data-sound="sound/click.mp3">다음</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../../resources/js/header.js" data-title="일상생활 속 순차 찾기" data-next="page07.html"></script>
  <script src="../../resources/js/toc-gwa.js"></script>
  <script src="../../resources/js/common.js"></script>
  <script>
  (function () {
    const THEMES = [PUZZLE_THEMES.yellow, PUZZLE_THEMES.blue, PUZZLE_THEMES.coral, PUZZLE_THEMES.green];

    document.querySelectorAll('#soSlots .so-slot').forEach((slot, i) => {
      slot.prepend(makePuzzleSvg('pzs' + i, null));
    });
    document.querySelectorAll('#soCards .so-card').forEach((card) => {
      const step = Number(card.dataset.step);
      card.prepend(makePuzzleSvg('pzc' + step, THEMES[step]));
    });

    const BUBBLES = [
      '라면을 완성하려면 어떤 일을 가장 먼저 해야 할까? 라면 끓이는 순서를 1단계부터 4단계까지 차례대로 놓아 보자!',
      '라면 끓이는 순서대로<br>카드를 놓아 보세요.'
    ];
    const WRONG = [
      '아차! 가장 먼저 냄비에 물을 부어야 해요.',
      '물을 넣은 다음에는 물이 끓을 때까지 기다려야 해요.',
      '물이 끓으면 스프와 면을 냄비에 넣어요.',
      '라면이 다 익으면 마지막으로 그릇에 담아요.'
    ];
    const scene = $('soScene');
    const setScene = (n) => { scene.style.backgroundImage = "url('img/p06_scene_" + n + ".png')"; };
    setScene(0);
    setTimeout(() => { $('soBubble').innerHTML = BUBBLES[1]; }, 5000);

    const snapSfx = makeSfx('sound/9차시_딸각 효과음(엔트리용).mp3', true);
    const zones = Array.from(document.querySelectorAll('#soSlots .so-slot'));
    let step = 0;
    zones[0].classList.add('is-now');

    initMatchDrag({
      cards: Array.from(document.querySelectorAll('#soCards .so-card')),
      zones,
      slop: 40,
      silent: true,
      match: (card, zone) => card.dataset.step === zone.dataset.step && Number(zone.dataset.step) === step,
      onRight: (card, zone) => {
        snapSfx();
        zone.classList.remove('is-now', 'is-empty');
        zone.classList.add('is-filled');
        step += 1;
        setScene(step);
        $('soBadge').textContent = step;
        if (step < zones.length) zones[step].classList.add('is-now');
      },
      onWrong: (card) => {
        playWrong();
        restartAnim(card, 'is-wrong');
        $('soWrongText').textContent = WRONG[step];
        flashLayer($('soWrong'));
      },
      onDone: () => setTimeout(() => $('soDone').classList.remove('is-off'), 900)
    });
  })();
  </script>
</body>
</html>
