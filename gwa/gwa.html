<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과학</title>
    <link rel="stylesheet" href="../css/common.css">
    <style>
        /* 임시 - gwa/img 이미지가 아직 없어 글자 칸으로 둠. 이미지(img/stage_bg_01.png, img/stage_01_item_0N(_over).png)가 나오면
           sa/sa.html처럼 배경 + 5단원 버튼 이미지(3+2 벌집 배치) 방식으로 교체 */
        main{position:absolute;left:0;top:120px;width:1920px;height:960px;background:#dbe9f7}
        .gwa-units{position:absolute;left:0;top:90px;width:100%;display:flex;flex-wrap:wrap;justify-content:center;gap:40px 40px;padding:0 240px;box-sizing:border-box}
        .gwa-unit{width:420px;height:360px;border-radius:20px;background:#4a90d9;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px;box-sizing:border-box;cursor:pointer;word-break:keep-all}
        .gwa-unit:hover{background:#3a7bc0}
        .gwa-unit .num{font-size:40px;font-weight:bold;margin-bottom:16px}
        .gwa-unit .name{font-size:30px;font-weight:bold;line-height:1.4}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main>
          <div class="gwa-units">
            <a href="gate01.html" class="gwa-unit js-nav-effect js-sfx" data-sound="sound/click.mp3"><div class="num">1단원</div><div class="name">1~3차시</div></a>
            <a href="gate02.html" class="gwa-unit js-nav-effect js-sfx" data-sound="sound/click.mp3"><div class="num">2단원</div><div class="name">4~6차시</div></a>
            <a href="gate03.html" class="gwa-unit js-nav-effect js-sfx" data-sound="sound/click.mp3"><div class="num">3단원</div><div class="name">7~9차시</div></a>
            <a href="gate04.html" class="gwa-unit js-nav-effect js-sfx" data-sound="sound/click.mp3"><div class="num">4단원</div><div class="name">10~12차시</div></a>
            <a href="gate05.html" class="gwa-unit js-nav-effect js-sfx" data-sound="sound/click.mp3"><div class="num">5단원</div><div class="name">13~15차시</div></a>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../js/header.js" data-title="목차"></script>
  <script src="../js/toc-gwa.js"></script>
  <script src="../js/common.js"></script>
</body>
</html>
