<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>목차</title>
    <link rel="stylesheet" href="../resources/css/common.css">
    <style>
        main{position:absolute;left:0;top:120px;width:1920px;height:960px;background:url('img/gwa_bg.png') no-repeat;overflow:hidden}
        .gwa-units{position:absolute;inset:0}
        .gwa-unit{position:absolute;width:570px;height:500px;display:block;cursor:pointer}
        .gwa-unit:nth-child(1){left:32px;top:374px}
        .gwa-unit:nth-child(2){left:460px;top:119px}
        .gwa-unit:nth-child(3){left:889px;top:374px}
        .gwa-unit:nth-child(4){left:1318px;top:119px}
        .gwa-unit img{width:570px;height:500px;display:block;pointer-events:auto}
        .gwa-robot{position:absolute;pointer-events:none;z-index:5}
        .gwa-robot-01{left:-12px;top:127px;width:282px;height:347px}
        .gwa-robot-02{left:611px;top:574px;width:315px;height:338px}
        .gwa-robot-03{left:1061px;top:76px;width:269px;height:354px}
        .gwa-robot-04{left:1546px;top:566px;width:307px;height:341px}
    </style>
</head>
<body>
  <div id="page-fade"></div>
  <div id="viewport" class="viewport">
    <div id="stage-spacer">
      <div id="stage" class="stage">
        <main>
          <img src="img/character/gwa_unit_robot_01.png" alt="" class="gwa-robot gwa-robot-01">
          <img src="img/character/gwa_unit_robot_02.png" alt="" class="gwa-robot gwa-robot-02">
          <img src="img/character/gwa_unit_robot_03.png" alt="" class="gwa-robot gwa-robot-03">
          <img src="img/character/gwa_unit_robot_04.png" alt="" class="gwa-robot gwa-robot-04">

          <div class="gwa-units">
            <a href="gate01.html" class="gwa-unit js-nav-effect">
              <img src="img/gwa_item_01.png" data-src-alt="img/gwa_item_01_on.png" data-src-over="img/gwa_item_01_over.png" data-sound="sound/click.mp3" class="js-img-swap js-sfx" alt="1단원 날씨로 배우는 데이터">
            </a>
            <a href="gate02.html" class="gwa-unit js-nav-effect">
              <img src="img/gwa_item_02.png" data-src-alt="img/gwa_item_02_on.png" data-src-over="img/gwa_item_02_over.png" data-sound="sound/click.mp3" class="js-img-swap js-sfx" alt="2단원 AI의 감각기관과 스마트한 세상">
            </a>
            <a href="gate03.html" class="gwa-unit js-nav-effect">
              <img src="img/gwa_item_03.png" data-src-alt="img/gwa_item_03_on.png" data-src-over="img/gwa_item_03_over.png" data-sound="sound/click.mp3" class="js-img-swap js-sfx" alt="3단원 우리 몸과 알고리즘">
            </a>
            <a href="gate04.html" class="gwa-unit js-nav-effect">
              <img src="img/gwa_item_04.png" data-src-alt="img/gwa_item_04_on.png" data-src-over="img/gwa_item_04_over.png" data-sound="sound/click.mp3" class="js-img-swap js-sfx" alt="4단원 AI로 여는 물질의 비밀">
            </a>
          </div>
        </main>
      </div>
    </div>
  </div>
  <div class="zoom-info" id="zoomInfo"></div>

  <script src="../resources/js/header.js" data-title="목차" data-no-next></script>
  <script src="../resources/js/toc-gwa.js"></script>
  <script src="../resources/js/common.js"></script>

</html>
